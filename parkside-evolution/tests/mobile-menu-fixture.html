<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile production menu fixture</title></head><body><p id="loading">Loading production menus…</p><script type="module">
import {createShopEconomy} from '../shop-economy.js?v=street-20';
import {createScratchUI} from '../scratch-ui.js?v=mobile-21';
import {createCasinoUI} from '../casino-ui.js?v=mobile-21';
import {installTouchGuard} from '../touch-guard.js?v=mobile-21';
const markup=new DOMParser().parseFromString(await (await fetch('../index.html?v=mobile-21')).text(),'text/html');
for(const node of markup.head.querySelectorAll('style,link[rel="stylesheet"]')){const copy=node.cloneNode(true);document.head.append(copy);}
// Stylesheet URL is relative to the entry page rather than this tests directory.
document.head.querySelector('link[rel="stylesheet"]').href='../game-ui.css?v=mobile-21';
document.body.replaceChildren(...['shopPanel','casinoPanel'].map(id=>markup.getElementById(id).cloneNode(true)));document.body.className='playing on-foot menu-open';
const memory=new Map(),economy=createShopEconomy({getItem:k=>memory.get(k),setItem:(k,v)=>memory.set(k,v)});economy.earn(900);
const cash=()=>document.getElementById('shopCash').textContent='$'+economy.info().cash;
const close=()=>{scratch.flush();casino.hide();document.getElementById('shopPanel').hidden=true;document.body.classList.remove('menu-open');const b=document.createElement('button');b.textContent='Reopen menu';b.style.cssText='margin:20px;padding:12px';b.onclick=()=>{b.remove();open();};document.body.append(b);};
const scratch=createScratchUI(economy,()=>{},cash),casino=createCasinoUI(economy,close);installTouchGuard();
document.getElementById('closeShop').onclick=document.getElementById('shopClose').onclick=close;
function open(){document.body.classList.add('menu-open');if(new URLSearchParams(location.search).get('menu')==='casino')casino.open('slots');else{document.getElementById('shopPanel').hidden=false;scratch.render();cash();}}
window.addEventListener('keydown',e=>{if(e.code==='Escape')close();});open();
</script></body></html>
