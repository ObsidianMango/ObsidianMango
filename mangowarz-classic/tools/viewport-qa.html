<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MangoWarz viewport QA</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b18;color:#fff;font:14px system-ui,sans-serif}body{display:grid;place-items:start center}.frame{position:relative;background:#111;border:2px solid #ff9d21}.label{position:fixed;z-index:2;right:8px;top:8px;padding:5px 8px;border-radius:999px;background:#090b18;color:#ffcf76;font-weight:800;box-shadow:0 2px 12px #000}iframe{display:block;border:0;background:#090b18}
  </style>
</head>
<body>
  <div class="label" id="label"></div>
  <div class="frame"><iframe id="game" title="MangoWarz responsive QA frame" src="../index.html"></iframe></div>
  <script>
    const params=new URLSearchParams(location.search);
    const width=Math.max(320,Number(params.get('w'))||390);
    const height=Math.max(568,Number(params.get('h'))||844);
    const textScale=Math.max(1,Math.min(2,Number(params.get('text'))||1));
    const frame=document.getElementById('game');
    frame.style.width=`${width}px`;frame.style.height=`${height}px`;
    frame.addEventListener('load',()=>{if(textScale>1)frame.contentDocument.documentElement.style.fontSize=`${textScale*100}%`;});
    document.getElementById('label').textContent=`${width} × ${height}${textScale>1?' • 200% text':''}`;
  </script>
</body>
</html>
