<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="MangoWarz Classic: a faithful 1985-style 30-day neighborhood trading game.">
  <meta property="og:title" content="MangoWarz Classic">
  <meta property="og:description" content="Travel, trade, survive, and settle the debt by Day 30.">
  <meta property="og:url" content="https://obsidianmango.github.io/ObsidianMango/mangowarz-classic/">
  <meta property="og:image" content="https://obsidianmango.github.io/ObsidianMango/mangowarz-classic/assets/branding/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>MangoWarz Classic</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/branding/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/branding/icon-192.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/polish.css?v=8">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/crowd.css">
  <link rel="stylesheet" href="css/classic.css?v=3">
</head>
<body>
  <a class="skip-link" href="#game-main">Skip to game</a>
  <div id="app" class="app-shell">
    <header id="app-header" class="app-header" hidden>
      <button id="brand-home" class="brand-button" type="button" aria-label="Save and return to title">
        <span><b>MANGOWARZ CLASSIC</b></span>
      </button>
      <div id="day-location" class="day-location"></div>
    </header>
    <section id="status-strip" class="status-strip" aria-label="Game status" hidden></section>
    <main id="game-main" tabindex="-1"></main>
    <nav id="action-bar" class="action-bar" aria-label="Game actions" hidden></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-hidden="true"></div>
  <div id="polite-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="assertive-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <noscript><div class="noscript">MangoWarz Classic needs JavaScript enabled to play.</div></noscript>
  <script type="module" src="js/main.js?v=12"></script>
</body>
</html>
