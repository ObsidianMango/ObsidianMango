<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VITAL//CORE — Health Counter</title>
<style>
:root{
  --bg:#07080d; --panel:#0d1018; --panel2:#141927; --line:#262d40;
  --text:#f7f8ff; --muted:#838ca8; --good:#56ffa5; --bad:#ff556d;
  --accent:#66e3ff; --safe-top:max(10px,env(safe-area-inset-top));
  --safe-bottom:max(10px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input{font:inherit}
button{color:inherit}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 20% 0%,rgba(102,227,255,.09),transparent 27%),
  radial-gradient(circle at 85% 100%,rgba(179,110,255,.08),transparent 29%),
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,auto,34px 34px,34px 34px;opacity:.9}
#app{height:100dvh;display:flex;flex-direction:column;padding:var(--safe-top) 10px var(--safe-bottom);gap:9px;position:relative;z-index:1}
.topbar{height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex:0 0 auto}
.brand{font-weight:950;letter-spacing:.08em;font-size:14px;white-space:nowrap}.brand span{color:var(--accent);text-shadow:0 0 14px rgba(102,227,255,.45)}
.status{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:center;white-space:nowrap}
.tools{display:flex;justify-content:flex-end;gap:6px}
.icon-btn,.mini-btn,.preset-btn,.setup-btn{border:1px solid var(--line);background:linear-gradient(180deg,#171c29,#0e1119);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 7px 18px rgba(0,0,0,.18)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;font-size:18px;cursor:pointer}
.icon-btn:active,.mini-btn:active,.preset-btn:active,.setup-btn:active{transform:translateY(1px);filter:brightness(1.18)}
.players{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.players.count-1{grid-template-columns:1fr}.players.count-1 .player-card{grid-column:1}
.players.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.players.count-3 .player-card:first-child{grid-column:1/-1}
.player-card{--pc:#66e3ff;position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid color-mix(in srgb,var(--pc) 26%,#252b3a);border-radius:22px;background:
  radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--pc) 12%,transparent),transparent 46%),
  linear-gradient(155deg,#151a27 0%,#0a0d14 72%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 30px rgba(0,0,0,.22)}
.player-card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 38px color-mix(in srgb,var(--pc) 6%,transparent)}
.player-card.ko{filter:saturate(.45)}
.player-card.ko::before{content:"OUT";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(50px,15vw,110px);font-weight:1000;letter-spacing:.14em;color:rgba(255,85,109,.11);transform:rotate(-10deg);z-index:0}
.card-head{position:absolute;left:10px;right:10px;top:8px;height:34px;display:flex;align-items:center;gap:6px;z-index:5}
.name-input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:#fff;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:4px 2px;text-overflow:ellipsis}
.color-dot{width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:var(--pc);box-shadow:0 0 14px color-mix(in srgb,var(--pc) 65%,transparent);cursor:pointer;flex:0 0 auto}
.remove-player{width:27px;height:27px;border-radius:9px;border:1px solid #2b3140;background:#11151f;color:#919ab4;font-weight:900;cursor:pointer}
.health-zone{position:absolute;inset:39px 7px 48px;display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:stretch;z-index:2}
.tap-zone{border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}
.tap-zone.minus{color:var(--bad)}.tap-zone.plus{color:var(--good)}
.tap-zone .symbol{font-size:clamp(29px,7vw,54px);font-weight:300;opacity:.7;transition:.12s transform,.12s opacity}
.tap-zone:active .symbol{transform:scale(1.24);opacity:1}
.life-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;pointer-events:none;position:relative}
.life{font-variant-numeric:tabular-nums lining-nums;font-size:clamp(64px,18vw,142px);line-height:.82;font-weight:1000;letter-spacing:-.07em;text-shadow:0 5px 25px rgba(0,0,0,.36);max-width:100%}
.count-4 .life,.count-5 .life,.count-6 .life{font-size:clamp(48px,13vw,92px)}
.life-label{margin-top:8px;font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--muted)}
.delta{position:absolute;top:20%;left:50%;translate:-50% -50%;font-size:24px;font-weight:1000;opacity:0;pointer-events:none;z-index:10}.delta.show{animation:floatDelta .62s ease-out forwards}
@keyframes floatDelta{0%{opacity:0;transform:translateY(10px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1.12)}}
.player-card.hit{animation:hit .22s ease}.player-card.heal{animation:heal .28s ease}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}55%{transform:translateX(4px);box-shadow:inset 0 0 45px rgba(255,85,109,.2)}80%{transform:translateX(-2px)}}
@keyframes heal{50%{box-shadow:inset 0 0 55px rgba(86,255,165,.18),0 14px 30px rgba(0,0,0,.22)}}
.meter{position:absolute;left:12px;right:12px;bottom:42px;height:4px;border-radius:999px;background:#202533;overflow:hidden;z-index:4}.meter-fill{height:100%;width:100%;background:var(--pc);box-shadow:0 0 9px var(--pc);transition:width .25s ease}
.quick-row{position:absolute;left:8px;right:8px;bottom:7px;height:29px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:5px;z-index:6}
.qbtn{border:1px solid #292f3e;background:#111620;border-radius:9px;font-size:11px;font-weight:950;color:#aab2c8;cursor:pointer;min-width:0}.qbtn.bad{color:#ff8292}.qbtn.good{color:#75ffc0}.qbtn.stat{padding:0 7px;color:#d9def0;white-space:nowrap}
.footer{height:46px;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.mini-btn{border-radius:13px;font-size:12px;font-weight:900;letter-spacing:.04em;cursor:pointer}.mini-btn.primary{border-color:#2f5e68;background:linear-gradient(180deg,#16333b,#0c171d);color:#8ff0ff}
.drawer{position:absolute;left:10px;right:10px;bottom:calc(var(--safe-bottom) + 53px);z-index:50;background:rgba(12,15,23,.98);border:1px solid #2a3040;border-radius:18px;padding:12px;box-shadow:0 24px 80px rgba(0,0,0,.56);transform:translateY(14px);opacity:0;pointer-events:none;transition:.18s ease}
.drawer.open{transform:translateY(0);opacity:1;pointer-events:auto}.drawer-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:950;letter-spacing:.09em;margin-bottom:9px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #202635}.setting-row:first-of-type{border-top:0}.setting-label{font-size:12px;color:#bcc4d8}.preset-wrap{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.preset-btn{padding:7px 9px;font-size:11px;font-weight:900;cursor:pointer}.preset-btn.active{border-color:#4f8c9a;color:#8ff0ff}.toggle{width:42px;height:24px;border-radius:999px;border:1px solid #303748;background:#171b26;padding:2px;cursor:pointer}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#727b95;transition:.18s}.toggle.on i{transform:translateX(17px);background:var(--good);box-shadow:0 0 12px rgba(86,255,165,.45)}
.setup{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 10%,#142433,#07080d 42%);display:grid;place-items:center;padding:24px}.setup.hidden{display:none}.setup-card{width:min(480px,100%);border:1px solid #2b3345;border-radius:26px;background:rgba(14,18,28,.95);padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.5)}
.logo-mark{width:64px;height:64px;border-radius:20px;margin-bottom:18px;display:grid;place-items:center;font-size:27px;font-weight:1000;background:linear-gradient(145deg,#163440,#101522);border:1px solid #356476;color:#91f1ff;box-shadow:0 0 30px rgba(102,227,255,.13)}
.setup h1{font-size:30px;line-height:1;margin:0 0 7px;font-weight:1000;letter-spacing:-.04em}.setup h1 span{color:var(--accent)}.setup p{margin:0 0 22px;color:#8f98b2;font-size:13px;line-height:1.45}.setup-label{font-size:11px;font-weight:900;letter-spacing:.13em;color:#8993ad;margin:15px 0 8px}.choice-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.setup-btn{height:46px;font-weight:1000;cursor:pointer}.setup-btn.active{border-color:#4d8c9d;background:#143039;color:#8ff0ff;box-shadow:inset 0 0 18px rgba(102,227,255,.08)}.start-btn{margin-top:20px;width:100%;height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,#58e4ff,#74ffb9);color:#051015;font-weight:1000;letter-spacing:.08em;cursor:pointer;box-shadow:0 12px 35px rgba(78,225,255,.17)}
.toast{position:fixed;left:50%;top:calc(var(--safe-top) + 52px);transform:translate(-50%,-10px);z-index:200;padding:9px 13px;border-radius:999px;background:#141a27;border:1px solid #2c3548;color:#dce2f4;font-size:11px;font-weight:900;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:150;opacity:0;background:radial-gradient(circle,transparent 35%,rgba(255,85,109,.24))}.flash.go{animation:screenFlash .35s ease-out}@keyframes screenFlash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@media (orientation:landscape) and (max-height:600px){#app{gap:6px}.topbar{height:38px}.icon-btn{height:34px;width:34px}.footer{height:38px}.health-zone{inset:34px 6px 39px}.quick-row{height:25px}.meter{bottom:34px}.life{font-size:clamp(48px,13vh,95px)}.count-4 .life,.count-5 .life,.count-6 .life{font-size:clamp(42px,11vh,76px)}}
@media (max-width:420px){.brand{font-size:12px}.status{display:none}.topbar{grid-template-columns:1fr auto}.players{gap:6px}.player-card{border-radius:18px}.quick-row{gap:3px}.qbtn{font-size:10px}.choice-grid{gap:4px}.setup-card{padding:20px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span>VITAL</span>//CORE</div>
    <div class="status" id="statusText">TABLE READY</div>
    <div class="tools">
      <button class="icon-btn" id="undoBtn" aria-label="Undo" title="Undo">↶</button>
      <button class="icon-btn" id="fullBtn" aria-label="Fullscreen" title="Fullscreen">⛶</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>

  <main class="players count-2" id="players"></main>

  <footer class="footer">
    <button class="mini-btn" id="removeBtn">− PLAYER</button>
    <button class="mini-btn primary" id="resetBtn">RESET ALL</button>
    <button class="mini-btn" id="addBtn">+ PLAYER</button>
  </footer>

  <section class="drawer" id="drawer" aria-label="Settings">
    <div class="drawer-title"><span>TABLE SETTINGS</span><button class="remove-player" id="closeDrawer">×</button></div>
    <div class="setting-row"><span class="setting-label">Starting health</span><div class="preset-wrap" id="presets"></div></div>
    <div class="setting-row"><span class="setting-label">Sound feedback</span><button class="toggle" id="soundToggle" aria-label="Toggle sound"><i></i></button></div>
    <div class="setting-row"><span class="setting-label">Haptic feedback</span><button class="toggle" id="hapticToggle" aria-label="Toggle haptics"><i></i></button></div>
    <div class="setting-row"><span class="setting-label">Keep values at 0+</span><button class="toggle" id="floorToggle" aria-label="Toggle zero floor"><i></i></button></div>
  </section>
</div>

<div class="setup" id="setup">
  <div class="setup-card">
    <div class="logo-mark">V+</div>
    <h1><span>VITAL</span>//CORE</h1>
    <p>A fast tabletop health counter built for thumbs, chaos, and questionable combat math.</p>
    <div class="setup-label">PLAYERS</div>
    <div class="choice-grid" id="playerChoices"></div>
    <div class="setup-label">STARTING HEALTH</div>
    <div class="choice-grid" id="healthChoices"></div>
    <button class="start-btn" id="startBtn">INITIALIZE TABLE</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'vitalCoreState_v1';
  const COLORS = ['#66e3ff','#ff657d','#77ffb4','#b87cff','#ffc85c','#ff78d1','#77a7ff','#ff8b55'];
  const PRESETS = [20,30,40,50,100];
  const $ = (sel) => document.querySelector(sel);

  const defaultState = () => ({
    startHealth: 40,
    players: Array.from({length:2}, (_,i) => ({id:uid(), name:`PLAYER ${i+1}`, health:40, color:COLORS[i], poison:0})),
    history: [],
    sound: false,
    haptic: true,
    floorZero: false,
    setupDone: false
  });

  function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

  let state = loadState();
  let setupPlayers = state.players.length || 2;
  let setupHealth = state.startHealth || 40;
  let audioCtx = null;
  let toastTimer = null;

  function loadState(){
    try{
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!parsed || !Array.isArray(parsed.players)) return defaultState();
      return {
        ...defaultState(),
        ...parsed,
        players: parsed.players.slice(0,6).map((p,i) => ({id:p.id || uid(), name:p.name || `PLAYER ${i+1}`, health:Number.isFinite(p.health)?p.health:40, color:p.color || COLORS[i], poison:Number.isFinite(p.poison)?p.poison:0})),
        history: []
      };
    }catch(e){ return defaultState(); }
  }

  function save(){
    const compact = {...state, history: state.history.slice(-30)};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(compact));
  }

  function snapshot(){
    state.history.push(state.players.map(p => ({...p})));
    if(state.history.length > 30) state.history.shift();
  }

  function feedback(kind='tap'){
    if(state.haptic && navigator.vibrate) navigator.vibrate(kind === 'damage' ? 18 : kind === 'ko' ? [25,30,45] : 10);
    if(!state.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      const freq = kind === 'heal' ? 620 : kind === 'ko' ? 120 : 260;
      o.frequency.setValueAtTime(freq, now);
      o.frequency.exponentialRampToValueAtTime(kind === 'heal' ? 860 : 170, now + .07);
      g.gain.setValueAtTime(.035, now);
      g.gain.exponentialRampToValueAtTime(.001, now + .08);
      o.start(now); o.stop(now + .085);
    }catch(e){}
  }

  function toast(msg){
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1100);
  }

  function flash(){
    const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  }

  function renderSetup(){
    $('#playerChoices').innerHTML = [1,2,3,4,5,6].map(n => `<button class="setup-btn ${setupPlayers===n?'active':''}" data-players="${n}">${n}</button>`).join('');
    $('#healthChoices').innerHTML = PRESETS.map(n => `<button class="setup-btn ${setupHealth===n?'active':''}" data-health="${n}">${n}</button>`).join('') + `<button class="setup-btn ${!PRESETS.includes(setupHealth)?'active':''}" data-health="custom">#</button>`;
  }

  function renderPresets(){
    $('#presets').innerHTML = PRESETS.map(n => `<button class="preset-btn ${state.startHealth===n?'active':''}" data-preset="${n}">${n}</button>`).join('');
  }

  function render(){
    const host = $('#players');
    host.className = `players count-${state.players.length}`;
    host.innerHTML = state.players.map((p,i) => cardHTML(p,i)).join('');
    $('#statusText').textContent = `${state.players.length} PLAYER${state.players.length===1?'':'S'} · BASE ${state.startHealth}`;
    $('#undoBtn').style.opacity = state.history.length ? '1' : '.38';
    $('#addBtn').disabled = state.players.length >= 6;
    $('#removeBtn').disabled = state.players.length <= 1;
    $('#addBtn').style.opacity = state.players.length >= 6 ? '.35' : '1';
    $('#removeBtn').style.opacity = state.players.length <= 1 ? '.35' : '1';
    renderPresets();
    setToggle('#soundToggle', state.sound);
    setToggle('#hapticToggle', state.haptic);
    setToggle('#floorToggle', state.floorZero);
  }

  function cardHTML(p,index){
    const pct = state.startHealth > 0 ? Math.max(0,Math.min(100,(p.health/state.startHealth)*100)) : 0;
    return `<article class="player-card ${p.health<=0?'ko':''}" data-id="${p.id}" style="--pc:${p.color}">
      <div class="card-head">
        <button class="color-dot" data-action="color" title="Change color"></button>
        <input class="name-input" maxlength="18" value="${escapeHtml(p.name)}" aria-label="Player name" data-action="name">
        <button class="remove-player" data-action="remove" title="Remove player">×</button>
      </div>
      <div class="health-zone">
        <button class="tap-zone minus" data-action="change" data-delta="-1" aria-label="Subtract 1"><span class="symbol">−</span></button>
        <div class="life-wrap"><div class="delta"></div><div class="life">${p.health}</div><div class="life-label">HEALTH</div></div>
        <button class="tap-zone plus" data-action="change" data-delta="1" aria-label="Add 1"><span class="symbol">+</span></button>
      </div>
      <div class="meter"><div class="meter-fill" style="width:${pct}%"></div></div>
      <div class="quick-row">
        <button class="qbtn bad" data-action="change" data-delta="-5">−5</button>
        <button class="qbtn bad" data-action="change" data-delta="-10">−10</button>
        <button class="qbtn stat" data-action="poison" title="Poison / alternate counter">☠ ${p.poison}</button>
        <button class="qbtn good" data-action="change" data-delta="10">+10</button>
        <button class="qbtn good" data-action="change" data-delta="5">+5</button>
      </div>
    </article>`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  function setToggle(sel,on){ $(sel).classList.toggle('on',!!on); }

  function getPlayer(id){ return state.players.find(p => p.id === id); }

  let suppressZoneClick = false;

  function changeHealth(id, delta, button){
    const p = getPlayer(id); if(!p) return;
    snapshot();
    const before = p.health;
    p.health += delta;
    if(state.floorZero) p.health = Math.max(0,p.health);
    p.health = Math.max(-999,Math.min(9999,p.health));
    const actual = p.health - before;
    save();
    render();
    const card = document.querySelector(`.player-card[data-id="${id}"]`);
    if(card){
      card.classList.add(actual < 0 ? 'hit' : 'heal');
      const d = card.querySelector('.delta');
      if(d && actual !== 0){
        d.textContent = actual > 0 ? `+${actual}` : String(actual);
        d.style.color = actual > 0 ? 'var(--good)' : 'var(--bad)';
        d.classList.add('show');
      }
    }
    if(before > 0 && p.health <= 0){ feedback('ko'); flash(); toast(`${p.name} IS OUT`); }
    else feedback(actual < 0 ? 'damage' : 'heal');
  }

  function setPlayerCount(n, useCurrentHealth=false){
    n = Math.max(1,Math.min(6,n));
    snapshot();
    while(state.players.length < n){
      const i = state.players.length;
      state.players.push({id:uid(),name:`PLAYER ${i+1}`,health:state.startHealth,color:COLORS[i%COLORS.length],poison:0});
    }
    state.players = state.players.slice(0,n);
    save(); render();
  }

  function resetAll(newStart=state.startHealth){
    snapshot();
    state.startHealth = Number(newStart) || 40;
    state.players.forEach(p => {p.health=state.startHealth;p.poison=0;});
    save(); render(); feedback('heal'); toast(`RESET TO ${state.startHealth}`);
  }

  function undo(){
    const prev = state.history.pop();
    if(!prev){ toast('NOTHING TO UNDO'); return; }
    state.players = prev.map(p => ({...p}));
    save(); render(); feedback(); toast('UNDO');
  }

  function cycleColor(p){
    const idx = Math.max(0,COLORS.indexOf(p.color)); p.color = COLORS[(idx+1)%COLORS.length];
  }

  document.addEventListener('click', (e) => {
    const action = e.target.closest('[data-action]');
    if(action){
      const card = action.closest('.player-card');
      const p = card ? getPlayer(card.dataset.id) : null;
      if(action.dataset.action === 'change' && p){
        if(action.classList.contains('tap-zone') && suppressZoneClick){ suppressZoneClick = false; }
        else changeHealth(p.id, Number(action.dataset.delta), action);
      }
      if(action.dataset.action === 'color' && p){ snapshot(); cycleColor(p); save(); render(); feedback(); }
      if(action.dataset.action === 'remove' && p && state.players.length>1){ snapshot(); state.players = state.players.filter(x=>x.id!==p.id); save(); render(); feedback(); }
      if(action.dataset.action === 'poison' && p){ snapshot(); p.poison = (p.poison + 1) % 11; save(); render(); feedback(p.poison>=10?'ko':'tap'); if(p.poison>=10) toast(`${p.name}: 10 POISON`); }
    }

    const pc = e.target.closest('[data-players]');
    if(pc){ setupPlayers = Number(pc.dataset.players); renderSetup(); }
    const hc = e.target.closest('[data-health]');
    if(hc){
      if(hc.dataset.health === 'custom'){
        const raw = prompt('Starting health (1–999):', String(setupHealth));
        const n = Number(raw);
        if(Number.isFinite(n) && n >= 1 && n <= 999) setupHealth = Math.round(n);
      } else setupHealth = Number(hc.dataset.health);
      renderSetup();
    }
    const pr = e.target.closest('[data-preset]');
    if(pr){
      const n = Number(pr.dataset.preset);
      if(confirm(`Set everyone to ${n} health?`)){ resetAll(n); }
    }
  });

  document.addEventListener('change', (e) => {
    if(e.target.matches('.name-input')){
      const card = e.target.closest('.player-card'); const p = card && getPlayer(card.dataset.id);
      if(p){ p.name = e.target.value.trim() || 'PLAYER'; save(); }
    }
  });

  $('#startBtn').addEventListener('click', () => {
    state.startHealth = setupHealth;
    state.players = Array.from({length:setupPlayers}, (_,i) => ({id:uid(),name:`PLAYER ${i+1}`,health:setupHealth,color:COLORS[i],poison:0}));
    state.history = [];
    state.setupDone = true;
    save(); render(); $('#setup').classList.add('hidden'); feedback('heal');
  });
  $('#undoBtn').addEventListener('click', undo);
  $('#addBtn').addEventListener('click', () => { if(state.players.length<6) setPlayerCount(state.players.length+1,true); });
  $('#removeBtn').addEventListener('click', () => { if(state.players.length>1){ snapshot(); state.players.pop(); save(); render(); feedback(); } });
  $('#resetBtn').addEventListener('click', () => { if(confirm(`Reset all players to ${state.startHealth}?`)) resetAll(); });
  $('#settingsBtn').addEventListener('click', () => $('#drawer').classList.toggle('open'));
  $('#closeDrawer').addEventListener('click', () => $('#drawer').classList.remove('open'));
  $('#soundToggle').addEventListener('click', () => { state.sound=!state.sound; save(); render(); feedback('heal'); });
  $('#hapticToggle').addEventListener('click', () => { state.haptic=!state.haptic; save(); render(); feedback(); });
  $('#floorToggle').addEventListener('click', () => { state.floorZero=!state.floorZero; save(); render(); toast(state.floorZero?'ZERO FLOOR ON':'NEGATIVE HEALTH ON'); });
  $('#fullBtn').addEventListener('click', async () => {
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){ toast('FULLSCREEN UNAVAILABLE'); }
  });

  document.addEventListener('keydown', (e) => {
    if(e.target.matches('input')) return;
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    if(e.key==='Escape') $('#drawer').classList.remove('open');
    const map = {'1':0,'2':1,'3':2,'4':3,'5':4,'6':5};
    if(map[e.key] !== undefined && state.players[map[e.key]]){
      changeHealth(state.players[map[e.key]].id, e.shiftKey ? 1 : -1);
    }
  });

  // Long-press the large +/- zones for a fast ±5 hit without adding more clutter.
  let pressTimer = null;
  document.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('.tap-zone[data-action="change"]'); if(!btn) return;
    suppressZoneClick = false;
    pressTimer = setTimeout(() => {
      suppressZoneClick = true;
      const card = btn.closest('.player-card');
      if(card) changeHealth(card.dataset.id, Number(btn.dataset.delta)*5, btn);
    }, 520);
  });
  document.addEventListener('pointerup', () => clearTimeout(pressTimer));
  document.addEventListener('pointercancel', () => clearTimeout(pressTimer));
  document.addEventListener('contextmenu', (e) => { if(e.target.closest('.tap-zone')) e.preventDefault(); });

  renderSetup();
  render();
  if(state.setupDone) $('#setup').classList.add('hidden');
})();
</script>
</body>
</html>
