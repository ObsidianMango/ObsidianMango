<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020503">
<title>VITAL//CORE</title>
<style>
:root{--bg:#020503;--panel:rgba(7,11,18,.82);--line:#24314a;--text:#f5fbff;--muted:#91a0b6;--good:#72ff8d;--bad:#ff5c78;--accent:#66e3ff;--top:max(10px,env(safe-area-inset-top));--bot:max(10px,env(safe-area-inset-bottom))}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit;color:inherit}body{isolation:isolate}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-5;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;opacity:.95;mix-blend-mode:screen}
#aquarium{position:fixed;inset:0;width:100%;height:100%;z-index:-3;pointer-events:none;opacity:.88;mix-blend-mode:screen}
body:before{content:"";position:fixed;inset:0;z-index:-4;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 0 24%,rgba(2,5,3,.18) 54%,rgba(2,5,3,.82) 100%),linear-gradient(180deg,rgba(2,5,3,.9),rgba(2,5,3,.18) 18%,rgba(2,5,3,.12) 84%,rgba(2,5,3,.92))}
body:after{content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.08;background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
#app{height:100dvh;display:flex;flex-direction:column;padding:var(--top) 10px var(--bot);gap:8px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:42px}.brand{font-weight:1000;letter-spacing:.08em;font-size:18px}.brand span{color:var(--accent);text-shadow:0 0 10px rgba(102,227,255,.6)}.status{text-align:center;font-size:12px;font-weight:900;letter-spacing:.16em;color:#9dd9aa;text-transform:uppercase}.status:before{content:"●";color:var(--good);margin-right:6px;text-shadow:0 0 8px var(--good)}.tools{display:flex;justify-content:flex-end;gap:6px}
.ib,.tb,.sb{border:1px solid var(--line);background:linear-gradient(180deg,rgba(21,27,40,.9),rgba(9,13,20,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 18px rgba(0,0,0,.28);backdrop-filter:blur(10px)}.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}.ib:active,.tb:active,.sb:active{transform:scale(.97);filter:brightness(1.2)}
#players{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}#players.c1{grid-template-columns:1fr}#players.c3 .card:first-child{grid-column:1/-1}
.card{--pc:#66e3ff;position:relative;overflow:hidden;border-radius:18px;border:1px solid color-mix(in srgb,var(--pc) 28%,rgba(120,160,210,.35));background:linear-gradient(145deg,rgba(10,15,24,.34),rgba(3,7,11,.18));box-shadow:inset 0 0 22px color-mix(in srgb,var(--pc) 4%,transparent),0 8px 22px rgba(0,0,0,.18);backdrop-filter:blur(1.5px)}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(114,255,141,.018),transparent 12%,transparent 88%,rgba(114,255,141,.012))}.card:after{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 78%,color-mix(in srgb,var(--pc) 10%,transparent) 86%,transparent 94%);animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.card.crit{border-color:rgba(255,92,120,.7);box-shadow:inset 0 0 50px rgba(255,50,90,.12),0 0 20px rgba(255,80,110,.1),0 12px 30px rgba(0,0,0,.3)}.card.ko{filter:saturate(.3) brightness(.68)}.card.ko .life{color:#ff98aa}.card.flash-hit{animation:hit .28s ease}.card.flash-heal{animation:heal .32s ease}@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-5px)}55%{transform:translateX(5px)}}@keyframes heal{40%{filter:brightness(1.25)}}
.head{left:8px;right:8px;top:6px;gap:7px;padding:3px 5px;border-radius:10px;background:rgba(3,7,11,.36);width:calc(100% - 16px);position:absolute;display:flex;align-items:center;z-index:4}.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:var(--pc);box-shadow:0 0 10px var(--pc);cursor:pointer}.name{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-weight:1000;font-size:18px;letter-spacing:.08em;text-transform:uppercase;outline:0;text-shadow:0 2px 8px #000,0 0 12px color-mix(in srgb,var(--pc) 38%,transparent)}.x{width:26px;height:26px;border-radius:8px;border:1px solid #2e3a51;background:#0d131d;color:#8d9bb3;cursor:pointer}
.zone{position:absolute;inset:36px 4px 42px;display:grid;grid-template-columns:.72fr 1.8fr .72fr;align-items:stretch;z-index:3}.tap{border:0;background:transparent;color:inherit;cursor:pointer;position:relative}.tap span{display:grid;place-items:center;height:100%;font-size:clamp(46px,10vw,82px);font-weight:300;opacity:.72;text-shadow:0 0 16px currentColor}.tap.minus{color:var(--bad)}.tap.plus{color:var(--good)}.tap:active span{transform:scale(1.25);opacity:1}
.core{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring{position:absolute;width:min(30vw,140px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 18%,color-mix(in srgb,var(--pc) 85%,white) 23%,transparent 28% 58%,color-mix(in srgb,var(--pc) 55%,transparent) 64%,transparent 70%);opacity:.45;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--pc) 70%,transparent));animation:spin 7s linear infinite}.ring:before,.ring:after{content:"";position:absolute;inset:10%;border-radius:50%;border:1px dashed color-mix(in srgb,var(--pc) 45%,transparent);animation:spin 11s linear infinite reverse}.ring:after{inset:20%;border-style:solid;opacity:.28}.life{font-size:clamp(82px,24vw,190px);line-height:.78;font-weight:1000;letter-spacing:-.07em;text-shadow:0 4px 12px rgba(0,0,0,.9),0 0 18px color-mix(in srgb,var(--pc) 32%,transparent);position:relative;z-index:1}.meta{margin-top:8px;font-size:12px;font-weight:1000;color:#b7d5c0;text-shadow:0 2px 6px #000}.critmsg{position:absolute;bottom:4%;font-size:11px;font-weight:1000;letter-spacing:.18em;color:#ff7f98;opacity:0}.card.crit .critmsg{opacity:1}.delta{position:absolute;top:13%;left:50%;translate:-50% -50%;font-size:28px;font-weight:1000;opacity:0;text-shadow:0 2px 12px #000}.delta.show{animation:float .7s ease-out}@keyframes float{0%{opacity:0;transform:translateY(14px) scale(.5)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-54px) scale(.92)}}
.bar{position:absolute;left:18%;right:18%;bottom:37px;height:4px;border-radius:999px;background:rgba(20,30,45,.52);overflow:hidden;z-index:3}.fill{height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 65%,white),var(--pc));box-shadow:0 0 10px var(--pc);transition:width .28s}.card.crit .fill{background:linear-gradient(90deg,#ff3658,#ff8aa0)}
.row{position:absolute;left:11%;right:11%;bottom:5px;height:30px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:4px;z-index:4}.qb{border:1px solid #2a3650;background:rgba(5,9,15,.58);border-radius:9px;font-size:13px;font-weight:1000;cursor:pointer;backdrop-filter:blur(2px)}.qb.bad{color:#ff8ea1}.qb.good{color:#84ffc4}.qb.poison{color:#e6edf8;padding:0 6px;white-space:nowrap}
.foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;min-height:40px}.tb{border-radius:13px;font-size:14px;font-weight:1000;cursor:pointer}.tb.main{border-color:#2f7145;background:linear-gradient(180deg,#153b20,#0b1910);color:#97ffb1}
.drawer{position:absolute;left:10px;right:10px;bottom:calc(var(--bot) + 52px);padding:12px;border-radius:18px;border:1px solid #2a354a;background:rgba(9,14,23,.96);box-shadow:0 24px 80px rgba(0,0,0,.62);backdrop-filter:blur(16px);transform:translateY(14px);opacity:0;pointer-events:none;transition:.18s;z-index:40}.drawer.open{transform:none;opacity:1;pointer-events:auto}.tt{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:950;letter-spacing:.1em;margin-bottom:10px}.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #202b3d}.set:first-of-type{border-top:0}.pr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sb{padding:7px 9px;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer}.sb.on{border-color:#4b9a5f;color:#a3ffb9}.toggle{width:42px;height:24px;border-radius:999px;border:1px solid #303b50;background:#121925;padding:2px;cursor:pointer}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#6a7891;transition:.18s}.toggle.on i{transform:translateX(17px);background:var(--good);box-shadow:0 0 10px rgba(114,255,141,.55)}
.toast{position:fixed;left:50%;top:calc(var(--top) + 50px);translate:-50% 0;z-index:70;padding:9px 14px;border-radius:999px;background:#111a28;border:1px solid #34455f;color:#ebf2ff;font-size:11px;font-weight:950;letter-spacing:.07em;opacity:0;transform:translateY(-10px);transition:.18s}.toast.on{opacity:1;transform:none}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}.flash.hit{background:radial-gradient(circle,transparent 32%,rgba(255,28,67,.26))}.flash.heal{background:radial-gradient(circle,transparent 35%,rgba(62,255,172,.18))}.flash.go{animation:ff .4s ease-out}@keyframes ff{0%{opacity:0}24%{opacity:1}100%{opacity:0}}
#players.c1 .life{font-size:clamp(150px,44vw,310px)}#players.c2 .life{font-size:clamp(100px,29vw,210px)}#players.c3 .life{font-size:clamp(92px,25vw,180px)}#players.c4 .life,#players.c5 .life,#players.c6 .life{font-size:clamp(70px,19vw,132px)}
#players.c1 .name{font-size:24px}#players.c2 .name{font-size:20px}#players.c3 .name{font-size:18px}
@media(max-width:420px){.brand{font-size:16px}.name{font-size:16px}.qb{font-size:12px}.ring{width:min(29vw,120px)}}
@media(orientation:landscape) and (max-height:620px){#app{gap:5px}.top,.foot{min-height:36px}.zone{inset:32px 4px 36px}#players.c1 .life{font-size:clamp(100px,34vh,230px)}#players.c2 .life{font-size:clamp(78px,25vh,170px)}#players.c3 .life,#players.c4 .life,#players.c5 .life,#players.c6 .life{font-size:clamp(58px,19vh,120px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}#bg,#aquarium{display:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="aquarium"></canvas><canvas id="fx"></canvas>
<div id="app">
<header class="top"><div class="brand"><span>VITAL</span>//CORE</div><div class="status" id="status">system nominal</div><div class="tools"><button class="ib" id="undo">↶</button><button class="ib" id="full">⛶</button><button class="ib" id="gear">⚙</button></div></header>
<main id="players" class="c2"></main>
<footer class="foot"><button class="tb" id="removeP">− PLAYER</button><button class="tb main" id="reset">RESET CORE</button><button class="tb" id="addP">+ PLAYER</button></footer>
<section class="drawer" id="drawer"><div class="tt"><span>CORE CONFIG</span><button class="x" id="close">×</button></div><div class="set"><span>Starting health</span><div class="pr" id="presets"></div></div><div class="set"><span>Floor at zero</span><button class="toggle" id="floor"><i></i></button></div></section>
</div>
<div class="toast" id="toast"></div><div class="flash" id="flash"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),fx=$('#fx'),fctx=fx.getContext('2d'),bg=$('#bg'),bctx=bg.getContext('2d',{alpha:true}),aq=$('#aquarium'),aqctx=aq.getContext('2d',{alpha:true});
const KEY='vitalcore_px_v2',PRESETS=[20,30,40,50,100],COLORS=['#66e3ff','#ff657d','#77ffb4','#b87cff','#ffc85c','#ff78d1'];
const uid=()=>Math.random().toString(36).slice(2,9);
const base=()=>({start:40,floor:false,players:[0,1].map(i=>({id:uid(),name:`PLAYER ${i+1}`,life:40,color:COLORS[i],poison:0}))});
let state=load(),hist=[],toastTimer=0,hold=0,holdUsed=false;
function load(){try{return {...base(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return base()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function snap(){hist.push(JSON.stringify(state.players));if(hist.length>30)hist.shift()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),1100)}
function flash(k){const e=$('#flash');e.className=`flash ${k}`;void e.offsetWidth;e.classList.add('go')}
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function toggle(sel,on){$(sel).classList.toggle('on',!!on)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(p){const pct=Math.max(0,Math.min(100,p.life/state.start*100));const crit=p.life>0&&p.life<=Math.max(1,state.start*.25);return `<article class="card ${crit?'crit':''} ${p.life<=0?'ko':''}" data-id="${p.id}" style="--pc:${p.color}"><div class="head"><button class="dot" data-a="color"></button><input class="name" data-a="name" value="${esc(p.name)}" maxlength="18"><button class="x" data-a="remove">×</button></div><div class="zone"><button class="tap minus" data-a="d" data-v="-1"><span>−</span></button><div class="core"><div class="ring"></div><div class="delta"></div><div class="life">${p.life}</div><div class="meta">VITAL CORE</div><div class="critmsg">⚠ CRITICAL ⚠</div></div><button class="tap plus" data-a="d" data-v="1"><span>+</span></button></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><button class="qb bad" data-a="d" data-v="-5">−5</button><button class="qb bad" data-a="d" data-v="-10">−10</button><button class="qb poison" data-a="poison">☠ ${p.poison}</button><button class="qb good" data-a="d" data-v="10">+10</button><button class="qb good" data-a="d" data-v="5">+5</button></div></article>`}
function render(){const host=$('#players');host.className='c'+state.players.length;host.id='players';host.innerHTML=state.players.map(card).join('');$('#status').textContent=`${state.players.length} core${state.players.length>1?'s':''} · base ${state.start}`;$('#presets').innerHTML=PRESETS.map(n=>`<button class="sb ${n===state.start?'on':''}" data-p="${n}">${n}</button>`).join('');toggle('#floor',state.floor);save()}
function burst(el,color,n=18,p=1){if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.48;for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()*2-1)*(2+Math.random()*3)*p,vy:(Math.random()*2-1)*(2+Math.random()*3)*p,life:1,dec:.02+Math.random()*.03,s:1+Math.random()*3,c:color})}
function delta(el,v){const d=el.querySelector('.delta');d.textContent=v>0?`+${v}`:v;d.style.color=v>0?'var(--good)':'var(--bad)';d.classList.remove('show');void d.offsetWidth;d.classList.add('show')}
function change(id,v){const p=state.players.find(x=>x.id===id);if(!p)return;snap();const before=p.life;p.life+=v;if(state.floor)p.life=Math.max(0,p.life);p.life=Math.max(-999,Math.min(9999,p.life));render();const el=document.querySelector(`.card[data-id="${id}"]`);if(el){el.classList.add(v<0?'flash-hit':'flash-heal');setTimeout(()=>el.classList.remove('flash-hit','flash-heal'),350);delta(el,p.life-before);burst(el,v<0?'#ff5c78':'#72ff8d',Math.abs(v)>=5?30:16,Math.abs(v)>=5?1.35:1)}if(before>0&&p.life<=0){flash('hit');toast(`${p.name} // CORE DOWN`)}else if(Math.abs(v)>=5)flash(v<0?'hit':'heal')}
function setPlayers(n){n=Math.max(1,Math.min(6,n));snap();while(state.players.length<n){const i=state.players.length;state.players.push({id:uid(),name:`PLAYER ${i+1}`,life:state.start,color:COLORS[i%COLORS.length],poison:0})}state.players=state.players.slice(0,n);render()}
function reset(start=state.start){snap();state.start=start;state.players.forEach(p=>{p.life=start;p.poison=0});render();flash('heal');toast(`CORE RESET // ${start}`);document.querySelectorAll('.card').forEach(c=>burst(c,'#72ff8d',20,1))}
function undo(){const prev=hist.pop();if(!prev)return toast('NO HISTORY');state.players=JSON.parse(prev);render();toast('STATE RESTORED')}
$('#undo').onclick=undo;$('#full').onclick=full;$('#gear').onclick=()=>$('#drawer').classList.toggle('open');$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#addP').onclick=()=>setPlayers(state.players.length+1);$('#removeP').onclick=()=>state.players.length>1&&setPlayers(state.players.length-1);$('#reset').onclick=()=>confirm(`Reset all to ${state.start}?`)&&reset();$('#floor').onclick=()=>{state.floor=!state.floor;toggle('#floor',state.floor);save();toast(state.floor?'ZERO FLOOR // ON':'NEGATIVE HEALTH // ON')};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-p]');if(!t)return;if(t.dataset.p)return reset(+t.dataset.p);const c=t.closest('.card'),id=c?.dataset.id,p=state.players.find(x=>x.id===id);if(!p)return;const a=t.dataset.a;if(a==='d'){if(t.classList.contains('tap')&&holdUsed){holdUsed=false;return}change(id,+t.dataset.v)}if(a==='color'){p.color=COLORS[(COLORS.indexOf(p.color)+1)%COLORS.length];render()}if(a==='remove'&&state.players.length>1){snap();state.players=state.players.filter(x=>x.id!==id);render()}if(a==='poison'){snap();p.poison=(p.poison+1)%11;render();if(p.poison>=10){flash('hit');toast(`${p.name} // 10 POISON`)}}});
document.addEventListener('change',e=>{if(e.target.matches('.name')){const c=e.target.closest('.card'),p=state.players.find(x=>x.id===c.dataset.id);if(p){p.name=e.target.value.trim()||'PLAYER';save()}}});
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.tap[data-a="d"]');if(!t)return;holdUsed=false;clearTimeout(hold);hold=setTimeout(()=>{holdUsed=true;change(t.closest('.card').dataset.id,+t.dataset.v*5)},520)});document.addEventListener('pointerup',()=>clearTimeout(hold));document.addEventListener('pointercancel',()=>clearTimeout(hold));document.addEventListener('contextmenu',e=>e.target.closest('.tap')&&e.preventDefault());
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if(e.key==='Escape')$('#drawer').classList.remove('open')});
let parts=[];function sizeFx(){const d=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*d;fx.height=innerHeight*d;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';fctx.setTransform(d,0,0,d,0,0)}function drawFx(){fctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.02;p.life-=p.dec;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.s*Math.max(.3,p.life),0,7);fctx.fill()}fctx.globalAlpha=1;requestAnimationFrame(drawFx)}sizeFx();drawFx();addEventListener('resize',sizeFx);
const glyph='01#<>[]{}$%+-*ABCDEFGHIJKLMNOPQRSTUVWXYZ';let sw=0,sh=0,cell=6,streams=[],stars=[],buildings=[];function r(a,b){return Math.random()*(b-a)+a}function line(x0,y0,x1,y1,col){bctx.fillStyle=col;const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let er=dx+dy;while(true){bctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*er;if(e2>=dy){er+=dy;x0+=sx}if(e2<=dx){er+=dx;y0+=sy}}}
function sizeBg(){bg.style.width=innerWidth+'px';bg.style.height=innerHeight+'px';sw=Math.max(160,Math.floor(innerWidth/5));sh=Math.max(220,Math.floor(innerHeight/5));bg.width=sw;bg.height=sh;cell=innerWidth<480?5:6;const cols=Math.ceil(sw/cell);streams=Array.from({length:cols},(_,i)=>({x:i*cell,y:Math.floor(r(-sh,sh)),s:r(.35,1.15),l:Math.floor(r(6,18))}));stars=Array.from({length:Math.floor(sw*.18)},()=>({x:Math.floor(r(0,sw)),y:Math.floor(r(0,sh*.45)),k:r(0,7)}));buildings=[];for(let x=0;x<sw;){const w=Math.floor(r(8,18)),h=Math.floor(r(sh*.1,sh*.3)),wins=[];for(let wx=2;wx<w-2;wx+=3)for(let wy=2;wy<h-2;wy+=4)if(Math.random()>.44)wins.push({x:wx,y:wy,on:Math.random()>.32});buildings.push({x,w,h,wins});x+=w+Math.floor(r(1,3))}}
