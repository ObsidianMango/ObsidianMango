<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VITAL//CORE OVERDRIVE</title>
<style>
:root{
  --bg:#05070c;--panel:#0b1019;--line:#263147;--text:#f9fbff;--muted:#76839f;
  --good:#63ffb5;--bad:#ff4968;--accent:#65e8ff;
  --safe-top:max(10px,env(safe-area-inset-top));--safe-bottom:max(10px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input{font:inherit}button{color:inherit}
body{isolation:isolate}
body::before{content:"";position:fixed;inset:-20%;z-index:-4;pointer-events:none;background:
radial-gradient(circle at 15% 10%,rgba(67,223,255,.18),transparent 22%),
radial-gradient(circle at 82% 18%,rgba(156,72,255,.12),transparent 25%),
radial-gradient(circle at 55% 92%,rgba(64,255,176,.10),transparent 25%);
filter:blur(20px);animation:aurora 13s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:1000;pointer-events:none;opacity:.18;background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
@keyframes aurora{0%{transform:translate3d(-3%,-2%,0) rotate(-4deg) scale(1)}50%{transform:translate3d(4%,2%,0) rotate(3deg) scale(1.08)}100%{transform:translate3d(-1%,5%,0) rotate(-1deg) scale(1.03)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:400}
#app{height:100dvh;display:flex;flex-direction:column;padding:var(--safe-top) 10px var(--safe-bottom);gap:9px;position:relative;z-index:1}
.topbar{height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex:0 0 auto}
.brand{font-weight:1000;letter-spacing:.09em;font-size:14px;white-space:nowrap;position:relative}.brand span{color:var(--accent);text-shadow:0 0 9px rgba(101,232,255,.8),0 0 28px rgba(101,232,255,.28)}.brand b{font-size:9px;color:#8390aa;letter-spacing:.14em;margin-left:6px;font-weight:900}
.brand::after{content:"";position:absolute;left:0;right:33%;height:1px;bottom:-5px;background:linear-gradient(90deg,var(--accent),transparent);box-shadow:0 0 9px var(--accent);animation:brandPulse 2s ease-in-out infinite}
@keyframes brandPulse{50%{opacity:.35;transform:scaleX(.75);transform-origin:left}}
.status{font-size:10px;color:#8592ad;letter-spacing:.16em;text-transform:uppercase;text-align:center;white-space:nowrap}.status::before{content:"●";color:var(--good);margin-right:6px;text-shadow:0 0 8px var(--good);animation:statusBlink 1.6s ease-in-out infinite}@keyframes statusBlink{50%{opacity:.28}}
.tools{display:flex;justify-content:flex-end;gap:6px}
.icon-btn,.mini-btn,.preset-btn,.setup-btn{border:1px solid var(--line);background:linear-gradient(180deg,#182031,#0b1018);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 7px 18px rgba(0,0,0,.2);position:relative;overflow:hidden}
.icon-btn::before,.mini-btn::before,.preset-btn::before,.setup-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 15%,rgba(255,255,255,.12),transparent 65%);transform:translateX(-130%);transition:.35s}
.icon-btn:active::before,.mini-btn:active::before,.preset-btn:active::before,.setup-btn:active::before{transform:translateX(130%)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;font-size:18px;cursor:pointer}.icon-btn:active,.mini-btn:active,.preset-btn:active,.setup-btn:active{transform:translateY(1px) scale(.98);filter:brightness(1.25)}
.players{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.players.count-1{grid-template-columns:1fr}.players.count-1 .player-card{grid-column:1}.players.count-2{grid-template-columns:repeat(2,minmax(0,1fr))}.players.count-3 .player-card:first-child{grid-column:1/-1}
.player-card{--pc:#66e3ff;position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid color-mix(in srgb,var(--pc) 34%,#263046);border-radius:22px;background:
linear-gradient(115deg,transparent 0 47%,color-mix(in srgb,var(--pc) 4%,transparent) 48% 52%,transparent 53%),
radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--pc) 14%,transparent),transparent 45%),
linear-gradient(155deg,#151c2b 0%,#090d14 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 0 45px color-mix(in srgb,var(--pc) 5%,transparent),0 14px 34px rgba(0,0,0,.28);transition:border-color .25s,filter .25s;animation:cardBreathe 4.5s ease-in-out infinite}
.player-card:nth-child(2n){animation-delay:-1.5s}.player-card:nth-child(3n){animation-delay:-2.8s}
@keyframes cardBreathe{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 0 58px color-mix(in srgb,var(--pc) 8%,transparent),0 16px 38px rgba(0,0,0,.32)}}
.player-card::after{content:"";position:absolute;inset:-70%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 78%,color-mix(in srgb,var(--pc) 9%,transparent) 86%,transparent 94%);animation:cardSweep 7s linear infinite;z-index:0}@keyframes cardSweep{to{transform:rotate(360deg)}}
.player-card.critical{border-color:rgba(255,73,104,.68);animation:criticalCard .85s ease-in-out infinite alternate}.player-card.critical::after{background:conic-gradient(from 0deg,transparent 0 76%,rgba(255,73,104,.12) 86%,transparent 94%)}
@keyframes criticalCard{to{box-shadow:inset 0 0 50px rgba(255,35,67,.14),0 0 22px rgba(255,73,104,.14),0 15px 34px rgba(0,0,0,.3)}}
.player-card.surge{border-color:color-mix(in srgb,var(--pc) 72%,white);box-shadow:inset 0 0 50px color-mix(in srgb,var(--pc) 10%,transparent),0 0 26px color-mix(in srgb,var(--pc) 12%,transparent)}
.player-card.ko{filter:saturate(.25) brightness(.68);border-color:#5d2530;animation:koHum .18s steps(2,end) 5}.player-card.ko::before{content:"SYSTEM DOWN";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(30px,9vw,80px);font-weight:1000;letter-spacing:.14em;color:rgba(255,73,104,.16);transform:rotate(-8deg);z-index:4;text-shadow:3px 0 rgba(89,238,255,.12),-3px 0 rgba(255,0,87,.1)}@keyframes koHum{50%{transform:translate(2px,-1px)}}
.card-head{position:absolute;left:10px;right:10px;top:8px;height:34px;display:flex;align-items:center;gap:6px;z-index:8}.name-input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:#fff;font-weight:950;font-size:13px;letter-spacing:.09em;text-transform:uppercase;padding:4px 2px;text-overflow:ellipsis;text-shadow:0 2px 8px #000}.color-dot{width:19px;height:19px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:var(--pc);box-shadow:0 0 8px var(--pc),0 0 20px color-mix(in srgb,var(--pc) 65%,transparent);cursor:pointer;flex:0 0 auto;animation:orb 2.2s ease-in-out infinite}@keyframes orb{50%{transform:scale(.86);box-shadow:0 0 3px var(--pc),0 0 10px var(--pc)}}
.remove-player{width:27px;height:27px;border-radius:9px;border:1px solid #2b3447;background:#0d131d;color:#8c98b2;font-weight:900;cursor:pointer}
.health-zone{position:absolute;inset:39px 7px 48px;display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:stretch;z-index:6}.tap-zone{border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}.tap-zone::after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;border:1px solid currentColor;opacity:0;transform:scale(.25)}.tap-zone:active::after{animation:tapRing .35s ease-out}@keyframes tapRing{0%{opacity:.6;transform:scale(.25)}100%{opacity:0;transform:scale(1.35)}}
.tap-zone.minus{color:var(--bad)}.tap-zone.plus{color:var(--good)}.tap-zone .symbol{font-size:clamp(31px,7vw,56px);font-weight:220;opacity:.6;transition:.12s transform,.12s opacity;text-shadow:0 0 15px currentColor}.tap-zone:active .symbol{transform:scale(1.42);opacity:1}
.life-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;pointer-events:none;position:relative;isolation:isolate}.core-ring{position:absolute;width:min(31vw,145px);aspect-ratio:1;border-radius:50%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 18%,color-mix(in srgb,var(--pc) 85%,white) 23%,transparent 28% 58%,color-mix(in srgb,var(--pc) 55%,transparent) 64%,transparent 70%);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--pc) 55%,transparent));opacity:.42;animation:ringSpin 7s linear infinite}.core-ring::before,.core-ring::after{content:"";position:absolute;border-radius:50%;inset:9%;border:1px dashed color-mix(in srgb,var(--pc) 52%,transparent);animation:ringSpin 11s linear infinite reverse}.core-ring::after{inset:20%;border-style:solid;opacity:.28;box-shadow:inset 0 0 22px color-mix(in srgb,var(--pc) 22%,transparent)}@keyframes ringSpin{to{transform:rotate(360deg)}}
.critical .core-ring{background:conic-gradient(from 0deg,transparent 0 13%,#ff4968 19%,transparent 25% 52%,#ff233f 59%,transparent 65%);filter:drop-shadow(0 0 10px rgba(255,73,104,.65));animation-duration:1.6s}.life{font-variant-numeric:tabular-nums lining-nums;font-size:clamp(64px,18vw,142px);line-height:.82;font-weight:1000;letter-spacing:-.07em;text-shadow:0 4px 18px rgba(0,0,0,.55),0 0 24px color-mix(in srgb,var(--pc) 12%,transparent);max-width:100%;position:relative;z-index:2}.life.bump{animation:lifeBump .35s cubic-bezier(.2,1.7,.3,1)}.life.damage-bump{animation:damageBump .28s cubic-bezier(.2,1.6,.3,1)}@keyframes lifeBump{0%{transform:scale(.7) rotate(-3deg);filter:brightness(1.7)}60%{transform:scale(1.14) rotate(1deg)}100%{transform:scale(1)}}@keyframes damageBump{0%{transform:scale(1.25) skewX(-5deg);color:#fff}40%{transform:scale(.86) skewX(4deg);color:#ff758d}100%{transform:scale(1)}}
.count-4 .life,.count-5 .life,.count-6 .life{font-size:clamp(48px,13vw,92px)}.count-4 .core-ring,.count-5 .core-ring,.count-6 .core-ring{width:min(23vw,105px)}
.life-label{margin-top:8px;font-size:9px;font-weight:950;letter-spacing:.26em;color:var(--muted)}.critical-label{position:absolute;bottom:5%;font-size:9px;font-weight:1000;letter-spacing:.2em;color:#ff6c82;opacity:0;text-shadow:0 0 10px #ff4968}.critical .critical-label{opacity:1;animation:critText .55s steps(2,end) infinite}@keyframes critText{50%{opacity:.35}}
.delta{position:absolute;top:14%;left:50%;translate:-50% -50%;font-size:clamp(22px,5vw,34px);font-weight:1000;opacity:0;pointer-events:none;z-index:12;text-shadow:0 2px 12px #000}.delta.show{animation:floatDelta .76s cubic-bezier(.13,.78,.22,1) forwards}@keyframes floatDelta{0%{opacity:0;transform:translateY(16px) scale(.45) rotate(-8deg)}18%{opacity:1;transform:translateY(0) scale(1.22) rotate(2deg)}100%{opacity:0;transform:translateY(-60px) scale(.9) rotate(0)}}
.combo{position:absolute;right:7%;top:17%;font-size:10px;font-weight:1000;letter-spacing:.1em;color:#fff;opacity:0;z-index:13}.combo.show{animation:comboPop .65s ease-out}@keyframes comboPop{0%{opacity:0;transform:scale(.4) rotate(8deg)}20%{opacity:1;transform:scale(1.18) rotate(-2deg)}100%{opacity:0;transform:translateY(-15px) scale(.9)}}
.player-card.hit{animation:hit .28s ease!important}.player-card.heal{animation:heal .38s ease!important}.player-card.big-hit{animation:bigHit .42s cubic-bezier(.16,.84,.25,1)!important}.player-card.big-heal{animation:bigHeal .52s cubic-bezier(.16,.84,.25,1)!important}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}45%{transform:translateX(5px);filter:brightness(1.3)}70%{transform:translateX(-2px)}}@keyframes heal{40%{filter:brightness(1.32);box-shadow:inset 0 0 55px rgba(99,255,181,.18),0 0 20px rgba(99,255,181,.1)}}@keyframes bigHit{0%,100%{transform:translate(0) scale(1)}16%{transform:translate(-8px,2px) scale(.985)}34%{transform:translate(8px,-2px) scale(1.015);filter:brightness(1.45)}52%{transform:translate(-5px,1px)}74%{transform:translate(3px,-1px)}}@keyframes bigHeal{40%{transform:scale(1.018);filter:brightness(1.55);box-shadow:inset 0 0 75px rgba(99,255,181,.26),0 0 35px rgba(99,255,181,.14)}}
.shockwave{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;translate:-50% -50%;z-index:20;pointer-events:none;animation:shock .55s ease-out forwards}@keyframes shock{0%{opacity:.9;transform:scale(.25)}100%{opacity:0;transform:scale(5.2);border-width:.5px}}
.meter{position:absolute;left:12px;right:12px;bottom:42px;height:5px;border-radius:999px;background:#1d2635;overflow:hidden;z-index:7}.meter::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);width:35%;transform:translateX(-150%);animation:meterScan 2.7s ease-in-out infinite}@keyframes meterScan{65%,100%{transform:translateX(420%)}}.meter-fill{height:100%;width:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 60%,#fff),var(--pc));box-shadow:0 0 10px var(--pc);transition:width .38s cubic-bezier(.2,.8,.2,1)}.critical .meter-fill{background:linear-gradient(90deg,#ff233f,#ff778c);box-shadow:0 0 11px #ff4968}
.quick-row{position:absolute;left:8px;right:8px;bottom:7px;height:29px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:5px;z-index:8}.qbtn{border:1px solid #293449;background:rgba(10,15,24,.88);border-radius:9px;font-size:11px;font-weight:950;color:#aab5cc;cursor:pointer;min-width:0;transition:.12s transform,.12s filter}.qbtn:active{transform:scale(.92);filter:brightness(1.55)}.qbtn.bad{color:#ff8396}.qbtn.good{color:#78ffc1}.qbtn.stat{padding:0 7px;color:#e0e5f3;white-space:nowrap}
.footer{height:46px;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.mini-btn{border-radius:13px;font-size:12px;font-weight:900;letter-spacing:.04em;cursor:pointer}.mini-btn.primary{border-color:#326c78;background:linear-gradient(180deg,#163b44,#0b1920);color:#91f2ff;box-shadow:inset 0 0 18px rgba(101,232,255,.05),0 0 16px rgba(101,232,255,.06)}
.drawer{position:absolute;left:10px;right:10px;bottom:calc(var(--safe-bottom) + 53px);z-index:50;background:rgba(9,14,23,.985);border:1px solid #2a354a;border-radius:18px;padding:12px;box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 0 30px rgba(101,232,255,.025);transform:translateY(14px) scale(.985);opacity:0;pointer-events:none;transition:.2s ease}.drawer.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}.drawer-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:950;letter-spacing:.11em;margin-bottom:9px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #202b3d}.setting-row:first-of-type{border-top:0}.setting-label{font-size:12px;color:#bcc6d9}.preset-wrap{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.preset-btn{padding:7px 9px;font-size:11px;font-weight:900;cursor:pointer}.preset-btn.active{border-color:#4f9bad;color:#98f2ff}.toggle{width:42px;height:24px;border-radius:999px;border:1px solid #303b50;background:#131b29;padding:2px;cursor:pointer}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#697791;transition:.18s}.toggle.on i{transform:translateX(17px);background:var(--good);box-shadow:0 0 12px rgba(99,255,181,.55)}
.setup{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 10%,#123444,#05070c 42%);display:grid;place-items:center;padding:24px;overflow:hidden}.setup::before{content:"";position:absolute;width:62vmax;height:62vmax;border:1px solid rgba(101,232,255,.08);border-radius:50%;box-shadow:0 0 0 9vmax rgba(101,232,255,.015),0 0 0 18vmax rgba(101,232,255,.01);animation:ringSpin 22s linear infinite}.setup.hidden{display:none}.setup-card{position:relative;width:min(480px,100%);border:1px solid #2b3a50;border-radius:26px;background:rgba(10,16,27,.95);padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 0 60px rgba(101,232,255,.03);backdrop-filter:blur(16px)}.logo-mark{width:70px;height:70px;border-radius:22px;margin-bottom:18px;display:grid;place-items:center;font-size:27px;font-weight:1000;background:conic-gradient(from 180deg,#132734,#193d47,#101724,#183540,#132734);border:1px solid #44778a;color:#9af4ff;box-shadow:0 0 24px rgba(101,232,255,.16);animation:logoFloat 2.8s ease-in-out infinite}@keyframes logoFloat{50%{transform:translateY(-5px) rotate(2deg);box-shadow:0 8px 32px rgba(101,232,255,.24)}}.setup h1{font-size:30px;line-height:1;margin:0 0 7px;font-weight:1000;letter-spacing:-.04em}.setup h1 span{color:var(--accent);text-shadow:0 0 15px rgba(101,232,255,.35)}.setup p{margin:0 0 22px;color:#8e9ab3;font-size:13px;line-height:1.45}.setup-label{font-size:11px;font-weight:900;letter-spacing:.14em;color:#8794ad;margin:15px 0 8px}.choice-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.setup-btn{height:46px;font-weight:1000;cursor:pointer}.setup-btn.active{border-color:#52a2b5;background:#143742;color:#9af4ff;box-shadow:inset 0 0 18px rgba(101,232,255,.08),0 0 14px rgba(101,232,255,.06)}.start-btn{margin-top:20px;width:100%;height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,#59e6ff,#7affba);color:#041015;font-weight:1000;letter-spacing:.09em;cursor:pointer;box-shadow:0 12px 35px rgba(78,225,255,.2);position:relative;overflow:hidden}.start-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55),transparent 80%);transform:translateX(-120%);animation:startSweep 2.2s ease-in-out infinite}@keyframes startSweep{55%,100%{transform:translateX(120%)}}
.toast{position:fixed;left:50%;top:calc(var(--safe-top) + 52px);transform:translate(-50%,-10px) scale(.92);z-index:700;padding:9px 14px;border-radius:999px;background:#111a28;border:1px solid #34455f;color:#e9efff;font-size:11px;font-weight:950;letter-spacing:.07em;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 8px 30px rgba(0,0,0,.35)}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:650;opacity:0}.flash.damage{background:radial-gradient(circle,transparent 32%,rgba(255,28,67,.26))}.flash.heal{background:radial-gradient(circle,transparent 35%,rgba(62,255,172,.17))}.flash.go{animation:screenFlash .42s ease-out}@keyframes screenFlash{0%{opacity:0}24%{opacity:1}100%{opacity:0}}
.glitch{position:fixed;inset:0;z-index:680;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,73,104,.08) 8px 10px);mix-blend-mode:screen}.glitch.go{animation:glitchScreen .55s steps(2,end)}@keyframes glitchScreen{0%{opacity:0}15%{opacity:.9;transform:translateX(4px)}30%{transform:translateX(-7px)}45%{opacity:.3;transform:translateX(3px)}70%{opacity:.8;transform:translateX(-2px)}100%{opacity:0;transform:none}}
@media (orientation:landscape) and (max-height:600px){#app{gap:6px}.topbar{height:38px}.icon-btn{height:34px;width:34px}.footer{height:38px}.health-zone{inset:34px 6px 39px}.quick-row{height:25px}.meter{bottom:34px}.life{font-size:clamp(48px,13vh,95px)}.count-4 .life,.count-5 .life,.count-6 .life{font-size:clamp(42px,11vh,76px)}.core-ring{width:min(25vh,120px)}}
@media (max-width:420px){.brand{font-size:12px}.brand b{display:none}.status{display:none}.topbar{grid-template-columns:1fr auto}.players{gap:6px}.player-card{border-radius:18px}.quick-row{gap:3px}.qbtn{font-size:10px}.choice-grid{gap:4px}.setup-card{padding:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
<header class="topbar">
<div class="brand"><span>VITAL</span>//CORE <b>OVERDRIVE</b></div>
<div class="status" id="statusText">SYSTEM NOMINAL</div>
<div class="tools">
<button class="icon-btn" id="undoBtn" aria-label="Undo" title="Undo">↶</button>
<button class="icon-btn" id="fullBtn" aria-label="Fullscreen" title="Fullscreen">⛶</button>
<button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
</div>
</header>
<main class="players count-2" id="players"></main>
<footer class="footer">
<button class="mini-btn" id="removeBtn">− PLAYER</button>
<button class="mini-btn primary" id="resetBtn">RESET CORE</button>
<button class="mini-btn" id="addBtn">+ PLAYER</button>
</footer>
<section class="drawer" id="drawer" aria-label="Settings">
<div class="drawer-title"><span>CORE CONFIGURATION</span><button class="remove-player" id="closeDrawer">×</button></div>
<div class="setting-row"><span class="setting-label">Starting health</span><div class="preset-wrap" id="presets"></div></div>
<div class="setting-row"><span class="setting-label">Sound feedback</span><button class="toggle" id="soundToggle" aria-label="Toggle sound"><i></i></button></div>
<div class="setting-row"><span class="setting-label">Haptic feedback</span><button class="toggle" id="hapticToggle" aria-label="Toggle haptics"><i></i></button></div>
<div class="setting-row"><span class="setting-label">Keep values at 0+</span><button class="toggle" id="floorToggle" aria-label="Toggle zero floor"><i></i></button></div>
</section>
</div>
<div class="setup" id="setup"><div class="setup-card">
<div class="logo-mark">V+</div><h1><span>VITAL</span>//CORE</h1>
<p>Tabletop life tracking with arcade-grade impact. Built for thumbs, chaos, and absolutely irresponsible amounts of visual feedback.</p>
<div class="setup-label">PLAYERS</div><div class="choice-grid" id="playerChoices"></div>
<div class="setup-label">STARTING HEALTH</div><div class="choice-grid" id="healthChoices"></div>
<button class="start-btn" id="startBtn">ENGAGE OVERDRIVE</button>
</div></div>
<div class="toast" id="toast"></div><div class="flash" id="flash"></div><div class="glitch" id="glitch"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY='vitalCoreState_v1';
const COLORS=['#66e3ff','#ff657d','#77ffb4','#b87cff','#ffc85c','#ff78d1','#77a7ff','#ff8b55'];
const PRESETS=[20,30,40,50,100];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const defaultState=()=>({startHealth:40,players:Array.from({length:2},(_,i)=>({id:uid(),name:`PLAYER ${i+1}`,health:40,color:COLORS[i],poison:0})),history:[],sound:false,haptic:true,floorZero:false,setupDone:false});
function loadState(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!p||!Array.isArray(p.players))return defaultState();return{...defaultState(),...p,players:p.players.slice(0,6).map((x,i)=>({id:x.id||uid(),name:x.name||`PLAYER ${i+1}`,health:Number.isFinite(x.health)?x.health:40,color:x.color||COLORS[i],poison:Number.isFinite(x.poison)?x.poison:0})),history:[]}}catch(e){return defaultState()}}
let state=loadState(),setupPlayers=state.players.length||2,setupHealth=state.startHealth||40,audioCtx=null,toastTimer=null;
let combo={id:null,count:0,last:0,timer:null};
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,history:state.history.slice(-30)}))}
function snapshot(){state.history.push(state.players.map(p=>({...p})));if(state.history.length>30)state.history.shift()}
function getPlayer(id){return state.players.find(p=>p.id===id)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setToggle(sel,on){$(sel).classList.toggle('on',!!on)}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1150)}
function screenFlash(kind='damage'){const f=$('#flash');f.className=`flash ${kind}`;void f.offsetWidth;f.classList.add('go')}
function glitch(){const g=$('#glitch');g.classList.remove('go');void g.offsetWidth;g.classList.add('go')}
function feedback(kind='tap'){
 if(state.haptic&&navigator.vibrate)navigator.vibrate(kind==='damage'?[12,18,10]:kind==='bigDamage'?[18,20,28]:kind==='ko'?[26,25,50]:10);
 if(!state.sound)return;
 try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const now=audioCtx.currentTime;let a=280,b=210,d=.08;if(kind==='heal'){a=610;b=880}.0;if(kind==='bigHeal'){a=430;b=980;d=.13}if(kind==='bigDamage'){a=170;b=90;d=.13}if(kind==='ko'){a=120;b=48;d=.22}o.type=kind==='ko'?'sawtooth':'triangle';o.frequency.setValueAtTime(a,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,b),now+d);g.gain.setValueAtTime(.04,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.start(now);o.stop(now+d+.01)}catch(e){}
}
function renderSetup(){
 $('#playerChoices').innerHTML=[1,2,3,4,5,6].map(n=>`<button class="setup-btn ${setupPlayers===n?'active':''}" data-players="${n}">${n}</button>`).join('');
 $('#healthChoices').innerHTML=PRESETS.map(n=>`<button class="setup-btn ${setupHealth===n?'active':''}" data-health="${n}">${n}</button>`).join('')+`<button class="setup-btn ${!PRESETS.includes(setupHealth)?'active':''}" data-health="custom">#</button>`;
}
function renderPresets(){$('#presets').innerHTML=PRESETS.map(n=>`<button class="preset-btn ${state.startHealth===n?'active':''}" data-preset="${n}">${n}</button>`).join('')}
function cardHTML(p){
 const pct=state.startHealth>0?Math.max(0,Math.min(100,p.health/state.startHealth*100)):0;
 const critical=p.health>0&&p.health<=Math.max(1,state.startHealth*.25),surge=p.health>state.startHealth*1.25;
 return `<article class="player-card ${p.health<=0?'ko':''} ${critical?'critical':''} ${surge?'surge':''}" data-id="${p.id}" style="--pc:${p.color}">
 <div class="card-head"><button class="color-dot" data-action="color" title="Change color"></button><input class="name-input" maxlength="18" value="${escapeHtml(p.name)}" aria-label="Player name" data-action="name"><button class="remove-player" data-action="remove" title="Remove player">×</button></div>
 <div class="health-zone"><button class="tap-zone minus" data-action="change" data-delta="-1" aria-label="Subtract 1"><span class="symbol">−</span></button>
 <div class="life-wrap"><div class="core-ring"></div><div class="delta"></div><div class="combo"></div><div class="life">${p.health}</div><div class="life-label">VITAL CORE</div><div class="critical-label">⚠ CRITICAL ⚠</div></div>
 <button class="tap-zone plus" data-action="change" data-delta="1" aria-label="Add 1"><span class="symbol">+</span></button></div>
 <div class="meter"><div class="meter-fill" style="width:${pct}%"></div></div>
 <div class="quick-row"><button class="qbtn bad" data-action="change" data-delta="-5">−5</button><button class="qbtn bad" data-action="change" data-delta="-10">−10</button><button class="qbtn stat" data-action="poison" title="Poison / alternate counter">☠ ${p.poison}</button><button class="qbtn good" data-action="change" data-delta="10">+10</button><button class="qbtn good" data-action="change" data-delta="5">+5</button></div>
 </article>`;
}
function render(){
 const host=$('#players');host.className=`players count-${state.players.length}`;host.innerHTML=state.players.map(cardHTML).join('');
 $('#statusText').textContent=`${state.players.length} CORE${state.players.length===1?'':'S'} · BASE ${state.startHealth}`;
 $('#undoBtn').style.opacity=state.history.length?'1':'.38';$('#addBtn').disabled=state.players.length>=6;$('#removeBtn').disabled=state.players.length<=1;$('#addBtn').style.opacity=state.players.length>=6?'.35':'1';$('#removeBtn').style.opacity=state.players.length<=1?'.35':'1';renderPresets();setToggle('#soundToggle',state.sound);setToggle('#hapticToggle',state.haptic);setToggle('#floorToggle',state.floorZero);
}
function comboTick(id,delta,card){
 const now=performance.now();if(combo.id===id&&now-combo.last<780)combo.count++;else combo.count=1;combo.id=id;combo.last=now;clearTimeout(combo.timer);combo.timer=setTimeout(()=>{combo.count=0;combo.id=null},900);
 if(combo.count>=3&&card){const el=card.querySelector('.combo');el.textContent=`${combo.count}× ${delta<0?'HIT':'BOOST'}`;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
}
function shock(card,color){if(!card)return;const s=document.createElement('div');s.className='shockwave';s.style.color=color;card.appendChild(s);setTimeout(()=>s.remove(),600)}
function changeHealth(id,delta){
 const p=getPlayer(id);if(!p)return;snapshot();const before=p.health;p.health+=delta;if(state.floorZero)p.health=Math.max(0,p.health);p.health=Math.max(-999,Math.min(9999,p.health));const actual=p.health-before;save();render();
 const card=document.querySelector(`.player-card[data-id="${id}"]`);if(card){const big=Math.abs(actual)>=5;card.classList.add(actual<0?(big?'big-hit':'hit'):(big?'big-heal':'heal'));const life=card.querySelector('.life');life.classList.add(actual<0?'damage-bump':'bump');const d=card.querySelector('.delta');if(d&&actual!==0){d.textContent=actual>0?`+${actual}`:String(actual);d.style.color=actual>0?'var(--good)':'var(--bad)';d.classList.add('show')}shock(card,actual<0?'var(--bad)':'var(--good)');comboTick(id,actual,card);burst(card,actual<0?'#ff4968':'#63ffb5',big?34:18,big?1.35:1)}
 if(before>0&&p.health<=0){feedback('ko');screenFlash('damage');glitch();burst(card,'#ff264d',70,1.9);toast(`${p.name} // CORE DOWN`)}else if(Math.abs(actual)>=5){feedback(actual<0?'bigDamage':'bigHeal');screenFlash(actual<0?'damage':'heal')}else feedback(actual<0?'damage':'heal');
}
function setPlayerCount(n){n=Math.max(1,Math.min(6,n));snapshot();while(state.players.length<n){const i=state.players.length;state.players.push({id:uid(),name:`PLAYER ${i+1}`,health:state.startHealth,color:COLORS[i%COLORS.length],poison:0})}state.players=state.players.slice(0,n);save();render()}
function resetAll(newStart=state.startHealth){snapshot();state.startHealth=Number(newStart)||40;state.players.forEach(p=>{p.health=state.startHealth;p.poison=0});save();render();feedback('bigHeal');screenFlash('heal');toast(`CORE RESTORED // ${state.startHealth}`);document.querySelectorAll('.player-card').forEach(c=>burst(c,'#63ffb5',20,1))}
function undo(){const prev=state.history.pop();if(!prev){toast('NO HISTORY BUFFER');return}state.players=prev.map(p=>({...p}));save();render();feedback();toast('STATE RESTORED')}
function cycleColor(p){const idx=Math.max(0,COLORS.indexOf(p.color));p.color=COLORS[(idx+1)%COLORS.length]}
let suppressZoneClick=false,pressTimer=null;
document.addEventListener('click',e=>{
 const action=e.target.closest('[data-action]');if(action){const card=action.closest('.player-card'),p=card?getPlayer(card.dataset.id):null;if(action.dataset.action==='change'&&p){if(action.classList.contains('tap-zone')&&suppressZoneClick)suppressZoneClick=false;else changeHealth(p.id,Number(action.dataset.delta))}if(action.dataset.action==='color'&&p){snapshot();cycleColor(p);save();render();feedback()}if(action.dataset.action==='remove'&&p&&state.players.length>1){snapshot();state.players=state.players.filter(x=>x.id!==p.id);save();render();feedback()}if(action.dataset.action==='poison'&&p){snapshot();p.poison=(p.poison+1)%11;save();render();feedback(p.poison>=10?'ko':'tap');if(p.poison>=10){screenFlash('damage');toast(`${p.name} // 10 POISON`)}}}
 const pc=e.target.closest('[data-players]');if(pc){setupPlayers=Number(pc.dataset.players);renderSetup()}
 const hc=e.target.closest('[data-health]');if(hc){if(hc.dataset.health==='custom'){const raw=prompt('Starting health (1–999):',String(setupHealth)),n=Number(raw);if(Number.isFinite(n)&&n>=1&&n<=999)setupHealth=Math.round(n)}else setupHealth=Number(hc.dataset.health);renderSetup()}
 const pr=e.target.closest('[data-preset]');if(pr){const n=Number(pr.dataset.preset);if(confirm(`Set everyone to ${n} health?`))resetAll(n)}
});
document.addEventListener('change',e=>{if(e.target.matches('.name-input')){const card=e.target.closest('.player-card'),p=card&&getPlayer(card.dataset.id);if(p){p.name=e.target.value.trim()||'PLAYER';save()}}});
document.addEventListener('pointerdown',e=>{const btn=e.target.closest('.tap-zone[data-action="change"]');if(!btn)return;suppressZoneClick=false;pressTimer=setTimeout(()=>{suppressZoneClick=true;const card=btn.closest('.player-card');if(card)changeHealth(card.dataset.id,Number(btn.dataset.delta)*5)},520)});
document.addEventListener('pointerup',()=>clearTimeout(pressTimer));document.addEventListener('pointercancel',()=>clearTimeout(pressTimer));document.addEventListener('contextmenu',e=>{if(e.target.closest('.tap-zone'))e.preventDefault()});
$('#startBtn').addEventListener('click',()=>{state.startHealth=setupHealth;state.players=Array.from({length:setupPlayers},(_,i)=>({id:uid(),name:`PLAYER ${i+1}`,health:setupHealth,color:COLORS[i],poison:0}));state.history=[];state.setupDone=true;save();render();$('#setup').classList.add('hidden');feedback('bigHeal');screenFlash('heal');setTimeout(()=>document.querySelectorAll('.player-card').forEach(c=>burst(c,c.style.getPropertyValue('--pc')||'#65e8ff',28,1.3)),80)});
$('#undoBtn').addEventListener('click',undo);$('#addBtn').addEventListener('click',()=>{if(state.players.length<6)setPlayerCount(state.players.length+1)});$('#removeBtn').addEventListener('click',()=>{if(state.players.length>1){snapshot();state.players.pop();save();render();feedback()}});$('#resetBtn').addEventListener('click',()=>{if(confirm(`Reset all players to ${state.startHealth}?`))resetAll()});$('#settingsBtn').addEventListener('click',()=>$('#drawer').classList.toggle('open'));$('#closeDrawer').addEventListener('click',()=>$('#drawer').classList.remove('open'));$('#soundToggle').addEventListener('click',()=>{state.sound=!state.sound;save();render();feedback('heal')});$('#hapticToggle').addEventListener('click',()=>{state.haptic=!state.haptic;save();render();feedback()});$('#floorToggle').addEventListener('click',()=>{state.floorZero=!state.floorZero;save();render();toast(state.floorZero?'ZERO FLOOR // ON':'NEGATIVE HEALTH // ON')});
$('#fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('FULLSCREEN UNAVAILABLE')}});
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if(e.key==='Escape')$('#drawer').classList.remove('open');const map={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5};if(map[e.key]!==undefined&&state.players[map[e.key]])changeHealth(state.players[map[e.key]].id,e.shiftKey?1:-1)});

// Lightweight particle engine for hits/heals.
const canvas=$('#fx'),ctx=canvas.getContext('2d');let particles=[];
function resizeFx(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}resizeFx();addEventListener('resize',resizeFx);
function burst(card,color,count=20,power=1){if(!card)return;const r=card.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.48;for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=(1.2+Math.random()*4.4)*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(Math.random()*1.4),life:1,decay:.022+Math.random()*.025,size:1+Math.random()*3.2,color,trail:Math.random()>.68})}}
function animateFx(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.972;p.vy=p.vy*.972+.025;p.life-=p.decay;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowBlur=p.trail?14:5;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*Math.max(.3,p.life),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(animateFx)}animateFx();
renderSetup();render();if(state.setupDone)$('#setup').classList.add('hidden');
})();
</script>
</body>
</html>
