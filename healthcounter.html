<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020503">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VITAL//CORE</title>
<style>
:root{--bg:#020503;--line:#27354a;--text:#f6fbff;--muted:#8ea0b8;--good:#72ff9a;--bad:#ff5674;--accent:#65e8ff;--top:max(10px,env(safe-area-inset-top));--bot:max(10px,env(safe-area-inset-bottom))}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button,input{font:inherit;color:inherit}body{isolation:isolate}
#pixelBg{position:fixed;inset:0;width:100%;height:100%;z-index:-6;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;opacity:.98}
body:before{content:"";position:fixed;inset:0;z-index:-5;pointer-events:none;background:radial-gradient(circle at 50% 38%,transparent 0 18%,rgba(1,8,4,.08) 42%,rgba(1,5,3,.7) 100%),linear-gradient(180deg,rgba(0,3,2,.22),rgba(0,3,2,.02) 38%,rgba(0,3,2,.12) 72%,rgba(0,3,2,.75));}
body:after{content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.085;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#app{height:100dvh;display:flex;flex-direction:column;padding:var(--top) 10px var(--bot);gap:8px;position:relative;z-index:1}
.top{min-height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.brand{font-size:15px;font-weight:1000;letter-spacing:.09em;white-space:nowrap;text-shadow:0 2px 10px #000}.brand span{color:var(--accent);text-shadow:0 0 10px rgba(101,232,255,.72)}.brand b{color:#8dffa3;font-size:9px;letter-spacing:.15em;margin-left:6px}.status{text-align:center;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#9fceaa;white-space:nowrap;text-shadow:0 2px 8px #000}.status:before{content:"●";color:var(--good);margin-right:6px;text-shadow:0 0 8px var(--good)}.tools{display:flex;justify-content:flex-end;gap:6px}
.icon,.footbtn,.setbtn,.quick{border:1px solid var(--line);background:linear-gradient(180deg,rgba(18,27,39,.86),rgba(7,12,18,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 7px 18px rgba(0,0,0,.26);backdrop-filter:blur(7px)}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}.icon:active,.footbtn:active,.setbtn:active,.quick:active{transform:translateY(1px) scale(.98);filter:brightness(1.2)}
#players{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}#players.c1{grid-template-columns:1fr}#players.c3 .card:first-child{grid-column:1/-1}
.card{--pc:#66e3ff;position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:20px;border:1px solid color-mix(in srgb,var(--pc) 33%,#273449);background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--pc) 10%,transparent),transparent 45%),linear-gradient(155deg,rgba(13,20,31,.72),rgba(5,9,14,.81));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 40px color-mix(in srgb,var(--pc) 5%,transparent),0 13px 30px rgba(0,0,0,.28);backdrop-filter:blur(5px)}
.card:after{content:"";position:absolute;inset:-70%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 78%,color-mix(in srgb,var(--pc) 9%,transparent) 86%,transparent 94%);animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.card.critical{border-color:rgba(255,86,116,.7);box-shadow:inset 0 0 48px rgba(255,36,70,.12),0 0 22px rgba(255,86,116,.12),0 13px 30px rgba(0,0,0,.28)}.card.ko{filter:saturate(.25) brightness(.67)}.card.ko:before{content:"SYSTEM DOWN";position:absolute;inset:0;display:grid;place-items:center;z-index:6;color:rgba(255,92,122,.16);font-size:clamp(28px,8vw,72px);font-weight:1000;letter-spacing:.13em;transform:rotate(-8deg)}.card.hit{animation:hit .28s ease}.card.heal{animation:heal .34s ease}@keyframes hit{25%{transform:translateX(-5px)}55%{transform:translateX(5px)}}@keyframes heal{45%{filter:brightness(1.24)}}
.head{position:absolute;left:9px;right:9px;top:7px;height:32px;display:flex;align-items:center;gap:6px;z-index:8;padding:2px 5px;border-radius:10px;background:rgba(2,7,11,.28)}.dot{width:18px;height:18px;flex:0 0 auto;border-radius:50%;border:2px solid rgba(255,255,255,.84);background:var(--pc);box-shadow:0 0 9px var(--pc),0 0 20px color-mix(in srgb,var(--pc) 55%,transparent);cursor:pointer}.name{min-width:0;flex:1;border:0;background:transparent;outline:0;color:#fff;font-weight:1000;font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 8px #000}.remove{width:26px;height:26px;border-radius:8px;border:1px solid #2b384e;background:#0b111a;color:#92a1b6;cursor:pointer}
.zone{position:absolute;inset:39px 5px 48px;display:grid;grid-template-columns:.72fr 1.8fr .72fr;z-index:4}.tap{border:0;background:transparent;cursor:pointer;color:inherit;user-select:none;-webkit-user-select:none}.tap span{display:grid;place-items:center;height:100%;font-size:clamp(40px,9vw,72px);font-weight:250;opacity:.65;text-shadow:0 0 16px currentColor}.tap.minus{color:var(--bad)}.tap.plus{color:var(--good)}.tap:active span{transform:scale(1.3);opacity:1}
.core{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.ring{position:absolute;width:min(30vw,140px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 18%,color-mix(in srgb,var(--pc) 86%,white) 23%,transparent 28% 58%,color-mix(in srgb,var(--pc) 55%,transparent) 64%,transparent 70%);opacity:.44;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--pc) 65%,transparent));animation:spin 7s linear infinite}.ring:before,.ring:after{content:"";position:absolute;inset:10%;border-radius:50%;border:1px dashed color-mix(in srgb,var(--pc) 45%,transparent);animation:spin 11s linear infinite reverse}.ring:after{inset:21%;border-style:solid;opacity:.25}.life{position:relative;z-index:2;font-variant-numeric:tabular-nums;font-size:clamp(64px,18vw,142px);line-height:.8;font-weight:1000;letter-spacing:-.07em;text-shadow:0 4px 16px #000,0 0 22px color-mix(in srgb,var(--pc) 18%,transparent)}.meta{margin-top:8px;font-size:10px;font-weight:1000;letter-spacing:.19em;color:#a5c4ae;text-shadow:0 2px 7px #000}.crit{position:absolute;bottom:5%;font-size:9px;font-weight:1000;letter-spacing:.18em;color:#ff8498;opacity:0}.critical .crit{opacity:1}.delta{position:absolute;top:14%;left:50%;translate:-50% -50%;font-size:28px;font-weight:1000;opacity:0;text-shadow:0 2px 12px #000}.delta.show{animation:float .72s ease-out}@keyframes float{0%{opacity:0;transform:translateY(15px) scale(.55)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-52px) scale(.9)}}
.bar{position:absolute;left:15%;right:15%;bottom:40px;height:5px;border-radius:999px;background:rgba(23,33,47,.64);overflow:hidden;z-index:4}.fill{height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 68%,white),var(--pc));box-shadow:0 0 9px var(--pc);transition:width .24s}.critical .fill{background:linear-gradient(90deg,#ff3558,#ff8aa0)}
.row{position:absolute;left:8px;right:8px;bottom:7px;height:29px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:4px;z-index:8}.quick{border-radius:9px;font-size:12px;font-weight:1000;cursor:pointer}.quick.bad{color:#ff91a4}.quick.good{color:#8bffc8}.quick.poison{padding:0 6px;color:#eef5ff;white-space:nowrap}
.foot{min-height:44px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.footbtn{border-radius:13px;font-size:12px;font-weight:1000;cursor:pointer}.footbtn.main{border-color:#34774a;background:linear-gradient(180deg,#153b21,#09170e);color:#99ffb2}
.drawer{position:absolute;left:10px;right:10px;bottom:calc(var(--bot) + 52px);padding:12px;border-radius:18px;border:1px solid #2b394e;background:rgba(8,14,22,.96);box-shadow:0 22px 70px rgba(0,0,0,.62);backdrop-filter:blur(16px);transform:translateY(14px);opacity:0;pointer-events:none;transition:.18s;z-index:60}.drawer.open{transform:none;opacity:1;pointer-events:auto}.drawer-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px;font-weight:1000;letter-spacing:.1em}.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #202b3d;font-size:12px}.setrow:first-of-type{border-top:0}.presets{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.setbtn{padding:7px 9px;border-radius:9px;font-size:11px;font-weight:1000;cursor:pointer}.setbtn.on{border-color:#4a9b5e;color:#a5ffb9}.toggle{width:42px;height:24px;border-radius:999px;border:1px solid #303d52;background:#111a26;padding:2px;cursor:pointer}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#6d7d94;transition:.18s}.toggle.on i{transform:translateX(17px);background:var(--good);box-shadow:0 0 10px rgba(114,255,154,.55)}
.toast{position:fixed;left:50%;top:calc(var(--top) + 52px);translate:-50% 0;z-index:90;padding:9px 14px;border-radius:999px;border:1px solid #33455e;background:#101925;color:#edf5ff;font-size:11px;font-weight:1000;letter-spacing:.07em;opacity:0;transform:translateY(-10px);transition:.18s}.toast.on{opacity:1;transform:none}.flash{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0}.flash.hit{background:radial-gradient(circle,transparent 32%,rgba(255,30,68,.25))}.flash.heal{background:radial-gradient(circle,transparent 35%,rgba(55,255,155,.18))}.flash.go{animation:screenflash .4s ease-out}@keyframes screenflash{25%{opacity:1}100%{opacity:0}}
#players.c1 .life{font-size:clamp(140px,43vw,300px)}#players.c2 .life{font-size:clamp(92px,28vw,210px)}#players.c3 .life{font-size:clamp(82px,24vw,175px)}#players.c4 .life,#players.c5 .life,#players.c6 .life{font-size:clamp(58px,17vw,120px)}#players.c4 .ring,#players.c5 .ring,#players.c6 .ring{width:min(23vw,105px)}
@media(max-width:420px){.status{display:none}.top{grid-template-columns:1fr auto}.brand{font-size:13px}.name{font-size:13px}.quick{font-size:11px}.ring{width:min(28vw,115px)}}
@media(orientation:landscape) and (max-height:620px){#app{gap:5px}.top,.foot{min-height:36px}.icon{width:34px;height:34px}.zone{inset:34px 4px 40px}#players.c1 .life{font-size:clamp(90px,33vh,210px)}#players.c2 .life{font-size:clamp(70px,24vh,155px)}#players.c3 .life,#players.c4 .life,#players.c5 .life,#players.c6 .life{font-size:clamp(50px,18vh,110px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="pixelBg"></canvas><canvas id="fx"></canvas>
<div id="app">
<header class="top"><div class="brand"><span>VITAL</span>//CORE <b>PIXEL//GRID</b></div><div class="status" id="status">system nominal</div><div class="tools"><button class="icon" id="undo" aria-label="Undo">↶</button><button class="icon" id="full" aria-label="Fullscreen">⛶</button><button class="icon" id="gear" aria-label="Settings">⚙</button></div></header>
<main id="players" class="c2"></main>
<footer class="foot"><button class="footbtn" id="removeP">− PLAYER</button><button class="footbtn main" id="reset">RESET CORE</button><button class="footbtn" id="addP">+ PLAYER</button></footer>
<section class="drawer" id="drawer"><div class="drawer-title"><span>CORE CONFIG</span><button class="remove" id="close">×</button></div><div class="setrow"><span>Starting health</span><div class="presets" id="presets"></div></div><div class="setrow"><span>Floor at zero</span><button class="toggle" id="floor"><i></i></button></div><div class="setrow"><span>Haptics</span><button class="toggle" id="haptics"><i></i></button></div><div class="setrow"><span>Sound</span><button class="toggle" id="sound"><i></i></button></div></section>
</div><div class="toast" id="toast"></div><div class="flash" id="flash"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),PRESETS=[20,30,40,50,100],COLORS=['#66e3ff','#ff657d','#77ffb4','#b87cff','#ffc85c','#ff78d1'];
const KEY='vitalCoreState_v1',MIGRATE='vitalcore_px_v2',uid=()=>Math.random().toString(36).slice(2,9);
const fresh=()=>({start:40,floor:false,haptics:true,sound:false,players:[0,1].map(i=>({id:uid(),name:`PLAYER ${i+1}`,life:40,color:COLORS[i],poison:0}))});
function normalize(raw){const base=fresh();if(!raw||typeof raw!=='object')return base;const start=Number.isFinite(+raw.start)?+raw.start:(Number.isFinite(+raw.startHealth)?+raw.startHealth:40);let arr=Array.isArray(raw.players)?raw.players:base.players;arr=arr.slice(0,6).map((p,i)=>({id:p.id||uid(),name:String(p.name||`PLAYER ${i+1}`).slice(0,18),life:Number.isFinite(+p.life)?+p.life:start,color:COLORS.includes(p.color)?p.color:COLORS[i%COLORS.length],poison:Math.max(0,Math.min(10,Number.isFinite(+p.poison)?+p.poison:0))}));return{start,floor:!!raw.floor,haptics:raw.haptics!==false,sound:!!raw.sound,players:arr.length?arr:base.players}}
function load(){try{const old=localStorage.getItem(KEY);if(old)return normalize(JSON.parse(old));const newer=localStorage.getItem(MIGRATE);if(newer){const s=normalize(JSON.parse(newer));localStorage.setItem(KEY,JSON.stringify(s));return s}}catch{}return fresh()}
let state=load(),hist=[],toastTimer=0,holdTimer=0,holdUsed=false,parts=[],audioCtx=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function snap(){hist.push(JSON.stringify(state));if(hist.length>40)hist.shift()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),1100)}function flash(k){const e=$('#flash');e.className=`flash ${k}`;void e.offsetWidth;e.classList.add('go')}function toggle(sel,on){$(sel).classList.toggle('on',!!on)}
function buzz(ms=18){if(state.haptics&&navigator.vibrate)navigator.vibrate(ms)}function beep(up=true,strong=false){if(!state.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=up?(strong?720:610):(strong?155:210);g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.07);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.075)}catch{}}
function card(p){const pct=Math.max(0,Math.min(100,state.start?100*p.life/state.start:0)),crit=p.life>0&&p.life<=Math.max(1,state.start*.25);return `<article class="card ${crit?'critical':''} ${p.life<=0?'ko':''}" data-id="${p.id}" style="--pc:${p.color}"><div class="head"><button class="dot" data-a="color"></button><input class="name" value="${esc(p.name)}" maxlength="18"><button class="remove" data-a="remove">×</button></div><div class="zone"><button class="tap minus" data-a="life" data-v="-1"><span>−</span></button><div class="core"><div class="ring"></div><div class="delta"></div><div class="life">${p.life}</div><div class="meta">VITAL CORE</div><div class="crit">⚠ CRITICAL ⚠</div></div><button class="tap plus" data-a="life" data-v="1"><span>+</span></button></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="row"><button class="quick bad" data-a="life" data-v="-5">−5</button><button class="quick bad" data-a="life" data-v="-10">−10</button><button class="quick poison" data-a="poison">☠ ${p.poison}</button><button class="quick good" data-a="life" data-v="10">+10</button><button class="quick good" data-a="life" data-v="5">+5</button></div></article>`}
function render(){const h=$('#players');h.className='c'+state.players.length;h.innerHTML=state.players.map(card).join('');$('#status').textContent=`${state.players.length} core${state.players.length>1?'s':''} · base ${state.start}`;$('#presets').innerHTML=PRESETS.map(n=>`<button class="setbtn ${n===state.start?'on':''}" data-preset="${n}">${n}</button>`).join('');toggle('#floor',state.floor);toggle('#haptics',state.haptics);toggle('#sound',state.sound);save()}
function burst(el,color,n=18,power=1){if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.48;for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()*2-1)*(2+Math.random()*3)*power,vy:(Math.random()*2-1)*(2+Math.random()*3)*power,life:1,dec:.02+Math.random()*.03,s:1+Math.random()*3,c:color})}
function showDelta(el,v){const d=el.querySelector('.delta');d.textContent=v>0?`+${v}`:v;d.style.color=v>0?'var(--good)':'var(--bad)';d.classList.remove('show');void d.offsetWidth;d.classList.add('show')}
function changeLife(id,v){const p=state.players.find(x=>x.id===id);if(!p)return;snap();const before=p.life;p.life+=v;if(state.floor)p.life=Math.max(0,p.life);p.life=Math.max(-999,Math.min(9999,p.life));render();const el=document.querySelector(`.card[data-id="${id}"]`);if(el){el.classList.add(v<0?'hit':'heal');setTimeout(()=>el.classList.remove('hit','heal'),340);showDelta(el,p.life-before);burst(el,v<0?'#ff5674':'#72ff9a',Math.abs(v)>=5?30:16,Math.abs(v)>=5?1.35:1)}buzz(Math.abs(v)>=5?28:14);beep(v>0,Math.abs(v)>=5);pixelPulse=v<0?-1:1;pixelPulseLife=1;if(before>0&&p.life<=0){flash('hit');toast(`${p.name} // CORE DOWN`)}else if(Math.abs(v)>=5)flash(v<0?'hit':'heal')}
function setPlayers(n){n=Math.max(1,Math.min(6,n));snap();while(state.players.length<n){const i=state.players.length;state.players.push({id:uid(),name:`PLAYER ${i+1}`,life:state.start,color:COLORS[i%COLORS.length],poison:0})}state.players=state.players.slice(0,n);render()}
function reset(start=state.start){snap();state.start=start;state.players.forEach(p=>{p.life=start;p.poison=0});render();flash('heal');buzz(35);beep(true,true);pixelPulse=1;pixelPulseLife=1;toast(`CORE RESET // ${start}`)}
function undo(){const prev=hist.pop();if(!prev)return toast('NO HISTORY');state=normalize(JSON.parse(prev));render();toast('STATE RESTORED')}
$('#undo').onclick=undo;$('#full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('#gear').onclick=()=>$('#drawer').classList.toggle('open');$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#addP').onclick=()=>setPlayers(state.players.length+1);$('#removeP').onclick=()=>state.players.length>1&&setPlayers(state.players.length-1);$('#reset').onclick=()=>confirm(`Reset all to ${state.start}?`)&&reset();
$('#floor').onclick=()=>{state.floor=!state.floor;render();toast(state.floor?'ZERO FLOOR // ON':'NEGATIVE HEALTH // ON')};$('#haptics').onclick=()=>{state.haptics=!state.haptics;render();toast(`HAPTICS // ${state.haptics?'ON':'OFF'}`)};$('#sound').onclick=()=>{state.sound=!state.sound;render();toast(`SOUND // ${state.sound?'ON':'OFF'}`);if(state.sound)beep(true)};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-preset]');if(!t)return;if(t.dataset.preset){reset(+t.dataset.preset);return}const c=t.closest('.card'),id=c?.dataset.id,p=state.players.find(x=>x.id===id);if(!p)return;const a=t.dataset.a;if(a==='life'){if(t.classList.contains('tap')&&holdUsed){holdUsed=false;return}changeLife(id,+t.dataset.v)}else if(a==='color'){p.color=COLORS[(COLORS.indexOf(p.color)+1)%COLORS.length];render()}else if(a==='remove'&&state.players.length>1){snap();state.players=state.players.filter(x=>x.id!==id);render()}else if(a==='poison'){snap();p.poison=(p.poison+1)%11;render();buzz(12);if(p.poison>=10){flash('hit');pixelPulse=-1;pixelPulseLife=1;toast(`${p.name} // 10 POISON`)}}});
document.addEventListener('change',e=>{if(e.target.matches('.name')){const p=state.players.find(x=>x.id===e.target.closest('.card').dataset.id);if(p){p.name=e.target.value.trim()||'PLAYER';save()}}});document.addEventListener('pointerdown',e=>{const t=e.target.closest('.tap[data-a="life"]');if(!t)return;holdUsed=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdUsed=true;changeLife(t.closest('.card').dataset.id,+t.dataset.v*5)},520)});document.addEventListener('pointerup',()=>clearTimeout(holdTimer));document.addEventListener('pointercancel',()=>clearTimeout(holdTimer));document.addEventListener('contextmenu',e=>e.target.closest('.tap')&&e.preventDefault());document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if(e.key==='Escape')$('#drawer').classList.remove('open')});
const fx=$('#fx'),fctx=fx.getContext('2d');function sizeFx(){const d=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*d;fx.height=innerHeight*d;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';fctx.setTransform(d,0,0,d,0,0)}function drawFx(){fctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.02;p.life-=p.dec;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.c;fctx.fillRect(p.x,p.y,p.s*Math.max(.3,p.life),p.s*Math.max(.3,p.life))}fctx.globalAlpha=1;requestAnimationFrame(drawFx)}sizeFx();drawFx();addEventListener('resize',sizeFx);

function sizeBg(){bg.style.width=innerWidth+'px';bg.style.height=innerHeight+'px';w=Math.max(170,Math.floor(innerWidth/4.6));h=Math.max(230,Math.floor(innerHeight/4.6));bg.width=w;bg.height=h;cell=innerWidth<480?5:6;streams=Array.from({length:Math.ceil(w/cell)},(_,i)=>({x:i*cell,y:rnd(-h,h),speed:rnd(.25,.85),len:Math.floor(rnd(5,14))}));stars=Array.from({length:Math.floor(w*.22)},()=>({x:Math.floor(rnd(0,w)),y:Math.floor(rnd(0,h*.44)),p:rnd(0,8)}));far=makeBuildings(0);near=makeBuildings(1);cars=Array.from({length:6},()=>({x:rnd(0,w),y:Math.floor(rnd(h*.72,h*.92)),s:rnd(.18,.5),dir:Math.random()>.5?1:-1}));clouds=Array.from({length:6},()=>({x:rnd(-40,w),y:rnd(h*.08,h*.38),w:rnd(15,38),s:rnd(.015,.05)}))}
function building(b,base,nearLayer,ts){const y=Math.floor(base-b.h),par=nearLayer?1:.45;ctx.fillStyle=nearLayer?'#031007':'#06140a';ctx.fillRect(Math.floor(b.x),y,b.w,b.h);ctx.fillStyle=nearLayer?'rgba(66,255,108,.3)':'rgba(47,157,68,.2)';ctx.fillRect(Math.floor(b.x),y,b.w,1);if(b.roof>.72){ctx.fillRect(Math.floor(b.x+b.w*.45),y-5,1,5);ctx.fillStyle='rgba(130,255,150,.7)';ctx.fillRect(Math.floor(b.x+b.w*.45),y-6,1,1)}else if(b.roof<.12){ctx.fillRect(Math.floor(b.x+2),y-2,Math.max(2,b.w-4),2)}for(let wx=2;wx<b.w-2;wx+=3){for(let wy=3;wy<b.h-3;wy+=4){const hash=(b.seed+wx*7+wy*13)%17,on=(hash+Math.floor(ts*.0007*par))%11<4;ctx.fillStyle=on?(nearLayer?'rgba(143,255,164,.62)':'rgba(86,185,99,.35)'):'rgba(15,42,21,.32)';ctx.fillRect(Math.floor(b.x+wx),y+wy,1,2)}}}
function drawBg(ts=0){if(ts-lastBg<48){requestAnimationFrame(drawBg);return}lastBg=ts;const pulse=pixelPulseLife>0?pixelPulse*pixelPulseLife:0;if(pixelPulseLife>0)pixelPulseLife=Math.max(0,pixelPulseLife-.08);ctx.fillStyle=pulse<0?'#070203':pulse>0?'#020905':'#010402';ctx.fillRect(0,0,w,h);const hz=Math.floor(h*.61),farBase=Math.floor(h*.69),nearBase=Math.floor(h*.78);

const moonX=Math.floor(w*.76),moonY=Math.floor(h*.21),moonR=Math.max(7,Math.floor(w*.055));ctx.fillStyle='rgba(79,255,123,.05)';ctx.fillRect(moonX-moonR-3,moonY-moonR-3,moonR*2+6,moonR*2+6);ctx.strokeStyle='rgba(106,255,139,.38)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(moonX,moonY,moonR,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(106,255,139,.11)';ctx.fillRect(moonX-moonR+2,moonY,moonR*2-4,1);ctx.fillRect(moonX-1,moonY-moonR+2,1,moonR*2-4);
for(const st of streams){st.y+=st.speed;if(st.y-st.len*cell>h){st.y=rnd(-30,0);st.speed=rnd(.25,.85);st.len=Math.floor(rnd(5,14))}for(let j=0;j<st.len;j++){const y=Math.floor(st.y-j*cell);if(y<0||y>h)continue;const fade=1-j/st.len;ctx.font=`${cell}px monospace`;ctx.textBaseline='top';ctx.fillStyle=j===0?`rgba(${pulse<0?'255,105,120':'225,255,228'},.88)`:`rgba(${pulse<0?'255,70,90':'73,255,104'},${.08+fade*.28})`;ctx.fillText(glyph[(j+Math.floor(st.y)+Math.floor(ts*.018))%glyph.length],st.x,y)}}

ctx.fillStyle='rgba(28,255,84,.07)';for(let i=0;i<11;i++){const y=hz+i*i*2;if(y<h)ctx.fillRect(0,y,w,1)}for(let i=0;i<=20;i++){const sx=Math.floor(i/20*w),fx=Math.floor(w/2+(sx-w/2)*1.55);line(sx,h-1,fx,hz,pulse<0?'rgba(255,60,80,.13)':'rgba(60,255,105,.12)')}
