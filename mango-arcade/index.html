<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11101b">
  <meta name="description" content="Walk the floor at Mango Arcade. Ten playable machines and a Magic booster vending machine.">
  <title>Mango Arcade</title>
  <link rel="icon" href="assets/arcade.svg" type="image/svg+xml">
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
  <main id="arcade">
    <div id="view" aria-label="First-person view of the arcade"></div>
    <div class="shade" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><img src="assets/arcade.svg" alt=""><span>Mango <strong>Arcade</strong></span></div>
      <nav aria-label="Arcade controls">
        <button id="sound" class="icon-button" type="button" title="Toggle arcade sound" aria-label="Arcade sound" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4m12 0 4 4m0-4-4 4"/></svg>
        </button>
        <button id="map-button" class="icon-button" type="button" title="Toggle floor map" aria-label="Floor map" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Zm6-2v14m6-12v14"/></svg>
        </button>
        <button id="directory-button" class="action" type="button">Game list</button>
      </nav>
    </header>

    <div id="reticle" aria-hidden="true"></div>
    <div id="prompt" hidden>
      <button id="interact" type="button"><kbd>E</kbd><span><strong id="target-name"></strong><small id="target-action"></small></span></button>
    </div>
    <section class="floor-map" id="floor-map" aria-label="Floor map">
      <canvas id="map" width="172" height="140"></canvas>
    </section>
    <div class="controls-tip" id="controls-tip"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span><span>Drag to look</span><span><kbd>E</kbd> Use</span></div>
    <div id="joystick" aria-label="Movement joystick"><div id="stick"></div></div>
    <button id="touch-use" type="button" hidden>Use</button>
    <div id="status" role="status">Opening the arcade…</div>
  </main>

  <dialog id="directory" class="panel" aria-labelledby="directory-title">
    <div class="panel-heading"><div><h1 id="directory-title">Game list</h1><p>Play here or walk to the cabinet.</p></div><button class="close" type="button" data-close aria-label="Close game list">×</button></div>
    <div id="games" class="games"></div>
  </dialog>

  <dialog id="vending" class="panel" aria-labelledby="vending-title">
    <div class="panel-heading"><div><h1 id="vending-title">Booster vending</h1><p>Pick a set to dispense a digital pack.</p></div><button class="close" type="button" data-close aria-label="Close vending machine">×</button></div>
    <div class="vending-controls"><label for="set-search">Find a set</label><input id="set-search" type="search" placeholder="Set name or code" autocomplete="off"><button id="set-all" type="button">All sets</button></div>
    <div id="packs" class="packs"></div>
    <button id="set-more" class="action more" type="button" hidden>Show more sets</button>
    <div id="vending-status" role="status"></div>
  </dialog>

  <dialog id="player" class="player" aria-labelledby="game-title">
    <div class="player-bar"><button class="back" type="button" data-close>← Arcade</button><strong id="game-title"></strong><a id="external" target="_blank" rel="noopener">Open in new tab ↗</a></div>
    <div id="frame-loading" role="status" hidden>Loading…</div>
    <div id="frame-slot"></div>
  </dialog>
  <noscript><p class="no-script">Enable JavaScript to enter Mango Arcade.</p></noscript>
  <script type="module" src="arcade.js"></script>
</body>
</html>
