<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#020308">
  <title>SLICE CITY — One File Edition</title>
  <style>
    :root{--c:#2ef3ff;--p:#ff3dce;--a:#b8ff5a;--ink:#020308;color-scheme:dark}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    canvas{position:fixed;inset:0;width:100%;height:100%;outline:0;touch-action:none}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 2px 4px);box-shadow:inset 0 0 130px #000;z-index:2}
    .hud{position:fixed;z-index:3;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 0 15px var(--c)}
    .hud small,.hud b{display:block}.hud small{color:var(--c);font-size:8px;letter-spacing:.18em}.hud b{margin-top:4px;color:#fff;font-size:25px;letter-spacing:-.08em}.zone{text-align:right}.zone b{font-size:9px;letter-spacing:.1em}.zone small{color:var(--p)}
    .score{position:fixed;z-index:3;left:20px;bottom:max(20px,env(safe-area-inset-bottom));color:#9aafb4;font-size:8px;letter-spacing:.13em;pointer-events:none}.score strong{color:var(--a)}
    #msg{position:fixed;z-index:3;left:50%;bottom:72px;transform:translateX(-50%);color:#fff;font-size:9px;letter-spacing:.13em;white-space:nowrap;text-shadow:0 0 15px var(--p);pointer-events:none}
    #enter{position:fixed;z-index:6;inset:0;display:grid;place-content:center;justify-items:center;padding:24px;text-align:center;background:radial-gradient(circle,rgba(40,10,54,.28),rgba(0,0,0,.9) 58%)}
    #enter p{margin:0 0 13px;color:var(--c);font-size:9px;letter-spacing:.2em}#enter h1{margin:0;color:#fff;font-size:clamp(48px,12vw,118px);line-height:.76;letter-spacing:-.1em;text-shadow:-3px 0 var(--p),3px 0 var(--c)}
    #enter button,#card button{margin-top:28px;border:1px solid var(--p);padding:14px 18px;color:#fff;background:rgba(255,61,206,.12);font:900 10px ui-monospace;letter-spacing:.14em;cursor:pointer}
    #enter span{margin-top:15px;color:#607077;font-size:7px;letter-spacing:.13em}
    #card{position:fixed;z-index:7;top:50%;left:50%;width:min(520px,calc(100vw - 34px));transform:translate(-50%,-50%);display:none;padding:32px;border:1px solid var(--p);background:rgba(3,4,10,.97);box-shadow:0 0 0 100vmax rgba(0,0,0,.75)}
    #card small{color:var(--p);letter-spacing:.15em}#card h2{margin:10px 0 15px;color:#fff;font-size:clamp(26px,6vw,43px);line-height:.94;letter-spacing:-.06em}#card p{color:#a8bdc2;font-size:11px;line-height:1.7}
    .touch{display:none;position:fixed;z-index:4;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));justify-content:space-between;align-items:flex-end;pointer-events:none}.pad{display:grid;grid-template:42px 42px/42px 42px 42px;grid-template-areas:". u ." "l d r";gap:4px}.pad button:nth-child(1){grid-area:u}.pad button:nth-child(2){grid-area:l}.pad button:nth-child(3){grid-area:d}.pad button:nth-child(4){grid-area:r}
    .touch button{border:1px solid rgba(46,243,255,.35);color:#dffcff;background:rgba(2,5,10,.6);font:16px ui-monospace;pointer-events:auto;touch-action:none}.scan{width:62px;height:62px;border-radius:50%!important;color:var(--a)!important;font-size:10px!important}
    @media(max-width:700px){.touch{display:flex}.score{top:83px;bottom:auto}.zone{max-width:150px}#msg{bottom:165px;font-size:7px}}
  </style>
</head>
<body>
  <canvas id="city" tabindex="0" aria-label="Walkable ASCII Slice City"></canvas>
  <div class="hud"><div><small>ONE-FILE STEVEWARE</small><b>SLICE CITY_</b></div><div class="zone"><small id="code">SP-01</small><b id="zone">SURREALIST PLAZA</b></div></div>
  <div class="score">SIGNAL SHARDS <strong id="score">0/7</strong> · <span>WASD / ARROWS · E TO ENTER</span></div>
  <div id="msg">FOLLOW THE NEON</div>
  <section id="enter"><p>NO ASSETS · NO ENGINE · ONE HTML FILE</p><h1>WELCOME TO<br>SLICE CITY</h1><button id="start">ENTER THE CITY ↗</button><span>KEYBOARD, MOUSE, OR TOUCH</span></section>
  <section id="card"><small id="cardCode"></small><h2 id="cardTitle"></h2><p id="cardBody"></p><button id="close">RETURN TO THE STREET ↙</button></section>
  <div class="touch">
    <div class="pad"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div>
    <button class="scan" id="scan">◎ SCAN</button>
  </div>
  <script>
  "use strict";
  const TAU=Math.PI*2,SIZE=34,FOV=Math.PI/3;
  const colors={1:["#ff3dce","#6f1f68"],2:["#22f7ff","#155f73"],3:["#ffd44a","#79631d"],4:["#ff633b","#792b25"],5:["#9cff57","#376a2c"],6:["#ae75ff","#4d3474"]};
  const places=[
    {x:8.5,y:8.5,n:"MOTHMAN MARKET",c:"MM-13",t:"THE MOTHMAN SIGNAL EXCHANGE",b:"A night market where rumors are weighed, bottled, and traded under ultraviolet lamps. Every omen is merely data wearing a dramatic coat.",col:"#ff3dce"},
    {x:25.5,y:8.5,n:"RED CORSAIR DOCKS",c:"RC-40",t:"THE CRIMSON ANCHORAGE",b:"A lawless orbital port marooned at street level. The captains drink first, negotiate second, and regard parking meters as agents of the false emperor.",col:"#ff633b"},
    {x:8.5,y:25.5,n:"MIDNIGHT PICTURE PALACE",c:"MP-26",t:"THE MIDNIGHT PICTURE PALACE",b:"Tonight: a silent comedy, a doomed expedition, and a monster picture whose rubber suit won Best Actor. The projector has not stopped since 1927.",col:"#ffd44a"},
    {x:25.5,y:25.5,n:"STEVEWARE ARCADE",c:"SW-88",t:"STEVEWARE AFTER-HOURS ARCADE",b:"Every cabinet contains a game that should exist but somehow does not—until somebody stubborn enough builds it.",col:"#22f7ff"},
    {x:17,y:17,n:"SURREALIST PLAZA",c:"SP-01",t:"THE IMPOSSIBLE FOUNTAIN",b:"Water climbs upward into a stone eye while bronze rats debate architecture around the basin. The planning board calls this entirely up to code.",col:"#ae75ff"}
  ];
  const shards=[{x:8.2,y:14.5},{x:17.4,y:7.5},{x:25.7,y:17.4},{x:8.4,y:26.2},{x:17.2,y:25.6},{x:25.6,y:9.4},{x:17.1,y:17.1}];
  const map=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  for(let i=0;i<SIZE;i++){map[0][i]=2;map[SIZE-1][i]=2;map[i][0]=2;map[i][SIZE-1]=2}
  const blocks=[[2,2,6,6,1],[11,2,15,6,3],[20,2,24,6,4],[28,2,31,6,2],[2,11,6,15,5],[11,10,14,14,6],[20,10,23,14,1],[27,11,31,15,4],[2,20,6,24,3],[10,20,14,23,5],[20,20,24,24,2],[28,20,31,24,6],[2,28,6,31,6],[11,27,15,31,3],[20,28,24,31,5],[28,28,31,31,1]];
  for(const q of blocks)for(let y=q[1];y<=q[3];y++)for(let x=q[0];x<=q[2];x++)map[y][x]=q[4];
  for(let a=0;a<TAU;a+=.18){if((a>.48&&a<1.08)||(a>3.55&&a<4.15))continue;const x=Math.round(17+Math.cos(a)*5.2),y=Math.round(17+Math.sin(a)*5.2);if(map[y][x]===0)map[y][x]=6}
  const canvas=document.getElementById("city"),ctx=canvas.getContext("2d"),keys=new Set(),p={x:8.5,y:17.5,a:-Math.PI/2};
  const found=new Set(JSON.parse(localStorage.getItem("slice-one-shards")||"[]"));
  let started=false,paused=false,last=0,w=0,h=0,dpr=1,drag=false,px=0;
  const zoneEl=document.getElementById("zone"),codeEl=document.getElementById("code"),msg=document.getElementById("msg"),score=document.getElementById("score");
  score.textContent=found.size+"/7";
  function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.5);w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener("resize",resize);resize();
  function nearest(){return places.map(o=>({o,d:Math.hypot(o.x-p.x,o.y-p.y)})).sort((a,b)=>a.d-b.d)[0]}
  function note(t){msg.textContent=t;msg.animate([{opacity:0,transform:"translate(-50%,8px)"},{opacity:1,transform:"translate(-50%,0)"}],{duration:350})}
  function scan(){const q=nearest();if(!q||q.d>2.35){note("NO LOCAL SIGNAL · KEEP EXPLORING");return}paused=true;document.getElementById("cardCode").textContent="ARCHIVE / "+q.o.c;document.getElementById("cardTitle").textContent=q.o.t;document.getElementById("cardBody").textContent=q.o.b;document.getElementById("card").style.display="block"}
  document.getElementById("start").onclick=()=>{started=true;document.getElementById("enter").remove();canvas.focus();note("CITY LINK ESTABLISHED")};
  document.getElementById("scan").onclick=scan;document.getElementById("close").onclick=()=>{paused=false;document.getElementById("card").style.display="none";canvas.focus()};
  addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k.startsWith("arrow"))e.preventDefault();keys.add(k);if(k==="e"&&started&&!paused)scan();if(k==="escape"&&paused)document.getElementById("close").click()},{passive:false});
  addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));addEventListener("blur",()=>keys.clear());
  document.querySelectorAll("[data-key]").forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(k)};b.onpointerup=b.onpointercancel=()=>keys.delete(k)});
  canvas.onpointerdown=e=>{if(!started||paused)return;drag=true;px=e.clientX;canvas.setPointerCapture(e.pointerId)};
  canvas.onpointermove=e=>{if(drag&&!paused){p.a=(p.a+(e.clientX-px)*.006+TAU)%TAU;px=e.clientX}};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;
  function rgba(hex,a){const v=parseInt(hex.slice(1),16);return "rgba("+(v>>16)+","+((v>>8)&255)+","+(v&255)+","+a+")"}
  function delta(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}
  function render(t){
    requestAnimationFrame(render);if(t-last<30)return;const dt=Math.min((t-last)/1000||0,.05);last=t;
    if(started&&!paused){
      const turn=(keys.has("a")||keys.has("arrowleft")?-1:0)+(keys.has("d")||keys.has("arrowright")?1:0),go=(keys.has("w")||keys.has("arrowup")?1:0)+(keys.has("s")||keys.has("arrowdown")?-1:0);
      p.a=(p.a+turn*dt*1.95+TAU)%TAU;const nx=p.x+Math.cos(p.a)*go*dt*3.1,ny=p.y+Math.sin(p.a)*go*dt*3.1;if(map[Math.floor(p.y)][Math.floor(nx)]===0)p.x=nx;if(map[Math.floor(ny)][Math.floor(p.x)]===0)p.y=ny;
      const q=nearest().o;if(zoneEl.textContent!==q.n){zoneEl.textContent=q.n;codeEl.textContent=q.c;note("NOW ENTERING · "+q.n)}
      shards.forEach((s,i)=>{if(!found.has(i)&&Math.hypot(s.x-p.x,s.y-p.y)<.72){found.add(i);score.textContent=found.size+"/7";localStorage.setItem("slice-one-shards",JSON.stringify([...found]));note(found.size===7?"MIDNIGHT CHANNEL OPEN":"SIGNAL SHARD "+found.size+"/7")}});
    }
    const cols=w<700?66:Math.min(116,Math.floor(w/11)),rows=w<700?40:Math.min(58,Math.floor(h/14)),cw=w/cols,ch=h/rows,hor=Math.floor(rows*.5),depth=new Float32Array(cols);
    ctx.fillStyle="#020308";ctx.fillRect(0,0,w,h);ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="700 "+Math.ceil(ch*1.05)+"px ui-monospace,monospace";
    for(let r=0;r<hor;r++)for(let c=0;c<cols;c++){const z=(c*37+r*71+Math.floor(t/900))%193;if(z>186){ctx.fillStyle=z%2?"rgba(77,206,255,.35)":"rgba(255,76,206,.28)";ctx.fillText(z%3?".":"·",(c+.5)*cw,(r+.5)*ch)}}
    for(let r=hor;r<rows;r++){const per=(r-hor+1)/(rows-hor);for(let c=0;c<cols;c++){const z=Math.abs(Math.floor(p.x*7+p.y*11+c*1.7+r*13)*17+Math.floor(t/180))%29;if(z<5+per*7){ctx.fillStyle="rgba("+(z%2?"35,229,255":"255,55,198")+","+(0.04+per*.18)+")";ctx.fillText(z%5===0?"/":z%3===0?"_":".",(c+.5)*cw,(r+.5)*ch)}}}
    for(let c=0;c<cols;c++){
      const cam=2*c/cols-1,ra=p.a+Math.atan(cam*Math.tan(FOV/2)),rx=Math.cos(ra),ry=Math.sin(ra);let mx=Math.floor(p.x),my=Math.floor(p.y),dx=Math.abs(1/(rx||.00001)),dy=Math.abs(1/(ry||.00001)),sx=rx<0?(p.x-mx)*dx:(mx+1-p.x)*dx,sy=ry<0?(p.y-my)*dy:(my+1-p.y)*dy,side=0,type=1;
      for(let g=0;g<80;g++){if(sx<sy){sx+=dx;mx+=rx<0?-1:1;side=0}else{sy+=dy;my+=ry<0?-1:1;side=1}type=map[my]?.[mx]||0;if(type)break}
      const raw=side===0?sx-dx:sy-dy,dist=Math.max(.08,raw*Math.cos(ra-p.a));depth[c]=dist;const wh=Math.min(rows*1.45,Math.floor(rows/dist)),st=Math.max(0,Math.floor(hor-wh/2)),en=Math.min(rows-1,Math.floor(hor+wh/2));let wx=side===0?p.y+raw*ry:p.x+raw*rx;wx-=Math.floor(wx);const tx=Math.floor(wx*10),fog=Math.max(.1,Math.min(1,1.2-dist/20));
      for(let r=st;r<=en;r++){const ty=Math.floor((r-st)/Math.max(1,en-st)*18),lit=ty>2&&ty<17&&ty%4<2&&tx%4<2,g=r===st||r===en?"_":lit?(type%2?"M":"H"):(tx+ty)%5===0?"|":"#";ctx.fillStyle=rgba(colors[type][lit?0:1],fog*(side?.72:1));ctx.fillText(g,(c+.5)*cw,(r+.5)*ch)}
    }
    const actors=[
      ...places.map(o=>({x:o.x,y:o.y,art:["[ "+o.c+" ]"],col:o.col,s:.55})),
      ...shards.flatMap((s,i)=>found.has(i)?[]:[{x:s.x,y:s.y,art:["<◇>"],col:"#fff",s:.22}]),
      {x:1.5+(t*.006)%31,y:7.55,art:["[____]","o----o"],col:"#2ef3ff",s:.5},
      {x:7.55,y:1.5+(t*.003)%30,art:[" o ","-|－","/V/"],col:"#b8ff5a",s:.38}
    ].map(o=>{const x=o.x-p.x,y=o.y-p.y;return{o,d:Math.hypot(x,y),a:delta(Math.atan2(y,x)-p.a)}}).filter(q=>Math.abs(q.a)<FOV*.68&&q.d>.25).sort((a,b)=>b.d-a.d);
    for(const q of actors){const x=w*(.5+q.a/FOV),ci=Math.max(0,Math.min(cols-1,Math.floor(x/cw)));if(q.d>depth[ci]+.4)continue;const sh=Math.min(h*.65,h/q.d*q.o.s),lh=sh/q.o.art.length,top=h*.5-sh*.45,op=Math.max(.15,Math.min(1,1.3-q.d/18));ctx.save();ctx.font="900 "+Math.max(8,lh*.86)+"px ui-monospace";ctx.fillStyle=rgba(q.o.col,op);ctx.shadowColor=q.o.col;ctx.shadowBlur=Math.max(2,14-q.d);q.o.art.forEach((line,i)=>ctx.fillText(line,x,top+(i+.5)*lh));ctx.restore()}
    ctx.font="700 "+Math.ceil(ch)+"px ui-monospace";for(let i=0;i<Math.floor(cols/4);i++){const seed=i*977,x=(seed%997)/997*w,y=(t*(.035+i%7*.004)+seed)%(h+80)-40;ctx.fillStyle=i%4?"rgba(56,232,255,.24)":"rgba(255,57,205,.24)";ctx.fillText(i%3?"/":"│",x,y)}
  }
  requestAnimationFrame(render);
  </script>
</body>
</html>
