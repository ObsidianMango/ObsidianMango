<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#020307">
  <title>ASCII CITY</title>
  <style>
    :root{--cyan:#3ef5ff;--white:#eaffff;--ink:#020307;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    body{touch-action:none;overscroll-behavior:none}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:0;touch-action:none}
    .scanlines{position:fixed;z-index:2;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.28) 4px);box-shadow:inset 0 0 150px 35px rgba(0,0,0,.82)}
    .title{position:fixed;z-index:3;top:max(16px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));color:var(--white);font-size:16px;font-weight:900;letter-spacing:-.05em;text-shadow:0 0 14px var(--cyan);pointer-events:none}
    .title small{display:block;margin-bottom:4px;color:var(--cyan);font-size:7px;letter-spacing:.2em}
    .coords{position:fixed;z-index:3;top:max(17px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));color:rgba(234,255,255,.58);font-size:8px;letter-spacing:.14em;pointer-events:none}
    .help{position:fixed;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(234,255,255,.44);font-size:7px;letter-spacing:.13em;white-space:nowrap;pointer-events:none}
    .touch{display:none;position:fixed;z-index:4;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));justify-content:space-between;align-items:flex-end;pointer-events:none}
    .pad{display:grid;grid-template:44px 44px/44px 44px 44px;grid-template-areas:". up ." "left down right";gap:5px}
    .pad button:nth-child(1){grid-area:up}.pad button:nth-child(2){grid-area:left}.pad button:nth-child(3){grid-area:down}.pad button:nth-child(4){grid-area:right}
    .touch button{border:1px solid rgba(62,245,255,.28);color:rgba(234,255,255,.75);background:rgba(2,6,12,.5);font:700 15px/1 ui-monospace,monospace;backdrop-filter:blur(7px);pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent}
    .touch button:active{color:#fff;border-color:var(--cyan);background:rgba(62,245,255,.13)}
    .run{width:62px;height:62px;border-radius:50%;font-size:8px!important;letter-spacing:.12em}
    @media(max-width:760px){
      .touch{display:flex}
      .help{bottom:max(163px,calc(env(safe-area-inset-bottom) + 150px));font-size:6px}
      .title{font-size:14px}.coords{font-size:7px}
    }
    @media(prefers-reduced-motion:reduce){.scanlines{background:none}}
  </style>
</head>
<body>
  <canvas id="city" tabindex="0" aria-label="Infinite ASCII city explorer"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="title"><small>PROCEDURAL WORLD</small>ASCII CITY</div>
  <div class="coords" id="coords">X 00000&nbsp;&nbsp;Y 00000</div>
  <div class="help">WASD MOVE · ARROWS TURN · DRAG TO LOOK · SHIFT RUN</div>
  <div class="touch" aria-label="Touch controls">
    <div class="pad">
      <button type="button" data-key="w" aria-label="Move forward">▲</button>
      <button type="button" data-key="a" aria-label="Move left">◀</button>
      <button type="button" data-key="s" aria-label="Move backward">▼</button>
      <button type="button" data-key="d" aria-label="Move right">▶</button>
    </div>
    <button type="button" class="run" data-key="shift" aria-label="Run">RUN</button>
  </div>
  <script>
  "use strict";

  const TAU=Math.PI*2;
  const FOV=Math.PI/3;
  const BLOCK=18;
  const ROAD=4;
  const MAX_VIEW=58;
  const BUILDING_COLORS=[
    ["#2ee8ff","#15566b"],
    ["#ff45c8","#6b205a"],
    ["#ffc94c","#705b22"],
    ["#ff6948","#713126"],
    ["#8dff62","#356528"],
    ["#ac76ff","#4a3572"]
  ];

  const canvas=document.getElementById("city");
  const context=canvas.getContext("2d",{alpha:false});
  const coords=document.getElementById("coords");
  const keys=new Set();
  const blockCache=new Map();
  const player={x:2.2,y:9.2,angle:Math.PI/2};

  let width=1;
  let height=1;
  let dpr=1;
  let lastFrame=0;
  let lookPointer=null;
  let lastPointerX=0;
  let lastPointerY=0;

  function mod(value,divisor){
    return((value%divisor)+divisor)%divisor;
  }

  function hash2(x,y,salt){
    let value=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(salt||0,1442695041);
    value=Math.imul(value^(value>>>13),1274126177);
    return(value^(value>>>16))>>>0;
  }

  function blockInfo(blockX,blockY){
    const key=blockX+","+blockY;
    const saved=blockCache.get(key);
    if(saved)return saved;
    if(blockCache.size>4096)blockCache.clear();
    const hash=hash2(blockX,blockY,31);
    const centerX=mod(blockX,40)-20;
    const centerY=mod(blockY,40)-20;
    const downtown=Math.max(0,1-Math.hypot(centerX,centerY)/17);
    const random=((hash>>>8)&1023)/1023;
    const info={
      key:key,
      hash:hash,
      type:hash%BUILDING_COLORS.length,
      height:.72+random*1.45+downtown*3.25,
      park:hash%11===0,
      plaza:hash%29===0,
      variant:(hash>>>5)%5
    };
    blockCache.set(key,info);
    return info;
  }

  function buildingAt(cellX,cellY){
    const localX=mod(cellX,BLOCK);
    const localY=mod(cellY,BLOCK);
    if(localX<6||localY<6||localX>15||localY>15)return null;
    const blockX=Math.floor(cellX/BLOCK);
    const blockY=Math.floor(cellY/BLOCK);
    const info=blockInfo(blockX,blockY);
    if(info.park||info.plaza)return null;
    if(info.variant===1&&(localX===10||localX===11))return null;
    if(info.variant===2&&(localY===10||localY===11))return null;
    if(info.variant===3&&localX>=9&&localX<=12&&localY>=9&&localY<=12)return null;
    if(info.variant===4&&((localX===7&&localY>10)||(localY===14&&localX<11)))return null;
    return info;
  }

  function canWalk(x,y){
    const radius=.23;
    return!buildingAt(Math.floor(x-radius),Math.floor(y-radius))&&
      !buildingAt(Math.floor(x+radius),Math.floor(y-radius))&&
      !buildingAt(Math.floor(x-radius),Math.floor(y+radius))&&
      !buildingAt(Math.floor(x+radius),Math.floor(y+radius));
  }

  function surfaceAt(worldX,worldY){
    const localX=mod(worldX,BLOCK);
    const localY=mod(worldY,BLOCK);
    const vertical=localX<ROAD;
    const horizontal=localY<ROAD;
    if(vertical||horizontal){
      let glyph=".";
      if(vertical&&horizontal)glyph="+";
      else if(vertical&&Math.abs(localX-2)<.17&&Math.floor(worldY*.42)%2===0)glyph="|";
      else if(horizontal&&Math.abs(localY-2)<.17&&Math.floor(worldX*.42)%2===0)glyph="-";
      else if((vertical&&Math.abs(localX-.35)<.1)||(horizontal&&Math.abs(localY-.35)<.1))glyph=":";
      return{glyph:glyph,color:glyph==="."?"117,139,146":"206,238,242",alpha:glyph==="."?.17:.42};
    }
    const info=blockInfo(Math.floor(worldX/BLOCK),Math.floor(worldY/BLOCK));
    if(info.park)return{glyph:hash2(Math.floor(worldX*3),Math.floor(worldY*3),4)%4?",":";",color:"75,151,67",alpha:.28};
    if(info.plaza)return{glyph:hash2(Math.floor(worldX*2),Math.floor(worldY*2),7)%5?".":"+",color:"113,130,137",alpha:.24};
    if(localX<6||localY<6||localX>15||localY>15)return{glyph:hash2(Math.floor(worldX*2),Math.floor(worldY*2),2)%5?":":"·",color:"151,175,180",alpha:.21};
    return{glyph:".",color:"57,68,74",alpha:.1};
  }

  function resize(){
    const box=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,1.55);
    width=Math.max(1,box.width);
    height=Math.max(1,box.height);
    canvas.width=Math.floor(width*dpr);
    canvas.height=Math.floor(height*dpr);
    context.setTransform(dpr,0,0,dpr,0,0);
    context.imageSmoothingEnabled=false;
  }

  function angleDelta(value){
    let angle=value;
    while(angle>Math.PI)angle-=TAU;
    while(angle<-Math.PI)angle+=TAU;
    return angle;
  }

  function rgba(hex,alpha){
    const value=parseInt(hex.slice(1),16);
    return"rgba("+(value>>16)+","+((value>>8)&255)+","+(value&255)+","+alpha+")";
  }

  function addTree(list,x,y,size){
    list.push({x:x,y:y,art:["  /\\  "," /##\\ ","/####\\","  ||  "],color:"#62d85a",scale:size||.82,lift:0});
  }

  function nearbyActors(time){
    const actors=[];
    const baseX=Math.floor(player.x/BLOCK);
    const baseY=Math.floor(player.y/BLOCK);
    for(let blockY=baseY-3;blockY<=baseY+3;blockY+=1){
      for(let blockX=baseX-3;blockX<=baseX+3;blockX+=1){
        const info=blockInfo(blockX,blockY);
        const originX=blockX*BLOCK;
        const originY=blockY*BLOCK;

        if(info.park){
          for(let index=0;index<7;index+=1){
            const treeHash=hash2(blockX,blockY,index+80);
            const treeX=originX+6.2+(treeHash%860)/100;
            const treeY=originY+6.2+((treeHash>>>10)%860)/100;
            addTree(actors,treeX,treeY,.72+((treeHash>>>20)%25)/100);
          }
        }else if(!info.plaza&&info.hash%3===0){
          addTree(actors,originX+5.15,originY+7.4+(info.hash%650)/100,.68);
          if(info.hash%2===0)addTree(actors,originX+7.3+((info.hash>>>9)%650)/100,originY+5.15,.65);
        }

        if(info.plaza){
          for(let index=0;index<4;index+=1){
            const plazaHash=hash2(blockX,blockY,index+150);
            addTree(actors,originX+6.5+(plazaHash%800)/100,originY+6.5+((plazaHash>>>9)%800)/100,.7);
          }
        }

        if(info.hash%3===0){
          const direction=info.hash%2===0?1:-1;
          const phase=mod(time*.0042*direction+(info.hash%1800)/100,BLOCK);
          actors.push({
            x:originX+phase,
            y:originY+(direction>0?1.15:2.85),
            art:[" ____ ","[____]","o----o"],
            color:["#2ef3ff","#ff45c8","#ffc94c","#8dff62"][info.hash%4],
            scale:.34,
            lift:0
          });
        }

        if((info.hash>>>3)%4===0){
          const direction=(info.hash>>>4)%2===0?1:-1;
          const phase=mod(time*.0035*direction+((info.hash>>>5)%1800)/100,BLOCK);
          actors.push({
            x:originX+(direction>0?2.85:1.15),
            y:originY+phase,
            art:[" ___ ","[___]","o---o"],
            color:["#ff6948","#ac76ff","#eaffff"][info.hash%3],
            scale:.32,
            lift:0
          });
        }

        if(info.hash%2===0){
          const walking=mod(time*.0011+((info.hash>>>7)%900)/100,9);
          actors.push({
            x:originX+4.85,
            y:originY+6.2+walking,
            art:[" o ","-|-","/ \\"],
            color:"#d9fbff",
            scale:.32,
            lift:0
          });
        }

        if((info.hash>>>6)%3===0){
          const walking=mod(time*.00085+((info.hash>>>12)%900)/100,9);
          actors.push({
            x:originX+6.2+walking,
            y:originY+4.85,
            art:[" o ","/|\\","/ \\"],
            color:"#ffd6ef",
            scale:.31,
            lift:0
          });
        }
      }
    }
    return actors;
  }

  function drawActors(time,depthBuffer,columns,cellWidth){
    const actors=nearbyActors(time).map(function(actor){
      const deltaX=actor.x-player.x;
      const deltaY=actor.y-player.y;
      return{
        actor:actor,
        distance:Math.hypot(deltaX,deltaY),
        angle:angleDelta(Math.atan2(deltaY,deltaX)-player.angle)
      };
    }).filter(function(item){
      return item.distance>.3&&item.distance<34&&Math.abs(item.angle)<FOV*.7;
    }).sort(function(a,b){
      return b.distance-a.distance;
    });

    for(const item of actors){
      const screenX=width*(.5+item.angle/FOV);
      const column=Math.max(0,Math.min(columns-1,Math.floor(screenX/cellWidth)));
      if(item.distance>depthBuffer[column]+.3)continue;
      const spriteHeight=Math.min(height*.8,height/item.distance*item.actor.scale);
      const lineHeight=spriteHeight/item.actor.art.length;
      const floorY=height*.5+height*.45/item.distance;
      const top=floorY-spriteHeight;
      const opacity=Math.max(.14,Math.min(1,1.25-item.distance/33));
      context.save();
      context.textAlign="center";
      context.textBaseline="middle";
      context.font="900 "+Math.max(6,lineHeight*.9)+"px ui-monospace,SFMono-Regular,Menlo,monospace";
      context.fillStyle=rgba(item.actor.color,opacity);
      context.shadowColor=item.actor.color;
      context.shadowBlur=Math.max(1,12-item.distance*.35);
      item.actor.art.forEach(function(line,index){
        context.fillText(line,screenX,top+(index+.5)*lineHeight);
      });
      context.restore();
    }
  }

  function updatePlayer(deltaTime){
    const forward=(keys.has("w")||keys.has("arrowup")?1:0)-(keys.has("s")||keys.has("arrowdown")?1:0);
    const strafe=(keys.has("d")?1:0)-(keys.has("a")?1:0);
    const turn=(keys.has("arrowright")?1:0)-(keys.has("arrowleft")?1:0);
    const run=keys.has("shift")?1.85:1;
    player.angle=mod(player.angle+turn*deltaTime*2.05,TAU);
    let moveX=Math.cos(player.angle)*forward+Math.cos(player.angle+Math.PI/2)*strafe;
    let moveY=Math.sin(player.angle)*forward+Math.sin(player.angle+Math.PI/2)*strafe;
    const length=Math.hypot(moveX,moveY);
    if(length>0){
      moveX/=length;
      moveY/=length;
      const speed=3.35*run;
      const nextX=player.x+moveX*deltaTime*speed;
      const nextY=player.y+moveY*deltaTime*speed;
      if(canWalk(nextX,player.y))player.x=nextX;
      if(canWalk(player.x,nextY))player.y=nextY;
    }
    const xText=(player.x<0?"-":"")+String(Math.abs(Math.floor(player.x))).padStart(5,"0");
    const yText=(player.y<0?"-":"")+String(Math.abs(Math.floor(player.y))).padStart(5,"0");
    const coordinateText="X "+xText+"\u00a0\u00a0Y "+yText;
    if(coords.textContent!==coordinateText)coords.textContent=coordinateText;
  }

  function render(time){
    window.requestAnimationFrame(render);
    if(time-lastFrame<30)return;
    const deltaTime=Math.min((time-lastFrame)/1000||0,.05);
    lastFrame=time;
    updatePlayer(deltaTime);

    const mobile=width<760;
    const columns=mobile?64:Math.min(108,Math.floor(width/11));
    const rows=mobile?38:Math.min(56,Math.floor(height/13));
    const cellWidth=width/columns;
    const cellHeight=height/rows;
    const horizon=Math.floor(rows*.48);
    const depthBuffer=new Float32Array(columns);
    depthBuffer.fill(MAX_VIEW);

    context.fillStyle="#020307";
    context.fillRect(0,0,width,height);
    context.textAlign="center";
    context.textBaseline="middle";
    context.font="700 "+Math.ceil(cellHeight*1.04)+"px ui-monospace,SFMono-Regular,Menlo,monospace";

    for(let row=0;row<horizon;row+=1){
      for(let column=0;column<columns;column+=1){
        const noise=hash2(column,row+Math.floor(time/1400),9)%251;
        if(noise>244){
          context.fillStyle=noise%2?"rgba(68,223,255,.3)":"rgba(255,79,201,.23)";
          context.fillText(noise%3?".":"+",(column+.5)*cellWidth,(row+.5)*cellHeight);
        }
      }
    }

    for(let row=horizon;row<rows;row+=1){
      const rowDistance=(rows*.56)/(row-horizon+.55);
      const fog=Math.max(.05,Math.min(1,1-rowDistance/MAX_VIEW));
      for(let column=0;column<columns;column+=1){
        const cameraX=2*(column+.5)/columns-1;
        const rayAngle=player.angle+Math.atan(cameraX*Math.tan(FOV/2));
        const worldX=player.x+Math.cos(rayAngle)*rowDistance;
        const worldY=player.y+Math.sin(rayAngle)*rowDistance;
        const surface=surfaceAt(worldX,worldY);
        context.fillStyle="rgba("+surface.color+","+(surface.alpha*fog)+")";
        context.fillText(surface.glyph,(column+.5)*cellWidth,(row+.5)*cellHeight);
      }
    }

    for(let column=0;column<columns;column+=1){
      const cameraX=2*column/columns-1;
      const rayAngle=player.angle+Math.atan(cameraX*Math.tan(FOV/2));
      const rayX=Math.cos(rayAngle);
      const rayY=Math.sin(rayAngle);
      let mapX=Math.floor(player.x);
      let mapY=Math.floor(player.y);
      const deltaX=Math.abs(1/(rayX||.000001));
      const deltaY=Math.abs(1/(rayY||.000001));
      const stepX=rayX<0?-1:1;
      const stepY=rayY<0?-1:1;
      let sideX=rayX<0?(player.x-mapX)*deltaX:(mapX+1-player.x)*deltaX;
      let sideY=rayY<0?(player.y-mapY)*deltaY:(mapY+1-player.y)*deltaY;
      let activeBuilding="";
      const hits=[];

      for(let guard=0;guard<128;guard+=1){
        let side=0;
        if(sideX<sideY){
          sideX+=deltaX;
          mapX+=stepX;
          side=0;
        }else{
          sideY+=deltaY;
          mapY+=stepY;
          side=1;
        }
        const rawDistance=side===0?sideX-deltaX:sideY-deltaY;
        if(rawDistance>MAX_VIEW)break;
        const building=buildingAt(mapX,mapY);
        if(building){
          if(building.key!==activeBuilding){
            let wallX=side===0?player.y+rawDistance*rayY:player.x+rawDistance*rayX;
            wallX-=Math.floor(wallX);
            hits.push({
              distance:Math.max(.05,rawDistance*Math.cos(rayAngle-player.angle)),
              side:side,
              wallX:wallX,
              type:building.type,
              height:building.height,
              hash:building.hash
            });
            activeBuilding=building.key;
            if(hits.length>=9)break;
          }
        }else{
          activeBuilding="";
        }
      }

      if(hits.length)depthBuffer[column]=hits[0].distance;

      for(let hitIndex=hits.length-1;hitIndex>=0;hitIndex-=1){
        const hit=hits[hitIndex];
        const bottom=horizon+rows*.5/hit.distance;
        const top=horizon-rows*(hit.height-.5)/hit.distance;
        const start=Math.max(0,Math.floor(top));
        const end=Math.min(rows-1,Math.floor(bottom));
        const textureX=Math.floor(hit.wallX*12);
        const colors=BUILDING_COLORS[hit.type];
        const fog=Math.max(.08,Math.min(1,1.18-hit.distance/MAX_VIEW));
        for(let row=start;row<=end;row+=1){
          const normalized=(row-top)/Math.max(1,bottom-top);
          const textureY=Math.floor(normalized*hit.height*16);
          const edge=row===start||row===end;
          const windowBand=textureY%5<2;
          const windowColumn=(textureX+(hit.hash%3))%4<2;
          const lit=windowBand&&windowColumn&&!edge;
          let glyph="#";
          if(edge)glyph="_";
          else if(lit)glyph=(hit.hash+textureX+textureY)%5===0?"O":"[]#HMX"[hit.type];
          else if((textureX+textureY)%7===0)glyph="|";
          const alpha=fog*(hit.side===1?.7:1);
          context.fillStyle=rgba(lit?colors[0]:colors[1],alpha);
          context.fillText(glyph,(column+.5)*cellWidth,(row+.5)*cellHeight);
        }
      }
    }

    drawActors(time,depthBuffer,columns,cellWidth);

    context.font="700 "+Math.ceil(cellHeight)+"px ui-monospace,monospace";
    for(let index=0;index<Math.floor(columns/3.5);index+=1){
      const seed=index*977;
      const rainX=((seed%997)/997)*width;
      const rainY=(time*(.03+(index%9)*.003)+seed)%(height+80)-40;
      context.fillStyle=index%5===0?"rgba(255,67,199,.18)":"rgba(80,226,255,.23)";
      context.fillText(index%3?"/":"|",rainX,rainY);
    }

    const haze=context.createRadialGradient(width/2,height*.48,0,width/2,height*.48,width*.46);
    haze.addColorStop(0,"rgba(44,219,255,.075)");
    haze.addColorStop(.45,"rgba(255,61,198,.018)");
    haze.addColorStop(1,"rgba(0,0,0,0)");
    context.fillStyle=haze;
    context.fillRect(0,0,width,height);
  }

  window.addEventListener("resize",resize);
  window.addEventListener("keydown",function(event){
    const key=event.key.toLowerCase();
    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key))event.preventDefault();
    keys.add(key);
  },{passive:false});
  window.addEventListener("keyup",function(event){
    keys.delete(event.key.toLowerCase());
  });
  window.addEventListener("blur",function(){
    keys.clear();
  });

  canvas.addEventListener("pointerdown",function(event){
    lookPointer=event.pointerId;
    lastPointerX=event.clientX;
    lastPointerY=event.clientY;
    canvas.setPointerCapture(event.pointerId);
    canvas.focus();
  });
  canvas.addEventListener("pointermove",function(event){
    if(event.pointerId!==lookPointer)return;
    const deltaX=event.clientX-lastPointerX;
    const deltaY=event.clientY-lastPointerY;
    player.angle=mod(player.angle+deltaX*.0065+deltaY*.0012,TAU);
    lastPointerX=event.clientX;
    lastPointerY=event.clientY;
  });
  function endLook(event){
    if(event.pointerId!==lookPointer)return;
    if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);
    lookPointer=null;
  }
  canvas.addEventListener("pointerup",endLook);
  canvas.addEventListener("pointercancel",endLook);

  document.querySelectorAll("[data-key]").forEach(function(button){
    const key=button.getAttribute("data-key");
    button.addEventListener("pointerdown",function(event){
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      keys.add(key);
    });
    function release(){
      keys.delete(key);
    }
    button.addEventListener("pointerup",release);
    button.addEventListener("pointercancel",release);
    button.addEventListener("lostpointercapture",release);
  });

  resize();
  canvas.focus();
  window.requestAnimationFrame(render);
  </script>
</body>
</html>
