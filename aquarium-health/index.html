<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#031c2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Magic Life">
  <title>Magic Aquarium Life Counter</title>
  <style>
    :root{color-scheme:dark;--ink:#effcff;--glass:rgba(3,31,48,.58);--line:rgba(198,245,255,.48);--safe-top:max(18px,calc(env(safe-area-inset-top) + 10px));--safe-right:max(18px,calc(env(safe-area-inset-right) + 12px));--safe-bottom:max(16px,calc(env(safe-area-inset-bottom) + 10px));--safe-left:max(18px,calc(env(safe-area-inset-left) + 12px))}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#031c2d;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
    button{font:inherit;color:inherit}
    #app{position:relative;isolation:isolate;width:100%;height:100vh;height:100svh;height:100dvh;min-height:350px;overflow:hidden;background:#064465}
    #app:before{position:absolute;z-index:3;inset:0;border:clamp(5px,1.3vw,12px) solid rgba(2,13,24,.56);box-shadow:inset 0 0 0 1px rgba(199,245,255,.36),inset 0 0 55px rgba(0,6,18,.38);content:"";pointer-events:none}
    #tank{position:absolute;z-index:0;inset:0;display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
    .waterline{position:absolute;z-index:2;top:max(7px,env(safe-area-inset-top));right:8px;left:8px;height:4px;opacity:.7;background:linear-gradient(90deg,transparent,#d4faff,#63d9ff,transparent);filter:blur(.7px);pointer-events:none}
    .topbar{position:absolute;z-index:6;top:0;right:0;left:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:var(--safe-top) var(--safe-right) 8px var(--safe-left);pointer-events:none}
    .brand{display:flex;min-width:0;align-items:center;gap:9px;text-shadow:0 2px 14px rgba(0,12,28,.85)}
    .dot{width:9px;height:9px;flex:0 0 auto;border:2px solid rgba(222,251,255,.9);border-radius:50%;background:#45dfb5;box-shadow:0 0 14px rgba(69,223,181,.85)}
    h1{margin:0;font-size:clamp(14px,3.7vw,19px);font-weight:800;letter-spacing:-.02em}
    #notice{max-width:50vw;margin:2px 0 0;overflow:hidden;color:rgba(226,249,255,.72);font-size:10px;font-weight:650;letter-spacing:.035em;text-overflow:ellipsis;white-space:nowrap}
    .pill{height:36px;display:flex;align-items:center;gap:7px;padding:0 13px;border:1px solid rgba(191,241,255,.28);border-radius:999px;background:rgba(2,25,42,.42);box-shadow:0 8px 30px rgba(0,12,28,.18);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);font-size:12px;font-weight:750;pointer-events:auto;cursor:pointer}
    .pill:active,.care:active{transform:scale(.96);filter:brightness(1.1)}
    .pill-icon{width:13px;font-size:15px;text-align:center}
    #healthHud{position:absolute;z-index:7;top:50%;left:50%;display:grid;width:clamp(150px,40vw,184px);min-height:90px;grid-template-columns:28px 1fr;align-items:center;padding:8px 14px 12px;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(5,40,59,.66),rgba(2,23,40,.4));box-shadow:0 12px 36px rgba(0,12,28,.3),inset 0 1px 0 rgba(255,255,255,.2),0 0 22px rgba(83,216,255,.16);backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);pointer-events:none}
    #healthHud.critical{border-color:rgba(255,115,127,.62);animation:critical 1.2s ease-in-out infinite}
    .heart{color:#ff5d73;font-size:25px;line-height:1;text-shadow:0 0 15px rgba(255,73,102,.8);animation:heartbeat 2.4s ease-in-out infinite}
    .healthcopy{display:flex;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:0}
    #health{color:#fff;font-size:clamp(58px,17vw,82px);font-variant-numeric:tabular-nums;font-weight:900;line-height:.82;letter-spacing:-.075em;text-shadow:0 4px 18px rgba(0,10,24,.8),0 0 18px rgba(107,226,255,.42)}
    #status{color:rgba(221,249,255,.78);font-size:8px;font-weight:900;line-height:1;letter-spacing:.15em;text-transform:uppercase}
    .controls{position:absolute;z-index:8;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,430px);margin:0 auto;padding:10px var(--safe-right) var(--safe-bottom) var(--safe-left);pointer-events:none}
    .care{position:relative;height:70px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:7px 13px;border:1px solid rgba(220,250,255,.34);border-radius:19px;box-shadow:0 10px 28px rgba(0,12,28,.35),inset 0 1px 0 rgba(255,255,255,.23);backdrop-filter:blur(15px) saturate(1.4);-webkit-backdrop-filter:blur(15px) saturate(1.4);pointer-events:auto;transition:transform .14s ease,filter .14s ease;cursor:pointer}
    .care:after{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 45%);content:"";pointer-events:none}
    #minus{background:linear-gradient(145deg,rgba(210,75,75,.92),rgba(130,34,66,.86))}
    #plus{background:linear-gradient(145deg,rgba(28,174,132,.92),rgba(8,91,119,.88))}
    .care .copy{display:flex;min-width:0;flex-direction:column;align-items:center;font-size:31px;font-weight:900;line-height:.88;letter-spacing:-.04em}
    .care small{margin-bottom:3px;color:rgba(255,255,255,.68);font-size:7px;font-weight:850;letter-spacing:.12em}
    .shade{position:absolute;z-index:4;right:0;bottom:0;left:0;height:max(85px,calc(env(safe-area-inset-bottom) + 70px));background:linear-gradient(transparent,rgba(0,10,19,.43));pointer-events:none}
    @keyframes heartbeat{0%,45%,100%{transform:scale(1)}9%{transform:scale(1.14)}18%{transform:scale(.97)}28%{transform:scale(1.09)}}
    @keyframes critical{50%{box-shadow:0 0 28px rgba(255,79,103,.42)}}
    @media(orientation:landscape){.topbar{padding-top:max(13px,calc(env(safe-area-inset-top) + 7px))}.controls{right:var(--safe-right);bottom:var(--safe-bottom);left:auto;width:min(390px,48vw);margin:0;padding:0}#healthHud{width:176px}.shade{height:82px}}
    @media(max-height:500px) and (orientation:landscape){#notice{display:none}.care{height:58px}#healthHud{min-height:80px;padding-block:6px 9px}#health{font-size:62px}}
    @media(max-width:360px){.controls{gap:7px;padding-inline:11px}.care{padding-inline:9px}}
    @media(prefers-reduced-motion:reduce){.heart,#healthHud.critical{animation:none}.care{transition:none}}
  </style>
</head>
<body>
  <main id="app">
    <canvas id="tank" aria-label="Animated aquarium with colorful fish swimming around the health display"></canvas>
    <div class="waterline" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><span class="dot" aria-hidden="true"></span><div><h1>Magic Aquarium Life</h1><p id="notice">Commander life starts at 40</p></div></div>
      <button class="pill" id="reset" type="button"><span class="pill-icon" aria-hidden="true">↻</span><span>Reset 40</span></button>
    </header>
    <section id="healthHud" role="status" aria-live="polite" aria-label="Magic life total 40">
      <div class="heart" aria-hidden="true">♥</div>
      <div class="healthcopy"><strong id="health">40</strong><span id="status">Life total</span></div>
    </section>
    <nav class="controls" aria-label="Magic life controls">
      <button class="care" id="minus" type="button" aria-label="Lose one life"><span class="copy">−1<small>LOSE LIFE</small></span></button>
      <button class="care" id="plus" type="button" aria-label="Gain one life"><span class="copy">+1<small>GAIN LIFE</small></span></button>
    </nav>
    <div class="shade" aria-hidden="true"></div>
  </main>
  <script>
  (()=>{
    'use strict';
    const canvas=document.querySelector('#tank'),ctx=canvas.getContext('2d'),healthEl=document.querySelector('#health'),hud=document.querySelector('#healthHud'),notice=document.querySelector('#notice');
    const hues=[18,34,48,172,195,215,278,318,350],clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    let width=0,height=0,dpr=1,health=40,last=performance.now(),bubbleClock=0,fishes=[],particles=[];
    function say(text){notice.textContent=text}
    function changeHealth(amount){health=clamp(health+amount,-999,999);healthEl.textContent=Math.round(health);hud.classList.toggle('critical',health<=10);hud.setAttribute('aria-label',`Magic life total ${Math.round(health)}`)}
    function makeFish(i,count){const z=.2+Math.random()*.8,dir=Math.random()>.5?1:-1,upper=i%2===0,min=upper?.18:.56,max=upper?.4:.78;return{x:i/Math.max(1,count-1)*width+Math.random()*100,y:height*(min+Math.random()*(max-min)),baseY:height*(min+Math.random()*(max-min)),z,size:(13+Math.random()*17)*(.72+z*.42),speed:(14+Math.random()*22)*(.65+z*.7),dir,phase:Math.random()*Math.PI*2,hue:hues[i%hues.length]+Math.random()*8,stripe:hues[(i+3)%hues.length],side:upper?-1:1}}
    function resize(){const r=canvas.getBoundingClientRect();width=Math.max(1,r.width);height=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const count=clamp(Math.round(width*height/30000),12,24);fishes=Array.from({length:count},(_,i)=>makeFish(i,count))}
    function bubbles(x,y,count){for(let i=0;i<count;i++)particles.push({x:x+(Math.random()-.5)*44,y:y+(Math.random()-.5)*20,vx:(Math.random()-.5)*9,vy:-(18+Math.random()*34),life:2.4+Math.random()*2.2,max:4.6,size:2+Math.random()*6,kind:'bubble'})}
    function hearts(){for(let i=0;i<5;i++)particles.push({x:width*.5+(Math.random()-.5)*110,y:height*.54+Math.random()*30,vx:(Math.random()-.5)*12,vy:-(20+Math.random()*18),life:1.5+Math.random(),max:2.5,size:6+Math.random()*4,kind:'heart'})}
    function plant(x,floor,tall,hue,sway){ctx.save();ctx.lineCap='round';for(let s=0;s<4;s++){const off=(s-1.5)*6,tip=x+off+Math.sin(sway+s)*14,g=ctx.createLinearGradient(x,floor,tip,floor-tall);g.addColorStop(0,`hsla(${hue},72%,22%,.9)`);g.addColorStop(1,`hsla(${hue+16},86%,48%,.78)`);ctx.strokeStyle=g;ctx.lineWidth=3+s*.35;ctx.beginPath();ctx.moveTo(x+off,floor);ctx.bezierCurveTo(x+off-12,floor-tall*.35,tip+15,floor-tall*.68,tip,floor-tall);ctx.stroke()}ctx.restore()}
    function background(t){const water=ctx.createLinearGradient(0,0,0,height);water.addColorStop(0,'#006da0');water.addColorStop(.38,'#045781');water.addColorStop(.72,'#073d5c');water.addColorStop(1,'#08283b');ctx.fillStyle=water;ctx.fillRect(0,0,width,height);const glow=ctx.createRadialGradient(width*.5,-height*.1,10,width*.5,0,width*.72);glow.addColorStop(0,'rgba(130,238,255,.34)');glow.addColorStop(1,'rgba(0,72,110,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,width,height*.76);ctx.save();ctx.globalCompositeOperation='screen';for(let r=0;r<5;r++){const x=(r+.5)/5*width+Math.sin(t*.0002+r)*25,g=ctx.createLinearGradient(x,0,x,height*.75);g.addColorStop(0,'rgba(142,238,255,.12)');g.addColorStop(1,'rgba(142,238,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-width*.04,0);ctx.lineTo(x+width*.07,0);ctx.lineTo(x+width*.16,height*.74);ctx.lineTo(x-width*.1,height*.74);ctx.closePath();ctx.fill()}ctx.restore();const floor=height*.88,sand=ctx.createLinearGradient(0,floor-12,0,height);sand.addColorStop(0,'#d5c184');sand.addColorStop(.25,'#9f8958');sand.addColorStop(1,'#463b2d');ctx.fillStyle=sand;ctx.beginPath();ctx.moveTo(0,floor);for(let x=0;x<=width+40;x+=40)ctx.lineTo(x,floor+Math.sin(x*.025+t*.0003)*5);ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.closePath();ctx.fill();for(let r=0;r<12;r++){const x=r/11*width+Math.sin(r*8.4)*24,size=12+(r*17)%27,g=ctx.createRadialGradient(x-size*.25,floor-size*.4,1,x,floor,size);g.addColorStop(0,r%3===0?'#59847a':'#65706a');g.addColorStop(1,'#1b3130');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,floor-size*.15,size,size*.56,-.1,0,Math.PI*2);ctx.fill()}const n=width<520?7:11;for(let p=0;p<n;p++){const x=p/(n-1)*width,bias=Math.abs(x-width*.5)/(width*.5);if(bias<.28)continue;plant(x,floor,height*(.12+(p*13)%16/100),p%3===0?165:128,t*.0014+p)}ctx.strokeStyle='rgba(171,239,255,.18)';ctx.lineWidth=1.2;for(let l=0;l<8;l++){ctx.beginPath();for(let x=-30;x<width+40;x+=18){const y=10+l*7+Math.sin(x*.026+t*.0018+l)*3;x===-30?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}}
    function fish(f,t){const scale=.68+f.z*.52,len=f.size*2.5*scale,high=f.size*1.3*scale,wave=Math.sin(t*.006+f.phase)*f.size*.13;ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.dir,1);ctx.globalAlpha=.48+f.z*.52;ctx.shadowColor='rgba(0,9,28,.52)';ctx.shadowBlur=7*f.z;ctx.shadowOffsetY=4*f.z;let g=ctx.createLinearGradient(-len*.72,0,-len*.2,0);g.addColorStop(0,`hsla(${f.stripe},92%,64%,.72)`);g.addColorStop(1,`hsl(${f.hue},87%,48%)`);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-len*.42,0);ctx.quadraticCurveTo(-len*.9,-high*.72+wave,-len*.77,0);ctx.quadraticCurveTo(-len*.9,high*.72+wave,-len*.42,0);ctx.fill();g=ctx.createRadialGradient(len*.18,-high*.28,1,0,0,len*.72);g.addColorStop(0,`hsl(${f.hue+8},95%,72%)`);g.addColorStop(.48,`hsl(${f.hue},88%,52%)`);g.addColorStop(1,`hsl(${f.hue-12},82%,26%)`);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,len*.53,high*.5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha*=.45;ctx.fillStyle=`hsl(${f.stripe},88%,70%)`;ctx.beginPath();ctx.ellipse(-len*.09,0,len*.07,high*.47,0,0,Math.PI*2);ctx.ellipse(len*.12,0,len*.045,high*.4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.48+f.z*.52;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(len*.29,-high*.13,high*.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#061521';ctx.beginPath();ctx.arc(len*.31,-high*.13,high*.052,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(len*.327,-high*.16,high*.018,0,Math.PI*2);ctx.fill();ctx.restore()}
    function drawParticles(dt){particles=particles.filter(p=>{p.life-=dt;if(p.life<=0)return false;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);if(p.kind==='bubble'){const g=ctx.createRadialGradient(p.x-p.size*.35,p.y-p.size*.35,0,p.x,p.y,p.size);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.3,'rgba(177,241,255,.2)');g.addColorStop(1,'rgba(91,213,255,.08)');ctx.fillStyle=g;ctx.strokeStyle='rgba(214,249,255,.7)';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.stroke()}else if(p.kind==='food'){ctx.fillStyle='#f5bd52';ctx.shadowColor='rgba(255,172,42,.5)';ctx.shadowBlur=4;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#ff5f75';ctx.shadowColor='rgba(255,78,105,.65)';ctx.shadowBlur=8;ctx.font=`${p.size*2}px system-ui`;ctx.textAlign='center';ctx.fillText('♥',p.x,p.y)}ctx.restore();return p.y>-30&&p.y<height+30})}
    function glass(){const v=ctx.createRadialGradient(width*.5,height*.42,Math.min(width,height)*.18,width*.5,height*.42,Math.max(width,height)*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.72,'rgba(0,12,27,.02)');v.addColorStop(1,'rgba(0,8,20,.38)');ctx.fillStyle=v;ctx.fillRect(0,0,width,height);ctx.strokeStyle='rgba(180,242,255,.42)';ctx.lineWidth=2;ctx.strokeRect(1,1,width-2,height-2);const r=ctx.createLinearGradient(0,0,width*.35,height);r.addColorStop(0,'rgba(255,255,255,.12)');r.addColorStop(.18,'rgba(255,255,255,0)');r.addColorStop(.82,'rgba(255,255,255,0)');r.addColorStop(1,'rgba(255,255,255,.06)');ctx.fillStyle=r;ctx.fillRect(0,0,width,height)}
    function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;bubbleClock+=dt;if(bubbleClock>.7){bubbleClock=0;bubbles(width*(.08+Math.random()*.84),height*.85,1)}for(const f of fishes){f.x+=f.speed*f.dir*dt;f.speed+=(28*(.65+f.z*.6)-f.speed)*dt*.2;if(f.dir===1&&f.x>width+f.size*3)f.x=-f.size*3;if(f.dir===-1&&f.x<-f.size*3)f.x=width+f.size*3;const natural=f.baseY+Math.sin(t*.0013+f.phase)*(7+f.z*6),near=Math.abs(f.x-width*.5)<Math.min(138,width*.26)+f.size*1.5,cy=height*.5;let target=natural;if(near&&Math.abs(natural-cy)<66+f.size)target=cy+f.side*(66+f.size*1.45);f.y+=(target-f.y)*Math.min(1,dt*3.6)}ctx.clearRect(0,0,width,height);background(t);[...fishes].sort((a,b)=>a.z-b.z).forEach(f=>fish(f,t));drawParticles(dt);glass();requestAnimationFrame(frame)}
    canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;bubbles(x,y,9);for(const f of fishes)if(Math.hypot(f.x-x,f.y-y)<110)f.speed=Math.min(f.speed+7,62);say('Bloop!')});
    document.querySelector('#minus').addEventListener('click',()=>{changeHealth(-1);bubbles(width*.5,height*.56,5);say('Lost 1 life')});
    document.querySelector('#plus').addEventListener('click',()=>{changeHealth(1);hearts();say('Gained 1 life')});
    document.querySelector('#reset').addEventListener('click',()=>{health=40;changeHealth(0);hearts();say('Life reset to 40')});
    new ResizeObserver(resize).observe(canvas);resize();changeHealth(0);requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
