<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#031c2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Magic Reef">
  <title>Magic Aquarium Life Counter</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #effcff;
      --line: rgba(198, 245, 255, .48);
      --safe-top: max(18px, calc(env(safe-area-inset-top) + 10px));
      --safe-right: max(16px, calc(env(safe-area-inset-right) + 10px));
      --safe-bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px));
      --safe-left: max(16px, calc(env(safe-area-inset-left) + 10px));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #031c2d;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    button {
      font: inherit;
      color: inherit;
    }

    #app {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: 350px;
      overflow: hidden;
      background: #064465;
    }

    #app::before {
      position: absolute;
      z-index: 3;
      inset: 0;
      border: clamp(5px, 1.3vw, 12px) solid rgba(2, 13, 24, .56);
      box-shadow: inset 0 0 0 1px rgba(199, 245, 255, .36),
        inset 0 0 55px rgba(0, 6, 18, .38);
      content: "";
      pointer-events: none;
    }

    #tank {
      position: absolute;
      z-index: 0;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .waterline {
      position: absolute;
      z-index: 2;
      top: max(7px, env(safe-area-inset-top));
      right: 8px;
      left: 8px;
      height: 4px;
      opacity: .7;
      background: linear-gradient(90deg, transparent, #d4faff, #63d9ff, transparent);
      filter: blur(.7px);
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      z-index: 12;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: var(--safe-top) var(--safe-right) 8px var(--safe-left);
      pointer-events: none;
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
      text-shadow: 0 2px 14px rgba(0, 12, 28, .85);
    }

    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border: 2px solid rgba(222, 251, 255, .9);
      border-radius: 50%;
      background: #45dfb5;
      box-shadow: 0 0 14px rgba(69, 223, 181, .85);
    }

    h1 {
      margin: 0;
      font-size: clamp(13px, 3.7vw, 18px);
      font-weight: 850;
      letter-spacing: -.02em;
    }

    #notice {
      max-width: 48vw;
      margin: 2px 0 0;
      overflow: hidden;
      color: rgba(226, 249, 255, .76);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      min-width: 74px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid rgba(191, 241, 255, .3);
      border-radius: 999px;
      background: rgba(2, 25, 42, .5);
      box-shadow: 0 8px 30px rgba(0, 12, 28, .18);
      backdrop-filter: blur(12px) saturate(1.3);
      -webkit-backdrop-filter: blur(12px) saturate(1.3);
      font-size: 12px;
      font-weight: 800;
      pointer-events: auto;
      cursor: pointer;
    }

    .pill:active,
    .care:active,
    .shop-item:active,
    .shop-close:active {
      transform: scale(.96);
      filter: brightness(1.12);
    }

    .pearl {
      color: #ffe680;
      text-shadow: 0 0 9px rgba(255, 220, 86, .7);
    }

    #healthHud {
      position: absolute;
      z-index: 8;
      top: 50%;
      left: 50%;
      display: flex;
      width: clamp(160px, 42vw, 194px);
      min-height: 98px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 14px 11px;
      transform: translate(-50%, -50%);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(5, 40, 59, .62), rgba(2, 23, 40, .36));
      box-shadow: 0 12px 36px rgba(0, 12, 28, .3),
        inset 0 1px 0 rgba(255, 255, 255, .2),
        0 0 22px rgba(83, 216, 255, .16);
      backdrop-filter: blur(9px) saturate(1.5);
      -webkit-backdrop-filter: blur(9px) saturate(1.5);
      pointer-events: none;
    }

    #healthHud.critical {
      border-color: rgba(255, 115, 127, .7);
      animation: critical 1.2s ease-in-out infinite;
    }

    #health {
      color: #fff;
      font-size: clamp(68px, 20vw, 94px);
      font-variant-numeric: tabular-nums;
      font-weight: 950;
      line-height: .8;
      letter-spacing: -.075em;
      text-shadow: 0 4px 18px rgba(0, 10, 24, .8),
        0 0 18px rgba(107, 226, 255, .42);
    }

    #population {
      margin-top: 7px;
      color: rgba(221, 249, 255, .8);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    #eventBadge {
      position: absolute;
      top: -11px;
      padding: 4px 9px;
      border: 1px solid rgba(255, 180, 187, .7);
      border-radius: 999px;
      background: #9f2437;
      box-shadow: 0 0 18px rgba(255, 54, 84, .5);
      color: white;
      font-size: 8px;
      font-weight: 950;
      letter-spacing: .13em;
      opacity: 0;
      transform: translateY(5px) scale(.85);
      transition: .18s ease;
    }

    #eventBadge.show {
      opacity: 1;
      transform: none;
    }

    .controls {
      position: absolute;
      z-index: 11;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: .9fr 1.15fr 1.15fr;
      gap: 8px;
      width: min(100%, 470px);
      margin: 0 auto;
      padding: 10px var(--safe-right) var(--safe-bottom) var(--safe-left);
      pointer-events: none;
    }

    .care {
      position: relative;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 7px 10px;
      border: 1px solid rgba(220, 250, 255, .34);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0, 12, 28, .35),
        inset 0 1px 0 rgba(255, 255, 255, .23);
      backdrop-filter: blur(15px) saturate(1.4);
      -webkit-backdrop-filter: blur(15px) saturate(1.4);
      pointer-events: auto;
      transition: transform .14s ease, filter .14s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .care::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, rgba(255, 255, 255, .16), transparent 45%);
      content: "";
      pointer-events: none;
    }

    #feed {
      background: linear-gradient(145deg, rgba(218, 142, 34, .94), rgba(152, 80, 24, .88));
    }

    #minus {
      background: linear-gradient(145deg, rgba(210, 75, 75, .92), rgba(130, 34, 66, .86));
    }

    #plus {
      background: linear-gradient(145deg, rgba(28, 174, 132, .92), rgba(8, 91, 119, .88));
    }

    .care-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      font-size: 30px;
      font-weight: 950;
      line-height: .88;
      letter-spacing: -.04em;
    }

    #feed .care-copy {
      font-size: 16px;
      letter-spacing: .01em;
    }

    .care small {
      margin-top: 5px;
      color: rgba(255, 255, 255, .72);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: .11em;
    }

    .shade {
      position: absolute;
      z-index: 4;
      right: 0;
      bottom: 0;
      left: 0;
      height: max(94px, calc(env(safe-area-inset-bottom) + 80px));
      background: linear-gradient(transparent, rgba(0, 10, 19, .48));
      pointer-events: none;
    }

    #toast {
      position: absolute;
      z-index: 30;
      top: calc(var(--safe-top) + 48px);
      left: 50%;
      max-width: min(80vw, 360px);
      overflow: hidden;
      padding: 7px 12px;
      transform: translate(-50%, -8px);
      border: 1px solid rgba(198, 245, 255, .32);
      border-radius: 999px;
      background: rgba(2, 22, 36, .88);
      box-shadow: 0 10px 30px rgba(0, 7, 20, .4);
      color: #eefdff;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .04em;
      opacity: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: .18s ease;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #shop {
      position: absolute;
      z-index: 24;
      right: 12px;
      bottom: calc(var(--safe-bottom) + 82px);
      left: 12px;
      width: min(calc(100% - 24px), 410px);
      margin: 0 auto;
      padding: 13px;
      transform: translateY(24px) scale(.96);
      border: 1px solid rgba(167, 231, 247, .34);
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(6, 35, 50, .97), rgba(2, 18, 31, .97));
      box-shadow: 0 24px 70px rgba(0, 5, 18, .64),
        inset 0 1px 0 rgba(255, 255, 255, .1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }

    #shop.open {
      transform: none;
      opacity: 1;
      pointer-events: auto;
    }

    .shop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .shop-title {
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .1em;
    }

    .shop-title small {
      display: block;
      margin-top: 2px;
      color: rgba(218, 247, 255, .58);
      font-size: 8px;
      letter-spacing: .05em;
    }

    .shop-close {
      width: 31px;
      height: 31px;
      border: 1px solid rgba(190, 238, 250, .24);
      border-radius: 10px;
      background: rgba(255, 255, 255, .05);
      cursor: pointer;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .shop-item {
      min-height: 88px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
      padding: 10px;
      border: 1px solid rgba(190, 238, 250, .2);
      border-radius: 15px;
      background: rgba(255, 255, 255, .055);
      text-align: left;
      cursor: pointer;
    }

    .shop-item:disabled {
      opacity: .42;
      filter: grayscale(.6);
      cursor: not-allowed;
    }

    .item-name {
      font-size: 13px;
      font-weight: 900;
    }

    .item-desc {
      color: rgba(222, 248, 255, .62);
      font-size: 9px;
      line-height: 1.25;
    }

    .price {
      color: #ffe680;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .07em;
    }

    .reset-row {
      width: 100%;
      height: 38px;
      margin-top: 8px;
      border: 1px solid rgba(190, 238, 250, .18);
      border-radius: 12px;
      background: rgba(255, 255, 255, .045);
      color: rgba(234, 251, 255, .8);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .06em;
      cursor: pointer;
    }

    @keyframes critical {
      50% {
        box-shadow: 0 0 28px rgba(255, 79, 103, .42);
      }
    }

    @media (orientation: landscape) {
      .topbar {
        padding-top: max(13px, calc(env(safe-area-inset-top) + 7px));
      }

      .controls {
        right: var(--safe-right);
        bottom: var(--safe-bottom);
        left: auto;
        width: min(440px, 53vw);
        margin: 0;
        padding: 0;
      }

      #healthHud {
        width: 184px;
      }

      #shop {
        right: auto;
        bottom: var(--safe-bottom);
        left: var(--safe-left);
        width: min(360px, 43vw);
        margin: 0;
      }

      .shade {
        height: 88px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      #notice {
        display: none;
      }

      .care {
        height: 58px;
      }

      #healthHud {
        min-height: 86px;
      }

      #health {
        font-size: 72px;
      }

      #shop {
        max-height: calc(100% - 24px);
        overflow: auto;
      }
    }

    @media (max-width: 365px) {
      .controls {
        gap: 6px;
        padding-inline: 10px;
      }

      .care {
        padding-inline: 6px;
      }

      .care-copy {
        font-size: 27px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #healthHud.critical {
        animation: none;
      }

      .care,
      #eventBadge,
      #toast,
      #shop {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="tank" aria-label="Interactive aquarium where the creature count matches the Magic life total"></canvas>
    <div class="waterline" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <h1>Magic Aquarium Life</h1>
          <p id="notice">Feed the reef and earn pearls</p>
        </div>
      </div>
      <button class="pill" id="shopButton" type="button" aria-expanded="false" aria-controls="shop">
        <span class="pearl" aria-hidden="true">◆</span>
        <span id="pearlCount">20</span>
        <span>SHOP</span>
      </button>
    </header>

    <section id="healthHud" role="status" aria-live="polite" aria-label="Magic life total 40 with 40 creatures">
      <span id="eventBadge">SHARK ATTACK</span>
      <strong id="health">40</strong>
      <span id="population">40 creatures</span>
    </section>

    <nav class="controls" aria-label="Aquarium and Magic life controls">
      <button class="care" id="feed" type="button" aria-label="Feed the fish">
        <span class="care-copy">FEED<small>DROP FOOD</small></span>
      </button>
      <button class="care" id="minus" type="button" aria-label="Lose one life; hold to lose five">
        <span class="care-copy">−1<small>HOLD −5</small></span>
      </button>
      <button class="care" id="plus" type="button" aria-label="Gain one life; hold to gain five">
        <span class="care-copy">+1<small>HOLD +5</small></span>
      </button>
    </nav>

    <aside id="shop" aria-label="Reef shop" aria-hidden="true">
      <div class="shop-head">
        <div class="shop-title">REEF SHOP<small>Fish earn pearls when they eat</small></div>
        <button class="shop-close" id="closeShop" type="button" aria-label="Close shop">×</button>
      </div>
      <div class="shop-grid">
        <button class="shop-item" id="buySquid" type="button">
          <span class="item-name">🦑 Add Squid</span>
          <span class="item-desc">Eats food, grows, and earns double pearls.</span>
          <span class="price">◆ 8 PEARLS</span>
        </button>
        <button class="shop-item" id="buyPiranha" type="button">
          <span class="item-name">◆ Buy Piranha</span>
          <span class="item-desc">Hunts fish, then rivals until only two remain.</span>
          <span class="price">◆ 18 PEARLS</span>
        </button>
      </div>
      <button class="reset-row" id="resetTank" type="button">RESET TANK + LIFE TO 40</button>
    </aside>

    <div id="toast" role="status" aria-live="polite"></div>
    <div class="shade" aria-hidden="true"></div>
  </main>

  <script>
  (() => {
    'use strict';

    const $ = (selector) => document.querySelector(selector);
    const canvas = $('#tank');
    const ctx = canvas.getContext('2d');
    const healthEl = $('#health');
    const populationEl = $('#population');
    const hud = $('#healthHud');
    const notice = $('#notice');
    const pearlEl = $('#pearlCount');
    const eventBadge = $('#eventBadge');
    const shop = $('#shop');
    const shopButton = $('#shopButton');
    const buySquidButton = $('#buySquid');
    const buyPiranhaButton = $('#buyPiranha');
    const toastEl = $('#toast');

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const fishHues = [18, 34, 48, 172, 195, 215, 278, 318, 350];
    const MAX_LIFE = 120;

    let width = 0;
    let height = 0;
    let dpr = 1;
    let life = 40;
    let pearls = 20;
    let creatures = [];
    let food = [];
    let particles = [];
    let shark = null;
    let nextId = 1;
    let lastFrame = performance.now();
    let bubbleClock = 0;
    let pendingLoss = 0;
    let lossSamples = [];
    let settleTimer = 0;
    let toastTimer = 0;

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function say(text) {
      notice.textContent = text;
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1250);
    }

    function refreshUI() {
      healthEl.textContent = life;
      populationEl.textContent = creatures.length + (creatures.length === 1 ? ' CREATURE' : ' CREATURES');
      pearlEl.textContent = pearls;
      hud.classList.toggle('critical', life <= 10);
      hud.setAttribute('aria-label', 'Magic life total ' + life + ' with ' + creatures.length + ' creatures');
      buySquidButton.disabled = pearls < 8 || life >= MAX_LIFE;
      buyPiranhaButton.disabled = pearls < 18 || life >= MAX_LIFE;
    }

    function setShop(open) {
      shop.classList.toggle('open', open);
      shop.setAttribute('aria-hidden', String(!open));
      shopButton.setAttribute('aria-expanded', String(open));
    }

    function spawnCreature(type, options) {
      const settings = options || {};
      const upper = Math.random() > .5;
      const z = random(.18, 1);
      const sizes = { fish: random(9, 16), squid: random(13, 17), piranha: random(14, 18) };
      const creature = {
        id: nextId++,
        type,
        x: settings.x === undefined ? random(20, Math.max(21, width - 20)) : settings.x,
        y: settings.y === undefined ? height * random(upper ? .18 : .55, upper ? .4 : .79) : settings.y,
        baseY: height * random(upper ? .18 : .55, upper ? .4 : .79),
        z,
        size: sizes[type],
        scale: settings.scale || 1,
        targetScale: settings.scale || 1,
        speed: type === 'piranha' ? random(48, 62) : random(22, 39) * (.7 + z * .35),
        direction: Math.random() > .5 ? 1 : -1,
        phase: random(0, Math.PI * 2),
        hue: fishHues[Math.floor(Math.random() * fishHues.length)] + random(-4, 6),
        stripe: fishHues[Math.floor(Math.random() * fishHues.length)],
        avoidSide: upper ? -1 : 1,
        biteCooldown: type === 'piranha' ? random(1, 2.4) : 0
      };
      creatures.push(creature);
      return creature;
    }

    function resetTank() {
      clearTimeout(settleTimer);
      pendingLoss = 0;
      lossSamples = [];
      life = 40;
      shark = null;
      eventBadge.classList.remove('show');
      creatures = [];
      food = [];
      particles = [];
      for (let i = 0; i < 38; i += 1) spawnCreature('fish');
      spawnCreature('squid', { scale: 1.08 });
      spawnCreature('squid');
      refreshUI();
      say('Tank restored: 38 fish and 2 squid');
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const oldWidth = width;
      const oldHeight = height;
      width = Math.max(1, rect.width);
      height = Math.max(1, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (oldWidth > 0 && oldHeight > 0) {
        const sx = width / oldWidth;
        const sy = height / oldHeight;
        creatures.forEach((creature) => {
          creature.x *= sx;
          creature.y *= sy;
          creature.baseY *= sy;
        });
        food.forEach((pellet) => {
          pellet.x *= sx;
          pellet.y *= sy;
        });
        if (shark) {
          shark.x *= sx;
          shark.y *= sy;
        }
      }
    }

    function addParticle(x, y, kind, count) {
      for (let i = 0; i < count; i += 1) {
        const isBubble = kind === 'bubble';
        particles.push({
          x: x + random(-18, 18),
          y: y + random(-10, 10),
          vx: random(-28, 28),
          vy: isBubble ? random(-55, -20) : random(-44, 16),
          life: random(.65, 1.45),
          maxLife: 1.45,
          size: random(2, isBubble ? 6 : 4.5),
          kind
        });
      }
    }

    function addHearts(x, y) {
      for (let i = 0; i < 5; i += 1) {
        particles.push({
          x: x + random(-42, 42),
          y: y + random(-5, 24),
          vx: random(-12, 12),
          vy: random(-38, -20),
          life: random(1.3, 2.1),
          maxLife: 2.1,
          size: random(6, 10),
          kind: 'heart'
        });
      }
    }

    function dropFood() {
      for (let i = 0; i < 20; i += 1) {
        food.push({
          id: nextId++,
          x: width * random(.1, .9),
          y: height * random(.06, .12),
          vx: random(-6, 6),
          vy: random(13, 25),
          size: random(2.2, 3.8),
          life: 11
        });
      }
      say('Food dropped — creatures are hungry');
    }

    function closestFood(creature) {
      let closest = null;
      let best = Infinity;
      for (const pellet of food) {
        const distance = Math.hypot(pellet.x - creature.x, pellet.y - creature.y);
        if (distance < best) {
          best = distance;
          closest = pellet;
        }
      }
      return closest;
    }

    function eatFood(creature, pellet) {
      food = food.filter((item) => item.id !== pellet.id);
      const limit = creature.type === 'piranha' ? 1.85 : creature.type === 'squid' ? 1.75 : 1.55;
      creature.targetScale = Math.min(limit, creature.targetScale + .035);
      const reward = creature.type === 'squid' ? 2 : 1;
      pearls += reward;
      addParticle(pellet.x, pellet.y, 'coin', reward === 2 ? 5 : 3);
      refreshUI();
    }

    function removeCreature(creature, effect) {
      if (!creature) return false;
      const before = creatures.length;
      creatures = creatures.filter((item) => item.id !== creature.id);
      if (creatures.length === before) return false;
      addParticle(creature.x, creature.y, effect || 'bubble', effect === 'bite' ? 14 : 8);
      return true;
    }

    function cullCandidate() {
      const fish = creatures.filter((item) => item.type === 'fish');
      if (fish.length) return fish[Math.floor(Math.random() * fish.length)];
      const squid = creatures.filter((item) => item.type === 'squid');
      if (squid.length) return squid[Math.floor(Math.random() * squid.length)];
      return creatures[Math.floor(Math.random() * creatures.length)] || null;
    }

    function quietCull(amount) {
      for (let i = 0; i < amount; i += 1) {
        const target = cullCandidate();
        if (!target) break;
        removeCreature(target, 'bubble');
      }
      refreshUI();
    }

    function triggerShark(amount) {
      if (amount <= 0 || !creatures.length) return;
      if (shark) {
        shark.remaining += amount;
      } else {
        const fromLeft = Math.random() > .5;
        shark = {
          x: fromLeft ? -145 : width + 145,
          y: height * random(.27, .73),
          direction: fromLeft ? 1 : -1,
          remaining: amount,
          targetId: null,
          mode: 'hunt',
          size: clamp(Math.min(width, height) * .18, 62, 105)
        };
      }
      eventBadge.classList.add('show');
      say('SHARK ATTACK — big life loss!');
      if (navigator.vibrate) navigator.vibrate([35, 30, 55]);
    }

    function gainLife(amount) {
      const actual = Math.min(amount, MAX_LIFE - life);
      if (actual <= 0) return say('Tank is at maximum population');
      life += actual;
      for (let i = 0; i < actual; i += 1) {
        spawnCreature('fish', {
          x: Math.random() > .5 ? -18 : width + 18,
          y: height * random(.18, .78),
          scale: .72
        }).targetScale = 1;
      }
      addHearts(width * .5, height * .56);
      refreshUI();
      say('Gained ' + actual + ' life — ' + actual + ' fish joined');
    }

    function loseLife(amount) {
      const actual = Math.min(amount, life);
      if (actual <= 0) return say('No life or fish left');
      life -= actual;
      pendingLoss += actual;

      const now = performance.now();
      lossSamples = lossSamples.filter((sample) => now - sample.time < 1150);
      lossSamples.push({ time: now, amount: actual });
      const recentLoss = lossSamples.reduce((sum, sample) => sum + sample.amount, 0);

      clearTimeout(settleTimer);
      if (actual >= 4 || recentLoss >= 4) {
        triggerShark(pendingLoss);
        pendingLoss = 0;
        lossSamples = [];
      } else {
        settleTimer = setTimeout(() => {
          quietCull(pendingLoss);
          pendingLoss = 0;
          lossSamples = [];
        }, 650);
      }

      refreshUI();
      say('Lost ' + actual + ' life');
    }

    function bindLifeButton(button, direction) {
      let holdTimer = 0;
      let held = false;

      button.addEventListener('pointerdown', () => {
        held = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          held = true;
          direction > 0 ? gainLife(5) : loseLife(5);
        }, 520);
      });

      const clearHold = () => clearTimeout(holdTimer);
      button.addEventListener('pointerup', clearHold);
      button.addEventListener('pointercancel', clearHold);
      button.addEventListener('pointerleave', clearHold);
      button.addEventListener('click', (event) => {
        if (held) {
          event.preventDefault();
          held = false;
          return;
        }
        direction > 0 ? gainLife(1) : loseLife(1);
      });
    }

    function buyCreature(type, cost) {
      if (life >= MAX_LIFE) return say('The tank is at maximum population');
      if (pearls < cost) return say('Not enough pearls — feed the tank');
      pearls -= cost;
      life = Math.min(MAX_LIFE, life + 1);
      const creature = spawnCreature(type, {
        x: Math.random() > .5 ? -25 : width + 25,
        y: height * random(.2, .76),
        scale: .82
      });
      creature.targetScale = 1;
      addHearts(creature.x, creature.y);
      refreshUI();
      say(type === 'piranha' ? 'Piranha released — the hunt begins' : 'A squid joined the reef');
      setShop(false);
    }

    function piranhaTarget(piranha) {
      const prey = creatures.filter((item) => item.id !== piranha.id && item.type !== 'piranha');
      let candidates = prey;
      if (!candidates.length) {
        const piranhas = creatures.filter((item) => item.type === 'piranha');
        if (piranhas.length > 2) {
          candidates = piranhas.filter((item) => item.id !== piranha.id);
        }
      }
      let target = null;
      let best = Infinity;
      for (const candidate of candidates) {
        const distance = Math.hypot(candidate.x - piranha.x, candidate.y - piranha.y);
        if (distance < best) {
          best = distance;
          target = candidate;
        }
      }
      return target;
    }

    function piranhaBite(piranha, prey) {
      if (!removeCreature(prey, 'bite')) return;
      life = Math.max(0, life - 1);
      piranha.targetScale = Math.min(1.9, piranha.targetScale + .065);
      piranha.biteCooldown = random(1.7, 2.8);
      refreshUI();
      const remainingPiranhas = creatures.filter((item) => item.type === 'piranha').length;
      if (prey.type === 'piranha') {
        say('Piranha ate a rival — ' + remainingPiranhas + ' remain');
      } else {
        say('Piranha ate a ' + prey.type + ' — life dropped');
      }
    }

    function updateFood(dt) {
      food = food.filter((pellet) => {
        pellet.life -= dt;
        pellet.vy = Math.min(32, pellet.vy + dt * 4);
        pellet.x += pellet.vx * dt;
        pellet.y += pellet.vy * dt;
        if (pellet.y > height * .86) {
          pellet.y = height * .86;
          pellet.vy = 0;
          pellet.vx *= .8;
        }
        return pellet.life > 0;
      });
    }

    function updateCreatures(dt, time) {
      const snapshot = creatures.slice();
      for (const creature of snapshot) {
        if (!creatures.some((item) => item.id === creature.id)) continue;
        creature.scale += (creature.targetScale - creature.scale) * Math.min(1, dt * .48);
        creature.biteCooldown = Math.max(0, creature.biteCooldown - dt);

        let target = null;
        let targetKind = '';

        if (creature.type === 'piranha') {
          target = piranhaTarget(creature);
          targetKind = target ? 'prey' : '';
        }

        if (!target && food.length) {
          target = closestFood(creature);
          targetKind = target ? 'food' : '';
        }

        if (target) {
          const dx = target.x - creature.x;
          const dy = target.y - creature.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const chaseSpeed = creature.type === 'piranha' && targetKind === 'prey'
            ? creature.speed * 1.4
            : creature.speed * 1.08;
          creature.x += dx / distance * chaseSpeed * dt;
          creature.y += dy / distance * chaseSpeed * dt;
          creature.direction = dx >= 0 ? 1 : -1;

          if (targetKind === 'food' && distance < creature.size * creature.scale + 7) {
            eatFood(creature, target);
          } else if (
            targetKind === 'prey' &&
            distance < (creature.size * creature.scale + target.size * target.scale) * .95 &&
            creature.biteCooldown <= 0
          ) {
            piranhaBite(creature, target);
          }
        } else {
          creature.x += creature.direction * creature.speed * dt;
          creature.y += Math.sin(time * .0015 + creature.phase) * creature.speed * .12 * dt;
        }

        if (creature.x > width + creature.size * 3) creature.x = -creature.size * 3;
        if (creature.x < -creature.size * 3) creature.x = width + creature.size * 3;
        creature.y = clamp(creature.y, height * .12, height * .84);

        const hudHalfWidth = Math.min(150, width * .28);
        const hudHalfHeight = 78;
        const nearHud = Math.abs(creature.x - width * .5) < hudHalfWidth + creature.size * creature.scale;
        if (nearHud && Math.abs(creature.y - height * .5) < hudHalfHeight + creature.size * creature.scale) {
          const targetY = height * .5 + creature.avoidSide * (hudHalfHeight + creature.size * creature.scale * 1.5);
          creature.y += (targetY - creature.y) * Math.min(1, dt * 5);
        }
      }
    }

    function updateShark(dt) {
      if (!shark) return;

      if (shark.mode === 'hunt') {
        let target = creatures.find((item) => item.id === shark.targetId);
        if (!target) {
          target = cullCandidate();
          shark.targetId = target ? target.id : null;
        }

        if (!target || shark.remaining <= 0) {
          shark.mode = 'exit';
          shark.targetId = null;
          shark.direction = shark.x < width * .5 ? -1 : 1;
        } else {
          const dx = target.x - shark.x;
          const dy = target.y - shark.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          shark.direction = dx >= 0 ? 1 : -1;
          shark.x += dx / distance * 205 * dt;
          shark.y += dy / distance * 175 * dt;

          if (distance < shark.size * .55 + target.size * target.scale) {
            removeCreature(target, 'bite');
            shark.remaining -= 1;
            shark.targetId = null;
            refreshUI();
          }
        }
      } else {
        shark.x += shark.direction * 245 * dt;
        if (shark.x < -shark.size * 2 || shark.x > width + shark.size * 2) {
          shark = null;
          eventBadge.classList.remove('show');
          say('The shark is gone');
        }
      }
    }

    function updateParticles(dt) {
      particles = particles.filter((particle) => {
        particle.life -= dt;
        if (particle.life <= 0) return false;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        if (particle.kind !== 'bubble') particle.vy += 24 * dt;
        return particle.y > -40 && particle.y < height + 40;
      });
    }

    function drawPlant(x, floor, plantHeight, hue, sway) {
      ctx.save();
      ctx.lineCap = 'round';
      for (let stem = 0; stem < 4; stem += 1) {
        const offset = (stem - 1.5) * 6;
        const tipX = x + offset + Math.sin(sway + stem) * 14;
        const gradient = ctx.createLinearGradient(x, floor, tipX, floor - plantHeight);
        gradient.addColorStop(0, 'hsla(' + hue + ',72%,22%,.9)');
        gradient.addColorStop(1, 'hsla(' + (hue + 16) + ',86%,48%,.78)');
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 3 + stem * .35;
        ctx.beginPath();
        ctx.moveTo(x + offset, floor);
        ctx.bezierCurveTo(
          x + offset - 12,
          floor - plantHeight * .35,
          tipX + 15,
          floor - plantHeight * .68,
          tipX,
          floor - plantHeight
        );
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBackground(time) {
      const water = ctx.createLinearGradient(0, 0, 0, height);
      water.addColorStop(0, '#006da0');
      water.addColorStop(.38, '#045781');
      water.addColorStop(.72, '#073d5c');
      water.addColorStop(1, '#08283b');
      ctx.fillStyle = water;
      ctx.fillRect(0, 0, width, height);

      const glow = ctx.createRadialGradient(width * .5, -height * .1, 10, width * .5, 0, width * .72);
      glow.addColorStop(0, 'rgba(130,238,255,.34)');
      glow.addColorStop(1, 'rgba(0,72,110,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height * .78);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let ray = 0; ray < 5; ray += 1) {
        const x = (ray + .5) / 5 * width + Math.sin(time * .0002 + ray) * 25;
        const gradient = ctx.createLinearGradient(x, 0, x, height * .75);
        gradient.addColorStop(0, 'rgba(142,238,255,.12)');
        gradient.addColorStop(1, 'rgba(142,238,255,0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(x - width * .04, 0);
        ctx.lineTo(x + width * .07, 0);
        ctx.lineTo(x + width * .16, height * .74);
        ctx.lineTo(x - width * .1, height * .74);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      const floor = height * .88;
      const sand = ctx.createLinearGradient(0, floor - 12, 0, height);
      sand.addColorStop(0, '#d5c184');
      sand.addColorStop(.25, '#9f8958');
      sand.addColorStop(1, '#463b2d');
      ctx.fillStyle = sand;
      ctx.beginPath();
      ctx.moveTo(0, floor);
      for (let x = 0; x <= width + 40; x += 40) {
        ctx.lineTo(x, floor + Math.sin(x * .025 + time * .0003) * 5);
      }
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();

      for (let rock = 0; rock < 12; rock += 1) {
        const x = rock / 11 * width + Math.sin(rock * 8.4) * 24;
        const size = 12 + (rock * 17) % 27;
        const gradient = ctx.createRadialGradient(
          x - size * .25,
          floor - size * .4,
          1,
          x,
          floor,
          size
        );
        gradient.addColorStop(0, rock % 3 === 0 ? '#59847a' : '#65706a');
        gradient.addColorStop(1, '#1b3130');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(x, floor - size * .15, size, size * .56, -.1, 0, Math.PI * 2);
        ctx.fill();
      }

      const plantCount = width < 520 ? 7 : 11;
      for (let plant = 0; plant < plantCount; plant += 1) {
        const x = plant / (plantCount - 1) * width;
        const edgeBias = Math.abs(x - width * .5) / (width * .5);
        if (edgeBias < .3) continue;
        drawPlant(
          x,
          floor,
          height * (.12 + (plant * 13) % 16 / 100),
          plant % 3 === 0 ? 165 : 128,
          time * .0014 + plant
        );
      }

      ctx.strokeStyle = 'rgba(171,239,255,.18)';
      ctx.lineWidth = 1.2;
      for (let line = 0; line < 8; line += 1) {
        ctx.beginPath();
        for (let x = -30; x < width + 40; x += 18) {
          const y = 10 + line * 7 + Math.sin(x * .026 + time * .0018 + line) * 3;
          x === -30 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    function drawFish(creature, time, piranha) {
      const size = creature.size * creature.scale;
      const depth = .68 + creature.z * .42;
      const length = size * (piranha ? 3 : 2.5) * depth;
      const bodyHeight = size * (piranha ? 1.42 : 1.25) * depth;
      const tailWave = Math.sin(time * .007 + creature.phase) * size * .15;

      ctx.save();
      ctx.translate(creature.x, creature.y);
      ctx.scale(creature.direction, 1);
      ctx.globalAlpha = .55 + creature.z * .45;
      ctx.shadowColor = 'rgba(0,9,28,.48)';
      ctx.shadowBlur = 6 * creature.z;
      ctx.shadowOffsetY = 3 * creature.z;

      ctx.fillStyle = piranha ? '#78253b' : 'hsl(' + creature.stripe + ',84%,58%)';
      ctx.beginPath();
      ctx.moveTo(-length * .4, 0);
      ctx.quadraticCurveTo(-length * .88, -bodyHeight * .7 + tailWave, -length * .76, 0);
      ctx.quadraticCurveTo(-length * .88, bodyHeight * .7 + tailWave, -length * .4, 0);
      ctx.fill();

      const gradient = ctx.createRadialGradient(length * .16, -bodyHeight * .25, 1, 0, 0, length * .7);
      if (piranha) {
        gradient.addColorStop(0, '#ff7c78');
        gradient.addColorStop(.48, '#b83248');
        gradient.addColorStop(1, '#43172a');
      } else {
        gradient.addColorStop(0, 'hsl(' + (creature.hue + 8) + ',95%,72%)');
        gradient.addColorStop(.48, 'hsl(' + creature.hue + ',88%,52%)');
        gradient.addColorStop(1, 'hsl(' + (creature.hue - 12) + ',82%,26%)');
      }
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.ellipse(0, 0, length * .53, bodyHeight * .5, 0, 0, Math.PI * 2);
      ctx.fill();

      if (!piranha) {
        ctx.globalAlpha *= .4;
        ctx.fillStyle = 'hsl(' + creature.stripe + ',88%,76%)';
        ctx.beginPath();
        ctx.ellipse(-length * .08, 0, length * .055, bodyHeight * .47, 0, 0, Math.PI * 2);
        ctx.ellipse(length * .12, 0, length * .04, bodyHeight * .4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = .55 + creature.z * .45;
      }

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(length * .29, -bodyHeight * .13, bodyHeight * .1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#061521';
      ctx.beginPath();
      ctx.arc(length * .315, -bodyHeight * .13, bodyHeight * .052, 0, Math.PI * 2);
      ctx.fill();

      if (piranha) {
        ctx.fillStyle = 'rgba(10,8,14,.86)';
        ctx.beginPath();
        ctx.moveTo(length * .24, bodyHeight * .05);
        ctx.quadraticCurveTo(length * .51, bodyHeight * .2, length * .48, -bodyHeight * .03);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff4dd';
        for (let tooth = 0; tooth < 3; tooth += 1) {
          const x = length * (.31 + tooth * .055);
          ctx.beginPath();
          ctx.moveTo(x, bodyHeight * .04);
          ctx.lineTo(x + length * .025, bodyHeight * .15);
          ctx.lineTo(x + length * .045, bodyHeight * .055);
          ctx.fill();
        }
        ctx.fillStyle = '#67213a';
        ctx.beginPath();
        ctx.moveTo(-length * .04, -bodyHeight * .46);
        ctx.lineTo(length * .05, -bodyHeight * .88);
        ctx.lineTo(length * .18, -bodyHeight * .4);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawSquid(creature, time) {
      const size = creature.size * creature.scale * (.75 + creature.z * .35);
      const wave = time * .004 + creature.phase;
      ctx.save();
      ctx.translate(creature.x, creature.y);
      ctx.scale(creature.direction, 1);
      ctx.globalAlpha = .58 + creature.z * .42;
      ctx.shadowColor = 'rgba(7,7,35,.5)';
      ctx.shadowBlur = 8;

      for (let tentacle = 0; tentacle < 6; tentacle += 1) {
        const x = (tentacle - 2.5) * size * .15;
        ctx.strokeStyle = tentacle % 2 ? '#c16fe2' : '#9359d6';
        ctx.lineWidth = Math.max(1.5, size * .09);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, size * .35);
        ctx.bezierCurveTo(
          x + Math.sin(wave + tentacle) * size * .32,
          size * .75,
          x - Math.cos(wave * 1.2 + tentacle) * size * .35,
          size * 1.05,
          x + Math.sin(wave * 1.4 + tentacle) * size * .42,
          size * 1.32
        );
        ctx.stroke();
      }

      const gradient = ctx.createRadialGradient(size * .2, -size * .25, 1, 0, 0, size * 1.05);
      gradient.addColorStop(0, '#efa7ff');
      gradient.addColorStop(.5, '#a759d4');
      gradient.addColorStop(1, '#55338f');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.moveTo(0, -size * .95);
      ctx.quadraticCurveTo(size * .72, -size * .42, size * .56, size * .38);
      ctx.quadraticCurveTo(0, size * .72, -size * .56, size * .38);
      ctx.quadraticCurveTo(-size * .72, -size * .42, 0, -size * .95);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(size * .23, size * .08, size * .13, 0, Math.PI * 2);
      ctx.arc(-size * .23, size * .08, size * .13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#15172b';
      ctx.beginPath();
      ctx.arc(size * .26, size * .09, size * .06, 0, Math.PI * 2);
      ctx.arc(-size * .2, size * .09, size * .06, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFood() {
      for (const pellet of food) {
        ctx.save();
        ctx.fillStyle = '#f5bd52';
        ctx.shadowColor = 'rgba(255,172,42,.65)';
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(pellet.x, pellet.y, pellet.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawShark() {
      if (!shark) return;
      const size = shark.size;
      ctx.save();
      ctx.translate(shark.x, shark.y);
      ctx.scale(shark.direction, 1);
      ctx.shadowColor = 'rgba(0,7,18,.55)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 8;

      ctx.fillStyle = '#567584';
      ctx.beginPath();
      ctx.moveTo(-size * .58, 0);
      ctx.lineTo(-size * 1.15, -size * .48);
      ctx.lineTo(-size * 1.02, 0);
      ctx.lineTo(-size * 1.15, size * .48);
      ctx.closePath();
      ctx.fill();

      const gradient = ctx.createLinearGradient(0, -size * .45, 0, size * .45);
      gradient.addColorStop(0, '#7695a4');
      gradient.addColorStop(.58, '#456776');
      gradient.addColorStop(.6, '#d6e1df');
      gradient.addColorStop(1, '#839795');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.ellipse(0, 0, size, size * .42, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#526f7c';
      ctx.beginPath();
      ctx.moveTo(-size * .1, -size * .34);
      ctx.lineTo(size * .13, -size * .85);
      ctx.lineTo(size * .36, -size * .3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#101b22';
      ctx.beginPath();
      ctx.arc(size * .56, -size * .13, size * .055, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#eef4ed';
      ctx.beginPath();
      ctx.moveTo(size * .62, size * .04);
      ctx.quadraticCurveTo(size * .95, size * .2, size * .86, -.02);
      ctx.quadraticCurveTo(size * .76, size * .12, size * .62, size * .04);
      ctx.fill();
      ctx.restore();
    }

    function drawParticles() {
      for (const particle of particles) {
        const alpha = clamp(particle.life / particle.maxLife, 0, 1);
        ctx.save();
        ctx.globalAlpha = alpha;
        if (particle.kind === 'bubble') {
          ctx.strokeStyle = 'rgba(218,250,255,.78)';
          ctx.fillStyle = 'rgba(135,225,255,.12)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (particle.kind === 'coin') {
          ctx.fillStyle = '#ffe066';
          ctx.shadowColor = '#ffce3a';
          ctx.shadowBlur = 7;
          ctx.translate(particle.x, particle.y);
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-particle.size, -particle.size, particle.size * 2, particle.size * 2);
        } else if (particle.kind === 'heart') {
          ctx.fillStyle = '#ff657b';
          ctx.shadowColor = '#ff4966';
          ctx.shadowBlur = 8;
          ctx.font = particle.size * 2 + 'px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('♥', particle.x, particle.y);
        } else {
          ctx.fillStyle = particle.kind === 'bite' ? '#ff695e' : '#c7f6ff';
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawGlass() {
      const vignette = ctx.createRadialGradient(
        width * .5,
        height * .42,
        Math.min(width, height) * .18,
        width * .5,
        height * .42,
        Math.max(width, height) * .72
      );
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(.72, 'rgba(0,12,27,.02)');
      vignette.addColorStop(1, 'rgba(0,8,20,.38)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = 'rgba(180,242,255,.42)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, width - 2, height - 2);
    }

    function frame(time) {
      const dt = Math.min((time - lastFrame) / 1000, .05);
      lastFrame = time;

      bubbleClock += dt;
      if (bubbleClock > .72) {
        bubbleClock = 0;
        addParticle(width * random(.08, .92), height * .84, 'bubble', 1);
      }

      updateFood(dt);
      updateCreatures(dt, time);
      updateShark(dt);
      updateParticles(dt);

      ctx.clearRect(0, 0, width, height);
      drawBackground(time);
      drawFood();
      creatures
        .slice()
        .sort((a, b) => a.z - b.z)
        .forEach((creature) => {
          if (creature.type === 'squid') drawSquid(creature, time);
          else drawFish(creature, time, creature.type === 'piranha');
        });
      drawShark();
      drawParticles();
      drawGlass();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      addParticle(x, y, 'bubble', 9);
    });

    $('#feed').addEventListener('click', dropFood);
    bindLifeButton($('#minus'), -1);
    bindLifeButton($('#plus'), 1);

    shopButton.addEventListener('click', () => setShop(!shop.classList.contains('open')));
    $('#closeShop').addEventListener('click', () => setShop(false));
    buySquidButton.addEventListener('click', () => buyCreature('squid', 8));
    buyPiranhaButton.addEventListener('click', () => buyCreature('piranha', 18));
    $('#resetTank').addEventListener('click', () => {
      setShop(false);
      resetTank();
    });

    new ResizeObserver(resize).observe(canvas);
    resize();
    resetTank();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
