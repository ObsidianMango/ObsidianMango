<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b0d"><title>Mango Dice</title><style>
:root{--bg:#080b0d;--panel:#10161a;--panel2:#151d22;--ink:#f4f7f8;--muted:#8b9aa3;--a:#62ffc6;--danger:#ff6477;--gold:#ffd166;--line:#243139}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#17322b 0,#080b0d 43%);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}body{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));user-select:none}.app{width:min(820px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px}.brand{font-weight:950;letter-spacing:.15em;font-size:15px}.brand b{color:var(--a)}.sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.06em}.icon{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:13px;width:44px;height:44px;font-size:18px}.stage{position:relative;min-height:330px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(18,27,31,.92),rgba(8,12,14,.96));box-shadow:0 28px 80px #0008,inset 0 1px #ffffff0a;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#62ffc613,transparent 38%),linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:auto,28px 28px,28px 28px;mask-image:linear-gradient(to bottom,#0008,transparent)}.dicefield{position:relative;z-index:1;width:100%;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;min-height:170px}.die{width:94px;height:94px;display:grid;place-items:center;position:relative;filter:drop-shadow(0 15px 16px #0009);transform-style:preserve-3d}.die:before{content:"";position:absolute;inset:7px;background:linear-gradient(145deg,#26343a,#10171a 58%,#06090a);border:2px solid #62ffc699;border-radius:22%;box-shadow:inset 8px 8px 18px #ffffff0c,inset -8px -8px 20px #000b,0 0 22px #62ffc614;transform:rotate(45deg)}.die span{position:relative;z-index:2;font-size:35px;font-weight:950;text-shadow:0 2px 8px #000}.die.max:before{border-color:var(--gold);box-shadow:0 0 30px #ffd16655,inset 8px 8px 18px #ffffff12}.die.min:before{border-color:var(--danger);box-shadow:0 0 25px #ff647733}.die.rolling{animation:tumble .12s linear infinite}@keyframes tumble{0%{transform:rotate(0) scale(.94)}50%{transform:rotate(7deg) scale(1.06)}100%{transform:rotate(0) scale(.94)}}.total{position:relative;z-index:1;text-align:center;margin-top:12px}.total small{display:block;color:var(--muted);font-weight:800;letter-spacing:.15em;font-size:10px}.total strong{display:block;font-size:clamp(42px,10vw,70px);line-height:1;font-weight:950;letter-spacing:-.04em}.detail{min-height:20px;color:var(--muted);font-size:12px;margin-top:7px}.controls{margin-top:14px;border:1px solid var(--line);background:#0d1316dd;border-radius:24px;padding:14px}.types{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.btn,.type,.mode,.step{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:13px;min-height:46px;font-weight:900;font-size:13px;touch-action:manipulation}.type.active,.mode.active{border-color:var(--a);background:#62ffc617;color:var(--a);box-shadow:0 0 18px #62ffc612}.type:active,.btn:active,.mode:active,.step:active{transform:scale(.96)}.setup{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.box{border:1px solid var(--line);border-radius:17px;padding:10px;background:#0b1013}.label{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}.counter{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}.counter strong{font-size:21px}.step{min-height:40px;font-size:20px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.mode{min-height:40px;font-size:11px}.roll{width:100%;margin-top:12px;min-height:62px;border:0;border-radius:18px;background:var(--a);color:#04100c;font-size:18px;font-weight:1000;letter-spacing:.12em;box-shadow:0 12px 30px #62ffc626}.roll:active{transform:translateY(2px) scale(.99)}.history{margin-top:14px}.historyHead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px}.historyHead strong{font-size:12px;letter-spacing:.12em}.clear{border:0;background:none;color:var(--muted);font-weight:800}.historyList{display:grid;gap:7px}.hist{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#0d1316;border-radius:14px;padding:10px 12px}.hist b{color:var(--a);font-size:12px}.hist span{font-size:12px;color:#c6d0d5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist strong{font-size:19px}.empty{text-align:center;color:var(--muted);font-size:12px;padding:18px}.shake{animation:shake .32s ease}@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}@media(max-width:620px){.types{grid-template-columns:repeat(4,1fr)}.stage{min-height:300px}.die{width:76px;height:76px}.die span{font-size:29px}.setup{grid-template-columns:1fr 1fr}}@media(max-width:380px){.controls{padding:10px}.types{gap:5px}.type{min-height:42px}.setup{gap:6px}.die{width:66px;height:66px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand"><b>◆</b> MANGO DICE</div><div class="sub">tabletop roller · crypto random</div></div><button class="icon" id="sound" aria-label="Toggle sound">◖))</button></header><section class="stage" id="stage"><div class="dicefield" id="dicefield"><div class="die"><span>20</span></div></div><div class="total"><small id="totalLabel">READY</small><strong id="total">ROLL</strong><div class="detail" id="detail">Tap ROLL or shake your phone</div></div></section><section class="controls"><div class="types" id="types"></div><div class="setup"><div class="box"><div class="label">Number of dice</div><div class="counter"><button class="step" id="countDown">−</button><strong id="count">1</strong><button class="step" id="countUp">+</button></div></div><div class="box"><div class="label">Modifier</div><div class="counter"><button class="step" id="modDown">−</button><strong id="mod">+0</strong><button class="step" id="modUp">+</button></div></div></div><div class="modes"><button class="mode active" data-mode="normal">NORMAL</button><button class="mode" data-mode="adv">ADVANTAGE</button><button class="mode" data-mode="dis">DISADVANTAGE</button></div><button class="roll" id="roll">ROLL D20</button></section><section class="history"><div class="historyHead"><strong>ROLL HISTORY</strong><button class="clear" id="clear">CLEAR</button></div><div class="historyList" id="history"></div></section></main><script>
const TYPES=[4,6,8,10,12,20,100],$=s=>document.querySelector(s);let sides=20,count=1,mod=0,mode='normal',busy=false,sound=true,history=JSON.parse(localStorage.getItem('mangoDiceHistory')||'[]').slice(0,20);const field=$('#dicefield'),total=$('#total'),detail=$('#detail'),stage=$('#stage');
function cryptoInt(max){const lim=Math.floor(4294967296/max)*max,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max+1}function dice(n,s){return Array.from({length:n},()=>cryptoInt(s))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildTypes(){const el=$('#types');el.innerHTML=TYPES.map(s=>`<button class="type ${s===sides?'active':''}" data-s="${s}">D${s}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{sides=+b.dataset.s;mode='normal';sync();preview()})}function sync(){$('#count').textContent=count;$('#mod').textContent=(mod>=0?'+':'')+mod;$('#roll').textContent=`ROLL ${count>1?count+'× ':''}D${sides}${mod?(mod>0?' +'+mod:' '+mod):''}`;document.querySelectorAll('.type').forEach(b=>b.classList.toggle('active',+b.dataset.s===sides));document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const special=sides===20&&count===1;document.querySelectorAll('.mode').forEach(b=>{if(b.dataset.mode!=='normal'){b.disabled=!special;b.style.opacity=special?'1':'.35'}})}function preview(){field.innerHTML=`<div class="die"><span>${sides}</span></div>`;$('#totalLabel').textContent='READY';total.textContent='ROLL';detail.textContent='Tap ROLL or shake your phone'}
function tone(freq=180,dur=.04){if(!sound)return;try{const ac=window._ac||(window._ac=new(window.AudioContext||webkitAudioContext)()),o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function vibrate(p){navigator.vibrate?.(p)}async function roll(){if(busy)return;busy=true;$('#roll').disabled=true;let n=(mode==='normal'?count:2),visual=Array.from({length:Math.min(n,12)},()=>1);field.innerHTML=visual.map(()=>`<div class="die rolling"><span>?</span></div>`).join('');$('#totalLabel').textContent='ROLLING';total.textContent='…';detail.textContent='';vibrate(18);for(let t=0;t<8;t++){field.querySelectorAll('span').forEach(x=>x.textContent=cryptoInt(sides));tone(120+t*14,.025);await new Promise(r=>setTimeout(r,42+t*7))}const vals=dice(n,sides);let kept=vals,base;if(mode==='adv'){base=Math.max(...vals);kept=[base]}else if(mode==='dis'){base=Math.min(...vals);kept=[base]}else base=vals.reduce((a,b)=>a+b,0);const final=base+mod;field.innerHTML=vals.slice(0,12).map((v,i)=>`<div class="die ${v===sides?'max':''} ${v===1?'min':''}"><span>${v}</span></div>`).join('');$('#totalLabel').textContent=mode==='adv'?'ADVANTAGE':mode==='dis'?'DISADVANTAGE':'TOTAL';total.textContent=final;let d=vals.join(' + ');if(mode!=='normal')d=`${vals.join(' / ')} → keep ${base}`;if(mod)d+=` ${mod>0?'+':'−'} ${Math.abs(mod)}`;detail.textContent=d;stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');tone(vals.some(v=>v===sides)?520:260,.12);vibrate(vals.some(v=>v===sides)?[20,35,40]:25);addHistory({s:sides,n:count,m:mod,mode,vals,final,time:Date.now()});busy=false;$('#roll').disabled=false}
function addHistory(h){history.unshift(h);history=history.slice(0,20);localStorage.setItem('mangoDiceHistory',JSON.stringify(history));renderHistory()}function renderHistory(){const el=$('#history');if(!history.length){el.innerHTML='<div class="empty">No rolls yet. The dice await judgment.</div>';return}el.innerHTML=history.map(h=>{let tag=h.mode==='adv'?'ADV':h.mode==='dis'?'DIS':`${h.n}D${h.s}`,v=h.vals.join(', '),m=h.m?` ${h.m>0?'+':'−'}${Math.abs(h.m)}`:'';return `<div class="hist"><b>${tag}</b><span>${esc(v+m)}</span><strong>${h.final}</strong></div>`}).join('')}
$('#countDown').onclick=()=>{count=Math.max(1,count-1);if(count!==1)mode='normal';sync()};$('#countUp').onclick=()=>{count=Math.min(20,count+1);if(count!==1)mode='normal';sync()};$('#modDown').onclick=()=>{mod=Math.max(-99,mod-1);sync()};$('#modUp').onclick=()=>{mod=Math.min(99,mod+1);sync()};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{if(!b.disabled){mode=b.dataset.mode;sync()}});$('#roll').onclick=roll;$('#clear').onclick=()=>{history=[];localStorage.removeItem('mangoDiceHistory');renderHistory()};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'◖))':'◖×';tone(300,.06)};document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();roll()}});let lastShake=0;if(window.DeviceMotionEvent){window.addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a)return;const force=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0),now=Date.now();if(force>32&&now-lastShake>1200){lastShake=now;roll()}},{passive:true})}buildTypes();sync();renderHistory();
</script></body></html>
