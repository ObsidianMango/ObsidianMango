async function finishPhysics(){if(!busy||finishing)return;finishing=true;const targets=window._rollTargets||[],up=new THREE.Vector3(0,1,0);for(const d of active){d.body.velocity.setZero();d.body.angularVelocity.setZero();const face=d.faces.find(f=>f.value===d.target)||d.faces[0],align=new THREE.Quaternion().setFromUnitVectors(face.normal.clone().normalize(),up),yaw=new THREE.Quaternion().setFromAxisAngle(up,rand(0,Math.PI*2));align.premultiply(yaw);const start=d.mesh.quaternion.clone();for(let i=1;i<=9;i++){d.mesh.quaternion.slerpQuaternions(start,align,i/9);await sleep(16)}d.mesh.position.y=Math.max(d.mesh.position.y,.9);const edge=d.mesh.children.find(x=>x.userData.edge),max=sides===100?100:sides;if((d.role==='normal'&&d.target===max)||(d.role==='ones'&&targets[d.group]===100)){d.mesh.material.emissive.setHex(0x3b2d05);edge?.material.color.setHex(0xffd166)}else if(d.role==='normal'&&d.target===1){d.mesh.material.emissive.setHex(0x330a12);edge?.material.color.setHex(0xff6477)}}let base;if(mode==='adv')base=Math.max(...targets);else if(mode==='dis')base=Math.min(...targets);else base=targets.reduce((a,b)=>a+b,0);const final=base+mod,label=mode==='adv'?'ADVANTAGE':mode==='dis'?'DISADVANTAGE':'TOTAL';let text=mode==='normal'?targets.join(' + '):`${targets.join(' / ')} → keep ${base}`;if(mod)text+=` ${mod>0?'+':'−'} ${Math.abs(mod)}`;const isCrit=sides===20&&count===1&&base===20,isFail=sides===20&&count===1&&base===1;setResult(label,final,text,isCrit?'crit':isFail?'fail':'');tone(isCrit?620:280,.13,.05);vibrate(isCrit?[25,40,45]:26);addHistory({s:sides,n:count,m:mod,mode,vals:targets,final,time:Date.now()});busy=false;finishing=false;$('#roll').disabled=false;$('#roll').classList.remove('busy');sync()}function rollFallback(){const n=mode==='normal'?count:2,vals=rollTargets(n,sides),base=mode==='adv'?Math.max(...vals):mode==='dis'?Math.min(...vals):vals.reduce((a,b)=>a+b,0),final=base+mod;setResult(mode==='adv'?'ADVANTAGE':mode==='dis'?'DISADVANTAGE':'TOTAL',final,vals.join(mode==='normal'?' + ':' / '));addHistory({s:sides,n:count,m:mod,mode,vals,final,time:Date.now()})}
