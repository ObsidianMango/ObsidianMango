 // Font outlines become real beveled meshes, including the label and change total.
 function shapesFor(text,size){let ox=0;const shapes=[],scale=size/font.resolution;for(const char of text){const g=font.glyphs[char]||font.glyphs['?'];if(!g)continue;const path=new THREE.ShapePath(),a=(g.o||'').split(' ');let i=0;const point=()=>[Number(a[i++])*scale+ox,Number(a[i++])*scale];while(i<a.length){const cmd=a[i++];if(cmd==='m')path.moveTo(...point());else if(cmd==='l')path.lineTo(...point());else if(cmd==='q'){const end=point(),control=point();path.quadraticCurveTo(...control,...end)}else if(cmd==='b'){const end=point(),c1=point(),c2=point();path.bezierCurveTo(...c1,...c2,...end)}}shapes.push(...path.toShapes());ox+=g.ha*scale}return shapes}

 const shockMat=new THREE.MeshBasicMaterial({color:tint,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});const shock=ring(2.25,.018,shockMat,forge);shock.position.z=.2;
 const haze=new THREE.Mesh(new THREE.SphereGeometry(1.92,32,20),new THREE.MeshBasicMaterial({color:tint,transparent:true,opacity:.025,blending:THREE.AdditiveBlending,depthWrite:false}));haze.scale.z=.3;haze.position.z=.1;forge.add(haze);
