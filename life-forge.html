 const poisonMaterial=new THREE.MeshPhysicalMaterial({color:0x9cde52,emissive:0x4e8e21,emissiveIntensity:.2,metalness:.15,roughness:.18,transparent:true,opacity:.48,depthWrite:false,clearcoat:1});
 const poisonBubbles=new THREE.InstancedMesh(new THREE.SphereGeometry(.085,12,10),poisonMaterial,20);poisonBubbles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);poisonBubbles.frustumCulled=false;poisonBubbles.visible=false;forge.add(poisonBubbles);
 const afflictionDummy=new THREE.Object3D(),radiationGroup=new THREE.Group();radiationGroup.visible=false;forge.add(radiationGroup);
 const radiationMaterial=new THREE.MeshStandardMaterial({color:0xffdf76,emissive:0xb57b14,emissiveIntensity:.9,metalness:.45,roughness:.25});
 const radiationRings=[];for(let i=0;i<3;i++){const mat=new THREE.MeshBasicMaterial({color:0xffde72,transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false});const m=new THREE.Mesh(torusGeo(2.73,.023),mat);m.position.z=-.03*i;radiationGroup.add(m);radiationRings.push(m)}
 const reactorRotor=new THREE.Group(),scanRotor=new THREE.Group();radiationGroup.add(reactorRotor,scanRotor);reactorRotor.position.z=.13;scanRotor.position.z=.2;
 const hazardMat=new THREE.MeshStandardMaterial({color:0xd9b850,emissive:0xb47a13,emissiveIntensity:.7,metalness:.65,roughness:.28});
 const hazardGeo=new THREE.BoxGeometry(.035,.16,.055);for(let i=0;i<48;i++){const a=i*Math.PI/24,m=new THREE.Mesh(hazardGeo,hazardMat);m.position.set(Math.sin(a)*2.78,Math.cos(a)*2.78,0);m.rotation.z=-a+.3;reactorRotor.add(m)}
 const beamMat=new THREE.MeshBasicMaterial({color:0xffe38a,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false});
 for(let i=0;i<3;i++){const arc=new THREE.Mesh(new THREE.TorusGeometry(2.89,.031,8,32,.64),beamMat);arc.rotation.z=i*Math.PI*2/3;scanRotor.add(arc);const tip=new THREE.Mesh(new THREE.SphereGeometry(.053,10,8),beamMat);const a=i*Math.PI*2/3+.64;tip.position.set(Math.cos(a)*2.89,Math.sin(a)*2.89,0);scanRotor.add(tip)}
 const ionMat=new THREE.MeshBasicMaterial({color:0xffefb0,blending:THREE.AdditiveBlending,transparent:true,opacity:.9,depthWrite:false});
 const radiationIons=new THREE.InstancedMesh(new THREE.OctahedronGeometry(.021,0),ionMat,36);radiationIons.instanceMatrix.setUsage(THREE.DynamicDrawUsage);radiationIons.frustumCulled=false;radiationGroup.add(radiationIons);
 const radiationSymbol=new THREE.Group();radiationSymbol.position.set(0,-1.47,.23);radiationGroup.add(radiationSymbol);
 for(let i=0;i<3;i++){const a=i*Math.PI*2/3,shape=new THREE.Shape();shape.absarc(0,0,.33,a,a+Math.PI/3,false);shape.lineTo(Math.cos(a+Math.PI/3)*.12,Math.sin(a+Math.PI/3)*.12);shape.absarc(0,0,.12,a+Math.PI/3,a,true);shape.closePath();radiationSymbol.add(new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:.055,bevelEnabled:true,bevelSize:.009,bevelThickness:.009,bevelSegments:1,curveSegments:8}),radiationMaterial))}
 const radDot=new THREE.Mesh(new THREE.SphereGeometry(.074,12,8),radiationMaterial);radDot.position.z=.025;radiationSymbol.add(radDot);
 const radHousing=new THREE.Mesh(torusGeo(.43,.024),hazardMat);radHousing.position.z=.008;radiationSymbol.add(radHousing);let reactorKick=0;
 function animateAfflictions(time,moving){const t=moving?time:0;const strength=Math.min(1,.45+poisonCount*.06);if(poisonCount){for(let i=0;i<20;i++){const phase=(t*.13+i/20)%1,y=-2.65+phase*5.25;const side=i%2?1:-1,x=side*(Math.sqrt(Math.max(.4,7.2-y*y))+.14*Math.sin(t+i));afflictionDummy.position.set(x,y,.18+Math.sin(t*.6+i)*.48);afflictionDummy.scale.setScalar((.45+Math.sin(phase*Math.PI)*.85)*strength);afflictionDummy.updateMatrix();poisonBubbles.setMatrixAt(i,afflictionDummy.matrix)}poisonBubbles.instanceMatrix.needsUpdate=true}if(radCount){const power=Math.min(1,.3+Math.log1p(radCount)*.15),speed=.4+power*.35;reactorKick*=.94;reactorRotor.rotation.z=t*.1*speed;scanRotor.rotation.z=-t*.5*speed;hazardMat.emissiveIntensity=.5+power*.35+(moving?Math.sin(t*2)*.15+reactorKick*.4:0);radiationMaterial.emissiveIntensity=.75+(moving?Math.sin(t*2.4)*.18:0);radiationSymbol.rotation.y=moving?Math.sin(t*.8)*.12:0;for(let i=0;i<3;i++){const phase=(t*.23+i/3)%1;radiationRings[i].scale.setScalar(1+phase*.13);radiationRings[i].material.opacity=moving?(1-phase)*(.18+power*.35+reactorKick*.12):.25}for(let i=0;i<36;i++){const phase=(t*.21+i/36)%1,a=i*2.399-t*speed*.25,r=2.75+phase*.25;afflictionDummy.position.set(Math.cos(a)*r,Math.sin(a)*r,.12+Math.sin(phase*Math.PI)*.65);afflictionDummy.scale.setScalar((.2+Math.sin(phase*Math.PI))*power*1.5);afflictionDummy.rotation.set(t+i,t*.4,i);afflictionDummy.updateMatrix();radiationIons.setMatrixAt(i,afflictionDummy.matrix)}radiationIons.instanceMatrix.needsUpdate=true}}

 let wheelTarget=0,engaged=false,pulse=0,polarity=1,visible=true,last=0;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function emit(n){if(reduced||!window.lifeForge.motion())return;for(let i=0;i<Math.min(16,5+Math.abs(n));i++){const s=sparkState[sparkIndex++%48],a=wheelTarget+Math.PI/2+(Math.random()-.5)*.45;s.life=.65+Math.random()*.4;s.x=Math.cos(a)*2.44;s.y=Math.sin(a)*2.44;s.z=.28;s.vx=Math.cos(a)*(1+Math.random());s.vy=Math.sin(a)*(1+Math.random());s.vz=.8+Math.random()*2}}
 function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);const span=2*Math.tan(35*Math.PI/360)*13.6,diameter=Math.min(span*.67,span*camera.aspect*.87);forge.scale.setScalar(diameter/5.6);forge.position.y=span*.05}resize();addEventListener('resize',resize);
 renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();document.body.classList.remove('webgl-ready');document.body.classList.add('fallback');renderer.domElement.style.opacity=0});renderer.domElement.addEventListener('webglcontextrestored',()=>{document.body.classList.remove('fallback');document.body.classList.add('webgl-ready');renderer.domElement.style.opacity=1});
 document.addEventListener('visibilitychange',()=>visible=!document.hidden);
 window.lifeForge.setFX({color:c=>{tint.set(c);for(const mat of [luminous,smallMat]){mat.color.copy(tint);mat.emissive.copy(tint)}faceMat.emissive.copy(tint);sideMat.emissive.copy(tint);sparkMat.color.copy(tint);shockMat.color.copy(tint);haze.material.color.copy(tint);edge.color.copy(tint)},status:(p,r)=>{if(r>radCount)reactorKick=1;poisonCount=p;radCount=r;poisonBubbles.visible=p>0;radiationGroup.visible=r>0},value:updateText,turn:a=>wheelTarget=-a,engage:e=>engaged=e,pulse:n=>{pulse=1;polarity=n<0?-1:1;emit(n)}});
 function frame(ms){requestAnimationFrame(frame);if(!visible||ms-last<32)return;const dt=Math.min((ms-last)/1000,.05);last=ms;const motion=window.lifeForge.motion()&&!reduced,t=ms*.001;wheel.rotation.z+=(wheelTarget-wheel.rotation.z)*.32;forge.rotation.x+=( (motion&&!engaged?Math.sin(t*.5)*.025:0)-forge.rotation.x)*.08;forge.rotation.y+=((motion&&!engaged?Math.cos(t*.35)*.055:0)-forge.rotation.y)*.08;pulse=Math.max(0,pulse-dt*2.5);luminous.emissiveIntensity=.8+pulse*1.5+(engaged?.35:0);faceMat.emissiveIntensity=.22+pulse*.25;digits.position.z=.19+(motion?pulse*.13:0);digits.rotation.y=motion?polarity*pulse*.045:0;shock.scale.setScalar(1+(1-pulse)*.18);shockMat.opacity=motion?pulse*.4:0;haze.material.opacity=.025+pulse*.04;for(let i=0;i<sparkState.length;i++){const s=sparkState[i];s.life=Math.max(0,s.life-dt);if(s.life>0){s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.vy-=dt*.8;dummy.position.set(s.x,s.y,s.z);dummy.rotation.set(t*2+i,t*3,i);dummy.scale.setScalar(s.life*1.7)}else dummy.scale.setScalar(0);dummy.updateMatrix();sparks.setMatrixAt(i,dummy.matrix)}sparks.instanceMatrix.needsUpdate=true;animateAfflictions(t,motion);renderer.render(scene,camera)}
 renderer.render(scene,camera);document.body.classList.add('webgl-ready');requestAnimationFrame(frame);
} catch(error) {document.body.classList.remove('webgl-ready');document.body.classList.add('fallback');console.warn('3D unavailable; the dial and life counter remain usable.',error)}
