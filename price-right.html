<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111e">
<title>Price Right — 3D Big Wheel</title>
<style>
:root{--w:min(64vw,520px);--h:clamp(58px,10vw,92px);--r:clamp(205px,33vw,340px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;color:#fff;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',system-ui,sans-serif}body{touch-action:none}.app{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 10%,#0a446d 0,transparent 30%),radial-gradient(circle at 15% 65%,#73122a 0,transparent 30%),linear-gradient(#0b2138,#04090f 72%);overflow:hidden}header{text-align:center;padding:max(10px,env(safe-area-inset-top)) 10px 3px}.sign{display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border-radius:18px;border:3px solid #f4cb55;background:linear-gradient(#f34a3c,#9e0d1b);box-shadow:0 0 0 4px #561018,0 10px 25px #000a,inset 0 2px #fff8}.bulbs{font-size:11px;letter-spacing:4px;color:#fff0a6;text-shadow:0 0 6px #fff,0 0 13px #ffd65d}.title{font-size:clamp(24px,5vw,44px);letter-spacing:.055em;line-height:.9;text-shadow:0 2px #7b1014,0 5px #43060b,0 8px 12px #000}.sub{margin-top:7px;font:800 9px/1 system-ui;letter-spacing:.28em;color:#ffd96b}.stage{position:relative;display:grid;place-items:center;min-height:0;perspective:1200px}.floor{position:absolute;left:5%;right:5%;bottom:-8%;height:36%;background:radial-gradient(ellipse,#e8392f 0 25%,#9b121a 48%,#35060c 70%,transparent 72%);transform:perspective(520px) rotateX(68deg);opacity:.75}.machine{position:relative;width:min(95vw,840px);height:min(68vh,760px);min-height:430px;transform-style:preserve-3d;transform:rotateY(-8deg) rotateX(1.5deg);filter:drop-shadow(0 25px 30px #000c)}.frame{position:absolute;inset:4% 7%;overflow:hidden;border-radius:42px;border:clamp(10px,1.7vw,18px) solid #ccc;background:linear-gradient(90deg,#111 0 5%,#eee 6.4%,#555 8%,#111 10% 90%,#555 92%,#eee 94%,#111 96%);box-shadow:inset 0 0 0 4px #111,inset 0 0 45px #000,0 20px 45px #000c}.frame:before,.frame:after{content:"";position:absolute;top:0;bottom:0;width:32px;z-index:9;background:repeating-linear-gradient(#fff7bd 0 11px,#ffc02d 11px 16px,#7a2b03 16px 23px);box-shadow:0 0 12px #ffd55d,0 0 26px #ff9f31,inset 0 0 0 5px #555}.frame:before{left:2%}.frame:after{right:2%}.wheelbox{position:absolute;inset:1% 10%;display:grid;place-items:center;perspective:1000px;overflow:hidden}.shadow{position:absolute;width:76%;height:94%;border-radius:50%;background:radial-gradient(ellipse,transparent 38%,#000a 72%,#000 95%);filter:blur(13px)}#wheel{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;cursor:grab;will-change:transform}#wheel.grab{cursor:grabbing}.seg{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);display:grid;place-items:center;backface-visibility:hidden;border:4px solid #858585;box-shadow:inset 0 0 0 3px #eee9,inset 0 -13px 20px #0005;overflow:hidden}.seg:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 28%,#fff8 37%,transparent 44% 70%,#fff4 78%,transparent 84%);opacity:.35}.val{z-index:2;font-size:clamp(38px,8vw,84px);line-height:.9;-webkit-text-stroke:clamp(1px,.18vw,2px) #231b08;text-shadow:0 2px #fff7,0 4px #755417,0 7px 10px #0009}.tiny{font-size:.36em;vertical-align:super}.green{background:linear-gradient(#55c951,#118f35);color:#ffe57b}.red{background:linear-gradient(#f44839,#a60014);color:#ffe680}.black{background:linear-gradient(#22272c,#040506);color:#f2c34c}.ivory{background:linear-gradient(#fff8d7,#d5c48d);color:#141414}.gold{background:linear-gradient(#f1be34,#9a5a08);color:#090909}.burg{background:linear-gradient(#92252d,#39050b);color:#d9a43c}.special{background:radial-gradient(circle,#ffe678 0 1.5px,transparent 1.7px) 0 0/8px 8px,linear-gradient(#f34b3a,#a90016)}.rim{position:absolute;left:50%;width:calc(var(--w) + 44px);height:20px;margin-left:calc((var(--w) + 44px)/-2);border-radius:50%;background:linear-gradient(#fafafa,#777 45%,#222 53%,#bbb 76%,#555);box-shadow:0 0 0 3px #181818,0 3px 8px #000b;z-index:12}.rim.top{top:calc(50% - var(--r) - 10px)}.rim.bot{top:calc(50% + var(--r) - 10px)}.pointer{position:absolute;right:1.5%;top:50%;z-index:30;width:clamp(72px,10vw,108px);height:clamp(46px,6.4vw,68px);transform:translateY(-50%);filter:drop-shadow(0 5px 4px #0009);pointer-events:none}.arrow{position:absolute;inset:0;background:linear-gradient(#ff6036,#c31314 65%,#780409);clip-path:polygon(0 50%,48% 0,100% 0,100% 100%,48% 100%);border-radius:8px}.arrow:after{content:"★";position:absolute;right:17%;top:50%;transform:translateY(-53%);font:900 clamp(18px,3vw,30px)/1 system-ui;color:#ffe57b}.clicker{position:absolute;left:2px;top:50%;width:7px;height:30px;border-radius:5px;background:#e8e8e8;transform:translate(-40%,-50%);box-shadow:0 0 0 2px #555,0 3px 4px #000}.read{position:absolute;left:1.6%;top:50%;z-index:31;transform:translateY(-50%);width:clamp(82px,12vw,128px);padding:10px 6px;border-radius:13px;border:3px solid #caa146;background:linear-gradient(#1b2026,#020405);box-shadow:0 0 0 4px #503915,0 8px 18px #000b;text-align:center}.read small{display:block;font:800 8px/1 system-ui;letter-spacing:.17em;color:#d8ae48;margin-bottom:4px}#result{font-family:'Courier New',monospace;font-weight:900;font-size:clamp(22px,4vw,38px);color:#ffe36b;text-shadow:0 0 8px #ffd847,0 0 18px #ff7b00}.controls{z-index:40;padding:5px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}.meter{width:min(72vw,300px);padding:7px 10px 9px;border-radius:13px;border:2px solid #b8943c;background:linear-gradient(#202934,#070b10);box-shadow:0 4px #050709,0 8px 18px #0008}.meterHead{display:flex;justify-content:space-between;margin-bottom:5px;font:900 9px/1 system-ui;letter-spacing:.14em;color:#f5d66d}#powerText{font:900 11px/1 'Courier New',monospace;color:#fff;text-shadow:0 0 7px #ffd94a}.track{position:relative;height:18px;border-radius:6px;overflow:hidden;border:2px solid #545b61;background:#07090c;box-shadow:inset 0 2px 5px #000}.track:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),#fff5 calc(25% - 1px) 25%)}#fill{position:absolute;inset:0 auto 0 0;width:20%;background:linear-gradient(90deg,#2fc65b,#f3cf3d 52%,#ff8a2f 73%,#ed3038);box-shadow:0 0 12px #ffd34788}#needle{position:absolute;z-index:2;top:-3px;bottom:-3px;left:20%;width:4px;margin-left:-2px;background:#fff;border-radius:3px;box-shadow:0 0 7px #fff,0 0 13px #ffd648}button{appearance:none;border:0;color:#fff;font:900 15px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}#spin{min-width:190px;padding:15px 24px;border-radius:999px;border:3px solid #ffd86a;background:linear-gradient(#f2403b,#b40e1b 65%,#7a0710);box-shadow:0 5px #57050b,0 9px 22px #0008,inset 0 2px #fff8;text-shadow:0 2px #600;user-select:none;touch-action:none}#spin.charging{background:linear-gradient(#ff7a32,#d31616 68%,#7a0710);transform:translateY(3px);box-shadow:0 2px #57050b,0 0 24px #ff473888}#spin:disabled{filter:grayscale(.6);opacity:.65}#reset,#sound{width:48px;height:48px;border-radius:50%;border:2px solid #d9b957;background:linear-gradient(#253347,#0c1520);box-shadow:0 4px #060a0e,0 7px 14px #0008;font-size:20px}.tip{width:100%;text-align:center;font:700 10px/1.2 system-ui;letter-spacing:.12em;color:#aabbd0;text-transform:uppercase}.flash{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0 8%,#ffe75d 10%,#ff4e20aa 35%,transparent 65%)}.flash.go{animation:flash .65s}@keyframes flash{20%{opacity:.86}100%{opacity:0}}
@media(max-width:640px){:root{--w:min(67vw,360px);--h:clamp(55px,15vw,76px);--r:clamp(178px,49vw,260px)}.machine{width:100vw;height:67vh;transform:rotateY(-5deg) scale(.94)}.frame{inset:3% 2%}.frame:before{left:.4%}.frame:after{right:.4%}.read{left:1%;top:15%;transform:none}.pointer{right:0}.meter{width:min(88vw,330px)}}
@media(max-height:650px){header{padding-top:3px}.sub{display:none}.title{font-size:24px}.machine{height:65vh;transform:rotateY(-5deg) scale(.82)}#spin{padding:10px 20px}.tip{display:none}.meter{padding:4px 8px 6px}.track{height:14px}}
</style>
</head>
<body>
<div class="app"><header><div class="sign"><span class="bulbs">●●●</span><span class="title">PRICE RIGHT</span><span class="bulbs">●●●</span></div><div class="sub">3D SHOWCASE WHEEL</div></header><main class="stage"><div class="floor"></div><section class="machine"><div class="frame"><div class="wheelbox"><div class="shadow"></div><div id="wheel" aria-label="Drag wheel to spin"></div><div class="rim top"></div><div class="rim bot"></div></div><div class="read"><small>LANDED ON</small><div id="result">1.00</div></div><div class="pointer"><div class="arrow"><div class="clicker" id="clicker"></div></div></div></div></section><div class="flash" id="flash"></div></main><div class="controls"><div class="meter"><div class="meterHead"><span>SPIN POWER</span><strong id="powerText">20%</strong></div><div class="track"><div id="fill"></div><div id="needle"></div></div></div><button id="reset">↺</button><button id="spin">HOLD TO POWER</button><button id="sound">🔊</button><div class="tip">Hold Spin • Release at your power • Or drag the wheel by hand</div></div></div>
<script>
(()=>{'use strict';
const V=['1.00','15','80','35','60','20','40','75','55','95','50','85','30','65','10','45','70','25','90','5'];
const C=['red special','green','black','ivory','gold','burg','black','gold','burg','black','ivory','black','gold','burg','black','ivory','gold','burg','ivory','green'];
const S=18,w=document.getElementById('wheel'),res=document.getElementById('result'),spin=document.getElementById('spin'),reset=document.getElementById('reset'),sound=document.getElementById('sound'),clicker=document.getElementById('clicker'),flash=document.getElementById('flash'),fill=document.getElementById('fill'),needle=document.getElementById('needle'),powerText=document.getElementById('powerText');
let rot=0,vel=0,last=0,raf=0,spinning=false,drag=false,y=0,t0=0,dv=0,lastIdx=0,soundOn=true,audio=null,charging=false,craf=0,cstart=0,power=20;
const norm=d=>((d%360)+360)%360,idx=()=>Math.round(norm(rot)/S)%20;
function radius(){return Math.max(178,Math.min(340,document.querySelector('.machine').clientHeight*.46))}
function build(){w.innerHTML='';const r=radius();V.forEach((v,i)=>{const s=document.createElement('div');s.className='seg '+C[i];s.innerHTML='<span class="val">'+(v==='1.00'?'<span class="tiny">$</span>1.00':v)+'</span>';s.style.transform=`rotateX(${-i*S}deg) translateZ(${r}px)`;w.appendChild(s)});lastIdx=idx();draw()}
function draw(){w.style.transform=`rotateX(${rot}deg)`;res.textContent=V[idx()]}
function ac(){if(!soundOn)return null;if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio?.state==='suspended')audio.resume();return audio}
function tick(k=.5){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=150+k*110;g.gain.value=.025+k*.025;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.04);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.045);clicker.animate([{transform:'translate(-40%,-50%) rotate(0)'},{transform:'translate(-40%,-50%) rotate(-18deg)'},{transform:'translate(-40%,-50%) rotate(0)'}],{duration:70})}
function ticks(){const n=idx();if(n!==lastIdx){tick(Math.min(1,Math.abs(vel)*.7));lastIdx=n}}
function frame(t){if(!last)last=t;const dt=Math.min(34,t-last);last=t;if(spinning){rot+=vel*dt;vel*=Math.pow(.9972,dt);ticks();draw();if(Math.abs(vel)<.022){spinning=false;snap();return}}raf=requestAnimationFrame(frame)}
function go(v){ac();cancelAnimationFrame(raf);spinning=true;drag=false;spin.disabled=true;last=0;vel=Math.max(.75,Math.min(3.4,Math.abs(v)))*(v<0?-1:1);raf=requestAnimationFrame(frame)}
function snap(){const target=Math.round(rot/S)*S,from=rot,d=target-from,start=performance.now();function f(now){const p=Math.min(1,(now-start)/360),q=1+2.45*Math.pow(p-1,3)+1.45*Math.pow(p-1,2);rot=from+d*q;draw();if(p<1)requestAnimationFrame(f);else{rot=target;draw();spin.disabled=false;if(V[idx()]==='1.00'){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}tick(.35)}}requestAnimationFrame(f)}
function setPower(p){power=Math.max(0,Math.min(100,p));const s=power.toFixed(0)+'%';fill.style.width=s;needle.style.left=s;powerText.textContent=s}
function chargeFrame(now){if(!charging)return;const phase=((now-cstart)%1700)/1700,wave=phase<.5?phase*2:(1-phase)*2;setPower(20+wave*80);craf=requestAnimationFrame(chargeFrame)}
function begin(e){if(spinning||charging)return;ac();charging=true;spin.classList.add('charging');spin.textContent='RELEASE TO SPIN';cstart=performance.now();if(e?.pointerId!=null)try{spin.setPointerCapture(e.pointerId)}catch(_){}craf=requestAnimationFrame(chargeFrame)}
function release(e){if(!charging)return;charging=false;cancelAnimationFrame(craf);spin.classList.remove('charging');spin.textContent='HOLD TO POWER';if(e?.pointerId!=null)try{spin.releasePointerCapture(e.pointerId)}catch(_){}go(.95+(power/100)*2.45)}
spin.addEventListener('pointerdown',begin);spin.addEventListener('pointerup',release);spin.addEventListener('pointercancel',release);spin.addEventListener('click',e=>e.preventDefault());spin.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();begin()}});spin.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release()}});
reset.onclick=()=>{cancelAnimationFrame(raf);cancelAnimationFrame(craf);spinning=drag=charging=false;vel=rot=0;spin.disabled=false;spin.classList.remove('charging');spin.textContent='HOLD TO POWER';setPower(20);draw();tick(.25)};sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'🔊':'🔇';if(soundOn)tick(.25)};
w.addEventListener('pointerdown',e=>{if(spinning)return;ac();drag=true;w.classList.add('grab');w.setPointerCapture(e.pointerId);y=e.clientY;t0=performance.now();dv=0});w.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),dy=e.clientY-y,dt=Math.max(1,now-t0),d=dy*.34;rot+=d;dv=(d/dt)*.72+dv*.28;y=e.clientY;t0=now;ticks();draw()});function drop(e){if(!drag)return;drag=false;w.classList.remove('grab');try{w.releasePointerCapture(e.pointerId)}catch(_){}if(Math.abs(dv)>.16)go(dv*2.5);else snap()}w.addEventListener('pointerup',drop);w.addEventListener('pointercancel',drop);window.addEventListener('resize',()=>{if(!spinning&&!drag)build()},{passive:true});setPower(20);build();
})();
</script>
</body>
</html>
