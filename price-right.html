<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111e">
<title>Price Right — 3D Big Wheel</title>
<style>
:root{--w:min(64vw,520px);--h:clamp(58px,10vw,92px);--r:clamp(205px,33vw,340px);--gold:#ffd85c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;color:white;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',system-ui,sans-serif}body{touch-action:none;overscroll-behavior:none}.app{position:relative;width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 10%,#09395d 0,transparent 32%),radial-gradient(circle at 15% 65%,#711228 0,transparent 31%),radial-gradient(circle at 85% 68%,#5c3a09 0,transparent 29%),linear-gradient(#0a1c30,#050b12 70%);overflow:hidden}.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff2 1px,transparent 1px);background-size:32px 32px;pointer-events:none}header{z-index:20;text-align:center;padding:max(10px,env(safe-area-inset-top)) 10px 2px}.sign{display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border-radius:18px;border:3px solid #f4cb55;background:linear-gradient(#f34a3c,#9e0d1b);box-shadow:0 0 0 4px #561018,0 10px 25px #000a,inset 0 2px 0 #fff8}.bulbs{font-size:11px;letter-spacing:4px;color:#fff0a6;text-shadow:0 0 6px #fff,0 0 13px #ffd65d}.title{font-size:clamp(24px,5vw,44px);letter-spacing:.055em;line-height:.9;text-shadow:0 2px 0 #7b1014,0 5px 0 #43060b,0 8px 12px #000}.sub{margin-top:7px;font:800 9px/1 system-ui;letter-spacing:.28em;color:#ffd96b}.stage{position:relative;display:grid;place-items:center;min-height:0;perspective:1200px}.floor{position:absolute;left:5%;right:5%;bottom:-7%;height:35%;background:radial-gradient(ellipse,#e8392f 0 25%,#9b121a 48%,#35060c 70%,transparent 72%);transform:perspective(520px) rotateX(68deg);filter:drop-shadow(0 -8px 25px #ff323244);opacity:.75}.machine{position:relative;width:min(95vw,840px);height:min(70vh,760px);min-height:430px;transform-style:preserve-3d;transform:rotateY(-8deg) rotateX(1.5deg);filter:drop-shadow(0 25px 30px #000c)}.frame{position:absolute;inset:4% 7%;overflow:hidden;border-radius:42px;border:clamp(10px,1.7vw,18px) solid #cfcfcf;background:linear-gradient(90deg,#111 0 4%,#666 5%,#eee 6.4%,#585858 7.5%,#111 9% 91%,#666 93%,#eee 94.5%,#555 96%,#111);box-shadow:inset 0 0 0 4px #111,inset 0 0 45px #000,0 0 0 4px #161616,0 20px 45px #000c}.frame:before,.frame:after{content:"";position:absolute;top:0;bottom:0;width:32px;z-index:9;background:repeating-linear-gradient(#fff7bd 0 11px,#ffc02d 11px 16px,#7a2b03 16px 23px);box-shadow:0 0 12px #ffd55d,0 0 26px #ff9f31,inset 0 0 0 5px #555}.frame:before{left:2%}.frame:after{right:2%}.wheelbox{position:absolute;inset:1% 10%;display:grid;place-items:center;perspective:1000px;overflow:hidden}.shadow{position:absolute;width:76%;height:94%;border-radius:50%;background:radial-gradient(ellipse,transparent 38%,#000a 72%,#000 95%);filter:blur(13px);transform:translateZ(-80px)}#wheel{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;cursor:grab;will-change:transform}#wheel.grab{cursor:grabbing}.seg{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);margin-top:calc(var(--h)/-2);display:grid;place-items:center;backface-visibility:hidden;border:4px solid #848484;box-shadow:inset 0 0 0 3px #eee9,inset 0 -13px 20px #0005;overflow:hidden}.seg:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 28%,#fff8 37%,transparent 44% 70%,#fff4 78%,transparent 84%);mix-blend-mode:screen;opacity:.36}.val{position:relative;z-index:2;font-size:clamp(38px,8vw,84px);line-height:.9;letter-spacing:.01em;-webkit-text-stroke:clamp(1px,.18vw,2px) #231b08;text-shadow:0 2px 0 #fff7,0 4px 0 #755417,0 7px 10px #0009;transform:translateZ(8px)}.tiny{font-size:.36em;vertical-align:super}.green{background:linear-gradient(#55c951,#118f35);color:#ffe57b}.red{background:linear-gradient(#f44839,#a60014);color:#ffe680}.black{background:linear-gradient(#22272c,#040506);color:#f2c34c}.ivory{background:linear-gradient(#fff8d7,#d5c48d);color:#141414}.gold{background:linear-gradient(#f1be34,#9a5a08);color:#090909}.burg{background:linear-gradient(#92252d,#39050b);color:#d9a43c}.special{background:radial-gradient(circle,#ffe678 0 1.5px,transparent 1.7px) 0 0/8px 8px,radial-gradient(circle,#fff 0 1px,transparent 1.2px) 3px 4px/9px 9px,linear-gradient(#f34b3a,#a90016)}.rim{position:absolute;left:50%;width:calc(var(--w) + 44px);height:20px;margin-left:calc((var(--w) + 44px)/-2);border-radius:50%;background:linear-gradient(#fafafa,#777 45%,#222 53%,#bbb 76%,#555);box-shadow:0 0 0 3px #181818,0 3px 8px #000b;z-index:12;pointer-events:none}.rim.top{top:calc(50% - var(--r) - 10px)}.rim.bot{top:calc(50% + var(--r) - 10px)}.pointer{position:absolute;right:1.5%;top:50%;z-index:30;width:clamp(72px,10vw,108px);height:clamp(46px,6.4vw,68px);transform:translateY(-50%);filter:drop-shadow(0 5px 4px #0009);pointer-events:none}.arrow{position:absolute;inset:0;background:linear-gradient(#ff6036,#c31314 65%,#780409);clip-path:polygon(0 50%,48% 0,100% 0,100% 100%,48% 100%);border-radius:8px}.arrow:after{content:"★";position:absolute;right:17%;top:50%;transform:translateY(-53%);font:900 clamp(18px,3vw,30px)/1 system-ui;color:#ffe57b;text-shadow:0 2px #7a2c00}.clicker{position:absolute;left:2px;top:50%;width:7px;height:30px;border-radius:5px;background:#e8e8e8;transform:translate(-40%,-50%);box-shadow:0 0 0 2px #555,0 3px 4px #000}.read{position:absolute;left:1.6%;top:50%;z-index:31;transform:translateY(-50%);width:clamp(82px,12vw,128px);padding:10px 6px;border-radius:13px;border:3px solid #caa146;background:linear-gradient(#1b2026,#020405);box-shadow:0 0 0 4px #503915,0 8px 18px #000b;text-align:center}.read small{display:block;font:800 8px/1 system-ui;letter-spacing:.17em;color:#d8ae48;margin-bottom:4px}#result{font-family:'Courier New',monospace;font-weight:900;font-size:clamp(22px,4vw,38px);color:#ffe36b;text-shadow:0 0 8px #ffd847,0 0 18px #ff7b00}.controls{z-index:40;padding:6px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}button{appearance:none;border:0;color:#fff;font:900 16px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}#spin{min-width:185px;padding:15px 28px;border-radius:999px;border:3px solid #ffd86a;background:linear-gradient(#f2403b,#b40e1b 65%,#7a0710);box-shadow:0 5px 0 #57050b,0 9px 22px #0008,inset 0 2px 0 #fff8;text-shadow:0 2px #600}#spin:active{transform:translateY(3px);box-shadow:0 2px 0 #57050b,0 5px 14px #0008}#spin:disabled{filter:grayscale(.6);opacity:.65}#reset,#sound{width:48px;height:48px;border-radius:50%;border:2px solid #d9b957;background:linear-gradient(#253347,#0c1520);box-shadow:0 4px 0 #060a0e,0 7px 14px #0008;font-size:20px}.tip{width:100%;text-align:center;font:700 10px/1.2 system-ui;letter-spacing:.12em;color:#aabbd0;text-transform:uppercase}.flash{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0 8%,#ffe75d 10%,#ff4e20aa 35%,transparent 65%)}.flash.go{animation:flash .65s ease-out}@keyframes flash{0%{opacity:0}20%{opacity:.86}100%{opacity:0}}.confetti{position:absolute;inset:0;z-index:49;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;width:10px;height:18px;background:currentColor;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(760deg)}}
@media(max-width:640px){:root{--w:min(67vw,360px);--h:clamp(55px,15vw,76px);--r:clamp(178px,49vw,260px)}.machine{width:100vw;height:69vh;transform:rotateY(-5deg) scale(.94)}.frame{inset:3% 2%}.frame:before{left:.4%}.frame:after{right:.4%}.read{left:1%;top:15%;transform:none}.pointer{right:0}}
@media(max-height:620px){header{padding-top:3px}.sub{display:none}.title{font-size:24px}.machine{height:68vh;transform:rotateY(-5deg) scale(.83)}#spin{padding:11px 25px}.tip{display:none}}
</style>
</head>
<body>
<div class="app"><div class="grid"></div><header><div class="sign"><span class="bulbs">●●●</span><span class="title">PRICE RIGHT</span><span class="bulbs">●●●</span></div><div class="sub">3D SHOWCASE WHEEL</div></header><main class="stage"><div class="floor"></div><section class="machine" aria-label="3D game show wheel"><div class="frame"><div class="wheelbox"><div class="shadow"></div><div id="wheel" role="button" aria-label="Drag or tap spin"></div><div class="rim top"></div><div class="rim bot"></div></div><div class="read"><small>LANDED ON</small><div id="result">1.00</div></div><div class="pointer"><div class="arrow"><div class="clicker" id="clicker"></div></div></div></div></section><div class="flash" id="flash"></div><div class="confetti" id="confetti"></div></main><div class="controls"><button id="reset" aria-label="Reset">↺</button><button id="spin">SPIN THE WHEEL</button><button id="sound" aria-label="Sound">🔊</button><div class="tip">Drag hard or tap spin • physical inertia • segment snap • sound</div></div></div>
<script>
(()=>{'use strict';
const VALUES=['1.00','15','80','35','60','20','40','75','55','95','50','85','30','65','10','45','70','25','90','5'];
const COLORS=['red special','green','black','ivory','gold','burg','black','gold','burg','black','ivory','black','gold','burg','black','ivory','gold','burg','ivory','green'];
const STEP=18,wheel=document.getElementById('wheel'),result=document.getElementById('result'),spin=document.getElementById('spin'),reset=document.getElementById('reset'),sound=document.getElementById('sound'),clicker=document.getElementById('clicker'),flash=document.getElementById('flash'),confetti=document.getElementById('confetti');
let rot=0,vel=0,last=0,raf=0,spinning=false,drag=false,lastY=0,lastT=0,dragV=0,lastIdx=0,soundOn=true,audio=null;
const norm=d=>((d%360)+360)%360,idx=()=>Math.round(norm(rot)/STEP)%20;
function radius(){const m=document.querySelector('.machine').clientHeight;return Math.max(178,Math.min(340,m*.46))}
function build(){wheel.innerHTML='';const r=radius();VALUES.forEach((v,i)=>{const s=document.createElement('div');s.className='seg '+COLORS[i];s.innerHTML='<span class="val">'+(v==='1.00'?'<span class="tiny">$</span>1.00':v)+'</span>';s.style.transform=`rotateX(${-i*STEP}deg) translateZ(${r}px)`;wheel.appendChild(s)});lastIdx=idx();draw()}
function draw(){wheel.style.transform=`rotateX(${rot}deg)`;result.textContent=VALUES[idx()]}
function ac(){if(!soundOn)return null;if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume();return audio}
function tick(str=.5){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=150+str*110;g.gain.value=.025+str*.025;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.04);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.045);clicker.animate([{transform:'translate(-40%,-50%) rotate(0)'},{transform:'translate(-40%,-50%) rotate(-18deg)'},{transform:'translate(-40%,-50%) rotate(0)'}],{duration:70})}
function fanfare(){const a=ac();if(!a)return;[523,659,784,1047].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.08;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.28)})}
function party(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');confetti.innerHTML='';const cs=['#ffdf5a','#ff3939','#45d368','#53a9ff','#f56cff','#fff'];for(let i=0;i<60;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.color=cs[i%cs.length];c.style.setProperty('--x',(Math.random()-.5)*45+'vw');c.style.animationDelay=Math.random()*.25+'s';c.style.animationDuration=1.15+Math.random()*1.15+'s';confetti.appendChild(c)}setTimeout(()=>confetti.innerHTML='',2500)}
function ticks(){const n=idx();if(n!==lastIdx){tick(Math.min(1,Math.abs(vel)*2.4));lastIdx=n}}
function frame(t){if(!last)last=t;const dt=Math.min(34,t-last);last=t;if(spinning){rot+=vel*dt;vel*=Math.pow(.9922,dt);ticks();draw();if(Math.abs(vel)<.022){spinning=false;snap();return}}raf=requestAnimationFrame(frame)}
function go(v){ac();cancelAnimationFrame(raf);spinning=true;drag=false;spin.disabled=true;last=0;vel=Math.max(.55,Math.min(2.25,Math.abs(v)))*(v<0?-1:1);if(!Number.isFinite(vel))vel=1.35;raf=requestAnimationFrame(frame)}
function snap(){const target=Math.round(rot/STEP)*STEP,from=rot,diff=target-from,start=performance.now(),dur=360;const ease=x=>1+2.45*Math.pow(x-1,3)+1.45*Math.pow(x-1,2);function s(now){const p=Math.min(1,(now-start)/dur);rot=from+diff*ease(p);draw();if(p<1)requestAnimationFrame(s);else{rot=target;draw();spin.disabled=false;if(VALUES[idx()]==='1.00'){fanfare();party()}else tick(.35)}}requestAnimationFrame(s)}
spin.onclick=()=>{if(!spinning)go(1.05+Math.random()*.72)};reset.onclick=()=>{cancelAnimationFrame(raf);spinning=false;drag=false;vel=0;rot=0;spin.disabled=false;draw();tick(.25)};sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'🔊':'🔇';if(soundOn)tick(.25)};
wheel.addEventListener('pointerdown',e=>{if(spinning)return;ac();drag=true;wheel.classList.add('grab');wheel.setPointerCapture(e.pointerId);lastY=e.clientY;lastT=performance.now();dragV=0});wheel.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),dy=e.clientY-lastY,dt=Math.max(1,now-lastT),d=dy*.34;rot+=d;dragV=(d/dt)*.72+dragV*.28;lastY=e.clientY;lastT=now;ticks();draw()});function release(e){if(!drag)return;drag=false;wheel.classList.remove('grab');try{wheel.releasePointerCapture(e.pointerId)}catch(_){ }if(Math.abs(dragV)>.16)go(dragV*2.5);else snap()}wheel.addEventListener('pointerup',release);wheel.addEventListener('pointercancel',release);window.addEventListener('resize',()=>{if(!spinning&&!drag)build()},{passive:true});build();
})();
</script>
</body>
</html>
