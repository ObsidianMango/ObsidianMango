<html lang="en">
<head>

  <meta name="description" content="An interactive audiovisual reality instrument. Collapse space, drag energy, and release to bloom.">
  <style>
    :root{color-scheme:dark;--a:179,116,255;--b:68,192,255;font-family:Arial,Helvetica,sans-serif;background:#020105;color:#fff}

    #app{--x:50%;--y:50%;position:fixed;inset:0;isolation:isolate;overflow:hidden;touch-action:none;user-select:none;background:#020105}#app.mode-1{--a:255,76,29;--b:255,205,57}#app.mode-2{--a:31,255,151;--b:194,56,255}#app.mode-3{--a:255,76,222;--b:63,213,255}#app.mode-4{--a:39,211,255;--b:153,71,255}

    #ui{position:absolute;z-index:20;inset:0;pointer-events:none;transition:opacity .45s,transform .65s}#ui.hidden{opacity:0;transform:scale(1.025)}#ui button,#ui input{pointer-events:auto}header{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:62px;padding:max(13px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}header:after{content:"";position:absolute;left:20px;right:20px;bottom:-8px;height:1px;background:linear-gradient(90deg,#fff3,transparent 28%,transparent 72%,#fff3)}
    .brand{display:flex;align-items:center;gap:11px}.brand strong{display:block;font:900 12px/1 ui-monospace,monospace;letter-spacing:.19em}.brand small{display:block;margin-top:4px;font:500 6px/1 ui-monospace,monospace;letter-spacing:.2em;color:#fff6}.sigil{position:relative;width:34px;height:34px;border:1px solid rgba(var(--a),.75);border-radius:50%;box-shadow:0 0 24px rgba(var(--a),.35)}.sigil:before{content:"";position:absolute;inset:5px;border:1px dashed #fff5;border-radius:50%;animation:spin 8s linear infinite}.sigil:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 25px rgba(var(--a),1)}
    .telemetry{display:flex;gap:20px;padding:9px 15px;border:1px solid #fff2;border-radius:999px;background:#05030966;backdrop-filter:blur(16px)}.telemetry span{font:500 6px/1 ui-monospace,monospace;letter-spacing:.17em;color:#fff6}.telemetry b{margin-left:6px;color:#ffff;font-size:9px}nav{display:flex;justify-content:flex-end;gap:5px}nav button{height:31px;padding:0 10px;border-radius:999px}#auto i{display:inline-block;width:5px;height:5px;margin-right:5px;border-radius:50%;background:#fff5}#auto.live{color:#fff;border-color:rgba(var(--a),.55);background:rgba(var(--a),.13)}#auto.live i{background:rgb(var(--b));box-shadow:0 0 9px rgb(var(--b));animation:pulse 1.1s infinite}
    #intro{position:absolute;top:44%;left:50%;width:min(520px,calc(100vw - 40px));text-align:center;transform:translate(-50%,-50%);text-shadow:0 4px 24px #000;transition:opacity .55s,transform .55s}#intro.gone{opacity:0;transform:translate(-50%,-46%)}#intro small{font:500 7px/1 ui-monospace,monospace;letter-spacing:.36em;color:#fff6}#intro p,#intro strong{display:block;margin:15px 0 0;font-family:ui-monospace,monospace;letter-spacing:.25em}#intro p{font-size:clamp(11px,1.4vw,15px);color:#fffc}#intro strong{margin-top:7px;font-size:clamp(17px,2.5vw,28px)}#intro>i{display:block;width:1px;height:44px;margin:20px auto;background:linear-gradient(#ffff,transparent);animation:guide 1.6s ease-in-out infinite}
    #readout{position:absolute;left:max(25px,env(safe-area-inset-left));top:50%;display:flex;align-items:center;gap:13px;transform:translateY(-50%);text-shadow:0 3px 18px #000}#glyph{display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(var(--a),.5);border-radius:50%;color:rgb(var(--b));font-size:17px;box-shadow:0 0 28px rgba(var(--a),.2)}#readout div{padding-left:12px;border-left:1px solid #fff3}#readout small,#readout strong,#readout em{display:block;font-family:ui-monospace,monospace}#readout small{font-size:6px;letter-spacing:.22em;color:#fff6}#readout strong{margin:5px 0 3px;font-size:13px;letter-spacing:.24em}#readout em{font-size:7px;font-style:normal;letter-spacing:.13em;color:#fff6}
    .deck{position:absolute;left:18px;right:18px;bottom:max(25px,calc(env(safe-area-inset-bottom) + 14px));display:grid;grid-template-columns:auto minmax(145px,1fr) auto;align-items:center;gap:18px;width:min(1120px,calc(100vw - 36px));margin:auto;padding:9px;border:1px solid #fff3;border-radius:18px;background:linear-gradient(105deg,#08050dc7,#110a197d),radial-gradient(circle at 80% 0,rgba(var(--a),.1),transparent 45%);box-shadow:0 25px 90px #0009,inset 0 1px #fff2;backdrop-filter:blur(27px) saturate(135%)}#modes{display:flex;gap:2px}#modes button{position:relative;height:53px;min-width:65px;border:0;border-radius:11px;background:transparent;color:#fff6}#modes button span{display:block;font-size:14px;margin-bottom:5px}#modes button.active{color:#fff;background:rgba(var(--a),.14);box-shadow:inset 0 0 0 1px rgba(var(--a),.35),0 0 24px rgba(var(--a),.15)}#modes button.active:after{content:"";position:absolute;left:50%;bottom:4px;width:15px;height:1px;transform:translateX(-50%);background:rgb(var(--b));box-shadow:0 0 8px rgb(var(--b))}
    .density{min-width:135px;padding:0 4px}.density>span{display:flex;justify-content:space-between;margin-bottom:11px;font:500 6px/1 ui-monospace,monospace;letter-spacing:.18em;color:#fff6}.density b{color:#fffd}.density input{display:block;width:100%;height:14px;margin:0;appearance:none;background:transparent}.density input::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,rgb(var(--a)),rgb(var(--b)),#fff);box-shadow:0 0 12px rgba(var(--a),.85)}.density input::-webkit-slider-thumb{width:14px;height:14px;margin-top:-6px;appearance:none;border:2px solid #fff;border-radius:50%;background:#08040c;box-shadow:0 0 15px rgba(var(--a),.9)}.actions{display:flex;gap:7px}.actions button{height:53px;border-radius:11px}.actions b{margin-left:17px;font-size:14px}#mutate{min-width:100px}#nova{min-width:145px;color:#08040c;background:#ffff;border-color:#ffff;box-shadow:0 0 38px rgba(var(--a),.25)}#nova:hover{box-shadow:0 0 50px rgba(var(--a),.5)}
    #restore{display:none;position:absolute;z-index:30;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));height:38px;padding:0 14px;border-radius:999px;background:#03020788;backdrop-filter:blur(14px)}#restore.show{display:block}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}@keyframes grain{0%{transform:translate(1%,-1%)}25%{transform:translate(-1%,2%)}50%{transform:translate(2%,1%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(1%,1%)}}@keyframes guide{0%,100%{opacity:.2;transform:scaleY(.4);transform-origin:top}50%{opacity:1;transform:scaleY(1);transform-origin:top}}@keyframes flash{0%{opacity:1;transform:scale(.08)}18%{opacity:.96;transform:scale(1)}100%{opacity:0;transform:scale(2.4);filter:blur(11px)}}@keyframes ring{0%{opacity:1;transform:scale(.12)}68%{opacity:.7}100%{opacity:0;transform:scale(16)}}
    @media(max-width:780px){header{grid-template-columns:1fr auto}.telemetry{display:none}#hide{display:none}.deck{grid-template-columns:minmax(105px,1fr) auto;gap:9px;padding:8px}#modes{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr)}#modes button{width:100%;min-width:0;height:40px}.density{padding:0 7px}#mutate{min-width:45px;width:45px;font-size:0}.actions b{margin:0}#nova{min-width:112px}.brand small{display:none}#readout{top:27%}}
    @media(max-width:480px){header{padding:max(10px,env(safe-area-inset-top)) 13px 0}.brand{gap:8px}.brand strong{font-size:10px}.sigil{width:31px;height:31px}nav button{height:29px;padding:0 8px;font-size:6px}#sound{width:32px;font-size:0}#sound:first-letter{font-size:10px}#readout{left:15px;top:21%;gap:8px}#glyph{width:34px;height:34px;font-size:13px}#readout em{display:none}#intro{top:42%}.deck{left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));width:calc(100vw - 18px);border-radius:15px}#modes button{height:37px;font-size:0}#modes button span{margin:0;font-size:15px}.actions button{height:47px}#nova{min-width:105px;font-size:6px}.density{min-width:95px}#reticle{width:58px;height:58px;margin:-29px}}
    @media(prefers-reduced-motion:reduce){.grain,.sigil:before,#reticle span,#reticle b,#intro>i{animation:none}}
  </style>

<body>
  <main id="app" class="mode-0">
    <canvas id="space" aria-label="Interactive universe. Hold and drag to collapse spacetime, then release to bloom."></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="reticle" aria-hidden="true"><span></span><b></b><i></i><em>GRAVITY POINT</em></div>

    <section id="ui" aria-label="Void Bloom controls">
      <header>
        <div class="brand"><div class="sigil"></div><div><strong>VOID//BLOOM</strong><small>IMPOSSIBLE MATTER ENGINE · GITHUB EDITION</small></div></div>
        <div class="telemetry"><span>FIELD <b id="field">44%</b></span><span>EVENT <b id="event">001</b></span><span>GENOME <b id="genome">01</b></span></div>
        <nav>
          <button id="auto"><i></i>AUTOPILOT</button>
          <button id="sound">▥ MUTE</button>
          <button id="hide">HIDE</button>
        </nav>
      </header>

      <div id="intro"><small>INTERACTION // 01</small><p>HOLD TO COLLAPSE</p><strong>RELEASE TO BLOOM</strong><i></i></div>
      <aside id="readout"><span id="glyph">◉</span><div><small id="code">UNIVERSE 01</small><strong id="name">VOID</strong><em id="hint">singularity engine</em></div></aside>

      <section class="deck">
        <div id="modes" aria-label="Universe mode"></div>
        <label class="density"><span>REALITY DENSITY <b id="densityValue">66%</b></span><input id="density" type="range" min="18" max="100" value="66" aria-label="Reality density"></label>
        <div class="actions"><button id="mutate">MUTATE <b>⟲</b></button><button id="nova">DETONATE <b>✦</b></button></div>
      </section>
    </section>

    <button id="restore">◇ RESTORE INTERFACE</button>
  </main>
  <script>
    (()=>{
      "use strict";
      const MODES=[
        {name:"VOID",code:"01",glyph:"◉",hint:"singularity engine",hue:271},
        {name:"CORONA",code:"02",glyph:"✹",hint:"stellar turbulence",hue:18},
        {name:"SYNAPSE",code:"03",glyph:"⬡",hint:"living network",hue:145},
        {name:"PRISM",code:"04",glyph:"◈",hint:"kaleidoscope fracture",hue:315},
        {name:"WARP",code:"05",glyph:"≋",hint:"lightspeed tunnel",hue:194}
      ];
      const app=document.querySelector("#app"),space=document.querySelector("#space"),fx=document.querySelector("#fx"),ctx=fx.getContext("2d");
      const reticle=document.querySelector("#reticle"),reticleText=reticle.querySelector("em"),flash=document.querySelector("#flash"),ui=document.querySelector("#ui"),restore=document.querySelector("#restore"),intro=document.querySelector("#intro");
      const gl=space.getContext("webgl",{alpha:false,antialias:false,depth:false,powerPreference:"high-performance"});
      if(!gl){app.style.background="radial-gradient(circle,#7139b8,#020105 65%)";document.querySelector("#intro strong").textContent="WEBGL REQUIRED";return}

      const vertex=`
        attribute vec2 p;
        void main(){gl_Position=vec4(p,0.,1.);}
      `;
      const fragment=`
        precision highp float;
        uniform vec2 r,m,v;
        uniform float t,e,mode,seed,pulse,drag,hold,transition;
        uniform vec4 b0,b1,b2,b3;
        #define PI 3.14159265359
        mat2 R(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
        float H(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
        vec2 H2(vec2 p){float n=sin(dot(p,vec2(41.,289.)));return fract(vec2(262144.,32768.)*n);}
        float N(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(H(i),H(i+vec2(1,0)),f.x),mix(H(i+vec2(0,1)),H(i+1.),f.x),f.y);}
        float F(vec2 p){float z=0.,a=.5;for(int i=0;i<5;i++){z+=a*N(p);p=R(.51)*p*2.03+11.7;a*=.5;}return z;}
        vec3 P(float x,vec3 q){return .48+.52*cos(6.28318*(x+q));}
        float V(vec2 x){vec2 n=floor(x),f=fract(x);float d=8.;for(int j=0;j<3;j++)for(int i=0;i<3;i++){vec2 g=vec2(float(i)-1.,float(j)-1.);vec2 o=H2(n+g);vec2 q=g+.5+.5*sin(t*.34+6.2831*o)-f;d=min(d,dot(q,q));}return sqrt(d);}
        vec3 abyss(vec2 u){float d=length(u),a=atan(u.y,u.x);float s=abs(sin(a*6.-log(d+.075)*8.5+t*1.2));float arms=pow(max(0.,1.-s),7.)/(d+.16);float rings=.014/max(abs(sin(d*18.-t*1.45)),.024);float dust=F(vec2(a*2.2,log(d+.08)*2.-t*.23));vec3 c=P(d*.24+t*.018,vec3(.02,.22,.56))*(arms*(.38+dust)+rings*.14);c+=vec3(.22,.48,1.4)*pow(max(0.,.62-d),3.)*1.8;c*=smoothstep(.045,.19+e*.025,d);c+=vec3(1.4,.86,2.)*(.008/max(abs(d-.205),.009));return c;}
        vec3 corona(vec2 u){float d=length(u),a=atan(u.y,u.x);float n=F(u*(2.8+e)+vec2(cos(t*.23),sin(t*.19))*1.7);float surf=1.-smoothstep(0.,.18,abs(d-(.44+(n-.5)*.27)));float plasma=pow(max(0.,1.18-d+n*.44),3.);float rays=pow(max(0.,sin(a*31.+n*5.-t*1.8)),14.)*smoothstep(.28,1.3,d)/(d+.2);vec3 hot=mix(vec3(1.8,.055,.008),vec3(2.8,1.2,.08),n);vec3 c=hot*(plasma*.62+surf*1.35+rays*.46);c+=vec3(1.3,.08,.22)*F(u*6.-t*.18)*.5;return c*(.55+.45*smoothstep(.03,.16,d));}
        vec3 synapse(vec2 u){vec2 w=vec2(F(u*1.7+t*.08),F(u*1.7-t*.07+7.4));float cell=V(u*(4.+e*1.3)+(w-.5)*1.25);float membrane=1.-smoothstep(.018,.105,abs(cell-.43));float nuclei=1.-smoothstep(0.,.18,cell);float signal=.5+.5*sin(cell*25.-t*2.2+w.x*8.);return vec3(.015,1.4,.62)*membrane*(.45+signal)+vec3(.78,.04,1.25)*nuclei*(.8+e)+vec3(.03,.3,.18)*(1.-cell)*.7;}
        vec3 prism(vec2 u){float d=length(u),a=atan(u.y,u.x)+t*.09;float s=PI/(4.+floor(e*3.));a=abs(mod(a+s,2.*s)-s);vec2 q=vec2(cos(a),sin(a))*d;vec3 c=vec3(0);for(int i=0;i<5;i++){float f=float(i);q=abs(q)/max(dot(q,q),.18)-vec2(.72+.04*sin(t),.54);q*=R(.38+f*.07);float line=.012/max(abs(q.x+q.y*.52),.004);c+=P(length(q)*.11+f*.14+t*.025,vec3(0,.34,.67))*line;}c+=P(d*.3-t*.03,vec3(0,.33,.66))*pow(max(0.,cos(a*18.-d*8.+t)),18.)*1.8;return c*(.55+.45*exp(-d*.55));}
        vec3 warp(vec2 u){float d=length(u),a=atan(u.y,u.x);float hs=H(vec2(floor((a+PI)*34.),floor(d*4.)));float spokes=pow(max(0.,sin(a*68.+hs*5.)),22.);float flow=fract(d*(4.+e*3.)-t*(.9+e));float streak=spokes*smoothstep(.2,1.6,d)*pow(flow,5.)/(d+.13);float tunnel=.018/max(abs(sin(d*11.-t*2.5+F(u*2.)*3.)),.025);vec3 c=vec3(.04,.72,1.8)*streak*2.6+vec3(1.2,.06,1.5)*tunnel*(.3+spokes);c+=P(a*.08+t*.02,vec3(0,.28,.58))*pow(max(0.,.5-d),2.);return c*smoothstep(.025,.17,d);}
        float ring(vec2 u,vec4 b){float live=1.-step(1.,b.z);vec2 q=b.xy*2.-1.;q.x*=r.x/r.y;float x=1.-smoothstep(0.,.026+b.z*.025,abs(length(u-q)-b.z*1.82));return x*live*(1.-b.z)*b.w;}
        void main(){
          vec2 f=gl_FragCoord.xy,u=(2.*f-r.xy)/min(r.x,r.y),mouse=m*2.-1.;mouse.x*=r.x/r.y;
          float md=length(u-mouse),lens=(.035+e*.15+drag*.08)/(md+.13);u-=normalize(u-mouse+vec2(.0001))*lens*.11;u*=R(lens*(.22+drag*.28));
          vec3 c;if(mode<.5)c=abyss(u);else if(mode<1.5)c=corona(u);else if(mode<2.5)c=synapse(u);else if(mode<3.5)c=prism(u);else c=warp(u);
          vec2 id=u-mouse;float dist=length(id),ang=atan(id.y,id.x),mask=1.-smoothstep(.08,1.18,dist);float compression=.5+.5*sin(dist*(46.+hold*28.)-t*7.-hold*10.);float tend=pow(max(0.,sin(ang*(9.+mode*2.)+t*2.3+dist*13.)),18.);vec3 ic=P(dist*.26-t*.025,vec3(0,.31,.63));c+=ic*mask*hold*(compression*.34+tend*(1.1+hold));
