<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>♠️ Solitaire</title>
  <style>
    :root {
      --gap: clamp(2px, 1vw, 10px);
      --pad: clamp(4px, 1.3vw, 14px);
      --card-w: min(12.6vw, 104px);
      --card-h: calc(var(--card-w) * 1.5);
      --fan-down: clamp(14px, 5.6vw, 30px);
      --fan-up: clamp(22px, 7.7vw, 42px);
      --panel: rgba(15, 15, 18, .82);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #111; }
    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    #app {
      min-height: 100svh;
      background: #18351f url("tilebg.jpg") center / cover fixed;
      padding:
        max(8px, env(safe-area-inset-top))
        max(var(--pad), env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(var(--pad), env(safe-area-inset-left));
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 auto 10px;
      max-width: 1000px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #brand {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: clamp(16px, 4vw, 24px);
      white-space: nowrap;
    }

    #status {
      display: flex;
      gap: 9px;
      font-size: clamp(11px, 2.8vw, 14px);
      opacity: .95;
      white-space: nowrap;
    }

    #controls { display: flex; gap: 6px; }
    #controls button, #drawMode {
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      background: rgba(255,255,255,.10);
      border-radius: 10px;
      min-height: 38px;
      padding: 7px 10px;
      cursor: pointer;
      touch-action: manipulation;
    }
    #controls button:active, #drawMode:active { transform: translateY(1px); }

    #board {
      position: relative;
      width: 100%;
      max-width: 1000px;
      min-height: calc(100svh - 85px);
      margin: 0 auto;
      touch-action: none;
    }

    #top-row, #tableau {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      column-gap: var(--gap);
      width: 100%;
    }

    #top-row { min-height: var(--card-h); align-items: start; }
    #tableau { margin-top: clamp(18px, 4vh, 34px); align-items: start; }

    .slot, .pile {
      position: relative;
      width: 100%;
      min-width: 0;
    }

    .slot {
      aspect-ratio: 2 / 3;
      border-radius: clamp(4px, 1.5vw, 10px);
      border: 1.5px dashed rgba(255,255,255,.45);
      background: rgba(0,0,0,.08);
    }

    .slot.foundation::after {
      content: attr(data-suit);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-size: clamp(20px, 6.5vw, 52px);
      opacity: .28;
    }

    .tableau-pile {
      min-height: calc(var(--card-h) + 190px);
      border-radius: 8px;
    }

    .card {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: clamp(4px, 1.5vw, 10px);
      background: #fff;
      border: 1px solid rgba(0,0,0,.75);
      box-shadow: 0 2px 5px rgba(0,0,0,.30);
      overflow: hidden;
      color: #111;
      touch-action: none;
      cursor: grab;
      transform: translateZ(0);
    }

    .card.face-down {
      background-color: #17336e;
      background-image: var(--card-back);
      background-size: cover;
      background-position: center;
    }

    .card.selected {
      outline: max(2px, .45vw) solid #ffd34f;
      outline-offset: 1px;
      filter: brightness(1.06);
      z-index: 500 !important;
    }

    .card.red { color: #c71524; }

    .corner {
      position: absolute;
      top: 5%;
      left: 7%;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: .88;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: clamp(10px, 3.3vw, 23px);
    }
    .corner.bottom {
      top: auto;
      left: auto;
      bottom: 5%;
      right: 7%;
      transform: rotate(180deg);
    }
    .suit-line { font-size: .92em; margin-top: .14em; }

    .center-mark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: clamp(22px, 7.2vw, 58px);
      opacity: .92;
    }
    .center-mark.face { font-size: clamp(20px, 6vw, 50px); }

    .waste-card { left: min(calc(var(--card-w) * .13), 10px); }

    #toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translate(-50%, 16px);
      z-index: 1000;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,.82);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #themePreview {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      background: rgba(0,0,0,.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #themePreview.open { display: flex; }
    #themeModalContent {
      width: min(560px, 100%);
      max-height: 82svh;
      overflow: auto;
      background: #222;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }
    #themeModalContent h2 { margin: 0 0 12px; font: 700 20px Georgia, serif; }
    #themeGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .theme-choice {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      background: #111;
    }
    .theme-choice.active { border-color: #ffd34f; }
    #closeTheme { margin-top: 14px; width: 100%; min-height: 42px; border: 0; border-radius: 10px; font-weight: 700; }

    #winOverlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 3000;
      background: rgba(0,0,0,.74);
      padding: 20px;
    }
    #winOverlay.show { display: grid; }
    #winCard {
      width: min(420px, 100%);
      padding: 24px;
      text-align: center;
      border-radius: 20px;
      background: #161616;
      border: 1px solid rgba(255,255,255,.18);
    }
    #winCard h2 { font: 700 30px Georgia, serif; margin: 0 0 8px; }
    #winCard button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 11px; font-weight: 700; }

    @media (max-width: 600px) {
      :root {
        --gap: 3px;
        --pad: 4px;
        --card-w: calc((100vw - 8px - 18px) / 7);
        --card-h: calc(var(--card-w) * 1.5);
        --fan-down: 14px;
        --fan-up: 28px;
      }
      #app { padding-left: 4px; padding-right: 4px; }
      #topbar { border-radius: 10px; padding: 6px 7px; margin-bottom: 7px; }
      #brand { display: none; }
      #status { margin-right: auto; gap: 6px; }
      #controls button { min-height: 36px; padding: 6px 8px; font-size: 12px; }
      #tableau { margin-top: 15px; }
      .tableau-pile { min-height: calc(100svh - 210px); }
      #themeGrid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      :root { --fan-down: 12px; --fan-up: 24px; }
      #topbar { margin-bottom: 5px; padding-top: 4px; padding-bottom: 4px; }
      #controls button { min-height: 32px; padding-top: 4px; padding-bottom: 4px; }
      #tableau { margin-top: 10px; }
      .tableau-pile { min-height: calc(100svh - 150px); }
    }
  </style>
</head>
<body>
  <main id="app">
    <header id="topbar">
      <div id="brand">♠ Solitaire</div>
      <div id="status">
        <span id="score">Score 0</span>
        <span id="timer">00:00</span>
      </div>
      <div id="controls">
        <button id="restartButton" type="button">New</button>
        <button id="themeButton" type="button">Theme</button>
      </div>
    </header>

    <section id="board" aria-label="Klondike solitaire board">
      <div id="top-row">
        <div class="slot pile" id="stock" data-pile="stock" aria-label="Stock pile"></div>
        <div class="slot pile" id="waste" data-pile="waste" aria-label="Waste pile"></div>
        <div></div>
        <div class="slot pile foundation" id="foundation-0" data-pile="foundation" data-index="0" data-suit="♥"></div>
        <div class="slot pile foundation" id="foundation-1" data-pile="foundation" data-index="1" data-suit="♦"></div>
        <div class="slot pile foundation" id="foundation-2" data-pile="foundation" data-index="2" data-suit="♣"></div>
        <div class="slot pile foundation" id="foundation-3" data-pile="foundation" data-index="3" data-suit="♠"></div>
      </div>
      <div id="tableau">
        <div class="pile tableau-pile" data-pile="tableau" data-index="0"></div>
        <div class="pile tableau-pile" data-pile="tableau" data-index="1"></div>
        <div class="pile tableau-pile" data-pile="tableau" data-index="2"></div>
        <div class="pile tableau-pile" data-pile="tableau" data-index="3"></div>
        <div class="pile tableau-pile" data-pile="tableau" data-index="4"></div>
        <div class="pile tableau-pile" data-pile="tableau" data-index="5"></div>
        <div class="pile tableau-pile" data-pile="tableau" data-index="6"></div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <div id="themePreview" aria-hidden="true">
    <div id="themeModalContent">
      <h2>Card Back</h2>
      <div id="themeGrid"></div>
      <button id="closeTheme" type="button">Done</button>
    </div>
  </div>

  <div id="winOverlay">
    <div id="winCard">
      <h2>You won ♠</h2>
      <p id="winStats"></p>
      <button id="playAgain" type="button">Deal again</button>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    const SUITS = [
      { code: 'H', symbol: '♥', color: 'red' },
      { code: 'D', symbol: '♦', color: 'red' },
      { code: 'C', symbol: '♣', color: 'black' },
      { code: 'S', symbol: '♠', color: 'black' }
    ];

    const board = document.getElementById('board');
    const stockEl = document.getElementById('stock');
    const wasteEl = document.getElementById('waste');
    const foundationEls = [...document.querySelectorAll('.foundation')];
    const tableauEls = [...document.querySelectorAll('.tableau-pile')];
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const toastEl = document.getElementById('toast');
    const themePreview = document.getElementById('themePreview');
    const themeGrid = document.getElementById('themeGrid');
    const winOverlay = document.getElementById('winOverlay');
    const winStats = document.getElementById('winStats');

    const state = {
      stock: [],
      waste: [],
      foundations: [[], [], [], []],
      tableau: [[], [], [], [], [], [], []],
      score: 0,
      elapsed: 0,
      timer: null,
      selected: null,
      cardBack: Number(localStorage.getItem('solitaireCardBack') || 1),
      won: false
    };

    function makeDeck() {
      const deck = [];
      for (const suit of SUITS) {
        for (let rank = 1; rank <= 13; rank++) {
          deck.push({ suit: suit.code, rank, faceUp: false, id: `${suit.code}${rank}-${Math.random().toString(36).slice(2)}` });
        }
      }
      return deck;
    }

    function shuffle(deck) {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function rankText(rank) {
      return rank === 1 ? 'A' : rank === 11 ? 'J' : rank === 12 ? 'Q' : rank === 13 ? 'K' : String(rank);
    }

    function suitInfo(card) {
      return SUITS.find(s => s.code === card.suit);
    }

    function cardColor(card) { return suitInfo(card).color; }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateStatus() {
      scoreEl.textContent = `Score ${state.score}`;
      timerEl.textContent = formatTime(state.elapsed);
    }

    function startTimer() {
      clearInterval(state.timer);
      state.timer = setInterval(() => {
        if (!state.won) {
          state.elapsed++;
          updateStatus();
        }
      }, 1000);
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toastEl.classList.remove('show'), 1050);
    }

    function initGame() {
      clearInterval(state.timer);
      const deck = shuffle(makeDeck());
      state.stock = [];
      state.waste = [];
      state.foundations = [[], [], [], []];
      state.tableau = [[], [], [], [], [], [], []];
      state.score = 0;
      state.elapsed = 0;
      state.selected = null;
      state.won = false;
      winOverlay.classList.remove('show');

      for (let col = 0; col < 7; col++) {
        for (let row = 0; row <= col; row++) {
          const card = deck.pop();
          card.faceUp = row === col;
          state.tableau[col].push(card);
        }
      }
      state.stock = deck;
      render();
      updateStatus();
      startTimer();
    }

    function setCardBack(index) {
      state.cardBack = Math.min(10, Math.max(1, Number(index) || 1));
      localStorage.setItem('solitaireCardBack', String(state.cardBack));
      document.documentElement.style.setProperty('--card-back', `url("img${state.cardBack}.png")`);
      renderThemeGrid();
      render();
    }

    function createCardElement(card, meta, topPx = 0, z = 1) {
      const el = document.createElement('div');
      el.className = `card ${card.faceUp ? 'face-up' : 'face-down'} ${card.faceUp && cardColor(card) === 'red' ? 'red' : ''}`;
      el.dataset.cardId = card.id;
      el.dataset.source = meta.type;
      if (meta.index !== undefined) el.dataset.index = meta.index;
      if (meta.cardIndex !== undefined) el.dataset.cardIndex = meta.cardIndex;
      el.style.top = `${topPx}px`;
      el.style.zIndex = String(z);

      if (state.selected && selectionContains(card.id)) el.classList.add('selected');

      if (card.faceUp) {
        const suit = suitInfo(card).symbol;
        const rank = rankText(card.rank);
        el.innerHTML = `
          <div class="corner"><span>${rank}</span><span class="suit-line">${suit}</span></div>
          <div class="center-mark ${card.rank >= 11 ? 'face' : ''}">${card.rank >= 11 ? rank : suit}</div>
          <div class="corner bottom"><span>${rank}</span><span class="suit-line">${suit}</span></div>`;
      }
      return el;
    }

    function fanOffsets() {
      const css = getComputedStyle(document.documentElement);
      return {
        down: parseFloat(css.getPropertyValue('--fan-down')) || 14,
        up: parseFloat(css.getPropertyValue('--fan-up')) || 28
      };
    }

    function render() {
      document.documentElement.style.setProperty('--card-back', `url("img${state.cardBack}.png")`);
      stockEl.innerHTML = '';
      wasteEl.innerHTML = '';
      foundationEls.forEach(el => el.innerHTML = '');
      tableauEls.forEach(el => el.innerHTML = '');

      if (state.stock.length) {
        const top = state.stock[state.stock.length - 1];
        stockEl.appendChild(createCardElement(top, { type: 'stock' }, 0, 1));
      }

      if (state.waste.length) {
        const visible = state.waste.slice(-3);
        visible.forEach((card, i) => {
          const el = createCardElement(card, { type: 'waste', cardIndex: state.waste.length - visible.length + i }, 0, i + 1);
          el.style.left = `${i * Math.min(9, Math.max(3, window.innerWidth * .012))}px`;
          wasteEl.appendChild(el);
        });
      }

      state.foundations.forEach((pile, i) => {
        if (pile.length) foundationEls[i].appendChild(createCardElement(pile[pile.length - 1], { type: 'foundation', index: i, cardIndex: pile.length - 1 }, 0, 1));
      });

      const offsets = fanOffsets();
      state.tableau.forEach((pile, pileIndex) => {
        let y = 0;
        pile.forEach((card, cardIndex) => {
          const el = createCardElement(card, { type: 'tableau', index: pileIndex, cardIndex }, y, cardIndex + 1);
          tableauEls[pileIndex].appendChild(el);
          y += card.faceUp ? offsets.up : offsets.down;
        });
        tableauEls[pileIndex].style.minHeight = `max(calc(100svh - 210px), ${y + 130}px)`;
      });
    }

    function selectionContains(cardId) {
      if (!state.selected) return false;
      const cards = selectedCards();
      return cards.some(c => c.id === cardId);
    }

    function selectedCards() {
      if (!state.selected) return [];
      const s = state.selected;
      if (s.type === 'waste') return state.waste.length ? [state.waste[state.waste.length - 1]] : [];
      if (s.type === 'foundation') {
        const pile = state.foundations[s.index];
        return pile.length ? [pile[pile.length - 1]] : [];
      }
      if (s.type === 'tableau') return state.tableau[s.index].slice(s.cardIndex);
      return [];
    }

    function canMoveRun(cards) {
      if (!cards.length || !cards[0].faceUp) return false;
      for (let i = 0; i < cards.length - 1; i++) {
        if (!cards[i + 1].faceUp) return false;
        if (cards[i].rank !== cards[i + 1].rank + 1) return false;
        if (cardColor(cards[i]) === cardColor(cards[i + 1])) return false;
      }
      return true;
    }

    function removeSelected() {
      const s = state.selected;
      if (!s) return [];
      if (s.type === 'waste') return state.waste.splice(state.waste.length - 1, 1);
      if (s.type === 'foundation') return state.foundations[s.index].splice(-1, 1);
      if (s.type === 'tableau') return state.tableau[s.index].splice(s.cardIndex);
      return [];
    }

    function revealTableauTop(index) {
      const pile = state.tableau[index];
      if (pile.length && !pile[pile.length - 1].faceUp) {
        pile[pile.length - 1].faceUp = true;
        state.score += 5;
      }
    }

    function validTableauMove(cards, targetIndex) {
      if (!cards.length || !canMoveRun(cards)) return false;
      const target = state.tableau[targetIndex];
      const lead = cards[0];
      if (!target.length) return lead.rank === 13;
      const top = target[target.length - 1];
      return top.faceUp && top.rank === lead.rank + 1 && cardColor(top) !== cardColor(lead);
    }

    function validFoundationMove(card, targetIndex) {
      const target = state.foundations[targetIndex];
      if (!target.length) return card.rank === 1;
      const top = target[target.length - 1];
      return card.suit === top.suit && card.rank === top.rank + 1;
    }

    function moveSelectionToTableau(targetIndex) {
      const s = state.selected;
      if (!s) return false;
      if (s.type === 'tableau' && s.index === targetIndex) return false;
      const cards = selectedCards();
      if (!validTableauMove(cards, targetIndex)) return false;
      const moved = removeSelected();
      state.tableau[targetIndex].push(...moved);
      if (s.type === 'tableau') revealTableauTop(s.index);
      state.score += 5;
      state.selected = null;
      render(); updateStatus(); checkWin();
      return true;
    }

    function moveSelectionToFoundation(targetIndex) {
      const s = state.selected;
      if (!s) return false;
      const cards = selectedCards();
      if (cards.length !== 1 || !validFoundationMove(cards[0], targetIndex)) return false;
      const moved = removeSelected();
      state.foundations[targetIndex].push(moved[0]);
      if (s.type === 'tableau') revealTableauTop(s.index);
      state.score += 10;
      state.selected = null;
      render(); updateStatus(); checkWin();
      return true;
    }

    function autoMoveToFoundation(selection) {
      state.selected = selection;
      const cards = selectedCards();
      if (cards.length !== 1) { state.selected = null; return false; }
      for (let i = 0; i < 4; i++) {
        if (validFoundationMove(cards[0], i)) return moveSelectionToFoundation(i);
      }
      state.selected = null;
      return false;
    }

    function drawFromStock() {
      state.selected = null;
      if (!state.stock.length) {
        if (!state.waste.length) { showToast('No cards to recycle'); return; }
        while (state.waste.length) {
          const c = state.waste.pop();
          c.faceUp = false;
          state.stock.push(c);
        }
        state.score = Math.max(0, state.score - 5);
        render(); updateStatus();
        return;
      }
      const count = Math.min(3, state.stock.length);
      for (let i = 0; i < count; i++) {
        const c = state.stock.pop();
        c.faceUp = true;
        state.waste.push(c);
      }
      render();
    }

    function handleCardTap(cardEl) {
      const source = cardEl.dataset.source;
      if (source === 'stock') { drawFromStock(); return; }
      if (source === 'waste') {
        if (!state.waste.length) return;
        state.selected = { type: 'waste' };
        render();
        return;
      }
      if (source === 'foundation') {
        state.selected = { type: 'foundation', index: Number(cardEl.dataset.index) };
        render();
        return;
      }
      if (source === 'tableau') {
        const index = Number(cardEl.dataset.index);
        const cardIndex = Number(cardEl.dataset.cardIndex);
        const card = state.tableau[index][cardIndex];
        if (!card.faceUp) {
          if (cardIndex === state.tableau[index].length - 1) {
            card.faceUp = true;
            state.score += 5;
            render(); updateStatus();
          }
          return;
        }
        const run = state.tableau[index].slice(cardIndex);
        if (!canMoveRun(run)) { showToast('That stack cannot move'); return; }
        state.selected = { type: 'tableau', index, cardIndex };
        render();
      }
    }

    function handlePileTap(pileEl) {
      const type = pileEl.dataset.pile;
      if (type === 'stock') { drawFromStock(); return; }
      if (!state.selected) return;
      if (type === 'tableau') {
        if (!moveSelectionToTableau(Number(pileEl.dataset.index))) showToast('Not a valid move');
      } else if (type === 'foundation') {
        if (!moveSelectionToFoundation(Number(pileEl.dataset.index))) showToast('Not a valid foundation move');
      }
    }

    let lastTap = { id: null, time: 0 };
    board.addEventListener('pointerup', (e) => {
      const cardEl = e.target.closest('.card');
      const pileEl = e.target.closest('.pile');
      const now = performance.now();

      if (cardEl) {
        const id = cardEl.dataset.cardId;
        const isDouble = lastTap.id === id && now - lastTap.time < 360;
        lastTap = { id, time: now };

        if (isDouble && cardEl.dataset.source !== 'stock') {
          const source = cardEl.dataset.source;
          let selection = null;
          if (source === 'waste') selection = { type: 'waste' };
          if (source === 'foundation') selection = { type: 'foundation', index: Number(cardEl.dataset.index) };
          if (source === 'tableau') {
            const i = Number(cardEl.dataset.index);
            const ci = Number(cardEl.dataset.cardIndex);
            if (ci === state.tableau[i].length - 1) selection = { type: 'tableau', index: i, cardIndex: ci };
          }
          if (selection && autoMoveToFoundation(selection)) return;
        }

        if (state.selected && pileEl) {
          const src = cardEl.dataset.source;
          const selectedSameCard = selectionContains(id);
          if (!selectedSameCard && pileEl.dataset.pile === 'tableau' && moveSelectionToTableau(Number(pileEl.dataset.index))) return;
          if (!selectedSameCard && pileEl.dataset.pile === 'foundation' && moveSelectionToFoundation(Number(pileEl.dataset.index))) return;
          if (src !== 'stock') handleCardTap(cardEl);
          else drawFromStock();
          return;
        }

        handleCardTap(cardEl);
        return;
      }

      if (pileEl) handlePileTap(pileEl);
      else if (state.selected) { state.selected = null; render(); }
    }, { passive: true });

    function checkWin() {
      const total = state.foundations.reduce((n, pile) => n + pile.length, 0);
      if (total !== 52) return;
      state.won = true;
      clearInterval(state.timer);
      winStats.textContent = `Score ${state.score} • ${formatTime(state.elapsed)}`;
      winOverlay.classList.add('show');
    }

    function renderThemeGrid() {
      themeGrid.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const img = document.createElement('img');
        img.src = `img${i}.png`;
        img.alt = `Card back ${i}`;
        img.className = `theme-choice ${state.cardBack === i ? 'active' : ''}`;
        img.addEventListener('click', () => setCardBack(i));
        themeGrid.appendChild(img);
      }
    }

    document.getElementById('restartButton').addEventListener('click', initGame);
    document.getElementById('themeButton').addEventListener('click', () => {
      renderThemeGrid();
      themePreview.classList.add('open');
      themePreview.setAttribute('aria-hidden', 'false');
    });
    document.getElementById('closeTheme').addEventListener('click', () => {
      themePreview.classList.remove('open');
      themePreview.setAttribute('aria-hidden', 'true');
    });
    themePreview.addEventListener('click', (e) => {
      if (e.target === themePreview) document.getElementById('closeTheme').click();
    });
    document.getElementById('playAgain').addEventListener('click', initGame);

    window.addEventListener('resize', () => requestAnimationFrame(render));
    window.addEventListener('orientationchange', () => setTimeout(render, 120));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      render();
    });

    setCardBack(state.cardBack);
    initGame();
  })();
  </script>
</body>
</html>
