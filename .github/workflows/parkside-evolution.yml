name: Parkside Evolution validation
on:
  pull_request:
    paths: ['parkside-evolution/**', '.github/workflows/parkside-evolution.yml']
  push:
    branches: [main]
    paths: ['parkside-evolution/**', '.github/workflows/parkside-evolution.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: parkside-evolution/package-lock.json
      - run: npm ci
        working-directory: parkside-evolution
      - run: npm run prepublish:check
        working-directory: parkside-evolution
      - name: Ensure committed launcher and release are reproducible
        run: git diff --exit-code -- parkside-evolution/index.html parkside-evolution/release-manifest.json parkside-evolution/releases
