<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Custom Luck — Big Board</title>
  <link rel="stylesheet" href="style.css">
<meta name="description" content="Original retro big-board game-show game with customizable spaces and animated mascot gags."></head>
<body>
  <main class="app">
    <section class="game-shell" aria-label="Big Board">
      <div class="stage" id="stage">
        <div class="stage-bg art-stage" role="img" aria-label="Retro game-show stage"></div>
        <div class="logo logo-left logo-sprite logo-sprite-big_bucks" role="img" aria-label="Big Bucks"></div>
        <div class="logo logo-right logo-sprite logo-sprite-whammy" role="img" aria-label="Whammy"></div>
        <div id="boardLayer" class="board-layer"></div>

        <div class="center-screen" id="centerScreen">
          <div class="crt-scan"></div>
          <div id="sceneFlash" class="scene-flash"></div>
          <div id="centerFx" class="center-fx fx-sprite" aria-hidden="true"></div>
          <div id="centerMascot" class="center-mascot char-sprite" role="img" aria-label="Red game-show mascot"></div>
          <div id="sceneCaption" class="scene-caption"></div>
          <div class="center-copy">
            <div id="centerHeadline">BIG BUCKS!</div>
            <div id="centerSub">NO WHAMMIES</div>
          </div>
        </div>

        <div class="players" id="players"></div>
        <div class="status-board">
          <div id="turnText">PLAYER 1 — ADD SPINS OR PRESS SPIN</div>
          <div class="mini-stats"><span id="activeBank">$0</span><span id="activeSpins">SPINS 0</span><span id="activeWhammies">WHAMMIES 0/4</span></div>
        </div>
      </div>

      <div class="controls" aria-label="Game controls">
        <button id="spinBtn" class="image-button" aria-label="Spin"><div id="spinSprite" class="button-sprite button-sprite-spin"></div></button>
        <button id="passBtn" class="image-button" aria-label="Pass"><div class="button-sprite button-sprite-pass"></div></button>
        <button id="addSpinBtn" class="utility-button">+ SPIN</button>
        <button id="quitBtn" class="image-button" aria-label="Quit turn"><div class="button-sprite button-sprite-quit"></div></button>
      </div>
      <div class="settings-strip" aria-label="Display and sound settings">
        <label><input id="sfxToggle" type="checkbox" checked> SFX</label>
        <label><input id="fastToggle" type="checkbox"> FAST MODE</label>
        <label><input id="tvToggle" type="checkbox" checked> TV FILTER</label>
        <button id="fullscreenBtn" type="button">FULLSCREEN</button>
      </div>
    </section>

    <section class="lower-grid">
      <section class="animation-panel panel">
        <div class="panel-title-img logo-sprite logo-sprite-animations" role="img" aria-label="Whammy Animations"></div>
        <p class="section-note">Every picture below is a real cropped asset from the generated sprite sheets. Tap one to preview the gag on the center screen.</p>
        <div id="animationGallery" class="animation-gallery"></div>
      </section>

      <section class="editor-panel panel">
        <div class="panel-title-img editor-title logo-sprite logo-sprite-board_editor" role="img" aria-label="Board Editor"></div>
        <div class="editor-form">
          <label>Space <select id="editIndex"></select></label>
          <label>Type
            <select id="editType">
              <option value="money">Cash</option>
              <option value="prize">Prize</option>
              <option value="whammy">Whammy</option>
              <option value="move">Move / Special</option>
            </select>
          </label>
          <label>Label <input id="editLabel" type="text" maxlength="28"></label>
          <label>Amount <input id="editValue" type="number" step="50"></label>
          <label class="check"><input id="editSpin" type="checkbox"> + One Spin</label>
          <button id="applyEdit" class="editor-action green">APPLY</button>
          <button id="randomizeBoard" class="editor-action purple">RANDOM BOARD</button>
          <button id="resetBoard" class="editor-action red">RESTORE CLASSIC</button>
          <button id="exportBoard" class="editor-action blue">EXPORT JSON</button>
        </div>
        <textarea id="jsonArea" spellcheck="false" aria-label="Board JSON"></textarea>
        <button id="importBoard" class="editor-action orange full">IMPORT JSON</button>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
