<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#008080">
  <meta name="description" content="Mango Windows 3.1 — a retro desktop for Steve’s games, apps and wonderfully strange experiments.">
  <title>Mango Windows 3.1 · Program Manager</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="desktop.css">
  <script type="module" src="desktop.js"></script>
</head>
<body>
  <main id="shell" aria-label="Mango Windows desktop">
    <header id="manager-title" class="titlebar active">
      <button class="system-button" id="manager-system" aria-label="Program Manager menu">−</button>
      <span class="title-text">Program Manager</span>
      <span class="system-name">MANGO WINDOWS 3.1</span>
      <button class="title-control" id="fullscreen" aria-label="Toggle full screen" title="Full screen">▲</button>
    </header>
    <nav class="menubar" aria-label="Program Manager menu">
      <button data-menu="file"><u>F</u>ile</button>
      <button data-menu="options"><u>O</u>ptions</button>
      <button data-menu="window"><u>W</u>indow</button>
      <button data-menu="help"><u>H</u>elp</button>
      <div class="menu-spacer"></div>
      <button id="find-button" title="Find a program (Ctrl+K)"><span class="search-glyph">⌕</span> Find a program…</button>
    </nav>
    <div id="workspace">
      <div class="desktop-watermark" aria-hidden="true"><div id="brand-mark"></div><span>Mango Windows</span><small>VERSION 3.1 · PERSONAL EDITION</small></div>
      <div id="desktop-icons" aria-label="Program groups"></div>
      <div id="windows"></div>
      <div id="minimized" aria-label="Minimized windows"></div>
    </div>
    <footer id="statusbar"><span class="status-cell status-brand">MANGO / 3.1</span><span id="desktop-status" class="status-cell">Starting Program Manager…</span><button id="sound-toggle" class="status-cell" aria-label="Toggle interface sounds">Sound: off</button><button id="clock" class="status-cell" title="Open calendar"></button></footer>
  </main>
  <div id="menu-popup" class="popup" hidden></div>
  <div id="toast" role="status" hidden></div>
  <div id="screensaver" hidden tabindex="0" aria-label="Screensaver. Tap or press a key to return."><div id="saver-logo"><span>Mango Windows</span><small>Move the mouse, tap, or press a key</small></div></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript><p class="noscript">Enable JavaScript to use Program Manager.</p></noscript>
</body>
</html>
