              batch.triangle(previous[i], previous[k], ring[k], c,d,d);
              batch.triangle(previous[i], ring[k], ring[i], c,d,c);
            }
          }
          previous = ring;
        }
      }

      // Cross sections give fins a rounded leading edge, convex faces and a tapered tip.
      function foil(batch, stations, thicknessAxis, paint, sides = 8) {
        let previous;
        for (const [x, y, front, rear, thickness] of stations) {
          const ring = [];
          for (let i = 0; i < sides; i++) {
            const a = i * TAU / sides;
            ring.push(vec(x,y,lerp(rear,front,(1 + Math.cos(a)) * 0.5))
              .addScaledVector(thicknessAxis, thickness * Math.sin(a)));
          }
          if (previous) {
            for (let i = 0; i < sides; i++) {
              const next = (i + 1) % sides;
              batch.quad(previous[i], previous[next], ring[next], ring[i], paint);
            }
          }
          previous = ring;
        }
      }

      function buildFish() {
        const batch = new MeshBuilder();
        const upper = color(0x6c8b98);
        const lower = color(0xe8e4ce);
        const fin = color(0xabb9ad);
        fishBody(batch, [[-0.52, 0.008, 0.013, 0], [-0.30, 0.049, 0.056, 0.002],
          [-0.02, 0.070, 0.099, 0.008], [0.23, 0.059, 0.079, 0.009], [0.43, 0.005, 0.013, 0.011]],
        10, upper, lower);
        for (const side of [-1, 1]) {
          foil(batch, [[0,0,-0.45,-0.57,0.011],[0,side*0.054,-0.53,-0.63,0.006],
            [0,side*0.12,-0.66,-0.68,0.002]], unitX, fin, 4);
          foil(batch, [[side*0.05,0,0.10,-0.06,0.01],[side*0.103,-0.027,0.014,-0.055,0.005],
            [side*0.123,-0.039,-0.035,-0.042,0.002]], unitY, fin, 4);
          batch.tube([vec(side*.054,.052,.215),vec(side*.064,.030,.177),
            vec(side*.067,-.011,.154),vec(side*.049,-.046,.169)],.006,.003,4,shade(upper,.48));
          batch.shape(facet,vec(side*.05,.041,.276),vec(.013,.023,.023),color(0xb7b391));
          batch.shape(eyeGeometry, vec(side * 0.057, 0.044, 0.265), vec(0.014, 0.018, 0.019), color(0x193843));
        }
        foil(batch, [[0,.077,.09,-.16,.014],[0,.132,-.01,-.132,.008],
          [0,.167,-.094,-.121,.002]], unitX, upper, 4);
        const material = new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, shininess: 34, specular: 0x778b97 });
        material.onBeforeCompile = (shader) => {
          shader.uniforms.waterTime = waterTime;
          shader.vertexShader = shader.vertexShader
            .replace("#include <common>", "#include <common>\nuniform float waterTime;")
            .replace("#include <begin_vertex>", `
              #include <begin_vertex>
              float beat = max(0.0, 0.18 - position.z);
              transformed.x += beat * beat * 0.29
                * sin(waterTime * 9.0 + position.z * 8.0 + instanceMatrix[3].x * 0.46);
            `);
        };
        surfaceDetail(material, `
          float sideSkin = smoothstep(.022,.058,abs(vSkin.x));
          float flankLine = exp(-abs(vSkin.y-.008-.009*sin(vSkin.z*6.0))*96.);
          float scales = .5+.5*cos(vSkin.z*142. + cos(vSkin.y*174.)*2.);
          float behindEye = 1.-smoothstep(.15,.23,vSkin.z);
          diffuseColor.rgb += sideSkin*behindEye*(vec3(.16,.18,.18)*flankLine
            +vec3(.04,.052,.054)*scales);
        `);
        const school = Array.from({ length: 28 }, (_, i) => {
          const angle = i * 2.39996;
          const offset = Math.sqrt((i + 0.5) / 28);
          return {
            x: Math.cos(angle) * offset * 2.85,
            y: Math.sin(angle) * offset * 0.88,
            z: range(-2.1, 2.1),
            size: range(0.51, 0.83)
          };
        });
        const bass = [[-22, -8.8, 3.8], [-17, -8, -2.7], [-23, -7.0, -0.7]];
        const count = school.length + bass.length + 1;
        const fish = new THREE.InstancedMesh(batch.geometry(), material, count);
        fish.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        fish.frustumCulled = false;
        for (let i = 0; i < count; i++) {
          fish.setColorAt(i, i < school.length ? shade(color(0xe5edf0), range(0.76, 1.18))
            : color(i === count - 1 ? 0xff9a42 : 0xb5b19a));
        }
        scene.add(fish);

        const avoidance = Array.from({length:count},()=>vec(0,0,0));
        const flee = vec(0,0,0);
        let lastTime = 0;
        function placeFish(index, dt) {
          flee.subVectors(instanceTransform.position,camera.position);
          const distance = flee.length();
          const proximity = 1 - THREE.MathUtils.smoothstep(distance,.5,3.4);
          if(distance < .001) flee.copy(unitX);
          flee.normalize().multiplyScalar(proximity * 1.85);
          avoidance[index].lerp(flee,1-Math.exp(-dt*(proximity>.1 ? 3.6 : 1.2)));
          const offset = avoidance[index];
          instanceTransform.position.add(offset);
          if(offset.lengthSq() > .001) {
            const target = Math.atan2(offset.x,offset.z);
            const turn = THREE.MathUtils.euclideanModulo(target-instanceTransform.rotation.y+Math.PI,TAU)-Math.PI;
            instanceTransform.rotation.y += turn*Math.min(.87,offset.length()*.55);
          }
          instanceTransform.updateMatrix();
          fish.setMatrixAt(index,instanceTransform.matrix);
        }
        return (t) => {
          const dt=Math.min(.08,Math.max(0,t-lastTime)); lastTime=t;
          const orbit = t * 0.21;
          const cx = -11.0 + Math.sin(orbit) * 8.1;
          const cy = -7.55 + Math.sin(orbit * 2) * 0.60;
          const cz = -3.1 + (Math.cos(orbit) - 1) * 5.15;
          const heading = Math.atan2(Math.cos(orbit) * 8.1, -Math.sin(orbit) * 5.15);
          const sin = Math.sin(heading);
          const cos = Math.cos(heading);
          for (let i = 0; i < school.length; i++) {
            const item = school[i];
            const lateral = item.x + Math.sin(t * 2.9 + i) * 0.14;
            instanceTransform.position.set(cx + lateral * cos + item.z * sin,
              cy + item.y + Math.sin(t * 1.78 + i * 1.2) * 0.16,
              cz - lateral * sin + item.z * cos);
            instanceTransform.rotation.set(0.11 * Math.cos(orbit * 2 + i), heading + Math.sin(t * 2 + i) * 0.095, 0.13 * Math.sin(orbit));
            instanceTransform.scale.setScalar(item.size);
            placeFish(i,dt);
          }
          for (let i = 0; i < bass.length; i++) {
            const [x, y, z] = bass[i];
            const a = t * (0.42 + i * 0.055) + i * 1.72;
            instanceTransform.position.set(x + Math.cos(a) * 2.15, y + Math.sin(a * 2) * 0.48, z + Math.sin(a) * 1.69);
            instanceTransform.rotation.set(0, Math.atan2(-Math.sin(a) * 2.15, Math.cos(a) * 1.69), Math.cos(a) * 0.12);
            instanceTransform.scale.set(0.90, 1.35, 1.12);
            placeFish(school.length + i,dt);
          }
          const a = t * 0.39;
          instanceTransform.position.set(-11.4 + Math.cos(a) * 1.7, -9.0 + Math.cos(a * 2) * 0.36, -6.1 + Math.sin(a) * 1.5);
          instanceTransform.rotation.set(0, Math.atan2(-Math.sin(a) * 1.7, Math.cos(a) * 1.5), 0);
          instanceTransform.scale.set(1.1, 1.74, 1.02);
          placeFish(count - 1,dt);
          fish.instanceMatrix.needsUpdate = true;
        };
      }

      function buildRay() {
        const batch = new MeshBuilder();
        const back = color(0x7f7463);
        const belly = color(0xcab994);

              ring.push(vec(side*span, .024*span + thick*Math.sin(angle),
                lerp(rear,front,0.5+0.5*Math.cos(angle))));
            }
            if(previous) for(let k=0;k<16;k++){

            .replace("#include <common>", "#include <common>\nuniform float waterTime;")
            .replace("#include <begin_vertex>", `
              #include <begin_vertex>

        const ray = new THREE.Mesh(batch.geometry(), material);
        ray.name = "Bat ray";
        scene.add(ray);
        const here = new THREE.Vector3(), ahead = new THREE.Vector3();
        function course(angle, out) {

            Math.atan2(ahead.x-here.x,ahead.z-here.z),.13+.055*Math.sin(a*1.8),"YXZ");

      }

            `);

            *smoothstep(.96,1.06,z)*(1.-smoothstep(1.32,1.40,z))*smoothstep(.035,.12,abs(vSkin.x));

      function buildJellies() {
        const animals = [
          { base: [-9.5,-4.2,-9.4], size: 1.02, crown: .31, radius: .53, length: .86, speed: 2.17, phase: .72, lobes: 12, veil: 0xc0dfd4, tissue: 0xd3a99d },
          { base: [-7.4,-3.9,-11.6], size: .86, crown: .38, radius: .44, length: 1.06, speed: 1.76, phase: 3.14, lobes: 10, veil: 0xd7c6df, tissue: 0xbb9bb9 },
          { base: [-11.9,-3.5,-11.2], size: 1.14, crown: .255, radius: .56, length: .73, speed: 1.91, phase: 5.21, lobes: 14, veil: 0xe1d2b6, tissue: 0xdbaa85 }
        ];

        function softTissueMaterial(phase, bell) {
          const material = new THREE.MeshPhongMaterial({
            vertexColors: true, side: THREE.DoubleSide, transparent: true,
            opacity: bell ? .47 : .74, depthWrite: false, forceSinglePass: true,
            emissive: bell ? 0x28505a : 0x38434c, emissiveIntensity: .38,
            shininess: bell ? 39 : 17, specular: bell ? 0x92a8a5 : 0x415455
          });
          material.customProgramCacheKey = () => bell ? "jelly-veil" : "jelly-tissue";
          material.onBeforeCompile = shader => {
            shader.uniforms.jellyPhase = phase;
            shader.uniforms.waterTime = waterTime;
            shader.vertexShader = shader.vertexShader
              .replace("#include <common>", `
                #include <common>
                uniform float jellyPhase;
                uniform float waterTime;
                varying float vGelEdge;
                varying vec3 vGelPoint;
                float bellStroke(float p) {
                  return pow(0.5+0.5*cos(p+0.52*cos(p)),1.65);
                }
              `)
              .replace("#include <begin_vertex>", `
                #include <begin_vertex>
                float freeLength = max(0.0,-position.y);
                float pull = bellStroke(jellyPhase - 1.9*freeLength);
                float follow = 1.0 - smoothstep(0.06, 0.91, freeLength);
                transformed.xz *= 1.0 - 0.175 * pull * follow;
                transformed.y *= 1.0 + 0.205 * pull * follow;
                float current = waterTime*0.83 + 2.6*freeLength + jellyPhase*0.12;
                transformed.x += freeLength*(0.15*sin(current) + 0.09*sin(jellyPhase-freeLength*2.7));
                transformed.z += freeLength*(0.10*cos(current*0.81) + 0.058*sin(jellyPhase-freeLength*3.8+position.x*6.0));
                vGelPoint = position;
              `)
              .replace("#include <project_vertex>", `
                #include <project_vertex>
                vGelEdge = 1.0 - abs(dot(normalize(transformedNormal),normalize(-mvPosition.xyz)));
              `);
            if (bell) {
              shader.fragmentShader = shader.fragmentShader
                .replace("#include <common>", "#include <common>\nvarying float vGelEdge; varying vec3 vGelPoint;")
                .replace("#include <color_fragment>", `
                  #include <color_fragment>
                  float angle = atan(vGelPoint.z,vGelPoint.x);
                  float channels = pow(0.5 + 0.5*cos(angle*16.0 + sin(vGelPoint.y*10.0)*0.8), 10.0);
                  float lip = 1.0-smoothstep(0.0,0.09,abs(vGelPoint.y+0.015));
                  diffuseColor.a *= 0.64 + 0.62*pow(clamp(vGelEdge,0.0,1.0),1.5) + 0.27*lip;
                  diffuseColor.rgb *= 0.95 + 0.12*channels + 0.15*lip;
                `);
            }
          };
          return material;
        }

        const jellies = animals.map((animal, index) => {
          const jelly = new THREE.Group();
          jelly.name = "Drifting jellyfish " + (index + 1);
          const phase = { value: animal.phase };
          const cap = new MeshBuilder();
          const arms = new MeshBuilder();
          const pearl = color(animal.veil), tissue = color(animal.tissue);
          const rim = pearl.clone().lerp(color(0xf4dfb8),.39);
          const sectors = 36;

          // An overhanging lip rolls back under the umbrella.
          let previous;
          for (let row = 0; row <= 10; row++) {
            const t = row / 10;
            const theta = t * 1.82;
            const fold = THREE.MathUtils.smoothstep(t,.5,1);
            const ring = [];
            for (let j=0; j<sectors; j++) {
              const a = TAU*j/sectors;
              const lobe = Math.cos(a*animal.lobes + .2*Math.sin(a*3+animal.phase));
              const r = animal.radius*Math.sin(theta)*(1+.025*lobe*fold);
              const y = animal.crown*Math.cos(theta) + .028*fold*lobe;
              ring.push(vec(r*Math.cos(a),y,r*Math.sin(a)));
            }
            if (previous) {
              const tone = pearl.clone().lerp(rim,fold).multiplyScalar(.88+.12*Math.cos(t*3.2));
              for (let j=0;j<sectors;j++) {
                const next=(j+1)%sectors;
                if (row===1) cap.triangle(previous[j],ring[next],ring[j],tone);
                else cap.quad(previous[j],previous[next],ring[next],ring[j],tone);
              }
            }
            previous=ring;
          }

          for (let arm=0;arm<4;arm++) {
            const a=arm*TAU/4+animal.phase*.22;
            const loop=[];
            for (let k=0;k<=9;k++) {
              const turn=k/9*5.0-2.5+a;
              loop.push(vec(.119*Math.cos(a)+.063*Math.cos(turn),
                animal.crown*.51+.020*Math.cos(turn-a),.119*Math.sin(a)+.066*Math.sin(turn)));
            }
            arms.tube(loop,.014,.010,4,tissue);
            const length=animal.length*(.88+.12*Math.sin(a*2.1));
            let last;
            for (let row=0;row<=12;row++) {
              const t=row/12;
              const curl=a+.88*t+.26*Math.sin(4.8*t+a);
              const reach=.063+.115*t+.045*Math.sin(4.4*t+arm)*t;
              const center=vec(reach*Math.cos(curl),.105-length*t,reach*Math.sin(curl));
              const width=(.019+.075*Math.sin(Math.PI*t)**.72)*(1+.21*Math.sin(32*t+a));
              const rowPoints=[];
              for (let k=0;k<6;k++) {
                const b=k*TAU/6;
                const twist=curl+2.4*t+.23*Math.sin(16*t+arm);
                const lateral=width*Math.cos(b);
                const thickness=width*.44*Math.sin(b);
                const frill=.035*Math.sin(t*30+a+Math.cos(b)*1.3)*Math.sin(Math.PI*t);
                rowPoints.push(center.clone().add(vec(lateral*Math.cos(twist)-thickness*Math.sin(twist),
                  frill*Math.abs(Math.cos(b)),lateral*Math.sin(twist)+thickness*Math.cos(twist))));
              }
              if (last) for(let k=0;k<6;k++) {
                const next=(k+1)%6;
                const tint=tissue.clone().lerp(pearl,.21+.38*Math.abs(Math.cos(k*TAU/6)));
                arms.quad(last[k],last[next],rowPoints[next],rowPoints[k],tint);
              }
              last=rowPoints;
            }
          }
          // The fine marginal tentacles form a skirt around the four folded feeding arms.
          for (let strand=0;strand<9;strand++) {
            const a=strand*2.39996+animal.phase;
            const length=animal.length*(.64+.39*(.5+.5*Math.sin(a*7.9)));
            const path=[];
            for(let j=0;j<=8;j++) {
              const t=j/8;
              const curl=a+.28*t+.19*Math.sin(t*5.6+a)*t;
              const r=animal.radius*(.955-.36*t)+.046*t*Math.sin(6*t+a);
              path.push(vec(r*Math.cos(curl),-.045-t*length,r*Math.sin(curl)));
            }
            arms.tube(path,.012,.0025,3,pearl);
          }
          const inner = new THREE.Mesh(arms.geometry(),softTissueMaterial(phase,false));
          const umbrella = new THREE.Mesh(cap.geometry(),softTissueMaterial(phase,true));
          inner.geometry.computeBoundingSphere();
          inner.geometry.boundingSphere.radius += .26;
          jelly.add(inner,umbrella);
          jelly.scale.setScalar(animal.size);
          scene.add(jelly);
          return { jelly,phase,animal };
        });

        return time => {
          for (const { jelly,phase,animal } of jellies) {
            const p=time*animal.speed + animal.phase + .16*Math.sin(time*.37+animal.phase);
            phase.value=p;
            const drift=time*.24+animal.phase;
            const [x,y,z]=animal.base;
            jelly.position.set(x+.48*Math.sin(drift), y+.28*Math.sin(drift*.81)+.096*Math.sin(p-.4),
              z+.32*Math.cos(drift*.84));
            jelly.rotation.set(.12*Math.sin(drift*1.3),.31*Math.sin(drift*.63),
              .15*Math.cos(drift*1.1)+.055*Math.sin(p));
          }
        };
      }

      function buildOctopus(ship) {
        const batch=new MeshBuilder();
        const skin=color(0xb77652), shadow=color(0x895540), rim=color(0xd39770);
        const control=[];
        function tag(start,reach,phase) {
          for(let i=start;i<batch.positions.length/3;i++)control.push(reach,phase);
        }
        // Pear-shaped mantle lies behind the head and broadens into the skirt of the arms.
        const mantle=[[-.85,.105,.013,.015],[-.79,.148,.118,.099],[-.66,.191,.227,.157],
          [-.48,.222,.302,.205],[-.29,.229,.314,.212],[-.15,.212,.261,.171],[-.03,.19,.178,.138]];
        let previous;
        for(const [z,h,w,depth] of mantle){
          const ring=Array.from({length:18},(_,j)=>{
            const a=j*TAU/18;
            return vec(w*Math.cos(a)+.052*Math.max(0,-z),h+depth*Math.sin(a),z);
          });
          if(previous) for(let j=0;j<ring.length;j++) {
            const next=(j+1)%ring.length;
            batch.quad(previous[j],previous[next],ring[next],ring[j],j<9?skin:shadow);
          }
          previous=ring;
        }
        batch.shape(smallSphere,vec(0,.195,.065),vec(.266,.179,.242),skin);
        batch.shape(smallSphere,vec(0,.097,.202),vec(.258,.088,.248),shadow);
        // Each iris sits under a fleshy brow with a horizontal slit.
        for(const side of [-1,1]) {
          batch.shape(facet,vec(side*.207,.276,.110),vec(.115,.09,.109),shadow);
          batch.shape(smallSphere,vec(side*.267,.289,.127),vec(.048,.053,.069),color(0xd49c57));
          batch.shape(facet,vec(side*.304,.298,.131),vec(.012,.012,.050),color(0x382c2a));
          batch.tube([vec(side*.277,.292,.061),vec(side*.282,.333,.102),
            vec(side*.274,.341,.151),vec(side*.263,.307,.189)],.019,.013,5,skin);
        }
        batch.tube([vec(-.206,.190,-.061),vec(-.281,.156,-.087),vec(-.318,.135,-.187)],.057,.037,7,rim);
        for(let j=0;j<12;j++) {
          const z=-.57+.041*j,a=1.3+j*2.39996;
          const x=.25*Math.cos(a),y=.227+.168*Math.sin(a);
          if(y<.22)continue;
          batch.shape(eyeGeometry,vec(x,y,z),vec(.039,.049,.054),shade(skin,1.06));
        }
        tag(0,0,0);

        const bearings=[-2.82,-2.22,-1.58,-.92,-.22,.55,1.24,2.18];
        const lengths=[.84,.79,.91,1.10,1.17,1.04,.92,.78];
        const curls=[1.32,-.74,-1.3,.63,-1.54,.99,1.34,-.95];
        const shoulders=[];
        for(let arm=0;arm<8;arm++) {
          const a=bearings[arm],angle=t=>a+curls[arm]*t*t+Math.sin(t*4.5+arm)*.13*t;
          const reach=lengths[arm],phase=arm*2.39996;
          const center=t=>{
            const forward=angle(t),u=Math.sin(t*1.58);
            return vec(Math.sin(forward)*(.113+reach*u),
              .061+.039*(1-t)+.047*Math.sin(t*4.5+arm)**2*t
                +Math.max(0,Math.sin(arm*3.18+.56))*.18*t**3,
              .141+Math.cos(forward)*(.121+reach*u));
          };
          const cross=(t,side,up)=>{
            const p=center(t);
            const tangent=center(Math.min(1,t+.006)).sub(center(Math.max(0,t-.006))).normalize();
            const radial=vec(tangent.z,0,-tangent.x).normalize();
            const vertical=tangent.clone().cross(radial).normalize();
            const r=.119*(1-t)**1.19+.009;
            return p.addScaledVector(radial,side*r).addScaledVector(vertical,up*r*.72);
          };
          let prior;
          for(let j=0;j<=14;j++) {
            const t=j/14,ring=Array.from({length:8},(_,k)=>cross(t,Math.cos(k*TAU/8),Math.sin(k*TAU/8)));
            if(prior) for(let k=0;k<8;k++) {
              const n=(k+1)%8;
              const tint=k<4?shade(skin,.93+.09*Math.sin(j*.7+arm)):rim;
              batch.quad(prior[k],ring[k],ring[n],prior[n],tint);
              // First and last vertices of a strip lie in the preceding row.
              for(const u of [(j-1)/14,t,t,(j-1)/14,t,(j-1)/14]) control.push(u,phase);
            }
            prior=ring;
          }
          const webEdge=center(.16);webEdge.y+=.052;
          shoulders.push(webEdge);
          for(let j=3;j<13;j++) for(const side of [-1,1]) {
            const t=(j+.20*side)/15, p=cross(t,side*.81,-.38);
            const d=vec(Math.cos(angle(t))*side,-.63,-Math.sin(angle(t))*side).normalize();
            const axis=vec(d.z,0,-d.x).normalize(),across=d.clone().cross(axis);
            const mouth=.027*(1-t)+.005;
            const middle=p.clone().addScaledVector(d,mouth*.1);
            const ring=Array.from({length:6},(_,k)=>p.clone().addScaledVector(d,mouth*.46)
              .addScaledVector(axis,Math.cos(k*TAU/6)*mouth).addScaledVector(across,Math.sin(k*TAU/6)*mouth));
            const start=batch.positions.length/3;
            for(let k=0;k<6;k++) {
              const n=(k+1)%6;
              batch.triangle(ring[k],middle,ring[n],rim,shadow,rim);
            }
            tag(start,t,phase);
          }
        }
        const start=batch.positions.length/3;
        for(let i=0;i<8;i++) {
          const left=shoulders[i], right=shoulders[(i+1)%8], mid=left.clone().lerp(right,.5);
          mid.lerp(vec(0,.16,.14),.31);
          batch.triangle(vec(0,.175,.14),left,mid,shadow);
          batch.triangle(vec(0,.175,.14),mid,right,shadow);
        }
        tag(start,0,0);

        const skinMat=scenery.clone();
        skinMat.onBeforeCompile=shader=>{
          shader.uniforms.waterTime=waterTime;
          shader.vertexShader=shader.vertexShader.replace("#include <common>",
            "#include <common>\nuniform float waterTime; attribute vec2 armMotion;")
            .replace("#include <begin_vertex>",`
              #include <begin_vertex>
              float t=armMotion.x, phase=armMotion.y, sweep=waterTime*.75+phase;
              float lift=sin(sweep-t*3.7+.31*sin(waterTime*.31+phase));
              float pad=smoothstep(.12,.85,t);
              transformed.y+=pad*.075*max(0.0,lift);
              transformed.xz+=pad*vec2(.074*sin(sweep-t*2.9),.052*cos(sweep*.83-t*3.5));
              float breath=(1.0-smoothstep(-.54,-.07,position.z))*(1.0-step(.001,t));
              transformed.y+=breath*max(0.0,position.y-.07)*.085*sin(waterTime*1.71);
            `);
        };
        surfaceDetail(skinMat,`
          vec3 p=vSkin*vec3(16.0,21.0,14.0);
          float m=sin(p.x+.7*sin(p.y))*sin(p.z+1.5*sin(p.x*.7))+ .33*sin(p.y*2.4-p.z*3.1);
          float freckles=stipple(vSkin.xz*46.0+vSkin.y*13.0);
          diffuseColor.rgb *= .98+.24*m-.25*freckles;
          diffuseColor.rgb += vec3(.052,.034,.016)*smoothstep(.42,1.15,m);
        `);
        const geometry=batch.geometry();
        geometry.setAttribute("armMotion",new THREE.Float32BufferAttribute(control,2));
        const octopus=new THREE.Mesh(geometry,skinMat);
        octopus.name="Common octopus";
        octopus.rotation.y=-.67;

          octopus.position.set(x,ship.userData.deckHeight(x,z)+.012,z);

      }

      function buildReefLife() {

          body.shape(facet, vec(side * 0.083, 0.20, 0.29), vec(0.033, 0.033, 0.036), color(0x2f3430));

      function buildAddedWildlife() {
        const wildlife = new THREE.Group();
        wildlife.name = "Added wildlife";
        scene.add(wildlife);
        const transform = new THREE.Object3D();
        transform.rotation.order = "YXZ";
        const slot = new THREE.Vector3();
        const smoothstep = THREE.MathUtils.smoothstep;
        let wildlifeSeed = 3167443;
        let lastTime = 0;

        function driftRandom() {
          wildlifeSeed = (Math.imul(wildlifeSeed, 1664525) + 1013904223) >>> 0;
          return wildlifeSeed / 4294967296;
        }

        function turnAngle(from, to) {
          return THREE.MathUtils.euclideanModulo(to - from + Math.PI, TAU) - Math.PI;
        }

        function swimmer(position, yaw) {
          return { position: position.clone(), yaw, speed: 0, lift: 0, pitch: 0, bank: 0 };
        }

        // The models face +Z. Steering limits the yaw rate and banks into the turn.
        function steer(animal, heading, depth, speed, turnLimit, dt) {
          const turn = clamp(turnAngle(animal.yaw, heading) * 2.8, -turnLimit, turnLimit);
          const ease = 1 - Math.exp(-3.0 * dt);
          animal.yaw += turn * dt;
          animal.speed = lerp(animal.speed, speed, ease);
          animal.lift = lerp(animal.lift, clamp((depth - animal.position.y) * 1.5, -0.7, 0.7), ease);
          animal.pitch = lerp(animal.pitch, -Math.atan2(animal.lift, Math.max(0.75, speed)) * 0.58, ease);
          animal.bank = lerp(animal.bank, clamp(-turn * 0.21, -0.40, 0.40), ease);
          animal.position.x += Math.sin(animal.yaw) * animal.speed * dt;
          animal.position.z += Math.cos(animal.yaw) * animal.speed * dt;
          animal.position.y += animal.lift * dt;
        }

        function makeFish(count, isReefFish) {
          const batch = new MeshBuilder();
          const back = color(isReefFish ? 0xc1cebe : 0x7f9f9f);
          const body = color(isReefFish ? 0xfff7dd : 0xe3eeec);
          const fin = color(isReefFish ? 0xead9a5 : 0xb8cacc);
          const eye = color(0x1b343f);
          const height = isReefFish ? 1.65 : 1;
          fishBody(batch, [
            [-0.365, 0.008, 0.012, 0], [-0.22, 0.040, 0.054 * height, 0],
            [-0.045, 0.063, 0.077 * height, 0.003], [0.15, 0.055, 0.067 * height, 0.004],
            [0.31, 0.003, 0.017, -0.005]
          ], isReefFish ? 16 : 10, back, body);
          foil(batch, [[0,0.051*height,0.16,-0.212,0.020],[0,0.091*height,0.099,-0.179,0.014],
            [0,0.12*height,-0.025,-0.136,0.007],[0,0.126*height,-0.088,-0.096,0.002]],unitX,back,4);
          for (const side of [-1,1]) {
            foil(batch, [[0,0,-.34,-.46,.01],[0,side*.048*height,-.407,-.494,.007],
              [0,side*.095*height,-.52,-.535,.002]],unitX,fin,4);
            foil(batch, [[side*.039,-.003,.102,.039,.013],[side*.083,-.006,.081,-.016,.011],
              [side*.133,-.023,.025,-.062,.006],[side*.145,-.032,-.024,-.049,.002]],unitY,fin,4);
            batch.shape(eyeGeometry,vec(side*.041,.024*height,.204),vec(.009,.020,.021),fin);
            batch.shape(eyeGeometry,vec(side*.048,.025*height,.207),vec(.006,.013,.014),eye);
          }
          const geometry = batch.geometry();
          const phases = Float32Array.from({ length: count }, (_, index) => index * 2.39996 % TAU);
          geometry.setAttribute("swimPhase", new THREE.InstancedBufferAttribute(phases, 1));
          const material = new THREE.MeshPhongMaterial({
            vertexColors: true, side: THREE.DoubleSide,
            shininess: isReefFish ? 17 : 32,
            specular: isReefFish ? 0x35515b : 0x809eaa
          });
          material.customProgramCacheKey = () => isReefFish ? "reef fish" : "silver fish";
          material.onBeforeCompile = (shader) => {
            shader.uniforms.waterTime = waterTime;
            shader.vertexShader = shader.vertexShader
              .replace("#include <common>", "#include <common>\nattribute float swimPhase;\nuniform float waterTime;\nvarying vec3 vFish;")
              .replace("#include <begin_vertex>", `
                #include <begin_vertex>
                vFish = position;
                float pectoral = smoothstep(0.063, 0.14, abs(position.x));
                transformed.y += pectoral * 0.052 * sin(waterTime * 7.1 + swimPhase + sign(position.x)*1.3);
                transformed.z += pectoral * 0.032 * cos(waterTime * 7.1 + swimPhase + sign(position.x)*1.3);
                float tail = max(0.0, 0.23 - position.z);
                float gait = waterTime * (8.2 + 1.9 * sin(swimPhase)) + swimPhase;
                transformed.x += tail * tail * 0.23 * sin(gait + position.z * 8.8);
              `);
            if (isReefFish) {
              shader.fragmentShader = shader.fragmentShader
                .replace("#include <common>", "#include <common>\nvarying vec3 vFish;")
                .replace("#include <color_fragment>", `
                  #include <color_fragment>
                  float flank = smoothstep(0.027, 0.057, abs(vFish.x));
                  float bars = smoothstep(0.42, 0.81, sin(vFish.z * 30.0 + vFish.y * 6.5)) * flank;
                  float tail = (1.0 - smoothstep(-0.47, -0.34, vFish.z)) * 0.72;
                  float scale = cos(vFish.z*189.0 + 2.4*cos(vFish.y*198.0));
                  diffuseColor.rgb *= 1.0 - 0.43 * bars + 0.085*flank*scale;
                  float stripe = exp(-pow(abs(vFish.y-0.013-0.011*sin(vFish.z*10.0))*94.0,2.0));
                  diffuseColor.rgb += vec3(0.14,0.13,0.07)*stripe*flank;
                  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.84, 0.49, 0.066), tail);
                `);
            }
          };
          if (!isReefFish) surfaceDetail(material, `
            float silvery = (1.-smoothstep(.022,.065,abs(vSkin.y-.004)))*smoothstep(.022,.055,abs(vSkin.x));
            diffuseColor.rgb += vec3(.15,.19,.21)*silvery;
          `);
          const mesh = new THREE.InstancedMesh(geometry, material, count);
          mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          mesh.frustumCulled = false;
          mesh.name = isReefFish ? "Colorful reef fish" : "Silver fish schools";
          wildlife.add(mesh);
          return mesh;
        }

        const schoolSize = 23;
        const silverFish = makeFish(schoolSize * 2, false);
        const schoolSpawns = [[vec(-14.1, -8.47, 3.4), 1.06], [vec(9.2, -7.83, -5.9), -0.73]];
        const schools = schoolSpawns.map(([home, yaw], schoolIndex) => {
          const leader = swimmer(home, yaw);
          leader.speed = 1.45;
          return {
            home, leader, heading: yaw, formationYaw: yaw, alarm: 0, phase: schoolIndex * 2.37,
            members: Array.from({ length: schoolSize }, (_, i) => {
              const phase = (i + schoolIndex * 2.8) * 2.39996;
              const spread = Math.sqrt((i + 0.5) / schoolSize);
              const x = Math.cos(phase) * spread * 2.24;
              const y = Math.sin(phase) * spread * 0.74;
              const z = (driftRandom() - 0.5) * 3.8;
              const index = schoolIndex * schoolSize + i;
              silverFish.setColorAt(index, shade(color(0xe1f2ef), lerp(0.78, 1.13, driftRandom())));
              return {
                index, x, y, z, phase, size: lerp(0.41, 0.68, driftRandom()),
                position: home.clone().add(vec(x * Math.cos(yaw) + z * Math.sin(yaw), y,
                  z * Math.cos(yaw) - x * Math.sin(yaw)))
              };
            })
          };
        });

        function swimSchool(school, time, dt) {
          const leader = school.leader;
          const center = leader.position;
          const dx = center.x - camera.position.x;
          const dz = center.z - camera.position.z;
          const dy = center.y - camera.position.y;
          const horizontal = Math.hypot(dx, dz);
          const nearby = 1 - smoothstep(Math.hypot(horizontal, dy * 1.42), 2.75, 9.1);
          school.alarm = lerp(school.alarm, nearby, 1 - Math.exp(-(nearby > school.alarm ? 7.5 : 2.1) * dt));
          school.heading += dt * (0.23 + 0.46 * Math.sin(time * 0.31 + school.phase)
            + 0.22 * Math.cos(time * 0.137 + school.phase * 2));
          const leash = 0.15 + 0.059 * Math.max(0, center.distanceTo(school.home) - 4.2);
          const awayX = horizontal > 0.05 ? dx / horizontal : Math.cos(leader.yaw);
          const awayZ = horizontal > 0.05 ? dz / horizontal : -Math.sin(leader.yaw);
          const aimX = Math.sin(school.heading) + (school.home.x - center.x) * leash + awayX * 4.0 * school.alarm;
          const aimZ = Math.cos(school.heading) + (school.home.z - center.z) * leash + awayZ * 4.0 * school.alarm;
          const rise = school.home.y + 0.62 * Math.sin(time * 0.36 + school.phase)
            + 0.57 * school.alarm * clamp(dy, -1, 1);
          const altitude = Math.max(rise, ledgeHeight(center.x, center.z) + 1.30);
          steer(leader, Math.atan2(aimX, aimZ), altitude, 1.45 + school.alarm * 1.30,
            1.24 + school.alarm * 2.45, dt);
          school.formationYaw += turnAngle(school.formationYaw, leader.yaw) * (1 - Math.exp(-4.6 * dt));

          const cos = Math.cos(school.formationYaw);
          const sin = Math.sin(school.formationYaw);
          const spread = 1 + school.alarm * 0.19;
          for (const fish of school.members) {
            const lateral = (fish.x + 0.135 * Math.sin(time * 1.76 + fish.phase)) * spread;
            slot.set(center.x + lateral * cos + fish.z * sin,
              center.y + fish.y * spread + 0.13 * Math.sin(time * 1.39 + fish.phase),
              center.z - lateral * sin + fish.z * cos);
            const closeX = fish.position.x - camera.position.x;
            const closeZ = fish.position.z - camera.position.z;
            const distance = Math.hypot(closeX, fish.position.y - camera.position.y, closeZ);
            const dodge = 1 - smoothstep(distance, 0.3, 2.1);
            if (dodge > 0 && distance > 0.01) {
              slot.x += closeX / distance * dodge * 0.72;
              slot.z += closeZ / distance * dodge * 0.72;
            }
            fish.position.lerp(slot, 1 - Math.exp(-(5.2 + Math.cos(fish.phase) * 0.63) * dt));
            transform.position.copy(fish.position);
            transform.rotation.set(leader.pitch + Math.sin(time * 1.69 + fish.phase) * 0.08,
              leader.yaw + 0.13 * Math.sin(time * 2.28 + fish.phase),
              leader.bank + 0.13 * Math.cos(time * 1.2 + fish.phase));
            transform.scale.setScalar(fish.size);
            transform.updateMatrix();
            silverFish.setMatrixAt(fish.index, transform.matrix);
          }
        }

        const rocks = scene.children.filter((object) =>
          object.isInstancedMesh && object.geometry.type === "IcosahedronGeometry");
        const downRay = new THREE.Raycaster(vec(0, 0, 0), vec(0, -1, 0), 0, 30);
        const hits = [];
        function coralHabitat(x, z) {
          const count = 15;
          const step = 0.5;
          const left = x - step * (count - 1) * 0.5;
          const front = z - step * (count - 1) * 0.5;
          const heights = new Float32Array(count * count);
          // Sample the rock surfaces once. Fish use the surrounding samples for clearance.
          for (let row = 0; row < count; row++) {
            const sampleZ = front + row * step;
            for (let col = 0; col < count; col++) {
              const sampleX = left + col * step;
              downRay.ray.origin.set(sampleX, -0.5, sampleZ);
              hits.length = 0;
              downRay.intersectObjects(rocks, false, hits);
              heights[row * count + col] = Math.max(
                seabed(sampleX, sampleZ), hits[0]?.point.y ?? -Infinity);
            }
          }
          return {
            x, z,
            floorAt(px, pz) {
              const col = clamp(Math.floor((px - left) / step), 0, count - 2);
              const row = clamp(Math.floor((pz - front) / step), 0, count - 2);
              const cell = row * count + col;
              return Math.max(heights[cell], heights[cell + 1], heights[cell + count], heights[cell + count + 1]);
            }
          };
        }
        const coralHomes = [[-17.36, -6.98], [-13.7, -7.1], [-8.55, -6.37], [-16.22, 7.69], [14.54, -7.88]]
          .map(([x, z]) => coralHabitat(x, z));
        const reefFish = makeFish(12, true);
        const reefColors = [0xff8760, 0x55cac4, 0xf3c75a, 0xe37ca4, 0x7c94ff].map(color);
        const coralSwimmers = Array.from({ length: reefFish.count }, (_, i) => {
          const habitat = coralHomes[i % coralHomes.length];
          const { x, z } = habitat;
          const phase = i * 2.39996;
          const home = vec(x, habitat.floorAt(x, z) + 0.92 + 0.29 * (i % 3), z);
          const start = home.clone().add(vec(Math.cos(phase), 0, Math.sin(phase)).multiplyScalar(0.53 + i % 3 * 0.24));
          start.y = Math.max(start.y, habitat.floorAt(start.x, start.z) + 0.75);
          reefFish.setColorAt(i, reefColors[i % reefColors.length]);
          return {
            home, habitat, target: home.clone(), animal: swimmer(start, phase), phase,
            scale: lerp(0.50, 0.77, driftRandom()), nextPick: 0
          };
        });

        function swimCoralFish(fish, i, time, dt) {
          const { animal, home, habitat, target, phase } = fish;
          const p = animal.position;
          if (time >= fish.nextPick || Math.hypot(p.x - target.x, p.z - target.z) < 0.4) {
            const bearing = TAU * driftRandom();
            const offset = lerp(0.58, 2.0, driftRandom());
            target.set(home.x + Math.sin(bearing) * offset,
              home.y + 0.72 * (driftRandom() - 0.4), home.z + Math.cos(bearing) * offset);
            fish.nextPick = time + lerp(3.1, 6.8, driftRandom());
          }
          const heading = Math.atan2(target.x - p.x, target.z - p.z);
          const floor = habitat.floorAt(p.x, p.z);
          const ahead = habitat.floorAt(p.x + Math.sin(animal.yaw) * 0.69, p.z + Math.cos(animal.yaw) * 0.69);
          const altitude = Math.max(target.y, floor + 0.62, ahead + 0.62);
          const pace = 0.57 + 0.23 * smoothstep(Math.hypot(target.x - p.x, target.z - p.z), 0.24, 1.3)
            + 0.10 * Math.sin(time * 1.7 + phase);
          const slowdown = 1 - 0.86 * smoothstep(ahead + 0.62 - p.y, 0.22, 1.04);
          const previousX = p.x;
          const previousZ = p.z;
          steer(animal, heading, altitude, pace * slowdown, 2.8, dt);
          if (p.y - habitat.floorAt(p.x, p.z) < 0.35) {
            p.x = previousX;
            p.z = previousZ;
          }
          transform.position.copy(p);
          transform.rotation.set(animal.pitch, animal.yaw, animal.bank);
          transform.scale.set(fish.scale, fish.scale, fish.scale * (0.92 + 0.09 * Math.sin(phase)));
          transform.updateMatrix();
          reefFish.setMatrixAt(i, transform.matrix);
        }

        function mantaWings() {
          // Each station describes the chord and thickness from the body to a wingtip.
          const outline = [
            [0, 0.97, -0.93, 0.18], [0.31, 0.94, -0.87, 0.15], [0.57, 0.84, -0.65, 0.105],
            [0.87, 0.68, -0.48, 0.072], [1.18, 0.47, -0.33, 0.050], [1.50, 0.21, -0.27, 0.035],
            [1.80, -0.08, -0.35, 0.024], [2.09, -0.36, -0.55, 0.015], [2.24, -0.67, -0.685, 0.006]
          ];
          const stations = outline.slice(1).reverse().map(([x, ...section]) => [-x, ...section]).concat(outline);
          const positions = [];
          const colors = [];
          const indices = [];
          const back = color(0x314c5c);
          const shoulder = color(0x9caeaa);
          const belly = color(0xd8d6c5);
          const rim = color(0x526e75);
          const tint = new THREE.Color();
          const cuts = 8;

          for (const top of [true, false]) {
            const start = positions.length / 3;
            for (let i = 0; i < stations.length; i++) {
              const [x, front, rear, thickness] = stations[i];
              for (let j = 0; j <= cuts; j++) {
                const s = j / cuts;
                const z = lerp(front, rear, s);
                const rounded = Math.sin(s * Math.PI) ** 0.72;
                const camber = 0.063 * Math.sin(Math.abs(x) * 1.32) - .048*Math.abs(x)**2/4;
                const y = camber + (top ? 1 : -0.63) * thickness * rounded;
                const edge = smoothstep(Math.abs(x), 1.29, 2.27);
                const paleShoulder = Math.exp(-(((Math.abs(x) - 0.41) / 0.39) ** 2 + ((z - 0.53) / 0.35) ** 2));
                if (top) tint.copy(back).lerp(shoulder, paleShoulder * 0.54);

                if (i === 0 || j === 0) continue;

                const a = d - cuts - 2;
                const b = d - 1;
                const c = d - cuts - 1;
                if (top) indices.push(a, b, d, a, d, c);

        function mantaDetails() {

        function buildManta(name, phase, size) {

              .replace("#include <beginnormal_vertex>", `
                #include <beginnormal_vertex>

                float slopeZ = (mantaBend(position + vec3(0.0, 0.0, 0.025)) - bend) * 40.0;

              .replace("#include <begin_vertex>", "#include <begin_vertex>\ntransformed.y += bend;");

          surfaceDetail(material, `

        function buildTurtle() {
          const batch = new MeshBuilder();
          const shell = color(0x3f5140);

          // Overlapping marginal scutes break up the straight helmet-like seam above the plastron.

            const a=(i+.5)*TAU/32, spread=TAU/32*.48;
            const edge=(theta,r,y)=>vec(.583*Math.cos(theta)*r,y,.839*Math.sin(theta)*r);
            const left=edge(a-spread,1,.014), right=edge(a+spread,1,.014);
            const mid=edge(a,1.025,-.009-.024*Math.max(0,-Math.sin(a)));
            const inner=edge(a,.986,.085);
            const tortoise=shade(scute,.81+.16*Math.sin(i*2.1));
            batch.triangle(left,inner,mid,tortoise);
            batch.triangle(inner,right,mid,shade(tortoise,1.06));
          }
          batch.shape(smallSphere, vec(0, -0.054, 0.013), vec(0.569, 0.112, 0.808), color(0xa8a176));

          const shellBands = [];
          const cells = [[0, -0.72], [0, -0.38], [0, 0], [0, 0.38], [0, 0.72]];
          for (const side of [-1, 1]) {
            for (const z of [-0.65, -0.22, 0.22, 0.62]) cells.push([side * 0.51, z]);
            for (const z of [-0.48, -0.15, 0.17, 0.48]) cells.push([side * 0.91, z]);
          }
          const outline = Array.from({ length: 32 }, (_, i) => vec(
            Math.cos(i / 32 * TAU) * 0.986, 0, Math.sin(i / 32 * TAU) * 0.986));
          const dome = (point) => vec(point.x * 0.583,
            0.025 + 0.358 * Math.sqrt(Math.max(0, 1 - point.x * point.x - point.z * point.z)),
            point.z * 0.838);

          // Clip the shell plates to the shell outline, then project them onto its dome.
          for (const [x, z] of cells) {
            let polygon = outline;
            for (const [otherX, otherZ] of cells) {
              if (otherX === x && otherZ === z) continue;
              const dx = otherX - x;
              const dz = otherZ - z;
              const midX = (x + otherX) * 0.5;
              const midZ = (z + otherZ) * 0.5;
              const clipped = [];
              for (let i = 0; i < polygon.length; i++) {
                const a = polygon[i];
                const b = polygon[(i + 1) % polygon.length];
                const u = (a.x - midX) * dx + (a.z - midZ) * dz;
                const v = (b.x - midX) * dx + (b.z - midZ) * dz;
                if (u <= 0) clipped.push(a);
                if ((u <= 0) !== (v <= 0)) clipped.push(a.clone().lerp(b, u / (u - v)));
              }
              polygon = clipped;
            }
            const center = polygon.reduce((sum, p) => sum.add(p), new THREE.Vector3()).divideScalar(polygon.length);
            const rim = polygon.map((p) => center.clone().lerp(p, 0.971));
            const midway = rim.map((p) => center.clone().lerp(p, 0.49));
            const plate = shade(scute, lerp(0.70, 1.13, driftRandom())).lerp(shell, Math.abs(x) * 0.38);
            for (let i = 0; i < rim.length; i++) {
              const next = (i + 1) % rim.length;
              shellBands.push([batch.positions.length / 3, [0,.49,.49,.49,.49,1,.49,1,1]]);
              batch.triangle(dome(center), dome(midway[next]), dome(midway[i]), shade(plate, 1.10), plate, plate);
              batch.quad(dome(midway[i]), dome(midway[next]), dome(rim[next]), dome(rim[i]), plate);
            }
          }

          batch.shape(smallSphere, vec(0, -0.041, 0.661), vec(0.143, 0.115, 0.236), jaw);
          batch.shape(smallSphere, vec(0, -0.011, 0.862), vec(0.174, 0.139, 0.23), skin,
            new THREE.Euler(0.16, 0, 0));
          batch.shape(smallSphere, vec(0, -0.041, 1.004), vec(0.119, 0.080, 0.111), jaw);
          for (const side of [-1, 1]) {
            batch.shape(facet, vec(side * 0.131, 0.035, 0.941), vec(0.042, 0.037, 0.043), color(0xaa9a65));
            batch.shape(facet, vec(side * 0.157, 0.037, 0.951), vec(0.024, 0.026, 0.030), dark);
            for (const [y, z, size] of [[0.008, 0.784, 0.023], [0.056, 0.820, 0.021],
              [0.074, 0.864, 0.028], [0.021, 0.911, 0.020], [-0.022, 1.032, 0.014]]) {

          batch.tube([vec(0, -0.09, -0.71), vec(0.015, -0.106, -0.858), vec(0.053, -0.109, -1.02)],

          for (const side of [-1,1]) {

              vec(side*.071,-.049,1.075),vec(side*.019,-.054,1.105)],.008,.004,5,dark);
          }
          const turtle = new THREE.Group();
          turtle.name = "Sea turtle";
          const turtleBase = scenery.clone();
          turtleBase.onBeforeCompile = shader => {
            shader.vertexShader = shader.vertexShader.replace("#include <common>",
              "#include <common>\nattribute float plateRadius; varying float vPlate;")
              .replace("#include <begin_vertex>", "#include <begin_vertex>\nvPlate = plateRadius;");
            shader.fragmentShader = shader.fragmentShader.replace("#include <common>",
              "#include <common>\nvarying float vPlate;");

          const turtleSkin = surfaceDetail(turtleBase, `
            float ridge = sin(vPlate*33.0 + 0.54*sin(vSkin.x*30.0+vSkin.z*19.0));

          const shellGeometry = batch.geometry();
          const plateRadius = new Float32Array(shellGeometry.attributes.position.count).fill(-1);
          for (const [start, radii] of shellBands) plateRadius.set(radii, start);
          shellGeometry.setAttribute("plateRadius",new THREE.BufferAttribute(plateRadius,1));
          turtle.add(new THREE.Mesh(shellGeometry, turtleSkin));
          const swimmerSkin = scenery.clone();
          const strokePhase = { value: 0 };
          const strokeEffort = { value: 1 };
          swimmerSkin.onBeforeCompile = (shader) => {
            shader.uniforms.strokePhase = strokePhase;
            shader.uniforms.strokeEffort = strokeEffort;
            shader.vertexShader = shader.vertexShader
              .replace("#include <common>", `
                #include <common>
                uniform float strokePhase;
                uniform float strokeEffort;
                float flipperBend(vec3 p) {
                  float reach = smoothstep(0.16, 0.98, abs(p.x));

              .replace("#include <beginnormal_vertex>", `
                #include <beginnormal_vertex>
                float bend = flipperBend(position);
                float slope = (flipperBend(position + vec3(0.02, 0.0, 0.0)) - bend) * 50.0;
                objectNormal.x -= objectNormal.y * slope;
              `)
              .replace("#include <begin_vertex>", "#include <begin_vertex>\ntransformed.y += bend;");
          };
          const flippers = [];
          for (const side of [-1, 1]) {
            const fin = new MeshBuilder();
            const stations = [[0, 0.14, -0.11, 0.00, 0.052], [0.16, 0.17, -0.15, 0.001, 0.065],
              [0.37, 0.14, -0.22, -0.023, 0.048], [0.61, 0.059, -0.33, -0.054, 0.026],
              [0.81, -0.14, -0.392, -0.086, 0.019], [0.98, -0.339, -0.356, -0.100, 0.006]];
            foil(fin, stations.map(([x, front, rear, y, thickness]) =>
              [side*x,y,front,rear,thickness]),unitY,skin);
            const geometry = fin.geometry();
            const front = new THREE.Mesh(geometry, swimmerSkin);
            front.position.set(side * 0.423, -0.054, 0.396);
            const rear = new THREE.Mesh(geometry, scenery);
            rear.position.set(side * 0.33, -0.071, -0.61);
            rear.scale.set(0.54, 0.74, 0.70);

        function cruiser(body, points, pace, phase) {

          animal.speed = pace;
          return { body, goals, animal, pace, phase, goal: 1, previousGoal: 0 };
        }

        function swimCruiser(cruise, time, dt) {
          const { body, goals, animal, pace, phase } = cruise;
          const p = animal.position;
          let target = goals[cruise.goal];
          if (Math.hypot(target.x - p.x, target.z - p.z) < 2.45) {
            let best = -Infinity;
            for (let i = 0; i < goals.length; i++) {
              if (i === cruise.goal || i === cruise.previousGoal) continue;
              const x = goals[i].x - p.x;
              const z = goals[i].z - p.z;
              const distance = Math.hypot(x, z);
              const forward = (x * Math.sin(animal.yaw) + z * Math.cos(animal.yaw)) / distance;
              const score = forward * 0.91 - distance * 0.027 + driftRandom() * 0.86;
              if (distance <= 4.1 || score <= best) continue;
              best = score;
              target = goals[i];
            }
            if (best > -Infinity) {
              cruise.previousGoal = cruise.goal;
              cruise.goal = goals.indexOf(target);
            }
          }
          const heading = Math.atan2(target.x - p.x, target.z - p.z) + 0.13 * Math.sin(time * 0.34 + phase);
          const altitude = Math.max(ledgeHeight(p.x, p.z) + 1.05,
            target.y + 0.21 * Math.sin(time * 0.53 + phase));

          const reach = (manta ? 2.88 : 1.65)*body.scale.x;
          const drop = (manta ? 1.62 : 1.09)*body.scale.x+.16;
          const aheadY = boneClearance(p.x+Math.sin(heading)*2.3,p.z+Math.cos(heading)*2.3,altitude,reach,drop);
          steer(animal, heading, Math.max(aheadY,boneClearance(p.x,p.z,altitude,reach,drop)), pace * (0.96 + 0.13 * Math.sin(time * 0.21 + phase)), 0.93, dt);
          p.y=boneClearance(p.x,p.z,p.y,reach,drop,0);
          body.position.copy(p);
          body.rotation.set(animal.pitch + 0.046 * Math.sin(time * 1.52 + phase),
            animal.yaw, animal.bank, "YXZ");
        }

        const turtle = buildTurtle();
        const cruisers = [
          cruiser(buildManta("Manta ray 1", 0.43, 1.05), [

        return (time) => {

      }

      buildReefMargins();

      const ship = buildWreck();
      const animation = [buildFish(), buildRay(), buildShark(), buildJellies(), buildOctopus(ship), buildReefLife()];
      animation.push(buildAddedWildlife());

      const spawn = vec(-22, -9, 9);
      const initialLook = vec(-2.1, -9.63, -3.9);
      const tourPath = new THREE.CatmullRomCurve3([
        spawn.clone(), vec(-19, -7.9, -0.3), vec(-15, -6.0, -12), vec(-9, -7.6, -8),
        vec(-3, -9.8, 0.9), vec(7.5, -10.6, 5.6), vec(15.9, -10.0, -1.8), vec(20, -9, -5),
        vec(23.2, -8.65, 5.2), vec(12, -7, 18), vec(-10, -8, 18)
      ], true, "centripetal");
      tourPath.arcLengthDivisions = 600;
      const landmarks = [
        { name: "Kelp forest", x: -22, z: 5, radius: 12 },

        { name: "Whale skeleton", x: 7, z: -2.2, radius: 7.8 },
        { name: "Sunken ship", x: 21, z: -13, radius: 10.3 },
        { name: "Sand clearing", x: 0, z: 3, radius: 13.0 }
      ];
      const keys = new Set();
      const movementKeys = new Set([
        "KeyW", "KeyA", "KeyS", "KeyD", "Space", "KeyC",
        "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"
      ]);

      const velocity = new THREE.Vector3();
      const desired = new THREE.Vector3();
      const forward = new THREE.Vector3();
      const strafe = new THREE.Vector3();
      const tourLook = new THREE.Vector3();
      const lookDirection = new THREE.Vector3();
      const lookFrom = new THREE.Vector2();

      let pitch = 0;

      function setView(target, blend) {
        lookDirection.subVectors(target, camera.position).normalize();
        const targetYaw = Math.atan2(-lookDirection.x, -lookDirection.z);
        const targetPitch = Math.atan2(lookDirection.y, Math.hypot(lookDirection.x, lookDirection.z));
        const turn = THREE.MathUtils.euclideanModulo(targetYaw - yaw + Math.PI, TAU) - Math.PI;

      function stopTour() {

        if (lookId !== null || event.button !== 0) return;
        showTouch(event);
        canvas.focus({ preventScroll: true });
        lookId = event.pointerId;
        lookFrom.set(event.clientX, event.clientY);
        canvas.setPointerCapture(lookId);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (event.pointerId !== lookId) return;
        const x = event.clientX - lookFrom.x;
        const y = event.clientY - lookFrom.y;
        if (x === 0 && y === 0) return;
        stopTour();
        const sensitivity = event.pointerType === "touch" ? 0.0052 : 0.0035;
        yaw -= x * sensitivity;
        pitch = clamp(pitch - y * sensitivity, -1.36, 1.36);
        lookFrom.set(event.clientX, event.clientY);
      });
      function stopLooking(event) {
        if (event.pointerId === lookId) lookId = null;
      }
      canvas.addEventListener("pointerup", stopLooking);
      canvas.addEventListener("pointercancel", stopLooking);
      canvas.addEventListener("lostpointercapture", stopLooking);
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      function moveStick(event) {
        if (event.pointerId !== axisId) return;
        touchAxis.set((event.clientX - stickCenter.x) / 32, (event.clientY - stickCenter.y) / 32);
        touchAxis.clampLength(0, 1);
        stickThumb.style.transform = "translate(" + touchAxis.x * 29 + "px, " + touchAxis.y * 29 + "px)";
      }
      stick.addEventListener("pointerdown", (event) => {
        if (axisId !== null || event.button !== 0) return;
        showTouch(event);
        stopTour();
        const bounds = stick.getBoundingClientRect();
        stickCenter.set(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2);
        axisId = event.pointerId;
        stick.setPointerCapture(axisId);
        moveStick(event);
      });
      stick.addEventListener("pointermove", moveStick);
      function centerStick() {
        axisId = null;
        touchAxis.set(0, 0);
        stickThumb.style.transform = "";
      }
      function releaseStick(event) {
        if (event.pointerId === axisId) centerStick();
      }
      stick.addEventListener("pointerup", releaseStick);
      stick.addEventListener("pointercancel", releaseStick);
      stick.addEventListener("lostpointercapture", releaseStick);

      for (const [id, direction] of [["rise", 1], ["dive", -1]]) {
        const button = document.getElementById(id);
        button.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          stopTour();
          holds.set(event.pointerId, direction);
          button.setPointerCapture(event.pointerId);
        });
        const release = (event) => holds.delete(event.pointerId);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
        button.addEventListener("click", (event) => {
          if (event.detail !== 0) return;
          stopTour();
          camera.position.y += direction * 0.65;
          contain(camera.position);
        });
      }

      function clearInput() {
        keys.clear();
        holds.clear();
        lookId = null;
        centerStick();
        velocity.set(0, 0, 0);
      }
      window.addEventListener("blur", clearInput);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearInput();
      });

      function contain(point) {
        const floor = () => seabed(point.x, point.z) + 0.52;
        point.y = clamp(point.y, floor(), -0.82);
        for (const rock of rockColliders) {
          const rx = rock.rx + 0.22;
          const ry = rock.ry + 0.22;
          const rz = rock.rz + 0.22;
          const dx = (point.x - rock.x) / rx;
          const dy = (point.y - rock.y) / ry;
          const dz = (point.z - rock.z) / rz;
          const normalized = dx * dx + dy * dy + dz * dz;
          if (normalized >= 1) continue;
          if (normalized < 0.000001) {
            point.y = rock.y + ry;
            continue;
          }
          const correction = 1 / Math.sqrt(normalized);
          point.set(rock.x + dx * rx * correction, rock.y + dy * ry * correction, rock.z + dz * rz * correction);
        }
        point.x = clamp(point.x, -33.5, 33.5);
        point.z = clamp(point.z, -26.0, 26.0);
        point.y = clamp(point.y, floor(), -0.82);
      }

      function swim(dt) {
        const back = Number(keys.has("KeyS") || keys.has("ArrowDown"));
        const ahead = Number(keys.has("KeyW") || keys.has("ArrowUp"));
        const left = Number(keys.has("KeyA") || keys.has("ArrowLeft"));
        const right = Number(keys.has("KeyD") || keys.has("ArrowRight"));
        const up = Number(keys.has("Space"));
        const down = Number(keys.has("KeyC"));
        let depthAxis = up - down;
        for (const vertical of holds.values()) depthAxis += vertical;
        forward.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
        strafe.set(Math.cos(yaw), 0, -Math.sin(yaw));
        desired.copy(forward).multiplyScalar(ahead - back - touchAxis.y)
          .addScaledVector(strafe, right - left + touchAxis.x)
          .addScaledVector(unitY, clamp(depthAxis, -1, 1));
        desired.clampLength(0, 1).multiplyScalar(3.8);
        velocity.lerp(desired, 1 - Math.exp(-5.4 * dt));
        camera.position.addScaledVector(velocity, dt);
        contain(camera.position);
      }

      // Each sightline follows a subject for a few seconds, with an eased pan into the next shot.
      const tourSubjects = [
        [0,-15,-9,-3],[.066,-12.9,-10.3,-10.4],[.14,-9.2,-4.7,-9.1],
        [.195,-7,-6.9,-5],[.265,3,-11.65,-2.9],[.36,7.5,-12.2,-3.0],
        [.41,13,-12.45,-2.3],[.47,20.5,-11.6,-12.7],[.53,21.6,-11.25,-13.1],
        [.605,20.4,-10.9,-12.7],[.665,13.4,-7.6,3],[.74,7,-7.6,4],
        [.83,-2,-8,3],[.90,-14,-10.2,6],[.96,-21,-8.2,4],[1,-15,-9,-3]
      ];
      const tourManta = scene.getObjectByName("Manta ray 2");
      const tourTurtle = scene.getObjectByName("Sea turtle");
      const movingFocus = new THREE.Vector3();
      function guide(dt) {
        tourTime = (tourTime + dt) % 120;
        const progress = tourTime / 120;
        tourPath.getPointAt(progress,camera.position);
        let i=1;
        while(tourSubjects[i][0]<progress) i++;
        const a=tourSubjects[i-1], b=tourSubjects[i];
        const blend=THREE.MathUtils.smoothstep(progress,a[0],b[0]);
        tourLook.set(lerp(a[1],b[1],blend),lerp(a[2],b[2],blend),lerp(a[3],b[3],blend));
        const subject = progress<.734 ? tourManta : tourTurtle;
        const start = progress<.734 ? .62 : .734, end = progress<.734 ? .734 : .89;
        if(subject && progress>start && progress<end) {
          subject.getWorldPosition(movingFocus);
          const distance=camera.position.distanceTo(movingFocus);
          const follow=THREE.MathUtils.smoothstep(progress,start,start+.036)
            *(1-THREE.MathUtils.smoothstep(progress,end-.036,end))
            *THREE.MathUtils.smoothstep(distance,2.0,5.5)*(1-THREE.MathUtils.smoothstep(distance,20.,33.));
          tourLook.lerp(movingFocus,follow*.91);
        }
        setView(tourLook,1-Math.exp(-2.2*dt));
      }

      function updateReadout() {
        const reading = (-camera.position.y).toFixed(1);
        if (reading !== lastDepth) {
          depth.textContent = reading;
          lastDepth = reading;
        }
        let closest = "Open water";
        let closestDistance = 1.0;
        for (const region of landmarks) {
          const d = Math.hypot(camera.position.x - region.x, camera.position.z - region.z) / region.radius;
          if (d >= closestDistance) continue;
          closestDistance = d;
          closest = region.name;
        }
        if (closest !== lastRegion) {
          landmark.textContent = closest;
          lastRegion = closest;
        }
      }

      let renderRatio = Math.min(window.devicePixelRatio || 1, coarse ? 1.15 : 1.38);
      let previousFrame = 0;
      let elapsed = 0;
      let sampleTime = 0;
      let slowFrames = 0;
      let contextLost = false;

      function resize() {
        const width = Math.max(1, canvas.clientWidth);
        const height = Math.max(1, canvas.clientHeight);
        if (touchInput) renderRatio = Math.min(renderRatio, 1.15);
        pointScale.value = renderRatio;
        renderer.setPixelRatio(renderRatio);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.fov = camera.aspect < 0.78 ? 71 : 60;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);

      canvas.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        contextLost = true;
        status.hidden = false;
        status.textContent = "Restoring the reef…";
      });
      canvas.addEventListener("webglcontextrestored", () => {
        resize();
        contextLost = false;
        status.hidden = true;
      });

      function frame(now) {
        requestAnimationFrame(frame);
        if (contextLost || document.hidden) {
          previousFrame = now;
          return;
        }
        const milliseconds = previousFrame > 0 ? now - previousFrame : 16.7;
        if (touchInput && previousFrame > 0 && milliseconds < 29.0) return;
        previousFrame = now;
        const rawDelta = milliseconds / 1000;
        const dt = Math.min(rawDelta, 0.075);
        elapsed += dt;
        waterTime.value = elapsed;
        if (onTour) guide(dt);
        else swim(dt);
        camera.rotation.set(pitch, yaw, 0);
        for (const update of animation) update(elapsed);
        updateReadout();
        renderer.render(scene, camera);
        if (elapsed < 2.0 || rawDelta > 0.30) return;
        sampleTime += rawDelta;
        if (rawDelta > (touchInput ? 0.040 : 0.031)) slowFrames += rawDelta;
        if (sampleTime < 2.3) return;
        if (slowFrames / sampleTime > 0.58 && renderRatio > 0.72) {
          renderRatio = Math.max(0.72, renderRatio * 0.86);
          resize();
        }
        sampleTime = 0;
        slowFrames = 0;
      }

      resize();
      resetSwim();
      hud.hidden = false;
      status.hidden = true;
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
