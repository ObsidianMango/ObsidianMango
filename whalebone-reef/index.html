<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#082333">
  <meta name="description" content="Swim through a kelp forest, past a whale skeleton and into the shadow of a sunken ship.">
  <title>Whalebone Reef</title>
  <link id="favicon" rel="icon" type="image/png" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      --text: #eef9f6;
      --accent: #a1efdd;
      --soft: #b9dcd9;
      --edge: #b3e8e044;
      --panel: #041e2ceb;
      --top: max(16px, env(safe-area-inset-top));
      --bottom: max(16px, env(safe-area-inset-bottom));
      --left: max(18px, env(safe-area-inset-left));
      --right: max(18px, env(safe-area-inset-right));
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      margin: 0;
      background: #082333;
      color: var(--text);
    }
    [hidden] { display: none !important; }
    #ocean {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      outline-offset: -3px;
      touch-action: none;
      cursor: grab;
    }
    #ocean:active { cursor: grabbing; }
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .header, .footer {
      position: absolute;
      right: var(--right);
      left: var(--left);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .header { top: var(--top); }
    .footer { bottom: var(--bottom); align-items: flex-end; }
    .scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, #02162683 0, transparent 150px),
        linear-gradient(0deg, #02162697 0, transparent 128px),
        radial-gradient(ellipse at 50% 43%, transparent 38%, #02192527 100%);
    }
    .name h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 670;
      letter-spacing: -.04em;
      line-height: 1.1;
    }
    .name p {
      color: var(--soft);
      font-size: 12px;
      margin: 6px 0 0;
    }
    .depth {
      display: grid;
      gap: 3px;
      justify-items: end;
      min-width: 65px;
      text-shadow: 0 2px 12px #001422;
    }
    .depth span {
      color: var(--soft);
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 650;
      font-size: 9px;
    }
    .depth strong { font-size: 20px; font-weight: 540; font-variant-numeric: tabular-nums; line-height: 1; }
    .depth small { font-size: 11px; color: var(--accent); }
    .readout {
      color: #e1f6f2;
      font-size: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      line-height: 1.65;
      padding-bottom: 7px;
      text-shadow: 0 1px 5px #00131b;
    }
    .readout .keys { white-space: nowrap; }
    kbd {
      display: inline-block;
      padding: 0 5px;
      font: 550 11px/19px Inter, system-ui, sans-serif;
      color: var(--text);
      border: 1px solid var(--edge);
      border-radius: 4px;
      background: #0725359c;
    }
    .actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    button {
      appearance: none;
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid var(--edge);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: 620 12px/1 Inter, system-ui, sans-serif;
      letter-spacing: .01em;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
    }
    button:hover, button[aria-pressed="true"] {
      background: #104552;
      border-color: #a4efe09c;
    }
    button:focus-visible, #ocean:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .tour { color: var(--accent); }
    .tour::before {
      display: inline-block;
      vertical-align: -1px;
      width: 8px;
      height: 10px;
      margin-right: 6px;
      background: currentColor;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      content: "";
    }
    .tour[aria-pressed="true"]::before { clip-path: inset(1px 0); }
    .touch-controls { display: none; }
    .stick {
      position: absolute;
      bottom: var(--bottom);
      left: var(--left);
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      border: 1px solid #a4e2dc70;
      border-radius: 50%;
      background: #062a3c91;
      box-shadow: inset 0 0 0 6px #baf6ee10;
      pointer-events: auto;
      touch-action: none;
    }
    .stick span {
      width: 41px;
      height: 41px;
      border: 1px solid #b0e5df9e;
      border-radius: 50%;
      background: #afe8df45;
      pointer-events: none;
    }
    .depth-buttons {
      position: absolute;
      bottom: calc(var(--bottom) + 54px);
      right: var(--right);
      display: flex;
      gap: 7px;
    }
    .depth-buttons button { min-width: 49px; padding: 0 8px; }
    .depth-buttons button:active { background: #104552; }
    .status {
      position: absolute;
      top: 50%;
      left: 50%;
      width: max-content;
      max-width: calc(100% - 40px);
      transform: translate(-50%, -50%);
      color: var(--text);
      text-align: center;
      font-size: 14px;
      line-height: 1.55;
      padding: 13px 17px;
      background: #041e2ce0;
      border: 1px solid var(--edge);
      border-radius: 10px;
    }
    body.touch .touch-controls { display: block; }
    body.touch .readout { display: none; }
    body.touch .footer { justify-content: flex-end; }
    @media (pointer: coarse) {
      .touch-controls { display: block; }
      .readout { display: none; }
      .footer { justify-content: flex-end; }
    }
    @media (max-height: 420px) {
      .scrim {
        background:
          linear-gradient(180deg, #021626ab, transparent 90px),
          linear-gradient(0deg, #021626a8, transparent 90px);
      }
    }
  </style>
</head>
<body>
  <canvas id="ocean" tabindex="0" aria-label="Whalebone Reef. Use W A S D to swim, drag to look, and press Space or C to change depth."></canvas>
  <div id="hud" class="hud" hidden>
    <div class="scrim"></div>
    <header class="header">
      <div class="name">
        <h1>Whalebone Reef</h1>
        <p id="landmark">Kelp forest</p>
      </div>
      <div class="depth">
        <span>Depth</span>
        <div><strong id="depth">9.0</strong> <small>m</small></div>
      </div>
    </header>
    <div class="touch-controls">
      <div id="stick" class="stick" aria-label="Swim joystick"><span></span></div>
      <div class="depth-buttons">
        <button id="rise" type="button">Rise</button>
        <button id="dive" type="button">Dive</button>
      </div>
    </div>
    <footer class="footer">
      <div class="readout">
        <span class="keys"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> Swim</span>
        <span>Drag to look</span>
        <span class="keys"><kbd>Space</kbd> <kbd>C</kbd> Depth</span>
      </div>
      <div class="actions">
        <button id="tour" class="tour" type="button" aria-pressed="false">Start tour</button>
        <button id="reset" type="button" aria-label="Reset swim position">Reset</button>
      </div>
    </footer>
  </div>
  <div id="status" class="status" role="status" hidden>Entering the reef…</div>
  <noscript><div class="status">Enable JavaScript to swim through the reef.</div></noscript>

  <script>
    // Draw the favicon in code so Pages needs only this file.
    const icon = document.createElement("canvas");
    icon.width = icon.height = 32;
    const ink = icon.getContext("2d");
    ink.fillStyle = "#082333";
    ink.fillRect(0, 0, 32, 32);
    ink.strokeStyle = "#d7cca7";
    ink.lineWidth = 2.8;
    ink.lineCap = "round";
    ink.beginPath();
    ink.moveTo(6, 21);
    ink.bezierCurveTo(6, 8, 21, 7, 24, 21);
    ink.moveTo(11, 24);
    ink.bezierCurveTo(11, 14, 21, 12, 26, 23);
    ink.stroke();
    ink.strokeStyle = "#a1efdd";
    ink.lineWidth = 1.7;
    ink.beginPath();
    ink.moveTo(25, 4);
    ink.lineTo(21, 9);
    ink.stroke();
    document.getElementById("favicon").href = icon.toDataURL("image/png");
  </script>

  <script type="module">
    const status = document.getElementById("status");
    status.hidden = false;

    async function loadThree() {
      try {
        return await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js");
      } catch {
        return import("https://unpkg.com/three@0.170.0/build/three.module.js");
      }
    }

    let THREE;
    try {
      THREE = await loadThree();
    } catch (error) {
      status.textContent = "Three.js could not load. Check your connection and reload.";
      console.error(error);
    }

    if (THREE) {
      try {
        createReef(THREE);
      } catch (error) {
        status.textContent = "The reef could not start. Open the file in a browser with WebGL 2 enabled.";
        console.error(error);
      }
    }

    function createReef(THREE) {
      const canvas = document.getElementById("ocean");
      const hud = document.getElementById("hud");
      const depth = document.getElementById("depth");
      const landmark = document.getElementById("landmark");
      const tourButton = document.getElementById("tour");
      const stick = document.getElementById("stick");
      const stickThumb = stick.firstElementChild;
      const coarse = matchMedia("(pointer: coarse)").matches;

      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: false,
        antialias: !coarse,
        powerPreference: "high-performance"
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x1b5573);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1b5573);
      scene.fog = new THREE.FogExp2(0x1b5573, 0.033);
      const camera = new THREE.PerspectiveCamera(60, 1, 0.09, 106);
      camera.rotation.order = "YXZ";
      const waterTime = { value: 0 };
      const pointScale = { value: 1 };
      const sunOrigin = new THREE.Vector3(-17, 0, -15);
      const TAU = 2 * Math.PI;
      const { clamp, lerp } = THREE.MathUtils;
      const vec = (x, y, z) => new THREE.Vector3(x, y, z);
      const color = (hex) => new THREE.Color(hex);
      const unitX = vec(1, 0, 0);
      const unitY = vec(0, 1, 0);
      const bone = color(0xd7cca7);
      const sand = color(0xc7bba3);
      const rockColliders = [];

      let seed = 1181179148;
      function random() {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      function range(low, high) {
        return lerp(low, high, random());
      }
      function shade(base, strength) {
        return base.clone().multiplyScalar(strength);
      }

      scene.add(new THREE.HemisphereLight(0xd5f4eb, 0x6895a0, 1.79));
      const sun = new THREE.DirectionalLight(0xffedcf, 1.67);
      sun.position.copy(sunOrigin).add(vec(-14, 20, -7));
      scene.add(sun);

      function seabed(x, z) {
        const reef = 1.15 * Math.exp(-((x + 13) ** 2 / 75 + (z + 12) ** 2 / 62));
        const shoulder = 0.8 * Math.exp(-((x + 28) ** 2 / 70 + (z + 15) ** 2 / 190));
        const dunes = Math.sin(x * 0.20 + z * 0.14) * 0.27
          + Math.sin(z * 0.41 - x * 0.16) * 0.16
          + Math.sin(x * 0.43 + z * 0.57) * 0.08;
        return -14 + dunes + reef + shoulder;
      }

      // Merge unique scenery into static geometry. Repeated shapes use instancing below.
      class MeshBuilder {
        constructor() {
          this.positions = [];
          this.colors = [];
        }
        vertex(point, tint) {
          this.positions.push(point.x, point.y, point.z);
          this.colors.push(tint.r, tint.g, tint.b);
        }
        triangle(a, b, c, tintA, tintB = tintA, tintC = tintA) {
          this.vertex(a, tintA);
          this.vertex(b, tintB);
          this.vertex(c, tintC);
        }
        quad(a, b, c, d, tint) {
          this.triangle(a, b, c, tint);
          this.triangle(a, c, d, tint);
        }
        shape(geometry, center, scale, tint, rotation = null) {
          const { position } = geometry.attributes;
          const indices = geometry.index;
          const p = new THREE.Vector3();
          const count = indices ? indices.count : position.count;
          for (let i = 0; i < count; i++) {
            p.fromBufferAttribute(position, indices ? indices.getX(i) : i).multiply(scale);
            if (rotation) p.applyEuler(rotation);
            p.add(center);
            this.vertex(p, tint);
          }
        }
        tube(points, startRadius, endRadius, sides, tint) {
          const tangent = new THREE.Vector3();
          const normal = new THREE.Vector3();
          const binormal = new THREE.Vector3();
          const rows = [];
          for (let i = 0; i < points.length; i++) {
            tangent.subVectors(points[Math.min(i + 1, points.length - 1)], points[Math.max(i - 1, 0)]).normalize();
            if (i === 0) normal.copy(Math.abs(tangent.y) < 0.85 ? unitY : unitX);
            normal.addScaledVector(tangent, -normal.dot(tangent)).normalize();
            binormal.crossVectors(tangent, normal);
            const radius = lerp(startRadius, endRadius, i / (points.length - 1));
            const row = [];
            for (let j = 0; j < sides; j++) {
              const angle = TAU * j / sides;
              row.push(points[i].clone()
                .addScaledVector(normal, radius * Math.cos(angle))
                .addScaledVector(binormal, radius * Math.sin(angle)));
            }
            rows.push(row);
          }
          for (let j = 0; j < sides; j++) {
            const next = (j + 1) % sides;
            this.triangle(points[0], rows[0][next], rows[0][j], tint);
            for (let i = 1; i < rows.length; i++) {
              this.quad(rows[i - 1][j], rows[i - 1][next], rows[i][next], rows[i][j], tint);
            }
            const last = rows[rows.length - 1];
            this.triangle(points[points.length - 1], last[j], last[next], tint);
          }
        }
        geometry(smoothing = 0.92) {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute("position", new THREE.Float32BufferAttribute(this.positions, 3));
          geometry.setAttribute("color", new THREE.Float32BufferAttribute(this.colors, 3));
          geometry.computeVertexNormals();
          if (smoothing) smoothSurface(geometry, smoothing);
          return geometry;
        }
      }

      // Blend normals at shared positions while retaining separate colors on each plate or fin.
      function smoothSurface(geometry, amount) {
        const vertices = geometry.attributes.position;
        const normals = geometry.attributes.normal;
        const groups = new Map();
        const shared = new Array(vertices.count);
        const n = new THREE.Vector3();
        for (let i = 0; i < vertices.count; i++) {
          const key = [vertices.getX(i), vertices.getY(i), vertices.getZ(i)]
            .map(v => Math.round(v * 100000)).join(",");
          if (!groups.has(key)) groups.set(key, new THREE.Vector3());
          shared[i] = groups.get(key);
          shared[i].add(n.fromBufferAttribute(normals, i));
        }
        for (const direction of groups.values()) direction.normalize();
        for (let i = 0; i < normals.count; i++) {
          n.fromBufferAttribute(normals, i);
          if (n.dot(shared[i]) > 0.1) n.lerp(shared[i], amount).normalize();
          normals.setXYZ(i, n.x, n.y, n.z);
        }
      }

      // Apply procedural surface detail in the model's own coordinates, before its swim deformation.
      function surfaceDetail(material, detail) {
        const original = material.onBeforeCompile;
        const key = material.customProgramCacheKey();
        material.customProgramCacheKey = () => key + detail;
        material.onBeforeCompile = function(shader, renderer) {
          original.call(this, shader, renderer);
          shader.vertexShader = shader.vertexShader
            .replace("#include <common>", "#include <common>\nvarying vec3 vSkin;")
            .replace("#include <begin_vertex>", "#include <begin_vertex>\nvSkin = position;");
          shader.fragmentShader = shader.fragmentShader
            .replace("#include <common>", `
              #include <common>
              varying vec3 vSkin;
              float stipple(vec2 p) {
                vec2 cell = floor(p);
                vec2 f = fract(p);
                vec2 jitter = fract(sin(vec2(dot(cell,vec2(17.7,91.2)),dot(cell,vec2(37.1,23.9))))*4375.23);
                return 1.0 - smoothstep(0.055, 0.21, length(f - 0.5 - (jitter - 0.5)*0.44));
              }
            `)
            .replace("#include <color_fragment>", "#include <color_fragment>\n" + detail);
        };
        return material;
      }

      const cube = new THREE.BoxGeometry();
      const smallSphere = new THREE.SphereGeometry(1, 14, 8);
      const eyeGeometry = new THREE.IcosahedronGeometry(1, 0);
      const facet = new THREE.IcosahedronGeometry(1, 1);
      const scenery = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
      const instanceTransform = new THREE.Object3D();

      // Bake the broad sand shadows once. The footprint follows each rock even on the far side of the reef.
      const floorOccluders = [];
      function sandOcclusion() {
        const size = 256;
        const values = new Uint8Array(size * size).fill(255);
        function imprint(x, z, wide, long, angle, opacity) {
          const step = 112 / size;
          const radius = Math.max(wide, long) * 2.5;
          const c = Math.cos(angle), s = Math.sin(angle);
          const fromX = Math.max(0, Math.floor((x - radius + 56) / step));
          const toX = Math.min(size - 1, Math.ceil((x + radius + 56) / step));
          const fromZ = Math.max(0, Math.floor((z - radius + 56) / step));
          const toZ = Math.min(size - 1, Math.ceil((z + radius + 56) / step));
          for (let j = fromZ; j <= toZ; j++) {
            for (let i = fromX; i <= toX; i++) {
              const dx = (i + 0.5) * step - 56 - x, dz = (j + 0.5) * step - 56 - z;
              const u = (c * dx - s * dz) / wide, v = (s * dx + c * dz) / long;
              values[j * size + i] *= 1 - opacity * Math.exp(-1.55 * (u * u + v * v));
            }
          }
        }
        for (const rock of floorOccluders) imprint(...rock);
        imprint(20.7, -13.65, 3.1, 7.0, -0.63, 0.48);
        imprint(7.0, -2.9, 6.8, 1.9, -0.10, 0.39);
        const map = new THREE.DataTexture(values, size, size, THREE.RedFormat);
        map.magFilter = map.minFilter = THREE.LinearFilter;
        map.needsUpdate = true;
        return map;
      }

      function buildReefMargins() {
        const batch = new MeshBuilder();
        // Low broken shelves flank the open-water leg. Gaps reveal a second, more distant ridge.
        const shelves = [[-26,-23,8.5,3.2,2.6],[-6,-29,9,2.8,3.1],[10,-30,6.4,3.5,2.1],
          [32,-16,7,3.5,2.5],[32,5,6.3,3.2,2.0],[17,21,6.1,2.7,1.5],
          [-5,25,7.3,3.1,2.2],[-28,21,5.8,2.7,1.7]];
        for (let j=0;j<shelves.length;j++) {
          const [cx,cz,span,depth,height]=shelves[j];
          for(let slab=0;slab<3;slab++) {
            const x=cx+(slab-1)*span*.64, z=cz+Math.sin(j*2.3+slab)*depth*.50;
            const sx=span*(.48+.09*Math.cos(j+slab)), sz=depth*(.83+.12*Math.sin(2*j+slab));
            floorOccluders.push([x,z,sx,sz,0,.38]);
            const base=seabed(x,z)-.42;
            let previous;
            for (let layer=0;layer<5;layer++) {
              const ring=[];
              const width=[.73,1.07,1,.82,.29][layer];
              const up=[0,.27,.52,.79,1][layer];
              for(let k=0;k<14;k++){
                const a=k*TAU/14;
                const irregular=1+.15*Math.sin(3*a+j*1.6+slab)+.083*Math.cos(5*a+slab);
                ring.push(vec(x+Math.cos(a)*sx*width*irregular,
                  base+height*up*(.92+.14*Math.sin(2*a+slab)+.12*Math.cos(3*a+j))+.10*Math.sin(a)*layer,
                  z+Math.sin(a)*sz*width*irregular));
              }
              if(previous) for(let k=0;k<14;k++){
                const n=(k+1)%14;
                const tint=shade(color([0x485754,0x52625f,0x66726e,0x7d826d,0x87886a][layer]),
                  .90+.12*Math.sin(j+k*.78+slab));
                batch.quad(previous[k],ring[k],ring[n],previous[n],tint);
                if(layer===4) batch.triangle(ring[k],vec(x,base+height*1.03,z),ring[n],tint);
              }
              previous=ring;
            }
          }
        }
        // Short eelgrass and broken shell fragments form patches along the edge of the clearing.
        const beds=[[-18,5],[-14,1],[-12,7],[-4,-12],[1,-8],[9,-9],[14,-6],[21,-6],
          [24,1],[15,14],[9,15],[-4,14],[-13,13],[-21,-8]];
        for(let j=0;j<beds.length;j++) {
          const [cx,cz]=beds[j];
          for(let i=0;i<25;i++) {
            const a=i*2.39996+j*.53;
            const x=cx+Math.cos(a)*Math.sqrt(i/25)*2.6, z=cz+Math.sin(a)*Math.sqrt(i/25)*1.43;
            const y=seabed(x,z)-.025;
            for(let blade=0;blade<3;blade++) {
              const heading=a+blade*2.1, h=.20+.30*(.5+.5*Math.cos(a*3.1+i+blade));
              const drift=vec(Math.cos(heading),0,Math.sin(heading));
              const width=vec(-drift.z,0,drift.x).multiplyScalar(.031);
              const foot=vec(x,y,z), mid=foot.clone().addScaledVector(drift,h*.13);
              mid.y+=h*.59;
              const tip=foot.clone().addScaledVector(drift,h*.61);tip.y+=h;
              const green=color(i%3 ? 0x738656 : 0x897b42);
              batch.quad(foot.clone().sub(width),foot.clone().add(width),mid.clone().add(width),mid.clone().sub(width),shade(green,.68));
              batch.triangle(mid.clone().sub(width),mid.clone().add(width),tip,green,green,shade(green,1.35));
            }
            if (i % 3 === 0) {
              const shell=vec(x+.13,y+.048,z+.14);
              batch.shape(eyeGeometry,shell,vec(.075,.021,.052),color(i%2 ? 0xb7a184 : 0xad9e83),
                new THREE.Euler(0,a,.2*Math.sin(a)));
            }
          }
        }
        const habitat = new THREE.Mesh(batch.geometry(.54),scenery);
        habitat.name = "Reef shelves and eelgrass";
        scene.add(habitat);
      }

      function underwaterLighting() {
        const shaders = new Set();
        scene.traverse(object => {
          if (object.material && (object.material.isMeshLambertMaterial || object.material.isMeshPhongMaterial)) shaders.add(object.material);
        });
        for (const material of shaders) {
          const previous = material.onBeforeCompile;
          const previousKey = material.customProgramCacheKey();
          material.customProgramCacheKey = () => previousKey + "/caustic-v2";
          material.onBeforeCompile = function(shader, renderer) {
            previous.call(this, shader, renderer);
            shader.uniforms.sunClock = waterTime;
            shader.vertexShader = shader.vertexShader
              .replace("#include <common>","#include <common>\nvarying vec3 vReefWorld;")
              .replace("#include <project_vertex>",`
                #include <project_vertex>
                vec4 reefPoint=vec4(transformed,1.0);
                #ifdef USE_INSTANCING
                  reefPoint=instanceMatrix*reefPoint;
                #endif
                vReefWorld=(modelMatrix*reefPoint).xyz;
              `);
            shader.fragmentShader = shader.fragmentShader
              .replace("#include <common>","#include <common>\nvarying vec3 vReefWorld; uniform float sunClock;")
              .replace("#include <opaque_fragment>",`
                vec2 q = vReefWorld.xz * 1.38 + vReefWorld.y * vec2(.29,.18);
                q += .69 * vec2(sin(q.y*.71+sunClock*.34),cos(q.x*.62-sunClock*.28));
                vec2 w = vec2(sin(q.x+sin(q.y*.88-sunClock*.27)), sin(q.y+cos(q.x*.93+sunClock*.23)));
                float difference = abs(abs(w.x)-abs(w.y));
                float band = 1.0-smoothstep(.018,.15+.056*sin(q.x*.24+q.y*.31),difference);
                float mottling = .56+.44*sin(q.y*.18+sin(q.x*.24)+sunClock*.18);
                float up = max(0.,dot(normalize(mat3(viewMatrix)*vec3(-.31,.89,-.29)),normal));
                float resolve = 1.0-smoothstep(.13,.55,max(length(dFdx(q)),length(dFdy(q))));
                outgoingLight *= (0.96 + .065*mottling);
                outgoingLight += diffuseColor.rgb * vec3(.16,.27,.22)*band*mottling*up*resolve;
                #include <opaque_fragment>
              `);
          };
        }
      }

      function buildSeabed() {
        const geometry = new THREE.PlaneGeometry(118, 102, 63, 53);
        geometry.rotateX(-Math.PI / 2);
        const positions = geometry.attributes.position;
        const colors = [];
        const reefTint = color(0x687066);
        const c = new THREE.Color();
        for (let i = 0; i < positions.count; i++) {
          const x = positions.getX(i);
          const z = positions.getZ(i);
          positions.setY(i, seabed(x, z));
          const reefShade = Math.exp(-((x + 13) ** 2 / 95 + (z + 12) ** 2 / 72));
          const shade = 0.91 + 0.075 * Math.sin(x * 0.22 + z * 0.12) * Math.sin(z * 0.26);
          c.copy(sand).lerp(reefTint, reefShade * 0.65).multiplyScalar(shade);
          colors.push(c.r, c.g, c.b);
        }
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();

        const sedimentShade = sandOcclusion();
        const material = new THREE.MeshLambertMaterial({ vertexColors: true });
        material.onBeforeCompile = (shader) => {
          shader.uniforms.waterTime = waterTime;
          shader.uniforms.sedimentShade = {value:sedimentShade};
          shader.vertexShader = shader.vertexShader
            .replace("#include <common>", "#include <common>\nvarying vec2 vSand;")
            .replace("#include <begin_vertex>", "#include <begin_vertex>\nvSand = (modelMatrix * vec4(transformed, 1.0)).xz;");
          shader.fragmentShader = shader.fragmentShader
            .replace("#include <common>", "#include <common>\nvarying vec2 vSand;\nuniform sampler2D sedimentShade;\nuniform float waterTime;")
            .replace("#include <color_fragment>", `
              #include <color_fragment>
              vec2 p = vSand;
              vec2 cell = vec2(sin(p.y*.14+p.x*.09), cos(p.x*.11-p.y*.13));
              p += cell*1.8;
              float phase = p.y * 8.4 + p.x * 2.39 + 2.8 * sin(p.x * 0.37 + p.y * 0.23)
                + 2.1 * sin(p.y * 0.95 - p.x * 0.37) + 1.4 * cos(p.x * 0.73 + p.y * 0.27);
              float detail = 1.0 - smoothstep(0.065, 0.22, max(length(dFdx(p)), length(dFdy(p))));
              float ripple = smoothstep(-0.44, 0.96, sin(phase));
              float patches = 0.43 + 0.31 * sin(p.x * 0.53 + p.y * 0.18) * cos(p.y * 0.54);
              float grains = fract(sin(dot(floor(p * 22.0), vec2(127.1, 19.7))) * 43758.5453);
              vec2 skull = (p - vec2(8.0, -3.0)) * vec2(0.13, 0.42);
              vec2 ship = (p - vec2(21.0, -14.0)) * vec2(0.20, 0.17);
              vec2 kelp = (p - vec2(-22.0, 5.0)) * vec2(0.09, 0.075);
              float contact = 0.26 * exp(-dot(skull, skull)) + 0.35 * exp(-dot(ship, ship))
                + 0.29 * exp(-dot(kelp, kelp));
              vec2 lightPatch = (p - vec2(-7.0, -4.0)) * vec2(0.066, 0.082);
              float causticA = abs(sin(p.x * 1.48 + p.y * 0.62
                + sin(p.y * 1.16 - waterTime * 0.53) * 1.13 + waterTime * 0.22));
              float causticB = abs(sin(p.y * 1.63 - p.x * 0.59
                + cos(p.x * 1.47 + waterTime * 0.35) * 0.85 - waterTime * 0.14));
              float lace = pow(1.0 - min(causticA, causticB), 9.0) * exp(-dot(lightPatch, lightPatch));
              float bed = .5 + .5*sin(p.y*.38 + sin(p.x*.45) + cos(p.y*.21+p.x*.23));
              float shadeMap = texture2D(sedimentShade, vSand/112.0+.5).r;
              vec3 shellSand = mix(vec3(.77,.78,.72),vec3(1.12,1.08,.94),bed);
              diffuseColor.rgb *= shadeMap*shellSand;
              diffuseColor.rgb *= 1.0 - contact*.34 + detail * (patches * 0.31 * (ripple - 0.45)
                + 0.10 * (grains - 0.5)) + 0.09 * lace;
            `);
        };
        scene.add(new THREE.Mesh(geometry, material));
      }

      function buildWaterSurface() {
        const backdrop = new THREE.BufferGeometry();
        backdrop.setAttribute("position",new THREE.Float32BufferAttribute([-1,-1,0,3,-1,0,-1,3,0],3));
        const waterColumn = new THREE.ShaderMaterial({
          depthWrite:false, depthTest:false,
          uniforms:{ unproject:{value:camera.projectionMatrixInverse}, toWorld:{value:camera.matrixWorld},
            blue:{value:color(0x1b5573)}, lit:{value:color(0x398489)}, dark:{value:color(0x133f5b)} },
          vertexShader:`varying vec2 vClip;void main(){vClip=position.xy;gl_Position=vec4(position.xy,.9999,1.);}`,
          fragmentShader:`
            varying vec2 vClip; uniform mat4 unproject;uniform mat4 toWorld;uniform vec3 blue,lit,dark;
            void main(){
              vec3 ray=normalize(mat3(toWorld)*(unproject*vec4(vClip,1.,1.)).xyz);
              float facingSun=smoothstep(-.18,1.,dot(ray,normalize(vec3(-.48,.74,-.42))));
              vec3 tint=mix(blue,lit,smoothstep(-.02,.8,ray.y)*(.23+.54*facingSun));
              tint=mix(tint,dark,.45*smoothstep(.0,.6,-ray.y));
              gl_FragColor=vec4(tint,1.);
              #include <colorspace_fragment>
            }`
        });
        const distanceHaze=new THREE.Mesh(backdrop,waterColumn);
        distanceHaze.name="Open water";distanceHaze.frustumCulled=false;distanceHaze.renderOrder=-500;
        scene.add(distanceHaze);
        const geometry = new THREE.PlaneGeometry(184,184,104,104);
        geometry.rotateX(-Math.PI/2);
        const material = new THREE.ShaderMaterial({
          side: THREE.DoubleSide, uniforms: {waterTime},
          vertexShader: `
            uniform float waterTime;
            varying vec3 oceanPoint;
            void main(){
              vec3 p=position;
              p.y+=.16*sin(dot(p.xz,vec2(.34,.48))-waterTime*.90)
                +.105*sin(dot(p.xz,vec2(.73,-.28))-waterTime*1.16)
                +.055*sin(dot(p.xz,vec2(-.51,1.04))+waterTime*1.35);
              oceanPoint=p;
              gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
            }`,
          fragmentShader: `
            varying vec3 oceanPoint;
            uniform float waterTime;
            void main(){
              vec2 p=oceanPoint.xz;
              vec3 ray=normalize(oceanPoint-cameraPosition);
              float t=waterTime;
              vec2 slope=.16*vec2(.34,.48)*cos(dot(p,vec2(.34,.48))-t*.90)
                +.105*vec2(.73,-.28)*cos(dot(p,vec2(.73,-.28))-t*1.16)
                +.055*vec2(-.51,1.04)*cos(dot(p,vec2(-.51,1.04))+t*1.35);
              vec2 q=p+vec2(.39*sin(p.y*.87+t*.46),.28*sin(p.x*.63-t*.38));
              float pixel=max(length(dFdx(q)),length(dFdy(q)));
              slope+=vec2(.066,.082)*cos(dot(q,vec2(2.4,3.1))-t*2.4);
              slope+=(1.-smoothstep(.035,.24,pixel))*(vec2(.078,-.044)*cos(dot(q,vec2(6.6,-3.7))-t*3.31)
                +vec2(.022,.061)*cos(dot(q,vec2(4.3,11.8))+t*4.41));
              vec3 n=normalize(vec3(slope.x,-1.,slope.y));
              float incidence=clamp(-dot(ray,n),0.,1.);
              vec3 skyRay=refract(ray,n,1.333);
              float transmit=smoothstep(.654,.690,incidence);
              vec3 sunDir=normalize(vec3(-.37,.86,-.34));
              float light=max(0.,dot(skyRay,sunDir));
              vec3 sky=mix(vec3(.37,.64,.66),vec3(.16,.49,.68),clamp(skyRay.y,0.,1.))
                +vec3(.58,.64,.49)*pow(light,21.)+vec3(2.6,2.0,1.1)*pow(light,320.);
              vec3 reflected=reflect(ray,n);
              float chop=.5+.5*sin(q.x*1.2+q.y*.7+2.5*sin(q.y*.59-t*.34));
              vec3 mirror=mix(vec3(.012,.089,.133),vec3(.065,.225,.24),
                clamp(-reflected.y*.63+chop*.20,0.,1.));
              vec3 radiance=mix(mirror,sky,transmit*(1.-.04*pow(1.-incidence,3.)));
              vec3 scatter=vec3(.011,.091,.172);
              vec3 transmission=exp(-length(oceanPoint-cameraPosition)*vec3(.069,.037,.031));
              gl_FragColor=vec4(mix(scatter,radiance,transmission),1.);
              #include <colorspace_fragment>
            }`
        });
        scene.add(new THREE.Mesh(geometry, material));
      }

      function buildShafts() {
        const starts = [];
        const spans = [];
        const widths = [];
        const vertices = [];
        const indices = [];
        for (let i = 0; i < 6; i++) {
          const start = sunOrigin.clone().add(vec((i - 2.5) * 1.9, -0.06, (i % 2) * 2.0));
          const span = vec(5.3 + i * 1.55, -14.0, 4.1 + (i % 3) * 1.05);
          const width = i === 2 ? 2.6 : 0.98 + 0.27 * (i % 3);
          const startIndex = vertices.length / 3;
          for (const [lane, height] of [[-1, 0], [1, 0], [1, 1], [-1, 1]]) {
            vertices.push(lane, height, i * 1.28);
            starts.push(start.x, start.y, start.z);
            spans.push(span.x, span.y, span.z);
            widths.push(width);
          }
          indices.push(startIndex, startIndex + 1, startIndex + 2, startIndex, startIndex + 2, startIndex + 3);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setIndex(indices);
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute("beamStart", new THREE.Float32BufferAttribute(starts, 3));
        geometry.setAttribute("beamSpan", new THREE.Float32BufferAttribute(spans, 3));
        geometry.setAttribute("beamWidth", new THREE.Float32BufferAttribute(widths, 1));
        const material = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          forceSinglePass: true,
          blending: THREE.AdditiveBlending,
          uniforms: { waterTime, rayColor: { value: color(0xc7f5ec) } },
          vertexShader: `
            attribute vec3 beamStart;
            attribute vec3 beamSpan;
            attribute float beamWidth;
            uniform float waterTime;
            varying vec3 vRay;
            varying float vDistance;
            void main() {
              vec3 center = beamStart + beamSpan * position.y;
              vec3 side = normalize(cross(beamSpan, cameraPosition - center) + vec3(0.0001, 0.0, 0.0));
              float shift = sin(waterTime * 0.42 + position.z) * position.y * 0.43;
              vec3 world = center + side * ((0.27 + 0.73 * position.y) * position.x * beamWidth + shift);
              vRay = position;
              vDistance = distance(world, cameraPosition);
              gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
            }
          `,
          fragmentShader: `
            uniform float waterTime;
            uniform vec3 rayColor;
            varying vec3 vRay;
            varying float vDistance;
            void main() {
              float edge = pow(max(0.0, 1.0 - vRay.x * vRay.x), 3.15);
              float fade = smoothstep(0.0, 0.12, vRay.y) * (1.0 - smoothstep(0.38, 1.0, vRay.y));
              float shimmer = 0.81 + 0.19 * sin(waterTime * 0.69 + vRay.z);
              float distanceFade = 1.0 - smoothstep(19.0, 53.0, vDistance);
              gl_FragColor = vec4(rayColor, 0.069 * edge * fade * shimmer * distanceFade);
              #include <colorspace_fragment>
            }
          `
        });
        const shafts = new THREE.Mesh(geometry, material);
        shafts.frustumCulled = false;
        shafts.renderOrder = 4;
        scene.add(shafts);
      }

      function buildParticles() {
        const points = [];
        const phases = [];
        for (let i = 0; i < 460; i++) {
          const nearKelp = i < 80;
          points.push(
            nearKelp ? range(-27, -10) : range(-40, 40),
            range(-13.3, -0.3),
            nearKelp ? range(-9, 12) : range(-31, 31)
          );
          phases.push(random());
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(points, 3));
        geometry.setAttribute("phase", new THREE.Float32BufferAttribute(phases, 1));
        const material = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          uniforms: { waterTime, pointScale, plankton: { value: color(0xa5d8df) } },
          vertexShader: `
            uniform float waterTime;
            uniform float pointScale;
            attribute float phase;
            varying float vFade;
            void main() {
              vec3 p = position;
              p.x = mod(p.x + waterTime * (0.10 + phase * 0.09) + 40.0, 80.0) - 40.0;
              p.y += 0.24 * sin(waterTime * 0.52 + 19.0 * phase);
              p.z += 0.49 * sin(waterTime * 0.26 + 41.0 * phase);
              vec4 view = modelViewMatrix * vec4(p, 1.0);
              float d = -view.z;
              gl_PointSize = clamp((10.0 + 16.0 * phase) / max(1.3, d), 1.15, 4.1) * pointScale;
              vFade = (0.35 + 0.55 * phase) * smoothstep(0.16, 1.6, d)
                * (1.0 - smoothstep(11.0, 39.0, d));
              gl_Position = projectionMatrix * view;
            }
          `,
          fragmentShader: `
            uniform vec3 plankton;
            varying float vFade;
            void main() {
              float radius = length(gl_PointCoord - 0.5) * 2.0;
              float opacity = 0.60 * (1.0 - smoothstep(0.08, 1.0, radius)) * vFade;
              gl_FragColor = vec4(plankton, opacity);
              #include <colorspace_fragment>
            }
          `
        });
        const drift = new THREE.Points(geometry, material);
        drift.frustumCulled = false;
        drift.renderOrder = 5;
        scene.add(drift);
      }


      function buildRocks() {
        const buckets = [[], [], []];
        const base = color(0x536169);
        const varied = new THREE.Color();
        const addRock = (x, z, sx, sy, sz) => {
          const y = seabed(x, z) + sy * 0.17;
          const tint = varied.copy(base).lerp(color(0x69736a), random() * 0.72).multiplyScalar(range(0.58, 1.21));
          const variation = Math.floor(random() * 2);
          buckets[sx > 2 ? 0 : 1 + variation].push({
            center: vec(x, y, z),
            scale: vec(sx, sy, sz),
            rotation: new THREE.Euler(range(-0.2, 0.2), range(0, TAU), range(-0.2, 0.2)),
            tint: tint.clone()
          });
          if(sx > .24) floorOccluders.push([x+sx*.12,z+sz*.11,sx*1.23,sz*1.23,0,.40]);
          if (sy > 0.62) {
            rockColliders.push({ x, y, z, rx: Math.min(sx, sz) * 0.88, ry: sy * 0.89, rz: Math.min(sx, sz) * 0.88 });
          }
        };

        const outcrops = [
          [-18, -14, 3.3, 3.7, 2.9], [-13, -15.4, 3.9, 3.5, 3.6],
          [-9.1, -12.5, 2.9, 2.7, 3.9], [-13.6, -10.2, 2.7, 2.8, 2.65],
          [-17.5, -8.4, 2.65, 2.4, 2.0], [-8.9, -6.8, 3.0, 1.8, 2.45],
          [-22, -17.5, 3.4, 3.0, 5.0], [-25.1, -13.4, 2.8, 4.1, 3.5],
          [-28.5, -7.5, 3.0, 4.8, 6.1], [-29.5, 2.1, 2.5, 2.3, 4.2],
          [-27.8, 12.7, 3.25, 2.0, 3.3], [-17.2, 8.4, 1.15, 0.85, 1.5],
          [-26.1, 5.9, 2.0, 1.18, 1.6], [29, -19.7, 4.1, 2.23, 3.4],
          [26.2, -22, 3.8, 1.86, 2.6], [27.5, 14.9, 3.2, 1.65, 2.35]
        ];
        for (const rock of outcrops) addRock(...rock);
        for (let i = 0; i < 45; i++) {
          const angle = range(0, TAU);
          const radius = range(3.1, 9.0);
          const size = range(0.38, 1.67);
          addRock(-14 + Math.cos(angle) * radius, -11.6 + Math.sin(angle) * radius,
            size, size * range(0.35, 0.87), size * range(0.62, 1.2));
        }
        for (let i = 0; i < 100; i++) {
          const x = range(-43, 43);
          const z = range(-36, 38);
          if ((x / 10.5) ** 2 + ((z - 3) / 8.2) ** 2 < 1.0) continue;
          const size = range(0.13, 0.92);
          addRock(x, z, size, size * range(0.33, 0.75), size * range(0.7, 1.6));
        }

        for (let i = 0; i < buckets.length; i++) {
          const geometry = new THREE.IcosahedronGeometry(1, i === 0 ? 3 : 1);
          const position = geometry.attributes.position;
          const colors = [];
          for (let j = 0; j < position.count; j++) {
            const x = position.getX(j);
            const y = position.getY(j);
            const z = position.getZ(j);
            const weight = 1 + 0.17 * Math.sin(x * 8.2 + y * 5.7 + i * 2.1) * Math.cos(z * 6.8 - y * 2.3);
            const shelf = Math.sin(y * 12 + x * 4 + i) * 0.05;
            position.setXYZ(j, x * weight + y * 0.10, clamp(y * weight, -0.79, 0.88) + shelf, z * weight);
            const tone = 0.69 + 0.22 * y + 0.20 * Math.sin(y * 15 + x * 3.7 + z * 2.9) ** 2;
            colors.push(tone * 0.93, tone, tone * 1.03);
          }
          geometry.computeVertexNormals();
          smoothSurface(geometry, 0.74);
          geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
          const material = new THREE.MeshLambertMaterial({ vertexColors: true });
          material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader
              .replace("#include <common>", "#include <common>\nvarying vec3 vStone;")
              .replace("#include <begin_vertex>",
                "#include <begin_vertex>\nvStone = (instanceMatrix * vec4(transformed, 1.0)).xyz;");
            shader.fragmentShader = shader.fragmentShader
              .replace("#include <common>", "#include <common>\nvarying vec3 vStone;")
              .replace("#include <color_fragment>", `
                #include <color_fragment>
                float seam = sin(vStone.y * 7.7 + vStone.x * 1.14 + vStone.z * 0.79
                  + sin(vStone.x * 2.8 + vStone.z * 1.5) * 0.63);
                float erosion = sin(vStone.x * 9.8 + vStone.y * 15.4) * sin(vStone.z * 11.1 - vStone.y * 5.3);
                diffuseColor.rgb *= 0.91 + 0.17 * smoothstep(0.25, 0.93, seam) + 0.10 * erosion;
                float crust = sin(vStone.x*3.2+sin(vStone.z*4.3))*cos(vStone.y*3.9+sin(vStone.x*2.5));
                float ring = smoothstep(.54,.72,crust);
                diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.21,.142,.146),ring*.55);
              `);
          };
          const stones = new THREE.InstancedMesh(geometry, material, buckets[i].length);
          for (let j = 0; j < buckets[i].length; j++) {
            const { center, scale, rotation, tint } = buckets[i][j];
            instanceTransform.position.copy(center);
            instanceTransform.scale.copy(scale);
            instanceTransform.rotation.copy(rotation);
            instanceTransform.updateMatrix();
            stones.setMatrixAt(j, instanceTransform.matrix);
            stones.setColorAt(j, tint);
          }
          scene.add(stones);
        }
      }

      function ledgeHeight(x, z) {
        let y = seabed(x, z);
        for (const rock of rockColliders) {
          const horizontal = ((x - rock.x) / rock.rx) ** 2 + ((z - rock.z) / rock.rz) ** 2;
          if (horizontal < 1) y = Math.max(y, rock.y + rock.ry * Math.sqrt(1 - horizontal) * 0.89);
        }
        return y;
      }

      function buildKelp() {
        const positions = [];
        const colors = [];
        const sways = [];
        const indices = [];
        const rootTint = color(0x4d4f2e);
        const bladeTint = color(0x79783d);
        const lightTint = color(0xacac68);
        const tint = new THREE.Color();

        function vertex(point, flex, phase, along, across, paint) {
          const index = positions.length / 3;
          positions.push(point.x, point.y, point.z);
          sways.push(flex, phase, along, across);
          colors.push(paint.r, paint.g, paint.b);
          return index;
        }

        function plant(x, z, height, fullness, sweepX = 0, sweepZ = 0) {
          const baseY = seabed(x, z) - 0.05;
          const phase = range(0, TAU);
          const drift = range(0.55, 1.25);
          const stemAt = (h) => vec(
            x + h*h*sweepX + h * drift * Math.sin(phase + h * 3.9),
            baseY + height * h,
            z + h*h*sweepZ + h * drift * Math.cos(phase * 1.6 + h * 3.7)
          );
          const sides = 5;
          const stemStart = positions.length / 3;
          for (let row = 0; row <= 16; row++) {
            const h = row / 16;
            const center = stemAt(h);
            const radius = lerp(0.078, 0.032, h);
            tint.copy(rootTint).lerp(bladeTint, h * 0.8);
            for (let col = 0; col < sides; col++) {
              const angle = TAU * col / sides;
              const point = center.clone().add(vec(radius * Math.cos(angle), 0, radius * Math.sin(angle)));
              const current = vertex(point, h, phase, 0, 0, tint);
              if (row === 0) continue;
              const previousRow = current - sides;
              const next = stemStart + row * sides + (col + 1) % sides;
              indices.push(previousRow, current, next, previousRow, next, next - sides);
            }
          }

          // Air bladders sit at the base of each blade.
          let azimuth = phase;
          for (let leaf = 0; leaf < fullness; leaf++) {
            const h = lerp(0.18, 0.98, leaf / (fullness - 1)) + range(-0.018, 0.018);
            const base = stemAt(h);
            azimuth += 2.4 + range(-0.30, 0.30);
            const outward = vec(Math.cos(azimuth), 0, Math.sin(azimuth));
            const lateral = vec(-outward.z, 0, outward.x);
            const length = range(1.26, 2.59) * (1.23 - 0.39 * h);
            const width = range(0.105, 0.224) * (1.17 - 0.24 * h);
            const twist = range(-.88, .88);
            const upwards = range(0.34, 0.85);
            const segments = fullness >= 17 ? 13 : 8;
            const leafTint = bladeTint.clone().lerp(lightTint, range(0.0, 0.56)).multiplyScalar(range(0.81, 1.22));
            if (leaf % (fullness >= 17 ? 3 : 5) === 0) {
              const bulbStart = positions.length / 3;
              for(let r=0;r<=3;r++){
                const t=r/3, rad=.049*Math.sin(t*Math.PI);
                for(let k=0;k<5;k++){
                  const a=k*TAU/5;
                  const bulb=base.clone().addScaledVector(outward,.045+.15*t)
                    .addScaledVector(lateral,rad*Math.cos(a));
                  bulb.y+=.015+.12*t+rad*Math.sin(a);
                  vertex(bulb,h,phase,0,0,lightTint);
                  if(r>0){
                    const a0=bulbStart+(r-1)*5+k,b0=bulbStart+(r-1)*5+(k+1)%5;
                    indices.push(a0,b0,a0+5,b0,b0+5,a0+5);
                  }
                }
              }
            }
            for (let row = 0; row <= segments; row++) {
              const t = row / segments;
              const center = base.clone().addScaledVector(outward, length * t);
              center.y += length * (upwards * t - 0.67 * t * t + 0.07 * Math.sin(t * TAU));
              center.addScaledVector(lateral, Math.sin(t * 3.2) * t * 0.30);
              const a = twist * t + Math.sin(t * 4.9 + phase) * 0.22;
              const radius = width * Math.max(0.015, Math.sin(Math.PI * (t * 0.91 + 0.09)) ** 0.72);
              for (let col = 0; col < 3; col++) {
                const edge = col - 1;
                const ruffle = 1 + 0.095 * Math.sin(t * 14 + edge * 1.1 + phase);
                const point = center.clone().addScaledVector(lateral, edge * radius * Math.cos(a) * ruffle);
                point.y += edge * radius * Math.sin(a) * ruffle + Math.abs(edge) * radius * 0.18 * Math.sin(t * 15 + phase) + (col === 1 ? radius * 0.23 : 0);
                tint.copy(rootTint).lerp(leafTint, clamp(0.26 + t * 1.25, 0, 1));
                tint.multiplyScalar(col === 1 ? 1.09 : 0.91);
                tint.lerp(lightTint, t * t * 0.19);
                const current = vertex(point, h, phase, t, edge, tint);
                if (row > 0 && col > 0) {
                  indices.push(current - 4, current - 3, current, current - 4, current, current - 1);
                }
              }
            }
          }
        }

        const near = [
          [-24.5, 8.1, 10.3], [-20.2, 9.3, 9.8], [-23.8, 4.4, 11.3],
          [-17.8, 5.3, 8.8], [-26.1, 2.8, 9.4], [-23.0, 12.2, 7.6],
          [-21.6, -0.8, 10.7], [-18.2, -4.8, 10.3], [-30.0, -6.0, 10.8]
        ];
        for (const placement of near) plant(...placement, 17);
        for (let i = 0; i < 62; i++) {
          const x = range(-34, -13);
          const z = range(-11, 18);
          const lane = -22 + clamp((9 - z) / 21, 0, 1) * 7;
          const forwardGap = z > 1 && x > -21 && z < 9 - (x + 22) * 0.49 + 2.4;
          if (Math.abs(x - lane) < 2.2 || forwardGap || ledgeHeight(x, z) - seabed(x, z) > 0.4) continue;
          plant(x, z, range(5.8, 11.6), 13);
        }
        for (const [x, z] of [[-5, -17], [-4, -16], [-6, -19.5], [27, -22], [29, -8], [24, -21], [31, -10]]) {
          plant(x, z, range(4, 7), 10);
        }

        const savedSeed = seed;
        for (const [index,[x,z,height]] of near.entries()) {
          if(index>=4 && index%2===0) plant(x+.09,z-.07,height*.72,9,2.3*Math.cos(index),1.9*Math.sin(index+.7));
          const baseY=seabed(x,z);
          // Short fingerlike holdfasts branch from the stipe and curl down into the substrate.
          for(let finger=0;finger<7;finger++){
            const a=finger*2.39996+index;
            const start=positions.length/3;
            for(let j=0;j<5;j++){
              const t=j/4, radius=.047*(1-.91*t), turn=a+t*t*.48;
              const length=.56*t*(.77+.22*Math.cos(finger));
              const h=baseY+.18*(1-t)+.10*Math.sin(t*Math.PI)-.033*t;
              for(let k=0;k<4;k++){
                const v=k*TAU/4;
                vertex(vec(x+Math.cos(turn)*length-Math.sin(turn)*radius*Math.cos(v),
                  h+radius*Math.sin(v),z+Math.sin(turn)*length+Math.cos(turn)*radius*Math.cos(v)),
                  0,0,0,0,rootTint);
                if(j){const l=start+(j-1)*4+k,n=start+(j-1)*4+(k+1)%4;
                  indices.push(l,n,n+4,l,n+4,l+4);}
              }
            }
          }
        }
        seed = savedSeed;
        const geometry = new THREE.BufferGeometry();
        geometry.setIndex(indices);
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setAttribute("sway", new THREE.Float32BufferAttribute(sways, 4));
        geometry.computeVertexNormals();
        geometry.computeBoundingSphere();
        geometry.boundingSphere.radius += 1.6;
        const material = new THREE.MeshLambertMaterial({
          vertexColors: true,
          side: THREE.DoubleSide,
          emissive: 0x705b27,
          emissiveIntensity: 0.22
        });
        material.onBeforeCompile = (shader) => {
          shader.uniforms.waterTime = waterTime;
          shader.vertexShader = shader.vertexShader
            .replace("#include <common>", "#include <common>\nattribute vec4 sway;\nuniform float waterTime;\nvarying vec2 vBlade;")
            .replace("#include <begin_vertex>", `
              #include <begin_vertex>
              vBlade = sway.zw;
              float bend = sway.x * sway.x;
              float current = sin(waterTime * 0.65 + sway.y + sway.x * 3.2);
              transformed.x += bend * (0.35 + 0.78 * current);
              transformed.z += bend * 0.66 * sin(waterTime * 0.53 + sway.y * 0.87 - sway.x * 2.8);
              transformed.y += sway.z * sway.z * 0.19 * sin(waterTime * 1.9 + sway.y + position.x * 0.86);
            `);
          shader.fragmentShader = shader.fragmentShader
            .replace("#include <common>", "#include <common>\nvarying vec2 vBlade;")
            .replace("#include <color_fragment>", `
              #include <color_fragment>
              float vein = (1.0 - smoothstep(0.0, 0.15, abs(vBlade.y)))
                * smoothstep(0.04, 0.25, vBlade.x) * (1.0 - smoothstep(0.74, 1.0, vBlade.x));
              float grain = sin(vBlade.x*4.5 + abs(vBlade.y)*30.0 + sin(vBlade.x*13.0));
              float membrane = smoothstep(.18,.92,abs(vBlade.y))*smoothstep(.03,.22,vBlade.x);
              diffuseColor.rgb = mix(diffuseColor.rgb,diffuseColor.rgb*vec3(1.26,1.13,.8),membrane);
              diffuseColor.rgb *= 1.0 + 0.25 * vein + 0.048 * grain;
            `);
        };
        // Share the vertex buffers but cull groups of nearby stipes independently on the tour.
        // A margin on each group's sphere includes the full displacement from the current.
        const tiles = new Map(), point = new THREE.Vector3();
        for (let i=0;i<indices.length;i+=3) {
          const id=indices[i]*3;
          const key=Math.floor(positions[id]/12)+","+Math.floor(positions[id+2]/12);
          if (!tiles.has(key)) tiles.set(key,{faces:[],bounds:new THREE.Box3()});
          const tile=tiles.get(key);
          for (let j=i;j<i+3;j++){
            tile.faces.push(indices[j]);
            tile.bounds.expandByPoint(point.fromBufferAttribute(geometry.attributes.position,indices[j]));
          }
        }
        for (const {faces,bounds} of tiles.values()) {
          const section = new THREE.BufferGeometry();
          for(const [key,value] of Object.entries(geometry.attributes)) section.setAttribute(key,value);
          section.setIndex(faces);
          section.boundingSphere=bounds.getBoundingSphere(new THREE.Sphere());
          section.boundingSphere.radius+=1.6;
          scene.add(new THREE.Mesh(section,material));
        }
      }

      function buildCoral() {
        const batch = new MeshBuilder();
        const palette = [0xce6974, 0xe08958, 0xab6da4, 0xd9a257, 0x829d74].map(color);
        const placements = [
          [-17.9, -7.6], [-15.7, -8.7], [-12.4, -9.5], [-10.2, -6.5], [-9.2, -8.1],
          [-8.5, -11.7], [-11.3, -13.7], [-16.5, -12.2], [-18.1, -15.0],
          [-18.6, -9.9], [-13.6, -6.1], [-8.2, -5.2], [-19.0, -4.0],
          [-16.9, 8.5], [-17.8, 8.0], [-19.4, 6.1], [14.3, -8.9], [15.4, -8.4],
          [24.1, -10.6], [3.5, -5.0], [27.5, -17.6]
        ];

        for (let i = 0; i < placements.length; i++) {
          const [x, z] = placements[i];
          const base = vec(x, ledgeHeight(x, z) - 0.13, z);
          const season = range(0, TAU);
          const size = range(0.48, 1.11);
          const tint = palette[i % palette.length];
          const spread = vec(Math.cos(season), 0, Math.sin(season));
          const normal = vec(-spread.z, 0, spread.x);
          const top = base.clone().add(vec(0, size * 0.89, 0));
          batch.tube([base, base.clone().lerp(top, 0.51).addScaledVector(spread, -size * 0.10), top],
            0.063 * size, 0.017, 5, tint);

          for (let j = 0; j < 7; j++) {
            const spacing = j / 6 * 2 - 1;
            const start = base.clone().lerp(top, range(0.17, 0.29));
            const branch = start.clone().addScaledVector(spread, spacing * size * 0.33);
            branch.y += size * range(0.30, 0.48);
            const end = top.clone().addScaledVector(spread, spacing * size * range(0.43, 0.67))
              .addScaledVector(normal, range(-0.16, 0.16));
            end.y += size * range(-0.12, 0.20) - Math.abs(spacing) * size * 0.14;
            batch.tube([start, branch, end], 0.036 * size, 0.012 * size, 4, shade(tint, range(0.88, 1.18)));
            for (let k = 0; k < 2; k++) {
              const fork = branch.clone().lerp(end, 0.15 + k * 0.28);
              const tip = end.clone().addScaledVector(spread, (k ? 1 : -1) * size * 0.13);
              tip.y += size * range(0.07, 0.24);
              batch.tube([fork, fork.clone().lerp(tip, 0.61).addScaledVector(normal, 0.05), tip],
                0.019 * size, 0.006, 3, shade(tint, range(1.08, 1.31)));
            }
          }

          for (let j = 0; j < 3; j++) {
            const cx = x + range(-0.79, 0.79);
            const cz = z + range(-0.79, 0.79);
            const floor = ledgeHeight(cx, cz) - 0.06;
            const length = range(0.19, 0.49);
            const radius = length * range(0.22, 0.43);
            const cup = shade(palette[(i + 1) % palette.length], range(0.66, 1.03));
            let previous;
            const lean = Math.cos(i + j * 2) * length * .30;
            const layers = [[0,.56],[.28,.80],[.78,.92],[1,1.10],[.97,.77],[.68,.51]];
            for (let row=0;row<layers.length;row++) {
              const [h, width]=layers[row];
              const ring=Array.from({length:9},(_,k)=>{
                const a=k*TAU/9, r=radius*width*(1+.08*Math.sin(a*3+i));
                return vec(cx+h*h*lean+r*Math.cos(a),floor+length*h*(1+.056*Math.sin(a*2+j)),cz+r*Math.sin(a));
              });
              for(let k=0;k<9;k++){
                const n=(k+1)%9;
                if(previous) batch.quad(previous[k],ring[k],ring[n],previous[n],
                  shade(cup,[.6,.82,.96,1.15,1.30,.50][row]));
                if(row===5) batch.triangle(ring[k],vec(cx+lean*.4,floor+length*.62,cz),ring[n],shade(cup,.25));
              }
              previous=ring;
            }
          }
        }
        const coralSurface=surfaceDetail(scenery.clone(),`
          float polyps = stipple(vec2(vSkin.x*39.0+vSkin.z*27.0,vSkin.y*45.0));
          diffuseColor.rgb *= 0.89+0.31*polyps;
        `);
        scene.add(new THREE.Mesh(batch.geometry(), coralSurface));
      }

      function buildWhale() {
        const batch = new MeshBuilder();
        const origin = vec(8, seabed(8, -3), -3);
        const bearing = -0.10;
        const cos = Math.cos(bearing);
        const sin = Math.sin(bearing);
        const ivory = color(0xc7b78e);
        const oldBone = color(0xa99770);
        const exposed = color(0xd6c8a2);

        // Survey the sand at every contact point, including the scattered end of the tail.
        function ground(x, z) {
          return seabed(origin.x + cos * x + sin * z, origin.z - sin * x + cos * z) - origin.y;
        }
        function point(x, h, z) {
          return vec(x, ground(x,z) + h, z);
        }

        // Elliptical sections let broad shoulder blades, thin rib shafts and thick joints
        // share a mesh while retaining their individual cross sections.
        function loft(points, upRadii, acrossRadii, reference, tint, sides = 8) {
          let previous;
          const tangent = vec(0,0,0);
          const up = reference.clone();
          for (let i = 0; i < points.length; i++) {
            tangent.subVectors(points[Math.min(i+1,points.length-1)],points[Math.max(i-1,0)]).normalize();
            up.addScaledVector(tangent,-up.dot(tangent)).normalize();
            const across = vec(0,0,0).crossVectors(tangent,up);
            const ring = [];
            for (let k = 0; k < sides; k++) {
              const angle = TAU * k / sides;
              const ridge = 1 + 0.065*Math.sin(3*angle+0.27*i) + 0.025*Math.cos(5*angle);
              ring.push(points[i].clone()
                .addScaledVector(up, upRadii[i]*Math.cos(angle)*ridge)
                .addScaledVector(across, acrossRadii[i]*Math.sin(angle)*ridge));
            }
            for (let k = 0; k < sides; k++) {
              const next = (k+1)%sides;
              if (previous) batch.quad(previous[k],previous[next],ring[next],ring[k],tint);
              else batch.triangle(points[i],ring[next],ring[k],shade(tint,0.88));
              if (i === points.length-1) batch.triangle(points[i],ring[k],ring[next],tint);
            }
            previous = ring;
          }
        }
        function contour(stations, tint, reference = unitY, sides = 9) {
          loft(stations.map(([x,h,z]) => point(x,h,z)),
            stations.map(s => s[3]),stations.map(s => s[4]),reference,tint,sides);
        }

        // The cranium is narrow below the occipital crest. Open arches sit outboard
        // of the braincase so that the sand and water show through the orbital spaces.
        contour([[-5.49,0.78,-0.06,0.18,0.21],[-5.22,1.00,-0.04,0.30,0.38],
          [-4.86,1.13,-0.04,0.44,0.55],[-4.49,1.22,-0.01,0.62,0.58],
          [-4.16,1.32,0,0.54,0.56],[-3.86,1.37,0.02,0.25,0.40]],oldBone,unitY,12);
        for (const side of [-1,1]) {
          const flank = side === 1 ? 0.07 : -0.07;
          // Maxillae, premaxillary ridges and a recessed trough down the rostrum.
          contour([[-4.52,1.40,side*.40,.34,.32],[-5.04,1.31,side*.64,.19,.43],
            [-5.49,1.05,side*.64,.16,.36],[-6.01,.76,side*.52,.13,.32],
            [-6.57,.55,side*.42,.10,.25],[-7.12,.37,side*.31,.083,.20],
            [-7.63,.23,side*.19,.065,.13],[-7.94,.15,side*.105,.031,.055]],ivory);
          contour([[-4.31,1.62,side*.22,.19,.13],[-4.86,1.58,side*.27,.17,.14],
            [-5.36,1.24,side*.25,.14,.115],[-6.00,.86,side*.20,.10,.11],
            [-6.70,.56,side*.14,.070,.08],[-7.48,.27,side*.089,.035,.050]],exposed);
          // The broad frontal process overhangs a slender, low zygomatic arch.
          contour([[-4.37,1.45,side*.39,.19,.21],[-4.51,1.48,side*.72,.15,.23],
            [-4.75,1.43,side*.98,.13,.21],[-5.05,1.34,side*1.13,.12,.16],
            [-5.30,1.12,side*1.12,.11,.12],[-5.47,.99,side*.87,.09,.12]],ivory);
          contour([[-4.24,1.00,side*.42,.18,.17],[-4.42,.91,side*.74,.14,.135],
            [-4.64,.84,side*.97,.075,.095],[-4.91,.85,side*1.05,.068,.083],
            [-5.16,.87,side*1.07,.071,.082],[-5.41,.99,side*.90,.080,.094]],oldBone);
          // Both dentaries have dropped to the sediment and tilted away from the snout.
          contour([[-4.21,.55+flank,side*.84,.29,.21],[-4.47,.36+flank,side*1.05,.28,.19],
            [-4.98,.17,side*1.22,.19,.20],[-5.65,.13,side*1.24,.15,.16],
            [-6.32,.11,side*1.12,.13,.14],[-6.96,.10,side*.89,.103,.12],
            [-7.55,.076,side*.58,.085,.096],[-8.03,.061,side*.25,.049,.061]],ivory);
        }

        const bend = x => 0.10*Math.sin(0.73*x) + 0.68*THREE.MathUtils.smoothstep(x,0.7,6.9);
        function spine(x) {
          const crest = 1.45 + 0.31*Math.exp(-((x+1.59)**2)/2.7);
          return lerp(crest, 0.103, THREE.MathUtils.smoothstep(x,-0.85,3.75));
        }
        const positions = [-3.86,-3.47,-3.05,-2.60,-2.15,-1.66,-1.17,-0.66,-0.13,
          0.39,0.94,1.51,2.09,2.69,3.29,3.85,4.39,4.90,5.38,5.84,6.32,6.83,7.30];
        positions.forEach((x,i) => {
          const tail = THREE.MathUtils.smoothstep(x,0.4,7.3);
          const wear = Math.sin(i*12.7);
          const z = bend(x) + (i>16 ? .15*Math.sin(i*1.7) : 0);
          const width = lerp(.30,.102,tail)*(1+.06*wear);
          const y = i>=14 ? Math.max(spine(x),width*.49) : spine(x);
          const center = point(x,y,z);
          const direction = vec(1,(ground(x+.13,z)+spine(x+.13)-ground(x-.13,z)-spine(x-.13))/.26,
            (bend(x+.13)-bend(x-.13))/.26 + .38*tail*Math.sin(2.4*i)).normalize();
          const half = i<16 ? Math.min(.31,(positions[i+1]-x)*.50) : lerp(.245,.14,tail);
          const offsets = [-1,-.84,-.27,.42,.86,1];
          const radius = [0.82,1.05,.88,.92,1.04,.86].map(v=>v*width);
          const tint = shade(ivory,.87+0.09*wear);
          loft(offsets.map(f=>center.clone().addScaledVector(direction,half*f)),
            radius.map(r=>r*.83),radius,unitY,tint,9);
          if (i>=20) return;
          const rear = center.clone().addScaledVector(direction,half*.38);
          const mid = rear.clone().add(vec(.05,width*.87,-.10));
          const tip = mid.clone().add(vec(.10+.07*(1-tail),width*(.67+.48*(1-tail)),-.12-.05*wear));
          loft([rear,mid,tip], [width*.49,width*.59,width*.23],
            [width*.54,width*.30,width*.13],unitX,shade(tint,.93),7);
          for(const side of [-1,1]) {
            const length = width*(1.25-.35*tail);
            const root = center.clone().add(vec(-.045,0,side*width*.60));
            const tip = root.clone().add(vec(.04,width*.26,side*length));
            loft([root,root.clone().lerp(tip,.66),tip],[width*.44,width*.26,width*.15],
              [width*.43,width*.37,width*.24],unitY,tint,6);
          }
        });

        // The rib cage leans towards its collapsed flank. Several ribs detached
        // on that side and lie in the sediment rather than hanging above it.
        for (let i=0; i<10; i++) {
          const x=positions[i+1], z=bend(x);
          const width=1.06+.79*Math.sin((i+1)*.286);
          const tint=shade(ivory,.83+.12*Math.sin(1.9*i));
          for (const side of [-1,1]) {
            const down = side===-1 && (i===2 || i===4 || i===5 || i===8);
            const snapped = side===1 && i===6;
            const p=[], wide=[], thin=[];
            for(let j=0;j<=12;j++) {
              const t=j/12, u=snapped ? t*.58 : t;
              const fan=.32+i*.068;
              const lateral=down ? .46+width*(.22+1.06*u) :
                .15+width*(Math.sin(u*(side===1?2.30:2.02)) + .16*u);
              const rx=x+fan*u*u+(down ? (.18+.63*u)*Math.sin(i*1.78) : -.12*Math.sin(u*Math.PI))+.055*Math.sin(u*4+i)*u;
              const rz=z+side*lateral;
              const h=down ? .073+.12*Math.sin(Math.PI*u) :
                lerp(spine(x)-.07, -.026+.035*Math.cos(i),1-Math.cos(u*Math.PI*.5))
                +.075*Math.sin(2*Math.PI*u+i)*u;
              p.push(point(rx,h,rz));
              const root=.115+.035*(1-i/10);
              wide.push(lerp(root,.044,u)*(1+.24*Math.sin(Math.PI*u)));
              thin.push(lerp(root*.76,.030,u));
            }
            loft(p,wide,thin,unitX,tint,7);
          }
        }
        // Scapula resting outside the cage, a flat fan with a raised diagonal spine.
        contour([[-2.40,.14,2.30,.10,.12],[-2.69,.16,2.46,.10,.27],
          [-3.03,.185,2.64,.095,.48],[-3.42,.13,2.83,.066,.57],
          [-3.67,.070,2.94,.037,.37]],oldBone);
        contour([[-2.45,.20,2.30,.071,.080],[-2.84,.27,2.52,.075,.065],
          [-3.30,.23,2.79,.057,.050],[-3.60,.138,2.95,.030,.029]],ivory);

        const finish = surfaceDetail(scenery.clone(), `
          float staining = sin(vSkin.x*2.7+vSkin.z*1.6)*sin(vSkin.z*3.5+vSkin.y*3.1);
          float olive = (1.0-smoothstep(-0.20,0.91,vSkin.y))*(0.33+0.30*staining);
          float pits = stipple(vec2(vSkin.x*18.0+vSkin.z*13.0,vSkin.y*25.0+vSkin.z*4.8));
          diffuseColor.rgb *= mix(vec3(1.0),vec3(0.46,0.49,0.30),olive)*(1.0-0.18*pits);
        `);
        const whale=new THREE.Mesh(batch.geometry(.85),finish);
        whale.position.copy(origin);
        whale.rotation.y=bearing;
        whale.name="Whale skeleton";
        scene.add(whale);
      }

      // Each strip covers complete bone triangles in world coordinates, including the bowed ribs
      // and scattered fragments. A ray starts climbing before its leading wing enters a strip.
      function surveySkeleton(skeleton) {
        skeleton.updateWorldMatrix(true,false);
        const geom = skeleton.geometry, pos = geom.attributes.position;
        const interval = .75;
        const strips = new Map();
        const tri = [vec(0,0,0),vec(0,0,0),vec(0,0,0)];
        const count = geom.index ? geom.index.count : pos.count;
        for(let i=0;i<count;i+=3) {
          for(let k=0;k<3;k++) tri[k].fromBufferAttribute(pos,geom.index ? geom.index.getX(i+k) : i+k).applyMatrix4(skeleton.matrixWorld);
          const [a,b,c] = tri;
          const left=Math.floor(Math.min(a.x,b.x,c.x)/interval),right=Math.floor(Math.max(a.x,b.x,c.x)/interval);
          const near=Math.min(a.z,b.z,c.z),far=Math.max(a.z,b.z,c.z),top=Math.max(a.y,b.y,c.y);
          for(let j=left;j<=right;j++) {
            if(!strips.has(j)) strips.set(j,{left:j*interval,right:(j+1)*interval,near,far,top});
            const strip=strips.get(j);
            strip.near=Math.min(strip.near,near);strip.far=Math.max(strip.far,far);strip.top=Math.max(strip.top,top);
          }
        }
        const zones=Array.from(strips.values());
        return (x,z,rest,reach,drop,feather = 3.8) => {
          let height=rest;
          for(const zone of zones) {
            const dx=Math.max(zone.left-x,0,x-zone.right),dz=Math.max(zone.near-z,0,z-zone.far);
            const distance=Math.hypot(dx,dz);
            const weight=feather ? 1-THREE.MathUtils.smoothstep(distance,reach,reach+feather) : Number(distance<=reach);
            height=Math.max(height,lerp(rest,zone.top+drop,weight));
          }
          return height;
        };
      }

      function buildWreck() {
        const batch = new MeshBuilder();
        const timber = color(0x93684b), pitch = color(0x454a40), bronze = color(0x567568);
        const worn = color(0xaf8766), iron = color(0x705b46), inner = color(0x594f42);
        const profile = [[-7.5,.44],[-6.85,1.46],[-4.8,2.18],[-1.7,2.31],[1.1,2.24],[3.7,1.83],[5.7,1.09],[7.7,.07]];
        const rim = z => 2.17+.78*(z/7.7)**4+z*.027;
        function beam(z) {
          let k=1;
          while (k<profile.length-1 && z>profile[k][0]) k++;
          const [z0,w0]=profile[k-1], [z1,w1]=profile[k];
          return lerp(w0,w1,clamp((z-z0)/(z1-z0),0,1));
        }
        function hull(z,t,side,inset=0) {
          const w=beam(z)*(.095+.905*Math.sin(t*1.51)**.82);
          return vec(side*Math.max(.015,w-inset),lerp(-.66,rim(z),t),z);
        }
        const deckHeight = (x,z) => rim(z)-.27+.068*(1-Math.min(1,(x/beam(z))**2));
        function box(x,y,z,w,h,d,tint) {
          batch.shape(cube,vec(x,y,z),vec(w,h,d),tint);
        }
        function beamBetween(a,b,w,h,tint) {
          const length=a.distanceTo(b);
          const q=new THREE.Quaternion().setFromUnitVectors(vec(0,0,1),b.clone().sub(a).normalize());
          batch.shape(cube,a.clone().lerp(b,.5),vec(w,h,length),tint,new THREE.Euler().setFromQuaternion(q));
        }

        // Continuous inner lining under the plank seams; short missing runs expose a few frames.
        const steps=30, lines=11;
        const zAt=k=>lerp(-7.5,7.7,k/steps);
        function breach(side,k,j) {
          return side<0 ? k>=17 && k<=20 && j>=7+Math.min(3,Math.abs(k-19))
                        : k>=4 && k<=7 && j>=8+Math.abs(k-6);
        }
        for(const side of [-1,1]) {
          for(let j=0;j<lines;j++) for(let k=0;k<steps;k++) {
            if(breach(side,k,j)) continue;
            const brokenFore=breach(side,k+1,j), brokenAft=breach(side,k-1,j);
            const z0=zAt(k), z1=zAt(k+1), t0=j/lines, t1=(j+1)/lines;
            const split=.17+.15*Math.sin(j*2.17);
            const a=hull(z0,t0,side), b=hull(z0+(brokenAft?split:0),t1,side);
            const c=hull(z1-(brokenFore?split:0),t1,side), d=hull(z1,t0,side);
            const seam=.012, thickness=.115;
            const lip=[a,b,c,d].map(p=>p.clone().add(vec(-side*thickness,0,0)));
            const board=Math.floor((k+(j*3)%6)/6);
            const tint=shade(j===9?bronze:j===1?pitch:timber,
              (.87+.12*Math.sin(board*41+j*18))*lerp(.74,1.1,t1));
            const topB=b.clone(), topC=c.clone();
            topB.y-=seam;topC.y-=seam;
            batch.quad(a,topB,topC,d,tint);
            batch.quad(topB,lip[1],lip[2],topC,shade(tint,.71));
            batch.quad(lip[0],lip[3],lip[2],lip[1],inner);
            if(brokenFore || k===steps-1) batch.quad(d,topC,lip[2],lip[3],worn);
            if(brokenAft || k===0) batch.quad(a,lip[0],lip[1],topB,worn);
          }
          for(let k=0;k<=15;k++) {
            const z=-7.33+k*.98;
            const points=Array.from({length:7},(_,i)=>hull(z,i/6*.98,side,.14));
            batch.tube(points,.117,.09,5,shade(inner,.86));
          }
          for(let k=0;k<steps;k++) {
            if(breach(side,k,lines-1)) continue;
            const z0=zAt(k),z1=zAt(k+1),a=hull(z0,1,side),b=hull(z1,1,side);
            beamBetween(a,b,.18,.13,worn);
            if(k%3===0 && k>1 && k<steps-2) {
              const bollard=a.clone().add(vec(-side*.125,.24,0));
              beamBetween(a,bollard,.125,.13,pitch);
            }
          }
        }
        // A solid transom and stem close the ends and give the bow a visible backbone.
        for(const end of [-7.5,7.7]) for(let j=0;j<lines;j++){
          const a=j/lines,b=(j+1)/lines;
          batch.quad(hull(end,a,-1),hull(end,b,-1),hull(end,b,1),hull(end,a,1),
            shade(timber,.72+.15*(j%3)));
        }
        const keel=[vec(0,-.56,-7.43),vec(0,-.59,-2.9),vec(0,-.60,3.5),vec(0,-.18,6.15),vec(0,.73,7.18),vec(0,rim(7.7)+.13,7.71)];
        for(let k=1;k<keel.length;k++)beamBetween(keel[k-1],keel[k],.20,.23,pitch);
        // Fore-and-aft deck planks follow the sheer and camber around a framed cargo hatch.
        for(let s=-10;s<=10;s++) {
          for(let k=0;k<24;k++){
            const z0=lerp(-7.43,7.65,k/24), z1=lerp(-7.43,7.65,(k+1)/24);
            const mid=(z1+z0)*.5;
            if(Math.abs(s)<=3 && mid>-.25 && mid<1.95) continue;
            const w0=beam(z0)*.94,w1=beam(z1)*.94;
            const point=(edge,z) => vec(edge,deckHeight(edge,z),z);
            const edges=z=>[clamp(s*.209-.101,-z,z),clamp(s*.209+.101,-z,z)];
            const [l0,r0]=edges(w0),[l1,r1]=edges(w1);
            if(r0===l0 && r1===l1)continue;
            const tint=shade(worn,.67+.18*Math.sin(s*6.58+Math.floor((k+s%3)/7)*3.7));
            batch.quad(point(l0,z0),point(l1,z1),point(r1,z1),point(r0,z0),tint);
          }
        }
        const hatchY=deckHeight(0,.8);
        box(0,hatchY-.52,.80,1.67,.12,2.66,color(0x393d33));
        for(const side of [-1,1]){
          box(side*.77,hatchY-.18,.8,.13,.52,2.56,inner);
          box(side*.77,hatchY+.045,.8,.16,.14,2.64,worn);
        }
        for(const z of [-.47,2.09])box(0,hatchY+.035,z,1.56,.14,.12,worn);
        for(const z of [-.22,.24,.70,1.16])box(.08,hatchY-.12,z,1.46,.13,.09,pitch);

        // Weatherboarded pilothouse, shaded open windows, broken roof slats, and helm.
        const cabinWood=color(0x718172), roof=color(0x515a50);
        for(const side of [-1,1]){
          for(let j=0;j<4;j++)box(side*1.25,2.16+j*.15,-3.72,.13,.145,3.23,shade(cabinWood,.78+j*.06));
          box(side*1.25,2.73,-3.72,.17,.105,3.26,worn);
          box(side*1.25,3.64,-3.72,.15,.15,3.26,cabinWood);
          for(const z of [-5.29,-4.20,-3.17,-2.16])box(side*1.25,3.17,z,.135,.93,.13,cabinWood);
        }
        for(let j=0;j<4;j++)box(0,2.16+j*.15,-2.13,2.6,.145,.15,shade(cabinWood,.78+j*.06));
        for(const x of [-1.22,-.42,.42,1.22])box(x,3.18,-2.13,.12,.93,.14,cabinWood);
        box(0,3.64,-2.13,2.63,.14,.18,cabinWood);
        box(0,2.91,-5.31,2.59,1.42,.15,shade(cabinWood,.61));
        for(let j=0;j<12;j++) {
          if(j===1 || j===2) continue;
          box(-1.43+j*.26,3.78,-3.70,.26,.14,j===3?2.74:3.55,shade(roof,.88+.09*(j%3)));
        }
        const wheel=vec(.31,3.03,-2.63), spokes=[];
        for(let j=0;j<=12;j++)spokes.push(wheel.clone().add(vec(.28*Math.cos(j*TAU/12),.28*Math.sin(j*TAU/12),0)));
        batch.tube(spokes,.033,.033,5,iron);
        for(let j=0;j<6;j++)batch.tube([wheel,wheel.clone().add(vec(.35*Math.cos(j*TAU/6),.35*Math.sin(j*TAU/6),0))],.032,.025,5,worn);
        beamBetween(vec(.30,2.11,-2.81),wheel,.11,.11,inner);

        const mast=[vec(.37,1.98,-.92),vec(.67,4.28,-1.13),vec(1.17,6.73,-1.91)];
        batch.tube(mast,.185,.071,8,shade(worn,.83));
        beamBetween(vec(-.85,5.25,-1.71),vec(2.46,5.52,-1.68),.105,.10,pitch);
        for(const side of [-1,1]) {
          const anchor=hull(side<0?-.8:-4.65,.98,side,.09);
          const sag=mast[2].clone().lerp(anchor,.53).add(vec(0,-.34,.09));
          batch.tube([mast[2],sag,anchor],.023,.023,4,pitch);
        }
        batch.tube([mast[2],vec(.39,4.12,1.41),vec(.04,deckHeight(0,6)+.25,6)],.024,.022,4,pitch);
        // Windlass with two drum ends, and a coil whose turns rest on the foredeck.
        const wz=4.97, wy=deckHeight(0,wz);
        for(const side of [-1,1]){
          box(side*.53,wy+.20,wz,.16,.40,.32,inner);
          batch.tube([vec(side*.37,wy+.37,wz),vec(side*.52,wy+.37,wz)],.22,.22,9,iron);
        }
        batch.tube([vec(-.65,wy+.37,wz),vec(.65,wy+.37,wz)],.10,.10,9,bronze);
        const coil=[];
        for(let j=0;j<=42;j++){
          const t=j/42,a=t*TAU*3.1;
          const x=.61+(.095+.20*t)*Math.cos(a),z=4.15+(.12+.24*t)*Math.sin(a);
          coil.push(vec(x,deckHeight(x,z)+.024,z));
        }
        batch.tube(coil,.022,.022,4,shade(worn,.84));
        const calcite=color(0xb4ac84);
        for(const side of [-1,1]) for(let patch=0;patch<10;patch++){
          const cz=-6.3+patch*1.34+.27*Math.sin(patch*8+side);
          const band=.24+.32*(.5+.5*Math.cos(patch*12.4));
          for(let j=0;j<7;j++){
            const z=cz+.22*Math.sin(j*6.9+patch),t=band+.05*Math.cos(j*4.9);
            const root=hull(z,t,side,-.015),r=.043+.025*(.5+.5*Math.sin(j*4.4));
            batch.tube([root,root.clone().add(vec(side*r*.70,r*.17,0))],r,r*.49,5,shade(calcite,.74+.24*(j%3)/2));
          }
        }
        for(let i=0;i<10;i++) {
          const z=2.12+i*.49, x=-2.45+.45*Math.sin(i*3.7);
          beamBetween(vec(x,-.30,z),vec(x+.34*Math.sin(i),-.17,z+.71+.28*Math.cos(i)),.16,.095,shade(timber,.78));
        }
        const wood=surfaceDetail(scenery.clone(),`
          float warp=0.22*sin(vSkin.z*2.5)+0.13*sin(vSkin.z*7.1+vSkin.y*8.0);
          float grain=sin(vSkin.x*91.0+vSkin.y*98.0+warp*4.0);
          float fray=sin(vSkin.z*3.2+vSkin.x*6.7)*sin(vSkin.y*7.9+vSkin.x*3.1);
          float stain = .5+.5*sin(vSkin.z*1.4+sin(vSkin.x*2.5)+.8*sin(vSkin.y*4.8));
          float patina=(1.0-smoothstep(.20,2.73,vSkin.y))*(.44+.42*fray)+.36*stain;
          diffuseColor.rgb *= .98+.045*grain+.087*fray;
          diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.063,.086,.060),patina*.62);
        `);
        const ship = new THREE.Group();
        ship.name="Sunken ship";
        ship.position.set(21,seabed(21,-14)+.43,-14);
        ship.quaternion.setFromAxisAngle(unitY,-.63).multiply(new THREE.Quaternion().setFromAxisAngle(vec(0,0,1),-.21));
        ship.userData.deckHeight=deckHeight;
        ship.add(new THREE.Mesh(batch.geometry(0),wood));
        scene.add(ship);
        return ship;
      }

      function fishBody(batch, sections, sides, upper, lower) {
        const profile = new THREE.CatmullRomCurve3(sections.map(([z,w,h]) => vec(z,w,h)), false, "catmullrom", 0.42);
        const length = (sections.length - 1) * 2;
        let previous;
        for (let j = 0; j <= length; j++) {
          const sample = profile.getPoint(j / length);
          const offset = lerp(sections[Math.floor(j / 2)][3], sections[Math.ceil(j / 2)][3], j % 2 * 0.5);
          const ring = [];
          for (let i = 0; i < sides; i++) {
            const a = TAU * i / sides;
            ring.push(vec(sample.y * Math.cos(a), offset + sample.z * Math.sin(a), sample.x));
          }
          if (previous) {
            for (let i = 0; i < sides; i++) {
              const k = (i + 1) % sides;
              const paint = angle => lower.clone().lerp(upper, THREE.MathUtils.smoothstep(Math.sin(angle), -0.62, 0.68));
              const c = paint(i * TAU / sides), d = paint(k * TAU / sides);
