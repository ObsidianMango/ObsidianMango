<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d110e">
<title>🥭 MangoWarz</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#989898;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#111}.boot b{font-size:18px}</style>
</head>
<body><div class="boot"><b>🥭 MangoWarz</b></div>
<script>
(async()=>{
  const SOURCE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/5fd274ae29c5abb11a1a1105acccac9dc3c65721/mangowarz.html';
  try{
    let h=await (await fetch(SOURCE,{cache:'no-store'})).text();
    h=h.replaceAll('${item.name}','\\${item.name}')
       .replaceAll('${money(item.currentPrice)}','\\${money(item.currentPrice)}')
       .replaceAll('${item.quantity}','\\${item.quantity}')
       .replaceAll('${item.totalSold}','\\${item.totalSold}');

    const marker="  h=h.replace('</style>',css+'\\n</style>');";
    if(!h.includes(marker)) throw new Error('MangoWarz patch marker missing');

    const injected=[
      "  const glyphs=['🌿','❄️','💉','🌟','🍄','💊','⚗️','🧪'];",
      "  const makeRun=(n,o)=>Array.from({length:n},(_,i)=>'<span class=\\\"runner\\\">'+glyphs[(i+o)%glyphs.length]+'</span>').join('');",
      "  const perimeterHtml='<div class=\\\"screen-marquee\\\" aria-hidden=\\\"true\\\"><div class=\\\"marquee-track top\\\"><div class=\\\"marquee-flow horizontal\\\">'+makeRun(40,0)+'</div></div><div class=\\\"marquee-track right\\\"><div class=\\\"marquee-flow vertical\\\">'+makeRun(32,2)+'</div></div><div class=\\\"marquee-track bottom\\\"><div class=\\\"marquee-flow horizontal\\\">'+makeRun(40,4)+'</div></div><div class=\\\"marquee-track left\\\"><div class=\\\"marquee-flow vertical\\\">'+makeRun(32,6)+'</div></div></div>';",
      "  const puzzleNeedle='<div id=\\\"loaderPuzzle\\\" class=\\\"loader-puzzle\\\">';",
      "  if(!h.includes(puzzleNeedle)) throw new Error('Loader puzzle missing');",
      "  h=h.replace(puzzleNeedle,perimeterHtml+puzzleNeedle);",
      "  const perimeterCss=\".screen-marquee{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}.screen-marquee:before{content:'';position:absolute;inset:5px;border:2px dotted rgba(35,35,35,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}.marquee-track{position:absolute;overflow:hidden;pointer-events:none}.marquee-track.top,.marquee-track.bottom{left:7px;right:7px;height:24px}.marquee-track.left,.marquee-track.right{top:7px;bottom:7px;width:24px}.marquee-track.top{top:2px}.marquee-track.bottom{bottom:2px}.marquee-track.left{left:2px}.marquee-track.right{right:2px}.marquee-flow{display:flex;width:max-content;height:max-content;gap:13px;align-items:center}.marquee-flow.vertical{flex-direction:column;gap:12px}.runner{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center;font-size:15px;line-height:1}.marquee-track.top .marquee-flow{animation:borderRunX 8s linear infinite}.marquee-track.bottom .marquee-flow{animation:borderRunXReverse 8.8s linear infinite}.marquee-track.right .marquee-flow{animation:borderRunY 7.9s linear infinite}.marquee-track.left .marquee-flow{animation:borderRunYReverse 8.6s linear infinite}@keyframes borderRunX{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes borderRunXReverse{from{transform:translateX(-50%)}to{transform:translateX(0)}}@keyframes borderRunY{from{transform:translateY(0)}to{transform:translateY(-50%)}}@keyframes borderRunYReverse{from{transform:translateY(-50%)}to{transform:translateY(0)}}.loader-puzzle{inset:27px 25px!important}@media(max-height:700px) and (max-width:699px){.screen-marquee:before{inset:3px}.marquee-track.top,.marquee-track.bottom{left:4px;right:4px;height:19px}.marquee-track.left,.marquee-track.right{top:4px;bottom:4px;width:19px}.marquee-track.top{top:0}.marquee-track.bottom{bottom:0}.marquee-track.left{left:0}.marquee-track.right{right:0}.marquee-flow{gap:9px}.marquee-flow.vertical{gap:8px}.runner{width:15px;height:15px;font-size:12px}.loader-puzzle{inset:21px 19px!important}}\";",
      "  h=h.replace('</style>',perimeterCss+'\\n</style>');",
      "  const loadOpen=\"window.addEventListener('load', () => {\";",
      "  const loadClose=\"      paintPuzzle();\\n    });\\n\\n    function startGame()\";",
      "  if(!h.includes(loadOpen)||!h.includes(loadClose)) throw new Error('Loader lifecycle markers missing');",
      "  h=h.replace(loadOpen,\"const __startMangoLoader = () => {\");",
      "  h=h.replace(loadClose,\"      paintPuzzle();\\n    };\\n    if (document.readyState === 'complete') __startMangoLoader(); else window.addEventListener('load', __startMangoLoader, {once:true});\\n\\n    function startGame()\");"
    ].join('\n');

    h=h.replace(marker,marker+'\n'+injected);
    document.open();document.write(h);document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:24px;color:white;background:#111;height:100vh;font-family:system-ui"><h2>MangoWarz failed to boot</h2><p>Reload the page.</p></div>';
    console.error(err);
  }
})();
</script></body></html>
