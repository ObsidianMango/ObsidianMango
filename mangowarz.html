<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d110e">
  <title>🥭 MangoWarz</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#989898;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .boot{position:fixed;inset:0;display:grid;place-items:center;color:#111}
    .boot b{font-size:18px}
  </style>
</head>
<body>
  <div class="boot"><b>🥭 MangoWarz</b></div>
  <script>
  (async()=>{
    const BASE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/52ee58a7e527e80c501a1fbfaea6c38d67b0009b/mangowarz.html';
    try {
      let h=await (await fetch(BASE,{cache:'no-store'})).text();

      h=h.replace('.market-name{font-size:.70rem}.price{font-size:.68rem}.market-meta{grid-column:1/-1;margin:1px 0 0;gap:10px;font-size:.56rem}',
                  '.market-name{font-size:.82rem}.price{font-size:.70rem}.market-meta{grid-column:1/-1;margin:2px 0 0;gap:10px;font-size:.66rem;font-weight:750}');

      h=h.replace('.market-name{font-size:.62rem}.price{font-size:.60rem}.market-meta{font-size:.50rem}',
                  '.market-name{font-size:.72rem}.price{font-size:.61rem}.market-meta{font-size:.59rem;font-weight:750}');

      h=h.replace('.market-name{font-size:.76rem}.price{font-size:.74rem}.market-meta{font-size:.60rem}',
                  '.market-name{font-size:.88rem}.price{font-size:.76rem}.market-meta{font-size:.70rem;font-weight:750}');

      document.open();
      document.write(h);
      document.close();
    } catch(err) {
      document.body.innerHTML='<div style="padding:24px;color:white;background:#111;height:100vh;font-family:system-ui"><h2>MangoWarz failed to boot</h2><p>Reload the page.</p></div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
