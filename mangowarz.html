<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d110e">
  <title>🥭 MangoWarz</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#989898;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#111}.boot b{font-size:18px}</style>
</head>
<body>
  <div class="boot"><b>🥭 MangoWarz</b></div>
  <script>
  (async()=>{
    const BASE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/52ee58a7e527e80c501a1fbfaea6c38d67b0009b/mangowarz.html';
    try {
      let h=await (await fetch(BASE,{cache:'no-store'})).text();
      const marker="      h=h.replace('</style>',css+'\\n</style>');";
      const extra=[
        "      h=h.replace('          <span class=\"market-name\">${item.name}</span>\\n          <span class=\"price\">${money(item.currentPrice)}</span>\\n          <div class=\"market-meta\">\\n            <span>Stock: <strong>${item.quantity}</strong></span>\\n            <span>Sold: <strong>${item.totalSold}</strong></span>\\n          </div>', '          <span class=\"market-name\">${item.name}</span>\\n          <span class=\"market-stock\">Stock: <strong>${item.quantity}</strong></span>\\n          <span class=\"price\">${money(item.currentPrice)}</span>\\n          <div class=\"market-meta\"><span>Sold: <strong>${item.totalSold}</strong></span></div>');",
        "      const marketHeadlineCss='.market-main{display:grid!important;grid-template-columns:minmax(0,1fr) auto auto!important;grid-template-areas:\"name stock price\" \"sold sold sold\"!important;align-items:baseline!important;column-gap:6px!important;row-gap:2px!important}.market-name{grid-area:name!important;font-size:.94rem!important;font-weight:950!important;line-height:1!important}.market-stock{grid-area:stock;font-size:.72rem;font-weight:900;color:#f2f6ef;white-space:nowrap}.price{grid-area:price!important;font-size:.72rem!important}.market-meta{grid-area:sold!important;margin:1px 0 0!important;font-size:.60rem!important;font-weight:750!important}@media(max-height:700px) and (max-width:699px){.market-name{font-size:.86rem!important}.market-stock{font-size:.66rem}.price{font-size:.67rem!important}.market-meta{font-size:.55rem!important}}@media(min-width:700px){.market-name{font-size:1rem!important}.market-stock{font-size:.78rem}.price{font-size:.78rem!important}.market-meta{font-size:.68rem!important}}';",
        "      h=h.replace('</style>',marketHeadlineCss+'\\n</style>');",
        "      const loaderResult='      <div class=\"loader-track\"><div id=\"loadingBar\"></div></div>\\n      <div id=\"loadingPercentage\">0%</div>\\n      <div class=\"vhs-tape\" aria-hidden=\"true\"><div class=\"tape\"><div class=\"label\"></div></div></div>\\n      <div class=\"loading-spinner\" aria-hidden=\"true\"></div>';",
        "      const loaderTasks=['Checking pager batteries','Allocating street corners','Counting crumpled twenties','Rewinding suspicious VHS tape','Calibrating police scanner','Installing fake mustache drivers','Bribing guy named Vinny','Locating unmarked payphones','Testing trench-coat pockets','Defragmenting briefcase','Converting cash to smaller bills','Refreshing extremely illegal spreadsheet','Hiding evidence in TEMP folder','Booting MangoWarz street OS'];",
        "      const gauntlet='<div class=\"load-gauntlet\"><div class=\"gauntlet-title\">MANGOWARZ INSTALLATION WIZARD</div><div class=\"gauntlet-sub\">TAP ANYWHERE TO HELP</div><div id=\"gauntletBars\">'+loaderTasks.map((t,i)=>'<div class=\"micro-load\" data-step=\"'+i+'\"><div class=\"micro-label\"><span>'+String(i+1).padStart(2,'0')+'. '+t+'</span><b>0%</b></div><div class=\"micro-track\"><i></i></div></div>').join('')+'</div><div class=\"overall-row\"><span>TOTAL SYSTEM READINESS</span><b id=\"loadingPercentage\">0%</b></div><div class=\"loader-track\"><div id=\"loadingBar\"></div></div><div class=\"vhs-tape\" aria-hidden=\"true\"><div class=\"tape\"><div class=\"label\"></div></div></div><div class=\"loading-spinner\" aria-hidden=\"true\"></div></div>';",
        "      h=h.replace(loaderResult,gauntlet);",
        "      const slowResult=\`      // Intentionally theatrical ~5 second fake load, like original MangoWarz.\\n      let progress = 0;\\n      const timer = setInterval(() => {\\n        if (progress >= 100) {\\n          clearInterval(timer);\\n          setTimeout(() => {\\n            loadingScreen.style.display = 'none';\\n            gameContent.style.display = 'block';\\n            startGame();\\n          }, 180);\\n          return;\\n        }\\n        progress += 1;\\n        loadingBar.style.width = progress + '%';\\n        loadingPercentage.textContent = progress + '%';\\n      }, 50);\`;",
        "      const gauntletLoad=\`      const steps=[...document.querySelectorAll('.micro-load')];\\n      let stepIndex=0, stepPct=0, finished=false;\\n      function paintLoader(){\\n        steps.forEach((row,i)=>{const pct=i<stepIndex?100:(i===stepIndex?stepPct:0);row.querySelector('i').style.width=pct+'%';row.querySelector('b').textContent=pct+'%';row.classList.toggle('active',i===stepIndex);row.classList.toggle('done',i<stepIndex);});\\n        const total=Math.min(100,Math.round(((stepIndex+stepPct/100)/steps.length)*100));\\n        loadingBar.style.width=total+'%'; loadingPercentage.textContent=total+'%';\\n      }\\n      function finishLoader(){if(finished)return;finished=true;paintLoader();setTimeout(()=>{loadingScreen.style.display='none';gameContent.style.display='block';startGame();},260);}\\n      function advanceStep(force=false){if(finished)return;if(force){stepPct=100;}else{stepPct=Math.min(100,stepPct+2+Math.floor(Math.random()*4));}if(stepPct>=100){stepPct=100;paintLoader();setTimeout(()=>{stepIndex++;stepPct=0;if(stepIndex>=steps.length)finishLoader();else paintLoader();},force?55:130);}else paintLoader();}\\n      loadingScreen.addEventListener('pointerdown',e=>{e.preventDefault();advanceStep(true);});\\n      const timer=setInterval(()=>{if(finished){clearInterval(timer);return;}advanceStep(false);},85);\\n      paintLoader();\`;",
        "      h=h.replace(slowResult,gauntletLoad);",
        "      const loaderCss='.loader-card{width:min(360px,92vw)!important}.load-gauntlet{width:100%;user-select:none;-webkit-user-select:none}.gauntlet-title{font:900 .78rem/1.1 \"Courier New\",monospace;letter-spacing:.08em;margin-bottom:3px}.gauntlet-sub{font:700 .56rem/1 \"Courier New\",monospace;margin-bottom:8px;opacity:.7}.micro-load{margin:3px 0;opacity:.55;transition:opacity .1s}.micro-load.active{opacity:1}.micro-load.done{opacity:.72}.micro-label{display:flex;justify-content:space-between;gap:8px;font:700 .48rem/1.05 \"Courier New\",monospace;text-align:left}.micro-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.micro-label b{min-width:27px;text-align:right}.micro-track{height:5px;margin-top:2px;background:#d4d4d4;border:1px solid rgba(0,0,0,.18);overflow:hidden}.micro-track i{display:block;width:0;height:100%;background:#4caf50;transition:width .08s linear}.micro-load.active .micro-track{box-shadow:0 0 0 1px #111}.overall-row{display:flex;justify-content:space-between;margin-top:8px;font:900 .53rem/1 \"Courier New\",monospace}.load-gauntlet>.loader-track{margin:4px 0 0!important;height:10px!important}.load-gauntlet .vhs-tape{margin-top:10px!important;width:100px!important;height:50px!important}.load-gauntlet .loading-spinner{width:28px!important;height:28px!important;border-width:4px!important;margin-top:8px!important}@media(max-height:700px){.micro-load{margin:2px 0}.micro-label{font-size:.42rem}.micro-track{height:4px}.gauntlet-title{font-size:.67rem}.gauntlet-sub{font-size:.48rem}.load-gauntlet .vhs-tape{width:82px!important;height:42px!important;margin-top:6px!important}.load-gauntlet .loading-spinner{width:22px!important;height:22px!important;margin-top:5px!important}}';",
        "      h=h.replace('</style>',loaderCss+'\\n</style>');"
      ].join('\n');
      h=h.replace(marker,marker+'\n'+extra);
      document.open();
      document.write(h);
      document.close();
    } catch(err) {
      document.body.innerHTML='<div style="padding:24px;color:white;background:#111;height:100vh;font-family:system-ui"><h2>MangoWarz failed to boot</h2><p>Reload the page.</p></div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
