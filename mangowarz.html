<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d110e">
  <title>🥭 MangoWarz</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#989898;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#111}.boot b{font-size:18px}</style>
</head>
<body>
<div class="boot"><b>🥭 MangoWarz</b></div>
<script>
(async()=>{
  const SOURCE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/5fd274ae29c5abb11a1a1105acccac9dc3c65721/mangowarz.html';
  try{
    let h=await (await fetch(SOURCE,{cache:'no-store'})).text();

    h=h.replaceAll('${item.name}','\\${item.name}')
       .replaceAll('${money(item.currentPrice)}','\\${money(item.currentPrice)}')
       .replaceAll('${item.quantity}','\\${item.quantity}')
       .replaceAll('${item.totalSold}','\\${item.totalSold}');

    h=h.replace(
      "const mods=[...document.querySelectorAll('.pmod')];",
      "const mods=[...document.querySelectorAll('.pmod')];\\n      const drugGlyphs=['🌿','❄️','💉','🌟','🍄','💊','⚗️','🧪'];\\n      const edgeSlots=[0,2,3,5,7,8,10,12,14,16];\\n      const edgeNames=['top','right','bottom','left'];\\n      edgeSlots.forEach((idx,n)=>{const m=mods[idx];if(!m)return;const g=document.createElement('span');g.className='edge-drug edge-'+edgeNames[n%4];g.textContent=drugGlyphs[(n+Math.floor(Math.random()*drugGlyphs.length))%drugGlyphs.length];g.style.setProperty('--ed',(2.8+Math.random()*1.8).toFixed(2)+'s');m.appendChild(g);});"
    );

    h=h.replace(
      "m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');if(m.classList.contains('digits'))",
      "m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');const glyph=m.querySelector('.edge-drug');if(glyph){glyph.textContent=drugGlyphs[Math.floor(Math.random()*drugGlyphs.length)];glyph.classList.remove('edge-flash');void glyph.offsetWidth;glyph.classList.add('edge-flash');}if(m.classList.contains('digits'))"
    );

    h=h.replace(
      ".pmod span{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center}",
      ".pmod span{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center}.pmod>.edge-drug{position:absolute!important;inset:auto!important;z-index:8;display:block!important;width:20px!important;height:20px!important;font-size:17px;line-height:20px;text-align:center;pointer-events:none;filter:none}.pmod>.edge-drug.edge-top{top:-2px!important;left:0;animation:edgeTop var(--ed) linear infinite}.pmod>.edge-drug.edge-right{right:-2px!important;top:0;animation:edgeRight var(--ed) linear infinite}.pmod>.edge-drug.edge-bottom{bottom:-2px!important;right:0;animation:edgeBottom var(--ed) linear infinite}.pmod>.edge-drug.edge-left{left:-2px!important;bottom:0;animation:edgeLeft var(--ed) linear infinite}.pmod>.edge-drug.edge-flash{filter:brightness(1.25);font-size:19px}@keyframes edgeTop{from{left:0}to{left:calc(100% - 20px)}}@keyframes edgeRight{from{top:0}to{top:calc(100% - 20px)}}@keyframes edgeBottom{from{right:0}to{right:calc(100% - 20px)}}@keyframes edgeLeft{from{bottom:0}to{bottom:calc(100% - 20px)}}@media(max-height:700px){.pmod>.edge-drug{width:17px!important;height:17px!important;font-size:14px;line-height:17px}@keyframes edgeTop{from{left:0}to{left:calc(100% - 17px)}}@keyframes edgeRight{from{top:0}to{top:calc(100% - 17px)}}@keyframes edgeBottom{from{right:0}to{right:calc(100% - 17px)}}@keyframes edgeLeft{from{bottom:0}to{bottom:calc(100% - 17px)}}}"
    );

    document.open();
    document.write(h);
    document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:24px;color:white;background:#111;height:100vh;font-family:system-ui"><h2>MangoWarz failed to boot</h2><p>Reload the page.</p></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
