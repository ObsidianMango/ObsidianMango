<script>
(async()=>{
 const BASE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/e9ed157ea46572ee40eb990e007e235248e6c882/mangowarz.html';
 try{
  let h=await (await fetch(BASE,{cache:'no-store'})).text();

  const oldLoader=`      <div class="loader-title">🥭 MangoWarz 💉</div>\n      <div class="loader-track"><div id="loadingBar"></div></div>\n      <div id="loadingPercentage">0%</div>`;
  const newLoader=`      <div id="chaosField" aria-hidden="true"></div>\n      <div class="original-loader-core">\n        <div class="loader-track"><div id="loadingBar"></div></div>\n        <div id="loadingPercentage">0%</div>\n        <div class="vhs-tape" aria-hidden="true"><div class="tape"><div class="label"></div></div></div>\n        <div class="loading-spinner" aria-hidden="true"></div>\n      </div>`;
  h=h.replace(oldLoader,newLoader);

  const oldLoad=`      let progress = 0;\n      const timer = setInterval(() => {\n        progress = Math.min(100, progress + 8);\n        loadingBar.style.width = progress + '%';\n        loadingPercentage.textContent = progress + '%';\n        if (progress >= 100) {\n          clearInterval(timer);\n          setTimeout(() => {\n            loadingScreen.style.display = 'none';\n            gameContent.style.display = 'block';\n            startGame();\n          }, 90);\n        }\n      }, 45);`;
  const newLoad=`      const field = document.getElementById('chaosField');\n      const types = ['bar','bar','ring','dots','blocks','scan','wave','cross','tri','packet','digits','reels','meter','orbit'];\n      const makeWidget = (type, i) => {\n        const el = document.createElement('button');\n        el.type = 'button';\n        el.className = 'chaos-widget cw-' + type;\n        el.dataset.type = type;\n        el.style.setProperty('--r', (Math.random()*360).toFixed(0)+'deg');\n        el.style.setProperty('--spd', (.45 + Math.random()*1.7).toFixed(2)+'s');\n        const x = Math.random()*94 + 3;\n        const y = Math.random()*92 + 4;\n        el.style.left = x + '%';\n        el.style.top = y + '%';\n        el.style.transform = 'translate(-50%,-50%) rotate(' + (Math.random()*18-9).toFixed(1) + 'deg)';\n        if(type==='bar'){el.style.width=(42+Math.random()*90)+'px';el.innerHTML='<i></i><b></b>';}\n        if(type==='ring'){el.style.width=el.style.height=(22+Math.random()*36)+'px';el.innerHTML='<i></i>';}\n        if(type==='dots'){el.innerHTML='<i></i><i></i><i></i>';}\n        if(type==='blocks'){el.innerHTML='<i></i>'.repeat(12);}\n        if(type==='scan'){el.style.width=(46+Math.random()*62)+'px';el.innerHTML='<i></i>';}\n        if(type==='wave'){el.innerHTML='<i></i>'.repeat(8);}\n        if(type==='cross'){el.innerHTML='<i></i><b></b>';}\n        if(type==='tri'){el.innerHTML='<i></i>';}\n        if(type==='packet'){el.style.width=(55+Math.random()*88)+'px';el.innerHTML='<i></i><b></b>';}\n        if(type==='digits'){el.innerHTML='<b>' + String(Math.floor(Math.random()*9999)).padStart(4,'0') + '</b>';}\n        if(type==='reels'){el.innerHTML='<i></i><i></i>';}\n        if(type==='meter'){el.innerHTML='<i></i>';}\n        if(type==='orbit'){el.innerHTML='<i></i><b></b>';}\n        el.addEventListener('pointerdown', e => {\n          e.stopPropagation();\n          el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');\n          progress = Math.min(100, progress + 3 + Math.random()*5);\n          if(type==='digits') el.querySelector('b').textContent=String(Math.floor(Math.random()*9999)).padStart(4,'0');\n          el.style.setProperty('--spd', (.16 + Math.random()*.35).toFixed(2)+'s');\n          setTimeout(()=>el.style.setProperty('--spd', (.55 + Math.random()*1.4).toFixed(2)+'s'), 420);\n        });\n        return el;\n      };\n      for(let i=0;i<46;i++) field.appendChild(makeWidget(types[i%types.length],i));\n      let progress = 0;\n      let finished = false;\n      loadingScreen.addEventListener('pointerdown', () => { if(!finished) progress=Math.min(100,progress+1.6); });\n      const timer = setInterval(() => {\n        progress = Math.min(100, progress + 1);\n        loadingBar.style.width = progress + '%';\n        loadingPercentage.textContent = Math.floor(progress) + '%';\n        if(Math.random()<.08){\n          const all=field.children; const w=all[Math.floor(Math.random()*all.length)];\n          if(w){w.classList.add('hit');setTimeout(()=>w.classList.remove('hit'),180);}\n        }\n        if(progress >= 100 && !finished){\n          finished=true; clearInterval(timer);\n          setTimeout(() => {loadingScreen.style.display='none';gameContent.style.display='block';startGame();},220);\n        }\n      },70);`;
  h=h.replace(oldLoad,newLoad);

  const oldCityWire=`          <nav id="cityLinks" class="city-nav" aria-label="Travel and game actions"></nav>\n          <div id="events" aria-live="polite"></div>`;
  const newCityWire=`          <div id="streetTicker" class="street-ticker" aria-live="polite">\n            <span class="ticker-badge">STREET WIRE</span>\n            <div class="ticker-window"><span id="tickerText">KEEP YOUR EYES OPEN. BUY LOW. SELL HIGH.</span></div>\n          </div>\n          <nav id="cityLinks" class="city-nav" aria-label="Travel and game actions"></nav>\n          <div id="events" aria-live="polite"></div>`;
  h=h.replace(oldCityWire,newCityWire);

  const oldStart=`    function startGame() {\n      buildCityNav();\n      updatePrices();\n      updateDisplay();\n    }`;
  const newStart=`    function startGame() {\n      buildCityNav();\n      updatePrices();\n      updateDisplay();\n      showNotification('WELCOME TO NEW YORK. 30 DAYS. $20,000 OWED. GET TO WORK.');\n    }`;
  h=h.replace(oldStart,newStart);

  const oldEvent=`    function checkSpecialEvent() {\n      const events = document.getElementById('events');\n      if (Math.random() < 0.10) {\n        const eventFactor = Math.random() < 0.5 ? 2 : 0.5;\n        Object.values(goods).forEach(item => {\n          item.currentPrice = Math.max(1, Math.floor(item.currentPrice * eventFactor));\n        });\n        events.innerHTML = eventFactor === 2\n          ? '<p>🚨 Bust in town — prices just went through the roof.</p>'\n          : '<p>📉 Market flooded — prices have cratered.</p>';\n      } else {\n        events.innerHTML = '';\n      }\n    }`;
  const newEvent=`    function checkSpecialEvent() {\n      const events = document.getElementById('events');\n      events.innerHTML = '';\n      if (Math.random() < 0.10) {\n        const eventFactor = Math.random() < 0.5 ? 2 : 0.5;\n        Object.values(goods).forEach(item => {item.currentPrice = Math.max(1, Math.floor(item.currentPrice * eventFactor));});\n        showNotification(eventFactor === 2 ? 'NARCS MADE A BIG BUST! THE STREET IS DRY — PRICES ARE THROUGH THE ROOF!' : 'A BIG SHIPMENT HIT THE STREET! DEALERS ARE DUMPING CHEAP — PRICES GOT CRUSHED!');\n      }\n    }`;
  h=h.replace(oldEvent,newEvent);

  const oldNotify=`    function showNotification(message, duration = 2200) {\n      const notification = document.getElementById('notification');\n      notification.textContent = message;\n      notification.style.display = 'block';\n\n      clearTimeout(showNotification.timer);\n      showNotification.timer = setTimeout(() => {\n        notification.style.display = 'none';\n      }, duration);\n    }`;
  const newNotify=`    const tickerQueue = [];\n    let tickerBusy = false;\n    function streetify(message) {\n      const m=String(message);\n      if(m.startsWith('Bought ')) return m.replace(/^Bought /,'YOU COPPED ').replace(' for ',' FOR ').toUpperCase();\n      if(m.startsWith('Sold ')) return m.replace(/^Sold /,'YOU MOVED ').replace(' for ',' FOR ').toUpperCase();\n      if(m.startsWith('Welcome to ')) return m.replace(/^Welcome to (.+)\\. New prices are live\\.$/,'TOUCHED DOWN IN $1. NEW STREET PRICES ARE UP.').toUpperCase();\n      if(m.startsWith('⚠️ Only ')) return m.replace('⚠️ Only ','CLOCK IS BURNING — ').replace(' left.',' LEFT.').toUpperCase();\n      if(m==='Nothing to trade right now.') return "AIN'T NOTHING TO MOVE RIGHT NOW.";\n      if(m==='Transaction not possible.') return 'NO DEAL. CHECK YOUR CASH AND STASH.';\n      if(m==='Game saved.') return 'GAME STASHED. COME BACK WHEN THE STREET CALLS.';\n      if(m==='Game loaded.') return 'OLD BUSINESS IS BACK ON THE STREET.';\n      if(m.startsWith('Not enough cash for ')) return m.replace('Not enough cash for ',"YOU'RE SHORT ON CASH FOR ").toUpperCase();\n      if(m.startsWith('You already own ')) return m.replace('You already own ','YOU ALREADY GOT ').toUpperCase();\n      return m.toUpperCase();\n    }\n    function runTicker(){\n      if(tickerBusy)return; const text=document.getElementById('tickerText'); if(!text)return;\n      const message=tickerQueue.length?tickerQueue.shift():"STREET'S QUIET... FOR NOW. KEEP YOUR EYES OPEN.";\n      tickerBusy=true;text.textContent='+++ '+message+' +++';text.style.animation='none';void text.offsetWidth;\n      text.style.animation='streetScroll '+Math.max(6,Math.min(11,message.length/9))+'s linear 1';\n      text.onanimationend=()=>{tickerBusy=false;setTimeout(runTicker,tickerQueue.length?120:900);};\n    }\n    function showNotification(message){tickerQueue.push(streetify(message));runTicker();}`;
  h=h.replace(oldNotify,newNotify);

  const css=`

#loadingScreen{background:#989898;color:#111;overflow:hidden}.loader-card{width:min(300px,80vw);position:relative;z-index:5}.original-loader-core{position:relative;z-index:5}.loader-track{height:15px;border-radius:10px;background:#ddd;box-shadow:inset 0 1px 3px rgba(0,0,0,.22);margin-bottom:12px}#loadingBar{background:#4caf50;transition:width .15s linear}#loadingPercentage{color:#111;font-size:16px}.vhs-tape{width:120px;height:60px;margin:20px auto 0;perspective:1000px}.tape{width:100%;height:100%;position:relative;background:#050505;transform-style:preserve-3d;animation:mangoTapeRotate 5s linear infinite;border-radius:2px;box-shadow:0 8px 14px rgba(0,0,0,.3)}.tape:before,.tape:after{content:'';position:absolute;top:21px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px #333}.tape:before{left:8px}.tape:after{right:8px}.tape .label{position:absolute;left:38px;top:22px;width:45px;height:15px;background:#fff;box-shadow:inset 0 0 0 2px #ddd}@keyframes mangoTapeRotate{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}.loading-spinner{width:40px;height:40px;margin:15px auto 0;border:5px solid #f3f3f3;border-top-color:#4caf50;border-radius:50%;animation:mangoSpin 1s linear infinite}@keyframes mangoSpin{to{transform:rotate(360deg)}}
#chaosField{position:fixed;inset:0;z-index:1;pointer-events:auto;overflow:hidden}.chaos-widget{--spd:1s;position:absolute;display:block;padding:0;margin:0;border:0;background:transparent;color:#222;opacity:.62;touch-action:manipulation;filter:drop-shadow(0 1px 0 rgba(255,255,255,.35))}.chaos-widget.hit{animation:chaosHit .18s linear;opacity:1}.cw-bar{height:14px;border:1px solid #333;background:#d8d8d8;overflow:hidden}.cw-bar i{position:absolute;left:1px;top:1px;bottom:1px;width:60%;background:#4caf50;animation:barWobble var(--spd) ease-in-out infinite alternate}.cw-bar b{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.18) 8px 9px)}.cw-ring{border:3px solid #d9d9d9;border-top-color:#222;border-right-color:#4caf50;border-radius:50%;animation:spin var(--spd) linear infinite}.cw-ring i{position:absolute;inset:26%;border:1px solid #333;border-radius:50%}.cw-dots{display:flex;gap:4px}.cw-dots i{width:8px;height:8px;background:#222;border-radius:50%;animation:dotBounce var(--spd) ease-in-out infinite alternate}.cw-dots i:nth-child(2){animation-delay:.15s;background:#4caf50}.cw-dots i:nth-child(3){animation-delay:.3s}.cw-blocks{width:42px;display:grid;grid-template-columns:repeat(4,8px);gap:3px}.cw-blocks i{width:8px;height:8px;background:#333;animation:blockBlink var(--spd) steps(1) infinite}.cw-blocks i:nth-child(3n){background:#4caf50;animation-delay:.2s}.cw-scan{height:28px;border:1px solid #333;background:repeating-linear-gradient(0deg,#ccc 0 3px,#aaa 3px 4px);overflow:hidden}.cw-scan i{position:absolute;top:0;bottom:0;width:3px;background:#4caf50;box-shadow:0 0 5px #4caf50;animation:scanMove var(--spd) linear infinite}.cw-wave{height:30px;display:flex;align-items:center;gap:3px}.cw-wave i{width:4px;height:24px;background:#222;transform-origin:center;animation:wavePulse var(--spd) ease-in-out infinite alternate}.cw-wave i:nth-child(even){background:#4caf50;animation-delay:.13s}.cw-cross{width:30px;height:30px;animation:spin var(--spd) linear infinite}.cw-cross i,.cw-cross b{position:absolute;left:14px;top:1px;width:2px;height:28px;background:#222}.cw-cross b{transform:rotate(90deg);background:#4caf50}.cw-tri{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:28px solid #333;animation:triFlip var(--spd) ease-in-out infinite alternate}.cw-tri i{position:absolute;left:-8px;top:8px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #989898}.cw-packet{height:10px;border-top:2px dotted #333}.cw-packet i{position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;background:#4caf50;animation:packetMove var(--spd) linear infinite}.cw-packet b{position:absolute;right:0;top:-4px;width:7px;height:7px;background:#222}.cw-digits b{font:900 13px/1 'Courier New',monospace;letter-spacing:2px;background:#202020;color:#9cff72;padding:3px 5px}.cw-reels{display:flex;gap:4px}.cw-reels i{width:19px;height:19px;border:3px dotted #222;border-radius:50%;animation:spin var(--spd) linear infinite}.cw-reels i:last-child{animation-direction:reverse;border-color:#4caf50 #222}.cw-meter{width:11px;height:42px;border:1px solid #333;background:#d0d0d0;overflow:hidden}.cw-meter i{position:absolute;left:1px;right:1px;bottom:1px;height:60%;background:#4caf50;animation:meterRise var(--spd) ease-in-out infinite alternate}.cw-orbit{width:38px;height:38px;border:1px solid #555;border-radius:50%;animation:spin var(--spd) linear infinite}.cw-orbit i{position:absolute;left:15px;top:15px;width:6px;height:6px;background:#222;border-radius:50%}.cw-orbit b{position:absolute;left:16px;top:-4px;width:7px;height:7px;background:#4caf50;border-radius:50%}@keyframes spin{to{transform:rotate(360deg)}}@keyframes chaosHit{50%{transform:translate(-50%,-50%) scale(1.45) rotate(8deg)}}@keyframes barWobble{from{width:18%}to{width:92%}}@keyframes dotBounce{from{transform:translateY(-5px)}to{transform:translateY(5px)}}@keyframes blockBlink{50%{opacity:.15}}@keyframes scanMove{from{left:0}to{left:100%}}@keyframes wavePulse{from{transform:scaleY(.2)}to{transform:scaleY(1)}}@keyframes triFlip{from{transform:rotate(-28deg) scale(.8)}to{transform:rotate(28deg) scale(1.2)}}@keyframes packetMove{from{left:0}to{left:100%}}@keyframes meterRise{from{height:12%}to{height:94%}}
