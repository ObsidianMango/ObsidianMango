<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d110e">
  <title>🥭 MangoWarz</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#989898;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .boot{position:fixed;inset:0;display:grid;place-items:center;color:#111}
    .boot b{font-size:18px}
  </style>
</head>
<body>
  <div class="boot"><b>🥭 MangoWarz</b></div>
  <script>
  (async()=>{
    const BASE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/e9ed157ea46572ee40eb990e007e235248e6c882/mangowarz.html';
    try{
      let h=await (await fetch(BASE,{cache:'no-store'})).text();

      const oldLoader=`      <div class="loader-title">🥭 MangoWarz 💉</div>\n      <div class="loader-track"><div id="loadingBar"></div></div>\n      <div id="loadingPercentage">0%</div>`;
      const newLoader=`      <div class="loader-track"><div id="loadingBar"></div></div>\n      <div id="loadingPercentage">0%</div>\n      <div class="vhs-tape" aria-hidden="true"><div class="tape"><div class="label"></div></div></div>\n      <div class="loading-spinner" aria-hidden="true"></div>`;
      h=h.replace(oldLoader,newLoader);

      const oldLoad=`      let progress = 0;\n      const timer = setInterval(() => {\n        progress = Math.min(100, progress + 8);\n        loadingBar.style.width = progress + '%';\n        loadingPercentage.textContent = progress + '%';\n        if (progress >= 100) {\n          clearInterval(timer);\n          setTimeout(() => {\n            loadingScreen.style.display = 'none';\n            gameContent.style.display = 'block';\n            startGame();\n          }, 90);\n        }\n      }, 45);`;
      const newLoad=`      let progress = 0;\n      const timer = setInterval(() => {\n        if (progress >= 100) {\n          clearInterval(timer);\n          setTimeout(() => {\n            loadingScreen.style.display = 'none';\n            gameContent.style.display = 'block';\n            startGame();\n          }, 180);\n          return;\n        }\n        progress += 1;\n        loadingBar.style.width = progress + '%';\n        loadingPercentage.textContent = progress + '%';\n      }, 50);`;
      h=h.replace(oldLoad,newLoad);

      const css=`
/* MangoWarz mobile fit v2 */
html,body{height:100%;overflow:hidden}body{min-height:0}
#loadingScreen{background:#989898;color:#111}.loader-card{width:min(300px,80vw)}.loader-track{height:15px;border-radius:10px;background:#ddd;box-shadow:inset 0 1px 3px rgba(0,0,0,.22);margin-bottom:12px}#loadingBar{background:#4caf50;transition:width .3s ease}#loadingPercentage{color:#111;font-size:16px}.vhs-tape{width:120px;height:60px;margin:20px auto 0;perspective:1000px}.tape{width:100%;height:100%;position:relative;background:#050505;transform-style:preserve-3d;animation:mangoTapeRotate 5s linear infinite;border-radius:2px;box-shadow:0 8px 14px rgba(0,0,0,.3)}.tape:before,.tape:after{content:'';position:absolute;top:21px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px #333}.tape:before{left:8px}.tape:after{right:8px}.tape .label{position:absolute;left:38px;top:22px;width:45px;height:15px;background:#fff;box-shadow:inset 0 0 0 2px #ddd}@keyframes mangoTapeRotate{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}.loading-spinner{width:40px;height:40px;margin:15px auto 0;border:5px solid #f3f3f3;border-top-color:#4caf50;border-radius:50%;animation:mangoSpin 1s linear infinite}@keyframes mangoSpin{to{transform:rotate(360deg)}}
#gameContent{height:100%;overflow:hidden}.app-shell{width:min(1180px,100%);height:100%;margin:0 auto;padding:6px;display:grid;grid-template-rows:46px minmax(0,1fr);gap:6px}.topbar{position:relative;top:auto;margin:0;padding:4px;border-radius:16px;min-height:0}.hud-chip{padding:4px 7px;border-radius:11px}.hud-label{font-size:.52rem;margin:0}.hud-value{font-size:.98rem}.brand{font-size:1rem}.brand-sub{display:none}.quick-menu{top:calc(100% + 6px)}
.main-grid{min-height:0;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:136px 58px minmax(0,1fr);gap:6px}.card{min-width:0;min-height:0}.city-card{position:relative;display:grid;grid-template-rows:minmax(0,1fr) 60px;min-height:0}.city-image-wrap{aspect-ratio:auto;min-height:0;max-height:none;height:100%}.city-overlay{left:10px;right:10px;bottom:8px}#currentCity{font-size:1.18rem}.current-label,.route-hint{display:none}.city-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:26px;overflow:visible;padding:5px;gap:4px;align-content:center}.city-nav button,.action-btn{min-height:26px;padding:2px 4px;border-radius:8px;font-size:.57rem;line-height:1.05;white-space:normal;word-break:break-word;width:100%}.city-nav .store-btn{background:rgba(125,245,141,.12);color:#a9ffb7}.city-nav .liquidate-btn{background:rgba(111,182,255,.12);color:#b7d8ff}#events{position:absolute;z-index:5;top:7px;left:7px;right:7px;margin:0;padding:6px 8px;font-size:.64rem;border-radius:9px}
.assets-card{padding:4px;display:grid;grid-template-columns:80px minmax(0,1fr);align-items:stretch;gap:4px}.assets-card .section-title-row{display:block;min-width:0;margin:0;padding:4px 6px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025)}.assets-card .section-title{font-size:.54rem}.assets-card .section-sub{display:block;margin-top:2px;font-size:.70rem;line-height:1.1}#infoGrid{min-width:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.asset-item{min-height:0;padding:4px 6px;border-radius:10px}.asset-label{margin-bottom:2px;font-size:.46rem}.asset-value{min-height:0;font-size:.76rem;line-height:1.15}.asset-value em{font-size:.62rem}
.market-card{min-height:0;padding:4px;display:grid;grid-template-rows:18px minmax(0,1fr);gap:4px}.market-card .section-title-row{margin:0;padding:0 2px;align-items:center}.market-card .section-title{font-size:.72rem}.market-card .section-sub{display:block;font-size:.50rem}.market-list{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:4px}.market-row{min-width:0;min-height:0;padding:4px;border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:2px}.market-main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:4px}.market-name{font-size:.60rem}.price{font-size:.56rem}.market-meta{grid-column:1/-1;margin:1px 0 0;gap:8px;font-size:.48rem}.trade-area{min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:3px;align-items:end}.trade-controls{width:100%;min-width:0;display:grid;grid-template-columns:24px repeat(3,minmax(0,1fr));gap:2px;align-items:center}.trade-group-label{grid-column:auto;color:#758078;font-size:.38rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.trade-controls button{min-width:0;min-height:20px;height:20px;padding:0 1px;border-radius:6px;font-size:.46rem}.buy-btn{background:rgba(125,245,141,.12);color:#9affaa}.sell-btn{background:rgba(111,182,255,.12);color:#a9d3ff}
@media(max-height:700px) and (max-width:699px){.app-shell{padding:4px;grid-template-rows:42px minmax(0,1fr);gap:4px}.topbar{padding:3px;border-radius:13px}.main-grid{grid-template-rows:122px 52px minmax(0,1fr);gap:4px}.city-card{grid-template-rows:minmax(0,1fr) 56px}#currentCity{font-size:1.04rem}.city-nav{grid-auto-rows:24px;padding:4px;gap:3px}.city-nav button{min-height:24px;font-size:.53rem}.assets-card{grid-template-columns:72px minmax(0,1fr);gap:3px;padding:3px}.asset-item{padding:3px 5px}.market-card{padding:3px;grid-template-rows:16px minmax(0,1fr);gap:3px}.market-card .section-title{font-size:.68rem}.market-list{gap:3px}.market-row{padding:3px;gap:1px}.market-name{font-size:.56rem}.price{font-size:.52rem}.market-meta{font-size:.43rem}.trade-area{gap:2px}.trade-controls{grid-template-columns:20px repeat(3,minmax(0,1fr));gap:1px}.trade-controls button{min-height:18px;height:18px;font-size:.42rem}.trade-group-label{font-size:.34rem}}
@media(min-width:700px){.app-shell{padding:10px;grid-template-rows:54px minmax(0,1fr);gap:8px}.topbar{padding:6px}.brand{font-size:1.12rem}.hud-value{font-size:1.08rem}.main-grid{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);grid-template-rows:minmax(0,1fr) 72px;gap:8px}.city-card{grid-column:1;grid-row:1;grid-template-rows:minmax(0,1fr) 68px}.assets-card{grid-column:1;grid-row:2;grid-template-columns:100px minmax(0,1fr);padding:6px}.market-card{grid-column:2;grid-row:1/3;padding:6px;grid-template-rows:22px minmax(0,1fr)}.city-nav{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:28px;padding:6px}.city-nav button{min-height:28px;font-size:.66rem}#currentCity{font-size:1.7rem}.market-card .section-title{font-size:.92rem}.market-card .section-sub{font-size:.62rem}.market-list{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:6px}.market-row{padding:6px}.market-name{font-size:.74rem}.price{font-size:.70rem}.market-meta{font-size:.60rem}.trade-controls{grid-template-columns:28px repeat(3,minmax(0,1fr))}.trade-controls button{min-height:26px;height:26px;font-size:.58rem}.trade-group-label{font-size:.45rem}}
`;
      h=h.replace('</style>',css+'\n</style>');

      document.open();
      document.write(h);
      document.close();
    }catch(err){
      document.body.innerHTML='<div style="padding:24px;color:white;background:#111;height:100vh;font-family:system-ui"><h2>MangoWarz failed to boot</h2><p>Reload the page.</p></div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
