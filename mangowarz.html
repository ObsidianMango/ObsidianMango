<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d110e">
  <title>🥭 MangoWarz</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#989898;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#111}.boot b{font-size:18px}</style>
</head>
<body>
  <div class="boot"><b>🥭 MangoWarz</b></div>
  <script>
  (async()=>{
    const BASE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/52ee58a7e527e80c501a1fbfaea6c38d67b0009b/mangowarz.html';
    try {
      let h=await (await fetch(BASE,{cache:'no-store'})).text();
      const marker="      h=h.replace('</style>',css+'\\n</style>');";
      const extra=[
        "      h=h.replace('          <span class=\"market-name\">${item.name}</span>\\n          <span class=\"price\">${money(item.currentPrice)}</span>\\n          <div class=\"market-meta\">\\n            <span>Stock: <strong>${item.quantity}</strong></span>\\n            <span>Sold: <strong>${item.totalSold}</strong></span>\\n          </div>', '          <span class=\"market-name\">${item.name}</span>\\n          <span class=\"market-stock\">Stock: <strong>${item.quantity}</strong></span>\\n          <span class=\"price\">${money(item.currentPrice)}</span>\\n          <div class=\"market-meta\"><span>Sold: <strong>${item.totalSold}</strong></span></div>');",
        "      const marketHeadlineCss='.market-main{display:grid!important;grid-template-columns:minmax(0,1fr) auto auto!important;grid-template-areas:\"name stock price\" \"sold sold sold\"!important;align-items:baseline!important;column-gap:6px!important;row-gap:2px!important}.market-name{grid-area:name!important;font-size:.94rem!important;font-weight:950!important;line-height:1!important}.market-stock{grid-area:stock;font-size:.72rem;font-weight:900;color:#f2f6ef;white-space:nowrap}.price{grid-area:price!important;font-size:.72rem!important}.market-meta{grid-area:sold!important;margin:1px 0 0!important;font-size:.60rem!important;font-weight:750!important}@media(max-height:700px) and (max-width:699px){.market-name{font-size:.86rem!important}.market-stock{font-size:.66rem}.price{font-size:.67rem!important}.market-meta{font-size:.55rem!important}}@media(min-width:700px){.market-name{font-size:1rem!important}.market-stock{font-size:.78rem}.price{font-size:.78rem!important}.market-meta{font-size:.68rem!important}}';",
        "      h=h.replace('</style>',marketHeadlineCss+'\\n</style>');"
      ].join('\n');
      h=h.replace(marker,marker+'\n'+extra);
      document.open();
      document.write(h);
      document.close();
    } catch(err) {
      document.body.innerHTML='<div style="padding:24px;color:white;background:#111;height:100vh;font-family:system-ui"><h2>MangoWarz failed to boot</h2><p>Reload the page.</p></div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
