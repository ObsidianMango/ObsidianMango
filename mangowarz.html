inal i:nth-child(4){animation-delay:.45s}.visual-bottom{display:grid;grid-template-columns:92px minmax(0,1fr) 34px;gap:6px;align-items:center;margin-top:8px}.visual-bottom .vhs-tape{width:86px!important;height:43px!important;margin:0!important}.visual-bottom .loading-spinner{width:24px!important;height:24px!important;border-width:4px!important;margin:0!important}.tap-hint{font:900 .50rem/1.25 \"Courier New\",monospace;text-align:center}@keyframes loaderHit{0%{transform:scale(1)}50%{transform:scale(.93) rotate(-1deg)}100%{transform:scale(1)}}@keyframes radarSweep{to{transform:rotate(360deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes eq{from{transform:scaleY(.22)}to{transform:scaleY(1)}}@keyframes scan{from{left:0}to{left:100%}}@keyframes packet{from{left:-8px}to{left:100%}}@keyframes cashBounce{from{transform:translateY(0)}to{transform:translateY(-7px)}}@keyframes digitFlip{0%,24%{transform:rotateX(0)}25%,49%{transform:rotateX(90deg)}50%,74%{transform:rotateX(180deg)}75%,100%{transform:rotateX(270deg)}}@keyframes dieSpin{to{transform:rotate(360deg)}}@keyframes pagerBlink{50%{opacity:.25}}@keyframes memBlink{50%{opacity:.18}}@keyframes pulseRing{from{transform:scale(.35);opacity:1}to{transform:scale(1.8);opacity:0}}@keyframes termBlink{50%{opacity:.2}}@media(max-height:700px){.loader-card{width:min(350px,94vw)!important}.visual-grid{gap:3px}.vizmod{height:57px;padding-top:2px}.vizmod small{font-size:.36rem}.radar-face,.dial,.orbit,.pulse{width:31px;height:31px}.reels{padding-top:3px}.reels i{width:20px;height:20px}.eq,.wave{height:31px}.scan-box,.packets,.cash-stack,.lock-digits{height:31px}.die{font-size:28px;line-height:31px}.pager{height:27px;margin-top:1px}.pager b{line-height:23px}.mini-tape{height:27px}.visual-bottom{margin-top:4px}.visual-bottom .vhs-tape{width:70px!important;height:35px!important}.tap-hint{font-size:.44rem}}`;",
