<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d110e">
  <title>🥭 MangoWarz</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#989898;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#111}.boot b{font-size:18px}</style>
</head>
<body>
<div class="boot"><b>🥭 MangoWarz</b></div>
<script>
(async()=>{
  const SOURCE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/5fd274ae29c5abb11a1a1105acccac9dc3c65721/mangowarz.html';
  try{
    let h=await (await fetch(SOURCE,{cache:'no-store'})).text();

    h=h.replaceAll('${item.name}','\\${item.name}')
       .replaceAll('${money(item.currentPrice)}','\\${money(item.currentPrice)}')
       .replaceAll('${item.quantity}','\\${item.quantity}')
       .replaceAll('${item.totalSold}','\\${item.totalSold}');

    h=h.replace(
      "const mods=[...document.querySelectorAll('.pmod')];",
      "const mods=[...document.querySelectorAll('.pmod')];\\n      const drugGlyphs=['🌿','❄️','💉','🌟','🍄','💊','⚗️','🧪'];\\n      const glyphTargets=[...mods].sort(()=>Math.random()-.5).slice(0,Math.floor(9+Math.random()*5));\\n      glyphTargets.forEach((m,idx)=>{const g=document.createElement('span');g.className='drug-glyph';g.textContent=drugGlyphs[Math.floor(Math.random()*drugGlyphs.length)];g.style.setProperty('--gx',(8+Math.random()*76)+'%');g.style.setProperty('--gy',(10+Math.random()*68)+'%');g.style.setProperty('--gd',(.7+Math.random()*1.5)+'s');m.appendChild(g);if((m.classList.contains('bar')||m.classList.contains('scan')||m.classList.contains('packets'))&&Math.random()<.45){const g2=g.cloneNode(true);g2.textContent=drugGlyphs[Math.floor(Math.random()*drugGlyphs.length)];g2.style.setProperty('--gx',(8+Math.random()*76)+'%');g2.style.setProperty('--gy',(10+Math.random()*68)+'%');g2.style.setProperty('--gd',(.7+Math.random()*1.5)+'s');m.appendChild(g2);}});"
    );

    h=h.replace(
      "m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');if(m.classList.contains('digits'))",
      "m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');const glyph=m.querySelector('.drug-glyph');if(glyph&&Math.random()<.8){glyph.textContent=drugGlyphs[Math.floor(Math.random()*drugGlyphs.length)];glyph.classList.remove('glyph-pop');void glyph.offsetWidth;glyph.classList.add('glyph-pop');}if(m.classList.contains('digits'))"
    );

    h=h.replace(
      ".pmod span{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center}",
      ".pmod span{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center}.pmod>.drug-glyph{position:absolute!important;inset:auto!important;left:var(--gx)!important;top:var(--gy)!important;width:auto!important;height:auto!important;z-index:6;display:block!important;font-size:clamp(15px,4vw,28px);line-height:1;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5));animation:drugFloat var(--gd) ease-in-out infinite alternate;pointer-events:none}.pmod>.drug-glyph:nth-of-type(even){animation-direction:alternate-reverse}.drug-glyph.glyph-pop{animation:glyphPop .24s ease-out 1!important}@keyframes drugFloat{from{transform:translate(-50%,-50%) rotate(-7deg) scale(.88)}to{transform:translate(-50%,-58%) rotate(7deg) scale(1.08)}}@keyframes glyphPop{0%{transform:translate(-50%,-50%) scale(.5) rotate(-20deg)}65%{transform:translate(-50%,-50%) scale(1.55) rotate(12deg)}100%{transform:translate(-50%,-50%) scale(1)}}"
    );

    document.open();
    document.write(h);
    document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:24px;color:white;background:#111;height:100vh;font-family:system-ui"><h2>MangoWarz failed to boot</h2><p>Reload the page.</p></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
