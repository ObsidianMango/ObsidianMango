(async()=>{
 const BASE='https://raw.githubusercontent.com/ObsidianMango/ObsidianMango/e9ed157ea46572ee40eb990e007e235248e6c882/mangowarz.html';
 try{
  let h=await (await fetch(BASE,{cache:'no-store'})).text();

  const oldLoader=`      <div class="loader-title">🥭 MangoWarz 💉</div>\n      <div class="loader-track"><div id="loadingBar"></div></div>\n      <div id="loadingPercentage">0%</div>`;
  const newLoader=`      <div id="loaderPuzzle" class="loader-puzzle">\n        <button class="pmod p1 bar" data-name="STREET CACHE"><span><i></i></span></button>\n        <button class="pmod p2 ring" data-name="RADAR"><span><i></i></span></button>\n        <button class="pmod p3 scan" data-name="SCANNER"><span><i></i></span></button>\n        <button class="pmod p4 blocks" data-name="MEMORY"><span>${'<i></i>'.repeat(15)}</span></button>\n        <button class="pmod p5 wave" data-name="AUDIO"><span>${'<i></i>'.repeat(9)}</span></button>\n        <button class="pmod p6 digits" data-name="PAGER"><span><b>911</b><em>404</em></span></button>\n        <button class="pmod p7 reels" data-name="VHS AUX"><span><i></i><i></i></span></button>\n        <button class="pmod p8 meter" data-name="SIGNAL"><span><i></i><b></b><em></em></span></button>\n        <button class="pmod p9 packets" data-name="PACKETS"><span><i></i><b></b><em></em></span></button>\n        <div class="puzzle-core original-loader-core">\n          <div class="loader-track"><div id="loadingBar"></div></div>\n          <div id="loadingPercentage">0%</div>\n          <div class="vhs-tape" aria-hidden="true"><div class="tape"><div class="label"></div></div></div>\n          <div class="loading-spinner" aria-hidden="true"></div>\n        </div>\n        <button class="pmod p10 dots" data-name="HANDSHAKE"><span><i></i><i></i><i></i><i></i><i></i></span></button>\n        <button class="pmod p11 orbit" data-name="UPLINK"><span><i></i><b></b></span></button>\n        <button class="pmod p12 scan" data-name="POLICE BAND"><span><i></i></span></button>\n        <button class="pmod p13 bar" data-name="CASH INDEX"><span><i></i></span></button>\n        <button class="pmod p14 blocks" data-name="BRIEFCASE"><span>${'<i></i>'.repeat(12)}</span></button>\n        <button class="pmod p15 ring" data-name="TRACE"><span><i></i></span></button>\n        <button class="pmod p16 wave" data-name="MODEM"><span>${'<i></i>'.repeat(12)}</span></button>\n        <button class="pmod p17 packets" data-name="STREET WIRE"><span><i></i><b></b><em></em></span></button>\n      </div>`;
  h=h.replace(oldLoader,newLoader);

  const oldLoad=`      let progress = 0;\n      const timer = setInterval(() => {\n        progress = Math.min(100, progress + 8);\n        loadingBar.style.width = progress + '%';\n        loadingPercentage.textContent = progress + '%';\n        if (progress >= 100) {\n          clearInterval(timer);\n          setTimeout(() => {\n            loadingScreen.style.display = 'none';\n            gameContent.style.display = 'block';\n            startGame();\n          }, 90);\n        }\n      }, 45);`;
  const newLoad=`      const mods=[...document.querySelectorAll('.pmod')];\n      const vals=mods.map(()=>Math.random()*10);\n      let finished=false;\n      function paintPuzzle(){\n        let sum=0;\n        mods.forEach((m,i)=>{vals[i]=Math.min(100,vals[i]);sum+=vals[i];m.style.setProperty('--p',vals[i]+'%');m.classList.toggle('done',vals[i]>=100);});\n        const total=Math.min(100,Math.floor(sum/mods.length));\n        loadingBar.style.width=total+'%';loadingPercentage.textContent=total+'%';\n        if(total>=100&&!finished){finished=true;setTimeout(()=>{loadingScreen.style.display='none';gameContent.style.display='block';startGame();},250);}\n      }\n      mods.forEach((m,i)=>m.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(finished)return;vals[i]=Math.min(100,vals[i]+22+Math.random()*38);m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');if(m.classList.contains('digits')){m.querySelector('b').textContent=String(Math.floor(Math.random()*999)).padStart(3,'0');m.querySelector('em').textContent=String(Math.floor(Math.random()*999)).padStart(3,'0');}paintPuzzle();}));\n      document.querySelector('.puzzle-core').addEventListener('pointerdown',()=>{const live=vals.map((v,i)=>v<100?i:-1).filter(i=>i>=0);if(!live.length)return;for(let n=0;n<3;n++){const i=live[Math.floor(Math.random()*live.length)];vals[i]=Math.min(100,vals[i]+8+Math.random()*18);}paintPuzzle();});\n      const timer=setInterval(()=>{if(finished){clearInterval(timer);return;}vals.forEach((v,i)=>{if(v<100)vals[i]+=1.1+Math.random()*2.1;});paintPuzzle();},85);\n      paintPuzzle();`;
  h=h.replace(oldLoad,newLoad);

  const oldCityWire=`          <nav id="cityLinks" class="city-nav" aria-label="Travel and game actions"></nav>\n          <div id="events" aria-live="polite"></div>`;
  const newCityWire=`          <div id="streetTicker" class="street-ticker" aria-live="polite">\n            <span class="ticker-badge">STREET WIRE</span>\n            <div class="ticker-window"><span id="tickerText">KEEP YOUR EYES OPEN. BUY LOW. SELL HIGH.</span></div>\n          </div>\n          <nav id="cityLinks" class="city-nav" aria-label="Travel and game actions"></nav>\n          <div id="events" aria-live="polite"></div>`;
  h=h.replace(oldCityWire,newCityWire);

  const oldStart=`    function startGame() {\n      buildCityNav();\n      updatePrices();\n      updateDisplay();\n    }`;
  const newStart=`    function startGame() {\n      buildCityNav();\n      updatePrices();\n      updateDisplay();\n      showNotification('WELCOME TO NEW YORK. 30 DAYS. $20,000 OWED. GET TO WORK.');\n    }`;
  h=h.replace(oldStart,newStart);

  const oldEvent=`    function checkSpecialEvent() {\n      const events = document.getElementById('events');\n      if (Math.random() < 0.10) {\n        const eventFactor = Math.random() < 0.5 ? 2 : 0.5;\n        Object.values(goods).forEach(item => {\n          item.currentPrice = Math.max(1, Math.floor(item.currentPrice * eventFactor));\n        });\n        events.innerHTML = eventFactor === 2\n          ? '<p>🚨 Bust in town — prices just went through the roof.</p>'\n          : '<p>📉 Market flooded — prices have cratered.</p>';\n      } else {\n        events.innerHTML = '';\n      }\n    }`;
  const newEvent=`    function checkSpecialEvent() {\n      const events = document.getElementById('events');events.innerHTML='';\n      if(Math.random()<0.10){const eventFactor=Math.random()<0.5?2:0.5;Object.values(goods).forEach(item=>{item.currentPrice=Math.max(1,Math.floor(item.currentPrice*eventFactor));});showNotification(eventFactor===2?'NARCS MADE A BIG BUST! THE STREET IS DRY — PRICES ARE THROUGH THE ROOF!':'A BIG SHIPMENT HIT THE STREET! DEALERS ARE DUMPING CHEAP — PRICES GOT CRUSHED!');}\n    }`;
  h=h.replace(oldEvent,newEvent);

  const oldNotify=`    function showNotification(message, duration = 2200) {\n      const notification = document.getElementById('notification');\n      notification.textContent = message;\n      notification.style.display = 'block';\n\n      clearTimeout(showNotification.timer);\n      showNotification.timer = setTimeout(() => {\n        notification.style.display = 'none';\n      }, duration);\n    }`;
  const newNotify=`    const tickerQueue=[];let tickerBusy=false;\n    function streetify(message){const m=String(message);if(m.startsWith('Bought '))return m.replace(/^Bought /,'YOU COPPED ').replace(' for ',' FOR ').toUpperCase();if(m.startsWith('Sold '))return m.replace(/^Sold /,'YOU MOVED ').replace(' for ',' FOR ').toUpperCase();if(m.startsWith('Welcome to '))return m.replace(/^Welcome to (.+)\\. New prices are live\\.$/,'TOUCHED DOWN IN $1. NEW STREET PRICES ARE UP.').toUpperCase();if(m.startsWith('⚠️ Only '))return m.replace('⚠️ Only ','CLOCK IS BURNING — ').replace(' left.',' LEFT.').toUpperCase();if(m==='Nothing to trade right now.')return "AIN'T NOTHING TO MOVE RIGHT NOW.";if(m==='Transaction not possible.')return 'NO DEAL. CHECK YOUR CASH AND STASH.';if(m==='Game saved.')return 'GAME STASHED. COME BACK WHEN THE STREET CALLS.';if(m==='Game loaded.')return 'OLD BUSINESS IS BACK ON THE STREET.';if(m.startsWith('Not enough cash for '))return m.replace('Not enough cash for ',"YOU'RE SHORT ON CASH FOR ").toUpperCase();if(m.startsWith('You already own '))return m.replace('You already own ','YOU ALREADY GOT ').toUpperCase();return m.toUpperCase();}\n    function runTicker(){if(tickerBusy)return;const text=document.getElementById('tickerText');if(!text)return;const message=tickerQueue.length?tickerQueue.shift():"STREET'S QUIET... FOR NOW. KEEP YOUR EYES OPEN.";tickerBusy=true;text.textContent='+++ '+message+' +++';text.style.animation='none';void text.offsetWidth;text.style.animation='streetScroll '+Math.max(6,Math.min(11,message.length/9))+'s linear 1';text.onanimationend=()=>{tickerBusy=false;setTimeout(runTicker,tickerQueue.length?120:900);};}\n    function showNotification(message){tickerQueue.push(streetify(message));runTicker();}`;
  h=h.replace(oldNotify,newNotify);

  const oldMarket=`          <span class="market-name">${item.name}</span>\n          <span class="price">${money(item.currentPrice)}</span>\n          <div class="market-meta">\n            <span>Stock: <strong>${item.quantity}</strong></span>\n            <span>Sold: <strong>${item.totalSold}</strong></span>\n          </div>`;
  const newMarket=`          <span class="market-name">${item.name}</span>\n          <span class="market-stock">Stock: <strong>${item.quantity}</strong></span>\n          <span class="price">${money(item.currentPrice)}</span>\n          <div class="market-meta"><span>Sold: <strong>${item.totalSold}</strong></span></div>`;
  h=h.replace(oldMarket,newMarket);

  const css=`
html,body{height:100%;overflow:hidden}body{min-height:0}
#loadingScreen{background:#989898;color:#111;overflow:hidden}.loader-card{width:100vw!important;max-width:none!important;height:100dvh!important;display:block!important;padding:0!important}.loader-puzzle{position:fixed;inset:7px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:3px;z-index:2}.pmod,.puzzle-core{min-width:0;min-height:0;border:1px solid #363636;background:#aaa;color:#111;overflow:hidden;position:relative;border-radius:0}.pmod{--p:0%;padding:0;touch-action:manipulation;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}.pmod:after{content:'';position:absolute;left:0;bottom:0;height:4px;width:var(--p);background:#4caf50;transition:width .08s linear}.pmod.done{box-shadow:inset 0 0 0 2px #4caf50}.pmod.hit{animation:pmodHit .17s linear}.pmod span{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center}.p1{grid-column:1/4;grid-row:1/3}.p2{grid-column:4/6;grid-row:1/4}.p3{grid-column:6/9;grid-row:1/3}.p4{grid-column:1/3;grid-row:3/6}.p5{grid-column:3/4;grid-row:3/6}.p6{grid-column:6/7;grid-row:3/6}.p7{grid-column:7/9;grid-row:3/6}.p8{grid-column:1/3;grid-row:6/9}.p9{grid-column:7/9;grid-row:6/9}.puzzle-core{grid-column:3/7;grid-row:4/10;z-index:4;background:#989898;border:2px solid #222;padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:stretch}.p10{grid-column:1/3;grid-row:9/11}.p11{grid-column:7/9;grid-row:9/11}.p12{grid-column:1/3;grid-row:11/13}.p13{grid-column:3/5;grid-row:10/12}.p14{grid-column:5/7;grid-row:10/12}.p15{grid-column:7/9;grid-row:11/13}.p16{grid-column:3/5;grid-row:12/13}.p17{grid-column:5/7;grid-row:12/13}

.bar span{background:#c8c8c8;border:1px solid #444}.bar span i{display:block;height:65%;width:72%;background:#4caf50;animation:barPulse 1s ease-in-out infinite alternate}.ring span i,.orbit span i{width:44px;height:44px;border:5px solid #d9d9d9;border-top-color:#222;border-right-color:#4caf50;border-radius:50%;animation:spin var(--s,1s) linear infinite}.scan span{background:repeating-linear-gradient(0deg,#c3c3c3 0 4px,#aaa 4px 5px)}.scan span i{position:absolute;top:0;bottom:0;width:4px;background:#4caf50;box-shadow:0 0 8px #4caf50;animation:scan 1.2s linear infinite}.blocks span{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px}.blocks span i{background:#292929;animation:blink .8s steps(1) infinite}.blocks span i:nth-child(3n){background:#4caf50;animation-delay:.2s}.wave span{gap:3px;align-items:center}.wave span i{display:block;width:5px;height:75%;background:#222;transform-origin:center;animation:wave .55s ease-in-out infinite alternate}.wave span i:nth-child(even){background:#4caf50;animation-duration:.33s}.digits span{flex-direction:column;font:900 clamp(14px,3vw,24px)/1 'Courier New',monospace;gap:6px}.digits em{font-style:normal;color:#2b5c2f}.reels span{gap:8px}.reels span i{width:34px;height:34px;border:5px dotted #222;border-radius:50%;animation:spin .8s linear infinite}.reels span i:last-child{border-color:#4caf50 #222;animation-direction:reverse}.meter span{gap:6px}.meter span i,.meter span b,.meter span em{display:block;width:18%;height:75%;background:#222;transform-origin:bottom;animation:meter .7s ease-in-out infinite alternate}.meter span b{background:#4caf50;animation-duration:.42s}.meter span em{animation-duration:.95s}.packets span{border-top:2px dotted #333}.packets span i,.packets span b,.packets span em{position:absolute;top:45%;width:10px;height:10px;background:#222;animation:packet 1s linear infinite}.packets span b{animation-delay:.3s;background:#4caf50}.packets span em{animation-delay:.6s}.dots span{gap:8px}.dots span i{width:12px;height:12px;border-radius:50%;background:#222;animation:dots .6s ease-in-out infinite alternate}.dots span i:nth-child(even){background:#4caf50;animation-delay:.15s}.orbit span b{position:absolute;width:9px;height:9px;border-radius:50%;background:#4caf50;top:50%;left:50%;transform-origin:0 -24px;animation:spin .85s linear infinite}
