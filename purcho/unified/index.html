<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1615">
<title>Purcho · Shop by Supplier</title>
<style>
:root{color-scheme:dark;--bg:#0c1717;--panel:#182925;--stroke:#375447;--white:#f2f8ee;--muted:#aac0af;--lime:#c8f577;font-family:Inter,"Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 800px 420px at 60% -180px,#314e3a,transparent),var(--bg);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}[hidden]{display:none!important}
.wrap{max-width:1310px;margin:auto;padding:0 22px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid #315044}
.logo{display:flex;align-items:center;gap:10px;font-size:23px;letter-spacing:-.05em;font-weight:950;border:0;background:transparent;color:white;padding:0}
.logo i{display:grid;place-items:center;width:41px;height:41px;background:var(--lime);color:#16251b;font-style:normal;border-radius:12px;font-size:24px;transform:rotate(-6deg)}
.logo em{color:var(--lime);font-style:normal}.header-tools{display:flex;align-items:center;gap:8px}
.stores{display:flex;gap:3px;padding:4px;border:1px solid #365346;background:#172b27;border-radius:12px}
.stores button{border:0;border-radius:8px;background:none;color:#aec4b4;font-size:12px;font-weight:800;padding:10px 13px;white-space:nowrap}
.stores button.active{background:#e1ebd9;color:#162e1c}
.tools{position:relative}.tools summary{cursor:pointer;list-style:none;border:1px solid #3c5848;border-radius:12px;padding:9px 13px;background:#1c322a;font-size:19px}.tools summary::-webkit-details-marker{display:none}
.toolmenu{position:absolute;top:48px;right:0;min-width:185px;padding:5px;background:#1a3028;border:1px solid #52775b;border-radius:12px;z-index:10;box-shadow:0 15px 35px #0009}.toolmenu button{width:100%;padding:11px;background:none;color:white;text-align:left;border:0;border-radius:8px;font-size:12px}.toolmenu button:hover{background:#2d4637}
.home{padding-top:47px}.eyebrow{color:var(--lime);font-size:10px;letter-spacing:.21em;font-weight:950}.home h1{font-size:clamp(34px,5.5vw,58px);letter-spacing:-.06em;line-height:1.04;margin:12px 0}.home>p{color:var(--muted);font-size:14px;margin:0 0 28px}
.vendor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.vendor{min-height:365px;padding:20px;border-radius:22px;position:relative;display:flex;flex-direction:column;text-align:left;color:#fff;overflow:hidden;border:1px solid #4e7358;background:linear-gradient(140deg,#294638,#162c26);transition:transform .2s,border-color .2s}
.vendor:hover{transform:translateY(-2px);border-color:#c5f18f}.vendor.soda{background:linear-gradient(135deg,#264b64,#122b39);border-color:#547e9a}.vendor.bags{background:linear-gradient(140deg,#66513e,#33291f);border-color:#827058}
.vendor:before{content:"";position:absolute;right:-140px;top:-60px;width:350px;height:350px;border-radius:50%;box-shadow:0 0 0 50px #fff05,0 0 0 95px #fff05;border:1px solid #fff2}
.vendor-top{display:flex;justify-content:space-between;z-index:1}.vendor-top img{height:58px;width:80px;border-radius:10px;object-fit:contain;padding:6px;background:#f4f4ea}.go{display:grid;place-items:center;width:35px;height:35px;border:1px solid #ffffff88;background:#ffffff10;border-radius:50%;font-size:21px}
.vendor-showcase{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;min-height:175px}
.vendor-showcase>span{display:flex;width:92px;height:156px;margin:0 -9px;align-items:center;justify-content:center;transform:rotate(-12deg);filter:drop-shadow(0 12px 6px #0006)}
.vendor-showcase>span:nth-child(2){width:102px;height:179px;transform:translateY(-10px);z-index:2}
.vendor-showcase>span:nth-child(3){transform:rotate(12deg)}
.vendor-showcase img{width:100%;height:100%;object-fit:contain}.vendor-showcase svg{width:100%;height:100%}
.vendor-bottom{z-index:1}.vendor-bottom b{display:block;font-size:26px;letter-spacing:-.05em}.vendor-bottom small{display:block;color:#d9e7df;font-size:12px;margin-top:4px}.vendor-bottom .count{display:inline-block;border:1px solid #ffffff55;background:#ffffff13;padding:7px 10px;border-radius:30px;font-size:11px;font-weight:800;margin-top:13px}
.catalog{padding-top:24px}.catalog-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{width:43px;height:43px;border:1px solid #416351;border-radius:11px;background:#23392f;color:white;font-size:21px}.supplier-logo{width:54px;height:49px;object-fit:contain;background:#f2f4e8;padding:5px;border-radius:11px}
.catalog-head h1{font-size:clamp(25px,4vw,37px);margin:0;letter-spacing:-.05em}.catalog-head p{color:var(--muted);font-size:12px;margin:3px 0 0}
.searchbar{display:flex;gap:9px;margin-bottom:17px}.searchbar input{width:100%;flex:1;min-width:0;border:1px solid #486c55;border-radius:13px;padding:13px 14px;background:#152a23;color:#fff;font-size:15px;outline:none}.searchbar input::placeholder{color:#91ac9e}
.outline{border:1px solid #57765e;border-radius:12px;background:#294535;color:#eaffde;padding:10px 14px;font-weight:850;white-space:nowrap;font-size:12px}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.item{display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(150deg,#1b302b,#122420);border:1px solid #335245;border-radius:18px;min-width:0}
.item.selected{border-color:var(--lime)}
.imagebox{position:relative;width:100%;aspect-ratio:1/1.18;display:grid;place-items:center;padding:12px;border:0;border-bottom:1px solid #325447;background:radial-gradient(circle at 50% 37%,#496b51,#213b32 70%);overflow:hidden}
.item[data-vendor="soda"] .imagebox{background:radial-gradient(circle at 50% 37%,#557f91,#203b4b 72%)}
.item[data-vendor="bags"] .imagebox{background:radial-gradient(circle at 50% 37%,#816c53,#382b22 72%)}
.imagebox img{height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 13px 8px #071c1e70)}
.imagebox svg{max-width:95%;width:100%;height:100%;filter:drop-shadow(0 11px 7px #071e1d70)}
.imagebox .fallback{display:none;width:100%;height:100%}.imagebox.failed img{display:none}.imagebox.failed .fallback{display:block}
.mag{position:absolute;bottom:8px;right:8px;background:#e6ffcf;color:#1b351c;border-radius:7px;width:26px;height:26px;display:grid;place-items:center;font-size:18px;z-index:1}
.item-name{font-weight:850;font-size:13px;line-height:1.35;padding:12px 12px 4px;min-height:52px;flex:1}
.item-status{color:#94b49d;font-size:11px;padding:0 12px 8px}
.controls{display:flex;gap:6px;align-items:center;padding:8px 10px 11px}.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;padding:4px;border-radius:12px;border:1px solid #385749;background:#0d1c19;gap:4px}.stepper button{width:36px;height:36px;border-radius:8px;border:0;background:#2b4435;color:white;font-size:23px;line-height:1}.stepper .add{background:var(--lime);color:#1b3518}.stepper b{font-size:15px;font-variant-numeric:tabular-nums}.edit{width:31px;height:45px;border:0;border-radius:10px;background:#294335;color:#c4d8c7;font-size:19px}
.empty{grid-column:1/-1;text-align:center;border:1px dashed #648372;padding:45px;border-radius:18px;color:var(--muted)}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:8;padding:12px max(15px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));border-top:1px solid #6b8763;background:#13261eee;backdrop-filter:blur(15px)}
.bar-inner{max-width:1245px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.bar-inner b{display:block;font-size:16px}.bar-inner small{color:#b4cbb4;font-size:11px;display:block;margin-top:4px}
.primary{background:var(--lime);color:#1b3118;border:0;border-radius:12px;font-weight:950;padding:13px 18px;min-height:46px;white-space:nowrap}.primary:disabled{opacity:.55}
dialog{border:1px solid #63816e;border-radius:21px;background:#162a23;color:white;padding:0;width:min(635px,calc(100vw - 20px));max-height:90vh;box-shadow:0 20px 95px #000c}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #43634f}.modal-top h2{font-size:19px;margin:0}.x{height:35px;width:35px;background:#304a3c;color:white;border:1px solid #65826f;border-radius:9px;font-size:20px}
.modal-body{padding:17px 18px;overflow:auto;max-height:58vh}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:13px 18px;border-top:1px solid #456450}
.modal-actions button:not(.primary),.plainbtn{background:#294536;color:#ebf7e7;border:1px solid #58795e;border-radius:11px;padding:11px 14px;font-size:12px;font-weight:800}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #395446;font-size:13px}.rowline strong{color:var(--lime);white-space:nowrap}
.inputgroup{margin-bottom:15px}.inputgroup label{display:block;color:#afc6b0;margin-bottom:7px;font-size:12px}.inputgroup input{width:100%;background:#0c1d17;color:#fff;border:1px solid #5b7861;border-radius:10px;padding:12px;min-width:0}
.large-photo{display:flex;align-items:center;gap:4px;height:min(59vh,500px);min-height:260px;padding:8px;background:radial-gradient(circle at 50% 42%,#45644d,#18362d 75%)}
.large-photo .picture{flex:1;height:100%;min-width:0;display:grid;place-items:center}.large-photo img{max-width:95%;max-height:98%;object-fit:contain}.large-photo svg{width:92%;height:100%;filter:drop-shadow(0 18px 13px #06191b75)}.large-photo .fallback{display:none}.large-photo .picture.failed img{display:none}.large-photo .picture.failed .fallback{display:block}
.large-photo>button{width:41px;height:52px;border:1px solid #7fa28a;border-radius:12px;background:#234e3e;color:white;font-size:35px}
.picture-actions{display:flex;gap:15px;padding:15px;align-items:center;justify-content:center}.picture-actions .stepper{max-width:220px;flex:1}
.toast{pointer-events:none;position:fixed;bottom:95px;left:50%;z-index:20;transform:translate(-50%,8px);background:var(--lime);color:#173518;border-radius:13px;padding:11px 15px;font-weight:900;font-size:13px;opacity:0;transition:.18s}.toast.shown{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.wrap{padding:0 12px 110px}.home{padding-top:28px}.home h1{font-size:41px}.home>p{margin-bottom:22px}.vendor-grid{grid-template-columns:1fr;gap:11px}.vendor{min-height:225px;padding:15px 18px}.vendor-showcase{position:absolute;top:29px;right:6px;bottom:9px;width:56%;min-height:0}.vendor-showcase>span{width:79px;height:135px}.vendor-showcase>span:nth-child(2){width:86px;height:153px}.vendor-bottom{max-width:56%;margin-top:auto}.vendor-bottom b{font-size:23px}.vendor-bottom small{font-size:11px}.vendor-top img{width:64px;height:47px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{border-radius:14px}.imagebox{padding:7px;aspect-ratio:1/1.27}.item-name{font-size:12px;min-height:56px;padding:8px 8px 4px}.item-status{padding:0 8px 6px;font-size:10px}.controls{padding:6px;gap:4px}.stepper{padding:3px;gap:2px}.stepper button{width:32px;height:34px}.edit{width:25px;height:40px}.bar-inner b{font-size:14px}.bar-inner small{font-size:10px}.primary{font-size:12px}.vendor-top .go{height:30px;width:30px}.catalog-head{gap:9px}.supplier-logo{width:48px;height:44px}}
@media(max-width:400px){header{flex-wrap:wrap}.logo{font-size:21px}.logo i{width:36px;height:36px}.stores button{padding:8px 9px;font-size:11px}.vendor-showcase>span{width:60px}.vendor-showcase>span:nth-child(2){width:75px}.item-name{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Pictures are intentionally exclusive to Canada Dry. Quality and bags are fast text-only catalogs. */
.vendor-decoration{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:175px}
.vendor-decor-icon{display:grid;place-items:center;width:124px;height:124px;border:2px solid #ffffff63;border-radius:34px;background:#ffffff18;transform:rotate(-9deg);font-size:74px;line-height:1;font-weight:950;letter-spacing:-.07em;color:#eaf8df;box-shadow:12px 16px 0 #0002}
.vendor.bags .vendor-decor-icon{color:#ffe9c4}
.vendor-decor-label{font-size:10px;letter-spacing:.16em;color:#edf4e3;font-weight:950}
.products.no-photos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.products.no-photos .item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:7px;padding:13px;min-height:93px;border-radius:15px;overflow:visible}
.products.no-photos .item-name{grid-column:1;grid-row:1;padding:0;font-size:15px;min-height:0;align-self:end;line-height:1.3}
.products.no-photos .item-status{grid-column:1;grid-row:2;padding:0;align-self:start;font-size:11px;margin-top:4px}
.products.no-photos .controls{grid-column:2;grid-row:1 / 3;padding:0;gap:6px}
.products.no-photos .stepper{min-width:130px}
.products.no-photos .edit{height:42px;width:28px}
@media(max-width:720px){
 .vendor-decoration{min-height:0;position:absolute;right:20px;top:30px;bottom:25px;width:52%;gap:8px}
 .vendor-decor-icon{width:104px;height:104px;border-radius:25px;font-size:64px}
 .vendor-decor-label{font-size:8px;text-align:center}
 .products.no-photos{grid-template-columns:1fr;gap:8px}
 .products.no-photos .item{padding:12px;min-height:88px}
 .products.no-photos .item-name{font-size:14px}
 .products.no-photos .stepper{min-width:118px}
}
@media(max-width:380px){
 .products.no-photos .item-name{font-size:13px}
 .products.no-photos .stepper{min-width:105px}
 .products.no-photos .controls{gap:4px}
 .products.no-photos .item{padding:10px}
}


/* Large original supplier logos replace the makeshift vendor artwork. */
.vendor-kind{color:#eaf5e9;font-size:10px;font-weight:950;letter-spacing:.18em}
.vendor-logo-hero{position:relative;z-index:1;display:flex;flex:1;align-items:center;justify-content:center;min-height:175px;padding:17px 4px}
.vendor-logo-hero img{display:block;width:min(93%,275px);height:174px;max-width:100%;object-fit:contain;background:#fff;border-radius:20px;padding:15px;box-shadow:0 15px 34px #0005}
.vendor-top{align-items:center}.vendor-bottom{position:relative;z-index:2}
@media(max-width:720px){
 .vendor-logo-hero{position:absolute;top:45px;right:13px;bottom:17px;width:51%;padding:0;min-height:0;align-items:center;justify-content:center}
 .vendor-logo-hero img{width:100%;max-width:205px;height:128px;max-height:100%;padding:11px;border-radius:15px}
 .vendor-bottom{max-width:48%;margin-top:auto}.vendor-bottom b{overflow-wrap:anywhere}
}
@media(max-width:400px){
 .vendor-logo-hero{right:9px;width:48%}.vendor-logo-hero img{height:108px;padding:8px}
}

/* Canada Dry: compact, uncropped photo tiles for easy phone ordering. */
.item.has-picture .imagebox{
  aspect-ratio:auto;
  height:174px;
  min-height:0;
  padding:16px 19px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.item.has-picture .imagebox > img{
  display:block;
  width:auto;
  height:auto;
  max-width:90%;
  max-height:90%;
  object-fit:contain;
  object-position:center center;
  flex-shrink:1;
  filter:drop-shadow(0 5px 5px #071c1e50);
}
.item.has-picture .imagebox .fallback{max-width:90%;max-height:90%}
.item.has-picture .item-name{
  flex:0 0 auto;
  min-height:36px;
  padding:11px 11px 3px;
  line-height:1.3;
}
.item.has-picture .item-status{padding:0 11px 6px}
.item.has-picture .controls{margin-top:auto;padding:5px 9px 10px}
.item.has-picture .mag{right:7px;bottom:7px;width:24px;height:24px;font-size:16px}
.large-photo .picture > img{
  width:auto;
  height:auto;
  max-width:85%;
  max-height:90%;
  object-fit:contain;
  object-position:center center;
}
@media(max-width:720px){
  .item.has-picture .imagebox{height:130px;padding:11px 13px}
  .item.has-picture .imagebox > img{max-width:90%;max-height:85%}
  .item.has-picture .item-name{min-height:33px;padding:9px 9px 3px;font-size:12px}
  .item.has-picture .item-status{padding:0 9px 5px;font-size:10px}
  .item.has-picture .controls{padding:5px 6px 8px}
}
@media(max-width:380px){
  .item.has-picture .imagebox{height:120px;padding:10px 12px}
  .item.has-picture .item-name{font-size:11px}
}


/* Quality products with real photos appear among the compact text-only products. */
.products.no-photos .item.has-picture{
 display:flex;
 flex-direction:column;
 align-items:stretch;
 padding:0;
 overflow:hidden;
 min-height:0;
 grid-template-columns:none;
 grid-template-rows:none;
}
.products.no-photos .item.has-picture .imagebox{
 height:162px;
 padding:13px;
 width:100%;
 flex:0 0 162px;
 border-radius:0;
}
.products.no-photos .item.has-picture .item-name{
 padding:10px 12px 3px;
 min-height:0;
 font-size:13px;
 flex:1;
}
.products.no-photos .item.has-picture .item-status{padding:0 12px 8px;font-size:11px}
.products.no-photos .item.has-picture .controls{padding:7px 10px 10px}
.products.no-photos .item.has-picture .stepper{min-width:0}
@media(max-width:720px){
 .products.no-photos .item.has-picture .imagebox{height:137px;flex-basis:137px;padding:9px}
 .products.no-photos .item.has-picture .controls{padding:6px}
 .products.no-photos .item.has-picture .item-name{font-size:12px;padding:8px}
}

/* Quality shares Canada Dry's compact, consistent product-photo tile layout.
   Real photographs are used when available; other items use local vector placeholders. */
.products:not(.no-photos) .item[data-vendor="quality"] .imagebox{
 background:radial-gradient(circle at 50% 37%,#4d6b59,#244239 68%,#19322d);
}
.products:not(.no-photos) .item[data-vendor="quality"] .imagebox>svg{
 max-width:82%;
 max-height:90%;
 width:auto;
 height:90%;
 object-fit:contain;
}
.products:not(.no-photos) .item[data-vendor="quality"] .imagebox>img{
 max-width:90%;
 max-height:90%;
 width:auto;
 height:auto;
 object-fit:contain;
 object-position:center;
}
.products:not(.no-photos) .item[data-vendor="quality"] .item-name{
 overflow-wrap:break-word;
}
@media(max-width:720px){
 .products:not(.no-photos) .item[data-vendor="quality"] .imagebox>svg{
  max-width:86%;
  max-height:92%;
 }
}
</style>
</head>
<body>
<div class="wrap">
<header><button class="logo" id="goHome"><i>P</i><span>PURCHO<em>.</em></span></button><div class="header-tools"><div class="stores"><button data-store="LS" class="active">Little Silver</button><button data-store="FH">Fair Haven</button></div><details class="tools" id="tools"><summary aria-label="More options">⋯</summary><div class="toolmenu"><button data-tools="history">Order history</button><button data-tools="backup">Backup / restore</button><button data-tools="home">All vendors</button></div></details></div></header>
<main>
<section class="home" id="home"><div class="eyebrow">FAST & SIMPLE</div><h1>Pick a vendor.</h1><p>Choose your supplier, then tap the products you need.</p><div class="vendor-grid" id="vendors"></div></section>
<section class="catalog" id="catalog" hidden>
 <div class="catalog-head"><button id="back" class="back" aria-label="Back">←</button><img class="supplier-logo" id="vendorLogo" alt=""><div><h1 id="vendorName"></h1><p id="vendorDesc"></p></div></div>
 <div class="searchbar"><input id="search" type="search" placeholder="Search this supplier…" aria-label="Search products"><button id="newProduct" class="outline">＋ Item</button></div>
 <div class="products" id="products"></div>
</section>
</main>
</div>
<div id="bar" class="bar" hidden><div class="bar-inner"><div><b id="selectedCount">0 selected</b><small id="selectedStore"></small></div><button id="reviewButton" class="primary">Review order →</button></div></div>
<dialog id="photoDialog"><div class="modal-top"><h2 id="photoTitle">Picture</h2><button class="x" data-close="photoDialog" aria-label="Close">×</button></div><div class="large-photo"><button id="photoPrev" aria-label="Previous product">‹</button><div id="photoStage" class="picture"></div><button id="photoNext" aria-label="Next product">›</button></div><div class="picture-actions"><span>Quantity</span><div class="stepper"><button id="photoMinus">−</button><b id="photoQty">0</b><button class="add" id="photoPlus">+</button></div></div></dialog>
<dialog id="reviewDialog"><div class="modal-top"><h2 id="orderHeading">Order</h2><button class="x" data-close="reviewDialog">×</button></div><div class="modal-body" id="reviewItems"></div><div class="modal-actions"><button id="clear">Clear</button><button id="saveHistory">Save</button><button id="share">Share</button><button class="primary" id="copy">Copy order</button></div></dialog>
<dialog id="editDialog"><div class="modal-top"><h2 id="editHeading">Product</h2><button class="x" data-close="editDialog">×</button></div><form id="editForm"><div class="modal-body"><div class="inputgroup"><label for="editName">Item name</label><input id="editName" required maxlength="130"></div><div class="inputgroup"><label for="editUnit">Order unit</label><input id="editUnit" maxlength="30"></div><div class="inputgroup"><label for="editPrice">Price (optional)</label><input id="editPrice" type="number" min="0" step=".01"></div></div><div class="modal-actions"><button id="deleteItem" type="button" hidden>Delete</button><button type="button" data-close="editDialog">Cancel</button><button class="primary" type="submit">Save item</button></div></form></dialog>

<dialog id="backupDialog"><div class="modal-top"><h2>Backup</h2><button class="x" data-close="backupDialog">×</button></div><div class="modal-body"><p style="color:var(--muted);font-size:13px">Orders are saved on this device. Use a backup file to move them to another phone or computer.</p><button id="export" class="primary">Download backup</button><div class="inputgroup" style="margin-top:25px"><label for="restore">Restore JSON backup</label><input id="restore" type="file" accept=".json,application/json"></div></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const CATALOG=[{"id":"q0","name":"Maraschino Cherries 10oz","vendor":"quality","unit":"case","image":"products/katie-reyes-maraschino-cherries.webp?v=20261021b3"},{"id":"q1","name":"2.25oz Olives","vendor":"quality","unit":"case","image":"products/cocktail-olives.webp?v=20261021b3"},{"id":"q2","name":"Cocktail Onions 5oz","vendor":"quality","unit":"case","image":"products/cocktail-onions.webp?v=20261021b3"},{"id":"q3","name":"Coco Lopez Cream of Coconut","vendor":"quality","unit":"case"},{"id":"q4","name":"Everfresh Pineapple Juice 32oz","vendor":"quality","unit":"case","image":"products/everfresh-pineapple.webp"},{"id":"q5","name":"Eggnog 1L","vendor":"quality","unit":"case"},{"id":"q6","name":"Martinelli's Sparkling Cider","vendor":"quality","unit":"case"},{"id":"q7","name":"Ocean Spray Cranberry Juice 32oz","vendor":"quality","unit":"case","image":"products/ocean-spray-cranberry.webp"},{"id":"q8","name":"Red Solo Cups","vendor":"quality","unit":"case"},{"id":"q9","name":"Rose's Lime Juice 12oz","vendor":"quality","unit":"case","image":"products/roses-lime-juice.webp?v=20261021b3"},{"id":"q10","name":"Stirrings Bloody Mary Mix","vendor":"quality","unit":"case","image":"products/stirrings-bloody-mary.webp"},{"id":"q11","name":"Stirrings Cosmopolitan Mix","vendor":"quality","unit":"case","image":"products/stirrings-cosmopolitan.webp?v=20261021b3"},{"id":"q12","name":"Stirrings Light Margarita Mix","vendor":"quality","unit":"case","image":"products/stirrings-light-margarita.webp?v=20261021b3"},{"id":"q13","name":"Stirrings Margarita Mix","vendor":"quality","unit":"case","image":"products/stirrings-margarita.webp?v=20261021b3"},{"id":"q14","name":"Stirrings Mojito","vendor":"quality","unit":"case","image":"products/stirrings-mojito.webp?v=20261021b3"},{"id":"q15","name":"Stirrings Paloma","vendor":"quality","unit":"case","image":"products/stirrings-paloma.webp?v=20261021b3"},{"id":"q16","name":"Stirrings Sour Mix","vendor":"quality","unit":"case","image":"products/stirrings-sour-mix.webp?v=20261021b3"},{"id":"q17","name":"Stirrings Old Fashioned","vendor":"quality","unit":"case"},{"id":"q18","name":"Stirrings Dirty Martini Mix","vendor":"quality","unit":"case","image":"products/stirrings-dirty-martini.webp?v=20261021b3"},{"id":"q19","name":"Stirrings Grenadine","vendor":"quality","unit":"case","image":"products/stirrings-grenadine.webp?v=20261021b3"},{"id":"q20","name":"Stirrings Simple Syrup","vendor":"quality","unit":"case","image":"products/stirrings-simple-syrup.webp?v=20261021b3"},{"id":"q21","name":"Everfresh Orange Juice 32oz","vendor":"quality","unit":"case","image":"products/everfresh-orange.webp"},{"id":"q22","name":"Planters Peanuts 1oz","vendor":"quality","unit":"case"},{"id":"q23","name":"Planters Cashews 1.5oz","vendor":"quality","unit":"case","image":"products/planters-cashews.webp"},{"id":"q24","name":"Beer Nuts 1.75oz","vendor":"quality","unit":"case","image":"products/beer-nuts-peanuts.webp"},{"id":"q25","name":"Blue Diamond Almonds 1.5oz","vendor":"quality","unit":"case","image":"products/blue-diamond-almonds.webp"},{"id":"q26","name":"David Sunflower Seeds 1⅝oz","vendor":"quality","unit":"case","image":"products/david-sunflower-seeds.webp"},{"id":"q27","name":"Gosling's Ginger Beer 12oz Can","vendor":"quality","unit":"case","image":"products/goslings-ginger-beer.webp"},{"id":"q28","name":"Gosling's Diet Ginger Beer 12oz Can","vendor":"quality","unit":"case","image":"products/goslings-diet-ginger-beer.webp"},{"id":"q29","name":"Monster Energy Original 16oz Can","vendor":"quality","unit":"case","image":"products/monster-original.jpg"},{"id":"q30","name":"Monster Energy Zero Sugar 16oz Can","vendor":"quality","unit":"case","image":"products/monster-zero-ultra.jpg"},{"id":"q31","name":"Gatorade Lemon Lime 20oz","vendor":"quality","unit":"case","image":"products/gatorade-lemon-lime.jpg"},{"id":"q32","name":"Gatorade Fruit Punch 20oz","vendor":"quality","unit":"case","image":"products/gatorade-fruit-punch.jpg"},{"id":"q33","name":"Gatorade Cool Blue 20oz","vendor":"quality","unit":"case","image":"products/gatorade-cool-blue.jpg"},{"id":"q34","name":"Coca-Cola 12oz Can","vendor":"quality","unit":"case","image":"products/coca-cola.jpg"},{"id":"q35","name":"Diet Coke 12oz Can","vendor":"quality","unit":"case","image":"products/diet-coke.jpg"},{"id":"q36","name":"Sprite 12oz Can","vendor":"quality","unit":"case","image":"products/sprite.jpg"},{"id":"q37","name":"Red Bull Energy 8oz Can","vendor":"quality","unit":"case","image":"products/red-bull-original.jpg"},{"id":"q38","name":"Red Bull Sugarfree 8oz Can","vendor":"quality","unit":"case","image":"products/red-bull-sugarfree.jpg"},{"id":"s0","name":"10oz Club 6-Pack","vendor":"soda","image":"../club6pack.png","unit":"case"},{"id":"s1","name":"1L Club","vendor":"soda","image":"../club.png","unit":"case"},{"id":"s2","name":"10oz Tonic 6-Pack","vendor":"soda","image":"../tonic6pack.png","unit":"case"},{"id":"s3","name":"1L Tonic","vendor":"soda","image":"../tonic.png","unit":"case"},{"id":"s4","name":"1L Diet Tonic","vendor":"soda","image":"../diettonic.png","unit":"case"},{"id":"s5","name":"1L Seltzer","vendor":"soda","image":"../seltzer.png","unit":"case"},{"id":"s6","name":"1L Gingerale","vendor":"soda","image":"../ginger.png","unit":"case"},{"id":"s7","name":"10oz Gingerale 6-Pack","vendor":"soda","image":"../ginger6pack.png","unit":"case"},{"id":"b0","name":"Pint","vendor":"bags","price":17.75,"unit":"case"},{"id":"b1","name":"Quart","vendor":"bags","price":23.47,"unit":"case"},{"id":"b2","name":"#12","vendor":"bags","price":26.68,"unit":"case"},{"id":"b3","name":"#16","vendor":"bags","price":32.75,"unit":"case"},{"id":"b4","name":"#20","vendor":"bags","price":33.77,"unit":"case"},{"id":"b5","name":"#1/2","vendor":"bags","price":64.99,"unit":"case"}];
const META={quality:{name:"Quality",description:"Mixers, garnishes, drinks & snacks",logo:"../qua.jpeg",samples:["q0","q10","q37"]},soda:{name:"Canada Dry",description:"Club soda, tonic & ginger ale",logo:"../can.jpeg",samples:["s0","s7","s3"]},bags:{name:"Imperial Dade",description:"Shopping bags · CC2430",logo:"../IMG_3458.jpeg",samples:["b0","b3","b5"]}};
const KEY="purcho-unified-orderdesk-v2";
const blank=()=>({qty:{},stock:{},par:{},notes:""});
const fresh=()=>({version:2,stores:{LS:blank(),FH:blank()},prices:{},favorites:[],customs:[],overrides:{},history:[],layout:"visual"});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===2&&x.stores&&x.stores.LS&&x.stores.FH)return Object.assign(fresh(),x);}catch(e){}return fresh();}
let data=load(),store="LS",vendor=null,search="",preview=null,editing=null;
const $=x=>document.querySelector(x);
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const all=()=>CATALOG.concat(data.customs||[]).map(p=>Object.assign({},p,data.overrides&&data.overrides[p.id]||{}));
const get=id=>all().find(p=>p.id===id);
const st=()=>data.stores[store];
const qty=id=>Math.max(0,Math.floor(Number(st().qty[id])||0));
const value=p=>Object.prototype.hasOwnProperty.call(data.prices||{},p.id)?data.prices[p.id]:(typeof p.price==="number"?p.price:null);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notify("Could not save locally");}}
let toastTimeout;function notify(msg){const t=$("#toast");t.textContent=msg;t.classList.add("shown");clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove("shown"),2600);}
function art(p){
 const n=p.name.toLowerCase();const type=p.vendor==="bags"?"bag":/solo cups/.test(n)?"cups":/cherr|olive|onion/.test(n)?"jar":/peanut|cashew|almond|beer nuts|sunflower/.test(n)?"pouch":/ can\b/.test(n)?"can":/everfresh|ocean spray/.test(n)?"juice":"bottle";
 let col="#b69bd4",dark="#6d4e87";
 if(/cherr|cran|grenadine|cola/.test(n)){col="#d2475d";dark="#773544";}else if(/olive|lime|mojito|sprite/.test(n)){col="#9ace6c";dark="#517c44";}else if(/pineapple|orange|marg|cider/.test(n)){col="#efba61";dark="#a7783c";}else if(/red bull|blue/.test(n)){col="#73afdf";dark="#386c9d";}else if(p.vendor==="bags"){col="#d4b285";dark="#80603c";}
 const id="grad"+p.id.replace(/[^a-z0-9]/gi,"");
 const shapes={
 bottle:'<rect x="101" y="34" width="38" height="38" rx="6" fill="'+dark+'"/><path d="M99 69h42l10 27c25 10 30 28 30 51v117c0 26-11 38-33 38H92c-22 0-33-12-33-38V147c0-23 5-41 30-51z" fill="url(#'+id+')" stroke="#f2e8e3" stroke-width="3"/>',
 can:'<rect x="65" y="60" width="110" height="243" rx="16" fill="url(#'+id+')" stroke="#dbe0db" stroke-width="3"/><ellipse cx="120" cy="62" rx="52" ry="10" fill="#e3e5e3"/><ellipse cx="120" cy="62" rx="16" ry="4" fill="#859996"/>',
 jar:'<rect x="66" y="60" width="108" height="33" rx="8" fill="'+dark+'"/><rect x="59" y="91" width="122" height="212" rx="22" fill="url(#'+id+')" stroke="#f4efe1" stroke-width="3"/>',
 bag:'<path d="M58 113l62-54 62 54v188H58z" fill="'+dark+'"/><path d="M73 105l47-39 47 39v196H73z" fill="url(#'+id+')" stroke="#f4e1c0" stroke-width="3"/>',
 pouch:'<path d="M68 44h104l15 32-10 224H63L53 76z" fill="url(#'+id+')" stroke="#f3e1bb" stroke-width="3"/><path d="M58 80h124M67 283h106" stroke="'+dark+'" stroke-width="9"/>',
 juice:'<path d="M75 66h87l15 27v207H63V93z" fill="url(#'+id+')" stroke="#f5f0dc" stroke-width="3"/><path d="M75 66l-12 27h114l-15-27" fill="'+dark+'"/>',
 cups:'<path d="M68 102h108l-18 201H88z" fill="url(#'+id+')" stroke="#f5e9e5" stroke-width="3"/><rect x="63" y="96" width="118" height="13" rx="6" fill="#e9efec"/>'
 };
 const words=p.name.replace(/\b(32oz|20oz|16oz|12oz|10oz|8oz|5oz|2\.25oz|1L|Can|Mix|Juice)\b/gi,"").trim().split(/\s+/);
 let lines=[],line="";words.forEach(w=>{if(line&&(line+" "+w).length>14){lines.push(line);line=w;}else line=(line+" "+w).trim();});if(line)lines.push(line);
 const text=lines.slice(0,3).map((x,i)=>'<text x="120" y="'+(183+20*i)+'" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="'+(x.length>11?10:12)+'" fill="#26382e">'+esc(x.toUpperCase())+'</text>').join("");
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" role="img" aria-label="'+esc(p.name)+' illustration"><defs><linearGradient id="'+id+'"><stop stop-color="'+dark+'"/><stop offset=".33" stop-color="'+col+'"/><stop offset=".7" stop-color="'+col+'"/><stop offset="1" stop-color="'+dark+'"/></linearGradient></defs><ellipse cx="120" cy="313" rx="66" ry="9" fill="#000" opacity=".15"/>'+shapes[type]+'<rect x="72" y="145" width="96" height="115" rx="8" fill="#f3f1df" stroke="'+dark+'" stroke-width="2"/><rect x="77" y="150" width="86" height="17" fill="'+dark+'"/><text x="120" y="162" text-anchor="middle" font-family="Arial" fill="white" font-size="8" font-weight="bold">PRODUCT</text>'+text+'</svg>';
}
function graphic(p){return p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'"><span class="fallback">'+art(p)+'</span>':art(p);}
function total(v){return all().filter(p=>p.vendor===v).reduce((a,p)=>a+qty(p.id),0);}
function showHome(){vendor=null;$("#home").hidden=false;$("#catalog").hidden=true;$("#bar").hidden=true;renderHome();window.scrollTo(0,0);}
function renderHome(){
 document.querySelectorAll("[data-store]").forEach(b=>b.classList.toggle("active",b.dataset.store===store));
 $("#vendors").innerHTML=Object.keys(META).map(v=>{
  const m=META[v],count=all().filter(p=>p.vendor===v).length;
  return '<button type="button" class="vendor '+v+'" data-vendor="'+v+'" aria-label="Open '+esc(m.name)+'">'+
   '<span class="vendor-top"><span class="vendor-kind">SUPPLIER</span><span class="go" aria-hidden="true">↗</span></span>'+
   '<span class="vendor-logo-hero"><img src="'+esc(m.logo)+'" alt="'+esc(m.name)+' logo" loading="eager"></span>'+
   '<span class="vendor-bottom"><b>'+esc(m.name)+'</b><small>'+esc(m.description)+'</small><span class="count">'+count+' products'+(total(v)?" · "+total(v)+" chosen":"")+'</span></span></button>';
 }).join("");
}
function choose(v){if(!META[v])return;vendor=v;search="";$("#search").value="";$("#home").hidden=true;$("#catalog").hidden=false;$("#bar").hidden=false;renderCatalog();window.scrollTo(0,0);}
function visible(){return all().filter(p=>p.vendor===vendor&&p.name.toLowerCase().includes(search));}
function renderCatalog(){
 if(!vendor)return;
 document.querySelectorAll("[data-store]").forEach(b=>b.classList.toggle("active",b.dataset.store===store));
 $("#vendorName").textContent=META[vendor].name;$("#vendorDesc").textContent=META[vendor].description;$("#vendorLogo").src=META[vendor].logo;
 const ps=visible();
 $("#products").classList.toggle("no-photos",vendor==="bags");
 $("#products").innerHTML=ps.length?ps.map(p=>{
  const n=qty(p.id),photo=vendor!=="bags"||!!p.image;
  const picture=photo?'<button type="button" class="imagebox" data-picture="'+p.id+'" aria-label="Enlarge '+esc(p.name)+'">'+graphic(p)+'<span class="mag">⤢</span></button>':'';
  return '<article class="item'+(n?" selected":"")+(photo?' has-picture':' text-only')+'" data-vendor="'+vendor+'">'+picture+'<div class="item-name">'+esc(p.name)+'</div><div class="item-status">'+(n?"✓ Added to order":"Tap + to add")+'</div><div class="controls"><div class="stepper"><button type="button" data-change="-1" data-id="'+p.id+'" aria-label="Decrease '+esc(p.name)+'">−</button><b>'+n+'</b><button type="button" class="add" data-change="1" data-id="'+p.id+'" aria-label="Increase '+esc(p.name)+'">+</button></div><button type="button" class="edit" data-edit="'+p.id+'" aria-label="Edit '+esc(p.name)+'">⋯</button></div></article>';
 }).join(""):'<div class="empty">No matching products</div>';
 $("#selectedCount").textContent=total(vendor)+" selected";$("#selectedStore").textContent=META[vendor].name+" · "+(store==="LS"?"Little Silver":"Fair Haven");$("#reviewButton").disabled=!total(vendor);
}
function change(id,step){st().qty[id]=Math.min(9999,Math.max(0,qty(id)+step));save();renderCatalog();if(preview===id&&$("#photoDialog").open)$("#photoQty").textContent=qty(id);}
function showPhoto(id){const p=get(id);if(!p||!(p.vendor==="soda"||p.image))return;preview=id;drawPhoto();$("#photoDialog").showModal();}
function drawPhoto(){const p=get(preview);if(!p)return;$("#photoTitle").textContent=p.name;$("#photoStage").innerHTML=graphic(p);$("#photoQty").textContent=qty(p.id);}
function movePhoto(d){let ps=visible();if(!ps.some(p=>p.id===preview))ps=all().filter(p=>p.vendor===vendor);if(!ps.length)return;preview=ps[(ps.findIndex(p=>p.id===preview)+d+ps.length)%ps.length].id;drawPhoto();}
function chosen(){return all().filter(p=>p.vendor===vendor&&qty(p.id)>0);}
function orderText(){return "PURCHO — "+META[vendor].name.toUpperCase()+"\n"+(store==="LS"?"LITTLE SILVER":"FAIR HAVEN")+"\n\n"+chosen().map(p=>qty(p.id)+" x "+p.name).join("\n")+"\n";}
function showReview(){if(!chosen().length)return;$("#orderHeading").textContent=META[vendor].name+" order";$("#reviewItems").innerHTML=chosen().map(p=>'<div class="rowline"><span>'+esc(p.name)+'</span><strong>× '+qty(p.id)+'</strong></div>').join("")+'<p style="color:#a7bcad;font-size:12px">Copy or share this draft to place your order. Nothing is sent automatically.</p>';$("#reviewDialog").showModal();}
async function copyText(t){try{await navigator.clipboard.writeText(t);notify("Order copied");}catch(e){const area=document.createElement("textarea");area.value=t;document.body.appendChild(area);area.select();const ok=document.execCommand("copy");area.remove();notify(ok?"Order copied":"Copy unavailable — try Share");}}
function edit(id){editing=id;const p=id?get(id):null;$("#editHeading").textContent=p?"Edit item":"New item";$("#editName").value=p?p.name:"";$("#editName").readOnly=!!(p&&!id.startsWith("custom-"));$("#editUnit").value=p?p.unit||"case":"case";const pr=p?(data.prices[p.id]!==undefined?data.prices[p.id]:p.price):null;$("#editPrice").value=pr==null?"":pr;$("#deleteItem").hidden=!(p&&id.startsWith("custom-"));$("#editDialog").showModal();}
function showHistory(){const h=data.history||[];$("#historyItems").innerHTML=h.length?h.map((o,i)=>'<div class="rowline"><div><b>'+esc(META[o.vendor]?META[o.vendor].name:"Order")+'</b><div style="font-size:11px;color:#b4c3b1">'+new Date(o.date).toLocaleString()+'</div></div><button class="plainbtn" data-history="'+i+'">Copy</button></div>').join(""):'<p>No saved orders.</p>';$("#historyDialog").showModal();}
function download(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="purcho-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.vendor){choose(b.dataset.vendor);return;}if(b.dataset.store){store=b.dataset.store;vendor?renderCatalog():renderHome();return;}if(b.dataset.change){change(b.dataset.id,Number(b.dataset.change));return;}if(b.dataset.picture){showPhoto(b.dataset.picture);return;}if(b.dataset.edit){edit(b.dataset.edit);return;}if(b.dataset.close){$("#"+b.dataset.close).close();return;}if(b.dataset.history!==undefined){const h=data.history[Number(b.dataset.history)];if(h)copyText(h.text);return;}if(b.dataset.tools){$("#tools").open=false;if(b.dataset.tools==="home")showHome();if(b.dataset.tools==="history")showHistory();if(b.dataset.tools==="backup")$("#backupDialog").showModal();}});
$("#goHome").addEventListener("click",showHome);$("#back").addEventListener("click",showHome);
$("#search").addEventListener("input",e=>{search=e.target.value.trim().toLowerCase();renderCatalog();});
$("#newProduct").addEventListener("click",()=>edit(null));$("#reviewButton").addEventListener("click",showReview);
$("#photoPrev").addEventListener("click",()=>movePhoto(-1));$("#photoNext").addEventListener("click",()=>movePhoto(1));$("#photoPlus").addEventListener("click",()=>change(preview,1));$("#photoMinus").addEventListener("click",()=>change(preview,-1));
$("#copy").addEventListener("click",()=>{copyText(orderText());$("#reviewDialog").close();});
$("#share").addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:"Purcho order",text:orderText()});}catch(e){if(e.name!=="AbortError")notify("Share unavailable");}}else copyText(orderText());});
$("#clear").addEventListener("click",()=>{if(!confirm("Clear this vendor order?"))return;for(const p of all().filter(p=>p.vendor===vendor))delete st().qty[p.id];save();$("#reviewDialog").close();renderCatalog();notify("Order cleared");});
$("#saveHistory").addEventListener("click",()=>{const ps=chosen();data.history.unshift({id:"order-"+Date.now(),date:new Date().toISOString(),store,vendor,qty:Object.fromEntries(ps.map(p=>[p.id,qty(p.id)])),text:orderText(),units:total(vendor),lines:ps.length,known:0});data.history=data.history.slice(0,120);save();notify("Order saved");});
$("#editForm").addEventListener("submit",e=>{e.preventDefault();const name=$("#editName").value.trim();if(!name)return;const unit=$("#editUnit").value.trim()||"case",v=$("#editPrice").value;if(v!==""&&(!Number.isFinite(Number(v))||Number(v)<0)){notify("Invalid price");return;}const id=editing||"custom-"+Date.now();if(!editing)data.customs.push({id,name,vendor,unit});else if(id.startsWith("custom-")){const p=data.customs.find(p=>p.id===id);if(p){p.name=name;p.unit=unit;}}else data.overrides[id]=Object.assign({},data.overrides[id]||{},{unit});data.prices[id]=v===""?null:Math.round(Number(v)*100)/100;save();$("#editDialog").close();renderCatalog();notify("Item saved");});
$("#deleteItem").addEventListener("click",()=>{if(!editing||!editing.startsWith("custom-")||!confirm("Delete custom item?"))return;data.customs=data.customs.filter(p=>p.id!==editing);for(const x of Object.values(data.stores))delete x.qty[editing];save();$("#editDialog").close();renderCatalog();});
$("#export").addEventListener("click",download);
$("#restore").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error("Backup too large");const x=JSON.parse(await file.text());if(x.version!==2||!x.stores||!x.stores.LS||!x.stores.FH)throw Error("Invalid backup");if(!confirm("Replace your stored data with this backup?"))return;data=Object.assign(fresh(),x);save();$("#backupDialog").close();vendor?renderCatalog():renderHome();notify("Backup restored");}catch(err){notify(err.message)}finally{e.target.value="";}});
document.addEventListener("error",e=>{if(e.target.tagName==="IMG"&&e.target.parentElement&&e.target.parentElement.querySelector(".fallback"))e.target.parentElement.classList.add("failed");},true);
document.addEventListener("keydown",e=>{if(!$("#photoDialog").open)return;if(e.key==="ArrowLeft")movePhoto(-1);if(e.key==="ArrowRight")movePhoto(1);});
window.addEventListener("storage",e=>{if(e.key===KEY){data=load();vendor?renderCatalog():renderHome();}});
showHome();
</script>
</body></html>
