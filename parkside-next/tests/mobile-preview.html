<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile menu checks</title><style>body{margin:16px;background:#102725;color:#efe6cc;font:14px system-ui}button,select{font:inherit;padding:10px;margin:4px;min-height:44px}iframe{display:block;border:3px solid #c4ac69;max-width:100%;margin-top:12px;background:#17332f}p{max-width:680px}</style>
<h1>Mobile menu checks</h1><p>Production menu markup, styles, touch guard and game logic. Test wallet only; refresh resets it. No WebGL required.</p><label>Screen <select id="size"><option value="390,664">iPhone portrait 390 × 664</option><option value="320,568">Small phone 320 × 568</option><option value="844,390">iPhone landscape 844 × 390</option></select></label><button id="store">Mint Mart</button><button id="casino">Casino</button><iframe id="phone" title="Mobile game menu" width="390" height="664" src="mobile-menu-fixture.html?menu=shop"></iframe>
<script>const phone=document.getElementById('phone');document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');phone.width=w;phone.height=h;};for(const id of ['store','casino'])document.getElementById(id).onclick=()=>phone.src='mobile-menu-fixture.html?menu='+(id==='store'?'shop':'casino');</script></html>
