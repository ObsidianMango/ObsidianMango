<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090f12">
<meta name="description" content="Break three chalk rituals and run for the street in a first-person subway horror game.">
<title>Last Light Below</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --ink: #e1e9e5;
    --dim: #a9bbb9;
    --brass: #ffd391;
    --danger: #ffa085;
    --line: #a4bdb550;
    --panel: #0d171bea;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --sans: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --top: max(16px, env(safe-area-inset-top));
    --left: max(18px, env(safe-area-inset-left));
    --right: max(18px, env(safe-area-inset-right));
    --bottom: max(14px, env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { background: #080d10; color: var(--ink); font-family: var(--mono); user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid #ffe1b1; outline-offset: 4px; }
  [hidden] { display: none !important; }
  #world, #lens, #hud, #end { position: fixed; inset: 0; width: 100%; height: 100%; }
  #world { display: block; outline: none; cursor: grab; touch-action: none; }
  #world:active { cursor: grabbing; }
  #lens {
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 43%, transparent 30%, #04080b29 66%, #040709a9 100%);
  }
  #lens::after {
    position: absolute; inset: 0; content: ""; opacity: .12;
    background: repeating-linear-gradient(0deg, #020609 0 1px, transparent 1px 4px);
  }
  #hud { pointer-events: none; }
  .masthead {
    position: absolute; left: var(--left); top: var(--top);
    max-width: min(510px, calc(100vw - 150px)); padding: 8px 12px 9px;
    border-left: 2px solid #d4aa73;
    background: linear-gradient(90deg, #081116db, #08111677 88%, transparent);
    text-shadow: 0 1px 3px #000;
  }
  h1 { margin: 0 0 5px; font: 850 clamp(15px, 2.6vw, 25px)/1 var(--sans); letter-spacing: .14em; }
  #objective { margin: 0; font-size: clamp(10px, 1.5vw, 13px); line-height: 1.35; color: var(--brass); }
  #location { display: block; margin-top: 5px; color: var(--dim); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
  .is-chase .masthead { border-color: #ff896b; }
  .is-chase #objective { color: var(--danger); }
  .meters { position: absolute; top: var(--top); right: var(--right); display: flex; align-items: start; gap: 7px; }
  .ritual-meter, #sound { min-height: 42px; border: 1px solid var(--line); background: var(--panel); }
  .ritual-meter { padding: 6px 11px 8px; color: var(--dim); }
  .ritual-meter > span { display: block; letter-spacing: .13em; font-size: 9px; }
  .lights { display: flex; gap: 9px; padding: 7px 2px 1px; }
  .lights i { width: 7px; height: 7px; border: 1px solid #87a29f; transform: rotate(45deg); }
  .lights i.done { background: var(--brass); border-color: var(--brass); box-shadow: 0 0 8px #ffc26688; }
  .lights i.next { border-color: var(--brass); }
  #sound { width: 44px; height: 44px; pointer-events: auto; font-size: 18px; line-height: 1; }
  #sound[aria-pressed="true"] { color: var(--dim); }
  #aim {
    position: absolute; width: 27px; height: 27px; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, #ffd48c var(--charge, 0deg), transparent 0);
    border-radius: 100%;
    -webkit-mask: radial-gradient(transparent 57%, #fff 61%);
    mask: radial-gradient(transparent 57%, #fff 61%);
  }
  #dot {
    position: absolute; width: 5px; height: 5px; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    background: #f0f7ec; box-shadow: 0 0 0 1px #000a, 0 0 7px #000;
  }
  #dot.target { background: var(--brass); box-shadow: 0 0 9px var(--brass); }
  #hint {
    position: absolute; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    width: max-content; max-width: 90vw; text-align: center; padding: 5px 9px;
    background: #080e12d9; color: #ffe2ae; font-size: 11px; line-height: 1.35;
  }
  #caption {
    position: absolute; left: 50%; top: 68%; transform: translateX(-50%);
    max-width: 85vw; width: max-content; padding: 7px 11px; background: #080e12db;
    color: #e2ece8; text-align: center; font-size: clamp(11px, 2vw, 14px);
  }
  .kit {
    position: absolute; left: 50%; bottom: var(--bottom); transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 12px); text-align: center;
  }
  .readout { margin-bottom: 6px; font-size: 10px; letter-spacing: .075em; text-shadow: 0 1px 5px #000, 0 1px 5px #000; }
  #power-name { color: var(--brass); font-weight: 700; }
  #power-detail { color: #d0dcda; }
  .power-row { display: flex; justify-content: center; gap: 4px; }
  .power {
    position: relative; width: 52px; min-width: 0; height: 46px;
    pointer-events: auto; border: 1px solid var(--line); background: var(--panel);
    color: var(--power); box-shadow: 0 4px 16px #02070a5c;
    touch-action: manipulation;
  }
  .power[aria-pressed="true"] { border-color: var(--power); background: #26302df2; }
  .power[aria-pressed="true"] span { text-shadow: 0 0 9px var(--power); }
  .power span { font: 24px/1 var(--sans); }
  .power kbd { position: absolute; right: 5px; top: 4px; font: 9px var(--mono); color: #b5c5c4; }
  .power::after {
    position: absolute; content: ""; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(to right, var(--power) var(--ready, 100%), transparent 0);
    opacity: .75;
  }
  .power.cooling span { opacity: .53; }
  #controls { margin: 7px 0 0; color: #d1ddda; text-shadow: 0 1px 4px #000, 0 1px 4px #000; font-size: 10px; line-height: 1.3; }
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #controls, body.touch .power kbd { display: none; }
  #stick, #cast, #ward {
    position: absolute; pointer-events: auto; touch-action: none; border: 1px solid #c4d7ce8a;
    background: #101e25b8; font-size: 11px;
  }
  #stick {
    left: var(--left); bottom: calc(var(--bottom) + 76px);
    border-radius: 100%; width: 102px; height: 102px;
  }
  #stick > span {
    position: absolute; left: calc(50% - 17px); top: calc(50% - 17px);
    width: 34px; height: 34px; border-radius: 100%; background: #a7bfbe79;
    border: 1px solid #c3d2cdbb; pointer-events: none;
  }
  #cast {
    right: var(--right); bottom: calc(var(--bottom) + 78px); min-width: 69px; height: 65px;
    border-radius: 50%; color: var(--brass); border-color: #ffd291a0; font-weight: 700;
  }
  #cast[aria-pressed="true"] { background: #4a3927e6; }
  #ward {
    right: calc(var(--right) + 9px); bottom: calc(var(--bottom) + 152px);
    min-width: 51px; min-height: 40px; border-color: #ffd29170; color: var(--brass);
  }
  #status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #10191bf5; border: 1px solid var(--line); padding: 12px 16px;
    max-width: 88vw; text-align: center; font-size: 13px; line-height: 1.5;
  }
  #end { display: grid; place-items: center; padding: 16px; background: #070d11b5; }
  .finish { width: min(360px, 100%); border: 1px solid var(--line); border-top: 2px solid var(--brass); padding: 24px; background: #0d171bed; }
  .finish h2 { margin: 0; font: 850 25px/1.1 var(--sans); letter-spacing: .095em; }
  .finish p { margin: 12px 0 20px; font-size: 13px; line-height: 1.5; color: var(--dim); }
  #replay { min-height: 44px; border: 1px solid var(--brass); background: #2a231a; color: #ffe0aa; padding: 0 13px; }
  @media (max-width: 530px) {
    :root { --left: max(9px, env(safe-area-inset-left)); --right: max(9px, env(safe-area-inset-right)); }
    .power-row { gap: 2px; }
    .power { width: min(48px, calc((100vw - 24px) / 7)); height: 44px; }
    .power span { font-size: 22px; }
    .readout { font-size: 9px; letter-spacing: 0; }
    #caption { top: 63%; }
  }
  @media (max-height: 430px) and (pointer: coarse) {
    #stick { bottom: var(--bottom); }
    #cast { bottom: var(--bottom); }
    #ward { bottom: calc(var(--bottom) + 72px); }
  }
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="First-person subway tunnel. Drag to look around."></canvas>
<div id="lens" aria-hidden="true"></div>
<div id="hud">
  <header class="masthead">
    <h1>LAST LIGHT BELOW</h1>
    <p id="objective" aria-live="polite">Break the platform ritual</p>
    <span id="location">Canal St · closed platform</span>
  </header>
  <div class="meters">
    <div id="ritual-meter" class="ritual-meter" role="img" aria-label="0 of 3 rituals broken">
      <span>RITUALS</span><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <button id="sound" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute sound">♪</button>
  </div>
  <div id="aim" aria-hidden="true"></div><div id="dot" aria-hidden="true"></div>
  <div id="hint" hidden></div><div id="caption" aria-live="polite" hidden></div>
  <div class="kit" id="kit" hidden>
    <div class="readout"><span id="power-name">Light of Christ</span><span id="power-detail"></span></div>
    <div class="power-row" id="power-row" role="group" aria-label="Crucifix powers"></div>
    <p id="controls">WASD move · Drag to look · Hold F to cast · Shift sprint · Q ward</p>
  </div>
  <div id="touch" hidden>
    <div id="stick" role="img" aria-label="Move joystick. Push to the edge to sprint."><span></span></div>
    <button id="ward" type="button">WARD</button>
    <button id="cast" type="button" aria-pressed="false">CAST</button>
  </div>
  <div id="status" role="status">Entering the tunnels…</div>
</div>
<div id="end" hidden>
  <section class="finish" aria-labelledby="exit-title">
    <h2 id="exit-title">STREET LEVEL</h2>
    <p id="end-detail">Three rituals broken. You made it out.</p>
    <button id="replay" type="button">Play again</button>
  </section>
</div>

<script type="module">
let THREE;
const status = document.getElementById('status');
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  startGame();
} catch (error) {
  status.textContent = 'The tunnels could not load. Check that WebGL is enabled and reload.';
  console.error(error);
}

function startGame() {
  const ui = Object.fromEntries([
    'world', 'lens', 'hud', 'objective', 'location', 'ritual-meter', 'sound', 'aim', 'dot',
    'hint', 'caption', 'kit', 'power-row', 'power-name', 'power-detail', 'touch', 'stick',
    'cast', 'ward', 'end', 'end-detail', 'replay'
  ].map((id) => [id, document.getElementById(id)]));
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touchDevice = matchMedia('(pointer: coarse)').matches;
  let touchControls = touchDevice;
  const scene = new THREE.Scene();
  const fogColor = new THREE.Color(0x1a2930);
  scene.background = fogColor.clone();
  scene.fog = new THREE.FogExp2(fogColor, 0.043);
  const camera = new THREE.PerspectiveCamera(63, 1, 0.035, 86);
  camera.rotation.order = 'YXZ';
  const renderer = new THREE.WebGLRenderer({
    canvas: ui.world, antialias: !touchDevice, powerPreference: 'high-performance'
  });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.17;
  scene.add(camera);

  const TAU = Math.PI * 2;
  const clamp = THREE.MathUtils.clamp;
  const lerp = THREE.MathUtils.lerp;
  const vector = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const square = (value) => value * value;
  const distance = (x, z, a, b) => Math.hypot(x - a, z - b);
  const choice = (list, random) => list[Math.floor(random() * list.length)];
  function seeded(seed) {
    return () => {
      seed = (1664525 * seed + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }
  const sceneryRandom = seeded(71321);
  const rand = (low, high) => lerp(low, high, sceneryRandom());

  function paint(width, height, draw) {
    const surface = document.createElement('canvas');
    surface.width = width;
    surface.height = height;
    const pen = surface.getContext('2d');
    draw(pen, width, height);
    const texture = new THREE.CanvasTexture(surface);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return texture;
  }

  function speckle(pen, w, h, random, count, pale = 0.2) {
    for (let i = 0; i < count; i++) {
      const size = random() < .04 ? 6 * random() + 2 : random() * 2 + .5;
      pen.fillStyle = random() < .4 ? 'rgba(226,226,206,' + random() * pale + ')' :
        'rgba(11,16,13,' + random() * .31 + ')';
      pen.fillRect(random() * w, random() * h, size, size * (.45 + random()));
    }
  }

  function stain(pen, x, y, rx, ry, color) {
    pen.save();
    pen.translate(x, y);
    pen.scale(rx, ry);
    const tint = pen.createRadialGradient(0, 0, .1, 0, 0, 1);
    tint.addColorStop(0, color);
    tint.addColorStop(1, 'transparent');
    pen.fillStyle = tint;
    pen.fillRect(-1, -1, 2, 2);
    pen.restore();
  }

  const tileMap = paint(512, 256, (pen, w, h) => {
    const random = seeded(19);
    pen.fillStyle = '#373b33';
    pen.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 64) {
      for (let x = 0; x < w; x += 128) {
        const light = 139 + Math.floor(random() * 49);
        const glaze = pen.createLinearGradient(x, y, x, y + 64);
        glaze.addColorStop(0, 'rgb(' + (light + 17) + ',' + (light + 14) + ',' + light + ')');
        glaze.addColorStop(.14, 'rgb(' + (light + 11) + ',' + (light + 8) + ',' + (light - 3) + ')');
        glaze.addColorStop(1, 'rgb(' + (light - 5) + ',' + (light - 8) + ',' + (light - 18) + ')');
        pen.fillStyle = glaze;
        pen.fillRect(x + 2, y + 2, 123, 59);
        pen.fillStyle = '#e2e0c664';
        pen.fillRect(x + 4, y + 3, 118, 1);
        if (random() < .74) {
          pen.beginPath();
          pen.moveTo(x + random() * 110, y + 61);
          let startX = x + random() * 56 + 7;
          for (let j = 0; j < 7; j++) {
            pen.lineTo(startX, y + 60 - j * 9);
            startX += (random() - .4) * 14;
          }
          pen.strokeStyle = '#3d382f80';
          pen.lineWidth = 1.2;
          pen.stroke();
        }
      }
    }
    speckle(pen, w, h, random, 26000, .23);
    for (let i = 0; i < 45; i++) {
      stain(pen, random() * w, random() * h, 6 + random() * 23, 11 + random() * 76, '#3d421f92');
    }
  });

  const concreteMap = paint(512, 512, (pen, w, h) => {
    const random = seeded(26);
    pen.fillStyle = '#77776c';
    pen.fillRect(0, 0, w, h);
    for (let i = 0; i < 370; i++) {
      stain(pen, random() * w, random() * h, 6 + random() * 74, 3 + random() * 37,
        random() < .5 ? '#202d2190' : '#c0ac845f');
    }
    speckle(pen, w, h, random, 42500, .19);
    pen.strokeStyle = '#272f2a77';
    pen.lineWidth = 2;
    for (let i = 0; i < 11; i++) {
      const x = random() * w;
      const y = random() * h;
      pen.beginPath();
      pen.moveTo(x, y);
      for (let j = 1; j < 5; j++) pen.lineTo(x + j * 13, y + j * 9 + random() * 15);
      pen.stroke();
    }
  });

  const gravelMap = paint(512, 512, (pen, w, h) => {
    const random = seeded(141);
    pen.fillStyle = '#282c2a';
    pen.fillRect(0, 0, w, h);
    for (let i = 0; i < 7400; i++) {
      const x = random() * w;
      const y = random() * h;
      const size = 1 + random() * 8;
      const light = 24 + Math.floor(random() * 58);
      pen.fillStyle = 'rgb(' + light + ',' + (light + 2) + ',' + (light - 4) + ')';
      pen.beginPath();
      pen.moveTo(x, y - size);
      pen.lineTo(x + size, y - size * .28);
      pen.lineTo(x + size * .56, y + size * .68);
      pen.lineTo(x - size * .83, y + size * .58);
      pen.closePath();
      pen.fill();
      pen.strokeStyle = '#b1b4a737';
      pen.lineWidth = .8;
      pen.beginPath();
      pen.moveTo(x - size * .7, y + size * .4);
      pen.lineTo(x, y - size);
      pen.lineTo(x + size, y - size * .28);
      pen.stroke();
    }
  });

  const canvasFabric = paint(512, 256, (pen, w, h) => {
    const random = seeded(198);
    pen.fillStyle = '#9a8c73';
    pen.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 31) {
      pen.fillStyle = '#536677';
      pen.fillRect(x, 0, 5, h);
      pen.fillStyle = '#88745b';
      pen.fillRect(x + 6, 0, 2, h);
    }
    for (let y = 3; y < h; y += 11) {
      pen.fillStyle = '#c2b38c32';
      pen.fillRect(0, y, w, 2);
    }
    for (let i = 0; i < 37; i++) {
      stain(pen, random() * w, random() * h, 7 + random() * 66, 5 + random() * 27, '#3b281a91');
    }
    speckle(pen, w, h, random, 12500);
  });

  const woodMap = paint(256, 512, (pen, w, h) => {
    const random = seeded(986);
    pen.fillStyle = '#6d4627';
    pen.fillRect(0, 0, w, h);
    for (let i = 0; i < 1450; i++) {
      const x = random() * w;
      pen.strokeStyle = random() < .25 ? '#d69a5d43' : '#1e140e50';
      pen.lineWidth = .5 + random() * 1.7;
      pen.beginPath();
      pen.moveTo(x, 0);
      pen.bezierCurveTo(x + 18 * random(), 130, x - 14 * random(), 330, x, h);
      pen.stroke();
    }
    speckle(pen, w, h, random, 4000, .26);
  });

  const glowMap = paint(96, 96, (pen, w, h) => {
    const glow = pen.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    glow.addColorStop(0, '#ffffff');
    glow.addColorStop(.22, '#ffffff9e');
    glow.addColorStop(.58, '#ffffff32');
    glow.addColorStop(1, '#ffffff00');
    pen.fillStyle = glow;
    pen.fillRect(0, 0, w, h);
  });

  const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
  const sphereGeometry = new THREE.SphereGeometry(1, 12, 9);
  const cylinderGeometry = new THREE.CylinderGeometry(1, 1, 1, 10);
  const planeGeometry = new THREE.PlaneGeometry(1, 1);
  const construction = new Map();
  const dummy = new THREE.Object3D();

  function standard(color, roughness = .87, metalness = 0) {
    return new THREE.MeshStandardMaterial({color, roughness, metalness});
  }

  const steel = standard(0xffffff, .49, .55);
  const painted = standard(0xffffff, .76, .14);
  const earth = standard(0xffffff);
  const railMetal = standard(0xffffff, .32, .49);
  const railBright = new THREE.MeshStandardMaterial({
    color: 0xa9b2b2, roughness: .25, metalness: .28, emissive: 0x263130, emissiveIntensity: .21
  });
  const twin = new THREE.MeshBasicMaterial({color: 0x090b0b});
  const coatWood = standard(0x9a7760, .65);
  coatWood.map = woodMap;

  function primitive(type, material, parent, x, y, z, sx, sy, sz) {
    const mesh = new THREE.Mesh(type, material);
    mesh.position.set(x, y, z);
    mesh.scale.set(sx, sy, sz);
    parent.add(mesh);
    return mesh;
  }

  function block(parent, material, x, y, z, sx, sy, sz) {
    return primitive(boxGeometry, material, parent, x, y, z, sx, sy, sz);
  }

  function sphere(parent, material, x, y, z, sx, sy, sz) {
    return primitive(sphereGeometry, material, parent, x, y, z, sx, sy, sz);
  }

  function staticBox(material, color, x, y, z, sx, sy, sz, yaw = 0, roll = 0) {
    if (!construction.has(material)) construction.set(material, []);
    dummy.position.set(x, y, z);
    dummy.rotation.set(0, yaw, roll);
    dummy.scale.set(sx, sy, sz);
    dummy.updateMatrix();
    construction.get(material).push({matrix: dummy.matrix.clone(), color});
  }

  function finishConstruction() {
    for (const [material, items] of construction) {
      const mesh = new THREE.InstancedMesh(boxGeometry, material, items.length);
      const color = new THREE.Color();
      items.forEach((item, index) => {
        mesh.setMatrixAt(index, item.matrix);
        mesh.setColorAt(index, color.set(item.color));
      });
      scene.add(mesh);
    }
    construction.clear();
  }

  function repeatMap(texture, x, y) {
    const map = texture.clone();
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.repeat.set(x, y);
    return map;
  }

  function panel(texture, width, height, x, y, z, yaw, pitch, unitX, unitY, color, roughness) {
    const material = standard(color, roughness);
    material.map = repeatMap(texture, width / unitX, height / unitY);
    const mesh = primitive(planeGeometry, material, scene, x, y, z, width, height, 1);
    mesh.rotation.set(pitch, yaw, 0, 'YXZ');
    return mesh;
  }

  function decal(texture, width, height, x, y, z, yaw = 0, pitch = 0, options = {}) {
    const material = new THREE.MeshBasicMaterial({map: texture, ...options});
    const mesh = primitive(planeGeometry, material, scene, x, y, z, width, height, 1);
    mesh.rotation.set(pitch, yaw, 0, 'YXZ');
    return mesh;
  }

  function halo(parent, color, opacity, x, y, z, w, h) {
    const material = new THREE.SpriteMaterial({
      map: glowMap, color, opacity, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, toneMapped: false
    });
    const sprite = new THREE.Sprite(material);

    if (!unlocked && Math.abs(x - thresholds.gateX) < radius + .15 &&

    if (!unlocked && fromX !== null && fromX > thresholds.gateX && x < thresholds.gateX) return true;
    for (let i = 0; i < 4; i++) {
      const px = x + (i & 1 ? radius : -radius);
      const pz = z + (i & 2 ? radius : -radius);
      if (!passages.some((rectangle) => within(px, pz, rectangle))) return true;

  const navCount = navigation.width * navigation.height;
  const nodes = Array.from({length: navCount}, (_, i) => {
    const x = navigation.x + (i % navigation.width) * navigation.size;

  function clearLine(x, z, a, b, radius = .08) {
    const length = distance(x, z, a, b);
    const steps = Math.ceil(length / .36);
    for (let i = 1; i <= steps; i++) {
      if (blocked(lerp(x, a, i / steps), lerp(z, b, i / steps), radius, state.gateOpen)) return false;
    }

  const cardinalDirections = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  nodes.forEach((node, index) => {
    if (!node.open) return;
    const row = Math.floor(index / navigation.width);
    const column = index % navigation.width;
    for (const [dx, dz] of cardinalDirections) {
      if (row + dz < 0 || row + dz >= navigation.height ||
          column + dx < 0 || column + dx >= navigation.width) continue;
      const neighborIndex = index + dz * navigation.width + dx;
      const neighbor = nodes[neighborIndex];
      if (neighbor.open && !blocked((node.x + neighbor.x) / 2, (node.z + neighbor.z) / 2, .32, true)) {
        node.edges.push(neighborIndex);
      }
    }
  });

  function openNode(index) {
    return nodes[index]?.open && (state.gateOpen || nodes[index].x > thresholds.gateX);
  }

  function nearestNode(x, z) {
    const row = clamp(Math.round((z - navigation.z) / navigation.size), 0, navigation.height - 1);
    const column = clamp(Math.round((x - navigation.x) / navigation.size), 0, navigation.width - 1);
    let nearest = -1;
    let best = Infinity;
    for (let r = Math.max(0, row - 2); r <= Math.min(row + 2, navigation.height - 1); r++) {
      for (let c = Math.max(0, column - 2); c <= Math.min(column + 2, navigation.width - 1); c++) {
        const index = r * navigation.width + c;
        if (!openNode(index)) continue;
        const node = nodes[index];
        const score = square(node.x - x) + square(node.z - z);
        if (score < best) {
          best = score;
          nearest = index;
        }
      }
    }
    return nearest;
  }

  function flowFrom(origin) {
    const scores = new Int16Array(navCount).fill(-1);
    if (origin < 0) return scores;
    const queue = new Int16Array(navCount);
    let head = 0;
    let tail = 1;
    queue[0] = origin;
    scores[origin] = 0;
    while (head < tail) {
      const index = queue[head++];
      for (const next of nodes[index].edges) {
        if (scores[next] >= 0 || !openNode(next)) continue;
        scores[next] = scores[index] + 1;
        queue[tail++] = next;
      }
    }
    return scores;
  }

  function goal(playerX, playerZ, x, z, flow) {
    if (distance(playerX, playerZ, x, z) < 8.8 && clearLine(x, z, playerX, playerZ, .29)) {
      return {x: playerX, z: playerZ};
    }
    let index = nearestNode(x, z);
    if (index < 0 || !flow || flow[index] < 0) return {x, z};
    let target = nodes[index];
    for (let depth = 0; depth < 6 && flow[index] > 0; depth++) {
      const next = nodes[index].edges.find((candidate) =>
        flow[candidate] === flow[index] - 1 && clearLine(x, z, nodes[candidate].x, nodes[candidate].z, .26));
      if (next === undefined) break;
      target = nodes[next];
      index = next;
    }
    return target;
  }

  function startAudio() {
    if (audio) {

    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;

      const context = new Audio();

      master.gain.value = muted ? 0 : .41;
      master.connect(context.destination);
      const room = context.createGain();
      room.gain.value = .05;
      room.connect(master);

        const oscillator = context.createOscillator();
        oscillator.type = index === 1 ? 'triangle' : 'sine';
        oscillator.frequency.value = hz;
        oscillator.connect(room);
        oscillator.start();
      }
      const noise = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
      const samples = noise.getChannelData(0);
      const random = seeded(9453);
      for (let i = 0; i < samples.length; i++) samples[i] = random() * 2 - 1;
      audio = {context, master, room, noise};
      context.resume().catch(() => {});
    } catch {
      audio = null;
    }
  }

  function output(x, z) {
    if (x === undefined || !audio.context.createStereoPanner) return audio.master;
    const pan = audio.context.createStereoPanner();
    pan.pan.value = clamp(((x - player.x) * Math.cos(player.yaw) -
      (z - player.z) * Math.sin(player.yaw)) / 7, -.95, .95);

    return pan;
  }

  function soundTone(frequency, endFrequency, duration, volume, type, x, z) {
    if (!audio || muted) return;
    const {context} = audio;
    const time = context.currentTime;
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    const destination = output(x, z);
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, time);
    oscillator.frequency.exponentialRampToValueAtTime(endFrequency, time + duration);
    gain.gain.setValueAtTime(.0001, time);
    gain.gain.linearRampToValueAtTime(volume, time + Math.min(.035, duration / 3));
    gain.gain.exponentialRampToValueAtTime(.0001, time + duration);
    oscillator.connect(gain).connect(destination);
    oscillator.onended = () => {
      oscillator.disconnect();
      gain.disconnect();
      if (destination !== audio.master) destination.disconnect();
    };
    oscillator.start(time);
    oscillator.stop(time + duration + .02);
  }

  function soundNoise(frequency, duration, volume, x, z, filterType = 'bandpass') {
    if (!audio || muted) return;
    const {context, noise} = audio;
    const time = context.currentTime;
    const source = context.createBufferSource();
    source.buffer = noise;
    const filter = context.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = frequency;
    filter.Q.value = .8;
    const gain = context.createGain();
    const destination = output(x, z);
    gain.gain.setValueAtTime(.0001, time);
    gain.gain.linearRampToValueAtTime(volume, time + Math.min(.025, duration / 3));
    gain.gain.exponentialRampToValueAtTime(.0001, time + duration);
    source.connect(filter).connect(gain).connect(destination);
    source.onended = () => {
      source.disconnect();
      filter.disconnect();
      gain.disconnect();
      if (destination !== audio.master) destination.disconnect();
    };
    source.start(time, Math.random() * .9, duration + .02);
  }

      if (particle.y < floor) {

      const brightness = Math.min(1, particle.life / particle.length * 1.45);
      positionAttribute.setXYZ(count, particle.x, particle.y, particle.z);
      colorAttribute.setXYZ(count, particle.color.r * brightness, particle.color.g * brightness,

  function makePulse(x, y, z, color, maxSize, ttl = .62) {

  function animateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const effect = effects[i];
      const progress = (state.time - effect.started) / effect.ttl;
      if (progress >= 1) {
        scene.remove(effect.root);
        effect.material.dispose();
        effects.splice(i, 1);
        continue;
      }
      const size = lerp(.3, effect.maxSize, 1 - Math.pow(1 - progress, 2));
      effect.root.scale.set(size, size, 1);
      effect.material.opacity = (1 - progress) * .57;
    }
    for (let i = activeWards.length - 1; i >= 0; i--) {
      const ward = activeWards[i];
      const remaining = ward.until - state.time;
      if (remaining <= 0) {
        scene.remove(ward.root);
        ward.material.dispose();
        ward.glow.dispose();
        activeWards.splice(i, 1);
        continue;
      }
      const flicker = remaining < .65 ? .72 + .28 * Math.sin(state.time * 26) : 1;

      const z = ward.z + offset * ward.tz;
      if (!blocked(x, z, .02, state.gateOpen)) {
        spray(x, floorAt(x, z) + .06, z, 2, ward.color, .35, .48, .095, -1.3);
      }
    }
  }

  function targetGround(length) {
    const step = Math.max(.85, length);
    const x = player.x - Math.sin(player.yaw) * step;
    const z = player.z - Math.cos(player.yaw) * step;
    return clearLine(player.x, player.z, x, z, .13) ? {x, z} : {x: player.x, z: player.z};
  }

  function placeWard(index) {
    const cross = index === 6;
    const water = index === 4;
    const at = water ? targetGround(2.45) : player;
    const {x, z} = at;
    const tx = Math.cos(player.yaw);
    const tz = -Math.sin(player.yaw);
    const color = powers[index].tint;
    const radius = cross ? 4.67 : water ? 4.33 : 2.31;
    const root = new THREE.Group();
    const material = effectMaterial(color, .9);
    const glow = effectMaterial(color, .49);
    glow.map = glowMap;
    scene.add(root);
    if (cross) {
      for (let offset = -radius; offset <= radius; offset += .32) {
        const gx = x + tx * offset;
        const gz = z + tz * offset;
        if (blocked(gx, gz, .025, state.gateOpen)) continue;
        const y = floorAt(gx, gz);
        const bar = block(root, material, gx, y + .029, gz, .31, .023, .045);
        bar.rotation.y = player.yaw;
        if (Math.abs(offset) % .6 < .35) {
          const fragment = primitive(planeGeometry, glow, root, gx, y + .395, gz, .71, .84, 1);
          fragment.rotation.y = player.yaw;
        }
      }
      if (areaAt(x, z) === 0 && x > -5.13 && x < .82 && state.gateOpen) {
        say('Ward down. Keep moving!', 1.25);
      }
    } else {
      for (let i = 0; i < 38; i++) {
        const angle = i / 38 * TAU;
        const dx = Math.cos(angle) * radius * (water ? .8 : 1);
        const dz = Math.sin(angle) * radius;
        if (blocked(x + dx, z + dz, .04, state.gateOpen)) continue;
        const y = water ? Math.max(.101, floorAt(x + dx, z + dz)) : floorAt(x + dx, z + dz);
        const fragment = block(root, material, x + dx, y + .029, z + dz, .24, .027, .046);
        fragment.rotation.y = -angle - Math.PI / 2;
      }
      const y = water ? Math.max(.108, floorAt(x, z) + .037) : floorAt(x, z) + .041;
      const patch = primitive(planeGeometry, glow, root, x, y, z, radius * 1.93, radius * 1.93, 1);
      patch.rotation.x = -Math.PI / 2;
    }
    const y = floorAt(x, z);
    activeWards.push({index, root, material, glow, color, x, z, tx, tz, radius,
      until: state.time + (water ? 5.2 : 3.15), ttl: 0});
    makePulse(x, y, z, color, cross ? 2.1 : radius, .72);
    spray(x, y + .14, z, 24, color, 1.6, .93, .15, .6);
    playSound('ward', x, z);
  }

  function wardAt(x, z, type) {
    for (const ward of activeWards) {
      if (state.time >= ward.until) continue;
      if (type === 'water' && ward.index === 4 && distance(x, z, ward.x, ward.z) < ward.radius) return ward;
      if (type === 'enemy' && ward.index === 5 && distance(x, z, ward.x, ward.z) < ward.radius) return ward;
      if (type === 'enemy' && ward.index === 6) {
        const dx = x - ward.x;
        const dz = z - ward.z;
        if (Math.abs(dx * ward.tx + dz * ward.tz) < ward.radius + .26 &&
            Math.abs(dx * ward.tz - dz * ward.tx) < .54) return ward;
      }
    }
    return null;
  }

  function castPower(index) {
    const power = powers[index];
    if (state.phase !== 'playing' || index === 0) return;
    if (state.time < power.readyAt) {
      ui['power-detail'].textContent = ' · Ready in ' + Math.ceil(power.readyAt - state.time) + 's';
      state.wardHudAt = state.time + .85;
      return;
    }
    power.readyAt = state.time + power.cooldown;
    state.castKick = 1;
    state.flare = .82;
    castLight.color.copy(power.tint);
    if (index >= 4) {
      placeWard(index);
      return;
    }
    const {x, y, z} = player;
    const radius = index === 1 ? 5.5 : index === 2 ? 5.95 : 4.3;
    makePulse(x, y, z, power.tint, radius);
    spray(x, y + .24, z, 21, power.tint, 2.15, .69, .24, .8);
    playSound('pulse', x, z);
    if (index === 3) {
      state.brightUntil = state.time + 3.4;
      return;
    }
    for (const enemy of pursuers) {
      const length = distance(enemy.x, enemy.z, x, z);
      if (!enemy.active || (enemy.mode === 'retreat' || enemy.mode === 'recede') || length > radius || !clearLine(x, z, enemy.x, enemy.z)) continue;
      if (index === 1) {
        enemy.frozen = state.time + 2.3;
      } else {
        enemy.stagger = state.time + 1.08;
        enemy.shoveX = (enemy.x - x) / Math.max(length, .07) * 5.9;
        enemy.shoveZ = (enemy.z - z) / Math.max(length, .07) * 5.9;
      }
    }
    if (index === 2) {
      player.ratSlow = 0;
      for (const rat of rats) {
        if (distance(rat.x, rat.z, x, z) < radius) rat.coolUntil = state.time + 3.1;
      }
    }
  }

  const ambushes = [
    [],
    [[4.75, 10.05], [6.58, 12.12]],
    [[11.8, -21.02], [10.85, -23.76], [25.1, -22.3]],
    [[27.8, -18.21], [25.2, -18.75], [30.42, -18.96], [27.94, -19.68], [27.6, -23.26],
      [25.83, -22.59], [28.98, -22.37], [26.15, -24.22], [29.14, -23.89]]
  ];
  const headingForward = vector();
  const aimEnd = vector();
  const beamStart = vector();
  const axisUp = vector(0, 1, 0);
  const beamDirection = vector();
  const beam = new THREE.Group();
  const beamCore = effectMaterial(0xffe4b5, .86);
  const beamEdge = effectMaterial(0xffad5f, .22);
  primitive(cylinderGeometry, beamEdge, beam, 0, 0, 0, .056, 1, .056);
  primitive(cylinderGeometry, beamCore, beam, 0, 0, 0, .014, 1, .014);
  beam.visible = false;
  scene.add(beam);

  function resetPlayer(point) {
    Object.assign(player, point);
    player.y = floorAt(point.x, point.z);
    player.ratSlow = 0;
    player.protectionUntil = state.time + 1.08;
    player.moveAmount = 0;
    player.footstep = .8;
    state.flow = null;
    state.flowCell = -1;
    state.focusRitual = null;
    state.focusPursuer = null;
  }

  function hideEnemy(enemy) {
    enemy.active = false;
    enemy.model.root.visible = false;
    enemy.shade.visible = false;
  }

  function startAmbush(stage, retry = false) {
    const positions = ambushes[stage];
    const waiting = pursuers.filter((enemy) => !enemy.active || enemy.mode === 'recede');
    let index = 0;
    for (const [x, z] of positions) {
      if (index === waiting.length) break;
      if (distance(x, z, player.x, player.z) < 3.45 || blocked(x, z, .26, state.gateOpen)) continue;
      const enemy = waiting[index++];
      Object.assign(enemy, {active: true, x, z, mode: 'stalk', delay: state.time + (retry ? 1.3 : .52) + (index - 1) * .19,
        frozen: 0, stagger: 0, shoveX: 0, shoveZ: 0, charge: 0, spit: false, shelter: null, retreatFlow: null, home: {x, z}});
      enemy.yaw = Math.atan2(player.x - x, player.z - z);
      enemy.model.eyes.forEach((eye) => eye.material = whiteEye);
      enemy.model.root.position.set(x, floorAt(x, z), z);
      enemy.model.root.rotation.y = enemy.yaw;
      enemy.model.root.visible = true;
      enemy.shade.visible = true;
    }
    state.blackUntil = state.time + (stage === 1 ? 4.3 : 5.35);
    state.chaseStart = state.time;
    state.flow = null;
    state.wardHudAt = 0;
    playSound('surge', player.x, player.z);
  }

  function breakRitual(ritual) {
    ritual.done = true;
    ritual.collapse = state.time;
    ritual.progress = 1;
    ritual.ring.visible = false;
    ritual.beacon.visible = false;
    state.completed++;
    state.focusRitual = null;
    state.flare = .96;
    state.castKick = .69;
    makePulse(ritual.x, ritual.y, ritual.z, 0xffd18b, 2.64, .94);
    spray(ritual.x, ritual.y + .055, ritual.z, 51, warm, 2.4, 1.14, .8, 1.3);
    playSound('clear', ritual.x, ritual.z);
    if (state.completed === numberOfRituals) {
      state.gateOpen = true;
      powers[6].readyAt = 0;
      gatePlaque.visible = false;
      say(touchControls ? 'Gate open. Drop a ward on the tracks.' : 'Gate open. Press Q for a ward on the tracks.', 4.7);
      ratGroups[0].last = -99;
      ratGroups[0].first = state.time + 4.5;
      ratGroups[4].last = state.time;
    } else if (state.completed === 1) {
      say('The lights are cutting out.', 2.4);
    } else {
      say('One circle left. Find maintenance.', 2.5);
    }
    displayObjective();
    startAmbush(state.completed);
  }

  function releasePossession(enemy) {
    const shelter = shelters.slice().sort((a, b) =>
      distance(enemy.x, enemy.z, a.target.x, a.target.z) - distance(enemy.x, enemy.z, b.target.x, b.target.z))[0];
    enemy.mode = 'retreat';
    enemy.shelter = shelter;
    enemy.retreatFlow = flowFrom(nearestNode(shelter.target.x, shelter.target.z));
    enemy.model.eyes.forEach((eye) => eye.material = hollowEye);
    makePulse(enemy.x, floorAt(enemy.x, enemy.z), enemy.z, 0xffdc95, 1.6, .6);
    spray(enemy.x, floorAt(enemy.x, enemy.z) + 1.2, enemy.z, 22, warm, 1.46, .83, .26, 1.6);
    playSound('clear', enemy.x, enemy.z);
    say('Possession broken.', 1.65);
  }

  function spitAtPlayer(enemy) {
    const y = floorAt(enemy.x, enemy.z) + 1.49;
    const length = distance(enemy.x, enemy.z, player.x, player.z);
    const dx = (player.x - enemy.x) / Math.max(.01, length);
    const dz = (player.z - enemy.z) / Math.max(.01, length);
    const droplets = 5;
    spray(enemy.x + dx * .14, y, enemy.z + dz * .14, droplets, paper, .15, 1.25, .054, 8.6);
    const speed = Math.min(length * 1.55, 9.5);
    for (let i = 1; i <= droplets; i++) {
      const particle = particles[(particleCursor - i + capacity) % capacity];
      particle.dx += dx * speed;
      particle.dz += dz * speed;
      particle.dy = -.06;
      particle.life = particle.length = .68 + i * .015;
    }
    playSound('spit', enemy.x, enemy.z);
    enemy.spit = true;
  }

  function animateShelters(dt) {
    for (const shelter of shelters) {
      const close = distance(shelter.x, shelter.z, player.x, player.z) < 3.45 &&
        clearLine(shelter.target.x, shelter.target.z, player.x, player.z, .04);
      if (shelter.phase === 'open' && close && state.phase === 'playing') {
        shelter.phase = 'shoo';
        shelter.timer = state.time + .74;
        if (!state.gateOpen) say(shelter.line, 1.65);
      }
      if (shelter.phase === 'shoo' && state.time >= shelter.timer) {
        shelter.phase = 'shut';
        playSound('door', shelter.x, shelter.z);
      }
      if (shelter.phase === 'admit' && state.time >= shelter.timer) {
        shelter.phase = 'shut';
        if (close) playSound('door', shelter.x, shelter.z);
      }
      if (shelter.phase === 'shut') {
        shelter.angle = lerp(shelter.angle, 0, Math.min(1, dt * 24));
      } else {
        shelter.angle = lerp(shelter.angle, -1.42, Math.min(1, dt * 16));
      }
      shelter.hinge.rotation.y = shelter.angle;
      shelter.resident.root.visible = shelter.angle < -.23;
      poseStanding(shelter.resident, shelter.phase === 'shoo', state.time);
    }
  }

  function posePursuer(enemy, moving, dt) {
    const model = enemy.model;
    const running = moving && enemy.mode === 'chase';
    if (moving) enemy.runTime += dt * (running ? 13.3 : 7.0);
    const phase = enemy.runTime;
    const swing = moving ? Math.sin(phase) : 0;
    const floor = floorAt(enemy.x, enemy.z);
    const spring = moving ? Math.abs(Math.sin(phase)) * (running ? .068 : .033) : 0;
    const bob = running ? Math.sin(phase * .5) * .024 : 0;
    model.root.position.set(enemy.x, floor + spring, enemy.z);
    model.root.rotation.y = enemy.yaw + bob;
    model.upper.rotation.set(running ? .32 : -.04, .087 * swing, .061 * swing);
    model.head.rotation.set(running ? -.24 : .11, Math.sin(phase * .32) * .1, .04 * swing);
    for (let i = 0; i < 2; i++) {
      const side = i % 2 ? 1 : -1;
      const arm = model.arms[i];
      const leg = model.legs[i];
      arm.hinge.rotation.x = swing * side * (running ? .88 : .37) - (running ? .59 : .19);
      arm.hinge.rotation.z = side * (running ? .21 : .1);
      arm.end.rotation.x = running ? -1.05 - .49 * swing * side : -.19;
      leg.hinge.rotation.x = -side * swing * (running ? .81 : .44);
      leg.end.rotation.x = Math.max(0, side * swing * (running ? 1.06 : .61));
    }
    enemy.shade.position.set(enemy.x, floor + .019, enemy.z);
  }

  const frozenTint = new THREE.Color(0xa8d7f6);
  function moveEnemy(enemy, dx, dz) {
    const nx = enemy.x + dx;
    const nz = enemy.z + dz;
    const retreating = enemy.mode === 'retreat' || enemy.mode === 'recede';
    const ward = retreating ? null : wardAt(nx, nz, 'enemy');
    if (ward && ward !== wardAt(enemy.x, enemy.z, 'enemy')) {
      if (state.time >= enemy.wardSoundAt) {
        enemy.wardSoundAt = state.time + .57;
        spray(nx, floorAt(nx, nz) + .47, nz, 13, ward.color, 1.73, .67, .1, 1.2);
        playSound('impact', nx, nz);
        if (state.gateOpen && ward.index === 6 && areaAt(ward.x, ward.z) === 0 &&
            ward.x > -5.13 && ward.x < .82) state.chaseWardSeen = true;
      }
      return false;
    }
    if (!blocked(nx, enemy.z, .26, state.gateOpen, enemy.x)) enemy.x = nx;
    if (!blocked(enemy.x, nz, .26, state.gateOpen, enemy.x)) enemy.z = nz;
    return true;
  }

  function animatePursuers(dt) {
    const cell = nearestNode(player.x, player.z);
    if (!state.flow || (cell !== state.flowCell && state.time >= state.flowAt)) {
      state.flow = flowFrom(cell);
      state.flowAt = state.time + .16;
      state.flowCell = cell;
    }
    let nearest = Infinity;
    for (const enemy of pursuers) {
      if (!enemy.active) continue;
      const length = distance(enemy.x, enemy.z, player.x, player.z);
      if (enemy.mode === 'stalk' && state.time >= enemy.delay) enemy.mode = 'chase';
      if (enemy.mode === 'chase' && !state.gateOpen && state.time >= state.blackUntil) {
        enemy.mode = 'recede';
        enemy.retreatFlow = flowFrom(nearestNode(enemy.home.x, enemy.home.z));
        enemy.model.eyes.forEach((eye) => eye.material = hollowEye);
      }
      if (enemy.mode === 'chase') {
        nearest = Math.min(length, nearest);
        if (!enemy.spit && length < 6.3 && clearLine(enemy.x, enemy.z, player.x, player.z)) {
          spitAtPlayer(enemy);
        }
      }
      const frozen = state.time < enemy.frozen;
      const staggered = state.time < enemy.stagger;
      let moved = false;
      if (enemy.mode !== 'stalk' && !frozen) {
        const freed = enemy.mode === 'retreat';
        const retreating = freed || enemy.mode === 'recede';
        const target = freed ? enemy.shelter.target : retreating ? enemy.home : player;
        if (retreating && distance(enemy.x, enemy.z, target.x, target.z) < .52) {
          if (freed) {
            enemy.shelter.phase = 'admit';
            enemy.shelter.timer = state.time + .85;
          }
          hideEnemy(enemy);
          continue;
        }
        const waypoint = goal(target.x, target.z, enemy.x, enemy.z, retreating ? enemy.retreatFlow : state.flow);
        const dx = waypoint.x - enemy.x;
        const dz = waypoint.z - enemy.z;
        const stepLength = Math.hypot(dx, dz);
        if (stepLength > .035) {
          const base = retreating ? 2.84 : state.gateOpen ? 5.04 : 3.12 + state.completed * .16;
          const speed = Math.min(stepLength / Math.max(dt, .001), base * (staggered ? .24 : 1));
          let separationX = 0;
          let separationZ = 0;
          if (!retreating) {
            for (const other of pursuers) {
              if (!other.active || other === enemy) continue;
              const awayX = enemy.x - other.x;
              const awayZ = enemy.z - other.z;
              const gap = Math.hypot(awayX, awayZ);
              if (gap > .01 && gap < .65) {
                separationX += awayX / gap * (.65 - gap) * 3;
                separationZ += awayZ / gap * (.65 - gap) * 3;
              }
            }
          }
          const mx = dx / stepLength * speed + separationX + enemy.shoveX;
          const mz = dz / stepLength * speed + separationZ + enemy.shoveZ;
          const startX = enemy.x;
          const startZ = enemy.z;
          moveEnemy(enemy, mx * dt, mz * dt);
          moved = distance(startX, startZ, enemy.x, enemy.z) > dt * .11;
          const targetYaw = Math.atan2(dx, dz);
          const turn = Math.atan2(Math.sin(targetYaw - enemy.yaw), Math.cos(targetYaw - enemy.yaw));
          enemy.yaw += turn * Math.min(1, dt * 11);
        }
        enemy.shoveX *= Math.exp(-dt * 7.1);
        enemy.shoveZ *= Math.exp(-dt * 7.1);
      }
      if (frozen && state.time < enemy.frozen - 1.9 && effectRandom() < dt * 12) {
        spray(enemy.x, floorAt(enemy.x, enemy.z) + .31, enemy.z, 1, frozenTint, .15, .6, .38, -.2);
      }
      posePursuer(enemy, moved, dt);
      if (enemy.mode === 'chase' && !frozen && !staggered && state.time > player.protectionUntil &&
          state.time > enemy.delay + .18 && distance(enemy.x, enemy.z, player.x, player.z) < .67 &&
          !wardAt(player.x, player.z, 'enemy')) {
        caught();
        return;
      }
    }
    if (nearest < 14 && state.time > state.rattles && state.time > state.chaseStart + .75) {
      state.rattles = state.time + (nearest < 5 ? .55 : .86);
      const close = pursuers.find((enemy) => enemy.active && enemy.mode === 'chase' &&
        distance(enemy.x, enemy.z, player.x, player.z) <= nearest + .08);
      if (close) playSound(nearest < 5.4 ? 'breath' : 'step', close.x, close.z);
    }
  }

  function animateDolls(dt) {
    for (const ritual of rituals) {
      const {doll, material} = ritual;
      const length = distance(player.x, player.z, ritual.x, ritual.z);
      const isActive = ritual === rituals[state.completed];
      if (!ritual.done && length < 12.8) ritual.turns += dt * (state.focusRitual === ritual ? .037 : .12);
      const theta = ritual.turns * TAU;
      const speed = reducedMotion ? .67 : 1;
      let lift = .007 + .029 * Math.sin(theta * 13.8) * speed;
      let slump = 0;
      if (ritual.done) {
        slump = clamp((state.time - ritual.collapse) * 3.5, 0, 1);
        lift = -.043 * slump;
      }
      const offsetX = Math.cos(theta) * .98;
      const offsetZ = Math.sin(theta) * .98;
      doll.root.position.set(ritual.x + offsetX, ritual.y + lift, ritual.z + offsetZ);
      doll.root.rotation.set(slump * 1.19, -theta, slump * .77, 'YXZ');
      doll.head.rotation.x = .38 + .16 * Math.sin(theta * 9.6) * speed - slump * .21;
      doll.head.rotation.y = -.45 + Math.sin(theta * 5.8) * .27;
      doll.hips.rotation.x = -.16;
      doll.torso.rotation.x = .12;
      for (let i = 0; i < 2; i++) {
        const phase = theta * 10.6 + i * Math.PI;
        const drawingArm = i === 1;
        doll.arms[i].hinge.rotation.set(-.82 + Math.sin(phase) * (drawingArm ? .27 : .6) + slump * .49,
          drawingArm ? -.42 : .03, drawingArm ? .51 : -.17);
        doll.arms[i].end.rotation.x = .62 + Math.cos(phase) * .43;
        doll.legs[i].hinge.rotation.x = .93 + Math.sin(phase) * .51;
        doll.legs[i].end.rotation.x = 1.01 - Math.cos(phase) * .46;
      }
      doll.shade.position.set(doll.root.position.x, ritual.y + .014, doll.root.position.z);
      if (!ritual.done) {
        material.uniforms.drawn.value = clamp(ritual.turns, .4, 1.03);
        material.uniforms.broken.value = ritual.progress;
        material.uniforms.focus.value = state.focusRitual === ritual ? 1 : isActive ? .38 : 0;
        material.uniforms.time.value = state.time;
        ritual.beacon.material.opacity = (isActive ? .26 : .08) * (.9 + .1 * Math.sin(state.time * 2.3));
        if (length < 10.5 && state.time >= ritual.cooldown) {
          ritual.cooldown = state.time + .36;
          spray(ritual.x + offsetX * 1.12, ritual.y + .047, ritual.z + offsetZ * 1.12, 4, paper, .26, .48, .04, 1.9);
          if (length < 5.6) playSound('chalk', doll.root.position.x, doll.root.position.z);
        }
      }
    }
  }

  function ratPart(batch, index, x, y, z, yaw, sx, sy, sz, pitch = 0) {
    dummy.position.set(x, y, z);
    dummy.rotation.set(pitch, yaw, 0, 'YXZ');
    dummy.scale.set(sx, sy, sz);
    dummy.updateMatrix();
    batch.setMatrixAt(index, dummy.matrix);
  }
  function animateRats() {
    for (const group of ratGroups) {
      if (state.time < group.first || state.time - group.last < 18.5) continue;
      if (distance(player.x, player.z, group.triggerX, group.triggerZ) > group.radius) continue;
      group.last = state.time;
      playSound('rats', group.ax, group.az);
    }
    let count = 0;
    for (const rat of rats) {
      const group = rat.group;
      const scattered = state.time < rat.coolUntil;
      const age = (state.time - group.last - rat.delay) / rat.length;
      if (age < 0 || age > (scattered ? .78 : 1)) continue;
      const progress = clamp(age * (scattered ? 1.28 : 1), 0, 1);
      const wave = Math.sin(progress * 7 + rat.bob) * rat.along;
      const {ax, az, bx, bz} = group;
      const yaw = Math.atan2(bx - ax, bz - az);
      const x = lerp(ax, bx, progress) + Math.cos(yaw) * wave;
      const z = lerp(az, bz, progress) - Math.sin(yaw) * wave;
      const bottom = floorAt(x, z);
      const y = bottom + .102 + Math.abs(Math.sin(state.time * 26 + rat.bob)) * .041;
      const s = rat.size;
      const dx = Math.sin(yaw);
      const dz = Math.cos(yaw);
      rat.x = x;
      rat.z = z;
      ratPart(ratBody, count, x, y, z, yaw, .083 * s, .072 * s, .172 * s);
      ratPart(ratHead, count, x + dx * .145 * s, y + .015, z + dz * .145 * s, yaw, .056 * s, .051 * s, .089 * s);
      for (let ear = 0; ear < 2; ear++) {
        const sign = ear ? 1 : -1;
        ratPart(ratEars, 2 * count + ear, x + (dx * .108 + dz * .045 * sign) * s,
          y + .06 * s, z + (dz * .108 - dx * .045 * sign) * s, yaw, .023 * s, .033 * s, .021 * s);
        const step = .109 * ear;
        const swish = Math.sin(progress * 22 + rat.bob + ear) * .046;
        ratPart(ratTail, 2 * count + ear, x + (dx * (-.201 - step) + dz * swish) * s,
          y - .033 - .014 * ear, z + (dz * (-.201 - step) - dx * swish) * s,
          yaw + swish * 3, (.012 - ear * .004) * s, .133 * s, (.012 - ear * .004) * s, Math.PI / 2 + .13);
      }
      if (!scattered && distance(x, z, player.x, player.z) < .47 && player.y < bottom + .34) {

      }
      count++;

    ratBatches.forEach((batch, index) => {
      batch.count = count * (index >= 2 ? 2 : 1);
      if (batch.count) batch.instanceMatrix.needsUpdate = true;
    });
  }

  function inWater(x, z) {
    return x > flood.xMin && x < flood.xMax && z > flood.zMin && z < flood.zMax && floorAt(x, z) < .08;
  }

  function movePlayer(dt) {
    let sideways = Number(keys.has('KeyD') || keys.has('ArrowRight')) -
      Number(keys.has('KeyA') || keys.has('ArrowLeft')) + joystick.x;
    let forward = Number(keys.has('KeyW') || keys.has('ArrowUp')) -
      Number(keys.has('KeyS') || keys.has('ArrowDown')) - joystick.y;
    const strength = Math.hypot(sideways, forward);
    const scale = Math.max(1, strength);
    sideways /= scale;
    forward /= scale;
    const sprinting = keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(joystick.x, joystick.y) > .91;
    const wading = inWater(player.x, player.z) && !wardAt(player.x, player.z, 'water');
    const slowed = state.time < player.ratSlow;
    const grounding = casting.size && state.selected === 0 ? .82 : 1;
    const speed = (sprinting ? 5.54 : 3.54) * (wading ? .56 : 1) * (slowed ? .69 : 1) * grounding;
    const sx = Math.cos(player.yaw);
    const sz = -Math.sin(player.yaw);
    const dx = (sideways * sx + forward * sz) * dt * speed;
    const dz = (sideways * sz - forward * sx) * dt * speed;
    const startX = player.x;
    const startZ = player.z;
    const subdivisions = Math.max(1, Math.ceil(Math.hypot(dx, dz) / .3));
    for (let i = 0; i < subdivisions; i++) {
      const nx = player.x + dx / subdivisions;
      const nz = player.z + dz / subdivisions;
      if (!blocked(nx, player.z, .285, state.gateOpen, player.x)) player.x = nx;
      if (!blocked(player.x, nz, .285, state.gateOpen, player.x)) player.z = nz;
    }
    const walked = distance(startX, startZ, player.x, player.z);
    player.moveAmount = lerp(player.moveAmount, Math.min(1, walked / Math.max(.01, dt * 3.1)), Math.min(1, dt * 12));
    player.y = lerp(player.y, floorAt(player.x, player.z), Math.min(1, dt * 15));
    player.walkTime += walked * (sprinting ? 4.79 : 5.53);
    player.footstep -= walked;
    surfaceWater.uniforms.uRipple.value.set(player.x, player.z, wading ? player.moveAmount : 0);
    if (walked > .005 && player.footstep <= 0) {
      player.footstep = sprinting ? 1.82 : 1.4;
      playSound(wading ? 'water' : 'step', player.x, player.z);
      if (wading) spray(player.x, .102, player.z, 8, waterColor, .48, .4, .29, 4.2);
    }
    if (state.gateOpen && player.x < thresholds.streetX && player.z > 8.07 && player.z < 12.99) escape();
  }

  function updateCamera(dt) {
    const gait = player.walkTime;
    const bobStrength = reducedMotion ? 0 : player.moveAmount;
    const knocked = state.phase === 'caught' ? clamp((state.caughtUntil - state.time) * 1.1, 0, 1) : 0;
    camera.position.set(player.x + Math.cos(gait * .51) * bobStrength * .019,
      player.y + 1.64 + Math.sin(gait) * bobStrength * .029 - knocked * .64, player.z);
    camera.rotation.set(player.pitch - knocked * .34, player.yaw,
      Math.sin(gait * .5) * bobStrength * .009 - knocked * (reducedMotion ? 0 : .16));
    const lift = casting.size && state.selected === 0 && state.phase === 'playing';
    state.lifted = lerp(state.lifted, lift ? 1 : 0, Math.min(1, dt * 11));
    state.castKick = Math.max(0, state.castKick - dt * 2.7);
    const kick = Math.sin(state.castKick * Math.PI) * (reducedMotion ? .42 : 1);
    const narrow = Math.min(camera.aspect, 1.35);
    handRig.position.set(lerp(.355 * narrow, .12 * narrow, state.lifted) + Math.sin(gait * .5) * bobStrength * .013,
      lerp(-.295, -.235, state.lifted) + .063 * kick + Math.sin(gait) * .014 * bobStrength, -.65 - kick * .08);
    handRig.rotation.set(-.12 + state.lifted * .1 - .33 * kick, -.12 - .59 * kick, -.16 + .14 * state.lifted);
    crucifixGlow.material.opacity = .12 + state.lifted * .54 + state.flare * .42;
    gripLight.intensity = .64 + state.lifted * 1.25 + state.flare * .87;
    camera.updateMatrixWorld(true);
  }

  function rayDistance() {
    const maximum = 8.1;
    for (let t = .33; t < maximum; t += .18) {
      const x = camera.position.x + headingForward.x * t;
      const y = camera.position.y + headingForward.y * t;
      const z = camera.position.z + headingForward.z * t;
      if (blocked(x, z, .024, state.gateOpen) || y <= floorAt(x, z) + .025) return t;
    }
    return maximum;
  }

  function updateAiming(dt) {
    camera.getWorldDirection(headingForward);
    const hit = rayDistance();
    state.focusRitual = null;
    state.focusPursuer = null;
    let focusDepth = hit + .12;
    for (const enemy of pursuers) {
      if (!enemy.active || enemy.mode === 'retreat' || enemy.mode === 'recede') continue;
      const dx = enemy.x - camera.position.x;
      const dy = floorAt(enemy.x, enemy.z) + 1.15 - camera.position.y;
      const dz = enemy.z - camera.position.z;
      const depth = headingForward.x * dx + headingForward.y * dy + headingForward.z * dz;
      if (depth <= .01 || depth > focusDepth || depth > 7.2) continue;
      const error = square(dx - headingForward.x * depth) + square(dy - headingForward.y * depth) +
        square(dz - headingForward.z * depth);
      if (error <= square(.59 + depth * .009)) {
        state.focusPursuer = enemy;
        focusDepth = depth;
      }
    }
    for (const ritual of rituals) {
      if (ritual.done || headingForward.y >= -.025) continue;
      const depth = (ritual.y + .025 - camera.position.y) / headingForward.y;
      if (depth < .01 || depth >= 6.5 || depth > focusDepth + .03) continue;
      const x = camera.position.x + headingForward.x * depth;
      const z = camera.position.z + headingForward.z * depth;
      if (distance(x, z, ritual.x, ritual.z) < 1.26) {
        state.focusRitual = ritual;
        state.focusPursuer = null;
        focusDepth = depth;
      }
    }
    const on = casting.size > 0 && state.selected === 0 && state.phase === 'playing';
    const ritual = state.focusRitual;
    const enemy = state.focusPursuer;
    const eligible = ritual && ritual === rituals[state.completed];
    if (on && eligible) {
      ritual.progress = Math.min(1, ritual.progress + dt / 2.5);
      ritual.releasedAt = state.time + .36;
      if (effectRandom() < dt * 35) {
        const angle = ritual.progress * TAU;
        spray(ritual.x + Math.cos(angle) * 1.11, ritual.y + .052,
          ritual.z + Math.sin(angle) * 1.11, 4, warm, .57, .58, .09, .5);
      }
      if (ritual.progress >= 1) breakRitual(ritual);
    }
    for (const other of rituals) {
      if (!other.done && other.progress && (!on || ritual !== other) && state.time >= other.releasedAt) {
        other.progress = Math.max(0, other.progress - dt * .24);
      }
    }
    for (const other of pursuers) {
      if (!other.active || other.mode === 'retreat' || other.mode === 'recede') continue;
      if (on && other === enemy) {
        other.charge += dt;
        other.stagger = Math.max(other.stagger, state.time + .085);
        if (effectRandom() < dt * 24) {
          spray(other.x, floorAt(other.x, other.z) + 1.1, other.z, 2, warm, .48, .53, .22, .5);
        }
        if (other.charge >= 1.02) releasePossession(other);
      } else {
        other.charge = Math.max(0, other.charge - dt * .85);
      }
    }
    if (on) {
      const depth = ritual || enemy ? focusDepth : hit;
      aimEnd.copy(camera.position).addScaledVector(headingForward, depth);
      crucifix.getWorldPosition(beamStart);
      beamStart.y += .14;
      beamDirection.copy(aimEnd).sub(beamStart);
      beam.position.copy(beamStart).lerp(aimEnd, .5);
      beam.scale.y = Math.max(.02, beamDirection.length());
      beam.quaternion.setFromUnitVectors(axisUp, beamDirection.normalize());
      beam.visible = true;
      beamCore.opacity = .62 + .19 * Math.sin(state.time * 21);
      castLight.position.copy(aimEnd);
      castLight.position.y += .21;
      castLight.color.copy(powers[0].tint);
      castLight.intensity = 5.7 + 3.3 * Number(Boolean(eligible || enemy));
      if ((eligible || enemy) && state.time >= state.audioAt) {
        soundTone(173, 204, .24, .049, 'sine', aimEnd.x, aimEnd.z);
        state.audioAt = state.time + .24;
      }
    } else {
      beam.visible = false;
      castLight.position.set(player.x, player.y + .65, player.z);
      castLight.intensity = state.flare * 14;
    }
    state.flare = Math.max(0, state.flare - dt * 1.92);
    const percentage = eligible ? ritual.progress : enemy ? enemy.charge / 1.02 : 0;
    ui.aim.style.setProperty('--charge', clamp(percentage, 0, 1) * 360 + 'deg');
    ui.dot.classList.toggle('target', Boolean(eligible || enemy));
    let hint = '';
    if (eligible) {
      hint = state.selected !== 0 ? (touchControls ? 'Choose Light of Christ' : 'Press 1 for Light of Christ') :
        on ? 'Breaking the circle…' : touchControls ? 'Hold CAST on the chalk' : 'Hold F on the chalk';
    } else if (enemy && state.selected === 0) {
      hint = on ? 'Breaking possession…' : touchControls ? 'Hold CAST to free them' : 'Hold F to free them';
    }
    ui.hint.hidden = !hint;
    if (ui.hint.textContent !== hint) ui.hint.textContent = hint;
  }

  const offLamp = new THREE.Color(0x161c19);
  const offEmergency = new THREE.Color(0x5d523a);
  const dimFog = new THREE.Color(0x141d23);
  const exitUnlocked = new THREE.Color(0xfbd4b1);
  const exitLocked = new THREE.Color(0x8d756a);
  function updateLights(dt) {
    const dark = state.gateOpen || state.time < state.blackUntil;
    const chaseLight = state.time < state.brightUntil;
    const smoothDark = dark ? 1 : 0;
    state.darkness = lerp(state.darkness, smoothDark, Math.min(1, dt * 5.7));
    const darkness = state.darkness;
    hemisphere.intensity = lerp(1.18, .53, darkness) + (chaseLight ? .38 : 0);
    vision.intensity = lerp(12, 14.8, darkness) + (chaseLight ? 61 : 0);
    scene.fog.color.copy(fogColor).lerp(dimFog, darkness * .85);
    scene.background.copy(scene.fog.color);
    scene.fog.density = .041 + darkness * .008;
    surfaceWater.uniforms.uDark.value = darkness;
    surfaceWater.uniforms.uTime.value = state.time;
    const floodWard = activeWards.findLast((ward) => ward.index === 4);
    surfaceWater.uniforms.uWard.value.set(floodWard?.x ?? 0, floodWard?.z ?? 0, floodWard?.radius ?? 0);
    const closestLights = [];
    for (const lamp of lamps) {
      const n = state.time + lamp.phase;
      const buzz = !reducedMotion && state.time > .5 && Math.sin(n * 1.63) > .955 ?
        .69 + .14 * Math.sin(n * 31) : .95 + .05 * Math.sin(n * 2.8);
      lamp.level = (1 - darkness) * buzz;
      lamp.lit.color.set(lamp.color).multiplyScalar(lamp.level * 1.09).lerp(offLamp, darkness);
      lamp.bloom.material.opacity = lamp.level * .25 + .018;
      lamp.pool.material.opacity = lamp.level * .08;
      const d = distance(lamp.x, lamp.z, player.x, player.z);
      if (d < 14 && lamp.level > .03) closestLights.push({...lamp, d, power: lamp.strength * lamp.level});
    }
    for (const emergency of smallPools) {
      emergency.shell.color.copy(offEmergency).lerp(emergency.bloom.material.color, .59 + darkness * .41);
      emergency.bloom.material.opacity = .26 + darkness * .35;
      emergency.pool.material.opacity = .094 + darkness * .19;
      const d = distance(emergency.x, emergency.z, player.x, player.z);
      if (d < 10.8) {
        closestLights.push({...emergency, d: d + (dark ? 0 : 2.6), power: 2.1 + darkness * 9.2});
      }
    }
    closestLights.sort((a, b) => a.d - b.d);
    ambientFixtures.forEach((light, index) => {
      const local = closestLights[index];
      if (!local) {
        light.intensity = 0;
        return;
      }
      light.color.set(local.color);
      light.position.set(local.x, local.y, local.z);
      light.intensity = local.power * clamp((13.8 - local.d) / 4, 0, 1);
    });
    for (const mist of floorMists) {
      const offset = reducedMotion ? 0 : Math.sin(state.time * .32 + mist.index * .72);
      mist.sprite.position.set(mist.x + offset * .43, mist.y, mist.z + offset * .27);
      mist.sprite.material.opacity = .116 + offset * .018 + darkness * .024;
    }
    gate.position.y = .34 + state.gateLift * 3.0;
    gate.visible = state.gateLift < .997;
    mainExitSign.material.color.copy(exitLocked).lerp(exitUnlocked, state.gateLift);
    exitShine.intensity = 5.5 + state.gateLift * 35;
    if (state.gateOpen) state.gateLift = Math.min(1, state.gateLift + dt * 2.6);
    if (audio) {
      audio.room.gain.setTargetAtTime(.045 + darkness * .036 + player.moveAmount * .013,
        audio.context.currentTime, .25);
    }
  }

  function updateHUD() {
    const zone = locations[areaAt(player.x, player.z)];
    if (ui.location.textContent !== zone) ui.location.textContent = zone;
    if (!ui.caption.hidden && state.time >= state.captionUntil) ui.caption.hidden = true;
    if (state.wardHudAt && state.time >= state.wardHudAt) {
      state.wardHudAt = 0;
      displaySelection();
    }
    for (const power of powers) {
      const remaining = Math.max(0, power.readyAt - state.time);
      const value = remaining ? Math.floor(100 * (1 - remaining / power.cooldown)) : 100;
      if (value === power.readiness) continue;
      power.readiness = value;
      power.button.style.setProperty('--ready', value + '%');
      power.button.classList.toggle('cooling', remaining > 0);
    }
    ui.cast.setAttribute('aria-pressed', String(casting.size > 0 && state.selected === 0));
  }

  function resetTransient() {
    for (const enemy of pursuers) hideEnemy(enemy);
    for (const ward of activeWards) {
      scene.remove(ward.root);
      ward.material.dispose();
      ward.glow.dispose();
    }
    activeWards.length = 0;
    for (const effect of effects) {
      scene.remove(effect.root);
      effect.material.dispose();
    }
    effects.length = 0;
    for (const particle of particles) particle.life = 0;
    beam.visible = false;
    state.castKick = state.lifted = state.flare = 0;
    state.blackUntil = state.brightUntil = 0;
    state.rattles = state.audioAt = state.wardHudAt = 0;
    state.focusPursuer = state.focusRitual = null;
    powers.forEach((power) => power.readyAt = 0);
    casting.clear();
    keys.clear();
    resetStick();
  }

  function caught() {
    if (state.phase !== 'playing') return;
    state.phase = 'caught';
    state.caughtUntil = state.time + 1.55;
    playSound('caught');
    say('Caught. Returning to the last ritual…', 1.55);
    ui.lens.style.backgroundColor = '#3617199e';
    ui.hint.hidden = true;
    ui.dot.classList.remove('target');
    ui.aim.style.setProperty('--charge', '0deg');
    beam.visible = false;
  }

  function retry() {
    resetTransient();
    resetPlayer(checkpoints[state.completed]);
    ui.lens.style.backgroundColor = '';
    state.phase = 'playing';
    selectPower(0);
    const ritual = rituals[state.completed];
    if (ritual) ritual.progress = 0;
    if (state.gateOpen) {
      startAmbush(numberOfRituals, true);
      say('The gate is open. Run for the street.', 3);
    } else {
      say('The last ritual is still broken.', state.completed ? 2 : 0);
    }
  }

  function escape() {
    state.phase = 'escaped';
    resetTransient();
    const length = Math.round(state.time - (state.startedAt ?? state.time));
    const timer = Math.floor(length / 60) + ':' + String(length % 60).padStart(2, '0');
    ui['end-detail'].textContent = (state.chaseWardSeen ? 'The ward held. You made it out.' :
      'Three rituals broken. You made it out.') + ' · ' + timer;
    ui.hud.hidden = true;
    ui.end.hidden = false;
    ui.replay.focus();
    playSound('street');
  }

  function startNewRun() {
    resetTransient();
    state.completed = 0;
    state.phase = 'playing';
    state.gateOpen = false;
    state.gateLift = 0;
    state.darkness = 0;
    state.chaseWardSeen = false;
    state.startedAt = null;
    state.captionUntil = 0;
    gatePlaque.visible = true;
    for (const ritual of rituals) {
      ritual.done = false;
      ritual.turns = .47;
      ritual.progress = 0;
      ritual.cooldown = 0;
      ritual.ring.visible = ritual.beacon.visible = true;
    }
    for (const shelter of shelters) {
      shelter.phase = 'open';
      shelter.timer = 0;
      shelter.angle = -1.42;
    }
    ratGroups.forEach((group, index) => {
      group.last = -99;
      group.first = state.time + index * .34;
    });
    rats.forEach((rat) => rat.coolUntil = 0);
    resetPlayer(spawn);
    selectPower(0);
    displayObjective();
    ui.caption.hidden = true;
    ui.hud.hidden = false;
    ui.end.hidden = true;
    ui.lens.style.backgroundColor = '';
  }

  let lookPointer = null;
  let castPointer = null;
  let castPositionX = 0;
  let castPositionY = 0;
  let lookX = 0;
  let lookY = 0;
  const moveKeys = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
    'ShiftLeft', 'ShiftRight', 'KeyQ', 'KeyF']);

  function raise(source) {
    if (state.phase !== 'playing') return;
    beginInput();
    if (state.selected === 0) casting.add(source);
    else castPower(state.selected);
  }

  function look(dx, dy, touch = false) {
    if (state.phase !== 'playing') return;
    const gain = touch ? .0061 : .0043;
    player.yaw -= dx * gain;
    player.pitch = clamp(player.pitch - dy * gain, -1.27, 1.27);
  }

  function resetStick() {
    joystick.pointer = null;
    joystick.x = joystick.y = 0;
    ui.stick.firstElementChild.style.transform = '';
  }

  function moveStick(event) {
    const box = ui.stick.getBoundingClientRect();
    const dx = event.clientX - (box.left + box.width / 2);
    const dy = event.clientY - (box.top + box.height / 2);
    const radius = box.width * .35;
    const length = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx);
    const value = clamp((length - 3) / (radius - 3), 0, 1);
    joystick.x = Math.cos(angle) * value;
    joystick.y = Math.sin(angle) * value;
    ui.stick.firstElementChild.style.transform = 'translate(' + joystick.x * radius + 'px,' + joystick.y * radius + 'px)';
  }

  window.addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const {code} = event;
    if (moveKeys.has(code)) event.preventDefault();
    if (state.phase !== 'playing') {
      if (code === 'KeyR' && state.phase === 'escaped' && !event.repeat) startNewRun();
      return;
    }
    if (!moveKeys.has(code) && !/^Digit[1-7]$/.test(code)) return;
    keys.add(code);
    if (event.repeat) return;
    beginInput();
    if (code === 'KeyF') raise('keyboard');
    if (code === 'KeyQ') castPower(6);
    if (/^Digit[1-7]$/.test(code)) selectPower(Number(code.at(-1)) - 1);

      lookY = event.clientY;

    ui.world.addEventListener(type, (event) => {

  }
  ui.world.addEventListener('contextmenu', (event) => event.preventDefault());

  ui.stick.addEventListener('pointerdown', (event) => {
    if (joystick.pointer !== null || state.phase !== 'playing') return;

    joystick.pointer = event.pointerId;
    ui.stick.setPointerCapture(event.pointerId);

    if (castPointer !== null || state.phase !== 'playing') return;

    castPositionX = event.clientX;
    castPositionY = event.clientY;
    ui.cast.setPointerCapture(event.pointerId);
    raise('touch');
  });
  ui.cast.addEventListener('pointermove', (event) => {
    if (event.pointerId !== castPointer) return;
    look(event.clientX - castPositionX, event.clientY - castPositionY, event.pointerType === 'touch');
    castPositionX = event.clientX;
    castPositionY = event.clientY;
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    ui.cast.addEventListener(type, (event) => {
      if (event.pointerId !== castPointer) return;
      castPointer = null;
      casting.delete('touch');
    });
  }
  ui.ward.addEventListener('click', () => {
    beginInput();
    castPower(6);
  });
  ui.replay.addEventListener('click', startNewRun);

  function resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.fov = camera.aspect < .72 ? 72 : 63;
    camera.updateProjectionMatrix();
    const maxPixels = touchDevice ? 880000 : 1850000;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, touchDevice ? 1.35 : 1.55,
      Math.sqrt(maxPixels / (width * height))));
    renderer.setSize(width, height, false);
  }

  resize();
  window.addEventListener('resize', resize);
  document.body.classList.toggle('touch', touchDevice);
  ui.touch.hidden = false;
  ui.kit.hidden = false;
  status.hidden = true;
  startNewRun();

  let lastFrame = performance.now();
  function frame(now) {
    const dt = clamp((now - lastFrame) / 1000, 0, .075);
    lastFrame = now;
    state.time += dt;
    if (state.phase === 'playing') movePlayer(dt);
    if (state.phase === 'caught' && state.time >= state.caughtUntil) retry();
    updateCamera(dt);
    if (state.phase === 'playing') {
      updateAiming(dt);
      animatePursuers(dt);
      animateRats();
    } else {
      castLight.intensity = 0;
    }
    animateDolls(dt);
    animateShelters(dt);
    animateEffects(dt);
    animateParticles(dt);
    updateLights(dt);
    updateHUD();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
