<style>
:root{--gold:#ffd84a;--red:#e72418;--cream:#fff3bd;--ink:#120b05}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050200;color:white;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",system-ui,sans-serif}body{padding:max(7px,env(safe-area-inset-top)) 7px max(14px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 10%,#6e2105 0,#190400 32%,#030000 72%)}.wrap{width:min(1180px,100%);margin:auto}.mast{text-align:center;margin:1px 0 8px}.logo{font-size:clamp(35px,7vw,78px);line-height:.82;color:#ffe34e;letter-spacing:.035em;transform:skew(-7deg);text-shadow:3px 3px #ea2c16,6px 6px #6d0b05,9px 9px #090000,0 0 22px #ff9b12}.tag{margin-top:7px;font:900 10px/1 system-ui;letter-spacing:.22em;color:#ffe7a5}.shell{padding:9px;border-radius:18px;background:linear-gradient(#eb411c,#8a0e05 55%,#4d0703);border:4px solid #ffd846;box-shadow:0 15px 45px #000,0 0 30px #ffbe2980,inset 0 0 0 3px #5c0700}#board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:5px;aspect-ratio:1.31;min-height:430px;padding:6px;background:#170500;border:3px solid #450700;border-radius:9px;overflow:hidden}.tile{position:relative;display:grid;place-items:center;text-align:center;padding:4px;border:3px solid #fff0a2;border-radius:4px;overflow:hidden;user-select:none;font-size:clamp(12px,2.1vw,25px);line-height:.9;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;background:linear-gradient(135deg,#264bb7,#071859);box-shadow:inset 0 0 0 2px #421,0 0 6px #000}.tile:before{content:"";position:absolute;inset:2px;border:1px dashed #fff9;pointer-events:none}.tile.money{background:linear-gradient(135deg,#1a8730,#075018)}.tile.prize{background:linear-gradient(135deg,#8248c9,#37166e)}.tile.whammy{background:linear-gradient(135deg,#f23b22,#8f0904)}.tile.move{background:linear-gradient(135deg,#ff9b18,#aa3b00)}.tile.active{z-index:6;filter:brightness(1.85) saturate(1.25);transform:scale(1. osition:absolute;z-index:25;left:7%;right:7%;bottom:6%;text-align:center;font:1000 clamp(15px,2.3vw,28px)/1 system-ui;color:#18100b;text-shadow:1px 1px #fff8b7}.wham{position:absolute;z-index:22;width:86px;height:118px;left:calc(50% - 43px);top:calc(50% - 59px);transform-origin:50% 78%}.head{position:absolute;left:17px;top:0;width:53px;height:48px;background:#e32619;border:3px solid var(--ink);border-radius:48% 52% 44% 44%;transform:rotate(-5deg)}.nose{position:absolute;right:-12px;top:19px;width:24px;height:16px;background:#e32619;border:3px solid var(--ink);border-left:0;border-radius:0 60% 60% 0}.eye{position:absolute;width:7px;height:9px;background:#fff;border:2px solid var(--ink);border-radius:50%;top:12px}.eye.e1{left:11px}.eye.e2{left:28px}.eye:after{content:"";position:absolute;width:2px;height:3px;background:#111;left:1px;top:2px}.mouth{position:absolute;left:12px;top:32px;width:27px;height:8px;border-bottom:3px solid #120b05;border-radius:50%}.body{position:absolute;left:23px;top:43px;width:44px;height:48px;background:#e32619;border:3px solid var(--ink);border-radius:45% 50% 38% 38%}.arm,.leg{position:absolute;background:#e32619;border:3px solid var(--ink);border-radius:999px;transform-origin:6px 6px}.arm{width:40px;height:12px;top:52px}.arm.a1{left:3px;transform:rotate(145deg)}.arm.a2{left:57px;transform:rotate(25deg)}.leg{width:14px;height:41px;top:82px}.leg.l1{left:28px;transform:rotate(7deg)}.leg.l2{left:51px;transform:rotate(-7deg)}.shoe{position:absolute;width:24px;height:10px;background:#111;border-radius:70% 30% 30% 50%;top:110px}.shoe.s1{left:20px}.shoe.s2{left:49px;transform:scaleX(-1)}.prop{position:absolute;z-index:21;font-size:clamp(40px,8vw,92px);filter:drop-shadow(2px 3px 0 #6c4c15)}.boom{position:absolute;z-index:30;display:none;place-items:center;width:150px;height:100px;left:calc(50% - 75px);top:calc(50% - 50px);font-size:34px;color:#cf1c12;background:#ffe446;clip-path:polygon(50% 0,62% 25%,89% 7%,78% 37%,100% 50%,76% 59%,92% 89%,61% 75%, </style></head><body><div class="wrap"><div class="mast"><div class="logo">PRESS YOUR LUCK</div><div class="tag">BIG BUCKS • NO WHAMMIES • CLASSIC CHAOS</div></div><div class="shell"><div id="board"><div id="center"><div class="game"><div class="big">WHAMMY!</div><div id="status">ADD SPINS, THEN PRESS SPIN. PRESS AGAIN TO STOP.</div><div class="stats"><div class="stat"><b>BANK</b><span id="bank">$0</span></div><div class="stat"><b>SPINS</b><span id="spins">0</span></div><div class="stat"><b>EARNED</b><span id="earned">0</span></div><div class="stat"><b>WHAMMIES</b><span id="whammies">0</span></div></div></div><div id="cartoon"><div class="film"></div><div class="sceneTitle" id="sceneTitle"></div><div id="actor"></div><div class="boom" id="boom">WHAM!</div><div class="caption" id="caption"></div></div></div></div></div><div class="controls"><button id="spinBtn">SPIN</button><button id="addBtn">+ SPIN</button><button id="demoBtn">WHAMMY DEMO</button><button id="resetBtn">RESET</button></div><div class="help">SPACE = SPIN / STOP • DEMO cycles classic Whammy scenes • 4 Whammies ends the run</div></div>
<script>(()=>{'use strict';const board=[["$500","money",500,0],["$750 + SPIN","money",750,1],["TRIP\n$1,200","prize",1200,0],["WHAMMY!","whammy",0,0],["$1,000","money",1000,0],["$1,500 + SPIN","money",1500,1],["$700","money",700,0],["WHAMMY!","whammy",0,0],["$2,000","money",2000,0],["BIG BUCKS\n$3,000","money",3000,0],["$500 + SPIN","money",500,1],["MYSTERY\n$900","prize",900,0],["WHAMMY!","whammy",0,0],["$1,250","money",1250,0],["MOVE 2\n+ $500","move",500,0],["$2,500 + SPIN","money",2500,1],["$800","money",800,0],["WHAMMY!","whammy",0,0]],pos=[[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[2,6],[3,6],[4,6],[5,6],[5,5],[5,4],[5,3],[5,2],[5,1],[4,1],[3,1],[2,1]],B=document.getElementById('board'),spinBtn=document.getElementById('spinBtn'),status=document.getElementById('status'),bankEl=document.getElementById('bank'),spinsEl=document.getElementById('spins'),earnedEl=document.getElementById('earned'),whEl=document.getElementById('whammies'),cartoon=document.getElementById('cartoon'),actor=document.getElementById('actor'),caption=document.getElementById('caption'),sceneTitle=document.getElementById('sceneTitle'),boom=document.getElementById('boom');let bank=0,spins=0,earned=0,whammies=0,running=false,timer=null,idx=0,demoIndex=0,audio=null;const money=n=>'$'+n.toLocaleString();board.forEach((x,i)=>{let d=document.createElement('div');d.className='tile '+x[1];d.style.gridRow=pos[i][0];d.style.gridColumn=pos[i][1];d.innerHTML=x[0].replace('\n','<br>');B.appendChild(d)});const tiles=[...document.querySelectorAll('.tile')];function draw(){bankEl.textContent=money(bank);spinsEl.textContent=spins;earnedEl.textContent=earned;whEl.textContent=whammies}function tone(f=600,d=.04,type='square',v=.025){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.st tus.textContent='WHAMMY! BANK WIPED OUT.';draw()},3100)}function animateScene(a,w,p){if(p){p.style.left='62%';p.style.top='38%'}const key=(el,frames,opt)=>el.animate(frames,opt),O={duration:2500,easing:'ease-in-out',fill:'forwards'};if(a==='hammer'){if(p){p.style.left='58%';p.style.top='25%';key(p,[{transform:'rotate(-65deg)'},{transform:'rotate(35deg)'},{transform:'rotate(-65deg)'},{transform:'rotate(45deg)'}],O)}key(w,[{transform:'translateX(-180px)'},{transform:'translateX(0)'},{transform:'translateX(100px)'}],O)}else if(a==='pogo')key(w,[{transform:'translateY(50px)'},{transform:'translateY(-65px)'},{transform:'translateY(50px)'},{transform:'translateY(-65px)'},{transform:'translateY(50px)'}],O);else if(a==='shark'){if(p){p.style.left='15%';p.style.top='48%';key(p,[{transform:'translateX(-140px) scale(1.4)'},{transform:'translateX(430px) scale(1.4)'}],O)}key(w,[{transform:'translate(-170px,20px) rotate(-8deg)'},{transform:'translate(150px,10px) rotate(8deg)'}],O)}else if(a==='pilot'){if(p){p.style.left='18%';p.style.top='30%';key(p,[{transform:'translate(-160px,-80px) rotate(5deg)'},{transform:'translate(160px,15px) rotate(15deg)'},{transform:'translate(420px,170px) rotate(42deg)'}],O)}key(w,[{transform:'translate(-160px,-80px) scale(.7)'},{transform:'translate(180px,80px) scale(.7) rotate(25deg)'}],O)}else if(['dozer','mower','bike','skate','santa'].includes(a)){if(p){p.style.left='18%';p.style.top='45%';key(p,[{transform:'translateX(-180px)'},{transform:'translateX(430px)'}],O)}key(w,[{transform:'translateX(-180px)'},{transform:'translateX(260px) rotate('+(a==='skate'?'75':'0')+'deg)'}],O)}else if(a==='magic'){if(p){p.style.left='46%';p.style.top='16%';key(p,[{transform:'scale(.3) rotate(-30deg)'},{transform:'scale(1.3) rotate(0)'},{transform:'scale(.2) rotate(30deg)'}],O)}key(w,[{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.1)'}],O)}else if(a==='fang'||a==='picnic'){if(p){p.style.left='8%';p.style.top='52%';key(p,[{transform:'translateX(-100px)'},{transform:'translateX(220px)'},{transform:'translateX(420px)'}],O)}key(w,[{transform:'translateX(120px)'},{transform:'translateX(0)'},{transform:'translateX(120px)'}],O)}else if(['dance','hula','rock','quartet','orchestra','piano','newyear'].includes(a))key(w,[{transform:'rotate(-12deg) translateY(0)'},{transform:'rotate(12deg) translateY(-18px)'},{transform:'rotate(-12deg) translateY(0)'},{transform:'rotate(12deg) translateY(-18px)'},{transform:'rotate(0)'}],O);else if(['tnt','football','clown','champagne'].includes(a)){key(w,[{transform:'scale(1)'},{transform:'scale(1.12) rotate(-8deg)'},{transform:'scale(.1) rotate(120deg)',opacity:0}],O);setTimeout(()=>{boom.classList.add('on');tone(70,.35,'sawtooth',.09)},1500)}else if(a==='jump')key(w,[{transform:'translateY(80px)'},{transform:'translateY(-90px) rotate(15deg)'},{transform:'translateY(20px)'},{transform:'translateY(-45px) rotate(-12deg)'},{transform:'translateY(50px)'}],O);else if(a==='rocket'){if(p){p.style.left='48%';p.style.top='42%';key(p,[{transform:'translateY(20px)'},{transform:'translateY(-420px) scale(.65)'}],O)}key(w,[{transform:'translateX(0)'},{transform:'translateX(-90px)'},{transform:'translateX(90px)'}],O)}else if(a==='boxer')key(w,[{transform:'translateX(-80px) rotate(-8deg)'},{transform:'translateX(0) scale(1.12)'},{transform:'translateX(50px) rotate(14deg)'},{transform:'translateX(0)'}],O);else if(a==='jack')key(w,[{transform:'translateY(0)'},{transform:'translateY(14px)'},{transform:'translateY(-8px)'},{transform:'translateY(14px)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}],O);else if(a==='surf'){key(w,[{transform:'translate(-190px,40px) rotate(-20deg)'},{transform:'translate(0,-40px) rotate(8deg)'},{transform:'translate(210px,50px) rotate(55deg)'}],O);if(p){p.style.left='10%';p.style.top='50%'}}else if(['fortune','movie','eye','judge','franklin','window'].includes(a)){if(p){p.style.left='59%';p.style.top='30%';key(p,[{transform:'scale(
