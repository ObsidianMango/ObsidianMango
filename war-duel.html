<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111d28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WAR! — Two-Player Card Duel</title>
<style>
:root{color-scheme:dark;--gold:#f2c676;--cream:#fff5de;--ink:#14202c;--felt:#0d4548}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111c2a;color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;touch-action:manipulation;cursor:pointer}
#game{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);overflow:hidden}
.player{position:relative;min-height:0;overflow:hidden;display:grid;place-items:center;cursor:pointer;isolation:isolate;outline:none;transition:filter .2s}
.player.top{background:radial-gradient(ellipse at 48% 65%,#21636a 0%,#12444f 50%,#0b2537 100%)}
.player.bottom{background:radial-gradient(ellipse at 50% 40%,#a04848 0%,#713641 51%,#332439 100%)}
.player:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(120deg,transparent 0 7px,#ffffff06 8px 9px,transparent 10px 22px),radial-gradient(ellipse at 50% 50%,transparent 40%,#080c1866 100%);opacity:.65}
.player:focus-visible{outline:3px solid #ffecb2;outline-offset:-3px}
.player.winner{box-shadow:inset 0 0 45px #e8b75a55}
.player.winner:after{content:"✦  WINNER  ✦";position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:1000;letter-spacing:2px;color:#ffe8ab;white-space:nowrap;filter:drop-shadow(0 1px 5px #0009)}
.player-inner{height:100%;width:100%;max-width:500px;min-height:0;padding:8px 16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;pointer-events:none}
.top .player-inner{transform:rotate(180deg)}
.player-name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,5.7vw,29px);letter-spacing:1.2px;font-weight:900;line-height:1;text-shadow:0 2px 3px #0006}
.player-sub{font-size:10px;color:#fff2cebd;font-weight:850;letter-spacing:2.8px}
.card-count{display:flex;align-items:center;gap:7px;color:#fff8e9d8;font-size:12px;font-weight:900;letter-spacing:.8px}
.card-count strong{font-size:15px;color:#ffe4a6;font-variant-numeric:tabular-nums}
.card-count .pip{font-size:12px;color:#d4bd84}
.stage{position:relative;isolation:isolate;display:grid;place-items:center;width:clamp(112px,31vw,164px);height:clamp(142px,20vh,190px);margin:4px 0 6px;perspective:800px;perspective-origin:50% 38%;filter:drop-shadow(0 13px 13px #050a153f)}
.stage:before,.stage:after{content:"";position:absolute;height:83%;width:74%;border:3px solid #e9d1aa;border-radius:11px;left:13%;top:7%;pointer-events:none;background:repeating-linear-gradient(45deg,#214b70 0 7px,#1b3855 7px 9px,#174263 9px 17px);box-shadow:0 5px 0 #152537,0 10px 14px #0004;z-index:-2}
.stage:before{transform:translate3d(-7px,5px,-20px) rotate(-8deg)}
.stage:after{transform:translate3d(6px,3px,-10px) rotate(7deg);z-index:-1}
.card3d{position:relative;width:75%;height:90%;transform-style:preserve-3d;transform:rotateY(0deg) rotateX(8deg);transition:transform .8s cubic-bezier(.2,.75,.2,1),filter .3s;filter:drop-shadow(1px 5px 3px #0004);will-change:transform}
.card3d.flipped{transform:rotateY(180deg) rotateX(-2deg)}
.card-side{position:absolute;inset:0;border:3px solid #f9f5e8;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 1px #15191d22,0 3px 0 #d8cfbc,0 5px 0 #aaa397,0 9px 15px #0006}
.card-back{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#183650 0 8px,#2e5575 8px 10px,#163957 10px 18px);transform:translateZ(2px)}
.card-back:before{content:"";position:absolute;inset:7px;border:2px solid #e4c9a0;border-radius:5px;box-shadow:inset 0 0 0 3px #193d61,0 0 0 1px #193d61}
.card-back:after{content:"";position:absolute;inset:15px;border:1px solid #dfca9b70;border-radius:3px}
.back-seal{width:68px;height:68px;display:grid;place-items:center;border-radius:50%;border:5px double #254a6a;background:radial-gradient(circle at 30% 25%,#fff9dc,#edcc88 70%);color:#173653;font:900 40px Georgia,serif;box-shadow:0 4px 12px #0006;z-index:1}
.card-face{transform:rotateY(180deg) translateZ(2px);background:linear-gradient(140deg,#fffefa 0%,#f3efdf 100%);color:#172232}
.card-face.red{color:#c93447}
.card-face:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,#ffffffbb 0%,transparent 27%,transparent 72%,#00000010 100%)}
.card-corner{position:absolute;left:7px;top:6px;display:flex;flex-direction:column;align-items:center;font:900 clamp(17px,3.3vh,25px) Georgia,serif;line-height:1}
.card-corner i{font-style:normal;font-size:clamp(12px,2.2vh,17px);line-height:1.1}
.card-corner.invert{left:auto;top:auto;right:7px;bottom:6px;transform:rotate(180deg)}
.card-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;font-family:Georgia,serif}
.card-center .symbol{font-size:clamp(58px,9.4vh,85px);line-height:1;filter:drop-shadow(1px 3px 1px #0002)}
.card-center .royal{font-size:11px;font-weight:900;letter-spacing:3px;opacity:.8}
.tap-cue{min-width:min(200px,80vw);max-width:92vw;text-align:center;border:1.5px solid #ffe1ad6a;border-radius:14px;background:linear-gradient(180deg,#ffffff13,#00000019);color:#fff6e3;padding:10px 13px;font-size:clamp(12px,3.25vw,15px);font-weight:1000;letter-spacing:1px;box-shadow:0 4px 12px #0002}
.player.ready .tap-cue{border-color:#fff3b6;background:#e9c979;color:#273341;box-shadow:0 0 20px #f2c67660}
.player.ready .stage{filter:drop-shadow(0 0 16px #fff0b46b)}
.hub{position:relative;z-index:2;min-height:120px;padding:7px max(13px,env(safe-area-inset-right)) 7px max(13px,env(safe-area-inset-left));display:grid;grid-template-columns:57px minmax(0,1fr) 57px;gap:7px;align-items:center;background:linear-gradient(180deg,#1f3141,#101c2b 30%,#152336 70%,#263646);border-top:3px solid #d5a95d;border-bottom:3px solid #d5a95d;box-shadow:inset 0 1px #fff3c958,0 0 18px #02081199;color:#fff5de;text-align:center}
.hub:before,.hub:after{content:"";position:absolute;left:0;right:0;height:1px;pointer-events:none;background:#ffeab144}
.hub:before{top:5px}.hub:after{bottom:5px}
.hub-side{display:flex;flex-direction:column;gap:5px;justify-content:center;align-items:center}
.hub-kicker{font-size:9px;letter-spacing:1.2px;font-weight:900;color:#cab88d}
.round-num{font-size:25px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;color:#fff}
.hub-center{min-width:0;display:flex;flex-direction:column;gap:3px;align-items:center}
.game-logo{font-family:Georgia,serif;font-size:23px;font-weight:900;line-height:1;color:#f6c879;letter-spacing:1.4px;text-shadow:0 1px 5px #000a}
.game-status{font-size:clamp(11px,3.1vw,15px);font-weight:1000;letter-spacing:.4px;color:#fff;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.game-detail{font-size:9px;line-height:1.15;font-weight:800;letter-spacing:1px;color:#e2cdabcc;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.next-button{border:1px solid #fff2bd;border-radius:10px;background:linear-gradient(180deg,#ffe4a0,#d59c4e);box-shadow:0 3px 0 #87552d,0 4px 12px #0005;color:#263142;font-size:12px;font-weight:1000;letter-spacing:.75px;min-height:36px;min-width:min(195px,100%);padding:6px 9px;text-transform:uppercase}
.next-button:active{transform:translateY(2px);box-shadow:0 1px 0 #87552d}
.next-button[hidden]{display:none}
.score-track{width:min(205px,100%);height:5px;border-radius:10px;overflow:hidden;background:#27818c;display:flex;box-shadow:inset 0 1px 2px #0007;margin-top:2px}
.score-track span{display:block;height:100%;background:#e17f7e;transition:width .4s}
.tool{border:1px solid #e7c78984;background:#2d3b4e;border-radius:10px;color:#fff0c9;font-size:20px;font-weight:800;height:35px;width:37px;display:grid;place-items:center;padding:0;box-shadow:0 3px 4px #0004}
.tool:active{background:#536177}
.tools{display:flex;flex-direction:column;align-items:center;gap:7px}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:20;background:#050c17ce;display:grid;place-items:center;padding:18px;backdrop-filter:blur(6px)}
.dialog{border:3px solid #f4c983;border-radius:22px;background:linear-gradient(165deg,#fff4da,#e8d5ae);color:#263141;width:100%;max-width:355px;padding:22px;box-shadow:0 13px 46px #0009;text-align:center}
.dialog h2{font-family:Georgia,serif;font-size:29px;margin:2px 0 12px;color:#283744}
.dialog p{font-size:15px;line-height:1.5;margin:9px 0}
.dialog strong{color:#a43b49}
.dialog .actions{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.dialog button{min-width:118px;border:0;border-radius:11px;padding:12px;font-weight:1000}
.primary{background:#a94050;color:#fff}.secondary{background:#d8c8a7;color:#273341}
.footer-small{font-size:11px!important;opacity:.65}
@media(max-height:700px){.hub{min-height:105px;padding-top:5px;padding-bottom:5px}.stage{height:clamp(95px,18vh,140px);margin:1px 0}.player-inner{gap:3px}.tap-cue{padding:7px 10px}.player-name{font-size:clamp(18px,4.4vw,24px)}.card-count{font-size:10px}}
@media(max-height:565px){.hub{min-height:92px}.stage{height:clamp(70px,16vh,105px);width:108px}.player-inner{gap:2px}.tap-cue{padding:5px 7px;font-size:11px}.player-sub{font-size:8px}.player-name{font-size:16px}.card-count{font-size:10px}.game-logo{font-size:18px}.hub{grid-template-columns:44px 1fr 44px}.back-seal{width:45px;height:45px;font-size:26px}.card-center .symbol{font-size:40px}.card-corner{font-size:12px}.card-corner i{font-size:10px}}
@media(prefers-reduced-motion:reduce){.card3d{transition-duration:.1s}*{animation:none!important}}
</style>
</head>
<body>
<main id="game" aria-label="Two-player War card game">
<section id="zone2" class="player top" role="button" tabindex="0" aria-label="Player two draw or continue">
 <div class="player-inner">
  <div class="player-sub">THE TOP SIDE</div><div class="player-name">PLAYER TWO</div>
  <div class="card-count"><span class="pip">♠</span><strong id="count2">26</strong> CARDS <span class="pip">♠</span></div>
  <div class="stage"><div class="card3d" id="card2"><div class="card-side card-back"><div class="back-seal">W</div></div><div class="card-side card-face" id="face2"></div></div></div>
  <div class="tap-cue" id="cue2">TAP TO FLIP</div>
 </div>
</section>
<section class="hub" aria-label="Game status and controls">
 <div class="hub-side"><div class="hub-kicker">ROUND</div><div class="round-num" id="round">0</div></div>
 <div class="hub-center"><div class="game-logo">♠ WAR! ♠</div><div class="game-status" id="status" aria-live="polite">BOTH PLAYERS TAP!</div><div class="game-detail" id="detail">HIGH CARD WINS</div><button class="next-button" id="nextBtn" hidden>NEXT ROUND ▶</button><div class="score-track" role="img" aria-label="Player one share of cards"><span id="scoreFill" style="width:50%"></span></div></div>
 <div class="hub-side tools"><button class="tool" id="helpBtn" aria-label="How to play">?</button><button class="tool" id="resetBtn" aria-label="New game">↻</button></div>
</section>
<section id="zone1" class="player bottom" role="button" tabindex="0" aria-label="Player one draw or continue">
 <div class="player-inner">
  <div class="player-sub">THE BOTTOM SIDE</div><div class="player-name">PLAYER ONE</div>
  <div class="card-count"><span class="pip">♥</span><strong id="count1">26</strong> CARDS <span class="pip">♥</span></div>
  <div class="stage"><div class="card3d" id="card1"><div class="card-side card-back"><div class="back-seal">W</div></div><div class="card-side card-face" id="face1"></div></div></div>
  <div class="tap-cue" id="cue1">TAP TO FLIP</div>
 </div>
</section>
</main>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="Game menu">
 <div class="dialog"><h2 id="modalTitle"></h2><div id="modalText"></div><div class="actions" id="modalActions"></div></div>
</div>
<script>
(function(){
'use strict';
var KEY='obm-war-duel-v2',OLDKEY='obm-war-duel-v1';
var suits=['♠','♥','♣','♦'], names={11:'J',12:'Q',13:'K',14:'A'};
var decks=[[],[]],visible=[null,null],ready=[false,false],pot=[];
var phase='ready',faceVisible=false,round=0,winner=-1,status='BOTH PLAYERS TAP!',detail='HIGH CARD WINS';
var pendingTimer=null,modalShown=false;
function el(id){return document.getElementById(id);}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var v=arr[i];arr[i]=arr[j];arr[j]=v;}return arr;}
function delay(fn,ms){clearTimeout(pendingTimer);pendingTimer=setTimeout(fn,ms);}
function rank(c){return names[c.v]||String(c.v);}
function validCard(c){return c&&Number.isInteger(c.v)&&c.v>=2&&c.v<=14&&Number.isInteger(c.s)&&c.s>=0&&c.s<=3;}
function validDeck(a){return Array.isArray(a)&&a.every(validCard);}
function save(){try{localStorage.setItem(KEY,JSON.stringify({decks:decks,visible:visible,pot:pot,phase:phase,round:round,winner:winner,status:status,detail:detail}));}catch(e){}}
function restore(){try{
 var d=JSON.parse(localStorage.getItem(KEY)||'null');
 if(d&&Array.isArray(d.decks)&&d.decks.length===2&&validDeck(d.decks[0])&&validDeck(d.decks[1])&&validDeck(d.pot)&&d.decks[0].length+d.decks[1].length+d.pot.length===52&&['ready','result','war','over'].includes(d.phase)){
  decks=d.decks;pot=d.pot;visible=d.visible||[null,null];phase=d.phase;round=d.round||0;winner=Number.isInteger(d.winner)?d.winner:-1;status=d.status||'BOTH PLAYERS TAP!';detail=d.detail||'HIGH CARD WINS';faceVisible=phase!=='ready';ready=[false,false];return true;
 }
 var old=JSON.parse(localStorage.getItem(OLDKEY)||'null');
 if(old&&Array.isArray(old.decks)&&old.decks.length===2&&validDeck(old.decks[0])&&validDeck(old.decks[1])&&old.decks[0].length+old.decks[1].length===52){
  decks=old.decks;pot=[];visible=old.visible||[null,null];round=old.round||0;phase=old.gameOver?'over':round>0?'result':'ready';winner=-1;faceVisible=phase!=='ready';status=old.status||'BOTH PLAYERS TAP!';detail=phase==='result'?'TAP NEXT ROUND TO CONTINUE':'HIGH CARD WINS';save();return true;
 }
 }catch(e){}return false;}
function newGame(){clearTimeout(pendingTimer);var all=[];for(var s=0;s<4;s++)for(var v=2;v<=14;v++)all.push({s:s,v:v});shuffle(all);decks=[all.slice(0,26),all.slice(26)];visible=[null,null];ready=[false,false];pot=[];phase='ready';faceVisible=false;round=0;winner=-1;status='BOTH PLAYERS TAP!';detail='HIGH CARD WINS';modalShown=false;save();render();}
function cardMarkup(c){if(!validCard(c))return '';
 var s=suits[c.s],r=rank(c),royal=c.v>=11?'<div class="royal">'+({11:'JACK',12:'QUEEN',13:'KING',14:'ACE'}[c.v])+'</div>':'';
 return '<div class="card-corner">'+r+'<i>'+s+'</i></div><div class="card-center"><span class="symbol">'+s+'</span>'+royal+'</div><div class="card-corner invert">'+r+'<i>'+s+'</i></div>';
}
function render(){for(var i=0;i<2;i++){var n=i+1,c=visible[i],side=el('zone'+n),card=el('card'+n),face=el('face'+n);
 el('count'+n).textContent=decks[i].length;
 face.innerHTML=cardMarkup(c);face.classList.toggle('red',!!c&&(c.s===1||c.s===3));card.classList.toggle('flipped',faceVisible&&!!c);
 side.classList.toggle('ready',phase==='ready'&&ready[i]);side.classList.toggle('winner',phase==='result'&&winner===i);
 side.setAttribute('aria-pressed',String(phase==='ready'&&ready[i]));
 el('cue'+n).textContent=phase==='ready'?(ready[i]?'✓ READY — WAITING':'TAP TO FLIP'):phase==='flipping'?'FLIPPING...':phase==='war'?'⚡ TAP FOR WAR ⚡':phase==='result'?'TAP TO CONTINUE':'GAME OVER';
 }
 el('round').textContent=round;el('status').textContent=status;el('detail').textContent=detail;
 var next=el('nextBtn');next.hidden=!(phase==='result'||phase==='war'||phase==='over');next.textContent=phase==='war'?'⚡ FIGHT THE WAR ⚡':phase==='over'?'PLAY AGAIN ↻':'NEXT ROUND ▶';
 el('scoreFill').style.width=(100*decks[0].length/(Math.max(1,decks[0].length+decks[1].length)))+'%';
}
function tap(i){if(!el('modal').hidden)return;
 if(phase==='result'||phase==='war'||phase==='over'){advance();return;}
 if(phase!=='ready'||ready[i]||decks[i].length===0)return;
 ready[i]=true;if(ready[0]&&ready[1]){status='CARDS ON THE TABLE...';detail='FLIPPING TOGETHER';render();delay(startRound,280);}
 else{status='ONE PLAYER READY';detail='WAIT FOR THE OTHER PLAYER';render();}
}
function beginReveal(a,b){visible=[a,b];phase='flipping';faceVisible=false;winner=-1;status='FLIPPING THE CARDS';detail=pot.length+' CARDS AT STAKE';render();
 requestAnimationFrame(function(){requestAnimationFrame(function(){faceVisible=true;render();delay(judge,1070);});});
}
function startRound(){if(phase!=='ready')return;ready=[false,false];if(!decks[0].length||!decks[1].length){endGame(decks[0].length?0:1);return;}round++;pot=[];var a=decks[0].shift(),b=decks[1].shift();pot.push(a,b);beginReveal(a,b);}
function judge(){var a=visible[0],b=visible[1];if(!a||!b)return;if(a.v===b.v){phase='war';winner=-1;status='⚡ IT’S WAR! ⚡';detail='TIED! 3 DOWN, 1 UP';save();render();return;}finish(a.v>b.v?0:1);}
function startWar(){if(phase!=='war')return;if(!decks[0].length&&!decks[1].length){endGame(-1);return;}if(!decks[0].length){finish(1);return;}if(!decks[1].length){finish(0);return;}
 // Put up to three cards face-down while reserving one card to reveal.
 for(var i=0;i<2;i++){var down=Math.min(3,decks[i].length-1);for(var j=0;j<down;j++)pot.push(decks[i].shift());}
 var a=decks[0].shift(),b=decks[1].shift();pot.push(a,b);beginReveal(a,b);
}
function finish(w){winner=w;var gain=pot.length;shuffle(pot);Array.prototype.push.apply(decks[w],pot);pot=[];phase='result';status='PLAYER '+(w+1)+' TAKES '+gain+' CARDS!';detail=gain>2?'WAR WON — TAP NEXT ROUND':'TAP NEXT ROUND TO PLAY';save();render();
 if(decks[1-w].length===0){delay(function(){endGame(w);},850);}
}
function endGame(w){clearTimeout(pendingTimer);phase='over';winner=w;status=w<0?'IT’S A DRAW!':'PLAYER '+(w+1)+' WINS!';detail='THE WAR IS OVER';save();render();if(!modalShown){modalShown=true;delay(function(){showModal(w<0?'A rare draw!':'PLAYER '+(w+1)+' WINS!','<p>The war is over after <strong>'+round+' rounds</strong>.</p><p>Ready for another battle?</p>',[{text:'REMATCH',primary:true,action:function(){closeModal();newGame();}},{text:'VIEW TABLE',action:closeModal}]);},550);}}
function nextRound(){if(phase!=='result')return;phase='ready';winner=-1;visible=[null,null];faceVisible=false;ready=[false,false];status='BOTH PLAYERS TAP!';detail='DRAW WHEN YOU’RE BOTH READY';save();render();}
function advance(){if(phase==='result')nextRound();else if(phase==='war')startWar();else if(phase==='over'){newGame();}}
function showModal(title,body,buttons){el('modalTitle').textContent=title;el('modalText').innerHTML=body;var actions=el('modalActions');actions.innerHTML='';buttons.forEach(function(item){var button=document.createElement('button');button.className=item.primary?'primary':'secondary';button.textContent=item.text;button.addEventListener('click',item.action);actions.appendChild(button);});el('modal').hidden=false;}
function closeModal(){el('modal').hidden=true;}
function help(){showModal('HOW TO PLAY','<p>Put the phone between you. <strong>Player Two</strong> plays from the top; <strong>Player One</strong> from the bottom.</p><p><strong>Each player taps their own half.</strong> When both are ready, the 3D cards flip together. Highest card wins both cards. Aces are high.</p><p>After a reveal, press <strong>NEXT ROUND</strong> (or tap either half) before you draw again. Your cards stay face-up until then.</p><p>On a tie, press <strong>FIGHT THE WAR</strong>. Each player puts down up to three cards and flips another. The winner takes the pile.</p><p class="footer-small">Your game saves locally on this device.</p>',[{text:'LET’S PLAY',primary:true,action:closeModal}]);}
el('zone1').addEventListener('click',function(){tap(0);});el('zone2').addEventListener('click',function(){tap(1);});
['zone1','zone2'].forEach(function(id,i){el(id).addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(i);}});});
el('nextBtn').addEventListener('click',advance);
el('helpBtn').addEventListener('click',help);
el('resetBtn').addEventListener('click',function(){showModal('START OVER?','<p>Shuffle all 52 cards and deal a completely new game?</p>',[{text:'NEW GAME',primary:true,action:function(){closeModal();newGame();}},{text:'CANCEL',action:closeModal}]);});
if(!restore())newGame();else{render();if(phase==='over')delay(function(){endGame(winner);},700);}
})();
</script>
</body>
</html>
