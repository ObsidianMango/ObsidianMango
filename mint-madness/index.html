<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#102429">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mint Madness · Intro Circuit</title>
<style>
:root{color-scheme:dark;--panel:#10282ddd;--line:#ffffff26;--paper:#f5f3e9;--muted:#b8cbc7;--gold:#f0c35e;--cyan:#75e6dd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d171b;color:var(--paper);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-weight:750;min-height:44px;touch-action:none;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(1px);filter:brightness(1.14)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view.dragging{cursor:grabbing}
#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#06191c55,transparent 28%,transparent 70%,#06161988)}
.top{position:fixed;z-index:5;top:max(13px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.brand{font-size:12px;font-weight:900;letter-spacing:.18em;text-shadow:0 2px 8px #000}
.brand small{display:block;font-size:7px;margin-top:5px;letter-spacing:.15em;color:#cae1db}
.stats{display:flex;gap:6px;pointer-events:auto}
.stat{min-width:61px;text-align:center;padding:7px 8px;border:1px solid var(--line);border-radius:11px;background:var(--panel);backdrop-filter:blur(9px)}
.stat b{display:block;font-size:14px}
.stat small{display:block;margin-top:2px;font-size:6px;letter-spacing:.12em;color:var(--muted)}
#restart{padding:0 10px;background:var(--panel)}
#hud{position:fixed;z-index:5;top:89px;left:max(17px,env(safe-area-inset-left));pointer-events:none;width:228px;text-shadow:0 2px 8px #0008}
.speed b{font-size:40px;line-height:.92;font-weight:350;letter-spacing:-.05em}
.speed span{margin-left:6px;font-size:9px;letter-spacing:.12em}
.speed small{display:block;margin-top:7px;font-size:9px;letter-spacing:.08em;color:#e7eee9}
.meterRow{display:flex;align-items:center;gap:8px;margin-top:9px}
.meter{width:118px;height:6px;border-radius:999px;overflow:hidden;background:#071b1eaa;border:1px solid #ffffff1e}
.meter i{display:block;height:100%;width:100%;background:#bde48c}
#powerBar{background:var(--gold)}
.meterLabel{font-size:8px;color:#e0e8e3;min-width:62px}
#guide{position:fixed;z-index:4;top:145px;left:50%;transform:translateX(-50%);pointer-events:none;display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#081c20aa;border:1px solid #ffffff18;font-size:8px;letter-spacing:.10em}
#guideArrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid var(--cyan);transform-origin:50% 55%;filter:drop-shadow(0 1px 4px #000)}
#cameraTools{position:fixed;z-index:5;top:87px;right:max(16px,env(safe-area-inset-right));display:flex;gap:3px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(9px)}
#cameraTools button{min-height:40px;border:0;background:transparent;padding:5px 8px;font-size:8px;color:#c3d7d1}
#cameraTools button.active{background:#dcebdd;color:#14302b}
#touch{position:fixed;z-index:6;bottom:max(17px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}
.steering-dock{display:flex;flex-direction:column;align-items:center}
#steeringWheel{width:170px;height:170px;border-radius:50%;pointer-events:auto;touch-action:none;filter:drop-shadow(0 5px 10px #0008)}
#wheelArt{width:100%;height:100%;display:block;will-change:transform}
.wheel-hint{font-size:7px;letter-spacing:.14em;color:#e1ece0a0;margin-top:-3px}
.drive-dock{width:188px;display:flex;flex-direction:column;gap:9px}
#transmission{align-self:flex-end;display:flex;width:144px;gap:3px;padding:4px;background:#102a2fef;border:1px solid var(--line);border-radius:13px;pointer-events:auto}
#transmission button{width:50%;border:0;background:transparent;font-size:17px}
#transmission button small{display:block;font-size:6px;font-weight:550}
#transmission button.active{background:var(--gold);color:#203327}
.pedal-row{display:flex;justify-content:flex-end;align-items:flex-end;gap:10px}
.brake-stack{width:88px;display:flex;flex-direction:column;gap:7px}
#touch button{pointer-events:auto;box-shadow:0 4px 10px #0004}
.handbrake{height:42px;background:#102a2fe8;font-size:8px}
.pedal{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px 9px;border:1px solid #ffffff50}
button[data-input="brake"]{width:88px;height:79px;background:linear-gradient(#d5dfe0,#a2b5b7);color:#153037;box-shadow:inset 0 -5px #607b7f}
button[data-input="gas"]{width:70px;height:128px;background:linear-gradient(#f4ce78,#d9a83e);color:#263124;box-shadow:inset 0 -5px #8e6927}
.grip{display:block;width:70%;height:36%;opacity:.28;background:repeating-linear-gradient(0deg,transparent 0 5px,currentColor 5px 7px)}
#result{position:fixed;z-index:10;inset:0;display:none;place-items:center;background:#06141799;pointer-events:none}
#result.show{display:grid}
#resultCard{min-width:240px;text-align:center;padding:22px 26px;border-radius:16px;border:1px solid #ffffff32;background:#10282df2;backdrop-filter:blur(10px);font-size:28px;font-weight:900;letter-spacing:.12em}
#resultCard small{display:block;margin-top:9px;font-size:9px;letter-spacing:.10em;color:#c7d8d4}
#loading{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#0d171b;font-weight:800;letter-spacing:.14em}
#crashFlash{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 110px #d43e18;opacity:0;transition:opacity .08s}
@media(max-width:650px){
 .top{left:12px;right:12px}.brand{font-size:10px}.stat{min-width:50px;padding:6px}.stat b{font-size:12px}.stat small{font-size:5px}
 #restart{font-size:9px;min-height:40px}.stats{gap:4px}
 #hud{top:81px;left:13px}.speed b{font-size:33px}
 #cameraTools{top:80px;right:12px}#cameraTools button{padding:5px 6px}
 #guide{top:133px}
 #touch{left:9px;right:11px;bottom:max(13px,env(safe-area-inset-bottom))}
 #steeringWheel{width:148px;height:148px}.drive-dock{width:174px}
 #transmission{width:133px}.brake-stack,button[data-input="brake"]{width:81px}
 button[data-input="brake"]{height:72px}button[data-input="gas"]{width:66px;height:118px}
}
@media(max-width:390px){.stat:nth-child(3){display:none}#steeringWheel{width:136px;height:136px}.drive-dock{width:162px}#transmission{width:124px}.brake-stack,button[data-input="brake"]{width:76px}button[data-input="gas"]{width:62px}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="shade"></div><div id="crashFlash"></div>
<div class="top">
 <div class="brand">MINT MADNESS<small>INTRO CIRCUIT</small></div>
 <div class="stats">
  <div class="stat"><b id="bodyText">100</b><small>BODY</small></div>
  <div class="stat"><b id="lapText">1 / 4</b><small>LAP</small></div>
  <div class="stat"><b id="wreckText">0 / 7</b><small>WRECKS</small></div>
  <button id="restart">Restart</button>
 </div>
</div>
<div id="hud">
 <div class="speed"><b id="speed">0</b><span>MPH</span><small id="gearText">D · DRIVE</small></div>
 <div class="meterRow"><div class="meter"><i id="bodyBar"></i></div><span class="meterLabel" id="bodyLabel">100%</span></div>
 <div class="meterRow"><div class="meter"><i id="powerBar"></i></div><span class="meterLabel" id="powerLabel">POWER 45</span></div>
</div>
<div id="guide"><div id="guideArrow"></div><span id="guideText">CP 1</span></div>
<div id="cameraTools">
 <button data-camera="follow" class="active">FOLLOW</button>
 <button data-camera="rear">REAR</button>
 <button data-camera="top">TOP</button>
 <button id="resetCamera">RESET</button>
</div>
<div id="touch">
 <div class="steering-dock">
  <div id="steeringWheel" role="slider" aria-valuemin="-135" aria-valuemax="135" aria-valuenow="0">
   <svg id="wheelArt" viewBox="0 0 200 200" aria-hidden="true">
    <defs><linearGradient id="rim" x2="1" y2="1"><stop stop-color="#6b716d"/><stop offset=".5" stop-color="#202b28"/><stop offset="1" stop-color="#080f0d"/></linearGradient></defs>
    <circle cx="100" cy="100" r="83" fill="#102c2438" stroke="#e7eed72b" stroke-width="25"/>
    <circle cx="100" cy="100" r="82" fill="none" stroke="url(#rim)" stroke-width="20"/>
    <path d="M100 100 28 74 26 86 86 114 94 179 106 179 114 114 174 86 172 74Z" fill="#8f9991" stroke="#10261e" stroke-width="2"/>
    <circle cx="100" cy="100" r="27" fill="#263d32" stroke="#9da98d" stroke-width="3"/>
    <path d="M91 107 100 88 109 107M94 102h12" fill="none" stroke="#e7c16d" stroke-width="2"/>
    <path d="M96 17h8v14h-8Z" fill="#f6c777"/>
   </svg>
  </div><span class="wheel-hint">DRAG TO STEER</span>
 </div>
 <div class="drive-dock">
  <div id="transmission"><button data-gear="1" class="active">D<small>Drive</small></button><button data-gear="-1">R<small>Reverse</small></button></div>
  <div class="pedal-row">
   <div class="brake-stack"><button class="handbrake" data-input="handbrake">HANDBRAKE</button><button class="pedal" data-input="brake"><i class="grip"></i><span>BRAKE</span></button></div>
   <button class="pedal" data-input="gas"><i class="grip"></i><span>GAS</span></button>
  </div>
 </div>
</div>
<div id="result"><div id="resultCard">WIN<small id="resultSub"></small></div></div>
<div id="loading">LOADING…</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";
import {buildDetailedVehicle} from "../parkside-streets/detailed-vehicles.js?v=gold-8";
import {buildRoadster} from "../parkside-streets/roadster-model.js?v=gold-8";
import {VEHICLES} from "../parkside-streets/garage-models.js?v=game-5";

const canvas=document.getElementById("view"),loading=document.getElementById("loading");
const bodyText=document.getElementById("bodyText"),lapText=document.getElementById("lapText"),wreckText=document.getElementById("wreckText");
const speedText=document.getElementById("speed"),gearText=document.getElementById("gearText"),bodyBar=document.getElementById("bodyBar"),bodyLabel=document.getElementById("bodyLabel"),powerBar=document.getElementById("powerBar"),powerLabel=document.getElementById("powerLabel");
const guideArrow=document.getElementById("guideArrow"),guideText=document.getElementById("guideText"),crashFlash=document.getElementById("crashFlash");
const steeringWheel=document.getElementById("steeringWheel"),wheelArt=document.getElementById("wheelArt"),result=document.getElementById("result"),resultCard=document.getElementById("resultCard"),resultSub=document.getElementById("resultSub");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x18313a);
scene.fog=new THREE.Fog(0x18313a,150,330);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xdcecff,0x243526,1.55));
const sun=new THREE.DirectionalLight(0xfff1d2,2.4);sun.position.set(55,80,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=140;sun.shadow.camera.bottom=-140;scene.add(sun);

const mat=(color,metal=.15,rough=.7)=>new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough});
const grass=mat(0x5d7447,.02,.94),tarmac=mat(0x4a5054,.05,.82),roadEdge=mat(0xd6c05d,.10,.65),dirt=mat(0x8b7352,.01,.98),rampMat=mat(0x6a7074,.52,.42),rampSide=mat(0x4d5357,.45,.56);

function addBox(w,h,d,x,y,z,m,ry=0){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.y=ry;o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
const field=addBox(310,.18,220,0,-.12,0,grass);
const roadWidth=18,halfX=65,halfZ=55;
addBox(roadWidth,.16,112, halfX,.02,0,tarmac);
addBox(roadWidth,.16,112,-halfX,.02,0,tarmac);
addBox(112,.16,roadWidth,0,.02,-halfZ,tarmac);
addBox(112,.16,roadWidth,0,.02, halfZ,tarmac);
for(const x of [-halfX,halfX]){addBox(.25,.03,112,x-roadWidth*.47,.12,0,roadEdge);addBox(.25,.03,112,x+roadWidth*.47,.12,0,roadEdge)}
for(const z of [-halfZ,halfZ]){addBox(112,.03,.25,0,.12,z-roadWidth*.47,roadEdge);addBox(112,.03,.25,0,.12,z+roadWidth*.47,roadEdge)}

// Central off-road strip and three classic bump ramps.
addBox(17,.10,100,0,.01,0,dirt);
addBox(17,.10,24,0,.07,-39,grass);

const ramps=[];
function rampEase(t){t=THREE.MathUtils.clamp(t,0,1);return t*t*(3-2*t)}
function rampGeo(w,l,h,segments=12){
 const p=[],idx=[];for(let i=0;i<=segments;i++){const t=i/segments,z=-l/2+t*l,y=.04+rampEase(t)*h;p.push(-w/2,y,z,w/2,y,z)}
 for(let i=0;i<segments;i++){const a=i*2,b=a+1,c=a+2,d=a+3;idx.push(a,c,b,b,c,d)}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));g.setIndex(idx);g.computeVertexNormals();return g
}
function addRamp(x,z,yaw,w=7,l=11,h=1.8){
 const group=new THREE.Group();group.position.set(x,0,z);group.rotation.y=yaw;
 const top=new THREE.Mesh(rampGeo(w,l,h),rampMat);top.castShadow=true;top.receiveShadow=true;group.add(top);
 for(const sx of [-1,1]){const skirt=addLocalSide(group,sx,w,l,h)}
 scene.add(group);ramps.push({group,x,z,yaw,width:w,length:l,height:h,dir:new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),side:new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw))});
}
function addLocalSide(group,s,w,l,h){
 const g=new THREE.BufferGeometry(),p=[s*w/2,.02,-l/2,s*w/2,.04,-l/2,s*w/2,.02,l/2,s*w/2,h,l/2],idx=s>0?[0,1,2,1,3,2]:[0,2,1,1,2,3];
 g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.Mesh(g,rampSide);m.castShadow=true;m.receiveShadow=true;group.add(m);return m
}
addRamp( halfX, 2,Math.PI,7.4,12.5,1.85);
addRamp(-halfX,-2,0,7.4,12.5,1.85);
for(const z of [-22,0,22])addRamp(0,z,0,8.3,7.2,.72);

// Fixing hoop after the left-straight ramp.
const hoopMat=new THREE.MeshStandardMaterial({color:0x52e7d9,emissive:0x1b827b,emissiveIntensity:2.2,metalness:.35,roughness:.2});
const hoop=new THREE.Mesh(new THREE.TorusGeometry(3.4,.24,12,44),hoopMat);hoop.position.set(-halfX,3.6,11);hoop.castShadow=true;scene.add(hoop);
const hoopLight=new THREE.PointLight(0x63f6e7,9,18,2);hoopLight.position.copy(hoop.position);scene.add(hoopLight);

// Checkpoint gates and start line.
const cpMat=new THREE.MeshStandardMaterial({color:0x85f0e7,emissive:0x1d6763,emissiveIntensity:1.25,transparent:true,opacity:.58,side:THREE.DoubleSide});
function gate(x,z,rot=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;
 const left=addChildBox(g,.22,5,.22,-5,2.5,0,cpMat),right=addChildBox(g,.22,5,.22,5,2.5,0,cpMat),top=addChildBox(g,10,.22,.22,0,5,0,cpMat);
 scene.add(g);return g
}
function addChildBox(parent,w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
const cp1={pos:new THREE.Vector3(halfX,0,-45),gate:gate(halfX,-45,0),name:"CP 1"};
const cp2={pos:new THREE.Vector3(-halfX,0,45),gate:gate(-halfX,45,0),name:"CP 2"};
const startLine=addBox(roadWidth*.9,.03,.8,halfX,.12,28,mat(0xe6e3d1,.05,.55));
for(let i=-4;i<=4;i+=2)addBox(1.0,.035,.82,halfX+i,.14,28,mat(0x1d2021,.03,.82));

// Sparse retro scenery.
for(const [x,z] of [[-105,-73],[-112,70],[108,-68],[116,72],[0,-92],[0,92]]) {
 const trunk=addBox(.45,3,.45,x,1.5,z,mat(0x66503b,.02,.9));
 const crown=new THREE.Mesh(new THREE.ConeGeometry(2.3,5,7),mat(0x3e6239,.01,.92));crown.position.set(x,5,z);scene.add(crown);
}

// Cars and destruction.
function adaptBuilt(built){
 const root=built.root;root.userData.damage=[];root.userData.parts=built.assemblies||[];root.userData.wheels=[];root.userData.parkside=true;
 for(const part of root.userData.parts){part.traverse(o=>{if(o.isMesh)root.userData.damage.push(o)});if(part.name.startsWith("wheel-"))root.userData.wheels.push({steerPivot:part,rollPivot:part,front:part.name.includes("front")})}
 return root;
}
function buildCar(id){const cfg=VEHICLES.find(v=>v.id===id);const built=id==="roadster"?buildRoadster(THREE):buildDetailedVehicle(THREE,cfg);const root=adaptBuilt(built);root.scale.setScalar(1.05);return root}
function radiusFor(id){const c=VEHICLES.find(v=>v.id===id);const h=c?.halfLength??c?.box?.[2]??2.4;return THREE.MathUtils.clamp(h*.92,2.18,2.82)}

const haloTexture=(()=>{const cv=document.createElement("canvas");cv.width=cv.height=96;const x=cv.getContext("2d"),g=x.createRadialGradient(48,48,1,48,48,47);g.addColorStop(0,"#fff");g.addColorStop(.16,"rgba(90,180,255,.95)");g.addColorStop(.44,"rgba(255,183,55,.72)");g.addColorStop(1,"rgba(255,60,0,0)");x.fillStyle=g;x.fillRect(0,0,96,96);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t})();
function addExhaust(root,id){
 const cfg=VEHICLES.find(v=>v.id===id),rear=(cfg?.rear??1.6)+.72,track=Math.min(.78,(cfg?.track??.98)*.72);root.userData.exhaustFlames=[];
 for(const side of [-1,1]){
  const g=new THREE.Group();g.position.set(side*track,.40,rear);g.visible=false;
  const mk=(color,op)=>new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  const outer=new THREE.Mesh(new THREE.ConeGeometry(.145,1.16,14,1,true),mk(0xff4b0f,.68));outer.rotation.x=Math.PI/2;outer.position.z=.54;
  const amber=new THREE.Mesh(new THREE.ConeGeometry(.10,.86,12,1,true),mk(0xffae28,.82));amber.rotation.x=Math.PI/2;amber.position.z=.39;
  const blue=new THREE.Mesh(new THREE.ConeGeometry(.068,.59,10,1,true),mk(0x3a9cff,.92));blue.rotation.x=Math.PI/2;blue.position.z=.26;
  const core=new THREE.Mesh(new THREE.ConeGeometry(.036,.37,9,1,true),mk(0xeaf8ff,.96));core.rotation.x=Math.PI/2;core.position.z=.17;
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTexture,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));halo.position.z=.18;halo.scale.setScalar(.48);
  const light=new THREE.PointLight(0xff7a22,0,6,2);light.position.z=.36;g.add(outer,amber,blue,core,halo,light);root.add(g);root.userData.exhaustFlames.push({group:g,outer,amber,blue,core,halo,light});
 }
}

function makeCar(id,isPlayer,skill=.4){
 const mesh=buildCar(id);if(isPlayer)addExhaust(mesh,id);scene.add(mesh);
 return {id,mesh,isPlayer,skill,hp:100,alive:true,speed:0,heading:0,knock:new THREE.Vector3(),hitTimer:0,collisionRadius:radiusFor(id),durability:isPlayer?3:1,impactResistance:isPlayer?.58:1,bodyFlex:isPlayer?.72:1,airborne:false,verticalVel:0,rampCooldown:0,power:isPlayer?45:35+skill*28,lastThrottle:0,backfire:0,lap:0,routeIndex:0,stage:0,gateCooldown:0,repairCooldown:0,attackTimer:0,target:null};
}
const roster=["newyorker","roadster","santafe","jalopy","wiener","maybach","nova","e250"];
const player=makeCar("newyorker",true,.5),cars=[player];
const aiSkills=[.20,.34,.16,.44,.56,.72,.30];
for(let i=1;i<roster.length;i++)cars.push(makeCar(roster[i],false,aiSkills[i-1]));

// Starting grid on the right straight, before the first ramp.
const grid=[[62,38],[68,38],[62,44],[68,44],[62,50],[68,50],[62,56],[68,56]];
cars.forEach((car,i)=>{car.mesh.position.set(grid[i][0],0,grid[i][1]);car.heading=0;car.mesh.rotation.y=0});

// Clockwise route: start on right straight heading toward top.
const route=[
 new THREE.Vector3(halfX,0,15),new THREE.Vector3(halfX,0,-43),new THREE.Vector3(45,0,-halfZ),
 new THREE.Vector3(-45,0,-halfZ),new THREE.Vector3(-halfX,0,-43),new THREE.Vector3(-halfX,0,43),
 new THREE.Vector3(-45,0,halfZ),new THREE.Vector3(45,0,halfZ),new THREE.Vector3(halfX,0,43),new THREE.Vector3(halfX,0,25)
];

const debris=[];let wrecks=0,gear=1,cameraMode="follow",orbitYaw=0,orbitPitch=.08,orbitDistance=1,cameraDragging=false,cameraPointer=null,cameraLastX=0,cameraLastY=0,wheelDegrees=0,wheelHeld=false,wheelPointer=null,lastPointerAngle=0,gameEnded=false,spectator=false,spectateFocus=null,spectateCut=0;
const input={gas:false,brake:false,handbrake:false},keyboard={left:false,right:false};

function flash(){crashFlash.style.opacity=".72";setTimeout(()=>crashFlash.style.opacity="0",80)}
function crumple(car,world,severity){
 const hit=car.mesh.worldToLocal(world.clone()),amount=Math.min(.52,.042*severity);
 for(const m of car.mesh.userData.damage){const pos=m.geometry.attributes.position;if(!pos)continue;for(let i=0;i<pos.count;i++){const w=new THREE.Vector3(pos.getX(i),pos.getY(i),pos.getZ(i));m.localToWorld(w);const l=car.mesh.worldToLocal(w),d=l.distanceTo(hit);if(d<2){const f=1-d/2,x=Math.sign(l.x-hit.x||1),z=Math.sign(l.z-hit.z||1);pos.setXYZ(i,pos.getX(i)-x*amount*f*.38,pos.getY(i)-amount*f*.15,pos.getZ(i)-z*amount*f*.68)}}pos.needsUpdate=true;m.geometry.computeVertexNormals()}
 if(severity>4&&car.mesh.userData.parts.length){const p=car.mesh.userData.parts[Math.floor(Math.random()*car.mesh.userData.parts.length)];p.rotation.x+=(Math.random()-.5)*.10*severity;p.rotation.z+=(Math.random()-.5)*.07*severity}
}
function damage(car,amount,hit){if(!car.alive)return;car.hp=Math.max(0,car.hp-amount/(car.durability||1));crumple(car,hit,Math.max(.85,(amount/3.2)*(car.bodyFlex||1)));if(car.isPlayer&&amount>1.4)flash();if(car.hp<=0)wreck(car)}
function sparks(point,strength){for(let i=0;i<Math.min(16,4+Math.floor(strength*.45));i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.026,4,3),new THREE.MeshBasicMaterial({color:0xffc35b,transparent:true}));s.position.copy(point).add(new THREE.Vector3(0,.4+Math.random()*.7,0));scene.add(s);debris.push({mesh:s,vel:new THREE.Vector3((Math.random()-.5)*10,2+Math.random()*6,(Math.random()-.5)*10),life:.18+Math.random()*.3,spark:true})}}
function wreck(car){
 if(!car.alive)return;car.alive=false;car.speed=0;
 car.mesh.rotation.z=(Math.random()>.5?1:-1)*(.25+Math.random()*.18);
 car.mesh.userData.damage.forEach(m=>{const ms=Array.isArray(m.material)?m.material:[m.material];for(const q of ms){if(q?.color)q.color.multiplyScalar(.42);if(q&&"roughness" in q)q.roughness=.96}});
 for(const p of car.mesh.userData.parts){p.rotation.x+=(Math.random()-.5)*1.0;p.rotation.z+=(Math.random()-.5)*1.0}
 sparks(car.mesh.position.clone(),18);
 if(car.isPlayer){spectator=true;document.getElementById("touch").style.display="none";document.getElementById("cameraTools").style.display="none";gearText.textContent="SPECTATE"}
 else{wrecks++;wreckText.textContent=wrecks+" / 7";if(cars.filter(c=>!c.isPlayer&&c.alive).length===0)finish(true,"ALL OPPONENTS WASTED")}
}
function finish(win,sub){if(gameEnded)return;gameEnded=true;resultCard.childNodes[0].nodeValue=win?"WIN":"LOSE";resultSub.textContent=sub;result.classList.add("show");setTimeout(()=>result.classList.remove("show"),2600)}
function heal(car){car.hp=100;car.power=Math.min(100,car.power+25);for(const p of car.mesh.userData.parts){p.rotation.x*=.35;p.rotation.z*=.35;if(p.userData?.home)p.position.lerp(p.userData.home,.42)}}

function rampSupport(car){
 if(car.airborne||car.rampCooldown>0)return null;const front=new THREE.Vector3(-Math.sin(car.heading),0,-Math.cos(car.heading));let best=null;
 for(const r of ramps){const dx=car.mesh.position.x-r.x,dz=car.mesh.position.z-r.z,along=dx*r.dir.x+dz*r.dir.z,side=dx*r.side.x+dz*r.side.z;if(Math.abs(side)>r.width*.48||along<-r.length*.54||along>r.length*.57)continue;const align=front.dot(r.dir)*(car.speed>=0?1:-1);if(align<.28)continue;const t=THREE.MathUtils.clamp((along+r.length*.5)/r.length,0,1),y=.04+rampEase(t)*r.height;if(!best||y>best.y)best={r,t,y}}
 return best
}
function jumpPhysics(car,dt){
 car.rampCooldown=Math.max(0,car.rampCooldown-dt);const s=rampSupport(car);
 if(!car.airborne&&s){car.mesh.position.y=Math.max(car.mesh.position.y,s.y);if(s.t>.90&&Math.abs(car.speed)>7){car.airborne=true;car.verticalVel=4.6+Math.min(3.8,Math.abs(car.speed)*.12);car.mesh.position.y=s.r.height+.12;car.rampCooldown=.8;car.airStart=performance.now();}return}
 if(car.airborne){car.verticalVel-=13*dt;car.mesh.position.y+=car.verticalVel*dt;car.mesh.rotation.x=THREE.MathUtils.lerp(car.mesh.rotation.x,THREE.MathUtils.clamp(-car.verticalVel*.018,-.11,.10),Math.min(1,dt*5));if(car.mesh.position.y<=0){const air=Math.min(2.5,(performance.now()-(car.airStart||performance.now()))/1000);car.power=Math.min(100,car.power+air*15);car.mesh.position.y=0;car.mesh.rotation.x=0;car.airborne=false;car.verticalVel=0}}
 else if(car.mesh.position.y>0)car.mesh.position.y=Math.max(0,car.mesh.position.y-5*dt)
}

function angleWrap(v){while(v>Math.PI)v-=Math.PI*2;while(v<-Math.PI)v+=Math.PI*2;return v}
function nearestOpponent(car){const a=cars.filter(c=>c!==car&&c.alive);a.sort((x,y)=>car.mesh.position.distanceToSquared(x.mesh.position)-car.mesh.position.distanceToSquared(y.mesh.position));return a[0]||null}
function updateRace(car,dt){
 car.gateCooldown=Math.max(0,car.gateCooldown-dt);car.repairCooldown=Math.max(0,car.repairCooldown-dt);
 if(car.mesh.position.distanceToSquared(hoop.position)<22&&car.repairCooldown<=0){heal(car);car.repairCooldown=5}
 if(car.isPlayer&&car.gateCooldown<=0){
  if(car.stage===0&&car.mesh.position.distanceToSquared(cp1.pos)<110){car.stage=1;car.gateCooldown=.9}
  else if(car.stage===1&&car.mesh.position.distanceToSquared(cp2.pos)<110){car.stage=2;car.gateCooldown=.9}
  else if(car.stage===2&&Math.abs(car.mesh.position.x-halfX)<10&&Math.abs(car.mesh.position.z-28)<8){car.stage=0;car.lap++;car.gateCooldown=1.2;if(car.lap>=4)finish(true,"4 LAPS COMPLETE")}
 }
}

function playerSteer(){const k=(keyboard.left?1:0)-(keyboard.right?1:0);return k||THREE.MathUtils.clamp(-wheelDegrees/135,-1,1)}
const forward=new THREE.Vector3();
function drive(car,dt,time){
 if(!car.alive||gameEnded&&car.isPlayer)return;
 let throttle=0,brake=0,steer=0,hand=false;
 if(car.isPlayer&&!spectator){throttle=input.gas?1:0;brake=input.brake?1:0;steer=playerSteer();hand=input.handbrake}
 else if(!car.isPlayer){
  if(car.attackTimer>0){car.attackTimer-=dt;if(!car.target?.alive)car.attackTimer=0}
  if(car.attackTimer<=0){
   car.target=null;
   if(car.lap>=1&&Math.random()<.0022*(.6+car.skill)){car.target=nearestOpponent(car);car.attackTimer=1.7+Math.random()*2.1}
  }
  let target;
  if(car.target?.alive)target=car.target.mesh.position;
  else target=route[car.routeIndex];
  const dx=target.x-car.mesh.position.x,dz=target.z-car.mesh.position.z,desired=Math.atan2(-dx,-dz),diff=angleWrap(desired-car.heading);
  steer=THREE.MathUtils.clamp(diff*(.84+car.skill*.75),-1,1);throttle=1;
  if(!car.target&&Math.hypot(dx,dz)<9){car.routeIndex++;if(car.routeIndex>=route.length){car.routeIndex=0;car.lap++;if(car.lap>=4&&!gameEnded)finish(false,(VEHICLES.find(v=>v.id===car.id)?.name||"Opponent")+" WON THE RACE")}}
 }
 const direction=car.isPlayer?gear:1,baseMax=car.isPlayer?30:18+car.skill*5.5,powerFactor=.78+.34*(car.power/100),maxF=baseMax*powerFactor,maxR=11,accel=car.isPlayer?15.2:9+car.skill*5;
 if(throttle){const target=direction===1?maxF:-maxR,step=accel*dt;car.speed+=THREE.MathUtils.clamp(target-car.speed,-step,step)}else car.speed*=Math.pow(.986,dt*60);
 if(brake){const s=27*dt;car.speed=Math.abs(car.speed)<=s?0:car.speed-Math.sign(car.speed)*s}
 if(hand)car.speed*=Math.pow(.88,dt*60);
 car.power=Math.max(18,car.power-dt*.18*Math.max(0,car.power-55)/45);
 const grip=Math.min(1,Math.abs(car.speed)/4),reverse=car.speed>=0?1:-1;car.heading+=steer*(car.isPlayer?1.62:1.5)*dt*grip*reverse;
 forward.set(-Math.sin(car.heading),0,-Math.cos(car.heading));car.mesh.position.addScaledVector(forward,car.speed*dt);car.mesh.position.addScaledVector(car.knock,dt);car.knock.multiplyScalar(Math.pow(.10,dt));if(car.knock.lengthSq()<.0025)car.knock.set(0,0,0);car.mesh.rotation.y=car.heading;
 jumpPhysics(car,dt);updateRace(car,dt);
 const spin=car.speed*dt/.49;for(const w of car.mesh.userData.wheels)w.rollPivot.rotation.x+=spin;
 if(car.isPlayer&&car.mesh.userData.exhaustFlames?.length){
  if(car.lastThrottle>.65&&throttle<.15&&Math.abs(car.speed)>9)car.backfire=.16;car.backfire=Math.max(0,car.backfire-dt);car.lastThrottle=throttle;
  const burst=car.backfire>0,fire=gear===1&&(throttle>.22||burst),heat=Math.max(THREE.MathUtils.clamp((Math.abs(car.speed)-1)/19,0,1)*.7,throttle);
  car.mesh.userData.exhaustFlames.forEach((f,i)=>{f.group.visible=fire;if(!fire){f.light.intensity=0;return}const flick=.88+Math.sin(time*.041+i*2.7)*.08+Math.sin(time*.093+i)*.04,len=(.58+heat*1.35)*(burst?1.55:1),wid=(.84+heat*.3)*(burst?1.12:1);f.outer.scale.set(wid*flick,wid*flick,len*flick);f.amber.scale.set(wid*.82*flick,wid*.82*flick,len*.79*flick);f.blue.scale.set(wid*.62*flick,wid*.62*flick,len*.60*flick);f.core.scale.set(wid*.43*flick,wid*.43*flick,len*.44*flick);f.halo.scale.setScalar(.42+heat*.36);f.light.intensity=1.2+heat*6.5});
 }
 // Keep the field finite without enclosing the classic open track.
 if(Math.abs(car.mesh.position.x)>145){car.mesh.position.x=THREE.MathUtils.clamp(car.mesh.position.x,-145,145);car.speed*=-.25}
 if(Math.abs(car.mesh.position.z)>100){car.mesh.position.z=THREE.MathUtils.clamp(car.mesh.position.z,-100,100);car.speed*=-.25}
 car.hitTimer=Math.max(0,car.hitTimer-dt)
}

function velocity(car){return new THREE.Vector3(-Math.sin(car.heading)*car.speed+car.knock.x,0,-Math.cos(car.heading)*car.speed+car.knock.z)}
function collide(){
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j];if(!a.alive||!b.alive||Math.abs(a.mesh.position.y-b.mesh.position.y)>1.35)continue;const d=b.mesh.position.clone().sub(a.mesh.position);d.y=0;const dist=d.length(),contact=a.collisionRadius+b.collisionRadius;if(dist>=contact)continue;const n=dist>.001?d.multiplyScalar(1/dist):new THREE.Vector3(1,0,0),overlap=contact-dist,sep=overlap*.5+.10;a.mesh.position.addScaledVector(n,-sep);b.mesh.position.addScaledVector(n,sep);const va=velocity(a),vb=velocity(b),closing=va.clone().sub(vb).dot(n),bounce=Math.max(2.2,Math.max(0,closing)*.68);a.knock.addScaledVector(n,-bounce*(a.impactResistance||1));b.knock.addScaledVector(n,bounce*(b.impactResistance||1));const hard=closing>6,loss=hard?.58:.76;a.speed*=a.isPlayer?THREE.MathUtils.lerp(1,loss,.58):loss;b.speed*=b.isPlayer?THREE.MathUtils.lerp(1,loss,.58):loss;const rel=va.sub(vb).length();if(rel>3.2&&a.hitTimer<=0&&b.hitTimer<=0){const hit=a.mesh.position.clone().lerp(b.mesh.position,.5);damage(a,Math.max(1.4,rel*.48),hit);damage(b,Math.max(1.4,rel*.48),hit);a.power=Math.min(100,a.power+rel*.12);b.power=Math.min(100,b.power+rel*.12);sparks(hit,rel);a.hitTimer=b.hitTimer=.34}}
}
function updateDebris(dt){for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.vel.y-=16*dt;d.mesh.position.addScaledVector(d.vel,dt);if(d.mesh.position.y<.1){d.mesh.position.y=.1;d.vel.y*=-.08;d.vel.x*=.72;d.vel.z*=.72}d.life-=dt;if(d.spark)d.mesh.material.opacity=THREE.MathUtils.clamp(d.life/.25,0,1);if(d.life<=0){scene.remove(d.mesh);debris.splice(i,1)}}}

function updateHUD(){
 bodyText.textContent=Math.ceil(player.hp);bodyBar.style.width=player.hp+"%";bodyBar.style.background=player.hp>55?"#bde48c":player.hp>25?"#f0c35e":"#d75a45";bodyLabel.textContent=Math.ceil(player.hp)+"%";
 lapText.textContent=Math.min(4,player.lap+1)+" / 4";speedText.textContent=spectator?"—":Math.round(Math.abs(player.speed)*2.237);powerBar.style.width=player.power+"%";powerLabel.textContent="POWER "+Math.round(player.power);
 if(!spectator){const target=player.stage===0?cp1.pos:player.stage===1?cp2.pos:new THREE.Vector3(halfX,0,28),label=player.stage===0?"CP 1":player.stage===1?"CP 2":"LAP";const dx=target.x-player.mesh.position.x,dz=target.z-player.mesh.position.z,worldAngle=Math.atan2(dx,dz),local=angleWrap(worldAngle-player.heading);guideArrow.style.transform="rotate("+(-THREE.MathUtils.radToDeg(local))+"deg)";guideText.textContent=label}
 else{guideText.textContent=cars.filter(c=>!c.isPlayer&&c.alive).length+" LEFT"}
}

const camTarget=new THREE.Vector3(),camDesired=new THREE.Vector3();
function updateCamera(dt,time){
 if(spectator){
  const alive=cars.filter(c=>!c.isPlayer&&c.alive);if(!alive.length)return;
  if(!spectateFocus?.alive||time*.001>spectateCut){spectateFocus=alive[Math.floor(Math.random()*alive.length)];spectateCut=time*.001+4.8}
  const f=new THREE.Vector3(-Math.sin(spectateFocus.heading),0,-Math.cos(spectateFocus.heading));camDesired.copy(spectateFocus.mesh.position).addScaledVector(f,-16).add(new THREE.Vector3(0,7,0));camera.position.lerp(camDesired,1-Math.pow(.004,dt));camTarget.copy(spectateFocus.mesh.position).add(new THREE.Vector3(0,1,0));camera.lookAt(camTarget);return
 }
 const base=new THREE.Vector3(-Math.sin(player.heading),0,-Math.cos(player.heading)),right=new THREE.Vector3(-base.z,0,base.x),orbit=base.clone().applyAxisAngle(new THREE.Vector3(0,1,0),orbitYaw);camTarget.copy(player.mesh.position).add(new THREE.Vector3(0,1.1,0));
 if(cameraMode==="top"){camDesired.copy(player.mesh.position).add(new THREE.Vector3(Math.sin(orbitYaw)*9,55*orbitDistance,Math.cos(orbitYaw)*9));camera.position.lerp(camDesired,1-Math.pow(.002,dt));camera.lookAt(player.mesh.position);return}
 const dist=(cameraMode==="rear"?8.5:12.5)*orbitDistance,dir=cameraMode==="rear"?1:-1;camDesired.copy(player.mesh.position).addScaledVector(orbit,dist*dir).addScaledVector(right,cameraMode==="follow"?1.1:0).add(new THREE.Vector3(0,(6+orbitPitch*10)*orbitDistance,0));camera.position.lerp(camDesired,1-Math.pow(.0008,dt));camera.lookAt(camTarget.clone().addScaledVector(orbit,cameraMode==="rear"?-8:5.5))
}

// Controls.
function pointerAngle(e){const r=steeringWheel.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))}
steeringWheel.addEventListener("pointerdown",e=>{e.preventDefault();wheelHeld=true;wheelPointer=e.pointerId;lastPointerAngle=pointerAngle(e);steeringWheel.setPointerCapture(e.pointerId)});
steeringWheel.addEventListener("pointermove",e=>{if(!wheelHeld||e.pointerId!==wheelPointer)return;const a=pointerAngle(e),d=angleWrap(a-lastPointerAngle);lastPointerAngle=a;wheelDegrees=THREE.MathUtils.clamp(wheelDegrees+THREE.MathUtils.radToDeg(d),-135,135);wheelArt.style.transform="rotate("+wheelDegrees+"deg)"});
const releaseWheel=e=>{if(e&&wheelPointer!==null&&e.pointerId!==wheelPointer)return;wheelHeld=false;wheelPointer=null};steeringWheel.addEventListener("pointerup",releaseWheel);steeringWheel.addEventListener("pointercancel",releaseWheel);
document.querySelectorAll("[data-input]").forEach(b=>{const k=b.dataset.input;const dn=e=>{e.preventDefault();input[k]=true};const up=e=>{e.preventDefault();input[k]=false};b.addEventListener("pointerdown",dn);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",e=>{if(e.buttons===0)up(e)})});
document.querySelectorAll("[data-gear]").forEach(b=>b.addEventListener("click",()=>{gear=Number(b.dataset.gear);document.querySelectorAll("[data-gear]").forEach(x=>x.classList.toggle("active",x===b));gearText.textContent=gear===1?"D · DRIVE":"R · REVERSE"}));
document.querySelectorAll("[data-camera]").forEach(b=>b.addEventListener("click",()=>{cameraMode=b.dataset.camera;document.querySelectorAll("[data-camera]").forEach(x=>x.classList.toggle("active",x===b))}));
document.getElementById("resetCamera").addEventListener("click",()=>{orbitYaw=0;orbitPitch=.08;orbitDistance=1;cameraMode="follow";document.querySelectorAll("[data-camera]").forEach(x=>x.classList.toggle("active",x.dataset.camera==="follow"))});
document.getElementById("restart").addEventListener("click",()=>location.reload());
canvas.addEventListener("pointerdown",e=>{if(e.button!==0&&e.pointerType==="mouse")return;cameraDragging=true;cameraPointer=e.pointerId;cameraLastX=e.clientX;cameraLastY=e.clientY;canvas.classList.add("dragging");try{canvas.setPointerCapture(e.pointerId)}catch{}});
canvas.addEventListener("pointermove",e=>{if(!cameraDragging||e.pointerId!==cameraPointer)return;orbitYaw+=(e.clientX-cameraLastX)*.0075;orbitPitch=THREE.MathUtils.clamp(orbitPitch+(e.clientY-cameraLastY)*.0045,-.22,.62);cameraLastX=e.clientX;cameraLastY=e.clientY});
const endDrag=e=>{if(cameraPointer!==null&&e.pointerId!==cameraPointer)return;cameraDragging=false;cameraPointer=null;canvas.classList.remove("dragging")};canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("wheel",e=>{e.preventDefault();orbitDistance=THREE.MathUtils.clamp(orbitDistance+Math.sign(e.deltaY)*.1,.72,1.65)},{passive:false});
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k==="w"||k==="arrowup")input.gas=true;if(k==="s"||k==="arrowdown")input.brake=true;if(k==="a"||k==="arrowleft")keyboard.left=true;if(k==="d"||k==="arrowright")keyboard.right=true;if(k===" ")input.handbrake=true;if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault()},{passive:false});
addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(k==="w"||k==="arrowup")input.gas=false;if(k==="s"||k==="arrowdown")input.brake=false;if(k==="a"||k==="arrowleft")keyboard.left=false;if(k==="d"||k==="arrowright")keyboard.right=false;if(k===" ")input.handbrake=false},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener("resize",resize);

let last=performance.now();
function frame(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 if(!wheelHeld&&Math.abs(wheelDegrees)>.05){wheelDegrees*=Math.pow(.12,dt*2.1);if(Math.abs(wheelDegrees)<.15)wheelDegrees=0;wheelArt.style.transform="rotate("+wheelDegrees+"deg)"}
 cars.forEach(c=>drive(c,dt,now));collide();updateDebris(dt);updateHUD();updateCamera(dt,now);renderer.render(scene,camera);requestAnimationFrame(frame)
}
loading.remove();requestAnimationFrame(frame);
</script>
