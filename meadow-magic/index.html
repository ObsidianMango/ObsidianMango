<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meadow Magic</title>
<meta name="theme-color" content="#b4d8cd">
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: #b7dce0; color: #fff9e6; font: 500 13px/1.4 "Inter", system-ui, sans-serif; user-select: none; }
  #world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #world:active { cursor: grabbing; }
  .title { position: fixed; top: max(24px, env(safe-area-inset-top)); left: max(28px, env(safe-area-inset-left)); pointer-events: none; }
  h1 { margin: 0; color: #1c4131; font: 400 clamp(32px, 4vw, 56px)/1 "Instrument Serif", Georgia, serif; letter-spacing: -.055em; text-shadow: 0 1px 12px #e5f2d0aa; }
  .controls { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: max(28px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 14px; padding: 8px 11px; border: 1px solid #f5f5da52; border-radius: 8px; background: #143427cb; box-shadow: 0 4px 22px #10312622; pointer-events: none; }
  .control { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .control + .control { border-left: 1px solid #f8fae044; padding-left: 13px; }
  kbd { min-width: 19px; height: 20px; padding: 1px 3px; text-align: center; border: 1px solid #f8fae044; border-radius: 3px; font: 600 11px/16px "IBM Plex Mono", monospace; }
  .keys { display: flex; gap: 2px; }
  .mouse { width: 12px; height: 17px; border: 1px solid currentColor; border-radius: 7px; position: relative; }
  .mouse::before { content: ""; position: absolute; width: 1px; height: 5px; background: currentColor; top: 2px; left: 4.5px; }
  #aim { position: fixed; top: 50%; left: 50%; width: 7px; height: 7px; border: 1px solid #fff8e5e0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px #25241c70; pointer-events: none; }
  #aim[data-state="charging"] { border-color: #fff4d0; box-shadow: 0 0 9px 2px var(--rune-light, #ff7e30); }
  #aim[data-state="miss"] { border-color: #f09774; }
  #blast-flash { position: fixed; inset: 0; background: radial-gradient(ellipse at var(--flash-x, 50%) var(--flash-y, 50%), #fff3c5 0%, #ffd29a 24%, #f6a66960 70%, transparent 100%); opacity: 0; pointer-events: none; }
  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: max-content; max-width: 85vw; color: #1c4131; background: #f7f7e7; border-radius: 7px; padding: 12px 18px; }
  .touch { display: none; }
  .spell-hud { position: fixed; z-index: 3; inset: max(13px, env(safe-area-inset-top)) 0 auto; display: grid; justify-items: center; pointer-events: none; }
  #spell-bar { display: flex; gap: 4px; padding: 5px; border: 1px solid #ede5c76b; border-radius: 10px; background: #17352ae8; box-shadow: 0 4px 19px #172c323d; pointer-events: auto; }
  .spell { position: relative; display: grid; place-items: center; width: clamp(36px, 7.2vw, 49px); height: clamp(36px, 7.2vw, 46px); border: 1px solid #cfe9d42f; border-radius: 5px; background: #112820ab; color: var(--spell); cursor: pointer; padding: 0; touch-action: manipulation; }
  .spell:hover, .spell:focus-visible { border-color: currentColor; outline: none; }
  .spell[aria-pressed="true"] { border-color: currentColor; box-shadow: inset 0 -2px currentColor; background: #496050; }
  .spell svg { width: 23px; height: 23px; }
  .spell-number { position: absolute; top: 2px; left: 3px; color: #fff7dd; font: 500 9px/1 monospace; }
  #active-spell { margin-top: 4px; border-radius: 4px; padding: 2px 8px; background: #17352ad9; font-size: 11px; }
  @media (max-width: 900px) {
    .title { top: calc(max(13px, env(safe-area-inset-top)) + 76px); }
  }
  @media (max-height: 470px) and (min-width: 901px) {
    .title { top: max(12px, env(safe-area-inset-top)); }
    h1 { font-size: 27px; }
  }
  #stick { position: fixed; z-index: 2; left: max(22px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); width: 93px; height: 93px; border-radius: 50%; border: 1px solid #fff9e78c; background: #183b2e63; touch-action: none; }
  #stick span { position: absolute; inset: 27px; border-radius: 50%; background: #fff9e7b8; box-shadow: 0 2px 8px #14342777; pointer-events: none; }
  @media (pointer: coarse) {
    .touch { display: block; }
    .desktop { display: none; }
    .controls { left: auto; right: max(15px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); }
    .title { left: max(17px, env(safe-area-inset-left)); }
  }
</style>
</head>
<body>
<canvas id="world" aria-label="Meadow Magic first-person meadow"></canvas>
<div id="blast-flash" aria-hidden="true"></div>
<div id="aim" aria-hidden="true" hidden></div>
<header class="title"><h1>Meadow Magic</h1></header>
<div class="spell-hud">
  <nav id="spell-bar" aria-label="Spells"></nav>
  <output id="active-spell" aria-live="polite">Fire</output>
</div>
<div class="controls desktop" aria-label="W A S D to walk. Drag to look. Click to cast. Keys 1 through 7 select spells.">
  <span class="control"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span> Walk</span>
  <span class="control"><span class="mouse" aria-hidden="true"></span> Drag to look</span>
  <span class="control">Click to cast</span>
</div>
<div id="stick" class="touch" role="group" aria-label="Drag to walk"><span></span></div>
<div class="controls touch">Drag to look · Tap to cast</div>
<div id="status" role="status">Opening the meadow…</div>
<script type="module">
const status = document.querySelector('#status');
try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  start(THREE);
  status.hidden = true;
} catch (error) {
  status.textContent = 'Could not open the meadow. Check your connection and use a browser with WebGL 2.';
  console.error(error);
}

function start(T) {
  const canvas = document.querySelector('#world');
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  const compact = matchMedia('(pointer: coarse)').matches;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const pixelRatio = Math.min(devicePixelRatio, compact ? 1.45 : 1.75);
  renderer.setPixelRatio(pixelRatio);
  renderer.setClearColor(0xc6e3e5);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.autoClear = false;

  const scene = new T.Scene();
  scene.fog = new T.FogExp2(0xdcebd6, 0.0115);
  const camera = new T.PerspectiveCamera(57, 1, 0.045, 177);
  camera.rotation.order = 'YXZ';

  const sunDirection = new T.Vector3(-0.59, 0.42, -0.67).normalize();
  const sun = new T.DirectionalLight(0xffebc5, 2.52);
  sun.position.copy(sunDirection).multiplyScalar(70).add(new T.Vector3(0, 0, -11));
  sun.target.position.set(0, 0, -11);
  sun.castShadow = true;
  sun.shadow.mapSize.setScalar(compact ? 1536 : 2048);
  Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 34, bottom: -34, near: 8, far: 147 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.00022;
  sun.shadow.normalBias = 0.065;
  sun.shadow.radius = 2.5;
  scene.add(sun, sun.target, new T.HemisphereLight(0xe4edff, 0x8b916a, 1.34));
  const fill = new T.DirectionalLight(0xd9efff, 0.28);
  fill.position.set(16, 14, 23);
  scene.add(fill);

  // A shader dome supplies the daylight gradient, haze, and drifting clouds.
  const windTime = { value: 0 };
  const sky = new T.Mesh(new T.SphereGeometry(151, 32, 18), new T.ShaderMaterial({
    side: T.BackSide,
    depthWrite: false,
    uniforms: {
      clock: windTime,
      sunDir: { value: sunDirection },
      zenith: { value: new T.Color(0x63b5df) },
      horizon: { value: new T.Color(0xe6f0dc) },
      middle: { value: new T.Color(0xa5d4e6) }
    },
    vertexShader: `
      varying vec3 direction;
      void main() {
        direction = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float clock;
      uniform vec3 sunDir, zenith, horizon, middle;
      varying vec3 direction;
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 f = fract(p), i = floor(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
          mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
      }
      void main() {
        vec3 ray = normalize(direction);
        float y = max(0.0, ray.y);
        vec3 color = mix(horizon, middle, smoothstep(0.0, 0.34, y));
        color = mix(color, zenith, smoothstep(0.22, 0.9, y));
        float towardSun = max(0.0, dot(ray, sunDir));
        color += vec3(0.25, 0.17, 0.078) * pow(towardSun, 9.0);
        color += vec3(0.82, 0.66, 0.38) * smoothstep(0.99925, 0.99982, towardSun);
        vec2 p = ray.xz / (0.30 + max(0.0, ray.y));
        p = p * vec2(3.0, 6.3) + vec2(5.2 - clock * 0.014, 9.7);
        float cloud = noise(p) * 0.60 + noise(p * 2.0) * 0.25 +
          noise(p * 4.1) * 0.10 + noise(p * 8.0) * 0.05;
        float veil = smoothstep(0.55, 0.69, cloud) * smoothstep(0.035, 0.25, y) * 0.88;
        color = mix(color, vec3(0.96, 0.98, 0.92), veil);
        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `
  }));
  sky.frustumCulled = false;
  sky.renderOrder = -100;
  scene.add(sky);

  let seed = 675204;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const between = (a, b) => a + random() * (b - a);
  const pick = (items) => items[Math.floor(random() * items.length)];
  const clamp = T.MathUtils.clamp;
  const V = (x, y, z) => new T.Vector3(x, y, z);
  const TAU = 2 * Math.PI;
  const cottageSite = { x: 8.6, z: -8.8, width: 6.2, depth: 4.6, pad: 4.8 };
  const millSite = { x: -11.8, z: -15.7, radius: 2.45, pad: 3.9 };
  const towerSite = { x: -1.1, z: -31, radius: 3.18, pad: 4.5 };
  const ruinSite = { x: 15.9, z: -22.7, width: 4.6, depth: 1.5, pad: 3.2 };
  const sites = [cottageSite, millSite, towerSite, ruinSite];

  function slope(x, z) {
    const r = Math.hypot(x * 0.84, (z + 9) * 0.95);
    return 0.42 * Math.sin(x * 0.126 + z * 0.051) + 0.29 * Math.cos(z * 0.18) +
      0.27 * Math.sin((x - z) * 0.15) + 0.86 * Math.exp(-((x + 14) ** 2 + (z + 16) ** 2) / 110) +
      T.MathUtils.smoothstep(r, 37, 110) * (8 + 3 * Math.sin(x * 0.09 + z * 0.047) +
      4 * Math.cos(z * 0.08 - x * 0.06));
  }

  function elevation(x, z) {
    let y = slope(x, z);
    for (const site of sites) {
      const blend = 1 - T.MathUtils.smoothstep(Math.hypot(x - site.x, z - site.z), site.pad, site.pad + 2.3);
      if (blend > 0) y += (slope(site.x, site.z) - y) * blend;
    }
    return y;
  }

  function segmentDistance(x, z, ax, az, bx, bz) {
    const u = clamp(((x - ax) * (bx - ax) + (z - az) * (bz - az)) / ((bx - ax) ** 2 + (bz - az) ** 2), 0, 1);
    return Math.hypot(x - ax - u * (bx - ax), z - az - u * (bz - az));
  }

  function roadX(z) {
    return 0.35 + 1.75 * Math.sin((z - 5) * 0.107) + 0.5 * Math.sin(z * 0.23);
  }

  function verge(x, z) {
    const main = z > -29 && z < 27 ? Math.abs(x - roadX(z)) - 0.83 + 0.13 * Math.sin(z * 2) : 99;
    const cottage = segmentDistance(x, z, roadX(0), 0, 4.8, -3.2) - 0.61;
    const doorstep = segmentDistance(x, z, 4.8, -3.2, 8.55, -6.4) - 0.61;
    const mill = segmentDistance(x, z, roadX(-10), -10, -8.2, -13.1) - 0.56;
    const millstep = segmentDistance(x, z, -8.2, -13.1, -11.5, -13.5) - 0.52;
    return Math.min(main, cottage, doorstep, mill, millstep);
  }

  const materials = new Map();
  function matte(color) {
    if (!materials.has(color)) {
      materials.set(color, new T.MeshStandardMaterial({ color, roughness: 0.96, flatShading: true }));
    }
    return materials.get(color);
  }
  function mesh(parent, geometry, surface, x = 0, y = 0, z = 0, shadows = true) {
    const object = new T.Mesh(geometry, surface);
    object.position.set(x, y, z);
    object.castShadow = shadows;
    object.receiveShadow = shadows;
    parent.add(object);
    return object;
  }
  const boxGeometry = new T.BoxGeometry(1, 1, 1);
  const roundGeometry = new T.IcosahedronGeometry(1, 1);
  const detailedRock = new T.IcosahedronGeometry(1, 2);
  function box(parent, color, x, y, z, w, h, d, rz = 0) {
    const object = mesh(parent, boxGeometry, matte(color), x, y, z);
    object.scale.set(w, h, d);
    object.rotation.z = rz;
    return object;
  }
  function round(parent, color, x, y, z, w, h, d, geometry = roundGeometry) {
    const object = mesh(parent, geometry, matte(color), x, y, z);
    object.scale.set(w, h, d);
    object.rotation.y = between(0, TAU);
    return object;
  }
  function cylinder(parent, color, x, y, z, top, base, height, sides = 12) {
    return mesh(parent, new T.CylinderGeometry(top, base, height, sides), matte(color), x, y, z);
  }
  function limb(parent, color, a, b, base, tip, sides = 7) {
    const dir = b.clone().sub(a);
    const middle = a.clone().addScaledVector(dir, 0.5);
    const object = cylinder(parent, color, middle.x, middle.y, middle.z, tip, base, dir.length(), sides);
    object.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
    return object;
  }
  function place(site) {
    const group = new T.Group();
    group.position.set(site.x, elevation(site.x, site.z), site.z);
    scene.add(group);
    return group;
  }
  function instance(parent, geometry, surface, data, shadows = true, reserve = 0) {
    const batch = new T.InstancedMesh(geometry, surface, data.length + reserve);
    batch.count = data.length;
    const dummy = new T.Object3D();
    data.forEach((item, index) => {
      dummy.position.copy(item.position);
      dummy.scale.copy(item.scale);
      dummy.rotation.set(0, item.yaw || 0, item.roll || 0);
      dummy.updateMatrix();
      batch.setMatrixAt(index, dummy.matrix);
      if (item.color !== undefined) batch.setColorAt(index, new T.Color(item.color));
    });
    batch.castShadow = shadows;
    batch.receiveShadow = true;
    parent.add(batch);
    return batch;
  }
  const entry = (x, y, z, sx, sy, sz, color, yaw = 0, roll = 0) => ({
    position: V(x, y, z), scale: V(sx, sy, sz), color, yaw, roll
  });

  // Ground color is painted onto a generated terrain grid.
  const terrain = new T.PlaneGeometry(265, 265, 320, 320).rotateX(-Math.PI / 2);
  const groundPositions = terrain.attributes.position;
  const groundColors = [];
  const groundGrassCover = [];
  const grassA = new T.Color(0x779859);
  const grassB = new T.Color(0x9bad6b);
  const pathA = new T.Color(0xbba685);
  const pathB = new T.Color(0xd3bd9b);
  const color = new T.Color();
  for (let i = 0; i < groundPositions.count; i++) {
    const x = groundPositions.getX(i), z = groundPositions.getZ(i) - 11;
    groundPositions.setXYZ(i, x, elevation(x, z), z);
    const mottling = clamp(0.52 + 0.17 * Math.sin(x * 0.51 + z * 0.24) +
      0.14 * Math.sin(x * 0.13 - z * 0.52) + between(-0.15, 0.15), 0, 1);
    const edge = T.MathUtils.smoothstep(verge(x, z), -0.25, 0.42);
    color.copy(pathA).lerp(pathB, mottling).lerp(grassA.clone().lerp(grassB, mottling), edge);
    groundColors.push(color.r, color.g, color.b);
    groundGrassCover.push(edge);
  }
  terrain.setAttribute('color', new T.Float32BufferAttribute(groundColors, 3));
  terrain.setAttribute('grassCover', new T.Float32BufferAttribute(groundGrassCover, 1));
  terrain.computeVertexNormals();
  const ground = mesh(scene, terrain, new T.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), 0, 0, 0, false);
  ground.receiveShadow = true;
  const scorch = makeScorch();
  const frost = makeScorch('frost');
  const gustWave = { value: new T.Vector4(0, 0, 0, -1) };
  const gustDirection = { value: new T.Vector2(0, -1) };
  ground.material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, scorch.uniforms, frost.uniforms);
    shader.vertexShader = 'attribute float grassCover;\nvarying float burnable;\nvarying vec2 scorchPosition;\n' + shader.vertexShader.replace(
      '#include <begin_vertex>', '#include <begin_vertex>\nscorchPosition = position.xz;\nburnable = grassCover;'
    );
    shader.fragmentShader = scorch.glsl + frost.glsl + 'varying float burnable;\nvarying vec2 scorchPosition;\n' + shader.fragmentShader.replace(
      '#include <color_fragment>', `
        #include <color_fragment>
        float burned = scorchAt(scorchPosition) * burnable;
        if (burned > 0.0) {
          float ashGrain = fract(sin(dot(floor(scorchPosition * 47.0), vec2(12.9898, 78.233))) * 43758.5453);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.021, 0.015, 0.011) * (0.75 + ashGrain * 0.5), burned * 0.93);
        }
        float frozen = frostAt(scorchPosition) * burnable;
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.54, 0.74, 0.83), frozen * 0.78);
      `
    );
  };

  // The keep's blocks are wedges, leaving narrow mortar joints.
  const stone = [0x989c86, 0xafad95, 0x868d79, 0xb9b59c, 0x9c9d90, 0xa6a591, 0x7f897b];
  const darkStone = 0x7f8473;
  const mortar = 0x6d7465;
  function wedge(radius, height, halfAngle, thickness) {
    const shape = new T.Shape();
    const outer = radius, inner = radius - thickness;
    for (let i = 0; i <= 3; i++) {
      const a = -halfAngle + i * halfAngle * 2 / 3;
      const x = Math.sin(a) * outer, z = -Math.cos(a) * outer;
      if (i === 0) shape.moveTo(x, z);
      else shape.lineTo(x, z);
    }
    for (let i = 3; i >= 0; i--) {
      const a = -halfAngle + i * halfAngle * 2 / 3;
      shape.lineTo(Math.sin(a) * inner, -Math.cos(a) * inner);
    }
    shape.closePath();
    return new T.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false })
      .rotateX(-Math.PI / 2).translate(0, -height / 2, 0);
  }
  function archShape(width, height) {
    const arch = new T.Shape();
    const r = width / 2;
    arch.moveTo(-r, 0);
    arch.lineTo(r, 0);
    arch.lineTo(r, height - r);
    arch.absarc(0, height - r, r, 0, Math.PI, false);
    arch.lineTo(-r, 0);
    return arch;
  }
  function archFace(parent, x, y, z, width, height, surface) {
    return mesh(parent, new T.ExtrudeGeometry(archShape(width, height), {
      depth: 0.035, bevelEnabled: false, curveSegments: 10
    }), matte(surface), x, y, z);
  }
  function archBlocks(parent, x, y, z, width, height, thickness, depth, palette) {
    const r = width / 2;
    const spring = height - r;
    for (const side of [-1, 1]) {
      const courses = Math.max(2, Math.round(spring / 0.32));
      for (let i = 0; i < courses; i++) {
        box(parent, pick(palette), x + side * (r + thickness / 2), y + (i + 0.5) * spring / courses, z,
          thickness, spring / courses - 0.022, depth);
      }
    }
    for (let i = 0; i < 9; i++) {
      const a = (i + 0.5) * Math.PI / 9;
      box(parent, pick(palette), x + Math.cos(a) * (r + thickness / 2),
        y + spring + Math.sin(a) * (r + thickness / 2), z,
        thickness, (r + thickness / 2) * Math.PI / 9 + 0.01, depth, a);
    }
  }

  const tower = place(towerSite);
  cylinder(tower, darkStone, 0, 0.20, 0, 3.09, 3.24, 0.54, 32);
  cylinder(tower, mortar, 0, 4.75, 0, 2.67, 2.93, 9.2, 40);
  const blockCount = 28;
  const towerBlocks = [];
  const windowRows = [10, 11, 12, 18, 19];
  for (let row = 0; row < 23; row++) {
    const taper = 1 - row * 0.0032;
    for (let j = 0; j < blockCount; j++) {
      const angle = (j + (row % 2) * 0.5) * TAU / blockCount;
      const front = Math.cos(angle) > 0.99;
      if (front && (row < 5 || windowRows.includes(row))) continue;
      const scale = taper * between(0.993, 1.009);
      towerBlocks.push(entry(0, 0.64 + row * 0.385, 0, scale, between(0.94, 1.03), scale, pick(stone), angle));
    }
  }
  instance(tower, wedge(3.03, 0.363, Math.PI / blockCount - 0.006, 0.28), matte(0xffffff), towerBlocks);
  cylinder(tower, 0x777d6d, 0, 8.88, 0, 2.96, 2.69, 0.38, 32);
  cylinder(tower, 0xa9a994, 0, 9.14, 0, 3.10, 2.99, 0.31, 32);
  cylinder(tower, darkStone, 0, 9.43, 0, 3.01, 3.03, 0.45, 32);
  const crenels = [];
  for (let i = 0; i < 12; i++) {
    const a = i * TAU / 12;

        transformed.y *= 1.0 - charAmount * 0.39;

      `);
    };

              float rim = smoothstep(0.0, 1.0, 0.51 + cardUV.y * 0.28 + (n - 0.5) * 0.6);

              color += vec3(0.16, 0.045, 0.010) * (1.0 - age) * smoothstep(0.3, 1.0, -cardUV.y);
            } else {
              float heat = smoothstep(0.15, 0.83, field + n * 0.16 - age * 0.33);
              color = mix(vec3(0.63, 0.044, 0.008), vec3(1.0, 0.44, 0.054), heat);
              float flash = smoothstep(0.67, 1.0, heat) * (1.0 - smoothstep(0.04, 0.48, age));
              color = mix(color, vec3(1.0, 0.80, 0.32), flash);
            }
            float fog = 1.0 - exp(-density * density * distanceToCamera * distanceToCamera);
            gl_FragColor = vec4(mix(color, mist, fog), inside * data.x);
            #include <colorspace_fragment>
          }
        `
      });
      const batch = new T.Mesh(geometry, material);
      batch.frustumCulled = false;
      batch.renderOrder = isSmoke ? 3 : 4;
      effects.add(batch);
      return { geometry, center, shape, seed };
    }

    function paintRune(rune, point, normal, followsGround) {
      const attribute = rune.geometry.attributes.position;
      rune.position.copy(point);
      if (followsGround) {
        rune.quaternion.identity();
        for (let i = 0; i < attribute.count; i++) {
          const x = planePositions[i * 3], z = -planePositions[i * 3 + 1];
          attribute.setXYZ(i, x, elevation(point.x + x, point.z + z) - point.y + 0.052, z);
        }
      } else {
        rune.position.addScaledVector(normal, 0.065);
        rune.quaternion.setFromUnitVectors(localZ, normal);
        attribute.array.set(planePositions);
      }
      attribute.needsUpdate = true;
      rune.material.uniforms.progress.value = 0;
      rune.visible = true;
    }

    function cast(origin, yaw, pitch, now) {
      if (now - lastCast < cooldown) return;
      const slot = casts.find(item => !item.spell || now - item.time >= item.spell.duration + item.spell.fuse);
      if (!slot) return;
      const cos = Math.cos(pitch);
      direction.set(-Math.sin(yaw) * cos, Math.sin(pitch), -Math.cos(yaw) * cos);
      raycaster.set(origin, direction);
      intersections.length = 0;
      raycaster.intersectObjects(targets.concat(demolition.targets), true, intersections);
      const hit = intersections[0];
      if (!hit) {
        missUntil = now + 0.20;
        return;
      }
      slot.point.copy(hit.point);
      if (slot.visual) slot.visual.group.visible = false;
      slot.hitObject = hit.object;
      slot.hitInstance = hit.instanceId;
      const choice = spellSelection();
      slot.spell = spellBook[choice];
      slot.heading.set(-Math.sin(yaw), 0, -Math.cos(yaw));
      const { sigil, runeOuter, runeInner } = slot.rune.material.uniforms;
      sigil.value = choice;
      if (choice === 0) {
        runeOuter.value.setRGB(1, 0.16, 0.015);
        runeInner.value.setRGB(1, 0.77, 0.37);
      } else {
        runeOuter.value.set(slot.spell.color).multiplyScalar(0.68);
        runeInner.value.set(slot.spell.color).lerp(special.white, 0.55);
      }
      aim.style.setProperty('--rune-light', slot.spell.color);
      worldMatrix.copy(hit.object.matrixWorld);
      if (hit.instanceId !== undefined) {
        hit.object.getMatrixAt(hit.instanceId, instanceMatrix);
        worldMatrix.multiply(instanceMatrix);
      }
      slot.normal.copy(hit.face.normal).applyNormalMatrix(normalMatrix.getNormalMatrix(worldMatrix));
      if (slot.normal.dot(direction) > 0) slot.normal.negate();
      paintRune(slot.rune, slot.point, slot.normal, hit.object === ground);
      slot.time = lastCast = now;
      slot.exploded = false;
      slot.charStage = 0;
      slot.radius = 0;
      staffCastAt = now;
      staffCastFuse = slot.spell.fuse;
      audio.charge(clamp(1 / (1 + hit.distance * 0.053), 0.21, 1));
    }
    function makePuff(point, smoke, ember = false) {
      const a = variation(0, TAU), r = variation(0.12, 0.67);
      const x = Math.cos(a), z = Math.sin(a);
      const speed = smoke ? variation(0.60, 2.8) : variation(3.4, 9.3);
      const delay = ember ? variation(0.22, 0.74) : smoke ? variation(0.095, 0.56) : variation(0.0, 0.15);
      const life = smoke ? variation(2.65, 3.59) : ember ? variation(0.82, 1.72) : variation(0.51, 1.19);
      const origin = point.clone();
      if (ember) {
        const spread = variation(1.3, blastRadius * 0.87);
        origin.x += x * spread;
        origin.z += z * spread;
        origin.y = elevation(origin.x, origin.z) + 0.11;
      } else {
        origin.x += x * r;
        origin.y += variation(0.05, smoke ? 1.26 : 0.84);
        origin.z += z * r;
      }
      return {
        position: origin.clone(), origin, delay, life, seed: variation(0, 37),
        vx: ember ? x * 0.23 : x * speed, vz: ember ? z * 0.23 : z * speed,
        vy: ember ? variation(0.18, 0.64) : variation(0.85, smoke ? 2.52 : 5.20),
        size: smoke ? variation(0.53, 1.23) : ember ? variation(0.15, 0.32) : variation(0.42, 1.03),
        growth: smoke ? variation(0.44, 0.82) : ember ? 0.17 : variation(0.75, 1.85),
        spin: variation(-1.6, 1.6), angle: variation(0, TAU)
      };
    }

    function makeFragment(origin, normal, hot) {
      const a = variation(0, TAU), speed = hot ? variation(5.5, 19) : variation(3.2, 10.4);
      const life = hot ? variation(0.61, 1.75) : variation(1.05, 2.25);
      const velocity = V(Math.cos(a) * speed, variation(2.0, hot ? 12.0 : 8.40), Math.sin(a) * speed);
      if (velocity.dot(normal) < 0) velocity.reflect(normal);
      return {
        position: origin.clone().add(V(variation(-0.18, 0.18), variation(0.05, 0.41), variation(-0.18, 0.18))),
        velocity,
        spin: V(variation(-11, 11), variation(-9, 9), variation(-8, 8)),
        color: debrisColors[Math.floor(variation(0, debrisColors.length))],
        size: hot ? variation(0.018, 0.052) : variation(0.07, 0.23), life
      };
    }

    function detonate(slot) {
      slot.exploded = true;
      slot.rune.visible = false;
      const spell = slot.spell.id;
      if (spell !== 'fire') {
        const planted = spell === 'growth' ? growth.plant(slot.point) : null;
        const origin = special.begin(slot, planted);
        if (spell === 'wind') {
          gustWave.value.set(origin.x, origin.z, windTime.value, 1);
          gustDirection.value.set(slot.heading.x, slot.heading.z);
        }
        if (spell !== 'growth' && spell !== 'frost') {
          demolition.blast(origin, slot.hitObject, slot.hitInstance, spell, slot.heading, slot.normal);
        }
        audio.magic(spell, 1 / (1 + camera.position.distanceTo(origin) * 0.076));
        return;
      }
      demolition.blast(slot.point, slot.hitObject, slot.hitInstance, 'fire', slot.heading, slot.normal);
      const origin = slot.point.clone().addScaledVector(slot.normal, 0.30);
      const height = Math.max(0, slot.point.y - elevation(slot.point.x, slot.point.z));
      slot.radius = Math.sqrt(Math.max(0, blastRadius ** 2 - height ** 2));
      for (const list of [slot.flames, slot.smoke, slot.sparks, slot.shards]) list.length = 0;
      for (let i = 0; i < counts.flame; i++) slot.flames.push(makePuff(origin, false));
      if (height < 0.8) for (let i = 0; i < counts.ember; i++) slot.flames.push(makePuff(origin, false, true));
      for (let i = 0; i < counts.smoke; i++) slot.smoke.push(makePuff(origin, true));
      for (let i = 0; i < counts.spark; i++) slot.sparks.push(makeFragment(origin, slot.normal, true));
      for (let i = 0; i < counts.shard; i++) slot.shards.push(makeFragment(origin, slot.normal, false));
      const distance = camera.position.distanceTo(origin);
      const force = 1 / (1 + distance * 0.076);
      shake = Math.max(shake, 0.32 * force);
      direction.copy(origin).sub(camera.position);
      const forwards = direction.normalize().dot(forward);
      if (forwards > 0.52) {
        screenFlash = 0.20 * (0.45 + force * 0.55);
        flashPoint = origin;
      }
      const pan = clamp(direction.x * forward.z * -1 + direction.z * forward.x, -1, 1);
      audio.boom(clamp(force * 1.28, 0.17, 1), pan);
    }

    function animatePuffs(list, time, isSmoke, destination) {
      for (const p of list) {
        const age = time - p.delay;
        if (age <= 0 || age >= p.life) continue;
        const unit = age / p.life;
        const travel = (1 - Math.exp(-age * (isSmoke ? 1.32 : 3.0))) / (isSmoke ? 1.32 : 3.0);
        p.position.set(p.origin.x + p.vx * travel + age * age * 0.11,
          p.origin.y + p.vy * (isSmoke ? age * 0.74 : travel),
          p.origin.z + p.vz * travel + age * 0.15);
        p.diameter = p.size + p.growth * (isSmoke ? age : Math.sqrt(age));
        p.rotation = p.angle + p.spin * age;
        p.alpha = (isSmoke ? 0.54 : 0.75) * Math.min(1, age / (isSmoke ? 0.32 : 0.062)) *
          (1 - T.MathUtils.smoothstep(unit, isSmoke ? 0.28 : 0.12, 1));
        p.unit = unit;
        p.depth = p.position.dot(forward);
        destination.push(p);
      }
    }

    function drawPuffs(batch, list) {
      list.sort((a, b) => b.depth - a.depth);
      list.forEach((p, i) => {
        batch.center.setXYZ(i, p.position.x, p.position.y, p.position.z);
        batch.shape.setXYZW(i, p.diameter, p.rotation, p.alpha, p.unit);
        batch.seed.setX(i, p.seed);
      });
      batch.geometry.instanceCount = list.length;
      if (list.length) batch.center.needsUpdate = batch.shape.needsUpdate = batch.seed.needsUpdate = true;
    }

    function drawFragments(list, time, dt, hot, batch, index) {
      for (const p of list) {
        if (time > p.life) continue;
        p.velocity.y -= (hot ? 12 : 17) * dt;
        p.position.addScaledVector(p.velocity, dt);
        const floor = elevation(p.position.x, p.position.z) + p.size * 0.44;
        if (p.position.y < floor) {
          p.position.y = floor;
          p.velocity.y = Math.abs(p.velocity.y) * (hot ? 0.16 : 0.30);
          p.velocity.x *= 0.68;
          p.velocity.z *= 0.68;
        }
        const unit = time / p.life;
        const shrink = 1 - T.MathUtils.smoothstep(unit, 0.67, 1) * 0.66;
        const size = p.size * shrink;
        dummy.position.copy(p.position);
        if (hot) {
          direction.copy(p.velocity).normalize();
          dummy.quaternion.setFromUnitVectors(up, direction);
          dummy.scale.set(size, (0.058 + p.velocity.length() * 0.031) * shrink, size);
          batch.setColorAt(index, emberColor.copy(emberStart).lerp(emberEnd, unit ** 0.55));
        } else {
          dummy.rotation.set(time * p.spin.x, time * p.spin.y, time * p.spin.z);
          dummy.scale.set(size * 1.15, size * 0.73, size);
          batch.setColorAt(index, p.color);
        }
        batch.userData.opacity.setX(index, 1 - T.MathUtils.smoothstep(unit, 0.23, 1));
        dummy.updateMatrix();
        batch.setMatrixAt(index++, dummy.matrix);
      }
      return index;
    }

    function finishBatch(batch, count) {
      batch.count = count;
      if (count) batch.instanceColor.needsUpdate = batch.instanceMatrix.needsUpdate =
        batch.userData.opacity.needsUpdate = true;
    }

    function update(now, dt) {
      camera.updateMatrixWorld();
      camera.getWorldDirection(forward);
      puffs.length = haze.length = 0;
      let sparkCount = 0, debrisCount = 0, light = 0, charging = false, lightColor = 0xff922d;
      special.startFrame();
      for (const slot of casts) {
        if (!slot.spell) continue;
        const { id, fuse, duration } = slot.spell;
        const age = now - slot.time, blastAge = age - fuse;
        if (blastAge < 0) {
          charging = true;
          slot.rune.material.uniforms.progress.value = T.MathUtils.smoothstep(age, 0, fuse);
          const glow = 1.6 + 4.0 * age / fuse;
          if (glow > light) {
            light = glow;
            lightColor = id === 'fire' ? 0xff922d : slot.spell.color;
            firelight.position.copy(slot.point).addScaledVector(slot.normal, 0.62);
          }
          continue;
        }
        if (blastAge >= duration) {
          if (slot.visual) slot.visual.group.visible = false;
          continue;
        }
        if (!slot.exploded) detonate(slot);
        if (id !== 'fire') {
          const glow = special.draw(slot, blastAge);
          if (glow > light) {
            light = glow;
            lightColor = slot.spell.color;
            firelight.position.copy(slot.visual.center).add(V(0, 0.65, 0));
          }
          const stage = Math.min(5, 1 + Math.floor(blastAge * 12.0));
          if (id === 'frost' && stage > slot.charStage) {
            const { x, z } = slot.visual.center;
            frost.stamp(x, z, 0.85 + stage * 0.84);
            slot.charStage = stage;
          }
          continue;
        }
        const glow = 185 * Math.exp(-blastAge * 9.4) + 15 * Math.exp(-blastAge * 2.8);
        if (glow > light) {
          light = glow;
          lightColor = 0xff922d;
          firelight.position.copy(slot.point).addScaledVector(slot.normal, 0.83);
        }
        const stage = Math.min(5, 1 + Math.floor(blastAge * 12.0));
        if (slot.radius > 0.25 && stage > slot.charStage) {
          scorch.stamp(slot.point.x, slot.point.z, slot.radius * (0.28 + stage * 0.144));
          slot.charStage = stage;
        }
        animatePuffs(slot.flames, blastAge, false, puffs);
        animatePuffs(slot.smoke, blastAge, true, haze);
        sparkCount = drawFragments(slot.sparks, blastAge, dt, true, sparks, sparkCount);
        debrisCount = drawFragments(slot.shards, blastAge, dt, false, debris, debrisCount);
      }
      firelight.intensity = light;
      firelight.color.set(lightColor);
      special.finishFrame();
      drawPuffs(fireCloud, puffs);
      drawPuffs(smokeCloud, haze);
      finishBatch(sparks, sparkCount);
      finishBatch(debris, debrisCount);
      const state = charging ? 'charging' : now < missUntil ? 'miss' : '';
      if (state !== aimState) aim.dataset.state = aimState = state;

      if (shake > 0) {
        if (!reducedMotion.matches) {
          const strength = Math.min(1, shake / 0.24);
          camera.rotation.x += Math.sin(now * 71) * strength * 0.009;
          camera.rotation.y += Math.sin(now * 48) * strength * 0.007;
          camera.position.x += Math.sin(now * 90) * strength * 0.037;
          camera.position.y += Math.cos(now * 63) * strength * 0.026;
        }
        shake = Math.max(0, shake - dt);
      }
      if (screenFlash > 0 && flashPoint) {
        projected.copy(flashPoint).project(camera);
        flash.style.setProperty('--flash-x', (50 + clamp(projected.x, -1, 1) * 50) + '%');
        flash.style.setProperty('--flash-y', (50 - clamp(projected.y, -1, 1) * 50) + '%');
        screenOpacity = Math.min(reducedMotion.matches ? 0.13 : 0.52, screenFlash * 2.7);
        flash.style.opacity = String(screenOpacity);
        screenFlash = Math.max(0, screenFlash - dt);
      } else if (screenOpacity) {
        flash.style.opacity = '0';
        screenOpacity = 0;
      }
    }

    return { cast, update };
  }

  function makeSpellEffects(parent, capacity) {
    const white = new T.Color(0xffffff);
    const tints = new Map(spellBook.map(spell => [spell.id, new T.Color(spell.color)]));
    const ember = new T.Color(0xffbc42), skyIce = new T.Color(0xeaf9ff);
    const sparkGeometry = new T.OctahedronGeometry(1, 0);
    const sparkMaterial = new T.MeshBasicMaterial({ toneMapped: false });
    const sparkOpacity = fadingMaterial(sparkGeometry, capacity * 48, sparkMaterial);
    const sparks = new T.InstancedMesh(sparkGeometry, sparkMaterial, capacity * 48);
    sparks.instanceMatrix.setUsage(T.DynamicDrawUsage);
    sparks.setColorAt(0, white);
    sparks.instanceColor.setUsage(T.DynamicDrawUsage);
    sparks.frustumCulled = false;
    sparks.count = 0;
    parent.add(sparks);

    const dummy = new T.Object3D();
    const axis = V(0, 1, 0), delta = new T.Vector3(), glint = new T.Color();
    const ringGeometry = new T.RingGeometry(0.90, 1, 64);
    const ringBand = new T.TorusGeometry(1, 0.065, 6, 64);
    const coreGeometry = new T.SphereGeometry(0.84, 24, 16);
    const coreMaterial = new T.MeshBasicMaterial({ color: 0x130924, toneMapped: false });
    const vortexGeometry = new T.CylinderGeometry(1.89, 0.35, 5.8, 40, 14, true);
    const vortexMaterial = new T.ShaderMaterial({
      transparent: true, depthWrite: false, side: T.DoubleSide, blending: T.AdditiveBlending,
      uniforms: { clock: { value: 0 }, opacity: { value: 0 } },
      vertexShader: `
        varying vec2 ribbon;
        void main() {
          ribbon = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float clock, opacity;
        varying vec2 ribbon;
        void main() {
          float braid = sin(6.2831853 * (ribbon.x * 3.0 - ribbon.y * 2.75 - clock * 2.3));
          float flicker = sin(ribbon.y * 49.0 + clock * 17.0) * sin(ribbon.x * 62.83 + clock * 7.2);
          float band = smoothstep(0.23, 0.94, braid + 0.25 * flicker);
          float tips = smoothstep(0.0, 0.09, ribbon.y) * (1.0 - smoothstep(0.70, 1.0, ribbon.y));
          vec3 color = mix(vec3(1.0, 0.12, 0.012), vec3(1.0, 0.73, 0.16), band);
          gl_FragColor = vec4(color, band * tips * opacity * 0.74);
          #include <colorspace_fragment>
        }
      `
    });
    let used = 0;

    function ornaments() {
      const group = new T.Group();
      group.name = 'Spell impact';
      parent.add(group);
      const rim = new T.MeshBasicMaterial({ color: 0xffffff, side: T.DoubleSide,
        transparent: true, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false });
      const rings = [new T.Mesh(ringGeometry, rim), new T.Mesh(ringGeometry, rim)];
      const bands = [new T.Mesh(ringBand, rim), new T.Mesh(ringBand, rim)];
      const core = new T.Mesh(coreGeometry, coreMaterial);
      const funnel = new T.Mesh(vortexGeometry, vortexMaterial.clone());
      funnel.position.y = 2.9;
      group.add(...rings, ...bands, core, funnel);
      return { group, center: group.position, rings, bands, core, funnel, rim };
    }

    function buildBolt(center, heading) {
      const nodes = [];
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const jitter = Math.sin(t * Math.PI) * 0.95;
        nodes.push(center.clone().add(V(
          Math.sin(i * 11.9 + center.x) * jitter + t * heading.x * 0.8,
          t * 12.0, Math.cos(i * 8.77 + center.z) * jitter + t * heading.z * 0.8)));
      }
      const segments = nodes.slice(1).map((point, i) => [nodes[i], point, 0.071]);
      for (const index of [3, 6, 8]) {
        const root = nodes[index];
        let from = root;
        for (let j = 1; j <= 4; j++) {
          const sign = index === 6 ? -1 : 1;
          const to = root.clone().add(V(j * sign * 0.47, -j * 0.50, Math.sin(j * 8 + index) * j * 0.24));
          segments.push([from, to, 0.042 * (1 - (j - 1) * 0.15)]);
          from = to;
        }
      }
      return segments;
    }

    function begin(slot, planted) {
      const visual = slot.visual ??= ornaments();
      const { group, center, rings, bands, core, funnel, rim } = visual;
      const { id } = slot.spell;
      const groundY = elevation(slot.point.x, slot.point.z);
      group.visible = true;
      group.scale.setScalar(1);
      center.copy(slot.point);
      if (planted) center.set(planted.x, planted.y, planted.z);
      if (id === 'void') center.y = Math.max(groundY + 1.18, slot.point.y + 0.22);
      if (id === 'frost' || id === 'tornado' || id === 'growth') center.y = elevation(center.x, center.z) + 0.035;
      if (id === 'wind') center.y = Math.max(groundY + 0.85, slot.point.y);
      rim.color.copy(tints.get(id));
      for (const ring of rings) {
        ring.visible = id !== 'void';
        ring.rotation.set(-Math.PI / 2, 0, 0);
        ring.position.set(0, 0.07, 0);
      }
      for (const band of bands) band.visible = id === 'void';
      if (id === 'wind') {
        const rotation = new T.Quaternion().setFromUnitVectors(V(0, 0, 1), slot.heading);
        for (const ring of rings) ring.quaternion.copy(rotation);
      }
      core.visible = id === 'void';
      funnel.visible = id === 'tornado';
      visual.bolt = id === 'lightning' ? buildBolt(center, slot.heading) : null;
      return center;
    }

    function put(x, y, z, width, length, color, opacity, tilt) {
      if (used >= sparks.instanceMatrix.count) return;
      dummy.position.set(x, y, z);
      dummy.scale.set(width, length, width);
      if (tilt && tilt.lengthSq() > 0) dummy.quaternion.setFromUnitVectors(axis, tilt);
      else dummy.rotation.set(0.39, x * 0.47, z * 0.32);
      dummy.updateMatrix();
      sparks.setColorAt(used, color);
      sparkOpacity.setX(used, opacity);
      sparks.setMatrixAt(used++, dummy.matrix);
    }

    function bolt(segments, t, color) {
      for (const [a, b, width] of segments) {
        const length = delta.copy(b).sub(a).length();
        delta.divideScalar(length);
        const flicker = t < 0.16 ? 1 : 0.78 + Math.sin(t * 83) * 0.22;
        put((a.x + b.x) * 0.5, (a.y + b.y) * 0.5, (a.z + b.z) * 0.5,
          width * flicker * (1 - t * 0.63), length * 0.535, color,
          1 - T.MathUtils.smoothstep(t, 0.25, 0.60), delta);
      }
    }

    function draw({ spell, visual, heading }, age) {
      const { center, rings, bands, rim, core, funnel } = visual;
      const { id, duration } = spell;
      const t = clamp(age / duration, 0, 1);
      const live = 1 - t;
      const glow = tints.get(id);
      const pulse = Math.min(1, age * 16) * Math.min(1, live * 5);
      const particleFade = Math.min(1, age * 12) * (1 - T.MathUtils.smoothstep(t, 0.12, 1));
      const count = compact ? 22 : 38;
      rim.opacity = (0.42 + 0.23 * Math.sin(age * 8)) * live;

      if (id === 'void') {
        core.scale.setScalar(0.30 + pulse * 0.72);
        for (let i = 0; i < bands.length; i++) {
          bands[i].scale.setScalar((1.12 + i * 0.43) * (0.6 + pulse * 0.48));
          bands[i].rotation.set(1.22 + i * 0.49, age * 0.94 + i * 1.82, age * 1.1);
        }
      } else if (id === 'tornado') {
        funnel.material.uniforms.clock.value = age;
        funnel.material.uniforms.opacity.value = pulse;
        funnel.scale.set(0.7 + pulse * 0.36, 0.85 + pulse * 0.15, 0.7 + pulse * 0.36);
      } else if (id === 'lightning' && age < 0.53) {

  // The charge, crack, bass impact, and low rumble are synthesized at runtime.
  function makeFireAudio() {
    let context, master, noise;
    const voices = {
      void: [124, 32, 'sine', 540, 110, 0.90],
      tornado: [185, 58, 'triangle', 1460, 360, 1.18],
      frost: [910, 1250, 'sine', 3850, 930, 0.49],
      lightning: [147, 38, 'triangle', 5700, 340, 0.58],
      wind: [320, 118, 'sine', 2710, 170, 0.65],
      growth: [390, 725, 'sine', 1230, 2410, 0.85]

    function unlock() {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      try {
        if (!context) {
          context = new Audio();
          const limiter = context.createDynamicsCompressor();
          master = context.createGain();
          master.gain.value = 0.63;
          master.connect(limiter);
          limiter.connect(context.destination);
          noise = context.createBuffer(1, Math.ceil(context.sampleRate * 1.6), context.sampleRate);
          const data = noise.getChannelData(0);
          let seed = 72199;
          for (let i = 0; i < data.length; i++) {
            seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
            data[i] = seed / 2147483648 - 1;
          }
        }
        return context.state !== 'running' ? context.resume() : undefined;
      } catch {
        // A device without an available audio output can still play the spell.
      }
    }
    function envelope(output, start, attack, length, volume) {
      const amp = context.createGain();
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), start + attack);
      amp.gain.exponentialRampToValueAtTime(0.0001, start + length);
      amp.connect(output);
      return amp;
    }
    function tone(output, time, from, to, volume, length, type = 'sine', attack = 0.012) {
      const oscillator = context.createOscillator();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(from, time);
      oscillator.frequency.exponentialRampToValueAtTime(to, time + length * 0.84);
      oscillator.connect(envelope(output, time, attack, length, volume));
      oscillator.start(time);
      oscillator.stop(time + length + 0.015);

    function burst(output, time, type, from, to, q, volume, length, attack) {
      const source = context.createBufferSource();
      source.buffer = noise;
      const filter = context.createBiquadFilter();
      filter.type = type;
      filter.Q.value = q;
      filter.frequency.setValueAtTime(from, time);
      filter.frequency.exponentialRampToValueAtTime(to, time + length * 0.87);
      source.connect(filter);
      filter.connect(envelope(output, time, attack, length, volume));
      source.start(time);
      source.stop(time + length + 0.015);
    }

      const pending = unlock();
      function play() {
        if (context?.state !== 'running' || performance.now() - triggeredAt > 160) return;
        const time = context.currentTime;

        tone(master, time + 0.072, 203, 622, 0.024 * force, 0.43, 'sine', 0.14);
      }

      if (context?.state !== 'running') return;

      if (context.createStereoPanner) {

        setTimeout(() => panner.disconnect(), 1550);

      tone(output, time, 93, 29, 0.68 * force, 0.65);
      burst(output, time, 'highpass', 2240, 890, 0.52, 0.51 * force, 0.17, 0.006);
      burst(output, time, 'lowpass', 990, 128, 1.05, 0.83 * force, 1.22, 0.031);
      burst(output, time + 0.044, 'bandpass', 1870, 310, 0.78, 0.37 * force, 0.71, 0.035);
    }
    function magic(id, force) {
      if (context?.state !== 'running') return;
      const [from, to, type, noiseFrom, noiseTo, length] = voices[id];
      const time = context.currentTime;
      tone(master, time, from, to, 0.21 * force, length, type);
      burst(master, time, 'bandpass', noiseFrom, noiseTo, 0.69,
        (id === 'lightning' ? 0.65 : 0.32) * force, length, id === 'lightning' ? 0.006 : 0.045);
      if (id === 'growth' || id === 'frost') {

      }

  const demolition = (function buildDestruction(T, scene, buildings, boxGeometry, wedge, elevation, compact) {

  function createBatch(geometry, count, bounds) {

  function splitBuilding(root, site, type) {

    structures.set(site, structure);
    root.updateWorldMatrix(true, true);
    const keepRotor = root === mill && rotor.parent === mill;
    if (keepRotor) rotor.removeFromParent();

  function wallPanels(structure, transform, color, w, d) {
