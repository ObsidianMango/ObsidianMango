<html lang="en">

<style>
:root{color-scheme:dark;--fg:#edfaff;--muted:#93a6b8;--accent:#85e9ef;--line:#ffffff16;--glass:rgba(9,19,32,.83)}
*{box-sizing:border-box}body{margin:0;background:#050c17;color:var(--fg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input,select{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:1px solid var(--line);background:#ffffff06;border-radius:12px;min-height:44px;padding:10px 14px}button:hover{background:#ffffff12}button[aria-pressed=true],button.active{background:#85e9ef1d;border-color:#85e9ef70;color:#affaff}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}#field{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}header{position:fixed;top:calc(22px + env(safe-area-inset-top));left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;z-index:2}.brand{display:flex;align-items:center;gap:12px}.mark{font-size:32px;color:var(--accent);line-height:1}.name{font-size:16px;font-weight:650;letter-spacing:.2em}.version{font-size:9px;color:var(--accent);letter-spacing:.15em;margin-top:5px}.header-actions{display:flex;gap:8px;pointer-events:auto}.icon{width:44px;padding:10px;background:var(--glass);backdrop-filter:blur(16px)}.dock{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid #ffffff20;border-radius:19px;padding:7px;backdrop-filter:blur(22px);box-shadow:0 10px 45px #0005;z-index:2}.dock button{white-space:nowrap;border-color:transparent}.dock .icon{background:transparent}.divider{height:24px;width:1px;background:var(--line);margin:0 3px}.hint{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.07em;color:#c2d9e0a8;pointer-events:none;transition:opacity .7s}.hint.gone{opacity:0}#panel{position:fixed;right:18px;top:calc(80px + env(safe-area-inset-top));bottom:calc(100px + env(safe-area-inset-bottom));width:330px;max-width:calc(100vw - 32px);background:rgba(8,17,30,.96);border:1px solid #ffffff20;border-radius:20px;z-index:4;overflow-y:auto;overscroll-behavior:contain;padding:20px;box-shadow:0 20px 80px #0008;scrollbar-width:thin}#panel[hidden]{display:none}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.panel-title h1{margin:0;font-size:17px;font-weight:600}.panel-title button{border:0;min-height:32px;padding:3px 8px;font-size:24px}h2{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin:23px 0 12px}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{flex:1;font-size:12px}.swatches{display:flex;gap:10px}.swatch{width:44px;height:44px;padding:5px;border-radius:50%;flex:none}.swatch span{display:block;width:100%;height:100%;border-radius:50%}.control{margin:19px 0}.control label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}.control output{color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:24px;accent-color:var(--accent);margin:0}select,input[type=text],input[type=search]{background:#121f30;border:1px solid #ffffff20;color:var(--fg);border-radius:10px;padding:12px;width:100%;min-height:44px}#emojiWrap{margin-top:12px}#emojiGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-height:200px;overflow:auto;margin-top:10px}#emojiGrid button{font-size:22px;padding:4px;min-width:0}#customEmoji{margin-top:8px}.small{font-size:11px;color:var(--muted);line-height:1.6}.footer-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:20px;padding-top:14px;gap:10px}.footer-row button{font-size:12px}#status{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}#toast{position:fixed;top:calc(88px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#122238ef;padding:10px 16px;border:1px solid var(--line);border-radius:10px;font-size:12px;z-index:6;pointer-events:none;white-space:nowrap}#toast[hidden]{display:none}.zen header,.zen .dock,.zen .hint{opacity:0;pointer-events:none}.zen .header-actions{pointer-events:none}#restore{display:none;position:fixed;right:18px;top:calc(20px + env(safe-area-inset-top));z-index:3;opacity:.5}.zen #restore{display:block}header,.dock{transition:opacity .3s}@media(max-width:520px){header{left:18px;right:18px;top:calc(18px + env(safe-area-inset-top))}.dock{bottom:calc(18px + env(safe-area-inset-bottom));gap:2px;padding:6px}.dock button{padding:10px 12px;font-size:12px}.dock .icon{padding:10px;width:42px}.name{font-size:14px}#panel{right:12px;max-width:calc(100vw - 24px);width:350px}.hint{font-size:11px}}@media(max-height:500px){header{top:12px}.dock{bottom:12px}#panel{top:64px;bottom:76px}.hint{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<canvas id="field" aria-label="Interactive diamond waves. Tap or drag to make ripples."></canvas>
<header><div class="brand"><span class="mark" aria-hidden="true">◇</span><div><div class="name">DIA II</div><div class="version">WAVE PLAYGROUND</div></div></div><div class="header-actions"><button class="icon" id="snapshot" aria-label="Save image" title="Save image"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg></button><button class="icon" id="settings" aria-label="Open controls" aria-expanded="false" aria-controls="panel" title="Controls"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="#102030"/><circle cx="16" cy="12" r="2" fill="#102030"/><circle cx="10" cy="18" r="2" fill="#102030"/></svg></button></div></header>
<div class="hint" id="hint">Touch & drag to make waves</div>
<nav class="dock" aria-label="Wave controls"><button id="pause" class="icon" aria-label="Pause animation" title="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><span class="divider"></span><button id="nextPreset">Ocean</button><button id="shuffle" title="Randomize appearance">Shuffle</button><span class="divider"></span><button id="zen" class="icon" aria-label="Hide controls" title="Hide controls"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button></nav>
<button id="restore" class="icon" aria-label="Show controls"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></svg></button>
<aside id="panel" aria-label="Appearance and motion controls" hidden>
<div class="panel-title"><h1>Make it yours</h1><button id="close" aria-label="Close controls">×</button></div>
<h2>Scene</h2><div class="row" id="presets"></div>
<h2>Palette</h2><div class="swatches" id="palettes"></div>
<h2>Particles</h2><div class="row" id="shapes"></div>
<div id="emojiWrap" hidden><label class="small" for="emojiSearch">Find an emoji or paste your own</label><input id="emojiSearch" type="search" placeholder="Search: faces, animals, food…" autocomplete="off"><div id="emojiGrid"></div><input id="customEmoji" type="text" placeholder="Paste an emoji, then press Enter" aria-label="Custom emoji" maxlength="32"></div>
<div class="control"><label for="speed">Speed <output id="speedValue"></output></label><input id="speed" type="range" min="0.1" max="2" step="0.05"></div>
<div class="control"><label for="amplitude">Wave height <output id="amplitudeValue"></output></label><input id="amplitude" type="range" min="0" max="1.8" step="0.05"></div>
<div class="control"><label for="frequency">Wave spacing <output id="frequencyValue"></output></label><input id="frequency" type="range" min="0.45" max="2" step="0.05"></div>
<div class="control"><label for="size">Particle size <output id="sizeValue"></output></label><input id="size" type="range" min="0.4" max="1.5" step="0.05"></div>
<div class="control"><label for="density">Density <output id="densityValue"></output></label><input id="density" type="range" min="0.4" max="1.5" step="0.05"></div>
<div class="control"><label for="ripple">Touch strength <output id="rippleValue"></output></label><input id="ripple" type="range" min="0.3" max="2" step="0.05"></div>
<h2>Performance</h2><select id="quality" aria-label="Rendering quality"><option value="auto">Auto</option><option value="low">Battery saver</option><option value="high">High detail</option></select>
<div class="footer-row"><span id="status"></span><button id="reset">Reset</button></div>
<p class="small">Space: pause · H: hide controls · R: shuffle</p>
</aside><div id="toast" role="status" hidden></div>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), canvas=$('field'),ctx=canvas.getContext('2d',{alpha:false});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const defaults={preset:0,palette:0,shape:'diamond',emoji:'💎',speed:.65,amplitude:.85,frequency:1,size:.9,density:1,ripple:1,quality:'auto'};
const palettes=[{name:'Glacier',colors:['#31739d','#46bac9','#8ff4df','#dafaff'],bg:['#0c2935','#050a17'],swatch:'linear-gradient(135deg,#346bbb,#90ffe0)'},{name:'Aurora',colors:['#594fb7','#9879f0','#e080d6','#c1ffdd'],bg:['#25213d','#08091a'],swatch:'linear-gradient(135deg,#6964e1,#e599d9)'},{name:'Ember',colors:['#a13d5c','#ec735c','#ffc67e','#ffe9b0'],bg:['#371c29','#110b18'],swatch:'linear-gradient(135deg,#b63568,#ffd48b)'},{name:'Acid',colors:['#337e66','#80c850','#d6ed76','#f4ffc9'],bg:['#1b3122','#080f14'],swatch:'linear-gradient(135deg,#2ea88b,#dfef64)'},{name:'Pearl',colors:['#617c9b','#aabbd2','#e0d1c5','#ffffff'],bg:['#1c283b','#090d18'],swatch:'linear-gradient(135deg,#768ca7,#fff0df)'}];
const scenes=[{name:'Ocean',speed:.65,amplitude:.85,frequency:1,palette:0},{name:'Vortex',speed:.55,amplitude:1.15,frequency:.85,palette:1},{name:'Pulse',speed:.75,amplitude:1.1,frequency:1.25,palette:2},{name:'Silk',speed:.4,amplitude:.9,frequency:.75,palette:3}];
let cfg={...defaults};try{const saved=JSON.parse(localStorage.getItem('dia-v2'));if(saved&&typeof saved==='object'){for(const k of ['preset','palette'])if(Number.isInteger(saved[k]))cfg[k]=Math.max(0,Math.min(k==='preset'?3:4,saved[k]));for(const k of ['speed','amplitude','frequency','size','density','ripple']){const el=$(k),v=saved[k];if(Number.isFinite(v))cfg[k]=Math.max(+el.min,Math.min(+el.max,v));}if(['diamond','orb','star','emoji'].includes(saved.shape))cfg.shape=saved.shape;if(typeof saved.emoji==='string'&&saved.emoji.length<=32&&saved.emoji.trim())cfg.emoji=saved.emoji;if(['auto','low','high'].includes(saved.quality))cfg.quality=saved.quality;}}catch{}
let W=0,H=0,dpr=1,step=28,points=new Float32Array(0),background,atlas=[],time=0,clock=0,paused=reduce,raf=0,last=0,frameCount=0,fpsTime=0,fps=60,autoScale=1,slowFrames=0,elapsed=0,saveTimer,toastTimer;
const ripples=[],pointers=new Map();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem('dia-v2',JSON.stringify(cfg));}catch{}},250);}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,1800);}
function polygon(c,pts,color){c.fillStyle=color;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();}
function mix(a,b,t){const c=s=>[1,3,5].map(n=>parseInt(s.slice(n,n+2),16));const aa=c(a),bb=c(b);return '#'+aa.map((n,i)=>Math.round(n+(bb[i]-n)*t).toString(16).padStart(2,'0')).join('');}
function makeAtlas(){atlas=[];const colors=palettes[cfg.palette].colors;for(let n=0;n<16;n++){const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');const f=n/15*3,i=Math.min(2,Math.floor(f)),color=mix(colors[i],colors[i+1],f-i);g.translate(48,48);if(cfg.shape==='emoji'){g.font='64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(cfg.emoji,0,3);atlas.push(c);break;}
const glow=g.createRadialGradient(0,0,4,0,0,46);glow.addColorStop(0,color+'44');glow.addColorStop(1,color+'00');g.fillStyle=glow;g.fillRect(-48,-48,96,96);
if(cfg.shape==='diamond'){polygon(g,[[-29,-12],[-15,-29],[15,-29],[29,-12],[0,32]],color);polygon(g,[[-29,-12],[0,-8],[-15,-29]],mix(color,'#ffffff',.4));polygon(g,[[-15,-29],[15,-29],[0,-8]],mix(color,'#ffffff',.75));polygon(g,[[15,-29],[29,-12],[0,-8]],mix(color,'#ffffff',.2));polygon(g,[[-29,-12],[0,-8],[0,32]],mix(color,'#000b22',.25));polygon(g,[[0,-8],[29,-12],[0,32]],mix(color,'#ffffff',.18));g.strokeStyle='#ffffff88';g.lineWidth=.8;g.beginPath();g.moveTo(-29,-12);g.lineTo(29,-12);g.stroke();}
else if(cfg.shape==='orb'){const grad=g.createRadialGradient(-9,-12,1,0,0,28);grad.addColorStop(0,'#ffffff');grad.addColorStop(.25,mix(color,'#ffffff',.35));grad.addColorStop(.7,color);grad.addColorStop(1,mix(color,'#030b20',.65));g.fillStyle=grad;g.beginPath();g.arc(0,0,28,0,Math.PI*2);g.fill();}
else {const pts=[];for(let j=0;j<8;j++){const a=j*Math.PI/4-Math.PI/2,r=j%2?8:33;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}polygon(g,pts,color);polygon(g,[[0,-33],[0,33],[-8,0]],mix(color,'#ffffff',.65));}atlas.push(c);}}
function rebuild(){const budget=(cfg.quality==='low'?1000:cfg.quality==='high'?3800:2400)*autoScale;step=Math.max(25/Math.sqrt(cfg.density),Math.sqrt(W*H/budget));const cols=Math.ceil(W/step)+4,rows=Math.ceil(H/step)+4;points=new Float32Array(cols*rows*5);let i=0;for(let y=-2;y<rows-2;y++)for(let x=-2;x<cols-2;x++){const px=(x+.5+(y%2)*.5)*step,py=(y+.5)*step;points[i++]=px;points[i++]=py;points[i++]=Math.hypot(px-W/2,py-H/2);points[i++]=Math.atan2(py-H/2,px-W/2);points[i++]=Math.sin(x*127.1+y*311.7)*.5+.5;}}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,cfg.quality==='low'?1:1.75);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const pal=palettes[cfg.palette];background=ctx.createRadialGradient(W*.47,H*.4,0,W*.5,H*.5,Math.max(W,H)*.8);background.addColorStop(0,pal.bg[0]);background.addColorStop(1,pal.bg[1]);rebuild();draw();}
function draw(){ctx.globalAlpha=1;ctx.fillStyle=background;ctx.fillRect(0,0,W,H);const wave=.009/cfg.frequency,amp=cfg.amplitude,t=time,large=Math.max(W,H),strength=cfg.ripple;for(let i=0;i<points.length;i+=5){const x=points[i],y=points[i+1],r=points[i+2],a=points[i+3];let z,dx=0,dy=0;
switch(cfg.preset){case 1:z=Math.sin(r*wave*1.5-a*3-t*1.8)*.6+Math.cos(a*5+r*.006+t)*.25;dx=Math.sin(a+t*.16)*z*9*amp;dy=Math.cos(a+t*.16)*z*9*amp;break;case 2:z=Math.sin(r*wave*2.5-t*2)*.7+Math.sin(x*wave-y*wave+t)*.2;break;case 3:z=Math.sin(y*wave*1.3+Math.sin(x*wave*.5+t*.35)*3-t)*.65+Math.cos(x*wave*.6+t*.7)*.3;dx=Math.cos(y*wave+t*.6)*9*amp;break;default:z=Math.sin(x*wave+t)*Math.cos(y*wave*.6-t*.4)*.58+Math.sin((x+y)*wave*.72-t*1.3)*.32+Math.cos(y*wave-t*.8)*.18;}
let impact=0;for(let j=0;j<ripples.length;j++){const p=ripples[j],rx=x-p.x,ry=y-p.y,dist=Math.sqrt(rx*rx+ry*ry),front=dist-p.age*250;if(Math.abs(front)>115)continue;const env=Math.exp(-front*front/5200)*p.life;impact+=Math.cos(front*.037)*env*p.power;}
z=z*amp+impact*strength;const level=clamp(.48+z*.43,0,1),sz=step*cfg.size*(.34+level*.76),idx=cfg.shape==='emoji'?0:Math.min(15,(level*15)|0);dx+=Math.sin(y*.013+t)*amp*3;dy+=z*step*.24;const edge=1-.3*Math.min(1,r/(large*.65));ctx.globalAlpha=clamp((.24+level*.76)*edge+Math.abs(impact)*.2,.16,1);ctx.drawImage(atlas[idx],x+dx-sz/2,y+dy-sz/2,sz,sz);}
ctx.globalAlpha=1;
}
function frame(now){raf=0;if(document.hidden||paused)return;const dt=last?Math.min((now-last)/1000,.05):1/60;last=now;time+=dt*cfg.speed*1.7;clock+=dt;for(let i=ripples.length-1;i>=0;i--){const p=ripples[i];p.age+=dt;p.life=Math.exp(-p.age*.65);if(p.age>4.5)ripples.splice(i,1);}draw();frameCount++;elapsed+=dt;if(!fpsTime)fpsTime=now;if(now-fpsTime>1200){fps=Math.round(frameCount*1000/(now-fpsTime));$('status').textContent=`${fps} fps · ${points.length/5} particles`;if(cfg.quality==='auto'&&elapsed>3){slowFrames=fps<42?slowFrames+1:0;if(slowFrames>=2&&autoScale>.42){autoScale*=.78;rebuild();slowFrames=0;}}frameCount=0;fpsTime=now;}raf=requestAnimationFrame(frame);}
function start(){if(!raf&&!paused&&!document.hidden){last=0;fpsTime=0;frameCount=0;raf=requestAnimationFrame(frame);}}
function pauseUI(){const btn=$('pause');btn.setAttribute('aria-label',paused?'Resume animation':'Pause animation');btn.title=paused?'Resume':'Pause';btn.innerHTML=paused?'<svg viewBox="0 0 24 24"><path d="M8 4l12 8-12 8z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>';}
function togglePause(){paused=!paused;pauseUI();if(paused){cancelAnimationFrame(raf);raf=0;}else start();}
function addRipple(x,y,power=1){if(ripples.length>=12)ripples.shift();ripples.push({x,y,power,age:0,life:1});if(paused){ripples[ripples.length-1].age=.16;draw();} $('hint').classList.add('gone');}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,at:performance.now()});addRipple(e.clientX,e.clientY,1.3);if(!$('panel').hidden)setPanel(false);});
canvas.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;const now=performance.now();if(now-p.at>45&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>16){addRipple(e.clientX,e.clientY,.85);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,at:now});}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));
function setPanel(open){$('panel').hidden=!open;$('settings').setAttribute('aria-expanded',String(open));if(open)$('close').focus();else $('settings').focus({preventScroll:true});}
$('settings').onclick=()=>setPanel($('panel').hidden);$('close').onclick=()=>setPanel(false);$('pause').onclick=togglePause;
function zen(on){document.body.classList.toggle('zen',on);if(on){$('panel').hidden=true;$('settings').setAttribute('aria-expanded','false');$('restore').focus();}else $('zen').focus();}
$('zen').onclick=()=>zen(true);$('restore').onclick=()=>zen(false);
function sync(){for(const k of ['speed','amplitude','frequency','size','density','ripple']){$(k).value=cfg[k];$(k+'Value').textContent=cfg[k].toFixed(2)+'×';}$('quality').value=cfg.quality;$('nextPreset').textContent=scenes[cfg.preset].name;$('emojiWrap').hidden=cfg.shape!=='emoji';document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.preset===cfg.preset)));document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.palette===cfg.palette)));document.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shape===cfg.shape)));document.querySelectorAll('[data-emoji]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.emoji===cfg.emoji)));$('status').textContent=`${points.length/5} particles`;}
function refresh(){makeAtlas();resize();sync();save();}
function selectPreset(i){cfg={...cfg,...scenes[i],preset:i};delete cfg.name;ripples.length=0;refresh();}
scenes.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.preset=i;b.onclick=()=>selectPreset(i);$('presets').append(b);});
