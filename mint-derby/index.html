<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172b25">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mint Monster · Destruction Derby</title>
<style>
:root{
  color-scheme:dark;
  --paper:#f5f4e9;
  --muted:#b7c8c2;
  --gold:#f2c46d;
  --panel:#122b2de8;
  --line:#ffffff26;
  --mint:#9da88a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#11191a;
  color:var(--paper);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  min-height:44px;
  font-weight:700;
}
button:active{filter:brightness(1.18);transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view.dragging{cursor:grabbing}
#vignette{
  position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(#0d211b4d,transparent 27%,transparent 68%,#0717147d);
}
.top{
  z-index:3;
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  left:max(18px,env(safe-area-inset-left));
  right:max(18px,env(safe-area-inset-right));
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  pointer-events:none;
}
.brand{
  font-size:12px;
  letter-spacing:.18em;
  font-weight:850;
  text-shadow:0 2px 8px #000;
}
.brand small{
  display:block;
  margin-top:6px;
  font-size:8px;
  letter-spacing:.12em;
  color:#d1e1d8;
  font-weight:550;
}
.stats{
  display:flex;
  gap:9px;
  align-items:center;
  pointer-events:auto;
}
.stat{
  min-width:70px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#122b2dd9;
  backdrop-filter:blur(10px);
  text-align:center;
}
.stat b{display:block;font-size:16px;font-weight:750}
.stat small{display:block;margin-top:2px;font-size:7px;letter-spacing:.11em;color:var(--muted)}
#restart{
  padding:0 12px;
  min-height:48px;
  background:#122b2dd9;
  backdrop-filter:blur(10px);
}
#hud{
  position:fixed;
  z-index:3;
  top:90px;
  left:max(18px,env(safe-area-inset-left));
  pointer-events:none;
  width:220px;
  text-shadow:0 2px 8px #0007;
}
.speed b{
  font-size:42px;
  line-height:.9;
  font-weight:350;
  letter-spacing:-.06em;
}
.speed span{
  margin-left:7px;
  font-size:9px;
  letter-spacing:.12em;
}
.speed small{
  display:block;
  margin-top:7px;
  color:#e6ecdf;
  font-size:9px;
  letter-spacing:.06em;
}
.health-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.health{
  width:106px;
  height:6px;
  border-radius:999px;
  overflow:hidden;
  background:#0c211d9e;
  border:1px solid #ffffff1c;
}
.health i{display:block;width:100%;height:100%;background:#bee794}
#condition{font-size:9px;color:#e2e8de}
#notice{
  position:fixed;
  z-index:3;
  top:33%;
  left:50%;
  transform:translateX(-50%);
  max-width:min(78vw,480px);
  padding:10px 15px;
  border-radius:12px;
  background:#122b2dd9;
  backdrop-filter:blur(10px);
  text-align:center;
  font-size:12px;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s;
}
#notice.show{opacity:1}
#cameraTools{
  position:fixed;
  z-index:3;
  top:90px;
  right:max(18px,env(safe-area-inset-right));
  display:flex;
  gap:4px;
  padding:4px;
  background:#122b2dcf;
  border:1px solid var(--line);
  border-radius:14px;
  backdrop-filter:blur(10px);
}
#cameraTools button{
  min-height:42px;
  padding:6px 9px;
  border:0;
  background:transparent;
  border-radius:9px;
  font-size:9px;
  color:#c4d5ce;
}
#cameraTools button.active{background:#dcebdd;color:#16352f}
#touch{
  position:fixed;
  z-index:4;
  bottom:max(18px,env(safe-area-inset-bottom));
  left:max(16px,env(safe-area-inset-left));
  right:max(16px,env(safe-area-inset-right));
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  pointer-events:none;
}
.steering-dock{display:flex;flex-direction:column;align-items:center;pointer-events:none}
#steeringWheel{
  width:174px;
  height:174px;
  touch-action:none;
  pointer-events:auto;
  cursor:grab;
  outline-offset:-5px;
  border-radius:50%;
  filter:drop-shadow(0 5px 9px #071a1690);
}
#wheelArt{display:block;width:100%;height:100%;will-change:transform;pointer-events:none}
.wheel-hint{margin-top:-4px;font-size:8px;letter-spacing:.14em;color:#e0ecdf99}
.drive-dock{
  width:192px;
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:none;
}
#transmission{
  display:flex;
  gap:4px;
  width:148px;
  align-self:flex-end;
  padding:4px;
  background:#132d30eb;
  border:1px solid var(--line);
  border-radius:14px;
  pointer-events:auto;
}
#transmission button{
  width:50%;
  min-height:44px;
  border:0;
  border-radius:9px;
  background:transparent;
  box-shadow:none;
  font-size:18px;
  color:#c0d3cc;
}
#transmission button small{display:block;font-size:7px;font-weight:550}
#transmission button.active{background:var(--gold);color:#15312b}
.pedal-row{
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  gap:11px;
}
.brake-stack{display:flex;flex-direction:column;gap:8px;width:92px}
#touch button{pointer-events:auto;backdrop-filter:blur(8px);box-shadow:0 4px 10px #071a1640}
#touch .handbrake{
  height:44px;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  background:#152d30db;
  font-size:9px;
}
#touch .pedal{
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:13px 7px 10px;
  font-size:10px;
  letter-spacing:.08em;
  border:1px solid #ffffff50;
}
#touch button[data-input="brake"]{
  width:92px;
  height:82px;
  background:linear-gradient(#d4dfdf,#a1b4b5);
  color:#173039;
  box-shadow:inset 0 -5px 0 #58767a,0 4px 10px #071a1640;
}
#touch button[data-input="gas"]{
  width:72px;
  height:134px;
  background:linear-gradient(#f6d084,#d8a944);
  color:#293222;
  box-shadow:inset 0 -5px 0 #8c6a29,0 4px 10px #071a1640;
}
.pedal-grip{
  display:block;
  width:70%;
  height:38%;
  background:repeating-linear-gradient(0deg,transparent 0 5px,currentColor 5px 7px);
  opacity:.3;
  border-radius:2px;
}
#touch button.pressed{
  filter:brightness(1.18);
  transform:translateY(3px);
}
#loading{
  position:fixed;
  z-index:10;
  inset:0;
  display:grid;
  place-items:center;
  background:#101b1d;
  color:#eef4eb;
  text-align:center;
  padding:25px;
}
#crashFlash{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  box-shadow:inset 0 0 110px #d43e18;
  opacity:0;
  transition:opacity .08s;
}
@media(max-width:650px){
  .top{left:13px;right:13px}
  .brand{font-size:10px}
  .brand small{font-size:7px}
  .stats{gap:5px}
  .stat{min-width:52px;padding:7px 6px}
  .stat b{font-size:13px}
  .stat small{font-size:6px}
  #restart{min-height:42px;padding:0 8px;font-size:10px}
  #hud{left:14px;top:82px}
  .speed b{font-size:34px}
  #cameraTools{right:13px;top:82px}
  #cameraTools button{padding:5px 7px}
  #touch{left:10px;right:13px;bottom:max(14px,env(safe-area-inset-bottom))}
  #steeringWheel{width:150px;height:150px}
  .drive-dock{width:176px}
  #transmission{width:136px}
  .brake-stack,#touch button[data-input="brake"]{width:82px}
  #touch button[data-input="brake"]{height:74px}
  #touch button[data-input="gas"]{width:67px;height:120px}
}
@media(max-width:370px){
  .stat:nth-child(2){display:none}
  #steeringWheel{width:136px;height:136px}
  .drive-dock{width:164px}
  #transmission{width:128px}
  .brake-stack,#touch button[data-input="brake"]{width:77px}
  #touch button[data-input="gas"]{width:64px}
}
@media(max-height:560px) and (min-width:651px){
  #touch{bottom:9px}
  #steeringWheel{width:142px;height:142px}
  .drive-dock{width:248px;flex-direction:row;align-items:flex-end;gap:8px}
  #transmission{width:54px;flex-direction:column;align-self:flex-end}
  #transmission button{width:100%;min-height:47px}
  #touch button[data-input="gas"]{height:112px}
  #touch button[data-input="brake"]{height:66px}
}
</style>
</head>
<body>
<canvas id="view" aria-label="3D destruction derby arena"></canvas>
<div id="vignette"></div>
<div id="crashFlash"></div>

<div class="top">
  <div class="brand">MINT MONSTER<small>FULL-SIZE DESTRUCTION DERBY</small></div>
  <div class="stats">
    <div class="stat"><b id="hpText">100</b><small>BODY</small></div>
    <div class="stat"><b id="wreckText">0 / 5</b><small>WRECKS</small></div>
    <button id="restart" type="button">Restart</button>
  </div>
</div>

<div id="hud">
  <div class="speed"><b id="speed">0</b><span>MPH</span><small id="gearText">D · DRIVE</small></div>
  <div class="health-row"><div class="health"><i id="healthBar"></i></div><span id="condition">100% intact</span></div>
</div>

<div id="cameraTools">
  <button type="button" data-camera="follow" class="active">FOLLOW</button>
  <button type="button" data-camera="rear">REAR</button>
  <button type="button" data-camera="top">TOP</button>
  <button type="button" id="resetCamera">RESET VIEW</button>
</div>

<div id="notice" role="status" aria-live="polite"></div>

<div id="touch">
  <div class="steering-dock">
    <div id="steeringWheel" role="slider" tabindex="0" aria-label="Steering wheel. Drag around the rim to steer." aria-valuemin="-135" aria-valuemax="135" aria-valuenow="0">
      <svg id="wheelArt" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="rim" x2="1" y2="1"><stop stop-color="#676e6a"/><stop offset=".5" stop-color="#202b28"/><stop offset="1" stop-color="#080f0d"/></linearGradient>
          <linearGradient id="spoke"><stop stop-color="#c0c7bd"/><stop offset="1" stop-color="#687870"/></linearGradient>
        </defs>
        <circle cx="100" cy="100" r="83" fill="#102c2438" stroke="#e7eed72b" stroke-width="25"/>
        <circle cx="100" cy="100" r="82" fill="none" stroke="url(#rim)" stroke-width="20"/>
        <circle cx="100" cy="100" r="72" fill="none" stroke="#f6eed740" stroke-width="2"/>
        <path d="M100 100 28 74 26 86 86 114 94 179 106 179 114 114 174 86 172 74Z" fill="url(#spoke)" stroke="#10261e" stroke-width="2"/>
        <circle cx="100" cy="100" r="27" fill="#263d32" stroke="#9da98d" stroke-width="3"/>
        <circle cx="100" cy="100" r="18" fill="none" stroke="#e7c16d" stroke-width="1"/>
        <path d="M91 107 100 88 109 107M94 102h12" fill="none" stroke="#e7c16d" stroke-width="2"/>
        <path d="M96 17h8v14h-8Z" fill="#f6c777"/>
      </svg>
    </div>
    <span class="wheel-hint">DRAG TO STEER</span>
  </div>

  <div class="drive-dock">
    <div id="transmission" role="group" aria-label="Transmission">
      <button type="button" data-gear="1" class="active" aria-pressed="true">D<small>Drive</small></button>
      <button type="button" data-gear="-1" aria-pressed="false">R<small>Reverse</small></button>
    </div>
    <div class="pedal-row">
      <div class="brake-stack">
        <button type="button" class="handbrake" data-input="handbrake">HANDBRAKE</button>
        <button type="button" class="pedal" data-input="brake"><i class="pedal-grip"></i><span>BRAKE</span></button>
      </div>
      <button type="button" class="pedal" data-input="gas"><i class="pedal-grip"></i><span>GAS</span></button>
    </div>
  </div>
</div>

<div id="loading">Expanding the arena and waking up the V8…</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";
import {buildDetailedVehicle} from "../parkside-chaos-wheel-physics/detailed-vehicles.js?v=photo-2";
import {buildRoadster} from "../parkside-chaos-wheel-physics/roadster-model.js";
import {VEHICLES} from "../parkside-chaos-wheel-physics/garage-models.js?v=photo-2";
import {buildMintMonster} from "./mint-monster-model.js?v=detail-1";

const canvas=document.getElementById("view");
const loading=document.getElementById("loading");
const hpText=document.getElementById("hpText");
const wreckText=document.getElementById("wreckText");
const speedText=document.getElementById("speed");
const gearText=document.getElementById("gearText");
const healthBar=document.getElementById("healthBar");
const condition=document.getElementById("condition");
const notice=document.getElementById("notice");
const crashFlash=document.getElementById("crashFlash");
const steeringWheel=document.getElementById("steeringWheel");
const wheelArt=document.getElementById("wheelArt");
const restartButton=document.getElementById("restart");

const ARENA_X=138;
const ARENA_Z=86;
const WALL_X=133;
const WALL_Z=81;
const ENEMY_COUNT=5;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x171a1d);
scene.fog=new THREE.Fog(0x171a1d,125,280);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,450);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

scene.add(new THREE.HemisphereLight(0xdde8ff,0x2a2622,1.55));
const sun=new THREE.DirectionalLight(0xfff2d9,2.55);
sun.position.set(60,85,35);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-170;
sun.shadow.camera.right=170;
sun.shadow.camera.top=170;
sun.shadow.camera.bottom=-170;
scene.add(sun);

function material(color,metal=.3,rough=.45){
  return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough});
}

const dirt=material(0x625f56,.03,.96);
const arena=new THREE.Mesh(new THREE.CircleGeometry(1,160),dirt);
arena.scale.set(ARENA_X,ARENA_Z,1);
arena.rotation.x=-Math.PI/2;
arena.receiveShadow=true;
scene.add(arena);

const centerDust=new THREE.Mesh(new THREE.CircleGeometry(1,144),material(0x777166,.02,.98));
centerDust.scale.set(ARENA_X*.76,ARENA_Z*.76,1);
centerDust.rotation.x=-Math.PI/2;
centerDust.position.y=.012;
centerDust.receiveShadow=true;
scene.add(centerDust);

// Painted oval lanes make the floor read like a real stadium derby bowl.
const paintLine=material(0xb69248,.03,.78);
[.27,.52,.75,.91].forEach(scale=>{
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.0012,6,192),paintLine);
  // TorusGeometry starts in the XY plane; scale X/Y before rotating it flat.
  // The previous X/Z scaling caused the warped strip through the middle.
  ring.scale.set(ARENA_X*scale,ARENA_Z*scale,1);
  ring.rotation.x=Math.PI/2;
  ring.position.y=.025;
  scene.add(ring);
});

// Stepped oval grandstands outside the crash wall.
const standMat=material(0x343b3e,.18,.84);
const standEdge=material(0x737b7e,.48,.52);
for(let tier=0;tier<4;tier++){
  const inner=1.015+tier*.045;
  const outer=inner+.05;
  const deck=new THREE.Mesh(new THREE.RingGeometry(inner,outer,160),standMat);
  deck.scale.set(ARENA_X,ARENA_Z,1);
  deck.rotation.x=-Math.PI/2;
  deck.position.y=.28+tier*.72;
  deck.receiveShadow=true;
  scene.add(deck);

  const edge=new THREE.Mesh(new THREE.TorusGeometry(1,.012,6,192),standEdge);
  edge.scale.set(ARENA_X*outer,ARENA_Z*outer,1);
  edge.rotation.x=Math.PI/2;
  edge.position.y=.3+tier*.72;
  scene.add(edge);
}

const wallMat=material(0x5f6568,.34,.72);
const railMat=material(0xd2d5d5,.9,.19);
const wallSegments=88;
for(let i=0;i<wallSegments;i++){
  const a=i/wallSegments*Math.PI*2;
  const x=Math.sin(a)*WALL_X;
  const z=Math.cos(a)*WALL_Z;
  const tx=Math.cos(a)*WALL_X;
  const tz=-Math.sin(a)*WALL_Z;
  const yaw=Math.atan2(-tz,tx);

  const wall=new THREE.Mesh(new THREE.BoxGeometry(8.2,1.35,.98),wallMat);
  wall.position.set(x,.67,z);
  wall.rotation.y=yaw;
  wall.castShadow=true;
  wall.receiveShadow=true;
  scene.add(wall);

  const rail=new THREE.Mesh(new THREE.BoxGeometry(8.05,.17,.2),railMat);
  const inward=.6;
  const normal=new THREE.Vector3(x/(WALL_X*WALL_X),0,z/(WALL_Z*WALL_Z)).normalize();
  rail.position.set(x-normal.x*inward,1.5,z-normal.z*inward);
  rail.rotation.y=yaw;
  rail.castShadow=true;
  scene.add(rail);
}

const tireMat=material(0x111214,.02,.96);
const tireStacks=[];
function addTireStack(x,z,count){
  const g=new THREE.Group();
  for(let i=0;i<count;i++){
    const t=new THREE.Mesh(new THREE.TorusGeometry(.78,.28,8,20),tireMat);
    t.rotation.x=Math.PI/2;
    t.position.y=.34+i*.48;
    t.castShadow=true;
    g.add(t);
  }
  g.position.set(x,0,z);
  scene.add(g);
  tireStacks.push(g);
}
[
  [-24,-16],[27,18],[-41,35],[45,-31],[2,48],[-54,-42],
  [61,8],[-14,68],[35,61],[-67,20],[70,-55],[8,-71]
].forEach((p,i)=>addTireStack(p[0],p[1],2+(i%3)));

const chrome=material(0xe0e5e5,.96,.13);
const rubber=material(0x0f1011,.02,.9);
const whitewall=material(0xe8e4d8,.04,.66);
const darkMetal=material(0x454b4f,.75,.28);
const glass=new THREE.MeshPhysicalMaterial({color:0x31434a,transparent:true,opacity:.54,roughness:.15,metalness:.08});
const headlamp=new THREE.MeshStandardMaterial({color:0xf3efd1,emissive:0x423c18,emissiveIntensity:.9,roughness:.2});
const tailLamp=new THREE.MeshStandardMaterial({color:0x981a18,emissive:0x4c0705,emissiveIntensity:.7,roughness:.35});

function box(parent,size,pos,mat){
  const geo=new THREE.BoxGeometry(
    size[0],size[1],size[2],
    Math.max(1,Math.round(size[0]*3)),
    2,
    Math.max(1,Math.round(size[2]*3))
  );
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(pos[0],pos[1],pos[2]);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function cyl(parent,r,depth,pos,mat,rot){
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,depth,20),mat);
  mesh.position.set(pos[0],pos[1],pos[2]);
  mesh.rotation.set(rot[0],rot[1],rot[2]);
  mesh.castShadow=true;
  parent.add(mesh);
  return mesh;
}

function makeWheel(parent,x,z){
  const steerPivot=new THREE.Group();
  steerPivot.position.set(x,.58,z);
  parent.add(steerPivot);

  const rollPivot=new THREE.Group();
  steerPivot.add(rollPivot);

  cyl(rollPivot,.49,.28,[0,0,0],rubber,[0,0,Math.PI/2]);
  cyl(rollPivot,.37,.292,[0,0,0],whitewall,[0,0,Math.PI/2]);
  cyl(rollPivot,.25,.31,[0,0,0],chrome,[0,0,Math.PI/2]);

  return {steerPivot,rollPivot,front:z<0};
}

function buildSedan(color){
  const g=new THREE.Group();
  g.userData.damage=[];
  g.userData.parts=[];
  g.userData.wheels=[];
  g.userData.exhaustFlames=[];

  const paint=material(color,.58,.27);
  const paintDark=material(0x74806d,.48,.34);
  const trim=material(0xe5e8e6,.96,.12);
  const black=material(0x101315,.08,.82);
  const interior=material(0x342d28,.03,.72);
  const dashMat=material(0x242a2a,.22,.48);
  const lens=new THREE.MeshPhysicalMaterial({color:0xaed1d5,transparent:true,opacity:.34,roughness:.10,metalness:.12,depthWrite:false});

  function mesh(geo,mat,pos=[0,0,0],rot=[0,0,0]){
    const m=new THREE.Mesh(geo,mat);
    m.position.set(...pos);
    m.rotation.set(...rot);
    m.castShadow=true;
    m.receiveShadow=true;
    g.add(m);
    return m;
  }

  function loft(rings,mat){
    // rings: [z, halfWidth, bottomY, topY]
    const verts=[],indices=[];
    for(const [z,w,b,t] of rings){
      verts.push(-w,b,z, w,b,z, w,t,z, -w,t,z);
    }
    for(let j=0;j<rings.length-1;j++){
      for(let k=0;k<4;k++){
        const a=j*4+k,b=j*4+(k+1)%4,c=b+4,d=a+4;
        indices.push(a,b,c,a,c,d);
      }
    }
    indices.push(0,2,1,0,3,2);
    const e=(rings.length-1)*4;
    indices.push(e,e+1,e+2,e,e+2,e+3);
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return mesh(geo,mat);
  }

  function pane(points,mat=lens){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.Float32BufferAttribute(points.flat(),3));
    geo.setIndex([0,1,2,0,2,3]);
    geo.computeVertexNormals();
    const m=mesh(geo,mat);
    m.material.side=THREE.DoubleSide;
    return m;

  function tube(points,r,mat=trim,segments=12){
    const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
    return mesh(new THREE.TubeGeometry(curve,Math.max(segments,points.length*5),r,7,false),mat);

  function smallBox(size,pos,mat=trim,rot=[0,0,0]){

  // Long, low 1960s luxury-sedan proportions inspired by the supplied car.

  tube([[-.99,1.25,-.98],[-.73,1.76,-.68],[.73,1.76,-.68],[.99,1.25,-.98]],.025,trim,22);
  tube([[-.97,1.25,1.39],[-.70,1.70,1.14],[.70,1.70,1.14],[.97,1.25,1.39]],.024,trim,22);

  // Roof gutters and B-pillars.
  for(const side of [-1,1]){
    tube([[side*.74,1.79,-.70],[side*.71,1.82,.10],[side*.69,1.71,1.17]],.025,trim,16);

  // Front face: wide chrome bumper, egg-crate grille, quad lamps.
  const frontBumper=smallBox([2.18,.16,.22],[0,.57,-3.30],trim);
  g.userData.parts.push(frontBumper);
  smallBox([1.80,.56,.10],[0,.83,-3.23],darkMetal);
  for(let i=-8;i<=8;i++)smallBox([.026,.42,.07],[i*.102,.84,-3.30],trim);

  mesh(new THREE.SphereGeometry(.045,10,8),trim,[0,1.57,-2.45]);
  for(const x of [-1.00,1.00])smallBox([.08,.15,.07],[x,.81,-3.18],tailLamp);

  const rearBumper=smallBox([2.18,.17,.22],[0,.60,3.30],trim);

  for(const x of [-.77,.77]){

  tube([[-.86,1.04,3.12],[0,1.08,3.16],[.86,1.04,3.12]],.025,trim,12);

  for(const z of [-.30,.83]){
    smallBox([1.48,.18,.48],[0,.87,z],interior);

  }
  smallBox([1.62,.26,.34],[0,1.10,-.73],dashMat);
  const steering=mesh(new THREE.TorusGeometry(.20,.022,8,24),trim,[-.48,1.24,-.55],[Math.PI/2,0,0]);
  tube([[-.48,1.24,-.55],[-.48,1.05,-.66]],.018,darkMetal,6);

  // Wheels: whitewalls, deep chrome caps and front steering pivots.
  for(const x of [-1.08,1.08]){

  }

  // Dual exhaust with polished tips.
  for(const x of [-.72,.72]){
    tube([[x,.49,1.55],[x,.46,2.55],[x,.46,3.25]],.042,darkMetal,16);
    cyl(g,.075,.34,[x,.46,3.29],trim,[Math.PI/2,0,0]);

    const flameGroup=new THREE.Group();
    flameGroup.position.set(x,.46,3.48);
    flameGroup.visible=false;

    const outerMat=new THREE.MeshBasicMaterial({color:0xff7a1a,transparent:true,opacity:.88,depthWrite:false,blending:THREE.AdditiveBlending});
    const innerMat=new THREE.MeshBasicMaterial({color:0x75bfff,transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending});

    const outer=new THREE.Mesh(new THREE.ConeGeometry(.11,.80,10,1,true),outerMat);
    outer.rotation.x=Math.PI/2;

    const inner=new THREE.Mesh(new THREE.ConeGeometry(.055,.48,8,1,true),innerMat);
    inner.rotation.x=Math.PI/2;
    inner.position.z=.21;
    flameGroup.add(outer,inner);
    g.add(flameGroup);
    g.userData.exhaustFlames.push({group:flameGroup,outer,inner});

  // Small underbody details keep the rear from looking hollow.
  smallBox([1.36,.12,1.18],[0,.42,2.03],darkMetal);

}
function adaptParksideModel(built){
  const root=built.root;
  root.userData.damage=[];
  root.userData.parts=built.assemblies||[];
  root.userData.wheels=[];
  root.userData.parkside=true;

  for(const part of root.userData.parts){
    part.traverse(obj=>{
      if(obj.isMesh)root.userData.damage.push(obj);
    });
    if(part.name.startsWith("wheel-")){
      root.userData.wheels.push({
        steerPivot:part,
        rollPivot:part,
        front:part.name.includes("front")
      });
    }
  }
  return root;
}

function buildParksideVehicle(id){
  const config=VEHICLES.find(v=>v.id===id);
  if(!config)return buildSedan(0x777777);
  const built=id==="roadster"?buildRoadster(THREE):buildDetailedVehicle(THREE,config);
  const root=adaptParksideModel(built);
  root.scale.setScalar(1.06);
  return root;
}

  return {

}

function crumple(car,worldPoint,severity){
  const hit=car.mesh.worldToLocal(worldPoint.clone());
  const amount=Math.min(.58,.045*severity);

  for(const mesh of car.mesh.userData.damage){
    const pos=mesh.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const worldVertex=new THREE.Vector3(pos.getX(i),pos.getY(i),pos.getZ(i));
      mesh.localToWorld(worldVertex);
      const local=car.mesh.worldToLocal(worldVertex);
      const dist=local.distanceTo(hit);
      if(dist<2.05){
        const falloff=1-dist/2.05;
        const xBias=Math.sign(local.x-hit.x||1);
        const zBias=Math.sign(local.z-hit.z||1);
        pos.setXYZ(
          i,
          pos.getX(i)-xBias*amount*falloff*.42,
          pos.getY(i)-amount*falloff*.18,
          pos.getZ(i)-zBias*amount*falloff*.72
        );
      }
    }
    pos.needsUpdate=true;
    mesh.geometry.computeVertexNormals();
    const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
    for(const m of mats)if(m&&"roughness" in m)m.roughness=Math.min(.9,(m.roughness??.5)+.008*severity);
  }

  if(severity>4){
    const part=car.mesh.userData.parts[Math.floor(Math.random()*car.mesh.userData.parts.length)];
    if(part){
      part.rotation.x+=(Math.random()-.5)*.12*severity;
      part.rotation.z+=(Math.random()-.5)*.09*severity;
      part.position.y-=Math.random()*.025*severity;
    }
  }
}

function makeDebris(center,baseColor,count){
  for(let i=0;i<count;i++){
    const hot=i%4===0;
    const mat=new THREE.MeshStandardMaterial({
      color:hot?0xe06b28:(i%3===0?0x242628:baseColor),
      emissive:hot?0x481200:0,
      emissiveIntensity:hot?1.6:0,
      roughness:.68,
      metalness:hot?.1:.45
    });
    const bit=new THREE.Mesh(
      new THREE.BoxGeometry(.14+Math.random()*.5,.1+Math.random()*.3,.18+Math.random()*.75),
      mat
    );
    bit.position.copy(center);
    bit.position.x+=(Math.random()-.5)*2.2;
    bit.position.z+=(Math.random()-.5)*3;
    bit.castShadow=true;
    scene.add(bit);
    debris.push({
      mesh:bit,
      vel:new THREE.Vector3((Math.random()-.5)*15,5+Math.random()*12,(Math.random()-.5)*15),
      spin:new THREE.Vector3(Math.random()*5,Math.random()*5,Math.random()*5),

    });

}

function explode(car){
  if(!car.alive)return;
  car.alive=false;
  car.speed=0;

  const center=car.mesh.position.clone().add(new THREE.Vector3(0,1,0));
  const flash=new THREE.PointLight(0xff7d2c,58,26,2);
  flash.position.copy(center);
  scene.add(flash);
  setTimeout(()=>scene.remove(flash),230);

  const firstMat=car.mesh.userData.damage[0]?.material;
  const mat0=Array.isArray(firstMat)?firstMat[0]:firstMat;
  const baseColor=car.isPlayer?0x9da88a:(mat0?.color?.getHex?.()??0x777777);
  makeDebris(center,baseColor,38);

  car.mesh.rotation.z=(Math.random()>.5?1:-1)*(.33+Math.random()*.2);
  car.mesh.rotation.x=(Math.random()-.5)*.18;
  car.mesh.userData.damage.forEach(mesh=>{
    const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
    for(const m of mats){
      if(m?.color)m.color.multiplyScalar(.36);
      if(m&&"roughness" in m)m.roughness=.95;
    }
  });
  car.mesh.userData.parts.forEach(p=>{
    p.rotation.x+=(Math.random()-.5)*1.3;
    p.rotation.z+=(Math.random()-.5)*1.3;
    p.position.y+=Math.random()*.28;
  });

  if(car.isPlayer){
    flashNotice("TOTALLED — restart and get back in there.",3);
  }else{
    wrecks++;
    wreckText.textContent=wrecks+" / "+ENEMY_COUNT;
    flashNotice(wrecks===ENEMY_COUNT?"Arena cleared. Mint Monster wins.":"Opponent destroyed.",2);
  }
}

function damage(car,amount,hit){
  if(!car.alive)return;
  car.hp=Math.max(0,car.hp-amount);
  crumple(car,hit,Math.max(1,amount/3.2));
  if(car.isPlayer)hitFlash();
  if(car.hp<=0)explode(car);
}

function angleWrap(v){
  while(v>Math.PI)v-=Math.PI*2;
  while(v<-Math.PI)v+=Math.PI*2;
  return v;
}

let wheelDegrees=0;
let wheelHeld=false;
let wheelPointer=null;
let lastPointerAngle=0;

function pointerAngle(e){
  const r=steeringWheel.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  return Math.atan2(e.clientY-cy,e.clientX-cx);
}

steeringWheel.addEventListener("pointerdown",e=>{
  e.preventDefault();
  wheelHeld=true;
  wheelPointer=e.pointerId;
  lastPointerAngle=pointerAngle(e);
  steeringWheel.setPointerCapture(e.pointerId);
});

steeringWheel.addEventListener("pointermove",e=>{
  if(!wheelHeld||e.pointerId!==wheelPointer)return;
  e.preventDefault();
  const a=pointerAngle(e);
  const delta=angleWrap(a-lastPointerAngle);
  lastPointerAngle=a;
  wheelDegrees=THREE.MathUtils.clamp(wheelDegrees+THREE.MathUtils.radToDeg(delta),-135,135);
  wheelArt.style.transform="rotate("+wheelDegrees+"deg)";
  steeringWheel.setAttribute("aria-valuenow",String(Math.round(wheelDegrees)));
});

function releaseWheel(e){
  if(e&&wheelPointer!==null&&e.pointerId!==wheelPointer)return;
  wheelHeld=false;
  wheelPointer=null;
}
steeringWheel.addEventListener("pointerup",releaseWheel);
steeringWheel.addEventListener("pointercancel",releaseWheel);

steeringWheel.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){wheelDegrees=Math.max(-135,wheelDegrees-15);e.preventDefault()}
  if(e.key==="ArrowRight"){wheelDegrees=Math.min(135,wheelDegrees+15);e.preventDefault()}
  if(e.key==="Home"){wheelDegrees=0;e.preventDefault()}
  wheelArt.style.transform="rotate("+wheelDegrees+"deg)";
  steeringWheel.setAttribute("aria-valuenow",String(Math.round(wheelDegrees)));
});

document.querySelectorAll("[data-input]").forEach(button=>{

  const down=e=>{
    e.preventDefault();
    input[key]=true;
    button.classList.add("pressed");
    try{button.setPointerCapture(e.pointerId)}catch{}
  };
  const up=e=>{
    e.preventDefault();
    input[key]=false;
    button.classList.remove("pressed");
  };
  button.addEventListener("pointerdown",down);
  button.addEventListener("pointerup",up);
  button.addEventListener("pointercancel",up);
  button.addEventListener("pointerleave",e=>{
    if(e.buttons===0)up(e);
  });
});

  orbitPitch=.08;
  orbitDistance=1;
  cameraMode="follow";
  document.querySelectorAll("[data-camera]").forEach(b=>b.classList.toggle("active",b.dataset.camera==="follow"));
});

canvas.addEventListener("pointerdown",e=>{
  if(e.button!==0&&e.pointerType==="mouse")return;
  cameraDragging=true;
  cameraPointer=e.pointerId;
  cameraLastX=e.clientX;
  cameraLastY=e.clientY;
  canvas.classList.add("dragging");
  try{canvas.setPointerCapture(e.pointerId)}catch{}
});

canvas.addEventListener("pointermove",e=>{
  if(!cameraDragging||e.pointerId!==cameraPointer)return;
  const dx=e.clientX-cameraLastX;
  const dy=e.clientY-cameraLastY;
  cameraLastX=e.clientX;
  cameraLastY=e.clientY;
  orbitYaw+=dx*.0075;
  orbitPitch=THREE.MathUtils.clamp(orbitPitch+dy*.0045,-.22,.62);
});

function endCameraDrag(e){
  if(cameraPointer!==null&&e.pointerId!==cameraPointer)return;
  cameraDragging=false;
  cameraPointer=null;
  canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup",endCameraDrag);
canvas.addEventListener("pointercancel",endCameraDrag);

canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  orbitDistance=THREE.MathUtils.clamp(orbitDistance+Math.sign(e.deltaY)*.10,.72,1.65);
},{passive:false});

window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="w"||k==="arrowup")input.gas=true;
  if(k==="s"||k==="arrowdown")input.brake=true;
  if(k==="a"||k==="arrowleft")keyboard.left=true;
  if(k==="d"||k==="arrowright")keyboard.right=true;
  if(k===" ")input.handbrake=true;
  if(k==="r"&&!e.repeat){
    gear=-1;
    document.querySelector('[data-gear="-1"]').click();
  }
  if(k==="e"&&!e.repeat){
    gear=1;
    document.querySelector('[data-gear="1"]').click();
  }
  if(["w","a","s","d","r","e","arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
},{passive:false});

window.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="w"||k==="arrowup")input.gas=false;
  if(k==="s"||k==="arrowdown")input.brake=false;
  if(k==="a"||k==="arrowleft")keyboard.left=false;
  if(k==="d"||k==="arrowright")keyboard.right=false;
  if(k===" ")input.handbrake=false;
},{passive:false});

restartButton.addEventListener("click",()=>location.reload());

function playerSteer(){
  const keyboardSteer=(keyboard.left?1:0)-(keyboard.right?1:0);
  if(keyboardSteer!==0)return keyboardSteer;
  return THREE.MathUtils.clamp(-wheelDegrees/135,-1,1);
}

const forward=new THREE.Vector3();

function driveCar(car,dt,time){
  if(!car.alive)return;

  let throttle=0;
  let brake=0;
  let steer=0;
  let handbrake=false;

  if(car.isPlayer){
    throttle=input.gas?1:0;
    brake=input.brake?1:0;
    steer=playerSteer();
    handbrake=input.handbrake;
  }else{
    const ai=car.ai;
    const now=time*.001;

    if(now>=car.aiNextThink){
      car.aiNextThink=now+ai.think*(.8+Math.random()*.55);

      const playerPos=player.alive?player.mesh.position:new THREE.Vector3();
      const toPlayer=playerPos.clone().sub(car.mesh.position);
      const distance=toPlayer.length();

      // Lower-skilled drivers spend more time wandering through the arena instead of
      // perfectly homing in on the player. This makes them much easier to line up and hit.
      const chaseChance=ai.aggression+(distance<24?.14:0);
      if(Math.random()<chaseChance){
        const miss=(1-ai.accuracy);
        car.aiTarget.copy(playerPos);
        car.aiTarget.x+=(Math.random()-.5)*38*miss;
        car.aiTarget.z+=(Math.random()-.5)*26*miss;
      }else{
        const a=Math.random()*Math.PI*2;
        const radius=.18+Math.random()*.54;
        car.aiTarget.set(
          Math.sin(a)*WALL_X*radius,
          0,
          Math.cos(a)*WALL_Z*radius
        );
      }
    }

    const dx=car.aiTarget.x-car.mesh.position.x;
    const dz=car.aiTarget.z-car.mesh.position.z;
    const desired=Math.atan2(-dx,-dz);
    const diff=angleWrap(desired-car.heading);

    steer=THREE.MathUtils.clamp(diff*(.72+ai.skill*.72),-1,1);
    steer*=ai.turnRate;

    const distanceToTarget=Math.hypot(dx,dz);
    throttle=distanceToTarget>7?1:.30;

    // Rookies occasionally hesitate instead of constantly charging.
    if(Math.sin(time*.0017+car.aiOffset)>ai.skill+.54)throttle*=.25;
  }

  const driveDirection=car.isPlayer?gear:1;
  const acceleration=car.isPlayer?15.5:(8.0+car.ai.skill*5.0);
  const maxForward=car.isPlayer?31:car.ai.maxSpeed;
  const maxReverse=car.isPlayer?12:0;

  if(throttle){
    const targetSpeed=driveDirection===1?maxForward:-maxReverse;
    const delta=targetSpeed-car.speed;
    const step=acceleration*dt;
    car.speed+=THREE.MathUtils.clamp(delta,-step,step);
  }else{
    car.speed*=Math.pow(.985,dt*60);
  }

  if(brake){
    const brakeStep=28*dt;
    if(Math.abs(car.speed)<=brakeStep)car.speed=0;
    else car.speed-=Math.sign(car.speed)*brakeStep;
  }

  if(handbrake){
    car.speed*=Math.pow(.88,dt*60);
  }

  const steerGrip=Math.min(1,Math.abs(car.speed)/4.2);
  const reverseSign=car.speed>=0?1:-1;
  const turnRate=car.isPlayer?1.62:1.46;
  car.heading+=steer*turnRate*dt*steerGrip*reverseSign;

  // IMPORTANT: front of the modeled car is -Z. Moving in drive therefore uses -Z.
  forward.set(-Math.sin(car.heading),0,-Math.cos(car.heading));
  car.mesh.position.addScaledVector(forward,car.speed*dt);
  car.mesh.position.addScaledVector(car.knock,dt);
  car.knock.multiplyScalar(Math.pow(.10,dt));
  if(car.knock.lengthSq()<.0025)car.knock.set(0,0,0);
  car.mesh.rotation.y=car.heading;

  const spin=car.speed*dt/.49;
  car.mesh.userData.wheels.forEach(w=>{
    if(car.mesh.userData.parkside){
      w.rollPivot.rotation.x+=spin;
      // Parkside wheel assemblies are merged groups; keep them visually stable instead of
      // twisting the entire wheel geometry around two axes at once.
    }else{
      w.rollPivot.rotation.x+=spin;
      if(w.front){
        const target=steer*.42;
        w.steerPivot.rotation.y+=(target-w.steerPivot.rotation.y)*Math.min(1,dt*10);
      }
    }
  });

  if(car.isPlayer&&car.mesh.userData.exhaustFlames?.length){
    const firing=car.alive&&gear===1&&throttle>.50;
    const intensity=THREE.MathUtils.clamp((Math.abs(car.speed)-1.5)/18,0,1);
    car.mesh.userData.exhaustFlames.forEach((f,i)=>{
      f.group.visible=firing;
      if(!firing)return;
      const flicker=.82+Math.sin(time*.032+i*2.1)*.13+Math.sin(time*.071+i)*.07;
      const length=.58+intensity*1.05;
      f.outer.scale.set(flicker,1,Math.max(.48,length*flicker));
      if(f.mid)f.mid.scale.set(.94*flicker,.94,Math.max(.40,length*.82*flicker));
      f.inner.scale.set(.88*flicker,.88,Math.max(.36,length*.65*flicker));
      f.group.rotation.z=Math.sin(time*.023+i)*.035;
    });
  }

  // Elliptical stadium wall collision.
  const limitX=WALL_X-4.4;
  const limitZ=WALL_Z-4.4;
  const q=Math.sqrt(
    (car.mesh.position.x*car.mesh.position.x)/(limitX*limitX)+
    (car.mesh.position.z*car.mesh.position.z)/(limitZ*limitZ)
  );
  if(q>1){
    car.mesh.position.x/=q;
    car.mesh.position.z/=q;
    const n=new THREE.Vector3(
      car.mesh.position.x/(limitX*limitX),
      0,
      car.mesh.position.z/(limitZ*limitZ)
    ).normalize();
    const impact=Math.abs(car.speed)+car.knock.length();
    car.speed*=-.18;
    car.knock.addScaledVector(n,-Math.max(3.5,impact*.58));
    if(car.hitTimer<=0&&impact>5.5){
      damage(car,Math.min(19,impact*.5),car.mesh.position.clone().addScaledVector(n,1.8));
      car.hitTimer=.34;
    }
  }

  for(const stack of tireStacks){
    const dx=car.mesh.position.x-stack.position.x;
    const dz=car.mesh.position.z-stack.position.z;
    if(dx*dx+dz*dz<5.1){
      const n=new THREE.Vector3(dx,0,dz).normalize();
      car.mesh.position.addScaledVector(n,.14);
      car.speed*=.79;
    }
  }

  car.hitTimer=Math.max(0,car.hitTimer-dt);
}

function velocityOf(car){
  return new THREE.Vector3(
    -Math.sin(car.heading)*car.speed+car.knock.x,
    0,
    -Math.cos(car.heading)*car.speed+car.knock.z
  );
}

function carCollisions(){
  const CONTACT=4.72;
  for(let i=0;i<cars.length;i++){
    for(let j=i+1;j<cars.length;j++){
      const a=cars[i];
      const b=cars[j];
      if(!a.alive||!b.alive)continue;

      const delta=b.mesh.position.clone().sub(a.mesh.position);
      delta.y=0;
      const dist=delta.length();

      if(dist<CONTACT){
        const n=dist>.001?delta.multiplyScalar(1/dist):new THREE.Vector3(1,0,0);

        // Aggressive positional separation eliminates the "magnetic/sticky" overlap.
        const overlap=CONTACT-dist;
        const separate=(overlap*.5)+.10;
        a.mesh.position.addScaledVector(n,-separate);
        b.mesh.position.addScaledVector(n,separate);

        const va=velocityOf(a);
        const vb=velocityOf(b);
        const closing=va.clone().sub(vb).dot(n);

        // Even low-speed contact receives a small outward shove so cars peel apart.
        const bounce=Math.max(2.2,Math.max(0,closing)*.68);
        a.knock.addScaledVector(n,-bounce);
        b.knock.addScaledVector(n,bounce);

        // Scrub some drivetrain speed at impact instead of exchanging scalar speeds.
        // The impulse above supplies the visible bounce while headings remain controllable.
        a.speed*=closing>6?.58:.76;
        b.speed*=closing>6?.58:.76;

        // Small yaw kick on glancing hits keeps bumpers/fenders from interlocking.
        const aFront=new THREE.Vector3(-Math.sin(a.heading),0,-Math.cos(a.heading));
        const bFront=new THREE.Vector3(-Math.sin(b.heading),0,-Math.cos(b.heading));
        const aSide=THREE.MathUtils.clamp(aFront.x*n.z-aFront.z*n.x,-1,1);
        const bSide=THREE.MathUtils.clamp(bFront.x*n.z-bFront.z*n.x,-1,1);
        a.heading+=aSide*.13;
        b.heading-=bSide*.13;

        const rel=va.clone().sub(vb).length();
        if(rel>3.2&&a.hitTimer<=0&&b.hitTimer<=0){
          const hit=a.mesh.position.clone().lerp(b.mesh.position,.5);
          const momentumA=Math.abs(a.speed)+a.knock.length()*.35;
          const momentumB=Math.abs(b.speed)+b.knock.length()*.35;
          const damageA=Math.max(1.4,rel*(.30+.30*(momentumB/(momentumA+momentumB+.01))));
          const damageB=Math.max(1.4,rel*(.30+.30*(momentumA/(momentumA+momentumB+.01))));
          damage(a,damageA,hit);
          damage(b,damageB,hit);
          a.hitTimer=.34;
          b.hitTimer=.34;
        }
      }
    }
  }
}

function updateDebris(dt){
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.vel.y-=16*dt;
    d.mesh.position.addScaledVector(d.vel,dt);
    d.mesh.rotation.x+=d.spin.x*dt;
    d.mesh.rotation.y+=d.spin.y*dt;
    d.mesh.rotation.z+=d.spin.z*dt;

    if(d.mesh.position.y<.12){
      d.mesh.position.y=.12;
      d.vel.y*=-.22;
      d.vel.x*=.82;
      d.vel.z*=.82;
    }

    d.life-=dt;
    if(d.life<=0){
      scene.remove(d.mesh);
      debris.splice(i,1);
    }
  }
}

function updateHUD(){
  hpText.textContent=Math.ceil(player.hp);
  speedText.textContent=Math.round(Math.abs(player.speed)*2.237);
  healthBar.style.width=player.hp+"%";
  healthBar.style.background=player.hp>55?"#bee794":player.hp>25?"#f2c46d":"#d85b45";
  condition.textContent=Math.ceil(player.hp)+"% intact";
}

const camTarget=new THREE.Vector3();
const camDesired=new THREE.Vector3();

function updateCamera(dt){
  const baseFront=new THREE.Vector3(-Math.sin(player.heading),0,-Math.cos(player.heading));
  const right=new THREE.Vector3(-baseFront.z,0,baseFront.x);
  const orbitFront=baseFront.clone().applyAxisAngle(new THREE.Vector3(0,1,0),orbitYaw);

  camTarget.copy(player.mesh.position).add(new THREE.Vector3(0,1.1,0));

  if(cameraMode==="top"){
    const topHeight=58*orbitDistance;
    camDesired.copy(player.mesh.position).add(new THREE.Vector3(
      Math.sin(orbitYaw)*10*orbitDistance,
      topHeight,
      Math.cos(orbitYaw)*10*orbitDistance
    ));
    camera.position.lerp(camDesired,1-Math.pow(.001,dt));
    camera.lookAt(player.mesh.position);
    return;
  }

  const pitchHeight=(6.0+orbitPitch*11)*orbitDistance;
  const followDistance=(cameraMode==="rear"?8.5:12.5)*orbitDistance;
  const direction=cameraMode==="rear"?1:-1;

  camDesired.copy(player.mesh.position)
    .addScaledVector(orbitFront,followDistance*direction)
    .addScaledVector(right,cameraMode==="follow"?1.2:0)
    .add(new THREE.Vector3(0,pitchHeight,0));

  camera.position.lerp(camDesired,1-Math.pow(.0008,dt));

  const lookDistance=cameraMode==="rear"?-8:5.5;
  camera.lookAt(camTarget.clone().addScaledVector(orbitFront,lookDistance));
}

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize);

let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);
  last=now;

  if(!wheelHeld&&Math.abs(wheelDegrees)>.05){
    wheelDegrees*=Math.pow(.12,dt*2.1);
    if(Math.abs(wheelDegrees)<.15)wheelDegrees=0;
    wheelArt.style.transform="rotate("+wheelDegrees+"deg)";
    steeringWheel.setAttribute("aria-valuenow",String(Math.round(wheelDegrees)));
  }

  cars.forEach(car=>driveCar(car,dt,now));
  carCollisions();
  updateDebris(dt);
  updateHUD();
  updateCamera(dt);

  if(noticeTimer>0){
    noticeTimer-=dt;
    if(noticeTimer<=0)notice.classList.remove("show");
  }

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

loading.remove();
flashNotice("Mint Monster upgraded again: reshaped body, hardtop glass, chrome trim, whitewalls and hotter exhaust flames.",3.2);
requestAnimationFrame(frame);
</script>
</body>
